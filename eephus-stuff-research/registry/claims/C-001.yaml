claim_id: C-001
statement: >
  As of 2026-08-16, no fitted MiLB pitch-quality, Stuff+, or Command+ model
  exists anywhere in the eephus.io repository (production or research
  branches inspected by this program).
claim_type: DEFINITIONAL
status: PASS_WITH_FINDINGS
evidence: >
  Repository archaeology performed during Program 0: (1)
  milb-projections/README.md states directly "No arsenal/Stuff+/Command+
  model exists yet anywhere in Eephus (confirmed in
  reports/REPOSITORY_RECONNAISSANCE.md); building it is future,
  out-of-charter work." (2) The abandoned branch
  claude/milb-pitch-quality-research-e53bba reached only a Phase-1 data
  audit and architecture charter, not a fitted model. (3) No .pkl, .joblib,
  or equivalent serialized pitch-quality model artifact was found during
  this program's directory listing of eephus.io's root and known model
  directories. Status is PASS_WITH_FINDINGS rather than a bare PASS because
  this was a targeted, non-exhaustive search (see
  docs/REPOSITORY_INVENTORY.md's scan-scope caveats) -- a full recursive
  search of every file in every branch was not performed.
