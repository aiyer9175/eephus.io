decision_id: D-002
question: >
  What should happen to milb-pitch-quality-research/ -- the ~1 GB of cached
  MiLB game-feed data and analysis scripts left on disk in this worktree
  from an abandoned prior session on branch
  claude/milb-pitch-quality-research-e53bba (last commit 2026-07-20, an
  "Engineering Charter" through Phase 1C of a data audit)?
decision: >
  Leave it untouched. Document it in docs/REPOSITORY_INVENTORY.md and
  docs/repository_inventory.json. Do not move, delete, commit, or fold it
  into eephus-stuff-research/.
status: DECIDED
rationale: >
  The folder is genuinely orphaned relative to the branch currently checked
  out in this worktree, but its committed documentation (README,
  DECISION_LEDGER, PILOT_SCOPE, architecture reports) is safe in git history
  on origin/claude/milb-pitch-quality-research-e53bba -- nothing is at risk
  of being lost by leaving it alone. Folding it in now would mean adopting
  another session's unreviewed Phase-1 conclusions as this program's
  foundation without the operator having looked at them, which is exactly
  the kind of silent-default behavior Program 0 exists to prevent (see
  CLAUDE.md J2). Asked directly via AskUserQuestion; operator chose to leave
  it alone rather than fold it in or review it personally first.
alternatives_considered:
  - option: Fold it in as the starting point for eephus-stuff-research/
    why_not_chosen: >
      Would mean adopting unreviewed prior conclusions (and reusing a cache
      whose freshness/provenance hasn't been audited) as this program's
      foundation without the operator reviewing them first.
  - option: Operator reviews the e53bba branch personally before any decision
    why_not_chosen: Not selected; operator chose to proceed with leave-alone instead.
decided_by: operator (via AskUserQuestion, 2026-08-16)
created_at: "2026-08-16"
