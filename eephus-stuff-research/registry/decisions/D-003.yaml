decision_id: D-003
question: >
  Should Program 0's governance docs (docs/MATHEMATICAL_GOVERNANCE.md,
  docs/STATISTICAL_GOVERNANCE.md, etc.) treat
  milb-projections/PITCH_QUALITY_RESEARCH_CONTRACT.md and its sibling docs
  as authoritative and defer to them, rather than re-deriving equivalent
  generic content?
decision: >
  No. Program 0's governance docs were written self-contained, without
  cross-referencing or deferring to milb-projections/ as authoritative.
status: DECIDED
rationale: >
  Operator's explicit choice via AskUserQuestion. Program 0 is generic
  research infrastructure, not pitch-quality-specific; milb-projections/'s
  PITCH_QUALITY_RESEARCH_CONTRACT.md is domain-specific (noise-isolation
  levels A-D, required negative controls specific to pitch quality) in a
  way this program's docs deliberately are not. REPOSITORY_INVENTORY.md
  still documents that milb-projections/ exists and what it contains, so a
  future Stuff Research Program can find and read it directly -- this
  decision only concerns whether Program 0's own docs restate or depend on
  its content, not whether it's mentioned at all.
alternatives_considered:
  - option: Reference milb-projections/PITCH_QUALITY_RESEARCH_CONTRACT.md from Program 0's governance docs and defer to it for pitch-quality-specific rules
    why_not_chosen: >
      Not selected by operator. Would have made Program 0's own docs partly
      dependent on a domain-specific document that a future, differently-
      scoped research program might not even end up using.
decided_by: operator (via AskUserQuestion, 2026-08-16)
created_at: "2026-08-16"
