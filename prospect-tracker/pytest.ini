; Suite runtime config (2026-07-17 perf pass).
;
; norecursedirs REPLACES pytest's defaults, so the default entries
; (*.egg .* _darcs build CVS dist node_modules venv {arch}) are restated
; first, then the repo's non-test payload dirs (site surfaces, data
; artifacts, docs). Verified before adding: no test_*.py exists under ANY
; prospect-tracker subdirectory (tools/ included), so pruning these only
; skips directory recursion during collection - a same-tree A/B collect
; run produced byte-identical node-ID sets with and without this file.
;
; -p no:cacheprovider keeps pytest from writing .pytest_cache into the
; tree; --durations=25 keeps the slowest-test ledger visible so runtime
; regressions surface in every run.

[pytest]
addopts = --durations=25 -p no:cacheprovider
norecursedirs =
    *.egg
    .*
    _darcs
    build
    CVS
    dist
    node_modules
    venv
    {arch}
    data
    arbitration
    articles
    assets
    branding
    collegesavant
    config
    content
    deploy
    docs
    fa
    forums
    glossary
    hof
    management
    logs
    mlbstats
    model
    news
    pal
    player
    projections
    prospx
    report
    reports
    sources
    supabase
    team
    teams
    tools
    trademachine
    vendor
    __pycache__
