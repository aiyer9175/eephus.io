  // the empirical mean age for their level (young-for-level signals
  // a likely promotion candidate). Skipped when the org has none.
  const promoCard = (() => {
    // Expanded promotion-candidate set: A+/AA/AAA. A young-for-level AAA
    // prospect with FV ≥ 50 is a near-term MLB call-up candidate; the
    // older "A+/AA only" gate missed the obvious "knocking on the door"
    // tier. The summary header counts candidates by ETA year so a
    // reader sees the call-up wave shape at a glance.
    const PROMO_LEVELS = new Set(["A+", "AA", "AAA"]);
    const norms = DATA.level_norms || {};
    const candidates = rosterPlayersAll.filter(rp => {
      const sl = rp.statline || {};
      if (!PROMO_LEVELS.has(sl.level)) return false;
      const fv = rp.fv_close;
      if (fv == null || fv < 50) return false;
      const ageCenter = (((norms[sl.level] || {}).age || {}).avg_age)
                     ?? (((norms[sl.level] || {}).age || {}).median_age);
      if (ageCenter == null || rp.age == null) return false;
      return rp.age <= ageCenter;
    }).sort((a, b) => (b.fv_close || 0) - (a.fv_close || 0));
    if (!candidates.length) return "";
    // By-ETA-year tally — only counted when the prospect's ETA is set.
    const etaCounts = {};
    for (const c of candidates) {
      const yr = c.eta && c.eta.year;
      if (yr != null) etaCounts[yr] = (etaCounts[yr] || 0) + 1;
    }
    const etaSummary = Object.keys(etaCounts).sort()
      .map(y => `${etaCounts[y]} in ${y}`).join(" · ");
    const rows = candidates.slice(0, 6).map(rp => {
      const sl = rp.statline || {};
      const fvL = Math.round(rp.fv_close);
      const etaTxt = (rp.eta && rp.eta.year != null) ? `ETA ${rp.eta.year}` : "ETA —";
      return `<div style="display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--border-light);font-size:11.5px;cursor:pointer;" onclick="goToPlayer('${escapeHtml(rp.player_key)}');">
        <span class="fv-badge ${fvClass(String(fvL))} size-sm">${fvL}</span>
        <span style="color:var(--neon-cyan);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(rp.player_name)}</span>
        <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);font-variant-numeric:tabular-nums;">${escapeHtml(sl.level)} · ${rp.age.toFixed(1)}y · ${etaTxt}</span>
      </div>`;
    }).join("");
    return `<div class="farm-side-card">
      <div class="side-title">Promotion candidates <span class="side-count">${candidates.length}</span></div>
      <div style="font-size:10px;color:var(--text-tertiary);letter-spacing:0.04em;margin-bottom:4px;">FV ≥ 50 at A+/AA/AAA, young-for-level</div>
      ${etaSummary ? `<div style="font-size:10px;color:var(--neon-cyan);font-family:var(--font-mono);letter-spacing:0.02em;margin-bottom:6px;font-variant-numeric:tabular-nums;">${etaSummary}</div>` : ""}
      ${rows}
    </div>`;
  })();
  // Org stat leaders — show one top hitter + one top pitcher inline,
  // and a deep-link into the Leaderboards tab pre-filtered to this
  // org for the full board. Replaces the previous 5-row top-OPS + 5-row
  // top-ERA cards (duplicative of the cross-org Leaderboards tab).
  const topH = topHitters[0];
  const topP = topPitchers[0];
  const leaderRow = (lbl, row, val) => row
    ? `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:3px 0;font-size:12px;cursor:pointer;" onclick="goToPlayer('${escapeHtml(row.p.player_key)}');">
        <span><span style="font-size:9px;color:var(--text-tertiary);letter-spacing:0.08em;text-transform:uppercase;margin-right:6px;">${lbl}</span><span style="color:var(--text-primary);">${escapeHtml(row.p.player_name)}</span></span>
        <span style="color:var(--neon-cyan);font-variant-numeric:tabular-nums;">${val}</span>
      </div>`
    : `<div style="font-size:11px;color:var(--text-tertiary);padding:3px 0;"><span style="font-size:9px;letter-spacing:0.08em;text-transform:uppercase;margin-right:6px;">${lbl}</span>—</div>`;
  const orgLeadersCard = `<div class="farm-side-card">
    <div class="side-title">Org stat leaders <span class="side-count">${topHitters.length + topPitchers.length} qualifying</span></div>
    ${leaderRow("OPS", topH, topH ? `${topH.sl.ops} · ${topH.sl.hr ?? 0} HR` : "")}
    ${leaderRow("ERA", topP, topP ? `${topP.sl.era} · ${(topP.sl.ip != null ? Number(topP.sl.ip).toFixed(1) : "—")} IP` : "")}
    <a href="#" onclick="event.preventDefault();state.section='leaderboards';state.lbOrg='${escapeHtml(orgCode)}';state.view=null;render();syncToURL();" style="display:inline-block;margin-top:8px;font-size:11px;color:var(--neon-cyan);text-decoration:none;letter-spacing:0.02em;">View all org leaderboards →</a>
  </div>`;

  // Compact transaction list for the sidebar — one row per event with
  // a colored chip in front denoting the kind (trade / waiver claim /
  // release / DFA / etc.) and a +/→ arrow that flips for in vs. out
  // moves. The full chronological history lives in the main column;
  // this is a "top 12 most recent" snapshot keyed off the same data.
  const compactEventRow = (ev) => {
    const inbound = ev.to_org === orgCode;
    const arrow = inbound
      ? `<span style="color:var(--up);font-weight:700;">+</span>`
      : `<span style="color:var(--down);font-weight:700;">→</span>`;
    const other = inbound ? ev.from_org : ev.to_org;
    const gradTag = ev.graduate
      ? `<span style="font-size:9px;color:var(--text-tertiary);margin-left:4px;letter-spacing:0.04em;">GRAD</span>`
      : "";
    const cfg = TRANSACTION_KINDS[ev.kind] || {};
    const chip = `<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${cfg.color || 'var(--text-tertiary)'};vertical-align:middle;" title="${escapeHtml(cfg.label || ev.kind)}"></span>`;
    const otherTeam = other ? `<a href="#farm-org=${escapeHtml(other)}" onclick="event.stopPropagation();" style="color:inherit;text-decoration:none;">${escapeHtml(other)}</a>` : "?";
    return `<div style="display:grid;grid-template-columns:36px 8px 1fr auto;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--border-light);font-size:11.5px;cursor:pointer;" onclick="goToPlayer('${escapeHtml(ev.player.player_key)}');">
      <span style="font-family:var(--font-mono);color:var(--text-tertiary);font-size:10px;white-space:nowrap;">${ev.date ? ev.date.slice(2) : '—'}</span>
      ${chip}
      <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><span style="color:var(--neon-cyan);">${escapeHtml(ev.player.player_name)}</span>${gradTag}</span>
      <span style="font-family:var(--font-mono);font-size:10px;white-space:nowrap;">${arrow} ${otherTeam}</span>
    </div>`;
  };

  // Per-kind sidebar sections. Each renders the most recent few events
  // of that kind so the eye can scan by category without one section
  // crowding the others out. Skipped (omitted from the sidebar) when
  // the org has zero of that kind so we don't show empty cards.
  const sideEventSections = [
    ["trade",              "Recent trades",         8],
    ["waiver_claim",       "Recent waiver claims",  5],
    ["signed_free_agent",  "Recent FA signings",    5],
    ["released",           "Recent releases",       5],
    ["dfa",                "Recent DFAs",           5],
    ["outrighted",         "Recent outrights",      5],
    ["contract_purchase",  "Contract purchases",    5],
    ["rule_5_return",      "Rule 5 returns",        5],
  ];
  const recentTxCards = sideEventSections
    .map(([kind, title, cap]) => {
      const evs = (eventsByKind[kind] || []);
      if (!evs.length) return "";
      const html = evs.slice(0, cap).map(compactEventRow).join("");
      return `<div class="farm-side-card">
        <div class="side-title">${escapeHtml(title)} <span class="side-count">${evs.length}</span></div>
        ${html}
      </div>`;
    })
    .join("");

  // Alumni / Recent graduates — show each graduate's FV-at-grad badge
  // plus their realized Market AAV when WAR data exists for them.
  // Sorted by graduation date desc so the most-recent dev output
  // surfaces first. Click navigates to the graduate's detail page.
  const sortedGrads = graduates.slice().sort(
    (a, b) => (b.graduation_date || "").localeCompare(a.graduation_date || "")
  );
  const gradsCard = `<div class="farm-side-card">
    <div class="side-title">Recent graduates <span class="side-count">${graduates.length}</span></div>
    ${sortedGrads.slice(0, 6).map(g => {
      const fvAtGrad = g.fv_close != null ? Math.round(g.fv_close) : null;
      const fvBadge = fvAtGrad != null
        ? `<span class="fv-badge ${fvClass(String(fvAtGrad))} size-xs" style="flex-shrink:0;">${fvAtGrad}</span>`
        : `<span style="width:22px;flex-shrink:0;"></span>`;
      // Realized Market AAV — multiply playing-time-weighted WAR/yr by
      // the $/WAR market anchor. Only renders when the graduate has
      // ≥1 full-season equivalent of MLB time.
      let aavLine = "";
      const warRate = (typeof gradWarPerYr === "function") ? gradWarPerYr(g) : null;
      if (warRate && warRate.war_per_yr != null) {
        const aav = estimateMarketAavMM(warRate.war_per_yr);
        if (aav != null) {
          const fmtAav = aav >= 10 ? `$${aav.toFixed(0)}M` : `$${aav.toFixed(1)}M`;
          aavLine = ` <span title="Realized market AAV — ${warRate.war_per_yr.toFixed(2)} WAR/yr × $9.5M/WAR" style="color:var(--neon-cyan);font-family:var(--font-mono);font-size:10px;font-variant-numeric:tabular-nums;">${fmtAav}/yr</span>`;
        }
      }
      return `<div style="display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--border-light);font-size:11.5px;cursor:pointer;" onclick="goToPlayer('${escapeHtml(g.player_key)}');">
        ${fvBadge}
        <span style="color:var(--neon-cyan);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(g.player_name)}${aavLine}</span>
        <span style="color:var(--text-tertiary);font-family:var(--font-mono);font-size:10px;white-space:nowrap;">${g.graduation_date || "—"}</span>
      </div>`;
    }).join("") || '<span style="color:var(--text-tertiary);font-size:11.5px;">None</span>'}
  </div>`;

  // Tools+ leaderboard — top 3 toolsiest prospects in the org by the
  // outlier-biased composite overall index. Card hidden when no
  // prospects have published tool grades.
  const toolsLeaders = rosterPlayersAll
    .filter(p => p.tools && p.tools.composite_overall_plus != null)
    .sort((a, b) => b.tools.composite_overall_plus - a.tools.composite_overall_plus)
    .slice(0, 3);
  const toolsLeaderboardCard = toolsLeaders.length
    ? `<div class="farm-side-card">
        <div class="side-title">Toolsiest <span class="side-count">Tools+ leaders</span></div>
        ${toolsLeaders.map(p => {
          const fvL = p.fv_close != null ? Math.round(p.fv_close) : null;
          const fvBadge = fvL != null
            ? `<span class="fv-badge ${fvClass(String(fvL))} size-xs" style="flex-shrink:0;">${fvL}</span>`
            : `<span style="width:22px;flex-shrink:0;"></span>`;
          return `<div style="display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--border-light);font-size:11.5px;cursor:pointer;" onclick="goToPlayer('${escapeHtml(p.player_key)}');">
            ${fvBadge}
            <span style="color:var(--neon-cyan);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(p.player_name)}</span>
            ${toolPlusPillHTML(p)}
          </div>`;
        }).join("")}
      </div>`
    : "";

  // Level × position depth heatmap — 7 levels × 5 position buckets.
  // Cells shaded by total FV (so 3 elite prospects glow brighter than
  // 5 depth pieces). Hovering surfaces the count + total FV per cell.
  const depthHeatmapCard = (() => {
    const HEATMAP_LEVELS = ["MLB", "AAA", "AA", "A+", "A", "CPX", "DSL"];
    const HEATMAP_POS    = ["C", "IF", "OF", "SP", "RP"];
    const heatmap = {};
    for (const lvl of HEATMAP_LEVELS) {
      heatmap[lvl] = Object.fromEntries(HEATMAP_POS.map(p => [p, { count: 0, fv_sum: 0 }]));
    }
    const posMap = (p) => {
      const head = String(p.position || "").split("/")[0].toUpperCase();
      if (!head) return null;
      if (head === "C") return "C";
      if (["1B","2B","3B","SS","INF","IF","UTIL","MI","DH"].includes(head)) return "IF";
      if (["CF","LF","RF","OF"].includes(head)) return "OF";
      if (/^(RP|MIRP|SIRP)$/.test(head)) return "RP";
      if (/^(RHP|LHP|SP|P)$/.test(head)) return "SP";
      return null;
    };
    let total = 0;
    for (const p of rosterPlayersAll) {
      const lvl = (p.statline || {}).level;
      const pos = posMap(p);
      if (!lvl || !pos || !heatmap[lvl] || !heatmap[lvl][pos]) continue;
      heatmap[lvl][pos].count++;
      heatmap[lvl][pos].fv_sum += (p.fv_close || 40);
      total++;
    }
    if (!total) return "";
    const maxFvSum = Math.max(...HEATMAP_LEVELS.flatMap(l =>
      HEATMAP_POS.map(p => heatmap[l][p].fv_sum)));
    const cellHTML = (lvl, pos) => {
      const c = heatmap[lvl][pos];
      if (!c.count) return `<span class="heatmap-cell empty" title="${lvl} ${pos}: 0">·</span>`;
      const intensity = maxFvSum > 0 ? Math.min(1, c.fv_sum / maxFvSum) : 0;
      return `<span class="heatmap-cell" style="background:rgba(143,205,245,${(0.15 + 0.55 * intensity).toFixed(2)});" title="${lvl} ${pos}: ${c.count} prospect${c.count === 1 ? "" : "s"} · total FV ${c.fv_sum.toFixed(0)}">${c.count}</span>`;
    };
    const headerRow = `<span class="heatmap-label"></span>${HEATMAP_POS.map(p => `<span class="heatmap-label">${p}</span>`).join("")}`;
    const dataRows = HEATMAP_LEVELS
      .filter(lvl => HEATMAP_POS.some(p => heatmap[lvl][p].count > 0))
      .map(lvl => `<span class="heatmap-label">${lvl}</span>${HEATMAP_POS.map(p => cellHTML(lvl, p)).join("")}`)
      .join("");
    return `<div class="farm-side-card">
      <div class="side-title">Depth heatmap <span class="side-count">level × position · FV-shaded</span></div>
      <div class="farm-depth-heatmap">${headerRow}${dataRows}</div>
    </div>`;
  })();

  // Comparable farms — cosine similarity over the (FV-histogram +
  // position-group) feature vector. Top 3 closest orgs (excluding the
  // current one) render with logo + name + sim%. Clicking navigates.
  const comparableFarmsCard = (() => {
    // Build a composite feature vector for every org spanning multiple
    // axes — talent distribution (FV histogram), positional mix,
    // developmental momentum, age profile, momentum, ETA wave shape,
    // and acquisition-strategy cultural signal. The dimensions are
    // pre-normalized into 0-N scales so cosine similarity isn't
    // dominated by any single high-magnitude axis.
    const win = state.formWindow || "3y";
    const featureVec = (o) => {
      const v = [];
      // FV histogram — 5 buckets, raw counts.
      const fvHist = [0, 0, 0, 0, 0];  // 50, 55, 60, 65, 70+
      for (const pr of (o.prospects || [])) {
        const fv = Number(pr.fv_label) || Math.round(pr.fv_raw || 0);
        if (fv >= 70) fvHist[4]++;
        else if (fv >= 65) fvHist[3]++;
        else if (fv >= 60) fvHist[2]++;
        else if (fv >= 55) fvHist[1]++;
        else if (fv >= 50) fvHist[0]++;
      }
      v.push(...fvHist);
      // Position-group counts — 5 buckets, raw counts.
      const posCounts = o.pos_groups || {};
      v.push(...["C","IF","OF","SP","RP"].map(k => posCounts[k] || 0));
      // Tier counts — 60+ / 55 / 50, raw from org_summary.
      v.push((o.tier_60_plus || 0));
      v.push((o.tier_55 || 0));
      v.push((o.tier_50 || 0));
      // Stock momentum — up vs down vs flat balance.
      v.push(o.stock_up   || 0);
      v.push(o.stock_down || 0);
      // DvM+ for the active window — centered at 100, scaled so cosine
      // doesn't blow up. Subtract 100 + clamp to ±30 so a 130 DvM+
      // contributes as 30, a 70 contributes as -30.
      const dvm = (o.dvm_plus || {})[win];
      v.push(dvm != null ? Math.max(-30, Math.min(30, dvm - 100)) : 0);
      // Average age — centered at 22 (typical prospect mean).
      v.push(o.avg_age != null ? (o.avg_age - 22) * 5 : 0);
      // Young-for-level count — talent-development signal.
      v.push(o.very_young_count || 0);
      // Acquisition strategy — IFA vs Draft balance over the last 3yr.
      // Both are dollar totals; we scale to $M units so they're on
      // par with the other axes. Cultural signal for farm-building
      // style (heavy IFA vs heavy draft = different orgs).
      const cutoff = new Date().getUTCFullYear() - 3;
      let ifa3yr = 0, draft3yr = 0;
      for (const [yr, rec] of Object.entries(o.ifa_spending || {})) {
        if (+yr >= cutoff) ifa3yr += (rec && rec.total_usd) || 0;
      }
      for (const [yr, rec] of Object.entries(o.draft_spending || {})) {
        if (+yr >= cutoff) draft3yr += (rec && rec.total_usd) || 0;
      }
      v.push(ifa3yr / 1_000_000);    // $M units
      v.push(draft3yr / 1_000_000);  // $M units
      return v;
    };
    const cosine = (a, b) => {
      let dot = 0, na = 0, nb = 0;
      for (let i = 0; i < a.length; i++) {
        dot += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i];
      }
      return (na && nb) ? dot / (Math.sqrt(na) * Math.sqrt(nb)) : 0;
    };
    const myVec = featureVec(org);
    const comps = (DATA.org_summary || [])
      .filter(o => o.org !== orgCode)
      .map(o => ({ o, sim: cosine(myVec, featureVec(o)) }))
      .filter(c => c.sim > 0)
      .sort((a, b) => b.sim - a.sim)
      .slice(0, 3);
    if (!comps.length) return "";
    return `<div class="farm-side-card">
      <div class="side-title">Comparable farms <span class="side-count">composite: FV mix · positions · tiers · momentum · age · spend</span></div>
      ${comps.map(({ o, sim }) => `<div data-org="${escapeHtml(o.org)}" style="display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--border-light);font-size:11.5px;cursor:pointer;">
        ${teamLogoHTML(o.org, "sm", fullOrgName(o.org))}
        <span style="color:var(--neon-cyan);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(fullOrgName(o.org))} <span style="color:var(--text-tertiary);font-size:9px;letter-spacing:0.06em;">${escapeHtml(o.org)}</span></span>
        <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);font-variant-numeric:tabular-nums;" title="Composite cosine similarity score across talent distribution, positional mix, tier counts, stock momentum, ${win.toUpperCase()} DvM+, age profile, young-for-level count, and 3yr IFA/Draft spend mix.">${Math.round(sim * 100)}%</span>
      </div>`).join("")}
    </div>`;
  })();

  // Currently-on-IL card. Lists this org's tracked prospects on the IL
  // now, sorted by FV descending so the highest-priority injuries
  // surface first. Each row links to the prospect detail page so the
  // reader can drill into the injury history.
  const ilPlayers = rosterPlayersAll
    .filter(rp => (rp.il_status || {}).is_on_il)
    .sort((a, b) => (b.fv_close || 0) - (a.fv_close || 0));
  const ilCard = `<div class="farm-side-card">
    <div class="side-title">On the IL <span class="side-count">${ilPlayers.length}</span></div>
    ${ilPlayers.length
      ? ilPlayers.slice(0, 8).map(rp => {
          const il = rp.il_status || {};
          let days = il.days;
          if (days == null && il.since) {
            const t = new Date(il.since + "T00:00:00").getTime();
            if (!isNaN(t)) days = Math.max(0, Math.floor((Date.now() - t) / 86400000));
          }
          const tj = (rp.health_profile || {}).is_post_tj
            ? ` <span style="font-size:9px;color:var(--neon-violet);font-weight:700;letter-spacing:0.04em;text-transform:uppercase;">TJ</span>`
            : "";
          const fvL = rp.fv_close != null ? Math.round(rp.fv_close) : null;
          return `<div style="display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--border-light);font-size:11.5px;cursor:pointer;" onclick="goToPlayer('${escapeHtml(rp.player_key)}');">
            ${fvL != null ? `<span class="fv-badge ${fvClass(String(fvL))} size-sm">${fvL}</span>` : `<span style="width:24px;"></span>`}
            <span style="color:var(--neon-cyan);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(rp.player_name)}${tj}</span>
            <span style="font-family:var(--font-mono);font-size:10px;color:var(--neon-amber);font-variant-numeric:tabular-nums;">${days != null ? days + 'd' : '—'}</span>
          </div>`;
        }).join("")
      : '<span style="color:var(--text-tertiary);font-size:11.5px;">All tracked prospects healthy.</span>'}
  </div>`;

  // Bonus pools card — MLB-assigned 2026 draft + IFA pool ceilings for
  // this org, with actual-spend utilization when on file. Color-coded
  // by % utilization. Card hidden when no pool ceilings are on file.
  const bonusPoolsCard = (() => {
    const year = new Date().getUTCFullYear();
    const draftUtil = _orgDraftPoolUtilization(org, year);
    const ifaUtil = _orgIfaPoolUtilization(org, year);
    if (!draftUtil && !ifaUtil) return "";
    const fmtUsd = m => {
      if (m == null) return "—";
      if (m >= 1_000_000) return `$${(m / 1_000_000).toFixed(2)}M`;
      if (m >= 1_000)     return `$${Math.round(m / 1_000)}K`;
      return `$${m}`;
    };
    const utilColor = (pct) => pct == null ? "var(--text-tertiary)"
                            : pct >= 95 ? "var(--up)"
                            : pct >= 70 ? "var(--text-secondary)"
                            : "var(--neon-amber)";
    const renderRow = (label, slug, util, swatch) => {
      if (!util) return "";
      const pctTxt = util.pct != null ? `${util.pct.toFixed(0)}%` : "—";
      const spentTxt = util.spent != null ? fmtUsd(util.spent) : "—";
      const pctColor = utilColor(util.pct);
      return `<div style="display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--border-light);font-size:11.5px;">
        <span style="display:inline-flex;align-items:center;gap:6px;">
          <span aria-hidden="true" style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${swatch};"></span>
          <span class="g-term" data-term="${slug}" style="color:var(--text-primary);font-weight:600;">${label}</span>
        </span>
        <span style="font-family:var(--font-mono);color:var(--text-tertiary);font-size:10.5px;font-variant-numeric:tabular-nums;text-align:right;">${spentTxt} / ${fmtUsd(util.cap)}</span>
        <span style="font-family:var(--font-mono);color:${pctColor};font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;">${pctTxt}</span>
      </div>`;
    };
    const draftRow = renderRow("Draft pool", "bonus_pool", draftUtil, "var(--spend-draft, var(--neon-cyan))");
    const ifaRow = renderRow("IFA pool", "bonus_pool", ifaUtil, "var(--neon-amber)");
    return `<div class="farm-side-card">
      <div class="side-title">Bonus pools <span class="side-count">${year} · MLB-assigned</span></div>
      ${draftRow}
      ${ifaRow}
      <div style="font-size:10px;color:var(--text-tertiary);margin-top:6px;font-style:italic;">Teams can exceed draft pool by ~5% before tax penalties; IFA pool is a hard cap.</div>
    </div>`;
  })();

  // Upcoming draft picks card — every numbered pick the org owns in
  // the current draft cycle, sorted by overall number. Source: the
  // MLB.com draft-pool article's per-pick slot values (DATA.mlb_draft_pools).
  const upcomingPicksCard = (() => {
    const year = new Date().getUTCFullYear();
    const pool = (DATA.mlb_draft_pools || {})[year] || (DATA.mlb_draft_pools || {})[String(year)];
    if (!pool || !Array.isArray(pool.pick_values)) return "";
    const orgPicks = pool.pick_values
      .filter(p => p.team === org.org)
      .sort((a, b) => (a.pick_overall || 9999) - (b.pick_overall || 9999));
    if (!orgPicks.length) return "";
    // Approximate round from pick_overall. The compensation/CB rounds
    // make this fuzzy at the boundaries; an exact mapping would need
    // the article's section labels which we don't preserve.
    const roundLabel = (n) => {
      if (n == null) return "?";
      if (n <= 27) return "1";
      if (n <= 43) return "CBA";   // Competitive Balance A + comp picks
      if (n <= 75) return "2";
      if (n <= 110) return "3";
      const r = Math.ceil((n - 30) / 30) + 1;
      return String(Math.max(1, r));
    };
    const fmtSlot = (s) => s >= 1_000_000 ? `$${(s/1_000_000).toFixed(2)}M` : `$${Math.round(s/1_000)}K`;
    const rows = orgPicks.map(p => `<div style="display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:baseline;padding:3px 0;border-bottom:1px solid var(--border-light);font-size:11.5px;">
      <span style="font-family:var(--font-mono);font-weight:700;color:var(--neon-cyan);font-variant-numeric:tabular-nums;min-width:38px;">#${p.pick_overall}</span>
      <span style="font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.04em;color:var(--text-tertiary);background:var(--bg-tertiary);padding:1px 6px;border-radius:2px;">R${roundLabel(p.pick_overall)}</span>
      <span style="font-family:var(--font-mono);color:var(--text-primary);font-size:10.5px;font-variant-numeric:tabular-nums;text-align:right;">${fmtSlot(p.slot_usd)} slot</span>
    </div>`).join("");
    const totalSlot = orgPicks.reduce((sum, p) => sum + (p.slot_usd || 0), 0);
    return `<div class="farm-side-card">
      <div class="side-title">Upcoming draft picks <span class="side-count">${year} · ${orgPicks.length}</span></div>
      ${rows}
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;font-size:11px;color:var(--text-secondary);">
        <span>Total slot value</span>
        <span style="font-family:var(--font-mono);color:var(--text-primary);font-weight:700;font-variant-numeric:tabular-nums;">${fmtSlot(totalSlot)}</span>
      </div>
    </div>`;
  })();

  const sidebarHtml = topProspectCard + youngestCard + bonusPoolsCard + upcomingPicksCard + depthHeatmapCard + fvDistCard + acqMixCard + etaCard + moversCard + promoCard + toolsLeaderboardCard + orgLeadersCard + ilCard + recentTxCards + gradsCard + comparableFarmsCard;

  // Optional left rail (≥1500px viewports only — CSS-hidden otherwise).
  // Surfaces breakdowns that are useful at-a-glance but would otherwise
  // sit four scrolls deep on the right or get squeezed into stat tiles.
  const existingFarmNote = farmNoteLoad(orgCode);
  const leftRailHtml = `
    <div class="farm-left-rail">
      <div class="farm-side-card">
        <div class="side-title">Notes</div>
        <textarea class="player-note-area" data-farm-note-key="${escapeHtml(orgCode)}" placeholder="Scouting notes, draft targets, dev questions — saved as you type. Private to this browser.">${escapeHtml(existingFarmNote)}</textarea>
      </div>
      <div class="farm-side-card">
        <div class="side-title">Position mix</div>
        <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:3px;">${makePosBreakdown(org.pos_groups)}</div>
      </div>
      <div class="farm-side-card">
        <div class="side-title">Stock balance</div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:600;">
          <span class="stock-up">▲${org.stock_up || 0}</span>
          <span style="color:var(--text-tertiary);font-size:11px;">vs.</span>
          <span class="stock-down">▼${org.stock_down || 0}</span>
        </div>
        <div style="font-size:11px;color:var(--text-secondary);margin-top:4px;">${org.stock_flat || 0} flat over last update</div>
      </div>
      <div class="farm-side-card">
        <div class="side-title">Promotion ladder</div>
        ${makePromotionLadder(rosterPlayersAll, org)}
      </div>
      <div class="farm-side-card">
        <div class="side-title">Tier breakdown</div>
        <div style="margin-top:6px;">${makeTierBar(org.prospects)}</div>
      </div>
    </div>`;

  // Affiliate-roster section — one tab per level, content swap on click.
  // Highlights tracked prospects with their FV badge inline so the page
  // doubles as a "where in the org are our prospects playing right now".
  const affilLevels = ["MLB", "AAA", "AA", "A+", "A", "CPX", "DSL"];
  const orgRosters = (DATA.rosters_by_org || {})[orgCode] || {};
  const presentLevels = affilLevels.filter(lvl => (orgRosters[lvl] || []).length);
  const defaultLevel = presentLevels.includes("AAA") ? "AAA" : (presentLevels[0] || "MLB");

  function levelTableHtml(level) {
    const roster = orgRosters[level] || [];
    if (!roster.length) {
      return `<div style="color:var(--text-tertiary);font-size:12px;padding:6px 0;">No players on file at ${escapeHtml(level)}.</div>`;
    }
    const rows = roster.map(pl => {
      const gradedClick = pl.player_key
        ? ` onclick="goToPlayer('${escapeHtml(pl.player_key)}');" style="cursor:pointer;"`
        : "";
      const nameCell = pl.player_key
        ? `<span style="color:var(--neon-cyan);">${escapeHtml(pl.fullName)}</span>`
        : escapeHtml(pl.fullName);
      const fvCell = pl.fv_label
        ? `<span class="fv-badge ${fvClass(pl.fv_label)} size-sm">${pl.fv_label}</span>`
        : `<span style="color:var(--text-tertiary);">—</span>`;
      return `<tr${gradedClick}>
        <td>${nameCell}</td>
        <td style="color:var(--text-secondary);">${escapeHtml(pl.position || "—")}</td>
        <td style="font-variant-numeric:tabular-nums;color:var(--text-secondary);">${pl.age != null ? pl.age.toFixed(1) : "—"}</td>
        <td style="text-align:center;">${fvCell}</td>
        <td style="color:var(--text-tertiary);font-size:11px;">${escapeHtml(pl.team_name || "")}</td>
      </tr>`;
    }).join("");
    return `<table class="detail-table"><thead><tr>
      <th>Player</th><th>Pos</th><th>Age</th><th style="text-align:center;">FV</th><th>Affiliate</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
  }

  const affilTabs = presentLevels.map(lvl => {
    const count = (orgRosters[lvl] || []).length;
    const graded = (orgRosters[lvl] || []).filter(p => p.fv_label).length;
    const active = lvl === defaultLevel ? " active" : "";
    return `<button class="chip level-tab${active}" data-level="${escapeHtml(lvl)}" type="button">${escapeHtml(lvl)} <span style="color:var(--text-tertiary);font-weight:400;">(${count}${graded ? `, ${graded}★` : ""})</span></button>`;
  }).join("");

  const affilPanels = presentLevels.map(lvl => `
    <div class="level-panel" data-level="${escapeHtml(lvl)}" style="display:${lvl === defaultLevel ? "block" : "none"};">
      ${levelTableHtml(lvl)}
    </div>`).join("");

  const affiliateSection = presentLevels.length ? `
    <div class="detail-title">Affiliate rosters
      <span class="detail-title-sub">★ = graded prospect</span>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">${affilTabs}</div>
    ${affilPanels}` : "";

  // "Graded prospects by level" — focused view that strips out the org
  // filler from affiliate rosters and shows only prospects with an FV
  // grade, grouped by affiliate level. Each prospect links back to its
  // detail page. Levels with no graded prospects are skipped entirely so
  // the section stays dense. MLB is intentionally excluded — graded
  // players on the MLB roster are graduates by definition and clutter
  // this view; the Affiliate-Rosters section below still shows them.
  const gradedByLevel = (() => {
    const blocks = [];
    const milbLevels = affilLevels.filter(lvl => lvl !== "MLB");
    for (const lvl of milbLevels) {
      const graded = (orgRosters[lvl] || []).filter(r => r.fv_label);
      if (!graded.length) continue;
      // Already sorted FV desc upstream (run_monthly sort key). Keep that.
      const items = graded.map(pl => {
        const click = pl.player_key
          ? ` onclick="goToPlayer('${escapeHtml(pl.player_key)}');" style="cursor:pointer;"`
          : "";
        return `<div class="graded-prospect-row"${click}>
          <span class="fv-badge ${fvClass(pl.fv_label)} size-sm">${pl.fv_label}</span>
          <span style="color:${pl.player_key ? "var(--neon-cyan)" : "var(--text-primary)"};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(pl.fullName)}</span>
          <span style="color:var(--text-tertiary);font-size:10px;white-space:nowrap;">${escapeHtml(pl.position || "—")}${pl.age != null ? ` · ${pl.age.toFixed(1)}` : ""}</span>
        </div>`;
      }).join("");
      blocks.push(`
        <div class="graded-level-block">
          <div class="graded-level-header">
            <span class="graded-level-name">${escapeHtml(lvl)}</span>
            <span class="graded-level-count">${graded.length}</span>
          </div>
          ${items}
        </div>`);
    }
    if (!blocks.length) {
      return `<div style="color:var(--text-tertiary);font-size:12px;">No graded prospects currently assigned to an affiliate.</div>`;
    }
    return `<div class="graded-by-level-grid">${blocks.join("")}</div>`;
  })();

  // Total count excludes MLB to match what the section actually shows.
  const totalGraded = affilLevels
    .filter(lvl => lvl !== "MLB")
    .reduce((acc, lvl) => acc + (orgRosters[lvl] || []).filter(r => r.fv_label).length, 0);
  const gradedSection = `
    <div class="detail-title">Graded prospects by level
      <span class="detail-title-sub">MiLB only · ${totalGraded} total · sorted by FV within each level</span>
    </div>
    ${gradedByLevel}`;

  // Acquisition filter chip bar — same as before but visually paired
  // with the acquisition-mix chart in the sidebar (which acts as a
  // legend). Filter state is shared with the main prospect list via
  // state.acqFilter.
  const ACQ_METHODS_FOR_FARM = [
    ["all",               "All"],
    ["draft",             "Draft"],
    ["international_fa",  "Intl FA"],
    ["trade",             "Trade"],
    ["waiver",            "Waiver"],
    ["rule_5",            "Rule 5"],
    ["free_agent",        "FA signing"],
    ["contract_purchase", "Purchase"],
  ];
  const acqTallies = {};
  for (const rp of rosterPlayersAll) {
    const m = (rp.current_acquisition || {}).method || "unknown";
    acqTallies[m] = (acqTallies[m] || 0) + 1;
  }
  // Per-roster tallies for the in-page level and position filters so
  // each chip can show "(N)" and we can dim/disable chips that would
  // narrow the roster to zero.
  const levelTallies = {};
  for (const rp of rosterPlayersAll) {
    const lvl = (rp.statline || {}).level || "_";
    levelTallies[lvl] = (levelTallies[lvl] || 0) + 1;
  }
  const posTallies = {};
  for (const rp of rosterPlayersAll) {
    const b = positionBucket(rp.position);
    if (b) posTallies[b] = (posTallies[b] || 0) + 1;
  }

  const FARM_LEVEL_FILTER = [
    ["all", "All"], ["MLB","MLB"], ["AAA","AAA"], ["AA","AA"], ["A+","A+"],
    ["A","A"], ["CPX","CPX"], ["DSL","DSL"],
  ];
  const FARM_POS_FILTER = [
    ["all","All"], ["C","C"], ["1B","1B"], ["INF","INF"], ["OF","OF"], ["P","P"],
  ];

  // Three chip strips stacked tight: acquisition method, level, position.
  // Each chip shows its tally so the user knows whether selecting it
  // will yield anything before clicking.
  const filterStrip = (label, opts, activeVal, dataAttr, tallies) => `
    <div style="display:flex;align-items:center;gap:6px;margin:6px 0 0;flex-wrap:wrap;">
      <span style="font-size:10px;color:var(--text-tertiary);letter-spacing:0.10em;text-transform:uppercase;margin-right:4px;min-width:50px;">${escapeHtml(label)}</span>
      ${opts.map(([val, lbl]) => {
        const n = val === "all" ? rosterPlayersAll.length : (tallies[val] || 0);
        const active = activeVal === val;
        const disabled = val !== "all" && n === 0;
        return `<button class="chip${active ? " active" : ""}" ${dataAttr}="${val}" type="button"${disabled ? ' disabled style="opacity:0.4;cursor:default;"' : ""}>
          ${escapeHtml(lbl)} <span style="color:var(--text-tertiary);font-weight:400;">(${n})</span>
        </button>`;
      }).join("")}
    </div>`;

  const acqFilterBar = filterStrip("Acquired", ACQ_METHODS_FOR_FARM,
    state.acqFilter, "data-farm-acq", acqTallies);
  const levelFilterBar = filterStrip("Level", FARM_LEVEL_FILTER,
    state.levelFilter, "data-farm-level", levelTallies);
  const posFilterBar = filterStrip("Position", FARM_POS_FILTER,
    state.posFilter, "data-farm-pos", posTallies);

  root.innerHTML = header + tilesHtml + `
    <div class="farm-detail-grid">
      ${leftRailHtml}
      <div>
        <div class="detail-title flush">${(state.formWindow || "3y")} development vs mean farm <span class="detail-title-sub">pure-development metric — graduations + acquisitions (trades, draft, IFA) nullified, so only the FV gained while a prospect was in the org counts. DvM+ = wRC+/OPS+-style index where 100 = league mean and 10 pts = 1 std-dev</span></div>
        <div class="filter-bar" style="margin-bottom:8px;padding:6px 10px;">
          <span class="filter-label">Window</span>
          <button class="chip${(state.formWindow || "3y") === "1y" ? " active" : ""}" data-form-window="1y" type="button">1y</button>
          <button class="chip${(state.formWindow || "3y") === "3y" ? " active" : ""}" data-form-window="3y" type="button">3y</button>
          <button class="chip${(state.formWindow || "3y") === "5y" ? " active" : ""}" data-form-window="5y" type="button">5y</button>
        </div>
        ${makeFarmGrowthChart(org, ((DATA.farm_trajectory_means || {})[state.formWindow || "3y"] ?? 0), state.formWindow || "3y")}
        <div class="detail-title">Position depth chart <span class="detail-title-sub">Tracked prospects bucketed by primary position · 10 columns (C / 1B / 2B / SS / 3B / LF / CF / RF / SP / RP)</span></div>
        <div class="filter-bar" style="margin:6px 0 4px;padding:6px 10px;">
          <span class="filter-label">Sort</span>
          <button class="chip${(state.depthSort || "fv") === "fv" ? " active" : ""}" data-depth-sort="fv" type="button" title="Highest FV first, age as tiebreaker. Dashed dividers separate the 50+, 40-tier, and sub-40 groups.">FV</button>
          <button class="chip${state.depthSort === "age" ? " active" : ""}" data-depth-sort="age" type="button" title="Youngest first, FV as tiebreaker.">Age</button>
          <button class="chip${state.depthSort === "eta" ? " active" : ""}" data-depth-sort="eta" type="button" title="Soonest ETA first, FV as tiebreaker. Prospects without an ETA sink to the bottom.">ETA</button>
        </div>
        ${makePositionDepthChart(rosterPlayersAll, state.depthSort || "fv")}
        <div class="detail-title">Acquisition spending <span class="detail-title-sub">Bonus pool dollars — International FA vs Draft, 2021-present</span></div>
        ${makeSpendingBlock(org)}
        <div class="detail-title">Tracked prospects (${rosterPlayers.length}${
          [
            state.acqFilter !== "all" ? `${escapeHtml(ACQ_METHODS_FOR_FARM.find(m => m[0] === state.acqFilter)?.[1] || state.acqFilter)}` : null,
            state.levelFilter !== "all" ? escapeHtml(state.levelFilter) : null,
            state.posFilter !== "all" ? escapeHtml(state.posFilter) : null,
          ].filter(Boolean).length ? " · filtered " + [
            state.acqFilter !== "all" ? `${escapeHtml(ACQ_METHODS_FOR_FARM.find(m => m[0] === state.acqFilter)?.[1] || state.acqFilter)}` : null,
            state.levelFilter !== "all" ? escapeHtml(state.levelFilter) : null,
            state.posFilter !== "all" ? escapeHtml(state.posFilter) : null,
          ].filter(Boolean).join(" / ") : ""
        })</div>
        <div class="farm-roster-filters">
          ${acqFilterBar}
          ${levelFilterBar}
          ${posFilterBar}
          <div class="filter-bar" style="padding:6px 10px;">
            <span class="filter-label">Sort roster</span>
            <button class="chip${(state.rosterSort || "fv") === "fv" ? " active" : ""}" data-roster-sort="fv" type="button" title="Consensus FV (default)">FV</button>
            <button class="chip${state.rosterSort === "avg_rank" ? " active" : ""}" data-roster-sort="avg_rank" type="button" title="Average rank across sources">Avg rank</button>
            <button class="chip${state.rosterSort === "age" ? " active" : ""}" data-roster-sort="age" type="button" title="Youngest first">Age</button>
            <button class="chip${state.rosterSort === "eta" ? " active" : ""}" data-roster-sort="eta" type="button" title="Soonest ETA first">ETA</button>
            <button class="chip${state.rosterSort === "tools_plus" ? " active" : ""}" data-roster-sort="tools_plus" type="button" title="Toolsiest first — Tools+ index">Tools+</button>
            <button class="chip${state.rosterSort === "surplus" ? " active" : ""}" data-roster-sort="surplus" type="button" title="Per-prospect FV-implied surplus value, highest first">Surplus</button>
          </div>
        </div>
        ${rosterHeader}${rosterRows}
        ${gradedSection}
        ${affiliateSection}
        ${makeFarmTransactionsSection(allEventsForOrg, orgCode)}
      </div>
      <div class="farm-side">${sidebarHtml}</div>
    </div>`;

  // Wire affiliate level tabs (vanilla — toggle visibility, no re-render).
  document.querySelectorAll("#farm-detail-body .level-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#farm-detail-body .level-tab").forEach(b =>
        b.classList.toggle("active", b === btn));
      const lvl = btn.dataset.level;
      document.querySelectorAll("#farm-detail-body .level-panel").forEach(panel => {
        panel.style.display = panel.dataset.level === lvl ? "block" : "none";
      });
    });
  });
  // Development-window chips above the farm-detail growth chart. Each
  // farm-detail render produces a fresh chip row, so we re-attach
  // listeners scoped to #farm-detail-body each time. Shares
  // `state.formWindow` with the Farm-list chips so the choice persists
  // across tab switches.
  document.querySelectorAll("#farm-detail-body [data-form-window]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.formWindow = btn.dataset.formWindow;
      // Mirror the active class on the Farm-list chips too so the UI
      // stays in sync if the user navigates back.
      document.querySelectorAll("[data-form-window]").forEach(b =>
        b.classList.toggle("active", b.dataset.formWindow === state.formWindow));
      renderFarmDetail(orgCode);
      syncToURL();
    });
  });
  // Depth-chart sort chips (FV / age / ETA). Re-render the farm detail
  // so the depth-chart rebuilds with the new sort + the chip's active
  // class flips. State is sticky across farm-detail visits.
  document.querySelectorAll("#farm-detail-body [data-depth-sort]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.depthSort = btn.dataset.depthSort;
      renderFarmDetail(orgCode);
    });

  // Roster sort chips (FV / avg_rank / age / ETA / tools_plus / surplus).
  // Re-render the farm detail so the roster table re-orders + the chip
  // active class flips. Persists to the URL via syncToURL.
  document.querySelectorAll("#farm-detail-body [data-roster-sort]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.rosterSort = btn.dataset.rosterSort;
      syncToURL();
      renderFarmDetail(orgCode);
    });
  });
  // Acquisition / level / position filter chips on the farm detail
  // page. All three share state with the main prospect list so toggling
  // chips here also reshapes the main list when the user navigates back.
  // Each click re-renders the entire farm detail so tallies + active
  // states stay consistent.
  document.querySelectorAll("#farm-detail-body [data-farm-acq]").forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener("click", () => {
      state.acqFilter = btn.dataset.farmAcq;
      renderFarmDetail(orgCode);
      syncToURL();
    });
  });
  document.querySelectorAll("#farm-detail-body [data-farm-level]").forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener("click", () => {
      state.levelFilter = btn.dataset.farmLevel;
      renderFarmDetail(orgCode);
      syncToURL();
    });
  });
  document.querySelectorAll("#farm-detail-body [data-farm-pos]").forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener("click", () => {
      state.posFilter = btn.dataset.farmPos;
      renderFarmDetail(orgCode);
      syncToURL();
    });
  });
  // Farm transaction-history filter chips (kind + direction). Both
  // share state via state.farmTxKind / state.farmTxDir so the URL
  // captures the active view.
  document.querySelectorAll("#farm-detail-body [data-farm-tx-kind]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.farmTxKind = btn.dataset.farmTxKind;
      renderFarmDetail(orgCode);
      syncToURL();
    });
  });
  document.querySelectorAll("#farm-detail-body [data-farm-tx-dir]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.farmTxDir = btn.dataset.farmTxDir;
      renderFarmDetail(orgCode);
      syncToURL();
    });
  });
}

function render() {
  const sections = {
    active:       "active-section",
    spotlights:   "spotlights-section",
    traded:       "traded-section",
    injured:      "injured-section",
    graduates:    "graduates-section",
    farm:         "farm-section",
    leaderboards: "leaderboards-section",
    glossary:     "glossary-section",
    watchlist:    "watchlist-section",
    player:       "player-detail-section",
    farmDetail:   "farm-detail-section",
  };

  // Detail view takes over: hide tabs, filter bar, search; show one section.
  const isDetail = !!state.view;
  const sectionTabs = document.getElementById("section-tabs");
  if (sectionTabs) sectionTabs.style.display = isDetail ? "none" : "";
  const searchBar = document.querySelector(".search-bar");
  if (searchBar) searchBar.style.display = isDetail ? "none" : "";
  const filterBar = document.getElementById("filter-bar");
  const filterToggleBtn = document.getElementById("filter-toggle");
  const usesFilters = !isDetail && (state.section === "active" || state.section === "traded");
  if (filterBar) {
    // Style.display set to "" lets the CSS media query take over so
    // the mobile collapse behavior keeps working; "none" forces hidden
    // when on a tab that doesn't use these filters.
    filterBar.style.display = usesFilters ? "" : "none";
  }
  if (filterToggleBtn) {
    filterToggleBtn.style.display = usesFilters ? "" : "none";
  }

  let active;
  if (state.view && state.view.type === "player") active = "player";
  else if (state.view && state.view.type === "farm") active = "farmDetail";
  else active = state.section;

  for (const [name, id] of Object.entries(sections)) {
    const el = document.getElementById(id);
    if (el) el.style.display = name === active ? "block" : "none";
  }

  // Slice gating: views that traverse graduates / inactive / farm rosters
  // wait for the corresponding sidecar before rendering. The boot path
  // kicks off these loads on first paint so latency is usually masked.
  // The loading message goes into the section's *body* div (which the
  // render functions also write to) — NEVER the section root, because
  // overwriting the section root destroys the filter-bar / rows-div
  // template that the next render() call expects to find.
  const needsGrad = active === "graduates"
      || active === "injured"       // injured rolls graduates + inactive into the pool
      || (active === "player" && !(DATA.players || []).some(p => p.player_key === state.view.key));
  const needsRosters = active === "farmDetail";
  const needsInactive = active === "injured"
      || (active === "player" && !(DATA.players || []).some(p => p.player_key === state.view.key));
  // Inner body element per section — must match where the per-section
  // render function writes its main content.
  const SECTION_BODY = {
    graduates:  "grad-rows",
    injured:    "injured-rows",
    farmDetail: "farm-detail-body",
    player:     "player-detail-body",
  };
  const showLoading = (msg) => {
    const id = SECTION_BODY[active];
    if (!id) return;
    const target = document.getElementById(id);
    if (target) target.innerHTML = `<div class="state-message">${msg}</div>`;
  };

  if (needsGrad && DATA._slices && DATA._slices.graduates && !DATA.graduates.length) {
    showLoading("Loading graduates…");
    loadSlice("graduates").then(render);
    return;
  }
  if (needsInactive && DATA._slices && DATA._slices.inactive
      && !DATA.inactive.length) {
    // Inactive is small; quiet wait — no loading message.
    loadSlice("inactive").then(render);
    return;
  }
  if (needsRosters && DATA._slices && DATA._slices.rosters_by_org
      && Object.keys(DATA.rosters_by_org).length === 0) {
    showLoading("Loading farm rosters…");
    loadSlice("rosters_by_org").then(render);
    return;
  }

  if (active === "player")       renderPlayerDetail(state.view.key);
  else if (active === "farmDetail") renderFarmDetail(state.view.org);
  else if (active === "active")     renderActives();
  else if (active === "spotlights") renderSpotlights();
  else if (active === "traded")     renderRecentlyTraded();
  else if (active === "injured")    renderInjured();
  else if (active === "graduates")  renderGraduates();
  else if (active === "farm")       renderFarmSystems();
  else if (active === "leaderboards") renderLeaderboards();
  else if (active === "glossary")   renderGlossary();
  else if (active === "watchlist")  renderWatchlist();
  decorateA11yRows();
  updateMeta();
  syncToURL();
}

// Phase 4 a11y: every list/grid row that the delegated click handler
// treats as activatable also needs tabindex + role so keyboard users
// can tab to it, AND a screen reader announces it as a button. We do
// this in one DOM walk after each render rather than threading the
// attrs through every renderXxx() function.
function decorateA11yRows() {
  document.querySelectorAll(".player-row[data-key], .spotlight-row[data-key], .grad-row[data-key], .farm-row[data-org], .pos-depth-card[data-key]").forEach(row => {
    if (!row.hasAttribute("tabindex")) row.setAttribute("tabindex", "0");
    if (!row.hasAttribute("role"))     row.setAttribute("role", "button");
  });
}

// Wire up a "pick exactly one chip" toggle group. Used by every
// per-tab sort/bucket selector — graduates, injured, spotlights, farm
// rank, form window. Each call swaps `active` between siblings, writes
// the chip's value to `state[stateKey]`, runs `onChange(value, btn)`,
// and syncs the URL. Spotlights also clears the detail view, hence the
// `clearView` option.
function attachChipGroup(attr, stateKey, onChange, opts = {}) {
  const { clearView = false } = opts;
  const sel = `[data-${attr}]`;
  const dsKey = attr.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
  document.querySelectorAll(sel).forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(sel).forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state[stateKey] = btn.dataset[dsKey];
      if (clearView) state.view = null;
      onChange(state[stateKey], btn);
      syncToURL();
    });
  });
}

// ============================================================
// COMPARISON CART
// ============================================================
// Lightweight client-side cart that pins up to 3 prospect keys in
// localStorage. Lets a user open any list/detail, hit "+ Compare", and
// review the side-by-side panel from anywhere. Persists across reload.
const COMPARE_KEY = "prospect-tracker.compare";
const COMPARE_MAX = 3;
// Farms get their own localStorage key + max so a user can pin 3 prospects
// AND 3 farm systems without one displacing the other. Render path joins
// them into a single side-panel with two sections.
const FARM_COMPARE_KEY = "prospect-tracker.farm-compare";
const FARM_COMPARE_MAX = 3;

// =========== WATCHLIST + NOTES ===========
// Watchlist is a single localStorage array of player_keys with no cap.
// Notes are stored one per player under prospect-tracker.notes:KEY so a
// note write doesn't read-modify-write the whole watchlist payload.
// Both are private to the browser — neither flows into the shareable
// compare URL, even if the user has dozens of starred players.
const WATCHLIST_KEY = "prospect-tracker.watchlist";
const NOTE_KEY_PREFIX = "prospect-tracker.notes:";

function watchlistLoad() {
  try {
    const raw = localStorage.getItem(WATCHLIST_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch { return []; }
}
function watchlistSave(keys) {
  try { localStorage.setItem(WATCHLIST_KEY, JSON.stringify(keys)); } catch {}
}
function watchlistHas(key) { return watchlistLoad().includes(key); }
function watchlistToggle(key) {
  let keys = watchlistLoad();
  keys = keys.includes(key) ? keys.filter(k => k !== key) : [...keys, key];
  watchlistSave(keys);
  syncWatchlistButtons();
  if (state.section === "watchlist") renderWatchlist();
  updateWatchlistTabBadge();

function syncWatchlistButtons() {
