  MIA: "mia", MIL: "mil", MIN: "min", NYM: "nym", NYY: "nyy",
  PHI: "phi", PIT: "pit", SDP: "sd",  SEA: "sea", SFG: "sf",
  STL: "stl", TBR: "tb",  TEX: "tex", TOR: "tor", WSN: "wsh",
};
function teamLogoURL(org) {
  if (!org) return null;
  const slug = ESPN_LOGO_SLUGS[org] || org.toLowerCase();
  return `https://a.espncdn.com/i/teamlogos/mlb/500/${slug}.png`;
}
// Render a team logo with an inline fallback when the CDN 404s. `size`
// must match a CSS class suffix (sm, md, lg, xl).
function teamLogoHTML(org, size = "sm", title = null) {
  if (!org) return "";
  const url = teamLogoURL(org);
  if (!url) {
    return `<span class="team-logo team-logo-${size} team-logo-fallback">${escapeHtml(org)}</span>`;
  }
  const t = title != null ? title : org;
  return `<img class="team-logo team-logo-${size}" src="${url}" alt="${escapeHtml(org)}" title="${escapeHtml(t)}" loading="lazy" onerror="this.outerHTML='<span class=&quot;team-logo team-logo-${size} team-logo-fallback&quot;>${escapeHtml(org)}</span>';">`;
}

// Performance-vs-level pill. Reads sl.level_plus_pct, sl.ops_plus_level
// (hitters) or sl.era_minus_level (pitchers). Returns "" when stats
// aren't yet available — the pill should never show as a question mark.
function levelPlusHTML(sl) {
  if (!sl || sl.level_plus_pct == null) return "";
  const pct = sl.level_plus_pct;
  const stat = sl.is_pitcher ? "ERA-" : "OPS+";
  const baseValue = sl.is_pitcher ? sl.era_minus_level : sl.ops_plus_level;
  // Threshold ±5% as the "okay" band so noise doesn't flip the color.
  const cls = pct >= 5 ? "lvl-good" : pct <= -5 ? "lvl-bad" : "lvl-okay";
  const sign = pct > 0 ? `+${pct}` : `${pct}`;
  const title = `${stat} ${baseValue} (${sign}% vs ${escapeHtml(sl.level || "?")} median)`;
  return `<span class="lvl-plus ${cls}" title="${title}">${sign}% vs lvl</span>`;
}

// IL badge for the player-meta line. Returns an empty string when the
// player isn't on IL; otherwise an amber pill showing the list type and
// duration in days. Tooltip carries the placement description.
function ilTagHTML(p) {
  const il = p && p.il_status;
  if (!il || !il.is_on_il) return "";
  let days = null;
  if (il.since) {
    const ms = Date.now() - new Date(il.since + "T00:00:00").getTime();
    if (!isNaN(ms) && ms > 0) days = Math.floor(ms / 86400000);
  }
  const typeLabel = il.type ? escapeHtml(il.type) + " IL" : "IL";
  const dayLabel = days != null ? ` · ${days}d` : "";
  const title = il.description
    ? escapeHtml(il.description) + (days != null ? `\n${days} days` : "")
    : `On ${typeLabel}${il.since ? ` since ${escapeHtml(il.since)}` : ""}`;
  return `<span class="il-tag" title="${title}">${typeLabel}${dayLabel}</span>`;
}

function updateMeta() {
  const refreshedAt = DATA.generated_at ? DATA.generated_at.split("T")[0] : "—";
  const meta = document.getElementById("meta-line");
  meta.innerHTML = `Last refresh: <code>${refreshedAt}</code>` +
    `<span class="dot">·</span>${DATA.total_tracked ?? (DATA.players.length + DATA.graduates.length)} prospects tracked` +
    `<span class="dot">·</span>${DATA.active_count} active` +
    `<span class="dot">·</span>${DATA.inactive_count ?? (DATA.inactive || []).length} inactive` +
    `<span class="dot">·</span>${DATA.graduate_count} graduates`;
  const tradedCount = DATA.players.filter(p => (p.trades || []).length > 0).length;
  const spotlightCount = ((DATA.spotlights || {})[state.spotlightBucket] || []).length;
  const countMap = {
    active:    `${getFilteredActives().length} of ${DATA.active_count}`,
    spotlights:`${spotlightCount} ${state.spotlightBucket.replace("_", " ")}`,
    traded:    `${getFilteredTraded().length} of ${tradedCount}`,
    inactive:  `${getFilteredInactives().length} of ${DATA.inactive_count ?? (DATA.inactive || []).length}`,
    graduates: `${getFilteredGrads().length} of ${DATA.graduate_count}`,
    farm:      `${(DATA.org_summary || []).length} organizations`,
  };
  document.getElementById("section-count").textContent = countMap[state.section] || "";
}

// Tiers descending; matches the fvClass thresholds used for badge colors.
const TIER_BUCKETS = [80, 75, 70, 65, 60, 55, 50, 45, 40, 35, 30, 25, 20];

function makeTierBar(prospects) {
  const total = (prospects || []).length;
  if (!total) return '<span style="color:var(--text-tertiary);font-size:11px;">—</span>';

  const counts = Object.fromEntries(TIER_BUCKETS.map(t => [t, 0]));
  prospects.forEach(p => {
    const n = parseInt(p.fv_label, 10);
    const tier = TIER_BUCKETS.find(t => n >= t) ?? 20;
    counts[tier]++;
  });

  const W = 110;
  let x = 0;
  const segments = TIER_BUCKETS.filter(t => counts[t] > 0).map(t => {
    const w = (counts[t] / total) * W;
    const rect = `<rect x="${x.toFixed(1)}" y="0" width="${w.toFixed(1)}" height="10" fill="var(--fv-${t}-fg)" opacity="0.9"><title>${counts[t]} × FV ${t}${t === 60 ? '+' : ''}</title></rect>`;
    x += w;
    return rect;
  }).join('');

  // Labels: show counts for the meaningful tiers (≥40), capped to 4.
  const labels = TIER_BUCKETS
    .filter(t => t >= 40 && counts[t] > 0)
    .slice(0, 4)
    .map(t => `<span style="color:var(--fv-${t}-fg);font-size:10px;">${counts[t]}×${t}</span>`)
    .join(' ');

  return `<div class="tier-bar">
    <svg width="${W}" height="10" style="border-radius:2px;overflow:hidden;flex-shrink:0">
      ${segments}
    </svg>
    <span>${labels}</span>
  </div>`;
}

function makePosBreakdown(posGroups) {
  const ORDER = ["C","1B","INF","OF","P","?"];
  const COLORS = { C:"#E8A020", "1B":"#C8A050", INF:"#3DBF7A", OF:"#5090E0", P:"var(--down)", "?":"var(--text-tertiary)" };
  return ORDER.filter(k => posGroups && posGroups[k]).map(k =>
    `<span class="pos-pill" style="background:${COLORS[k]}1a;color:${COLORS[k]};border:1px solid ${COLORS[k]}44;">${k}&nbsp;${posGroups[k]}</span>`
  ).join('');
}

// Render the per-level "graded prospects" pills used on the farm list.
// Hides MLB (graded MLB players are usually graduates; the row would
// always read zero) and skips DSL when the org has none, since most
// systems do not field a DSL squad and an always-zero pill is noise.
// activeLevel highlights the pill matching the current sort.
const FARM_DEPTH_LEVELS = ["AAA","AA","A+","A","Rk","DSL"];
function makeLevelDepth(levelCounts, activeLevel) {
  if (!levelCounts) return `<span style="color:var(--text-tertiary);font-size:10px;">—</span>`;
  return FARM_DEPTH_LEVELS
    .filter(lvl => lvl !== "DSL" || (levelCounts[lvl] || 0) > 0)
    .map(lvl => {
      const n = levelCounts[lvl] || 0;
      const cls = `level-pill${n === 0 ? " lp-zero" : ""}${lvl === activeLevel ? " lp-active" : ""}`;
      return `<span class="${cls}" title="${lvl}: ${n} graded prospect${n === 1 ? "" : "s"}">
        <span class="lp-label">${escapeHtml(lvl)}</span><span class="lp-count">${n}</span>
      </span>`;
    }).join("");
}

function farmSortedOrgs() {
  let orgs = (DATA.org_summary || []).slice();
  // Search filter: match against the 3-letter code OR full team name so
  // "nym", "mets", and "new york" all surface the Mets.
  if (state.search) {
    const q = state.search.toLowerCase();
    orgs = orgs.filter(o =>
      (o.org || "").toLowerCase().includes(q) ||
      fullOrgName(o.org).toLowerCase().includes(q)
    );
  }
  const s = state.farmSort;
  // "level_<LVL>" sorts by graded-prospect count at that affiliate level.
  // Defensive ?? 0 keeps orgs without a level-counts block (older exports)
  // at the bottom rather than NaN-poisoning the comparator.
  if (s && s.startsWith("level_")) {
    const lvl = s.slice("level_".length);
    orgs.sort((a, b) =>
      ((b.level_counts || {})[lvl] ?? 0) -
      ((a.level_counts || {})[lvl] ?? 0)
      || b.total_fv - a.total_fv);
    return orgs;
  }
  orgs.sort((a, b) => {
    if (s === "total_fv")  return b.total_fv  - a.total_fv;
    if (s === "count")     return b.count     - a.count;
    if (s === "tier_60")   return b.tier_60_plus - a.tier_60_plus;
    if (s === "avg_age")   return (a.avg_age ?? 99) - (b.avg_age ?? 99);
    if (s === "stock_up")  return b.stock_up  - a.stock_up;
    return a.farm_rank - b.farm_rank; // default
  });
  return orgs;
}

    <span>Avg age</span>

      : `<span class="stock-flat">—</span>`;

  document.getElementById("farm-rows").innerHTML = header + rows;

// Find a player (active, graduate, or inactive) by key.
function findPlayer(key) {
  return (DATA.players || []).find(p => p.player_key === key)
      || (DATA.graduates || []).find(g => g.player_key === key)
      || (DATA.inactive || []).find(p => p.player_key === key)
      || null;
}

function findOrg(org) {
  return (DATA.org_summary || []).find(o => o.org === org) || null;
}

// Bigger version of the line chart used on prospect detail pages — same
// 20-80 Y-axis as the inline sparkline, but rendered at ~2x size with
// gridlines at every 5-FV tick and date labels along the bottom.
function makeBigLineChart(points, fvOpen, fvClose, gradDate, trades, careerStats, player) {
  if (!points || points.length === 0) return "";
  const W = 720, H = 260, PAD_L = 28, PAD_R = 14, PAD_T = 14, PAD_B = 28;
  const innerW = W - PAD_L - PAD_R;
  const innerH = H - PAD_T - PAD_B;

  const firstDate = points[0].snapshot_date;
  const lastDate  = points[points.length - 1].snapshot_date;
  const endDate   = (gradDate && new Date(gradDate).getTime() > new Date(lastDate).getTime())
                      ? gradDate : lastDate;
  const minT = new Date(firstDate).getTime();
  const maxT = new Date(endDate).getTime();
  const timeSpan = maxT - minT || 1;
  const xScale = d => PAD_L + ((new Date(d).getTime() - minT) / timeSpan) * innerW;
  const yScale = fv => PAD_T + innerH - ((fv - FV_MIN) / (FV_MAX - FV_MIN)) * innerH;

  const isUp = fvClose > fvOpen, isDown = fvClose < fvOpen;
  const stroke = isUp ? "var(--up)" : isDown ? "var(--down)" : "var(--text-tertiary)";

  // Y-axis ticks every 5 FV
  const yTicks = [];
  for (let fv = 20; fv <= 80; fv += 5) {
    const y = yScale(fv).toFixed(1);
    yTicks.push(
      `<line x1="${PAD_L}" y1="${y}" x2="${W - PAD_R}" y2="${y}" stroke="var(--border-light)" stroke-width="0.4" stroke-dasharray="2,3"/>`,
      `<text x="${PAD_L - 4}" y="${y}" dy="3" font-size="9" fill="var(--text-tertiary)" text-anchor="end">${fv}</text>`,
    );
  }
  // 60-FV emphasis
  yTicks.push(`<line x1="${PAD_L}" y1="${yScale(60).toFixed(1)}" x2="${W - PAD_R}" y2="${yScale(60).toFixed(1)}" stroke="var(--neon-amber)" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.5"/>`);

  // Year boundaries
  const yearSvg = [];
  const startYear = new Date(minT).getFullYear();
  const endYear   = new Date(maxT).getFullYear();
  for (let yr = startYear; yr <= endYear + 1; yr++) {
    const yrT = Date.UTC(yr, 0, 1);
    if (yrT <= minT || yrT >= maxT) continue;
    const x = xScale(new Date(yrT).toISOString().slice(0, 10)).toFixed(1);
    yearSvg.push(
      `<line x1="${x}" y1="${PAD_T}" x2="${x}" y2="${H - PAD_B}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3,3"/>`,
      `<text x="${x}" y="${H - PAD_B + 14}" font-size="10" fill="var(--text-tertiary)" text-anchor="middle">${yr}</text>`,
    );
  }
  // Start + end date labels along the X axis
  const x0 = xScale(firstDate).toFixed(1);
  const x1 = xScale(endDate).toFixed(1);
  yearSvg.push(
    `<text x="${x0}" y="${H - 4}" font-size="9" fill="var(--text-tertiary)" text-anchor="start">${firstDate}</text>`,
    `<text x="${x1}" y="${H - 4}" font-size="9" fill="var(--text-tertiary)" text-anchor="end">${endDate}</text>`,
  );

  // Transaction markers — unified across all event types. Pulls from
  // the shared TRANSACTION_KINDS vocabulary so the glyph + color matches
  // what the mini sparkline shows for the same prospect. Falls through to
  // legacy trade-only rendering when called without a full player object.
  const events = player
    ? transactionEvents(player).filter(e => {
        const t = new Date(e.date).getTime();
        return !isNaN(t) && t >= minT && t <= maxT;
      })
    : [
        ...(trades || []).map(tr => ({
          date: tr.trade_date,
          kind: "trade",
          label: `${tr.trade_date} · ${tr.from_org ?? "?"} → ${tr.to_org ?? "?"}${tr.description ? "\n" + tr.description : ""}`,
        })),
        ...levelChangeEvents(careerStats || []).map(ev => ({
          date: ev.date,
          kind: ev.kind,
          label: `${ev.date.slice(0, 4)}: ${ev.kind === "promotion" ? "Promoted to" : "Demoted to"} ${ev.level} (from ${ev.prev_level})`,
        })),
      ].filter(e => {
        const t = new Date(e.date).getTime();
        return !isNaN(t) && t >= minT && t <= maxT;
      });

  const eventSvg = [];
  for (const ev of events) {
    const cfg = TRANSACTION_KINDS[ev.kind];
    if (!cfg) continue;
    const x = xScale(ev.date).toFixed(1);
    const label = escapeHtml(ev.label);
    const top = cfg.pos === "top";
    const yBase = H - PAD_B;
    const glyphY = top ? PAD_T + 6 : yBase - 2;
    eventSvg.push(
      `<line x1="${x}" y1="${PAD_T}" x2="${x}" y2="${yBase}" stroke="${cfg.color}" stroke-width="1.2" stroke-dasharray="${cfg.dash}" opacity="0.8"><title>${label}</title></line>`,
      `<text x="${x}" y="${glyphY.toFixed(1)}" font-size="11" fill="${cfg.color}" text-anchor="middle"><title>${label}</title>${cfg.glyph}</text>`,
    );
  }

  const pts = points.map(pt => `${xScale(pt.snapshot_date).toFixed(1)},${yScale(pt.consensus_fv_raw).toFixed(1)}`).join(" ");
  const circles = points.map(pt =>
    `<circle cx="${xScale(pt.snapshot_date).toFixed(1)}" cy="${yScale(pt.consensus_fv_raw).toFixed(1)}" r="3" fill="${stroke}"><title>${pt.snapshot_date} · ${pt.interval_label} · FV ${pt.consensus_fv_label}</title></circle>`
  ).join("");

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="FV trajectory">
    ${yTicks.join("")}
    ${yearSvg.join("")}
    ${eventSvg.join("")}
    <polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${circles}
  </svg>`;
}

// Compact inline legend that maps glyph+color → label for every kind in
// TRANSACTION_KINDS. Used under FV charts so a reader can decode any
// marker they see without having to hover for the tooltip.
function transactionLegend(kinds = TRANSACTION_LEGEND_ORDER) {
  return `<div style="font-size:10px;color:var(--text-tertiary);margin-top:4px;display:flex;gap:14px;flex-wrap:wrap;">
    ${kinds.map(k => {
      const c = TRANSACTION_KINDS[k];
      if (!c) return "";
      return `<span><span style="color:${c.color};font-weight:600;">${c.glyph}</span> ${c.label.toLowerCase()}</span>`;
    }).join("")}
  </div>`;
}

// =============================================================================
// FARM-SYSTEM CUMULATIVE FV STOCK CHART
// =============================================================================
// Renders the running-sum FV time series for one org. Two size variants:
//   variant="mini"  → 200×56 sparkline used in the farm-system list
//   variant="big"   → 720×260 detail chart used on the farm detail page
// Events (trades + graduations) sourced from org.fv_events surface as
// vertical markers with the unified TRANSACTION_KINDS vocabulary so the
// glyph+color matches the prospect-page indicators 1:1.
function makeOrgFvChart(org, variant = "big") {
  const series = org.fv_history || [];
  const events = org.fv_events  || [];
  if (series.length < 2) {
    return `<div style="color:var(--text-tertiary);font-size:12px;padding:6px 0;">Not enough history yet for a stock chart.</div>`;
  }

  const isMini = variant === "mini";
  const W = isMini ? 200 : 720;
  const H = isMini ? 56  : 240;
  const PAD_L = isMini ? 4  : 44;
  const PAD_R = isMini ? 4  : 14;
  const PAD_T = isMini ? 4  : 14;
  const PAD_B = isMini ? 9  : 26;
  const innerW = W - PAD_L - PAD_R;
  const innerH = H - PAD_T - PAD_B;

  const minT = new Date(series[0].date).getTime();
  const maxT = new Date(series[series.length - 1].date).getTime();
  const timeSpan = maxT - minT || 1;
  // Y range hugs the org's actual FV range so the line uses the full
  // chart height. Pad 5% top + bottom so peaks/troughs don't kiss the
  // border. Floor at 0 — cumulative FV can't be negative meaningfully.
  let yMin = Math.min(...series.map(p => p.total_fv));
  let yMax = Math.max(...series.map(p => p.total_fv));
  if (yMin === yMax) { yMin -= 1; yMax += 1; }
  const yRange = yMax - yMin;
  const yPad = yRange * 0.06;
  yMin = Math.max(0, yMin - yPad);
  yMax = yMax + yPad;
  const ySpan = yMax - yMin || 1;

  const xScale = d => PAD_L + ((new Date(d).getTime() - minT) / timeSpan) * innerW;
  const yScale = fv => PAD_T + innerH - ((fv - yMin) / ySpan) * innerH;

  // Direction color: green if last >= first, violet otherwise.
  const isUp = series[series.length - 1].total_fv >= series[0].total_fv;
  const stroke = isUp ? "var(--up)" : "var(--down)";
  const areaFill = isUp ? "rgba(31,122,58,0.14)" : "rgba(185,28,28,0.10)";

  // Y-axis ticks (big only) — 4 evenly-spaced reference lines.
  const yTickSvg = [];
  if (!isMini) {
    const tickStep = Math.max(50, Math.ceil(ySpan / 4 / 50) * 50);
    for (let v = Math.ceil(yMin / tickStep) * tickStep; v <= yMax; v += tickStep) {
      const y = yScale(v).toFixed(1);
      yTickSvg.push(
        `<line x1="${PAD_L}" y1="${y}" x2="${W - PAD_R}" y2="${y}" stroke="var(--border-light)" stroke-width="0.4" stroke-dasharray="2,3"/>`,
        `<text x="${PAD_L - 4}" y="${y}" dy="3" font-size="9" fill="var(--text-tertiary)" text-anchor="end">${v}</text>`,
      );
    }
  }

  // Year boundaries with labels (big chart only — mini stays uncluttered).
  const yearSvg = [];
  const startYear = new Date(minT).getFullYear();
  const endYear   = new Date(maxT).getFullYear();
  for (let yr = startYear; yr <= endYear + 1; yr++) {
    const yrT = Date.UTC(yr, 0, 1);
    if (yrT <= minT || yrT >= maxT) continue;
    const isoDate = new Date(yrT).toISOString().slice(0, 10);
    const x = xScale(isoDate).toFixed(1);
    if (isMini) {
      yearSvg.push(
        `<line x1="${x}" y1="${PAD_T}" x2="${x}" y2="${H - PAD_B}" stroke="var(--border)" stroke-width="0.4" stroke-dasharray="2,3"/>`,
        `<text x="${x}" y="${H - 1}" font-size="6.5" fill="var(--text-tertiary)" text-anchor="middle">${yr}</text>`,
      );
    } else {
      yearSvg.push(
        `<line x1="${x}" y1="${PAD_T}" x2="${x}" y2="${H - PAD_B}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3,3"/>`,
        `<text x="${x}" y="${H - PAD_B + 14}" font-size="10" fill="var(--text-tertiary)" text-anchor="middle">${yr}</text>`,
      );
    }
  }

  // Build the area + line path. Use polyline for stroke + a closed path
  // for the soft area fill below the line (signals direction at a glance).
  const pts = series.map(s => `${xScale(s.date).toFixed(1)},${yScale(s.total_fv).toFixed(1)}`).join(" ");
  const areaPts = `${PAD_L},${(PAD_T + innerH).toFixed(1)} ${pts} ${(PAD_L + innerW).toFixed(1)},${(PAD_T + innerH).toFixed(1)}`;

  // Event markers — trades (violet) and graduations (gold). Threshold the
  // FV impact so chart isn't littered with 0-FV pre-ranking trades — those
  // happened before the player had a tracked grade and don't move the line.
  // The big chart shows all >0 events; the mini sparkline shows only the
  // larger ones (≥10 FV) to keep the marker density readable.
  const minFv = isMini ? 10 : 1;
  const eventSvg = [];
  for (const ev of events) {
    if (!ev.date || (ev.fv || 0) < minFv) continue;
    const t = new Date(ev.date).getTime();
    if (isNaN(t) || t < minT || t > maxT) continue;
    const cfg = TRANSACTION_KINDS[ev.kind];
    if (!cfg) continue;
    const x = xScale(ev.date).toFixed(1);
    const top = cfg.pos === "top";
    const yBase = H - PAD_B;
    const glyphY = top ? PAD_T + (isMini ? 4 : 6) : yBase - 2;
    const fontSize = isMini ? 6.5 : 11;
    // Direction-aware label: "+ X FV from MIA" reads better than "in / MIA"
    const dirSym = ev.direction === "in" ? "+" : ev.direction === "out" ? "−" : "";
    let label;
    if (ev.kind === "trade") {
      label = `${ev.date} · ${ev.player_name} (${dirSym}${ev.fv} FV) ${ev.direction === "in" ? "from" : "to"} ${ev.other_org}`;
    } else if (ev.kind === "graduation") {
      label = `${ev.date} · ${ev.player_name} graduated (${ev.fv} FV)`;
    } else {
      label = `${ev.date} · ${ev.player_name}`;
    }
    label = escapeHtml(label);
    eventSvg.push(
      `<line x1="${x}" y1="${PAD_T}" x2="${x}" y2="${yBase}" stroke="${cfg.color}" stroke-width="${isMini ? 0.9 : 1.2}" stroke-dasharray="${cfg.dash}" opacity="${isMini ? 0.6 : 0.7}"><title>${label}</title></line>`,
      `<text x="${x}" y="${glyphY.toFixed(1)}" font-size="${fontSize}" fill="${cfg.color}" text-anchor="middle"><title>${label}</title>${cfg.glyph}</text>`,
    );
  }

  // Start + end date labels on the big variant.
  const xLabelsSvg = [];
  if (!isMini) {
    const x0 = xScale(series[0].date).toFixed(1);
    const x1 = xScale(series[series.length - 1].date).toFixed(1);
    xLabelsSvg.push(
      `<text x="${x0}" y="${H - 4}" font-size="9" fill="var(--text-tertiary)" text-anchor="start">${series[0].date}</text>`,
      `<text x="${x1}" y="${H - 4}" font-size="9" fill="var(--text-tertiary)" text-anchor="end">${series[series.length - 1].date}</text>`,
    );
  }

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" ${isMini ? 'preserveAspectRatio="none"' : ""} role="img" aria-label="Cumulative FV history">
    ${yTickSvg.join("")}
    ${yearSvg.join("")}
    <polygon points="${areaPts}" fill="${areaFill}" stroke="none"/>
    ${eventSvg.join("")}
    <polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="${isMini ? 1.5 : 2}" stroke-linecap="round" stroke-linejoin="round"/>
    ${xLabelsSvg.join("")}
  </svg>`;
}

// Year-by-year stat table for the prospect page.
function makeCareerTable(career) {
  if (!career || !career.length) {
    return `<div style="color:var(--text-tertiary);font-size:12px;">No multi-season stats available.</div>`;
  }
  const isP = career[0].is_pitcher;
  const head = isP
    ? `<tr><th>Season</th><th>Level</th><th>G</th><th>IP</th><th>ERA</th><th>WHIP</th><th>K/9</th><th>BB/9</th><th>W-L</th></tr>`
    : `<tr><th>Season</th><th>Level</th><th>G</th><th>AVG</th><th>OBP</th><th>SLG</th><th>OPS</th><th>HR</th><th>SB</th><th>BB%</th><th>K%</th></tr>`;
  const rows = career.map(s => isP
    ? `<tr><td>${s.season}</td><td><span class="level-pill level-neutral">${s.level}</span></td><td>${s.games}</td><td>${s.ip ?? "—"}</td><td>${s.era ?? "—"}</td><td>${s.whip ?? "—"}</td><td>${s.k_per_9 ?? "—"}</td><td>${s.bb_per_9 ?? "—"}</td><td>${s.wins}-${s.losses}</td></tr>`
    : `<tr><td>${s.season}</td><td><span class="level-pill level-neutral">${s.level}</span></td><td>${s.games}</td><td>${s.avg}</td><td>${s.obp}</td><td>${s.slg}</td><td>${s.ops}</td><td>${s.hr}</td><td>${s.sb}</td><td>${s.bb_pct != null ? s.bb_pct.toFixed(1) : "—"}</td><td>${s.k_pct != null ? s.k_pct.toFixed(1) : "—"}</td></tr>`
  ).join("");
  return `<table class="detail-table"><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}

// Statcast block — exit velo / hard hit / launch angle / barrel %.
function makeStatcastBlock(sc) {
  if (!sc) return `<div style="color:var(--text-tertiary);font-size:12px;">No Statcast data on file.</div>`;
  const tiles = [
    ["Exit velo",   sc.exit_velo != null ? `${sc.exit_velo} mph` : "—"],
    ["Hard hit %",  sc.hard_hit_pct != null ? `${sc.hard_hit_pct}%` : "—"],
    ["Launch angle",sc.launch_angle != null ? `${sc.launch_angle}°` : "—"],
    ["Barrel %",    sc.barrel_pct != null ? `${sc.barrel_pct}%` : "—"],
  ];
  return `<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;">${tiles.map(([k, v]) => `
    <div class="stat-tile">
      <div class="stat-label">${k}</div>
      <div class="stat-value" style="color:var(--neon-cyan);font-family:var(--font-mono);font-size:17px;">${v}</div>
    </div>`).join("")}</div>`;
}

// Pitch arsenal block — pitch type × usage % × avg velo.
function makeArsenalBlock(pa) {
  if (!pa || !(pa.pitches || []).length) {
    return `<div style="color:var(--text-tertiary);font-size:12px;">No pitch arsenal data on file.</div>`;
  }
  const rows = pa.pitches.map(p => `<tr>
    <td><span class="src-tag">${escapeHtml(p.pitch_type)}</span> ${escapeHtml(p.pitch_name)}</td>
    <td style="text-align:right;font-variant-numeric:tabular-nums;">${p.avg_speed != null ? p.avg_speed.toFixed(1) + " mph" : "—"}</td>
    <td style="text-align:right;font-variant-numeric:tabular-nums;">${p.usage_pct != null ? (p.usage_pct * 100).toFixed(1) + "%" : "—"}</td>
  </tr>`).join("");
  const fb = pa.fb_velo != null ? `<div style="font-size:11px;color:var(--text-tertiary);margin-bottom:6px;">Primary fastball: <span style="color:var(--neon-green);">${pa.fb_velo} mph</span></div>` : "";
  return fb + `<table class="detail-table"><thead><tr><th>Pitch</th><th style="text-align:right;">Velo</th><th style="text-align:right;">Usage</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// Trade history block on the prospect page — every real trade, oldest first.
function makeTradeHistoryBlock(trades) {
  if (!trades || !trades.length) {
    return `<div style="color:var(--text-tertiary);font-size:12px;">No trades on record.</div>`;
  }
  const rows = trades.map(t => `<tr>
    <td style="white-space:nowrap;">${t.trade_date}</td>
    <td style="white-space:nowrap;">${escapeHtml(t.from_org ?? "?")} <span style="color:var(--neon-violet);">→</span> ${escapeHtml(t.to_org ?? "?")}</td>
    <td style="color:var(--text-secondary);font-size:11px;line-height:1.45;">${escapeHtml(t.description || "")}</td>
  </tr>`).join("");
  return `<table class="detail-table"><thead><tr><th>Date</th><th>Move</th><th>Description</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// Per-source FV history — shows the full breakdown of how each ranking
// source has graded the player over time.
function makePerSourceHistory(points) {
  // Collect every source that ever appeared, plus the most recent FV they
  // assigned at each snapshot date.
  const sources = new Set();
  for (const pt of points) {
    for (const src of Object.keys(pt.per_source || {})) sources.add(src);
  }
  if (!sources.size) {
    return `<div style="color:var(--text-tertiary);font-size:12px;">No per-source breakdown available.</div>`;
  }
  const sortedSources = [...sources].sort();
  const head = `<tr><th>Date</th><th>Update</th>${sortedSources.map(s => `<th>${escapeHtml(SOURCE_LABELS[s] || s)}</th>`).join("")}<th>Consensus</th></tr>`;
  const body = points.map(pt => {
    const perSrc = pt.per_source || {};
    return `<tr>
      <td>${pt.snapshot_date}</td>
      <td><span class="src-tag">${escapeHtml(pt.interval_label)}</span></td>
      ${sortedSources.map(s => {
        const d = perSrc[s];
        if (!d) return `<td style="color:var(--text-tertiary);">—</td>`;
        const fv = d.fv_published != null
          ? `<span class="fv-badge ${fvClass(String(d.fv_published))}" style="font-size:10px;padding:1px 6px;">${d.fv_published}</span>`
          : "—";
        const rank = d.rank != null ? `<span style="font-size:10px;color:var(--text-tertiary);"> #${d.rank}</span>` : "";
        return `<td>${fv}${rank}</td>`;
      }).join("")}
      <td><span class="fv-badge ${fvClass(pt.consensus_fv_label)}" style="font-size:10px;padding:1px 6px;">${pt.consensus_fv_label}</span></td>
    </tr>`;
  }).join("");
  return `<table class="detail-table"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

function renderPlayerDetail(key) {
  const p = findPlayer(key);
  const root = document.getElementById("player-detail-body");
  if (!p) {
    root.innerHTML = `<div class="state-message">Unknown prospect: ${escapeHtml(key)}. <a href="#" onclick="goHome();return false;">Back to list</a>.</div>`;
    return;
  }
  const latest = p.points && p.points.length ? p.points[p.points.length - 1] : null;
  const orgLink = p.org
    ? `<a href="#farm-org=${escapeHtml(p.org)}" onclick="event.preventDefault();goToFarm('${escapeHtml(p.org)}');" style="color:var(--neon-cyan);text-decoration:none;">${escapeHtml(p.org)}</a>`
    : "—";
  // Header status pill — graduated wins over IL when both apply (a
  // graduated player who later goes on the MLB IL is now an MLB story,
  // not a prospect-tracker story).
  const ilNow = p.il_status && p.il_status.is_on_il ? p.il_status : null;
  let ilDays = null;
  if (ilNow && ilNow.since) {
    const ms = Date.now() - new Date(ilNow.since + "T00:00:00").getTime();
    if (!isNaN(ms) && ms > 0) ilDays = Math.floor(ms / 86400000);
  }
  const statusPill = p.status === "graduated"
    ? `<span class="grad-pill" style="background:var(--bg-tertiary);color:var(--grad);">Graduated ${p.graduation_date || ""}</span>`
    : ilNow
      ? `<span class="grad-pill" style="background:rgba(201,162,39,0.10);color:var(--neon-amber);border-color:var(--neon-amber);">${escapeHtml(ilNow.type || "?")} IL${ilDays != null ? ` · ${ilDays}d` : ""}</span>`
      : "";

  const avl = p.age_vs_level || {};
  const fvLabel = latest ? latest.consensus_fv_label : "—";
  const fvBadge = latest ? `<span class="fv-badge ${fvClass(fvLabel)}" style="font-size:22px;padding:5px 14px;min-width:60px;margin-top:4px;">${fvLabel}</span>` : "";

  // Rank pills — overall position in the FV-sorted active list, plus org
  // position. Hidden for graduates/inactives where these fields are null.
  const rankPill = (label, val, color) => `<span style="font-family:var(--font-mono);font-size:11px;color:${color};background:var(--bg-tertiary);border:1px solid var(--border);padding:3px 9px;border-radius:2px;letter-spacing:0;font-weight:700;font-variant-numeric:tabular-nums;"><span style="font-family:var(--font-sans);font-weight:600;letter-spacing:0.04em;text-transform:uppercase;font-size:10px;color:var(--text-tertiary);margin-right:4px;">${label}</span>${val}</span>`;
  const rankPills = (p.overall_rank != null || p.org_rank != null)
    ? `<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;">
        ${p.overall_rank != null ? rankPill("Overall", "#" + p.overall_rank, "var(--neon-violet)") : ""}
        ${p.org_rank != null ? rankPill(escapeHtml(p.org || "?"), "#" + p.org_rank + (p.org_rank_total ? " of " + p.org_rank_total : ""), "var(--neon-cyan)") : ""}
      </div>`
    : "";

  const header = `
    <a href="#" onclick="event.preventDefault();goHome();" class="back-link">← Back to list</a>
    <div class="detail-page-header" style="${orgStripe(p.org)}">
      <div style="display:flex;align-items:flex-start;gap:16px;">
        ${teamLogoHTML(p.org, "lg", p.org ? fullOrgName(p.org) : "")}
        <div>
          <div class="player-display-name">${escapeHtml(p.player_name)}</div>
          <div class="player-display-meta">
            <strong style="font-weight:600;color:var(--text-primary);">${escapeHtml(p.position ?? "—")}</strong> · ${orgLink}${p.age != null ? ` · age ${p.age.toFixed(1)}` : ""}${p.birth_date ? ` · born ${p.birth_date}` : ""}
            ${statusPill ? " · " + statusPill : ""}
          </div>
          ${rankPills}
        </div>
      </div>
      <div style="text-align:right;">
        <div style="font-family:var(--font-sans);font-size:10px;color:var(--text-tertiary);letter-spacing:0.08em;text-transform:uppercase;font-weight:600;">Current FV</div>
        ${fvBadge}
        ${latest && latest.avg_rank != null ? `<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);margin-top:4px;">Avg rank #${latest.avg_rank.toFixed(1)}</div>` : ""}
      </div>
    </div>`;

  // Highlight tiles: FV high/low/open/close, age vs level, ETA. The
  // age-vs-level subline cites the empirical median age at the prospect's
  // current level so users can see what we're comparing against.
  const eta = p.eta || {};
  const sl = p.statline || {};
  const levelNorm = (DATA.level_norms || {})[sl.level] || {};
  const ageNorm = levelNorm.age || {};
  const perfNorm = levelNorm.perf || {};
  const ageSub = (avl.tier && avl.tier !== "unknown" && ageNorm.median_age != null)
    ? `${sl.level} median ${ageNorm.median_age.toFixed(1)}y`
    : "";
  const tiles = [
    ["FV high", p.fv_high_label || p.fv_high || "—", `${p.fv_high_date || ""}`],
    ["FV low",  p.fv_low_label  || p.fv_low  || "—", `${p.fv_low_date || ""}`],
    ["FV open", p.fv_open ?? "—", ""],
    ["FV close",p.fv_close ?? "—", ""],
    ["Age vs. level", avl.tier && avl.tier !== "unknown"
        ? avl.tier.replace(/-/g, " ") + (avl.diff != null ? ` (${avl.diff > 0 ? "+" : ""}${avl.diff.toFixed(1)}y)` : "")
        : "—", ageSub],
    ["ETA", eta.year != null ? eta.year : "—", eta.confidence ? `${eta.confidence} conf` : ""],
  ];
  const tilesHtml = `<div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:20px;">${tiles.map(([k, v, sub]) => `
    <div class="stat-tile">
      <div class="stat-label">${k}</div>
      <div class="stat-value">${v}</div>
      ${sub ? `<div class="stat-sub">${sub}</div>` : ""}
    </div>`).join("")}</div>`;

  // Level benchmark block — shows the empirical age/OPS/ERA medians
  // at every level the player has touched in their career_stats, plus
  // the player's own ages/ops at each one so you can read off
  // "young for level" vs "above-average performance" at a glance.
  const levelBenchmarkSection = (() => {
    const career = p.career_stats || [];
    if (!career.length) return "";
    const isP = career[0].is_pitcher;
    const rows = career.map(c => {
      const norm = (DATA.level_norms || {})[c.level] || {};
      const a = norm.age || {};
      const perf = norm.perf || {};
      const seasonMid = new Date(`${c.season}-07-01`).getTime();
      let ageAtSeason = null;
      if (p.birth_date) {
        const birthT = new Date(p.birth_date).getTime();
        ageAtSeason = ((seasonMid - birthT) / (365.25 * 86400000));
      }
      const ageDiff = (ageAtSeason != null && a.median_age != null)
        ? (ageAtSeason - a.median_age) : null;
      const ageDiffHtml = ageDiff != null
        ? `<span style="color:${ageDiff <= -1 ? "var(--up)" : ageDiff >= 1 ? "var(--down)" : "var(--text-tertiary)"};">${ageDiff > 0 ? "+" : ""}${ageDiff.toFixed(1)}y</span>`
        : "—";
      const perfCol = isP
        ? (c.era != null && perf.avg_era != null
            ? `${c.era} vs ${perf.avg_era.toFixed(2)} <span style="color:${parseFloat(c.era) < perf.avg_era ? "var(--up)" : "var(--down)"};">(${(parseFloat(c.era) - perf.avg_era).toFixed(2)})</span>`
            : "—")
        : (c.ops != null && perf.avg_ops != null
            ? `${c.ops} vs ${perf.avg_ops.toFixed(3)} <span style="color:${parseFloat(c.ops) > perf.avg_ops ? "var(--up)" : "var(--down)"};">(${(parseFloat(c.ops) - perf.avg_ops > 0 ? "+" : "")}${(parseFloat(c.ops) - perf.avg_ops).toFixed(3)})</span>`
            : "—");
      return `<tr>
        <td>${c.season}</td>
        <td><span class="level-pill level-neutral">${c.level}</span></td>
        <td style="font-variant-numeric:tabular-nums;">${ageAtSeason != null ? ageAtSeason.toFixed(1) : "—"} vs ${a.median_age != null ? a.median_age.toFixed(1) : "—"} ${ageDiffHtml}</td>
        <td style="font-variant-numeric:tabular-nums;">${perfCol}</td>
      </tr>`;
    }).join("");
    const perfHeader = isP ? "ERA vs level median" : "OPS vs level median";
    return `<div class="detail-title" style="margin-top:18px;">Age-relative performance</div>
      <table class="detail-table"><thead><tr><th>Season</th><th>Level</th><th>Age vs level median</th><th>${perfHeader}</th></tr></thead><tbody>${rows}</tbody></table>`;
  })();

  const isPitcher = p.position && /^(RHP|LHP|SP|RP|MIRP|SIRP)/.test(p.position);

  const chartSection = (p.points && p.points.length >= 2)
    ? `<div class="detail-title">FV history</div>${makeBigLineChart(p.points, p.fv_open, p.fv_close, p.graduation_date, p.trades, p.career_stats, p)}
       ${transactionLegend()}`
    : `<div style="color:var(--text-tertiary);font-size:12px;">Not enough FV updates yet for a chart.</div>`;

  const careerSection = `<div class="detail-title" style="margin-top:18px;">Stats by season</div>${makeCareerTable(p.career_stats)}`;

  const sourceSection = `<div class="detail-title" style="margin-top:18px;">Source-by-source FV history</div>${makePerSourceHistory(p.points || [])}`;

  const statcastSection = `<div class="detail-title">Statcast</div>${makeStatcastBlock(p.statcast)}`;

  const arsenalSection = isPitcher
    ? `<div class="detail-title" style="margin-top:18px;">Pitch arsenal</div>${makeArsenalBlock(p.pitch_arsenal)}`
    : "";

  const tradesSection = `<div class="detail-title" style="margin-top:18px;">Transaction history</div>${makeTradeHistoryBlock(p.trades)}`;

  // Acquisition info: drafted prospects show pick + bonus; IFAs show
  // "International FA" + (when known) signing details. Section omitted
  // when we don't have an acquisition record (rare — only prospects whose
  // MLBAM ID couldn't be resolved at all).
  const acqSection = (() => {
    const a = p.acquisition;
    if (!a) return "";
    const fmtBonus = b => b == null ? "—" : `$${b.toLocaleString("en-US")}`;
    if (a.method === "draft") {
      const pick = a.pick_overall != null
        ? `Round ${escapeHtml(a.round_label || "?")} · Pick ${a.pick_overall} overall`
        : `Round ${escapeHtml(a.round_label || "?")}`;
      const team = a.team_name ? ` by ${escapeHtml(a.team_name)}` : "";
      const school = a.school ? `<div style="font-size:11px;color:var(--text-tertiary);margin-top:2px;">From ${escapeHtml(a.school)}</div>` : "";
      return `<div class="detail-title" style="margin-top:18px;">Acquisition · MLB Draft</div>
        <div style="border:1px solid var(--border-light);background:var(--bg-secondary);padding:10px 12px;border-radius:2px;">
          <div style="font-size:14px;color:var(--text-primary);">${a.year} · ${pick}${team}</div>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">Signing bonus: <span style="color:var(--neon-cyan);font-variant-numeric:tabular-nums;">${fmtBonus(a.bonus_usd)}</span></div>
          ${school}
        </div>`;
    }
    if (a.method === "international_fa") {
      // Headline mirrors the draft block: "<year> · Signed by <team>".
      // Falls through gracefully when partial fields are missing — we
      // always have at least one of (year, team, generic label).
      const team = a.team_name ? `Signed by ${escapeHtml(a.team_name)}` : "Signed as an international amateur free agent";
      const headline = a.year
        ? `${a.year} · ${team}`
        : team;
      // Render the precise signing date on its own line when present.
      // Date arrives as ISO (YYYY-MM-DD); format to "Jul 2, 2019" for
      // readability. Skip the line when only the year is known (it'd
      // duplicate the headline).
      let dateLine = "";
      if (a.signing_date) {
        const d = new Date(a.signing_date + "T00:00:00");
        const formatted = isNaN(d.getTime())
          ? a.signing_date
          : d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
        dateLine = `<div style="font-size:11px;color:var(--text-tertiary);margin-top:2px;">Signed ${escapeHtml(formatted)}</div>`;
      }
      const bonusLine = a.bonus_usd != null
        ? `<div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">Signing bonus: <span style="color:var(--neon-cyan);font-variant-numeric:tabular-nums;">${fmtBonus(a.bonus_usd)}</span></div>`
        : `<div style="font-size:11px;color:var(--text-tertiary);margin-top:4px;">Signing-bonus data not on file.</div>`;
      return `<div class="detail-title" style="margin-top:18px;">Acquisition · International FA</div>
        <div style="border:1px solid var(--border-light);background:var(--bg-secondary);padding:10px 12px;border-radius:2px;">
          <div style="font-size:14px;color:var(--text-primary);">${headline}</div>
          ${bonusLine}
          ${dateLine}
        </div>`;
    }
    return "";
  })();

  // Injury block — only shown when the player is currently on IL.
  // Combines the placement description, list type, since-date, and a
  // running day counter so a reader gets full context without scrolling
  // to the transaction history table.
  const ilSection = (() => {
    const il = p.il_status;
    if (!il || !il.is_on_il) return "";
    let days = null;
    if (il.since) {
      const ms = Date.now() - new Date(il.since + "T00:00:00").getTime();
      if (!isNaN(ms) && ms > 0) days = Math.floor(ms / 86400000);
    }
    let sinceFmt = il.since;
    if (il.since) {
      const d = new Date(il.since + "T00:00:00");
      if (!isNaN(d.getTime())) {
        sinceFmt = d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
      }
    }
    const desc = il.description
      ? `<div style="font-size:11px;color:var(--text-secondary);margin-top:6px;line-height:1.4;">${escapeHtml(il.description)}</div>`
      : "";
    return `<div class="detail-title" style="margin-top:18px;color:var(--neon-amber);">Currently on ${escapeHtml(il.type || "?")} IL</div>
      <div style="border:1px solid rgba(201,162,39,0.45);background:rgba(201,162,39,0.10);padding:12px 14px;border-radius:var(--radius-sm);">
        <div style="font-size:14px;color:var(--text-primary);">
          Since ${escapeHtml(sinceFmt || "—")}${days != null ? ` <span style="color:var(--neon-amber);font-variant-numeric:tabular-nums;">· ${days} day${days === 1 ? "" : "s"}</span>` : ""}
        </div>
        ${desc}
      </div>`;
  })();

  // Current-org acquisition. Renders ONLY when the player's current org
  // acquired them via something OTHER than their original draft/IFA path
  // (i.e. they've been moved between orgs at least once). Pairs with the
  // original-acquisition block above to give a complete provenance: where
  // they entered pro ball AND how their current org got them.
  const ACQUISITION_LABELS = {
    draft:             "MLB Draft",
    international_fa:  "International FA",
    trade:             "Trade",
    waiver:            "Waiver claim",
    rule_5:            "Rule 5",
    free_agent:        "Free-agent signing",
    contract_purchase: "Contract purchase",
    unknown:           "Unknown",
  };
  const currentAcqSection = (() => {
    const ca = p.current_acquisition;
    if (!ca) return "";
    const m = ca.method;
    // Skip when the current acquisition is just the original draft/IFA —
    // already rendered by the acqSection above. Also skip "unknown".
    if (m === "draft" || m === "international_fa" || m === "unknown") return "";
    const ev = ca.event || {};
    const label = ACQUISITION_LABELS[m] || m;
    const from = ev.from_org ? escapeHtml(ev.from_org) : "?";
    const to   = ev.to_org   ? escapeHtml(ev.to_org)   : "?";
    let dateLine = "";
    if (ev.date) {
      const d = new Date(ev.date + "T00:00:00");
      const fmt = isNaN(d.getTime())
        ? ev.date
        : d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
      dateLine = `<div style="font-size:11px;color:var(--text-tertiary);margin-top:2px;">${escapeHtml(fmt)}</div>`;
    }
    const desc = ev.description
      ? `<div style="font-size:11px;color:var(--text-secondary);margin-top:6px;line-height:1.4;">${escapeHtml(ev.description)}</div>`
      : "";
    return `<div class="detail-title" style="margin-top:18px;">Acquired by current org · ${escapeHtml(label)}</div>
      <div style="border:1px solid var(--border-light);background:var(--bg-secondary);padding:10px 12px;border-radius:2px;">
        <div style="font-size:14px;color:var(--text-primary);">From ${from} <span style="color:var(--neon-violet);">→</span> ${to}</div>
        ${dateLine}
        ${desc}
      </div>`;
  })();

  const etaRows = (() => {
    if (!eta || eta.year == null) return "";
    const r = [
      ["Level baseline", eta.base_years != null ? `${eta.base_years.toFixed(1)} yrs` : "—"],
      ["Performance",    eta.perf_adj > 0 ? `+${eta.perf_adj}` : eta.perf_adj < 0 ? `${eta.perf_adj}` : "±0"],
      ["Age vs. level",  eta.age_adj  > 0 ? `+${eta.age_adj}`  : eta.age_adj  < 0 ? `${eta.age_adj}`  : "±0"],
      ["FV grade",       eta.fv_adj   > 0 ? `+${eta.fv_adj}`   : eta.fv_adj   < 0 ? `${eta.fv_adj}`   : "±0"],
    ];
    return `<div class="detail-title" style="margin-top:18px;">ETA breakdown · ${eta.year} (${eta.confidence || "?"} confidence)</div>
      <table class="detail-table"><tbody>${r.map(([k, v]) => `<tr><td>${k}</td><td style="text-align:right;">${v}</td></tr>`).join("")}</tbody></table>`;
  })();

  // Two-column layout: chart + career on the left, secondary blocks on the right.
  root.innerHTML = header + tilesHtml + `
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:24px;align-items:start;">
      <div>${chartSection}${careerSection}${levelBenchmarkSection}${sourceSection}</div>
      <div>${ilSection}${statcastSection}${arsenalSection}${acqSection}${currentAcqSection}${tradesSection}${etaRows}</div>
    </div>`;
}

// ---------------------------------------------------------------------------
// FARM SYSTEM DETAIL PAGE
// ---------------------------------------------------------------------------

function renderFarmDetail(orgCode) {
  const org = findOrg(orgCode);
  const root = document.getElementById("farm-detail-body");
  if (!org) {
    root.innerHTML = `<div class="state-message">Unknown organization: ${escapeHtml(orgCode)}. <a href="#" onclick="goHome();return false;">Back to list</a>.</div>`;
    return;
  }

  // Resolve full player objects so we can render each roster line with its
  // FV trajectory chart inline. The acquisition filter (shared with the
  // main prospect list via state.acqFilter) narrows the roster to only
  // prospects acquired by this org via the chosen method.
  const rosterPlayersAll = (DATA.players || []).filter(p => p.org === orgCode);
  const rosterPlayers = state.acqFilter !== "all"
    ? rosterPlayersAll.filter(p => ((p.current_acquisition || {}).method || "unknown") === state.acqFilter)
    : rosterPlayersAll.slice();
  rosterPlayers.sort((a, b) => {
    const fa = a.points.length ? a.points[a.points.length - 1].consensus_fv_raw : 0;
    const fb = b.points.length ? b.points[b.points.length - 1].consensus_fv_raw : 0;
    return fb - fa;
  });

  const graduates = (DATA.graduates || []).filter(g => g.org === orgCode);

  // Recent trades involving this org — pulled from every player's trades.
  // from_org / to_org are canonical 3-letter codes in the exported JSON, so
  // a direct equality check is sufficient. Trades for graduates are tagged
  // so we can label them on the page.
  const allTradesForOrg = [];
  const seen = new Set();
  for (const p of rosterPlayers) {
    for (const t of (p.trades || [])) {
      if (t.from_org === orgCode || t.to_org === orgCode) {
        const k = `${p.player_key}|${t.trade_date}|${t.from_org}|${t.to_org}`;
        if (seen.has(k)) continue;
        seen.add(k);
        allTradesForOrg.push({ player: p, trade: t, graduate: false });
      }
    }
  }
  for (const p of graduates) {
    for (const t of (p.trades || [])) {
      if (t.from_org === orgCode || t.to_org === orgCode) {
        const k = `${p.player_key}|${t.trade_date}|${t.from_org}|${t.to_org}`;
        if (seen.has(k)) continue;
        seen.add(k);
        allTradesForOrg.push({ player: p, trade: t, graduate: true });
      }
    }
  }
  allTradesForOrg.sort((a, b) => b.trade.trade_date.localeCompare(a.trade.trade_date));

  const header = `
    <a href="#" onclick="event.preventDefault();goHome();" class="back-link">← Back to list</a>
    <div class="detail-page-header" style="${orgStripe(org.org)}">
      <div style="display:flex;align-items:center;gap:16px;">
        ${teamLogoHTML(org.org, "xl", fullOrgName(org.org))}
        <div>
          <div class="player-display-name">${escapeHtml(fullOrgName(org.org))}</div>
          <div class="player-display-meta">
            <span style="font-family:var(--font-mono);color:var(--text-tertiary);letter-spacing:0.08em;margin-right:8px;font-weight:600;">${escapeHtml(org.org)}</span>
            Farm rank <strong style="font-family:var(--font-mono);color:var(--text-primary);">#${org.farm_rank}</strong> of 30 · ${org.count} prospects tracked · Total FV <strong style="font-family:var(--font-mono);color:var(--text-primary);">${org.total_fv != null ? org.total_fv.toFixed(1) : "—"}</strong>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">${makeTierBar(org.prospects)}</div>
    </div>`;

  // Tiles: tier counts, avg age, stock, very-young
  const tileRows = [
    ["60+ FV",     org.tier_60_plus],
    ["55 FV",      org.tier_55],
    ["50 FV",      org.tier_50],
    ["Avg age",    org.avg_age != null ? org.avg_age.toFixed(1) : "—"],
    ["Stock ▲",    org.stock_up],
    ["Stock ▼",    org.stock_down],
    ["Young-for-level", org.very_young_count],
    ["Pos. mix",   ""],
  ];
  const tilesHtml = `<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:20px;">${tileRows.slice(0, 7).map(([k, v]) => `
    <div class="stat-tile">
      <div class="stat-label">${k}</div>
      <div class="stat-value">${v}</div>
    </div>`).join("")}
    <div class="stat-tile">
      <div class="stat-label">Position mix</div>
      <div style="margin-top:4px;">${makePosBreakdown(org.pos_groups)}</div>
    </div>
  </div>`;

  // Full roster with mini FV charts
  const rosterRows = rosterPlayers.map((p, i) => {
    const latest = p.points[p.points.length - 1];
    const chart = p.points.length >= 2
      ? makeLineChart(p.points, p.fv_open, p.fv_close, p.graduation_date, p.trades, p)
      : `<span style="color:var(--text-tertiary);font-size:11px;">—</span>`;
    return `
      <div class="player-row" style="grid-template-columns:32px 1.3fr 0.45fr 0.45fr 1.1fr 0.6fr;${orgStripe(p.org)}" onclick="goToPlayer('${escapeHtml(p.player_key)}');">
        <div class="rank-num">${i + 1}</div>
        <div>
          <div class="player-name">${escapeHtml(p.player_name)}</div>
          <div class="player-meta">${escapeHtml(p.position ?? "—")}${p.age != null ? `<span class="age-tag">age ${p.age.toFixed(1)}</span>` : ""}${ilTagHTML(p)}</div>
        </div>
        <div style="text-align:center;"><span class="fv-badge ${fvClass(latest.consensus_fv_label)}">${latest.consensus_fv_label}</span></div>
        <div class="rank-cell">${latest.avg_rank != null ? latest.avg_rank.toFixed(1) : "—"}</div>
        <div class="line-chart-cell">${chart}</div>
        <div class="candle-cell">${makeCandle(p)}</div>
      </div>`;
  }).join("");

  const rosterHeader = `<div class="col-header" style="grid-template-columns:32px 1.3fr 0.45fr 0.45fr 1.1fr 0.6fr;">
    <span style="text-align:center;">#</span>
    <span>Player</span>
    <span style="text-align:center;">FV</span>
    <span style="text-align:center;">Rank</span>
    <span style="text-align:center;">FV history</span>
    <span style="text-align:center;">Candle</span>
  </div>`;

  // Stats leaderboards — top current-season hitters (by OPS, min 80 PA) and
  // pitchers (by ERA, min 10 IP) among the org's tracked prospects.
  const PITCHER_RE = /^(RHP|LHP|SP|RP|MIRP|SIRP)/;
  const topHitters = rosterPlayers
    .filter(rp => rp.statline && rp.statline.is_pitcher === false && rp.statline.ops)
    .map(rp => ({
      p: rp,
      sl: rp.statline,
      ops: parseFloat(rp.statline.ops) || 0,
    }))
    .filter(x => x.ops > 0 && (x.sl.games || 0) >= 10)
    .sort((a, b) => b.ops - a.ops)
    .slice(0, 5);
  const topPitchers = rosterPlayers
    .filter(rp => rp.statline && rp.statline.is_pitcher === true && rp.statline.era)
    .map(rp => ({
      p: rp,
      sl: rp.statline,
      era: parseFloat(rp.statline.era) || 99,
      ip: parseFloat(rp.statline.ip) || 0,
    }))
    .filter(x => x.ip >= 10 && x.era < 99)
    .sort((a, b) => a.era - b.era)
    .slice(0, 5);

  const leaderboardRows = (rows, statLabel, statFn) => rows.map(({ p, sl }) => `
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:3px 0;border-bottom:1px solid var(--border-light);font-size:12px;cursor:pointer;" onclick="goToPlayer('${escapeHtml(p.player_key)}');">
      <span style="color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(p.player_name)} <span style="color:var(--text-tertiary);font-size:10px;">${escapeHtml(sl.level || "?")}</span></span>
      <span style="color:var(--neon-cyan);font-variant-numeric:tabular-nums;white-space:nowrap;">${statFn(sl)}</span>
    </div>`).join("");

  const hittersBlock = topHitters.length
    ? leaderboardRows(topHitters, "OPS", sl => `${sl.ops} · ${sl.hr ?? 0} HR`)
    : `<span style="color:var(--text-tertiary);font-size:12px;">No qualifying hitters yet.</span>`;
  const pitchersBlock = topPitchers.length
    ? leaderboardRows(topPitchers, "ERA", sl => `${sl.era} · ${(sl.ip ?? 0).toFixed ? sl.ip.toFixed(1) : sl.ip} IP`)
    : `<span style="color:var(--text-tertiary);font-size:12px;">No qualifying pitchers yet.</span>`;

  // Highlights side panel
  const tp = org.top_prospect;
  const yp = org.youngest;
  const highlights = `
    <div style="margin-bottom:14px;">
      <div class="detail-title">Top prospect</div>
      ${tp ? `<div style="font-size:14px;font-weight:500;cursor:pointer;color:var(--neon-cyan);" onclick="goToPlayer('${escapeHtml((rosterPlayers[0] || {}).player_key || '')}');">${escapeHtml(tp.name)} <span class="fv-badge ${fvClass(tp.fv_label)}" style="font-size:11px;padding:1px 6px;">${tp.fv_label}</span></div>
      <div style="font-size:11px;color:var(--text-secondary);margin-top:2px;">${escapeHtml(tp.pos||'')} · age ${tp.age != null ? tp.age.toFixed(1) : "—"}</div>` : '—'}
    </div>
    <div style="margin-bottom:14px;">
      <div class="detail-title">Youngest prospect</div>
      ${yp ? `<div style="font-size:14px;font-weight:500;">${escapeHtml(yp.name)}</div>
      <div style="font-size:11px;color:var(--text-secondary);margin-top:2px;">${escapeHtml(yp.pos||'')} · age ${yp.age != null ? yp.age.toFixed(1) : "—"} · FV ${yp.fv_label}</div>` : '—'}
    </div>
    <div class="detail-title">Top hitters (this season)</div>
    <div style="margin-bottom:14px;">${hittersBlock}</div>
    <div class="detail-title">Top pitchers (this season)</div>
    <div style="margin-bottom:14px;">${pitchersBlock}</div>
    <div class="detail-title">Recent graduates (${graduates.length})</div>
    ${graduates.slice(0, 8).map(g => `<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border-light);font-size:12px;cursor:pointer;" onclick="goToPlayer('${escapeHtml(g.player_key)}');">
        <span style="color:var(--text-primary);">${escapeHtml(g.player_name)}</span>
        <span style="color:var(--text-tertiary);">${g.graduation_date || "—"}</span>
      </div>`).join("") || '<span style="color:var(--text-tertiary);font-size:12px;">None</span>'}`;

  const tradesHtml = allTradesForOrg.length ? `<table class="detail-table"><thead><tr>
    <th>Date</th><th>Player</th><th>Move</th><th>Description</th>
    </tr></thead><tbody>${allTradesForOrg.slice(0, 25).map(({ player, trade, graduate }) => {
      const direction = trade.to_org === orgCode
        ? `<span style="color:var(--neon-green);">+</span>`
        : `<span style="color:var(--neon-violet);">→</span>`;
      const gradTag = graduate
        ? `<span style="font-size:9px;color:var(--text-tertiary);margin-left:6px;letter-spacing:0.04em;">GRAD</span>`
        : "";
      return `<tr>
        <td style="white-space:nowrap;">${trade.trade_date}</td>
        <td style="cursor:pointer;color:var(--neon-cyan);white-space:nowrap;" onclick="goToPlayer('${escapeHtml(player.player_key)}');">${escapeHtml(player.player_name)}${gradTag}</td>
        <td style="white-space:nowrap;">${direction} ${escapeHtml(trade.from_org || "?")} → ${escapeHtml(trade.to_org || "?")}</td>
        <td style="color:var(--text-secondary);font-size:11px;line-height:1.4;">${escapeHtml(trade.description || "")}</td>
      </tr>`;
    }).join("")}</tbody></table>` : `<div style="color:var(--text-tertiary);font-size:12px;">No trades on record involving this org.</div>`;

  // Affiliate-roster section — one tab per level, content swap on click.
  // Highlights tracked prospects with their FV badge inline so the page
  // doubles as a "where in the org are our prospects playing right now".
  const affilLevels = ["MLB", "AAA", "AA", "A+", "A", "Rk", "DSL"];
  const orgRosters = (DATA.rosters_by_org || {})[orgCode] || {};
  const presentLevels = affilLevels.filter(lvl => (orgRosters[lvl] || []).length);
  const defaultLevel = presentLevels.includes("AAA") ? "AAA" : (presentLevels[0] || "MLB");

  function levelTableHtml(level) {
    const roster = orgRosters[level] || [];
    if (!roster.length) {
      return `<div style="color:var(--text-tertiary);font-size:12px;padding:6px 0;">No players on file at ${escapeHtml(level)}.</div>`;
    }
    const rows = roster.map(pl => {
      const gradedClick = pl.player_key
        ? ` onclick="goToPlayer('${escapeHtml(pl.player_key)}');" style="cursor:pointer;"`
        : "";
      const nameCell = pl.player_key
        ? `<span style="color:var(--neon-cyan);">${escapeHtml(pl.fullName)}</span>`
        : escapeHtml(pl.fullName);
      const fvCell = pl.fv_label
        ? `<span class="fv-badge ${fvClass(pl.fv_label)}" style="font-size:10px;padding:1px 6px;">${pl.fv_label}</span>`
        : `<span style="color:var(--text-tertiary);">—</span>`;
      return `<tr${gradedClick}>
        <td>${nameCell}</td>
        <td style="color:var(--text-secondary);">${escapeHtml(pl.position || "—")}</td>
        <td style="font-variant-numeric:tabular-nums;color:var(--text-secondary);">${pl.age != null ? pl.age.toFixed(1) : "—"}</td>
        <td style="text-align:center;">${fvCell}</td>
        <td style="color:var(--text-tertiary);font-size:11px;">${escapeHtml(pl.team_name || "")}</td>
      </tr>`;
    }).join("");
    return `<table class="detail-table"><thead><tr>
      <th>Player</th><th>Pos</th><th>Age</th><th style="text-align:center;">FV</th><th>Affiliate</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
  }

  const affilTabs = presentLevels.map(lvl => {
    const count = (orgRosters[lvl] || []).length;
    const graded = (orgRosters[lvl] || []).filter(p => p.fv_label).length;
    const active = lvl === defaultLevel ? " active" : "";
    return `<button class="chip level-tab${active}" data-level="${escapeHtml(lvl)}" type="button">${escapeHtml(lvl)} <span style="color:var(--text-tertiary);font-weight:400;">(${count}${graded ? `, ${graded}★` : ""})</span></button>`;
  }).join("");

  const affilPanels = presentLevels.map(lvl => `
    <div class="level-panel" data-level="${escapeHtml(lvl)}" style="display:${lvl === defaultLevel ? "block" : "none"};">
      ${levelTableHtml(lvl)}
    </div>`).join("");

  const affiliateSection = presentLevels.length ? `
    <div class="detail-title" style="margin-top:18px;">Affiliate rosters
      <span style="font-weight:400;font-size:11px;color:var(--text-tertiary);margin-left:6px;">★ = graded prospect</span>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">${affilTabs}</div>
    ${affilPanels}` : "";

  // "Graded prospects by level" — focused view that strips out the org
  // filler from affiliate rosters and shows only prospects with an FV
  // grade, grouped by affiliate level. Each prospect links back to its
  // detail page. Levels with no graded prospects are skipped entirely so
  // the section stays dense.
  const gradedByLevel = (() => {
    const blocks = [];
    for (const lvl of affilLevels) {
      const graded = (orgRosters[lvl] || []).filter(r => r.fv_label);
      if (!graded.length) continue;
      // Already sorted FV desc upstream (run_monthly sort key). Keep that.
      const items = graded.map(pl => {
        const click = pl.player_key
          ? ` onclick="goToPlayer('${escapeHtml(pl.player_key)}');" style="cursor:pointer;"`
          : "";
        return `<div class="graded-prospect-row"${click}>
          <span class="fv-badge ${fvClass(pl.fv_label)}" style="font-size:10px;padding:1px 6px;min-width:28px;text-align:center;">${pl.fv_label}</span>
          <span style="color:${pl.player_key ? "var(--neon-cyan)" : "var(--text-primary)"};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(pl.fullName)}</span>
          <span style="color:var(--text-tertiary);font-size:10px;white-space:nowrap;">${escapeHtml(pl.position || "—")}${pl.age != null ? ` · ${pl.age.toFixed(1)}` : ""}</span>
        </div>`;
      }).join("");
      blocks.push(`
        <div class="graded-level-block">
          <div class="graded-level-header">
            <span class="graded-level-name">${escapeHtml(lvl)}</span>
            <span class="graded-level-count">${graded.length}</span>
          </div>
          ${items}
        </div>`);
    }
    if (!blocks.length) {
      return `<div style="color:var(--text-tertiary);font-size:12px;">No graded prospects currently assigned to an affiliate.</div>`;
    }
    return `<div class="graded-by-level-grid">${blocks.join("")}</div>`;
  })();

  const totalGraded = affilLevels.reduce(
    (acc, lvl) => acc + (orgRosters[lvl] || []).filter(r => r.fv_label).length, 0);
  const gradedSection = `
    <div class="detail-title" style="margin-top:18px;">Graded prospects by level
      <span style="font-weight:400;font-size:11px;color:var(--text-tertiary);margin-left:6px;">${totalGraded} total · sorted by FV within each level</span>
    </div>
    ${gradedByLevel}`;

  // Cumulative-FV stock chart for the system. Compares this farm's total
  // FV trajectory against its peak so the header shows "current of peak".
  // Marker legend lives just below (trades + graduations).
  const fvHist = org.fv_history || [];
  const fvPeak = fvHist.length ? Math.max(...fvHist.map(p => p.total_fv)) : 0;
  const fvCurrent = fvHist.length ? fvHist[fvHist.length - 1].total_fv : 0;
  const fvFirstDate = fvHist.length ? fvHist[0].date : "";
  const stockChartSection = `
    <div class="detail-title" style="margin-top:18px;">Cumulative FV stock
      <span style="font-weight:400;font-size:11px;color:var(--text-tertiary);margin-left:8px;">
        ${fvCurrent.toFixed(1)} now · peak ${fvPeak.toFixed(1)} · since ${escapeHtml(fvFirstDate)}
      </span>
    </div>
    ${makeOrgFvChart(org, "big")}
    ${transactionLegend(["trade", "graduation"])}`;

  // Acquisition filter chip bar — mirrors the main prospect list's
  // selector but renders inline as chips since the farm detail page has
  // no top filter bar. Tally per method shows the user how many tracked
  // prospects fall into each bucket BEFORE clicking. Filter state is
  // shared with the main list (state.acqFilter).
  const ACQ_METHODS_FOR_FARM = [
    ["all",               "All"],
    ["draft",             "Draft"],
    ["international_fa",  "Intl FA"],
    ["trade",             "Trade"],
    ["waiver",            "Waiver"],
    ["rule_5",            "Rule 5"],
    ["free_agent",        "FA signing"],
    ["contract_purchase", "Purchase"],
  ];
  const acqTallies = {};
  for (const rp of rosterPlayersAll) {
    const m = (rp.current_acquisition || {}).method || "unknown";
    acqTallies[m] = (acqTallies[m] || 0) + 1;
  }
  const acqFilterBar = `
    <div style="display:flex;align-items:center;gap:6px;margin:14px 0 0;flex-wrap:wrap;">
      <span style="font-size:10px;color:var(--text-tertiary);letter-spacing:0.10em;text-transform:uppercase;margin-right:4px;">Acquired via</span>
      ${ACQ_METHODS_FOR_FARM.map(([val, label]) => {
        const n = val === "all" ? rosterPlayersAll.length : (acqTallies[val] || 0);
        const active = state.acqFilter === val;
        const disabled = val !== "all" && n === 0;
        return `<button class="chip${active ? " active" : ""}" data-farm-acq="${val}" type="button"${disabled ? ' disabled style="opacity:0.4;cursor:default;"' : ""}>
          ${escapeHtml(label)} <span style="color:var(--text-tertiary);font-weight:400;">(${n})</span>
        </button>`;
      }).join("")}
    </div>`;

  root.innerHTML = header + tilesHtml + `
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:24px;align-items:start;">
      <div>
        ${stockChartSection}
        <div class="detail-title" style="margin-top:18px;">Tracked prospects (${rosterPlayers.length}${state.acqFilter !== "all" ? ` · filtered by ${escapeHtml(ACQ_METHODS_FOR_FARM.find(m => m[0] === state.acqFilter)?.[1] || state.acqFilter)}` : ""})</div>
        ${acqFilterBar}
        ${rosterHeader}${rosterRows}
        ${gradedSection}
        ${affiliateSection}
        <div class="detail-title" style="margin-top:18px;">Recent trades involving the ${escapeHtml(fullOrgName(orgCode))}</div>
        ${tradesHtml}
      </div>
      <div>${highlights}</div>
    </div>`;

  // Wire affiliate level tabs (vanilla — toggle visibility, no re-render).
  document.querySelectorAll("#farm-detail-body .level-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#farm-detail-body .level-tab").forEach(b =>
        b.classList.toggle("active", b === btn));
      const lvl = btn.dataset.level;
      document.querySelectorAll("#farm-detail-body .level-panel").forEach(panel => {
        panel.style.display = panel.dataset.level === lvl ? "block" : "none";
      });
    });
  });
  // Acquisition filter chips — share state with the main list. Clicking
  // re-renders the entire farm detail so the roster + tally chips both
  // reflect the new filter.
  document.querySelectorAll("#farm-detail-body [data-farm-acq]").forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener("click", () => {
      state.acqFilter = btn.dataset.farmAcq;
      renderFarmDetail(orgCode);
      syncToURL();
    });
  });
}

function render() {
  const sections = {
    active:    "active-section",
    spotlights:"spotlights-section",
    traded:    "traded-section",
    inactive:  "inactive-section",
    graduates: "graduates-section",
    farm:      "farm-section",
    player:    "player-detail-section",
    farmDetail:"farm-detail-section",
  };

  // Detail view takes over: hide tabs, filter bar, search; show one section.
  const isDetail = !!state.view;
  const sectionTabs = document.getElementById("section-tabs");
  if (sectionTabs) sectionTabs.style.display = isDetail ? "none" : "";
  const searchBar = document.querySelector(".search-bar");
  if (searchBar) searchBar.style.display = isDetail ? "none" : "";
  const filterBar = document.getElementById("filter-bar");
  if (filterBar) {
    if (isDetail) {
      filterBar.style.display = "none";
    } else {
      const usesFilters = state.section === "active" || state.section === "traded";
      filterBar.style.display = usesFilters ? "" : "none";
    }
  }

  let active;
  if (state.view && state.view.type === "player") active = "player";
  else if (state.view && state.view.type === "farm") active = "farmDetail";
  else active = state.section;

  for (const [name, id] of Object.entries(sections)) {
    const el = document.getElementById(id);
    if (el) el.style.display = name === active ? "block" : "none";
  }

  if (active === "player")       renderPlayerDetail(state.view.key);
  else if (active === "farmDetail") renderFarmDetail(state.view.org);
  else if (active === "active")     renderActives();
  else if (active === "spotlights") renderSpotlights();
  else if (active === "traded")     renderRecentlyTraded();
  else if (active === "inactive")   renderInactive();
  else if (active === "graduates")  renderGraduates();
  else if (active === "farm")       renderFarmSystems();
  updateMeta();
  syncToURL();
}

function attachHandlers() {
  document.querySelectorAll(".section-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".section-tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.section = btn.dataset.section;
      // Tab switch always returns to the list — drop any detail view.
      state.view = null;
      render();
    });
  });
  document.querySelectorAll("[data-spotlight-bucket]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.spotlightBucket = btn.dataset.spotlightBucket;
      state.view = null;
      render();
    });
  });

  // Back/forward navigation: re-read the hash and re-render whenever the
  // user uses browser-history controls (or anything else mutates the hash).
  window.addEventListener("hashchange", () => {
    syncFromURL();
    restoreUIFromState();
    render();
  });

  document.querySelectorAll("[data-filter-stock]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-filter-stock]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.stockFilter = btn.dataset.filterStock;
      render();
    });
  });
  document.getElementById("org-filter").addEventListener("change", e => {
    state.orgFilter = e.target.value;
    render();
  });
  document.getElementById("acq-filter").addEventListener("change", e => {
    state.acqFilter = e.target.value;
    render();
  });
  document.getElementById("sort-select").addEventListener("change", e => {
    state.sort = e.target.value;
    render();
  });

  const searchInput = document.getElementById("search-input");
  if (searchInput) {
    searchInput.addEventListener("input", e => {
      state.search = e.target.value.trim();
      render();
    });
    // Clear search on Escape
    searchInput.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        state.search = "";
        searchInput.value = "";
        render();
      }
    });
  }

  // Farm sort chips
  document.querySelectorAll("[data-farm-sort]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-farm-sort]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.farmSort = btn.dataset.farmSort;
      renderFarmSystems();
    });
  });
}

function populateOrgFilter() {
  const select = document.getElementById("org-filter");
  for (const org of getAllOrgs()) {
    const opt = document.createElement("option");
    opt.value = org;
    opt.textContent = org;
    select.appendChild(opt);
  }
}

// =============================================================================
// BOOT
// =============================================================================
(async () => {
  DATA = await loadData();
  const content = document.getElementById("content");

  if (DATA.__error) {
    content.innerHTML = `
      <div class="state-message state-error">
        Could not load <code>${DATA_URL}</code>: ${escapeHtml(DATA.__error)}
        <br><br>
        <span style="color: var(--text-tertiary);">
          Generate the data first by running <code>python run_monthly.py</code> in the project root,<br>
          then refresh this page. See <code>README.md</code> for setup.
        </span>
      </div>`;
    return;
  }
  if (!DATA.players || DATA.players.length === 0) {
    content.innerHTML = `
      <div class="state-message">
        <strong style="font-weight: 500; color: var(--text-primary);">No prospect data yet.</strong>
        <br><br>
        Edit <code>data/manual_rankings.csv</code> to add prospect rows, then run
        <code>python run_monthly.py</code> in the project root and refresh.
      </div>`;
    return;
  }

  // Mount the main UI
  const tpl = document.getElementById("main-template");
  content.innerHTML = "";
  content.appendChild(tpl.content.cloneNode(true));

  syncFromURL();
  populateOrgFilter();
  restoreUIFromState();
  attachHandlers();
  render();
})();
</script>
</body>
</html>
