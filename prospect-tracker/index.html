      <th colspan="3" style="${stripStyle(COUNT_COLOR)}">Counting</th>
      <th colspan="2" style="${stripStyle(SLASH_COLOR)}">Run prevention</th>
      <th colspan="3" style="${stripStyle(PERIPH_COLOR)}">Peripherals</th>
    </tr>`;
    const head = `<tr>
      <th>Season</th><th>Level</th>
      <th title="Games appeared">G</th>
      <th title="Innings pitched">IP</th>
      <th title="Wins–Losses">W-L</th>
      <th title="Earned Run Average">ERA</th>
      <th title="Walks + Hits per Inning Pitched">WHIP</th>
      <th title="Strikeouts per 9 innings">K/9</th>
      <th title="Walks per 9 innings">BB/9</th>
      <th title="Home runs allowed per 9 innings — pitcher's contact-quality red-flag stat (one of the three FIP inputs)">HR/9</th>
    </tr>`;
    const rows = sorted.map(s => `<tr>
      <td>${s.season}</td>
      <td><span class="level-pill level-neutral">${s.level}</span></td>
      <td>${s.games ?? "—"}</td>
      <td>${s.ip ?? "—"}</td>
      <td>${s.wins != null ? `${s.wins}-${s.losses}` : "—"}</td>
      <td>${s.era ?? "—"}</td>
      <td>${s.whip ?? "—"}</td>
      <td>${s.k_per_9 != null ? s.k_per_9.toFixed(2) : "—"}</td>
      <td>${s.bb_per_9 != null ? s.bb_per_9.toFixed(2) : "—"}</td>
      <td>${s.hr_per_9 != null ? s.hr_per_9.toFixed(2) : "—"}</td>
    </tr>`).join("");
    return `<table class="detail-table"><thead>${strip}${head}</thead><tbody>${rows}</tbody></table>`;
  }

  // Hitter table groupings:
  //   Meta | Counting (G, AB, HR, SB) | Slash (AVG/OBP/SLG/OPS) |
  //   Power (ISO) | Plate discipline (BB%, K%).
  // ISO gets its own group because it's a pure power stat (SLG − AVG):
  // grouping it with BB%/K% as "plate discipline" was the prior mis-tag.
  // Single-column groups stay readable as long as the strip-cell color
  // is distinct from its neighbors — which the POWER_COLOR ensures.
  const strip = `<tr>
    <th colspan="2" style="${stripStyle(META_COLOR)}">Meta</th>
    <th colspan="4" style="${stripStyle(COUNT_COLOR)}">Counting</th>
    <th colspan="4" style="${stripStyle(SLASH_COLOR)}">Slash</th>
    <th colspan="1" style="${stripStyle(POWER_COLOR)}">Power</th>
    <th colspan="2" style="${stripStyle(DISC_COLOR)}">Plate discipline</th>
  </tr>`;
  const head = `<tr>
    <th>Season</th><th>Level</th>
    <th title="Games">G</th>
    <th title="At-Bats">AB</th>
    <th title="Home Runs">HR</th>
    <th title="Stolen Bases">SB</th>
    <th title="Batting Average">AVG</th>
    <th title="On-Base Percentage">OBP</th>
    <th title="Slugging Percentage">SLG</th>
    <th title="OBP + SLG">OPS</th>
    <th title="Isolated power = SLG − AVG. Pure power signal — strips the batting-average contribution out of slugging.">ISO</th>
    <th title="Walk rate">BB%</th>
    <th title="Strikeout rate">K%</th>
  </tr>`;
  const isoCell = (s) => {
    // Prefer the precomputed ISO from the fetcher; recompute on the fly
    // for any row that pre-dates the field being added to career_stats.
    if (s.iso != null) return s.iso.toFixed(3).replace(/^0/, "");
    const slg = parseFloat(s.slg);
    const avg = parseFloat(s.avg);
    if (!isFinite(slg) || !isFinite(avg)) return "—";
    return (slg - avg).toFixed(3).replace(/^0/, "");
  };
  const rows = sorted.map(s => `<tr>
    <td>${s.season}</td>
    <td><span class="level-pill level-neutral">${s.level}</span></td>
    <td>${s.games ?? "—"}</td>
    <td>${s.ab ?? "—"}</td>
    <td>${s.hr ?? "—"}</td>
    <td>${s.sb ?? "—"}</td>
    <td>${s.avg ?? "—"}</td>
    <td>${s.obp ?? "—"}</td>
    <td>${s.slg ?? "—"}</td>
    <td>${s.ops ?? "—"}</td>
    <td>${isoCell(s)}</td>
    <td>${s.bb_pct != null ? s.bb_pct.toFixed(1) : "—"}</td>
    <td>${s.k_pct != null ? s.k_pct.toFixed(1) : "—"}</td>
  </tr>`).join("");
  return `<table class="detail-table"><thead>${strip}${head}</thead><tbody>${rows}</tbody></table>`;
}

// Scouting flags previously rendered as their own standalone block; the
// data now drives a compact summary line directly above the prospect-
// detail body (see `flagSummary` in renderPlayerDetail) and the colored
// cells of the career table. The standalone block + its sort helpers
// were removed because they duplicated the level-relative deltas the
// career table already shows.

// Sabermetrics block — wRC+ / wOBA / WAR (hitters), xFIP / FIP / FIP-
// / ERA- / WAR (pitchers). When the MLB Stats API has nothing on file
// (every MiLB-only prospect), falls back to level-relative proxies
// (OPS+ vs level / ERA- vs level) so the slot is never blank.
function makeSabermetricsBlock(player) {
  const sm = player.sabermetrics;
  const sl = player.statline || {};
  // Color thresholds — paint values when they're clearly above / below
  // average so the eye can pick out elite / poor numbers at a glance.
  const goodC = "var(--up)", badC = "var(--down)", neutralC = "var(--text-primary)";
  const colorize = (good, bad, val) => val == null ? neutralC : (good ? goodC : bad ? badC : neutralC);

  const tiles = [];
  if (sm && (sm.wrc_plus != null || sm.woba != null || sm.war != null)) {
    // MLB hitter — use real wRC+ / wOBA
    if (sm.wrc_plus != null) {
      const v = Math.round(sm.wrc_plus);
      tiles.push(["wRC+", v, colorize(v >= 110, v <= 90, v),
                  "Weighted Runs Created+ · 100 = league avg, higher is better"]);
    }
    if (sm.woba != null) {
      const v = sm.woba.toFixed(3).replace(/^0/, "");
      tiles.push(["wOBA", v, colorize(sm.woba >= 0.340, sm.woba <= 0.300, sm.woba),
                  "Weighted On-Base Average · linear-weights scale, .320 ≈ avg"]);
    }
    if (sm.war != null) {
      const v = sm.war.toFixed(1);
      tiles.push(["WAR", v, colorize(sm.war >= 2.0, sm.war <= 0, sm.war),
                  "FanGraphs Wins Above Replacement"]);
    }
  } else if (sm && (sm.xfip != null || sm.fip != null || sm.fip_minus != null || sm.era_minus != null || sm.war != null)) {
    // MLB pitcher — use real xFIP / FIP / FIP-
    if (sm.xfip != null) {
      tiles.push(["xFIP", sm.xfip.toFixed(2), colorize(sm.xfip <= 3.50, sm.xfip >= 4.50, sm.xfip),
                  "Expected FIP · neutralizes HR/FB rate · league avg ≈ 4.00"]);
    }
    if (sm.fip != null) {
      tiles.push(["FIP", sm.fip.toFixed(2), colorize(sm.fip <= 3.50, sm.fip >= 4.50, sm.fip),
                  "Fielding-Independent Pitching · same scale as ERA"]);
    }
    if (sm.fip_minus != null) {
      const v = Math.round(sm.fip_minus);
      tiles.push(["FIP-", v, colorize(v <= 90, v >= 110, v),
                  "FIP- · 100 = league avg, lower is better"]);
    }
    if (sm.era_minus != null) {
      const v = Math.round(sm.era_minus);
      tiles.push(["ERA-", v, colorize(v <= 90, v >= 110, v),
                  "ERA- · 100 = league avg, lower is better"]);
    }
    if (sm.war != null) {
      tiles.push(["WAR", sm.war.toFixed(1), colorize(sm.war >= 2.0, sm.war <= 0, sm.war),
                  "FanGraphs Wins Above Replacement"]);
    }
  } else if (sl.ops_plus_level != null || sl.era_minus_level != null) {
    // MiLB fallback — level-relative proxies.
    if (sl.is_pitcher && sl.era_minus_level != null) {
      const v = sl.era_minus_level;
      tiles.push([
        "ERA- (vs level)", v, colorize(v <= 90, v >= 110, v),
        `Earned Run Average vs ${sl.level || "level"} mean · proxy for xFIP (real xFIP requires MLB data)`,
      ]);
    } else if (!sl.is_pitcher && sl.ops_plus_level != null) {
      const v = sl.ops_plus_level;
      tiles.push([
        "OPS+ (vs level)", v, colorize(v >= 110, v <= 90, v),
        `On-base + Slugging vs ${sl.level || "level"} mean · proxy for wRC+ (real wRC+ requires MLB data)`,
      ]);
    }
  }

  if (!tiles.length) {
    return `<div style="color:var(--text-tertiary);font-size:12px;">No advanced stats available yet. ${sl.is_pitcher ? "xFIP" : "wRC+"} requires MLB-level data; level-relative proxies need enough innings/PAs to stabilize.</div>`;
  }

  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;">${tiles.map(([label, val, color, title]) => `
    <div class="stat-tile" title="${escapeHtml(title)}">
      <div class="stat-label">${escapeHtml(label)}</div>
      <div class="stat-value" style="color:${color};font-family:var(--font-mono);">${val}</div>
    </div>`).join("")}</div>`;
}

// Baseball-Savant quality-of-contact / plate-discipline tiles. Driven
// by storage.export_timeseries_json → prospect_savant.attach_prospect_savant
// (CSV exports placed next to the pipeline root). Each metric gets a
// hand-tuned good/bad threshold so the user sees a green/red read at a
// glance — same colorize() convention as the sabermetrics block.
function makeSavantBlock(s) {
  if (!s) return "";
  const goodC = "var(--up)", badC = "var(--down)", neutralC = "var(--text-primary)";
  const colorize = (good, bad) => good ? goodC : bad ? badC : neutralC;
  const fmtPct = v => v == null ? null : `${v.toFixed(1)}%`;
  const fmtRate = v => v == null ? null : v.toFixed(3).replace(/^0/, "");
  const fmtMph = v => v == null ? null : `${v.toFixed(1)} mph`;

  // Tiles are grouped into semantic buckets so the eye can chunk by
  // skill family. Hitters: quality-of-contact + discipline. Pitchers:
  // quality allowed + stuff + command.
  const groups = [];
  if (s.role === "hitter") {
    const qoc = [];
    if (s.xwoba != null)        qoc.push(["xwOBA", fmtRate(s.xwoba), colorize(s.xwoba >= 0.350, s.xwoba <= 0.300), "Expected wOBA · Statcast contact-quality model · .350+ is plus, .300 is light"]);
    if (s.woba != null)         qoc.push(["wOBA", fmtRate(s.woba), colorize(s.woba >= 0.340, s.woba <= 0.300), "Actual wOBA · linear-weights scale"]);
    if (s.barrels != null)      qoc.push(["Barrels", String(s.barrels), colorize(s.barrels >= 8, false), "Statcast barrels · ideal launch angle + exit velo"]);
    if (s.hard_hit_pct != null) qoc.push(["Hard-Hit%", fmtPct(s.hard_hit_pct), colorize(s.hard_hit_pct >= 40, s.hard_hit_pct <= 28), "% of batted balls at 95+ mph"]);
    if (s.max_ev != null)       qoc.push(["Max EV", fmtMph(s.max_ev), colorize(s.max_ev >= 108, s.max_ev <= 100), "Hardest-hit ball in the sample"]);
    if (s.ev != null)           qoc.push(["Avg EV", fmtMph(s.ev), colorize(s.ev >= 89, s.ev <= 84), "Average exit velocity"]);
    if (qoc.length) groups.push(["Quality of contact", qoc]);

    const disc = [];
    if (s.whiff_pct != null) disc.push(["Whiff%", fmtPct(s.whiff_pct), colorize(s.whiff_pct <= 22, s.whiff_pct >= 32), "Swings-and-misses / total swings · lower is better"]);
    if (s.chase_pct != null) disc.push(["Chase%", fmtPct(s.chase_pct), colorize(s.chase_pct <= 24, s.chase_pct >= 32), "Swings on out-of-zone pitches · lower is better"]);
    if (s.bb_pct != null)    disc.push(["BB%", fmtPct(s.bb_pct), colorize(s.bb_pct >= 10, s.bb_pct <= 6), "Walks per plate appearance"]);
    if (s.k_pct != null)     disc.push(["K%", fmtPct(s.k_pct), colorize(s.k_pct <= 20, s.k_pct >= 28), "Strikeouts per plate appearance · lower is better"]);
    if (disc.length) groups.push(["Plate discipline", disc]);
  } else {
    const qal = [];
    if (s.xwoba != null)        qal.push(["Opp xwOBA", fmtRate(s.xwoba), colorize(s.xwoba <= 0.300, s.xwoba >= 0.340), "xwOBA allowed · contact-quality against · lower is better"]);
    if (s.hard_hit_pct != null) qal.push(["Hard-Hit%", fmtPct(s.hard_hit_pct), colorize(s.hard_hit_pct <= 32, s.hard_hit_pct >= 42), "% of batted balls allowed at 95+ mph · lower is better"]);
    if (s.barrels != null)      qal.push(["Barrels", String(s.barrels), colorize(false, s.barrels >= 8), "Barrels allowed · lower is better"]);
    if (qal.length) groups.push(["Quality allowed", qal]);

    const stuff = [];
    if (s.whiff_pct != null) stuff.push(["Whiff%", fmtPct(s.whiff_pct), colorize(s.whiff_pct >= 28, s.whiff_pct <= 18), "Whiff rate induced · higher is better"]);
    if (s.k_pct != null)     stuff.push(["K%", fmtPct(s.k_pct), colorize(s.k_pct >= 28, s.k_pct <= 18), "Strikeout rate · higher is better"]);
    if (s.max_velo != null)  stuff.push(["Max velo", fmtMph(s.max_velo), neutralC, "Hardest pitch in the sample"]);
    if (stuff.length) groups.push(["Stuff", stuff]);

    const cmd = [];
    if (s.bb_pct != null) cmd.push(["BB%", fmtPct(s.bb_pct), colorize(s.bb_pct <= 7, s.bb_pct >= 11), "Walk rate · lower is better"]);
    if (cmd.length) groups.push(["Command", cmd]);
  }

  if (!groups.length) return `<div style="color:var(--text-tertiary);font-size:12px;">No Savant metrics for this player.</div>`;

  const sample = s.pa != null ? `${s.pa} PA` : (s.pitches != null ? `${s.pitches} pitches` : "");
  const sampleNote = sample
    ? `<div style="font-size:11px;color:var(--text-tertiary);margin-top:6px;">Sample: ${escapeHtml(sample)}</div>`
    : "";
  const renderGroup = ([title, tiles]) => `
    <div class="stat-group">
      <div class="stat-group-label">${escapeHtml(title)}</div>
      <div class="stat-group-tiles">${tiles.map(([label, val, color, t]) => `
        <div class="stat-tile" title="${escapeHtml(t)}">
          <div class="stat-label">${escapeHtml(label)}</div>
          <div class="stat-value" style="color:${color};font-family:var(--font-mono);">${val}</div>
        </div>`).join("")}</div>
    </div>`;
  return `<div class="stat-groups">${groups.map(renderGroup).join("")}</div>${sampleNote}`;
}

// Pitch arsenal block — pitch type × usage % × avg velo.
// Coverage: MLB Stats API only exposes pitch-tracking data for MLB
// games, so this is populated for graduates and the rare MiLB prospect
// who's gotten MLB innings. For pure MiLB prospects the block surfaces
// a clear "not available at this level" message so the user knows the
// gap is data coverage, not a missing prospect.
// Polar "pitch mix" radar — each pitch type is a vertex on a regular
// polygon; vertex radius = usage% (so the primary pitch reaches the
// outer ring, secondaries pull inward). Hover shows pitch name + velo.
// 5+ pitches collapse into a hexagon/pentagon naturally based on count.
function makeArsenalRadar(pa) {
  const pitches = (pa && pa.pitches) || [];
  if (pitches.length < 2) return "";
  const sorted = [...pitches].sort((a, b) => (b.usage_pct || 0) - (a.usage_pct || 0));
  const W = 200, H = 200;
  const cx = W / 2, cy = H / 2;
  const maxR = Math.min(cx, cy) - 26;
  const n = sorted.length;
  const angleFor = i => (-Math.PI / 2) + (i * 2 * Math.PI / n);
  // Concentric reference rings at 25/50/75/100% usage.
  const rings = [0.25, 0.5, 0.75, 1.0].map(r =>
    `<circle cx="${cx}" cy="${cy}" r="${(maxR * r).toFixed(1)}" fill="none" stroke="var(--border-light)" stroke-width="0.5" stroke-dasharray="${r === 1 ? "0" : "2,3"}"/>`
  ).join("");
  // Spokes — one per pitch type, label at the outer tip.
  const spokes = sorted.map((p, i) => {
    const a = angleFor(i);
    const x2 = cx + Math.cos(a) * maxR;
    const y2 = cy + Math.sin(a) * maxR;
    const lx = cx + Math.cos(a) * (maxR + 14);
    const ly = cy + Math.sin(a) * (maxR + 14);
    return `<line x1="${cx}" y1="${cy}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--border-light)" stroke-width="0.5"/>
      <text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="10" font-family="var(--font-mono)" fill="var(--text-secondary)" text-anchor="middle" dominant-baseline="middle">${escapeHtml(p.pitch_type)}</text>`;
  }).join("");
  // Usage polygon — vertex radius scales with usage_pct (0..1). Anchor
  // tooltip on each vertex with pitch name + velo so hovering surfaces
  // the detail without cluttering the chart.
  const pts = sorted.map((p, i) => {
    const a = angleFor(i);
    const r = Math.max(0.05, (p.usage_pct || 0)) * maxR;
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  });
  const polyPoints = pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
  const vertices = sorted.map((p, i) => {
    const [x, y] = pts[i];
    const tooltip = `${p.pitch_name} · ${(p.usage_pct * 100).toFixed(1)}%${p.avg_speed != null ? ` · ${p.avg_speed.toFixed(1)} mph` : ""}`;
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="var(--neon-cyan)" stroke="var(--bg-secondary)" stroke-width="1.5"><title>${escapeHtml(tooltip)}</title></circle>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Pitch arsenal mix" style="max-width:240px;">
    ${rings}
    ${spokes}
    <polygon points="${polyPoints}" fill="var(--neon-cyan)" fill-opacity="0.18" stroke="var(--neon-cyan)" stroke-width="1.5" stroke-linejoin="round"/>
    ${vertices}
  </svg>`;
}

// Strike-zone heatmap — 3×3 inner grid (numbered 1-9 per the Savant
// convention) plus 4 "chase" wedges around the edges (10-13). Filled
// from `pa.zone_heat` (a 13-element array of 0-1 heat values, with
// indices 0-8 = inner zones, 9-12 = chase). Empty/missing data renders
// a faint grid with a "no location data" caption so the visualization
// still communicates structure to the reader.
function makeStrikeZoneHeatmap(pa) {
  if (!pa) return "";
  const heat = Array.isArray(pa.zone_heat) ? pa.zone_heat : null;
  // Cell color helper — green-to-red gradient on a 0-1 input. Cool
  // (low heat) uses the up/green token; hot (high) uses the down/red.
  // Returns a faded gray when heat is missing.
  const cellFill = (v) => {
    if (v == null || !isFinite(v)) return "var(--bg-tertiary)";
    const t = Math.max(0, Math.min(1, Number(v)));
    if (t < 0.05) return "var(--bg-tertiary)";
    // Three-stop gradient: green (cool) → amber (warm) → red (hot).
    if (t < 0.5) {
      const lerp = t / 0.5;
      // Green → amber. RGB lerp on neon-green→neon-amber.
      const r = Math.round(31 + (201 - 31) * lerp);
      const g = Math.round(122 + (162 - 122) * lerp);
      const b = Math.round(58 + (39 - 58) * lerp);
      return `rgba(${r},${g},${b},${0.18 + 0.42 * lerp})`;
    } else {
      const lerp = (t - 0.5) / 0.5;
      const r = Math.round(201 + (185 - 201) * lerp);
      const g = Math.round(162 + (28 - 162) * lerp);
      const b = Math.round(39 + (28 - 39) * lerp);
      return `rgba(${r},${g},${b},${0.55 + 0.35 * lerp})`;
    }
  };
  // 3×3 inner zone grid laid out top-to-bottom, left-to-right (mirrors
  // the catcher's view standard in Savant).
  const cells = [];
  for (let i = 0; i < 9; i++) {
    const x = 30 + (i % 3) * 30;
    const y = 30 + Math.floor(i / 3) * 30;
    const v = heat ? heat[i] : null;
    const fill = cellFill(v);
    const tip = v != null ? `Zone ${i + 1}: ${Math.round(v * 100)}%` : `Zone ${i + 1}: no data`;
    cells.push(`<rect x="${x}" y="${y}" width="30" height="30" fill="${fill}" stroke="var(--border)" stroke-width="0.8"><title>${tip}</title></rect>`);
  }
  // Chase wedges around the edges (indices 9-12 = up/down/left/right).
  // Drawn as thin trapezoidal regions outside the 3×3.
  const chaseLabels = ["above zone", "below zone", "inside zone", "outside zone"];
  const chasePaths = [
    `M30,30 L120,30 L100,10 L50,10 Z`,   // top
    `M30,120 L120,120 L100,140 L50,140 Z`, // bottom
    `M30,30 L30,120 L10,100 L10,50 Z`,    // left
    `M120,30 L120,120 L140,100 L140,50 Z`, // right
  ];
  for (let i = 0; i < 4; i++) {
    const v = heat ? heat[9 + i] : null;
    const fill = cellFill(v);
    const tip = v != null
      ? `Chase ${chaseLabels[i]}: ${Math.round(v * 100)}%`
      : `Chase ${chaseLabels[i]}: no data`;
    cells.push(`<path d="${chasePaths[i]}" fill="${fill}" stroke="var(--border-light)" stroke-width="0.6"><title>${tip}</title></path>`);
  }
  const note = heat
    ? ""
    : `<div style="font-size:9.5px;color:var(--text-tertiary);margin-top:4px;text-align:center;font-style:italic;">No pitch-location data on file yet</div>`;
  return `<div style="flex-shrink:0;text-align:center;">
    <div style="font-family:var(--font-sans);font-size:9px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:4px;">Strike-zone heat</div>
    <svg viewBox="0 0 150 150" width="150" height="150" role="img" aria-label="Strike zone heatmap" style="display:block;">
      <!-- Subtle home-plate outline behind the cells. -->
      <rect x="10" y="10" width="130" height="130" fill="transparent" stroke="var(--border-light)" stroke-width="0.6"/>
      ${cells.join("")}
      <!-- Inner zone-1 to zone-9 labels (small, dim). -->
      ${Array.from({length: 9}, (_, i) => {
        const x = 45 + (i % 3) * 30;
        const y = 50 + Math.floor(i / 3) * 30;
        return `<text x="${x}" y="${y}" text-anchor="middle" font-family="var(--font-mono)" font-size="9" fill="var(--text-tertiary)" opacity="0.45">${i + 1}</text>`;
      }).join("")}
    </svg>
    ${note}
  </div>`;
}

function makeArsenalBlock(pa) {
  if (!pa || !(pa.pitches || []).length) {
    return `<div style="color:var(--text-tertiary);font-size:12px;line-height:1.5;">No pitch-tracking data on file. MLB Stats API only carries pitch arsenal for MLB games; MiLB-only pitchers don't yet have this exposed publicly.</div>`;
  }
  // Sort pitches descending by usage for clear primary-vs-secondary read.
  const sorted = [...pa.pitches].sort((a, b) => (b.usage_pct || 0) - (a.usage_pct || 0));
  const rows = sorted.map(p => {
    // Visual usage bar: 100% of column width = ~highest usage in arsenal.
    const pct = p.usage_pct != null ? p.usage_pct * 100 : 0;
    const bar = `<div style="display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;">
      <div style="flex:1;height:6px;background:var(--bg-tertiary);border:1px solid var(--border-light);border-radius:2px;overflow:hidden;">
        <div style="width:${Math.min(100, pct).toFixed(1)}%;height:100%;background:var(--neon-cyan);"></div>
      </div>
      <span style="color:var(--text-primary);min-width:42px;text-align:right;">${pct.toFixed(1)}%</span>
    </div>`;
    return `<tr>
      <td><span class="src-tag">${escapeHtml(p.pitch_type)}</span> ${escapeHtml(p.pitch_name)}</td>
      <td style="text-align:right;font-variant-numeric:tabular-nums;">${p.avg_speed != null ? p.avg_speed.toFixed(1) + " mph" : "—"}</td>
      <td>${bar}</td>
    </tr>`;
  }).join("");
  const fb = pa.fb_velo != null
    ? `<div style="font-size:11px;color:var(--text-tertiary);margin-bottom:6px;font-family:var(--font-sans);">Primary fastball velo: <span style="color:var(--neon-green);font-family:var(--font-mono);font-weight:700;">${pa.fb_velo.toFixed(1)} mph</span></div>`
    : "";
  // Polar arsenal radar sits next to the per-pitch table on wider
  // screens — pure visual at-a-glance summary of pitch mix. Collapses
  // below the table on narrow viewports via flex-wrap.
  const radar = makeArsenalRadar(pa);
  const zone = makeStrikeZoneHeatmap(pa);
  const tableHtml = `<table class="detail-table"><thead><tr><th>Pitch</th><th title="Average velocity in mph">Velo (mph)</th><th>Usage</th></tr></thead><tbody>${rows}</tbody></table>`;
  if (!radar && !zone) return fb + tableHtml;
  return fb + `<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
    <div style="flex:1;min-width:200px;">${tableHtml}</div>
    ${radar || ""}
    ${zone || ""}
  </div>`;
}

// Unified transaction-history block — trades + level changes + other
// transactions, all sorted by date with a `Type` column that labels
// each row precisely. The data layers separate cleanly:
//   - player.trades        → only real trades (typeCode TR)
//   - player.level_changes → promotions/demotions + MLB debut
//   - player.transactions  → waiver claims, releases, DFAs, contract
//                            purchases, Rule 5 moves, FA signings
// Each kind paints its own colored chip in the Type column so a reader
// can scan by category without parsing description text.
function makeTransactionHistoryBlock(player) {
  const trades = player && player.trades || [];
  const levelChanges = player && player.level_changes || [];
  const otherTx = player && player.transactions || [];
  if (!trades.length && !levelChanges.length && !otherTx.length) {
    return `<div style="color:var(--text-tertiary);font-size:12px;">No transactions on record.</div>`;
  }

  // Compact colored chip: the canonical "what kind of transaction is
  // this?" label. Pulls color from TRANSACTION_KINDS so the legend on
  // the FV chart, the glyphs on the chart, and this table all agree.
  const typeChip = (kind) => {
    const cfg = TRANSACTION_KINDS[kind] || {};
    const color = cfg.color || "var(--text-tertiary)";
    const lbl   = cfg.label || kind;
    return `<span style="display:inline-flex;align-items:center;gap:4px;border:1px solid ${color};color:${color};background:transparent;font-family:var(--font-sans);font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:1px 6px;border-radius:2px;white-space:nowrap;">${escapeHtml(lbl)}</span>`;
  };

  // Build a flat row list. Each row: {date, kind, move (HTML), detail}.
  const rows = [];
  const focalKey = player && player.player_key;
  for (const t of trades) {
    rows.push({
      kind: "trade",
      date: t.trade_date,
      move: `${escapeHtml(t.from_org ?? "?")} <span style="color:var(--neon-violet);">→</span> ${escapeHtml(t.to_org ?? "?")}`,
      // Highlight any other tracked prospects named in the trade text so
      // a multi-prospect deal becomes a navigation hub from each leg.
      detail: highlightTrackedNamesInText(t.description || "", focalKey),
    });
  }
  for (const lc of levelChanges) {
    if (lc.kind === "debut") {
      const teamPart = lc.to_team ? ` with ${escapeHtml(lc.to_team)}` : "";
      const fromPart = lc.from_level
        ? `<span class="level-pill level-neutral" style="margin-right:4px;">${escapeHtml(lc.from_level)}</span><span style="color:var(--up);margin-right:4px;">↑</span>`
        : "";
      rows.push({
        kind: lc.kind,
        date: lc.date,
        move: `${fromPart}<span class="level-pill" style="background:var(--neon-amber);color:var(--text-on-accent,#1a1208);font-weight:700;letter-spacing:0.04em;">★ MLB DEBUT</span>`,
        detail: `Major league debut${teamPart}.`,
      });
      continue;
    }
    const arrow = lc.kind === "promotion"
      ? `<span style="color:var(--up);">↑</span>`
      : `<span style="color:var(--down);">↓</span>`;
    rows.push({
      kind: lc.kind,
      date: lc.date,
      move: `<span class="level-pill level-neutral" style="margin-right:2px;">${escapeHtml(lc.from_level || "?")}</span> ${arrow} <span class="level-pill level-neutral" style="margin-left:2px;">${escapeHtml(lc.to_level || "?")}</span>`,
      detail: lc.to_team
        ? `${lc.kind === "promotion" ? "Promoted" : "Demoted"} to ${escapeHtml(lc.to_team)}${lc.from_team ? ` from ${escapeHtml(lc.from_team)}` : ""}`
        : "",
    });
  }
  // Non-trade transactions: waiver claim, contract purchase, release,
  // DFA, outright, Rule 5 selection/return, FA signing. Each row's
  // `move` summarizes the from/to teams (when applicable) so the table
  // reads like a roster diff regardless of the underlying kind.
  for (const tx of otherTx) {
    const kind = reclassifyAcquisitionSigning(player, tx);
    if (!TRANSACTION_KINDS[kind]) continue;
    let movePart;
    if (tx.from_team && tx.to_team) {
      movePart = `${escapeHtml(tx.from_team)} <span style="color:var(--neon-violet);">→</span> ${escapeHtml(tx.to_team)}`;
    } else if (tx.to_team) {
      movePart = `→ ${escapeHtml(tx.to_team)}`;
    } else if (tx.from_team) {
      movePart = `${escapeHtml(tx.from_team)} →`;
    } else {
      movePart = `<span style="color:var(--text-tertiary);">—</span>`;
    }
    rows.push({
      kind: kind,
      date: tx.date,
      move: movePart,
      // Link any tracked prospects mentioned (e.g. multi-player trades
      // where the other party shows up in the description).
      detail: highlightTrackedNamesInText(tx.description || "", focalKey),
    });
  }
  rows.sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const html = rows.map(r => `<tr>
    <td style="white-space:nowrap;">${escapeHtml(r.date)}</td>
    <td style="white-space:nowrap;">${typeChip(r.kind)}</td>
    <td>${r.move}</td>
    <td style="color:var(--text-secondary);font-size:11px;line-height:1.45;">${r.detail}</td>
  </tr>`).join("");
  return `<table class="detail-table"><thead><tr><th>Date</th><th>Type</th><th>Move</th><th>Detail</th></tr></thead><tbody>${html}</tbody></table>`;
}

// Back-compat shim: older callers (and any deployed embed) used
// `makeTradeHistoryBlock(p.trades)`. The new unified block takes the
// whole player, so keep this wrapper so nothing else needs touching.
function makeTradeHistoryBlock(trades) {
  return makeTransactionHistoryBlock({ trades, level_changes: [] });
}

// Injury history block — list every IL stint we can derive from the
// MLB Stats API per-player transactions payload, oldest first. Stints
// transferred from 15-day to 60-day collapse into one row showing the
// longest IL type the player landed on. The currently-active stint
// renders with an open `present` end-cap.
function makeInjuryHistoryBlock(history) {
  if (!history || !history.length) {
    return `<div style="color:var(--text-tertiary);font-size:12px;">No IL stints on record.</div>`;
  }
  // Helper: human readable date span.
  const fmtDate = iso => {
    if (!iso) return "—";
    const d = new Date(iso + "T00:00:00");
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("en-US", { year: "2-digit", month: "short", day: "numeric" });
  };
  const rows = history.map(s => {
    const sinceFmt = fmtDate(s.since);
    const untilFmt = s.until ? fmtDate(s.until) : `<span style="color:var(--neon-amber);font-weight:600;">present</span>`;
    const days = s.days != null
      ? `${s.days}d`
      : (s.active && s.since
          ? (() => {
              const ms = Date.now() - new Date(s.since + "T00:00:00").getTime();
              return !isNaN(ms) && ms > 0 ? `${Math.floor(ms / 86400000)}d` : "—";
            })()
          : "—");
    const typeColor = s.active
      ? "var(--neon-amber)"
      : (s.type === "60-day" ? "var(--down)" : "var(--text-tertiary)");
    return `<tr>
      <td style="white-space:nowrap;font-variant-numeric:tabular-nums;">${sinceFmt} → ${untilFmt}</td>
      <td style="white-space:nowrap;color:${typeColor};font-weight:${s.active ? 600 : 500};">${escapeHtml(s.type || "?")} IL</td>
      <td style="white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text-primary);">${days}</td>
      <td style="color:var(--text-secondary);font-size:11px;line-height:1.45;">${escapeHtml(s.reason || "")}</td>
    </tr>`;
  }).join("");
  return `<table class="detail-table"><thead><tr><th>Stint</th><th>List</th><th>Length</th><th>Diagnosis</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// Per-source FV history — shows the full breakdown of how each ranking
// source has graded the player over time.
function makePerSourceHistory(points) {
  // Collect every source that ever appeared, plus the most recent FV they
  // assigned at each snapshot date.
  const sources = new Set();
  for (const pt of points) {
    for (const src of Object.keys(pt.per_source || {})) sources.add(src);
  }
  if (!sources.size) {
    return `<div style="color:var(--text-tertiary);font-size:12px;">No per-source breakdown available.</div>`;
  }
  const sortedSources = [...sources].sort();
  const head = `<tr><th>Date</th><th>Update</th>${sortedSources.map(s => `<th>${escapeHtml(SOURCE_LABELS[s] || s)}</th>`).join("")}<th>Consensus</th></tr>`;
  const body = points.map(pt => {
    const perSrc = pt.per_source || {};
    return `<tr>
      <td>${pt.snapshot_date}</td>
      <td><span class="src-tag">${escapeHtml(pt.interval_label)}</span></td>
      ${sortedSources.map(s => {
        const d = perSrc[s];
        if (!d) return `<td style="color:var(--text-tertiary);">—</td>`;
        const fv = d.fv_published != null
          ? `<span class="fv-badge ${fvClass(String(d.fv_published))} size-sm">${d.fv_published}</span>`
          : "—";
        const rank = d.rank != null ? `<span style="font-size:10px;color:var(--text-tertiary);"> #${d.rank}</span>` : "";
        return `<td>${fv}${rank}</td>`;
      }).join("")}
      <td><span style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-secondary);font-weight:600;" title="Consensus FV at this snapshot">${pt.consensus_fv_label}</span></td>
    </tr>`;
  }).join("");
  // Per-source cells keep their compact badges so the reader can spot
  // source agreement at a glance; the consensus column drops the badge
  // (the header FV badge is the single hero number) and renders as plain
  // monospace text so a multi-year prospect doesn't end up with 20+ FV
  // pills competing for attention.
  //
  // Horizontal-scroll wrapper handles the 9-12 column case (5 FV sources
  // + 2 rank-only sources + date/update/consensus). The first column
  // sticks to the left edge so a wide-scrolled row still shows the date
  // anchor.
  return `<div class="per-source-scroll"><table class="detail-table per-source-table"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

function renderPlayerDetail(key) {
  const p = findPlayer(key);
  const root = document.getElementById("player-detail-body");
  if (!p) {
    root.innerHTML = `<div class="state-message">Unknown prospect: ${escapeHtml(key)}. <a href="#" onclick="goHome();return false;">Back to list</a>.</div>`;
    return;
  }
  const latest = p.points && p.points.length ? p.points[p.points.length - 1] : null;
  const orgLink = p.org
    ? `<a href="#farm-org=${escapeHtml(p.org)}" onclick="event.preventDefault();goToFarm('${escapeHtml(p.org)}');" style="color:var(--neon-cyan);text-decoration:none;">${escapeHtml(p.org)}</a>`
    : "—";
  // Header status pill — graduated wins over IL when both apply (a
  // graduated player who later goes on the MLB IL is now an MLB story,
  // not a prospect-tracker story).
  const ilNow = p.il_status && p.il_status.is_on_il ? p.il_status : null;
  let ilDays = null;
  if (ilNow && ilNow.since) {
    const ms = Date.now() - new Date(ilNow.since + "T00:00:00").getTime();
    if (!isNaN(ms) && ms > 0) ilDays = Math.floor(ms / 86400000);
  }
  const statusPill = p.status === "graduated"
    ? `<span class="grad-pill" style="background:var(--bg-tertiary);color:var(--grad);">Graduated ${p.graduation_date || ""}</span>`
    : ilNow
      ? `<span class="grad-pill" style="background:var(--accent-il-soft);color:var(--accent-il);border-color:var(--accent-il);">${escapeHtml(ilNow.type || "?")} IL${ilDays != null ? ` · ${ilDays}d` : ""}</span>`
      : "";

  // Post-Tommy John chip. The health_profile.tj_surgery_date is set
  // server-side when any IL stint description matches a TJ-class
  // phrase. The chip shows next to the status pill in the header so
  // a reader can see at a glance that a pitcher is on the
  // post-surgery development arc.
  const hp = p.health_profile || {};
  const tjPill = hp.is_post_tj
    ? `<span class="grad-pill" style="background:var(--accent-tj-soft);color:var(--accent-tj);border:1px solid var(--accent-tj-border);">Post-TJ${hp.tj_surgery_date ? ` · ${escapeHtml(hp.tj_surgery_date)}` : ""}</span>`
    : "";

  const avl = p.age_vs_level || {};
  const fvLabel = latest ? latest.consensus_fv_label : "—";
  const fvBadge = latest
    ? `<span class="fv-badge ${fvClass(fvLabel)} size-lg${fvBadgeWideClass(p)}${fvBadgeSingleClass(p)}" style="margin-top:4px;" title="${escapeHtml(fvBadgeTooltip(p))}">${fvLabel}${fvBadgeWideMarkHTML(p)}${fvBadgeSingleMarkHTML(p)}</span>`
    : "";

  // Rank pills — overall position in the FV-sorted active list, plus org
  // position. Hidden for graduates/inactives where these fields are null.
  const rankPill = (label, val, color) => `<span style="font-family:var(--font-mono);font-size:11px;color:${color};background:var(--bg-tertiary);border:1px solid var(--border);padding:3px 9px;border-radius:2px;letter-spacing:0;font-weight:700;font-variant-numeric:tabular-nums;"><span style="font-family:var(--font-sans);font-weight:600;letter-spacing:0.04em;text-transform:uppercase;font-size:10px;color:var(--text-tertiary);margin-right:4px;">${label}</span>${val}</span>`;
  // WAG rank — graduate-only. Computes the player's percentile and
  // ordinal position within the graduate pool by WAG. This makes WAG a
  // first-class signal on graduate detail pages (alongside the WAG
  // tile in the stat-tile row).
  let wagRankPill = "";
  if (p.status === "graduated" && typeof DATA !== "undefined" && Array.isArray(DATA.graduates)) {
    const myWag = gradVsFvProjection(p);
    if (myWag != null) {
      const pool = DATA.graduates
        .map(g => ({ key: g.player_key, wag: gradVsFvProjection(g) }))
        .filter(x => x.wag != null);
      pool.sort((a, b) => b.wag - a.wag);
      const idx = pool.findIndex(x => x.key === p.player_key);
      if (idx >= 0) {
        const n = pool.length;
        const rank = idx + 1;
        const pct = ((n - rank) / Math.max(1, n - 1)) * 100;
        const tip = `Among ${n} graduates with enough MLB playing time, ranked #${rank} by WAG (top ${(100 - pct).toFixed(0)}% if pct lower). Higher WAG = outperformed the FV-implied WAR/yr expectation.`;
        const color = pct >= 75 ? "var(--up)"
                    : pct >= 25 ? "var(--neon-cyan)"
                    : "var(--down)";
        wagRankPill = `<span style="font-family:var(--font-mono);font-size:11px;color:${color};background:var(--bg-tertiary);border:1px solid var(--border);padding:3px 9px;border-radius:2px;letter-spacing:0;font-weight:700;font-variant-numeric:tabular-nums;cursor:help;" title="${escapeHtml(tip)}"><span style="font-family:var(--font-sans);font-weight:600;letter-spacing:0.04em;text-transform:uppercase;font-size:10px;color:var(--text-tertiary);margin-right:4px;">WAG rank</span>#${rank} of ${n}</span>`;
      }
    }
  }
  const rankPills = (p.overall_rank != null || p.org_rank != null || wagRankPill)
    ? `<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;">
        ${p.overall_rank != null ? rankPill("Overall", "#" + p.overall_rank, "var(--neon-violet)") : ""}
        ${p.org_rank != null ? rankPill(escapeHtml(p.org || "?"), "#" + p.org_rank + (p.org_rank_total ? " of " + p.org_rank_total : ""), "var(--neon-cyan)") : ""}
        ${wagRankPill}
      </div>`
    : "";

  // FV-tier modifier on the header drives the subtle radial-gradient
  // overlay. We round the close FV to the nearest published tier (40/45/
  // 50/55/60/65/70/80) and stamp `.fv-tier-NN` so the right glow color
  // resolves from the FV palette CSS vars. Elite tiers (70+ chrome,
  // 60+ holo) also get a "rarity" border treatment — the FV ramp from
  // trading-card grading lore.
  const _fvTierClass = (() => {
    const fv = p.fv_close;
    if (fv == null) return "";
    const buckets = [80, 70, 65, 60, 55, 50, 45, 40];
    let pick = 50;
    for (const b of buckets) {
      if (fv >= b - 2.5) { pick = b; break; }
    }
    const rarity = fv >= 70 ? "card-rarity-chrome"
                 : fv >= 60 ? "card-rarity-holo"
                 : "";
    return `fv-tier-${pick}${rarity ? " " + rarity : ""}`;
  })();
  const header = `
    <a href="#" onclick="event.preventDefault();goHome();" class="back-link">← Back to list</a>
    <div class="detail-page-header ${_fvTierClass}" style="${orgStripe(p.org)}">
      <div style="display:flex;align-items:flex-start;gap:16px;flex:1;min-width:0;">
        <div class="headshot-frame">${headshotHTML(p, 130)}</div>
        ${teamLogoHTML(p.org, "lg", p.org ? fullOrgName(p.org) : "")}
        <div style="min-width:0;">
          <div class="player-display-name">${escapeHtml(p.player_name)}</div>
          <div class="player-display-meta">
            <strong style="font-weight:600;color:var(--text-primary);">${escapeHtml(p.position ?? "—")}</strong> · ${orgLink}${p.age != null ? ` · age ${p.age.toFixed(1)}` : ""}${p.birth_date ? ` · born ${p.birth_date}` : ""}
          </div>
          ${(statusPill || tjPill) ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;">${statusPill}${tjPill}</div>` : ""}
          ${rankPills}
        </div>
      </div>
      <div style="text-align:right;">
        <div style="font-family:var(--font-sans);font-size:10px;color:var(--text-tertiary);letter-spacing:0.08em;text-transform:uppercase;font-weight:600;">Current FV</div>
        ${fvBadge}
        ${(() => {
          if (p.fv_high == null && p.fv_low == null && p.fv_open == null && p.fv_close == null) return "";
          const fmtFvDate = d => {
            if (!d) return "";
            const dt = new Date(d + "T00:00:00");
            if (isNaN(dt.getTime())) return "";
            return dt.toLocaleDateString("en-US", { month: "short", year: "2-digit" });
          };
          const hDate = fmtFvDate(p.fv_high_date);
          const lDate = fmtFvDate(p.fv_low_date);
          const lowText = p.fv_low_label ?? p.fv_low ?? "—";
          const highText = p.fv_high_label ?? p.fv_high ?? "—";
          const lowFull = p.fv_low_date ? ` (${lDate})` : "";
          const highFull = p.fv_high_date ? ` (${hDate})` : "";
          const tipParts = ["High / Low across history · Open at start of current month · Close = latest"];
          if (p.fv_high_date) tipParts.push(`High first hit: ${p.fv_high_date}`);
          if (p.fv_low_date) tipParts.push(`Low first hit: ${p.fv_low_date}`);
          const tip = tipParts.join(" · ");
          return `<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);margin-top:6px;font-variant-numeric:tabular-nums;" title="${escapeHtml(tip)}">Range ${lowText}${lowFull}–${highText}${highFull} · O ${p.fv_open ?? "—"} · C ${p.fv_close ?? "—"}</div>`;
        })()}
        ${(() => {
          const s = p.stock;
          if (!s) return "";
          const fmtDate = d => {
            if (!d) return "";
            const dt = new Date(d + "T00:00:00");
            if (isNaN(dt.getTime())) return d;
            return dt.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
          };
          const sinceTxt = s.from_date ? ` since ${fmtDate(s.from_date)}` : "";
          const tipParts = [];
          if (s.from_label != null && s.to_label != null) tipParts.push(`FV ${s.from_label} → ${s.to_label}`);
          if (s.from_date && s.to_date) tipParts.push(`${s.from_date} → ${s.to_date}`);
          else if (s.from_date) tipParts.push(`since ${s.from_date}`);
          const tip = tipParts.join(" · ");
          if (s.direction === "graduated") {
            return `<div><span class="detail-stock-chip stock-chip-grad" title="${escapeHtml(tip || "Graduated")}">GRAD</span></div>`;
          }
          if (s.direction === "flat" || s.delta == null || Math.abs(s.delta) < 1.5) {
            return `<div><span class="detail-stock-chip stock-chip-flat" title="${escapeHtml(tip || "No meaningful FV movement")}">— flat</span></div>`;
          }
          const arrow = s.delta > 0 ? "▲" : "▼";
          const sign = s.delta > 0 ? "+" : "";
          const cls = s.delta > 0 ? "stock-chip-up" : "stock-chip-down";
          return `<div><span class="detail-stock-chip ${cls}" title="${escapeHtml(tip)}">${arrow} ${sign}${s.delta.toFixed(1)} FV${sinceTxt ? `<span class="detail-stock-chip-since"> · ${escapeHtml(sinceTxt.trim())}</span>` : ""}</span></div>`;
        })()}
        ${latest && latest.avg_rank != null ? `<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);margin-top:4px;">Avg rank #${latest.avg_rank.toFixed(1)}</div>` : ""}
        <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:10px;align-items:center;">
          <button class="watch-btn${watchlistHas(p.player_key) ? " is-in" : ""}" data-watch-key="${escapeHtml(p.player_key)}" type="button" title="${watchlistHas(p.player_key) ? "Remove from watchlist" : "Add to watchlist"}">${watchlistHas(p.player_key) ? "★" : "☆"}</button>
          <button class="watch-btn" id="detail-copy-url" type="button" title="Copy shareable link" aria-label="Copy link">🔗</button>
          <button class="watch-btn" id="detail-copy-key" type="button" data-copy-key="${escapeHtml(p.player_key)}" title="Copy player key" aria-label="Copy player key">⧉</button>
          <button class="compare-add-btn${compareHas(p.player_key) ? " is-in" : ""}" data-compare-key="${escapeHtml(p.player_key)}" type="button">${compareHas(p.player_key) ? "✓ In compare" : "+ Add to compare"}</button>
        </div>
      </div>
    </div>`;

  // Highlight tiles: FV high/low/open/close, age vs level, ETA. The
  // age-vs-level subline cites the empirical mean age at the prospect's
  // current level so users can see what we're comparing against.
  const eta = p.eta || {};
  const sl = p.statline || {};
  const levelNorm = (DATA.level_norms || {})[sl.level] || {};
  const ageNorm = levelNorm.age || {};
  const perfNorm = levelNorm.perf || {};
  const _ageNormCenter = ageNorm.avg_age != null ? ageNorm.avg_age : ageNorm.median_age;
  const ageSub = (avl.tier && avl.tier !== "unknown" && _ageNormCenter != null)
    ? `${sl.level} mean ${_ageNormCenter.toFixed(1)}y`
    : "";
  // `isPitcher` is derived from position (regex) rather than
  // statline.is_pitcher because graduates / inactives may not carry a
  // statline. Drives the arsenal section below.
  const sm = p.sabermetrics || {};
  const isPitcher = p.position && /^(RHP|LHP|SP|RP|MIRP|SIRP)/.test(p.position);

  // Card-back stat strip — the row that anchors the page right under the
  // header. Each tile is one of the cross-cutting signals a reader scans
  // before diving into the deeper sections: age/level fit, ETA, the
  // age-relative RPS+ pull, the acquisition channel, and a one-line
  // health summary. Tiles render conditionally so a player without
  // an ETA or without a current statline doesn't get an empty tile.
  const acqMethod = (p.acquisition && p.acquisition.method) || (p.current_acquisition && p.current_acquisition.method) || null;
  const acqLabel = acqMethod === "draft" ? "Draft"
                 : acqMethod === "international_fa" ? "IFA"
                 : acqMethod === "trade" ? "Trade"
                 : acqMethod === "waiver_claim" ? "Waiver"
                 : acqMethod === "rule_5" ? "Rule 5"
                 : acqMethod === "free_agent" ? "FA"
                 : acqMethod === "contract_purchase" ? "Purchase"
                 : null;
  const acqYear = (p.acquisition && p.acquisition.year) || null;
  // For non-draft/non-IFA acquisitions (trade, waiver, rule 5...), surface
  // the from→to org path inline in the sub-text and enumerate any
  // bounce-through intermediaries via a tooltip. `current_acquisition.event`
  // carries `from_org`, `to_org`, and the new `bounce_via` array.
  const curEv = (p.current_acquisition && p.current_acquisition.event) || null;
  const bounceVia = (curEv && Array.isArray(curEv.bounce_via)) ? curEv.bounce_via : [];
  const bouncePathTxt = bounceVia.length
    ? bounceVia.map(b => `via ${escapeHtml(b.org)} (${b.days}d)`).join(" · ")
    : "";
  let acqSub = "";
  if (p.acquisition && p.acquisition.method === "draft" && p.acquisition.pick_overall != null) {
    acqSub = `Pick #${p.acquisition.pick_overall}`;
  } else if (curEv && curEv.from_org && curEv.to_org && (acqMethod === "trade" || acqMethod === "waiver_claim" || acqMethod === "rule_5")) {
    const tip = bouncePathTxt
      ? `${curEv.from_org} → ${curEv.to_org} — ${bouncePathTxt.replace(/&[a-z]+;/g, "")}`
      : `${curEv.from_org} → ${curEv.to_org}`;
    acqSub = `<span title="${escapeHtml(tip)}">${escapeHtml(curEv.from_org)} → ${escapeHtml(curEv.to_org)}${bounceVia.length ? ` <span style="color:var(--neon-violet);font-size:9px;" title="${escapeHtml(bouncePathTxt)}">•${bounceVia.length}</span>` : ""}</span>`;
  } else if (acqYear) {
    acqSub = String(acqYear);
  }
  const hpStints = hp.il_stints_24mo || 0;
  const hpDays = hp.il_days_24mo || 0;
  // Health profile headline — describes the 24-month injury HISTORY,
  // not the player's current IL status. "Freq. Injured" is the chronic
  // flag (3+ stints OR 200+ days in 24mo); "Recent Injury" is the
  // medium-watch state (1-2 stints OR 30+ days). The currently-on-IL
  // state is surfaced separately via the IL chip elsewhere on the row.
  const healthHeadline = hp.is_post_tj ? "Post-TJ"
                       : (hpStints >= 3 || hpDays >= 200) ? "Freq. Injured"
                       : (hpStints >= 1 || hpDays >= 30) ? "Recent Injury"
                       : "Clean";
  const healthSub = (hpStints || hpDays) ? `${hpStints} stints · ${hpDays}d / 24mo` : "no IL last 24mo";
  const rp = getRpsPlus(p);
  // Performance tile — RPS+ for MiLB, but for MLB-level players we
  // swap to wRC+ (hitters) or xFIP + FIP- (pitchers) since RPS+ is a
  // MiLB-only proxy and resolves to null for MLB statlines.
  const _slLevel = (p.statline || {}).level || "";
  const _mlb = _slLevel === "MLB";
  let perfTileLabel = "RPS+";
  let perfTileValue = rp ? String(rp.plus) : "—";
  let perfTileSub   = rp ? `vs same-age peers (n=${rp.n})` : "insufficient sample";
  if (_mlb && !sm.is_pitcher && sm.wrc_plus != null) {
    perfTileLabel = "wRC+";
    perfTileValue = String(sm.wrc_plus);
    perfTileSub   = "vs MLB league mean";
  } else if (_mlb && sm.is_pitcher && (sm.xfip != null || sm.fip_minus != null)) {
    perfTileLabel = "xFIP / FIP-";
    perfTileValue = `${sm.xfip != null ? sm.xfip.toFixed(2) : "—"} / ${sm.fip_minus != null ? Math.round(sm.fip_minus) : "—"}`;
    perfTileSub   = "vs MLB league mean";
  }
  const ageTileValue = avl.tier && avl.tier !== "unknown"
    ? avl.tier.replace(/-/g, " ") + (avl.diff != null ? ` (${avl.diff > 0 ? "+" : ""}${avl.diff.toFixed(1)}y)` : "")
    : "—";
  // WAG (WAR Above Grade) — graduate-only tile. gradVsFvProjection
  // returns null when the player lacks career WAR / has <1 season /
  // has no FV on record, so the tile silently drops out for active
  // prospects without MLB time. Sub-text shows the FV anchor (e.g.,
  // "vs 55 FV projection") so the reader knows the comparison baseline.
  const wagDeltaTile = gradVsFvProjection(p);
  const wagColor = wagDeltaTile == null ? "var(--text-primary)"
                   : wagDeltaTile > 0.05 ? "var(--up)"
                   : wagDeltaTile < -0.05 ? "var(--down)"
                   : "var(--text-primary)";
  const wagRateTile = wagDeltaTile != null ? gradWarPerYr(p) : null;
  // Career WAR-by-year sparkline — a tiny SVG bar chart of the
  // graduate's WAR by season. Bars above the centerline = positive
  // WAR, below = negative. Each bar carries a per-year <title> for
  // hover. Empty/silent when no seasons data is on file.
  const careerWarSparkline = (() => {
    const seasons = (p.career_war && p.career_war.seasons) || null;
    if (!seasons) return "";
    const years = Object.keys(seasons).filter(y => seasons[y] != null).sort();
    if (!years.length) return "";
    const wars = years.map(y => Number(seasons[y]));
    const maxAbs = Math.max(1, ...wars.map(v => Math.abs(v)));
    const w = 96, h = 22;
    const barW = Math.max(5, Math.floor((w - 4) / years.length) - 2);
    const mid = h / 2;
    const bars = wars.map((v, i) => {
      const barH = Math.abs(v) / maxAbs * (h / 2 - 1.5);
      const x = 2 + i * (barW + 2);
      const y = v >= 0 ? mid - barH : mid;
      const fill = v >= 0 ? "var(--up)" : "var(--down)";
      const tipVal = v >= 0 ? `+${v.toFixed(1)}` : v.toFixed(1);
      return `<rect x="${x}" y="${y.toFixed(1)}" width="${barW}" height="${barH.toFixed(1)}" fill="${fill}"><title>${years[i]}: ${tipVal} WAR</title></rect>`;
    }).join("");
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block;margin-top:4px;" aria-label="Career WAR by season"><line x1="0" y1="${mid}" x2="${w}" y2="${mid}" stroke="var(--border-light)" stroke-width="0.5"/>${bars}</svg>`;
  })();
  const wagTile = wagDeltaTile != null ? [
    "WAG",
    `<span style="color:${wagColor};">${wagDeltaTile > 0 ? "+" : ""}${wagDeltaTile.toFixed(2)} WAR/yr</span>`,
    p.fv_close != null
      ? `vs ${Math.round(p.fv_close)} FV proj · ${wagRateTile.war_seasons_count} MLB season${wagRateTile.war_seasons_count === 1 ? "" : "s"} (PT-weighted)${careerWarSparkline}`
      : `${careerWarSparkline}`,
  ] : null;
  const tiles = [
    ["Age vs. level", ageTileValue, ageSub],
    [perfTileLabel,  perfTileValue, perfTileSub],
    ["ETA",          eta.year != null ? String(eta.year) : "—", eta.confidence ? `${eta.confidence} confidence` : ""],
    wagTile,
    acqLabel ? ["Acquired via", acqLabel, acqSub] : null,
    ["Health (24mo)", healthHeadline, healthSub],
  ].filter(Boolean);
  const tilesHtml = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px;">${tiles.map(([k, v, sub]) => `
    <div class="stat-tile">
      <div class="stat-label">${k}</div>
      <div class="stat-value">${v}</div>
      ${sub ? `<div class="stat-sub">${sub}</div>` : ""}
    </div>`).join("")}</div>`;

  // Age/level-relative performance — shows every level the player has
  // touched alongside the empirical mean for that level. The age
  // column compares the player to the level's mean age; the rate-
  // stat columns compare each rate stat to the level's mean.
  // Colors: green when the player beats the level (low ERA / high
  // OPS+ISO / low K% / high BB% / low BB-HR/9), red when they trail.
  // Hitters and pitchers get different stat columns reflecting what
  // matters at each position.
  const levelBenchmarkSection = (() => {
    const career = p.career_stats || [];
    if (!career.length) return "";
    const isP = career[0].is_pitcher;

    // Format helpers that always print the delta alongside the raw,
    // colored by whether the player is above or below the level avg.
    const fmtDeltaColor = (val, avg, lowerBetter) => {
      if (val == null || isNaN(val) || avg == null) return "—";
      const delta = val - avg;
      if (Math.abs(delta) < 0.005) return `<span style="color:var(--text-tertiary);">—</span>`;
      const isBetter = lowerBetter ? delta < 0 : delta > 0;
      const color = isBetter ? "var(--up)" : "var(--down)";
      return `<span style="color:${color};">${(delta > 0 ? "+" : "")}${delta.toFixed(2)}</span>`;
    };
    // Rate-stat formatter that strips the leading zero ("0.180" → ".180")
    // and pairs the raw value with a colored delta vs. the level avg.
    const fmtRate3 = (val, avg, lowerBetter) => {
      if (val == null || isNaN(val) || avg == null) return "—";
      const delta = val - avg;
      const isBetter = lowerBetter ? delta < -0.001 : delta > 0.001;
      const isWorse  = lowerBetter ? delta > 0.001  : delta < -0.001;
      const color = isBetter ? "var(--up)" : isWorse ? "var(--down)" : "var(--text-tertiary)";
      const fmt = n => Math.abs(n) < 1
        ? (n >= 0 ? "" : "-") + Math.abs(n).toFixed(3).replace(/^0/, "")
        : n.toFixed(3);
      const sign = delta > 0 ? "+" : "";
      return `${fmt(val)} <span style="color:${color};font-size:11px;">(${sign}${fmt(delta)} vs ${fmt(avg)})</span>`;
    };
    const fmtPct = (val, avg, lowerBetter) => {
      if (val == null || isNaN(val) || avg == null) return "—";
      const delta = val - avg;
      const isBetter = lowerBetter ? delta < -0.1 : delta > 0.1;
      const isWorse  = lowerBetter ? delta > 0.1  : delta < -0.1;
      const color = isBetter ? "var(--up)" : isWorse ? "var(--down)" : "var(--text-tertiary)";
      const sign = delta > 0 ? "+" : "";
      return `${val.toFixed(1)}% <span style="color:${color};font-size:11px;">(${sign}${delta.toFixed(1)}pp)</span>`;
    };
    const fmtNum = (val, avg, lowerBetter, digits = 2) => {
      if (val == null || isNaN(val) || avg == null) return "—";
      const delta = val - avg;
      const isBetter = lowerBetter ? delta < -0.05 : delta > 0.05;
      const isWorse  = lowerBetter ? delta > 0.05  : delta < -0.05;
      const color = isBetter ? "var(--up)" : isWorse ? "var(--down)" : "var(--text-tertiary)";
      const sign = delta > 0 ? "+" : "";
      return `${val.toFixed(digits)} <span style="color:${color};font-size:11px;">(${sign}${delta.toFixed(digits)} vs ${avg.toFixed(digits)})</span>`;
    };
    const num = v => {
      const n = parseFloat(v);
      return isFinite(n) ? n : null;
    };

    const rows = career.map(c => {
      const norm = (DATA.level_norms || {})[c.level] || {};
      const a = norm.age || {};
      const perf = norm.perf || {};
      const seasonMid = new Date(`${c.season}-07-01`).getTime();
      let ageAtSeason = null;
      if (p.birth_date) {
        const birthT = new Date(p.birth_date).getTime();
        ageAtSeason = ((seasonMid - birthT) / (365.25 * 86400000));
      }
      const _ageCenter = a.avg_age != null ? a.avg_age : a.median_age;
      const ageDiff = (ageAtSeason != null && _ageCenter != null)
        ? (ageAtSeason - _ageCenter) : null;
      const ageDiffHtml = ageDiff != null
        ? `<span style="color:${ageDiff <= -1 ? "var(--up)" : ageDiff >= 1 ? "var(--down)" : "var(--text-tertiary)"};">${ageDiff > 0 ? "+" : ""}${ageDiff.toFixed(1)}y</span>`
        : "—";
      // Build the stat cells. Hitters get OPS / ISO / BB% / K%;
      // pitchers get ERA / WHIP / K/9 / BB/9.
      let statCells;
      if (isP) {
        // Pitcher stat cells: ERA / WHIP / K% / BB% per batter faced.
        // K% / BB% replace the older K/9 / BB/9 columns because per-
        // batter rates better normalize starter vs. reliever workload
        // (a reliever K/9 of 14 reads dominant but levels out in K%).
        statCells = `
          <td style="font-variant-numeric:tabular-nums;">${fmtNum(num(c.era), perf.avg_era, true, 2)}</td>
          <td style="font-variant-numeric:tabular-nums;">${fmtNum(num(c.whip), perf.avg_whip, true, 2)}</td>
          <td style="font-variant-numeric:tabular-nums;">${fmtPct(num(c.k_pct), perf.avg_pitcher_k_pct, false)}</td>
          <td style="font-variant-numeric:tabular-nums;">${fmtPct(num(c.bb_pct), perf.avg_pitcher_bb_pct, true)}</td>`;
      } else {
        const iso = c.iso != null ? c.iso : (num(c.slg) != null && num(c.avg) != null ? num(c.slg) - num(c.avg) : null);
        statCells = `
          <td style="font-variant-numeric:tabular-nums;">${fmtRate3(num(c.ops), perf.avg_ops, false)}</td>
          <td style="font-variant-numeric:tabular-nums;">${fmtRate3(iso, perf.avg_iso, false)}</td>
          <td style="font-variant-numeric:tabular-nums;">${fmtPct(num(c.bb_pct), perf.avg_bb_pct, false)}</td>
          <td style="font-variant-numeric:tabular-nums;">${fmtPct(num(c.k_pct), perf.avg_k_pct, true)}</td>`;
      }
      return `<tr>
        <td>${c.season}</td>
        <td><span class="level-pill level-neutral">${c.level}</span></td>
        <td style="font-variant-numeric:tabular-nums;">${ageAtSeason != null ? ageAtSeason.toFixed(1) : "—"} vs ${_ageCenter != null ? _ageCenter.toFixed(1) : "—"} ${ageDiffHtml}</td>
        ${statCells}
      </tr>`;
    }).join("");
    const statHeaders = isP
      ? `<th>ERA vs lvl</th><th>WHIP vs lvl</th><th>K% vs lvl</th><th>BB% vs lvl</th>`
      : `<th>OPS vs lvl</th><th>ISO vs lvl</th><th>BB% vs lvl</th><th>K% vs lvl</th>`;
    return `<table class="detail-table"><thead><tr><th>Season</th><th>Level</th><th>Age vs lvl</th>${statHeaders}</tr></thead><tbody>${rows}</tbody></table>`;
  })();

  const chartSection = (p.points && p.points.length >= 2)
    ? `<div class="detail-title">FV history</div>${makeBigLineChart(p.points, p.fv_open, p.fv_close, p.graduation_date, p.trades, p.career_stats, p)}
       ${transactionLegend()}`
    : `<div style="color:var(--text-tertiary);font-size:12px;">Not enough FV updates yet for a chart.</div>`;

  // Consolidated career table — was two adjacent tables (raw "Stats by
  // season" + colored "Age & level-relative performance"). The toggle
  // chip above flips between the two: ON (default) shows the colored
  // delta-vs-level table; OFF strips the deltas and renders raw cells.
  // State is ephemeral — re-render starts on deltas-ON. Title pill row
  // mirrors the old "Age & level-relative" header (RPS+ / scout rates).
  const careerRawTableHTML = makeCareerTable(p.career_stats);
  const consolidatedCareerSection = (p.career_stats && p.career_stats.length)
    ? `<div class="detail-title">Career by season
         <span class="detail-title-sub">colored delta vs. level mean when "show level deltas" is on</span>
         <span style="margin-left:8px;vertical-align:middle;display:inline-flex;gap:4px;flex-wrap:wrap;">${rpsPlusPillHTML(p)}${scoutRatesHTML(p)}</span>
       </div>
       ${makeCareerTrendStrip(p.career_stats)}
       <div style="margin-bottom:6px;">
         <button type="button" class="chip active" data-career-toggle="deltas" style="font-size:10px;padding:3px 10px;">Show level deltas</button>
       </div>
       <div class="career-by-season" data-career-mode="deltas">
         <div data-career-panel="deltas">${levelBenchmarkSection || careerRawTableHTML}</div>
         <div data-career-panel="raw" style="display:none;">${careerRawTableHTML}</div>
       </div>`
    : "";

  const sourceSection = `<div class="detail-title">Source-by-source FV history</div>${makePerSourceHistory(p.points || [])}`;

  // Sabermetrics block — wRC+/xFIP for MLB players, level-relative
  // proxies (OPS+ / ERA-) otherwise. Title flexes with what's shown
  // so the user always knows what they're looking at.
  const _sm = p.sabermetrics || {};
  const _hasRealSabr = (_sm.wrc_plus != null || _sm.xfip != null);
  const sabermetricsTitle = _hasRealSabr
    ? `Advanced stats <span class="detail-title-sub">FanGraphs sabermetrics (MLB)</span>`
    : `Advanced stats <span class="detail-title-sub">level-relative proxies · MLB sabermetrics unavailable for MiLB</span>`;
  const sabermetricsSection = `<div class="detail-title">${sabermetricsTitle}</div>${makeSabermetricsBlock(p)}`;

  // Surplus-value sidebar card — FV-implied trade value ($M) per the
  // Craig Edwards / FanGraphs 2019 framework, paired with the
  // acquisition method + signing bonus and an implied ROI line. The
  // financial anchor that the rest of the sabermetrics / tools cards
  // contextualize. Hidden for players without an FV grade.
  const surplusValueSection = (() => {
    const fv = p.fv_close ?? null;
    if (fv == null && !p.acquisition) return "";
    const _isPit = !!(p.position && /^(RHP|LHP|SP|RP|MIRP|SIRP)/.test(p.position));
    const surplus = estimateSurplusValueMM(fv, _isPit);
    const fmtUsd = m => {
      if (m == null) return "—";
      if (m >= 100) return `$${m.toFixed(0)}M`;
      if (m >= 10)  return `$${m.toFixed(0)}M`;
      if (m >= 1)   return `$${m.toFixed(1)}M`;
      return `$${(m * 1000).toFixed(0)}K`;
    };
    const surplusColor = surplus == null ? "var(--text-primary)"
                       : surplus >= 50 ? "var(--up)"
                       : surplus >= 10 ? "var(--neon-cyan)"
                       : "var(--text-primary)";
    const surplusRow = surplus != null
      ? `<div style="display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:8px;border-bottom:1px solid var(--border-light);margin-bottom:8px;">
           <div>
             <div style="font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700;">${p.status === "graduated" ? "Expected surplus (FV)" : "Surplus value"}</div>
             <div style="font-size:10px;color:var(--text-tertiary);margin-top:2px;font-style:italic;">FV ${Math.round(fv)} ${_isPit ? "pitcher" : "hitter"} · 6yr cost-controlled</div>
           </div>
           <div style="font-family:var(--font-mono);font-size:${p.status === "graduated" ? "16px" : "20px"};font-weight:700;color:${surplusColor};font-variant-numeric:tabular-nums;" title="Estimated MLB surplus value over the player's 6-year cost-controlled window. Derived from FV ${Math.round(fv)} via the FanGraphs / Craig Edwards 2019 framework (hitter/pitcher split). Real surplus depends on health, performance variance, and changes in $/WAR market rate.">${fmtUsd(surplus)}</div>
         </div>`
      : "";
    // Graduate-only: REALIZED surplus value computed from actual MLB
    // WAR vs estimated salary paid. Side-by-side with the expected
    // (FV-implied) row above so the reader can see whether the
    // graduate has outperformed or underperformed their grade.
    // Realized = sum of (season WAR × $/WAR market) − sum of estimated
    // salary (league min for pre-arb, arb fractions for years 4-6,
    // FA equivalent thereafter). Spotrac contract data is a follow-up
    // wave that will replace the salary estimate with exact AAV.
    let realizedRow = "";
    let realizedDelta = null;
    if (p.status === "graduated") {
      const realized = estimateRealizedSurplusValueMM(p);
      if (realized) {
        const rColor = realized.realized_surplus >= 50 ? "var(--up)"
                     : realized.realized_surplus >= 10 ? "var(--neon-cyan)"
                     : realized.realized_surplus >= 0 ? "var(--text-primary)"
                     : "var(--down)";
        const actualSeasons = realized.actual_salary_seasons || 0;
        const salaryNote = actualSeasons > 0
          ? `${actualSeasons} season${actualSeasons === 1 ? "" : "s"} use Spotrac's actual contract salary; remaining seasons use the league-min + arb-fraction model (pre-arb at MLB minimum, arb years at 30/55/80% of FA-equivalent, FA years at fair market)`
          : `League-min + arb-fraction model: pre-arb at MLB minimum, arb years scaled to 30/55/80% of FA-equivalent, FA years at fair market`;
        const rTip = `Career WAR ${realized.total_war.toFixed(1)} × $${DOLLARS_PER_WAR_MM}M/WAR = ${fmtUsd(realized.total_value)} market value. Subtract salary paid ($${realized.total_salary.toFixed(1)}M — ${salaryNote}). Result = realized surplus value over ${realized.season_count} MLB season${realized.season_count === 1 ? "" : "s"}.`;
        realizedRow = `<div style="display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:8px;border-bottom:1px solid var(--border-light);margin-bottom:8px;" title="${escapeHtml(rTip)}">
           <div>
             <div style="font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700;">Realized surplus (WAR)</div>
             <div style="font-size:10px;color:var(--text-tertiary);margin-top:2px;font-style:italic;">${realized.total_war.toFixed(1)} WAR over ${realized.season_count} season${realized.season_count === 1 ? "" : "s"}</div>
           </div>
           <div style="font-family:var(--font-mono);font-size:20px;font-weight:700;color:${rColor};font-variant-numeric:tabular-nums;">${fmtUsd(realized.realized_surplus)}</div>
         </div>`;
        if (surplus != null) {
          realizedDelta = realized.realized_surplus - surplus;
        }
      }
    }
    // Δ vs expected — only when both sides are present.
    let surplusDeltaRow = "";
    if (realizedDelta != null) {
      const dColor = realizedDelta >= 5 ? "var(--up)"
                   : realizedDelta <= -5 ? "var(--down)"
                   : "var(--text-tertiary)";
      const dSign = realizedDelta > 0 ? "+" : "";
      surplusDeltaRow = `<div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--border-light);margin-bottom:8px;">
         <div style="font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700;" title="Realized surplus minus expected (FV-implied) surplus. Positive = the graduate has outperformed the bet implied by their final prospect grade.">Δ vs expected</div>
         <div style="font-family:var(--font-mono);font-size:14px;font-weight:700;color:${dColor};font-variant-numeric:tabular-nums;">${dSign}${fmtUsd(Math.abs(realizedDelta)).replace("$", realizedDelta < 0 ? "−$" : "$")}</div>
       </div>`;
    }
    // Graduate-only: market-AAV equivalent of the realized WAR rate.
    // gradWarPerYr returns a playing-time-weighted WAR/yr value when
    // the graduate has ≥1 full-season equivalent of MLB playing time;
    // multiplying by the $/WAR anchor gives the annual contract value
    // a comparable free agent would command on the open market.
    let aavRow = "";
    if (p.status === "graduated") {
      const warRate = gradWarPerYr(p);
      if (warRate && warRate.war_per_yr != null) {
        const aav = estimateMarketAavMM(warRate.war_per_yr);
        const aavColor = aav == null ? "var(--text-primary)"
                       : aav >= 30 ? "var(--up)"
                       : aav >= 10 ? "var(--neon-cyan)"
                       : "var(--text-primary)";
        aavRow = `<div style="display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:8px;border-bottom:1px solid var(--border-light);margin-bottom:8px;">
           <div>
             <div style="font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700;">Realized market AAV</div>
             <div style="font-size:10px;color:var(--text-tertiary);margin-top:2px;font-style:italic;">${warRate.war_per_yr.toFixed(2)} WAR/yr × $${DOLLARS_PER_WAR_MM}M · ${warRate.war_seasons_count} season${warRate.war_seasons_count === 1 ? "" : "s"}</div>
           </div>
           <div style="font-family:var(--font-mono);font-size:17px;font-weight:700;color:${aavColor};font-variant-numeric:tabular-nums;" title="Market-equivalent Average Annual Value. Multiplies the graduate's playing-time-weighted WAR/yr by the prevailing $/WAR market rate (~$${DOLLARS_PER_WAR_MM}M, the recent free-agent winter average). What a comparable free agent would command per year on the open market.">${fmtUsd(aav)}/yr</div>
         </div>`;
      }
    }
    // Acquisition headline — method label + sub-text. Mirrors the
    // existing acqSection in the More-details accordion but tighter,
    // and lives above-the-fold here so the financial story is whole.
    const a = p.acquisition || {};
    const fmtBonus = b => b == null ? null : `$${(b / 1_000_000).toFixed(b >= 1_000_000 ? 1 : 2)}M`;
    let acqLabel = "—";
    let acqSub = "";
    let acqBonus = null;
    if (a.method === "draft") {
      const pickTxt = a.pick_overall != null
        ? `Round ${escapeHtml(a.round_label || "?")} · Pick #${a.pick_overall}${a.year ? " · " + a.year : ""}`
        : `Round ${escapeHtml(a.round_label || "?")}${a.year ? " · " + a.year : ""}`;
      acqLabel = "Drafted";
      acqSub = pickTxt;
      acqBonus = a.bonus_usd;
    } else if (a.method === "international_fa") {
      acqLabel = "International FA";
      acqSub = a.year ? `Signed ${a.year}` : "Signed as IFA";
      acqBonus = a.bonus_usd;
    }
    const acqRow = (acqLabel !== "—")
      ? `<div style="display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:8px;border-bottom:${acqBonus != null ? "1px solid var(--border-light)" : "none"};margin-bottom:${acqBonus != null ? "8px" : "0"};">
           <div>
             <div style="font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700;">Acquired</div>
             <div style="font-size:10px;color:var(--text-tertiary);margin-top:2px;font-style:italic;">${escapeHtml(acqSub)}</div>
           </div>
           <div style="font-family:var(--font-sans);font-size:13px;font-weight:600;color:var(--text-primary);">${escapeHtml(acqLabel)}</div>
         </div>`
      : "";
    const bonusFmt = fmtBonus(acqBonus);
    const bonusRow = bonusFmt
      ? `<div style="display:flex;justify-content:space-between;align-items:center;${surplus != null && acqBonus != null ? "padding-bottom:8px;border-bottom:1px solid var(--border-light);margin-bottom:8px;" : ""}">
           <div style="font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700;">Signing bonus</div>
           <div style="font-family:var(--font-mono);font-size:13px;color:var(--text-primary);font-variant-numeric:tabular-nums;">${bonusFmt}</div>
         </div>`
      : "";
    // Implied ROI — surplus value minus signing bonus. Only when both
    // are known. Positive surplus means the org is sitting on more
    // value than they invested.
    let roiRow = "";
    if (surplus != null && acqBonus != null) {
      const bonusInMM = acqBonus / 1_000_000;
      const roi = surplus - bonusInMM;
      const roiColor = roi > 0 ? "var(--up)" : roi < 0 ? "var(--down)" : "var(--text-tertiary)";
      const roiSign = roi > 0 ? "+" : "";
      roiRow = `<div style="display:flex;justify-content:space-between;align-items:center;">
           <div style="font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700;" title="Estimated surplus value − signing bonus. Positive means the org is sitting on more value than it invested.">Implied ROI</div>
           <div style="font-family:var(--font-mono);font-size:13px;font-weight:600;color:${roiColor};font-variant-numeric:tabular-nums;">${roiSign}${fmtUsd(Math.abs(roi)).replace("$", roi < 0 ? "−$" : "$")}</div>
         </div>`;
    }
    const inner = surplusRow + realizedRow + surplusDeltaRow + aavRow + acqRow + bonusRow + roiRow;
    if (!inner) return "";
    return `<div class="detail-title">Surplus value <span class="detail-title-sub">FV-implied · FanGraphs 2019 framework</span></div>
      <div class="detail-card">${inner}</div>`;
  })();

  // Contract details — Spotrac-sourced year-by-year salary breakdown.
  // Lives alongside (NOT inside) the surplus value card so the user can
  // see the full contract picture without losing the FV-implied vs
  // realized comparison. Hidden when the player has no contract data.
  const contractDetailsSection = (() => {
    const c = p.current_contract;
    if (!c || c.aav_usd == null) return "";
    const fmtUsd = n => {
      if (n == null) return "—";
      if (n >= 1_000_000) return `$${(n / 1_000_000).toFixed(n >= 10_000_000 ? 1 : 2)}M`;
      if (n >= 1_000)     return `$${Math.round(n / 1_000)}K`;
      return `$${n}`;
    };
    const currentYear = new Date().getUTCFullYear();
    const salaryByYear = c.salary_by_year || {};
    const years = Object.keys(salaryByYear).sort();
    const yearRows = years.map(yr => {
      const isCurrent = String(yr) === String(currentYear);
      const sal = salaryByYear[yr];
      const tag = isCurrent
        ? `<span style="font-size:9px;color:var(--neon-cyan);background:rgba(143,205,245,0.08);padding:1px 6px;border-radius:2px;font-family:var(--font-sans);font-weight:600;letter-spacing:0.04em;text-transform:uppercase;margin-left:6px;">Now</span>`
        : "";
      return `<tr>
        <td style="padding:4px 8px 4px 0;color:var(--text-secondary);font-family:var(--font-mono);font-size:11.5px;font-variant-numeric:tabular-nums;">${yr}${tag}</td>
        <td style="padding:4px 0;text-align:right;color:var(--text-primary);font-family:var(--font-mono);font-size:11.5px;font-variant-numeric:tabular-nums;font-weight:600;">${fmtUsd(sal)}</td>
      </tr>`;
    }).join("");
    const spotracLink = c.spotrac_id
      ? `<a href="https://www.spotrac.com/mlb/player/_/id/${escapeHtml(c.spotrac_id)}/" target="_blank" rel="noopener" style="font-size:10px;color:var(--neon-cyan);text-decoration:none;letter-spacing:0.02em;">Spotrac page →</a>`
      : "";
    const headlineRow = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:10px;border-bottom:1px solid var(--border-light);margin-bottom:10px;gap:10px;">
        <div>
          <div style="font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700;"><span class="g-term" data-term="aav">AAV</span></div>
          <div style="font-size:10px;color:var(--text-tertiary);margin-top:2px;font-style:italic;">${c.years_remaining || "?"} yr · signed thru ${c.signed_through || "?"}</div>
        </div>
        <div style="font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--text-primary);font-variant-numeric:tabular-nums;" title="${escapeHtml("Average Annual Value — total contract / years remaining (present-value adjusted by Spotrac for deferral-heavy deals)")}">${fmtUsd(c.aav_usd)}</div>
      </div>`;
    const totalsRow = `
      <div style="display:flex;justify-content:space-between;align-items:center;padding-top:10px;margin-top:6px;border-top:1px solid var(--border-light);font-size:11px;color:var(--text-secondary);">
        <span>Total value: <strong style="color:var(--text-primary);font-family:var(--font-mono);font-variant-numeric:tabular-nums;">${fmtUsd(c.total_usd)}</strong></span>
        ${spotracLink}
      </div>`;
    return `<div class="detail-title">Contract details <span class="detail-title-sub">Spotrac · active deal</span></div>
      <div class="detail-card">
        ${headlineRow}
        <table style="width:100%;border-collapse:collapse;">
          <tbody>${yearRows}</tbody>
        </table>
        ${totalsRow}
      </div>`;
  })();

  // Scouting tools card — per-tool 20-80 grades + the three composites
  // (Offensive/Defensive/Overall for hitters; Stuff/Command/Overall for
  // pitchers). Composites also carry a ToolGrade+ index (100 = cohort
  // mean, 10 pts = 1 stdev) so a "57 overall" reads in relation to the
  // active prospect pool. Skipped when no source has graded this player.
  const toolsSection = (() => {
    const t = p.tools;
    if (!t || !t.grades || !Object.keys(t.grades).length) return "";
    const isPitcher = !!((p.statline || {}).is_pitcher
                        || (p.sabermetrics || {}).is_pitcher
                        || ["RHP","LHP","SP","RP","MIRP","SIRP","P"].includes((p.position||"").split("/")[0]));
    // Half-grade rendering: "57.5" stays as ".5" when not an integer.
    const fmt = v => v == null ? "—"
      : (Number.isInteger(v) ? String(v) : v.toFixed(1));
    const badgeFor = v => v == null
      ? `<span style="color:var(--text-tertiary);font-size:11px;">—</span>`
      : `<span class="fv-badge ${fvClass(String(Math.round(v)))} size-sm">${fmt(v)}</span>`;
    const plusPill = (val) => {
      if (val == null) return "";
      const cls = val >= 110 ? "is-pos" : val <= 90 ? "is-neg" : "is-neutral";
      return `<span class="tool-pill ${cls}" title="Tools+ ${val} · 100 = cohort mean composite (outlier-biased, power-3 mean), 10 pts = 1 stdev">Tools+${val}</span>`;
    };
    // Composite chip — vertical stack: label · (grade badge + T+ pill).
    // The headline (Overall) gets a slightly stronger background to
    // anchor the eye; Off/Def/Stuff/Cmd are equally-weighted slots.
    const compositeChip = (label, raw, plus, tip, headline) => {
      if (raw == null && plus == null) return "";
      const titleAttr = tip ? ` title="${escapeHtml(tip)}"` : "";
      const cls = headline ? "tools-composite-chip is-headline" : "tools-composite-chip";
      return `<div class="${cls}"${titleAttr}>
        <div class="tools-composite-chip-label">${escapeHtml(label)}</div>
        <div class="tools-composite-chip-value">${badgeFor(raw)} ${plusPill(plus)}</div>
      </div>`;
    };
    const dualMarkerHTML = `<span class="tool-dual-marker" title="Speed contributes to BOTH offensive (baserunning, BABIP, extra bases) and defensive (range, jumps) composites.">◆</span>`;
    const gradeCell = (key, label) => {
      const v = (t.grades || {})[key];
      const spread = (t.spread || {})[key];
      const spreadTag = (spread && spread >= 10)
        ? `<span style="font-size:9px;color:var(--neon-amber);margin-left:4px;" title="Source spread ${spread} grade-points">±${Math.round(spread)}</span>`
        : "";
