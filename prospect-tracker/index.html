      const dualMark = key === "speed" ? dualMarkerHTML : "";
      return `<div class="tools-grade-cell">
        <span class="tools-grade-name">${escapeHtml(label)}${dualMark}${spreadTag}</span>
        ${badgeFor(v)}
      </div>`;
    };
    let compositeBar = "";
    let groupBlocks = "";
    let hasSpeedMarker = false;
    if (isPitcher) {
      const overallChip = compositeChip("Overall", t.composite_overall, t.composite_overall_plus,
        "Weighted composite: 65% stuff + 35% command", true);
      const stuffGradeChip = compositeChip("Stuff grade+", t.composite_stuff, t.composite_stuff_plus,
        "Scouting composite: power-mean of fastball + secondaries, z-scored vs prospect cohort", false);
      const cmdChip = compositeChip("Command", t.composite_cmd, t.composite_cmd_plus,
        "Control / command grade", false);
      // Peripheral STF+ — K%, BB%, HR/9 vs level mean. Lives on the
      // statline, not the tools dict, so we pull it from `p.statline`.
      const stfPeriph = (p.statline || {}).stf_plus_periph;
      const stfChip = stfPeriph != null
        ? compositeChip("STF+", null, stfPeriph,
            "Peripheral stuff index — z-score composite of K%, BB%, HR/9 vs level mean (20-IP / 30-BF sample gate)", false)
        : "";
      compositeBar = (overallChip || stuffGradeChip || stfChip || cmdChip)
        ? `<div class="tools-composite-bar">${overallChip}${stuffGradeChip}${stfChip}${cmdChip}</div>`
        : "";
      const stuffGrid = ["fb","sl","cb","ch"]
        .filter(k => (t.grades || {})[k] != null)
        .map(k => gradeCell(k, ({fb:"Fastball", sl:"Slider", cb:"Curveball", ch:"Changeup"})[k]))
        .join("");
      const cmdGrid = (t.grades || {}).cmd != null ? gradeCell("cmd", "Command") : "";
      groupBlocks = `
        ${stuffGrid ? `<div class="tools-grade-grid">${stuffGrid}</div>` : ""}
        ${cmdGrid ? `<div class="tools-grade-grid">${cmdGrid}</div>` : ""}
      `;
    } else {
      const overallChip = compositeChip("Overall", t.composite_overall, t.composite_overall_plus,
        "Weighted composite: 70% offensive + 30% defensive", true);
      const offChip = compositeChip("Offensive", t.composite_off, t.composite_off_plus,
        "Average of hit · game power · raw power · speed", false);
      const defChip = compositeChip("Defensive", t.composite_def, t.composite_def_plus,
        "Average of field · throw · speed", false);
      compositeBar = (overallChip || offChip || defChip)
        ? `<div class="tools-composite-bar">${overallChip}${offChip}${defChip}</div>`
        : "";
      // Unified grade grid — speed appears once (with the ◆ dual marker)
      // even though it contributes to both composites. Order mirrors the
      // 5-tool scouting convention: hit / power / speed / field / throw.
      const hitterOrder = ["hit","game_pwr","raw_pwr","speed","field","throw"];
      const labels = {hit:"Hit", game_pwr:"Game pwr", raw_pwr:"Raw pwr",
                      speed:"Speed", field:"Field", throw:"Throw"};
      const cells = hitterOrder
        .filter(k => (t.grades || {})[k] != null)
        .map(k => {
          if (k === "speed") hasSpeedMarker = true;
          return gradeCell(k, labels[k]);
        })
        .join("");
      groupBlocks = cells ? `<div class="tools-grade-grid">${cells}</div>` : "";
    }
    const sources = (t.publishing_sources || [])
      .map(s => SOURCE_LABELS[s] || s)
      .join(" · ");
    const footerParts = [];
    if (hasSpeedMarker) {
      footerParts.push(`<span class="tools-footer-legend">◆</span> Speed counts toward both composites`);
    }
    if (sources) {
      footerParts.push(`Publishing: ${escapeHtml(sources)}`);
    }
    const footer = footerParts.length
      ? `<div class="tools-footer">${footerParts.join("<br>")}</div>`
      : "";
    return `<div class="detail-title">Tools <span class="detail-title-sub">20-80 scouting grades · consensus across sources</span></div>
      <div class="tools-card">
        ${compositeBar}
        ${groupBlocks}
        ${footer}
      </div>`;
  })();

  // Statcast / Baseball Savant block — populated when CSV exports are
  // present in the prospect-tracker root (storage.py wires this up via
  // prospect_savant.attach_prospect_savant). Renders quality-of-contact
  // tiles for hitters and pitch-quality tiles for pitchers. Silently
  // omitted when the field is absent (MiLB players, or no CSV uploaded).
  const savantSection = (p.prospect_savant && Object.keys(p.prospect_savant).length)
    ? `<div class="detail-title">Statcast / Savant <span class="detail-title-sub">${escapeHtml(p.prospect_savant.level || "")} ${escapeHtml(p.prospect_savant.role || "")} · prospect-savant export</span></div>${makeSavantBlock(p.prospect_savant)}`
    : "";

  const arsenalSection = isPitcher
    ? `<div class="detail-title">Pitch arsenal</div>${makeArsenalBlock(p.pitch_arsenal)}`
    : "";

  // Statcast swing-zone heatmap. Graduates only; needs the 13-bin
  // `swing_zone_heat` array attached by storage.py. Reuses the existing
  // `makeStrikeZoneHeatmap` renderer by passing a synthetic `zone_heat`
  // wrapper.
  const swingZoneSection = (() => {
    if (p.status !== "graduated") return "";
    const heat = p.swing_zone_heat;
    if (!Array.isArray(heat) || !heat.some(v => v != null)) return "";
    return `<div class="detail-title"><span class="g-term" data-term="strike_zone">Swing-zone heat</span> <span class="detail-title-sub">Statcast · current MLB season · heat = swing rate per zone</span></div>
      <div class="detail-card" style="display:flex;justify-content:center;padding:14px 12px;">
        ${makeStrikeZoneHeatmap({ zone_heat: heat })}
      </div>`;
  })();

  // Career projection arc — graduate-only. Pairs the existing WAG bar
  // chart (per-season WAR vs FV-implied baseline) with a one-line
  // summary so the graduate detail page tells the full performance-vs-
  // projection story above the fold.
  const projectionArcSection = (() => {
    if (p.status !== "graduated") return "";
    const wagChart = makeWagChart(p);
    if (!wagChart) return "";
    const delta = gradVsFvProjection(p);
    const r = gradWarPerYr(p);
    const fv = p.fv_close_raw ?? p.fv_close;
    const isPit = !!(p.sabermetrics && p.sabermetrics.is_pitcher);
    const expected = fv != null ? fvExpectedWarPerYr(fv, isPit) : null;
    let summary = "";
    if (delta != null && r && expected != null) {
      const verb = Math.abs(delta) < 0.05
        ? "Matching"
        : delta > 0 ? "Outperforming" : "Trailing";
      const color = delta > 0.05 ? "var(--up)"
                  : delta < -0.05 ? "var(--down)"
                  : "var(--text-secondary)";
      const sign = delta > 0 ? "+" : "";
      summary = `<div style="font-size:12px;color:var(--text-secondary);margin-top:8px;">
        <strong style="color:${color};">${verb} projection by ${sign}${delta.toFixed(1)} WAR/yr</strong>
        over ${r.war_seasons_count} MLB season${r.war_seasons_count === 1 ? "" : "s"}.
        <span style="color:var(--text-tertiary);">Actual ${r.war_per_yr.toFixed(2)} vs FV ${Math.round(fv)} baseline ${expected.toFixed(2)} WAR/yr.</span>
      </div>`;
    }
    return `<div class="detail-title"><span class="g-term" data-term="wag">Projection vs reality</span> <span class="detail-title-sub">per-season WAR vs FV-implied baseline</span></div>
      <div class="detail-card" style="padding:14px 14px 10px;">
        ${wagChart}
        ${summary}
      </div>`;
  })();

  const tradesSection = `<div class="detail-title">Transaction history</div>${makeTransactionHistoryBlock(p)}`;

  // Injury history is folded into the health profile sidebar card below
  // as a collapsible <details> block, so all health information lives
  // together. Healthy players with no history don't render the block.

  // Acquisition info: drafted prospects show pick + bonus; IFAs show
  // "International FA" + (when known) signing details. Section omitted
  // when we don't have an acquisition record (rare — only prospects whose
  // MLBAM ID couldn't be resolved at all).
  const acqSection = (() => {
    const a = p.acquisition;
    if (!a) return "";
    const fmtBonus = b => b == null ? "—" : `$${b.toLocaleString("en-US")}`;
    if (a.method === "draft") {
      const pick = a.pick_overall != null
        ? `Round ${escapeHtml(a.round_label || "?")} · Pick ${a.pick_overall} overall`
        : `Round ${escapeHtml(a.round_label || "?")}`;
      const team = a.team_name ? ` by ${escapeHtml(a.team_name)}` : "";
      const school = a.school ? `<div style="font-size:11px;color:var(--text-tertiary);margin-top:2px;">From ${escapeHtml(a.school)}</div>` : "";
      return `<div class="detail-title">Acquisition · MLB Draft</div>
        <div style="border:1px solid var(--border-light);background:var(--bg-secondary);padding:10px 12px;border-radius:2px;">
          <div style="font-size:14px;color:var(--text-primary);">${a.year} · ${pick}${team}</div>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">Signing bonus: <span style="color:var(--neon-cyan);font-variant-numeric:tabular-nums;">${fmtBonus(a.bonus_usd)}</span></div>
          ${school}
        </div>`;
    }
    if (a.method === "international_fa") {
      // Headline mirrors the draft block: "<year> · Signed by <team>".
      // Falls through gracefully when partial fields are missing — we
      // always have at least one of (year, team, generic label).
      const team = a.team_name ? `Signed by ${escapeHtml(a.team_name)}` : "Signed as an international amateur free agent";
      const headline = a.year
        ? `${a.year} · ${team}`
        : team;
      // Render the precise signing date on its own line when present.
      // Date arrives as ISO (YYYY-MM-DD); format to "Jul 2, 2019" for
      // readability. Skip the line when only the year is known (it'd
      // duplicate the headline).
      let dateLine = "";
      if (a.signing_date) {
        const d = new Date(a.signing_date + "T00:00:00");
        const formatted = isNaN(d.getTime())
          ? a.signing_date
          : d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
        dateLine = `<div style="font-size:11px;color:var(--text-tertiary);margin-top:2px;">Signed ${escapeHtml(formatted)}</div>`;
      }
      const bonusLine = a.bonus_usd != null
        ? `<div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">Signing bonus: <span style="color:var(--neon-cyan);font-variant-numeric:tabular-nums;">${fmtBonus(a.bonus_usd)}</span></div>`
        : `<div style="font-size:11px;color:var(--text-tertiary);margin-top:4px;">Signing-bonus data not on file.</div>`;
      return `<div class="detail-title">Acquisition · International FA</div>
        <div style="border:1px solid var(--border-light);background:var(--bg-secondary);padding:10px 12px;border-radius:2px;">
          <div style="font-size:14px;color:var(--text-primary);">${headline}</div>
          ${bonusLine}
          ${dateLine}
        </div>`;
    }
    return "";
  })();

  // Injury block — only shown when the player is currently on IL.
  // Combines the placement description, list type, since-date, and a
  // running day counter so a reader gets full context without scrolling
  // to the transaction history table.
  const ilSection = (() => {
    const il = p.il_status;
    if (!il || !il.is_on_il) return "";
    let days = null;
    if (il.since) {
      const ms = Date.now() - new Date(il.since + "T00:00:00").getTime();
      if (!isNaN(ms) && ms > 0) days = Math.floor(ms / 86400000);
    }
    let sinceFmt = il.since;
    if (il.since) {
      const d = new Date(il.since + "T00:00:00");
      if (!isNaN(d.getTime())) {
        sinceFmt = d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
      }
    }
    const desc = il.description
      ? `<div style="font-size:11px;color:var(--text-secondary);margin-top:6px;line-height:1.4;">${escapeHtml(il.description)}</div>`
      : "";
    return `<div class="detail-title" style="color:var(--neon-amber);">Currently on ${escapeHtml(il.type || "?")} IL</div>
      <div style="border:1px solid var(--accent-il-border);background:var(--accent-il-soft);padding:12px 14px;border-radius:var(--radius-sm);">
        <div style="font-size:14px;color:var(--text-primary);">
          Since ${escapeHtml(sinceFmt || "—")}${days != null ? ` <span style="color:var(--neon-amber);font-variant-numeric:tabular-nums;">· ${days} day${days === 1 ? "" : "s"}</span>` : ""}
        </div>
        ${desc}
      </div>`;
  })();

  // Health profile sidebar card — surfaces the 24-month IL aggregate
  // even when the player isn't currently on IL. Three numbers + the
  // Tommy-John state at a glance: stint count, total IL days, and the
  // surgery date (when applicable). Lets a scouting reader assess
  // durability risk without scrolling to the Injury history table.
  const healthSection = (() => {
    const hp = p.health_profile || {};
    const stints = hp.il_stints_24mo || 0;
    const days = hp.il_days_24mo || 0;
    const history = ((p.roster_status || {}).injury_history) || [];
    const hasAnySignal = stints > 0 || days > 0 || hp.is_post_tj || history.length > 0;
    if (!hasAnySignal) return "";
    // Pick a color for the headline number — green if clean, amber for
    // mild concern, red for chronic / TJ recovery.
    const headlineColor = hp.is_post_tj || stints >= 3 || days >= 200
      ? "var(--down)"
      : (stints >= 1 || days >= 30)
        ? "var(--neon-amber)"
        : "var(--up)";
    const tjLine = hp.is_post_tj
      ? `<div style="font-size:12px;color:var(--neon-violet);font-weight:600;margin-top:6px;">Post-TJ recovery${hp.tj_surgery_date ? ` · surgery ${escapeHtml(hp.tj_surgery_date)}` : ""}</div>`
      : "";
    // Collapsible full injury history sits inside the same card so all
    // health information stays together. Active stints flag in amber on
    // the summary so the user spots an open IL without expanding.
    const injuryDetails = history.length
      ? (() => {
          const active = history.some(s => s.active);
          const stintLabel = `${history.length} stint${history.length === 1 ? "" : "s"} on record`;
          const activeTag = active
            ? ` <span style="color:var(--neon-amber);font-weight:600;">· currently on IL</span>`
            : "";
          return `<details style="margin-top:10px;border-top:1px solid var(--border-light);padding-top:8px;">
            <summary style="cursor:pointer;font-size:11px;color:var(--text-secondary);letter-spacing:0.04em;text-transform:uppercase;">Injury history · ${stintLabel}${activeTag}</summary>
            <div style="margin-top:8px;">${makeInjuryHistoryBlock(history)}</div>
          </details>`;
        })()
      : "";
    return `<div class="detail-title">Health profile <span class="detail-title-sub">trailing 24 months</span></div>
      <div style="border:1px solid var(--border-light);background:var(--bg-secondary);padding:10px 12px;border-radius:var(--radius-sm);">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div>
            <div class="stat-label">IL stints</div>
            <div class="stat-value" style="color:${headlineColor};font-family:var(--font-mono);font-variant-numeric:tabular-nums;">${stints}</div>
          </div>
          <div>
            <div class="stat-label">Days on IL</div>
            <div class="stat-value" style="color:${headlineColor};font-family:var(--font-mono);font-variant-numeric:tabular-nums;">${days}d</div>
          </div>
        </div>
        ${tjLine}
        ${injuryDetails}
      </div>`;
  })();

  // Per-source FV card — pulls the latest snapshot point and lays out
  // each contributing source's grade so the reader can see whether
  // consensus is unanimous or split. Compact one-row-per-source list
  // with each FV in its tier color, dimmed when the source hasn't
  // updated recently.
  // Tabbed per-source consensus card — combines FV-per-source and
  // tool-grade-per-source into a single accordion-internal card with a
  // FV / Tools tab strip. Per-source is power-user info; the accordion
  // placement keeps it from competing with health/tools/savant cards
  // above the fold. State is ephemeral — re-render starts on FV tab.
  const perSourceTabbedSection = (() => {
    const latestPt = p.points && p.points.length
      ? p.points[p.points.length - 1] : null;
    if (!latestPt || !latestPt.per_source) return "";
    const entries = Object.entries(latestPt.per_source);
    if (!entries.length) return "";
    // FV panel ----------------------------------------------------------
    const sortedFvEntries = entries.slice().sort(([, av], [, bv]) => {
      const ax = av.fv_published ?? -1;
      const bx = bv.fv_published ?? -1;
      return bx - ax;
    });
    const sourceRows = sortedFvEntries.map(([src, info]) => {
      const fvNum = info.fv_published;
      const rank = info.rank;
      const lbl = SOURCE_LABELS[src] || src;
      const fvCell = fvNum != null
        ? `<span class="fv-badge ${fvClass(String(Math.round(fvNum)))} size-sm">${Math.round(fvNum)}</span>`
        : `<span style="color:var(--text-tertiary);font-size:11px;">rank only</span>`;
      const rankCell = rank != null
        ? `<span style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-tertiary);font-size:10px;">#${rank}</span>`
        : "";
      return `<tr>
        <td style="color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:3px 6px 3px 0;border-bottom:1px solid var(--border-light);">${escapeHtml(lbl)}</td>
        <td style="padding:3px 6px;border-bottom:1px solid var(--border-light);text-align:right;">${rankCell}</td>
        <td style="padding:3px 0 3px 6px;border-bottom:1px solid var(--border-light);text-align:right;">${fvCell}</td>
      </tr>`;
    }).join("");
    const explicitFvSources = entries.filter(([, v]) => v.fv_published != null).length;
    let disagreementLine = "";
    if (latestPt.fv_spread != null && latestPt.fv_min != null && latestPt.fv_max != null) {
      const wide = latestPt.fv_spread >= 10
        ? ` <span style="display:inline-block;margin-left:6px;padding:1px 6px;border:1px solid var(--neon-amber);border-radius:10px;color:var(--neon-amber);font-size:9px;letter-spacing:0.06em;text-transform:uppercase;">wide spread</span>`
        : "";
      const sigma = latestPt.fv_stddev != null
        ? ` · σ ${latestPt.fv_stddev.toFixed(1)}`
        : "";
      disagreementLine = `<div style="font-size:11px;color:var(--text-secondary);font-family:var(--font-mono);font-variant-numeric:tabular-nums;margin-bottom:6px;">
        Range ${Math.round(latestPt.fv_min)}–${Math.round(latestPt.fv_max)}${sigma}${wide}
      </div>`;
    } else if (_fvTotalInstances(p) === 1) {
      // Single-INSTANCE player (1 published grade across the entire
      // history). The FV consensus has been pulled 1/3 toward FV 35 by
      // the Bayesian shrinkage in consensus.py. Once a second grade
      // update lands — even from the same source — the pull lifts.
      const rawTxt = latestPt.consensus_fv_pre_shrinkage != null
        ? ` (raw ${latestPt.consensus_fv_pre_shrinkage.toFixed(1)})`
        : "";
      disagreementLine = `<div style="font-size:11px;color:var(--text-tertiary);margin-bottom:6px;">
        <span style="display:inline-block;padding:1px 6px;border:1px dashed var(--neon-amber);border-radius:10px;color:var(--neon-amber);font-size:9px;letter-spacing:0.06em;text-transform:uppercase;">1 instance · pulled down</span>
        <span style="margin-left:6px;">consensus pulled 1/3 toward FV 35${rawTxt} · the dashed amber outline on the FV badge marks this state; the pull lifts as soon as a second grade update lands, even from the same source</span>
      </div>`;
    }
    const fvPanelHTML = `
      ${disagreementLine}
      <table style="width:100%;border-collapse:collapse;font-size:11.5px;">
        <thead><tr style="font-size:9px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.06em;">
          <th style="text-align:left;padding-bottom:4px;">Source</th>
          <th style="text-align:right;padding-bottom:4px;">Rank</th>
          <th style="text-align:right;padding-bottom:4px;">FV</th>
        </tr></thead>
        <tbody>${sourceRows}</tbody>
      </table>`;

    // Tools panel -------------------------------------------------------
    const toolEntries = entries.filter(([, v]) => v && v.tools && Object.keys(v.tools).length);
    let toolsPanelHTML = "";
    if (toolEntries.length) {
      const isPitcherTab = !!((p.statline || {}).is_pitcher
                          || (p.sabermetrics || {}).is_pitcher
                          || ["RHP","LHP","SP","RP","MIRP","SIRP","P"].includes((p.position||"").split("/")[0]));
      const keys = isPitcherTab
        ? [["fb","FB"],["sl","SL"],["cb","CB"],["ch","CH"],["cmd","CMD"]]
        : [["hit","HIT"],["game_pwr","GPWR"],["raw_pwr","RPWR"],["speed","SPD"],["field","FLD"],["throw","ARM"]];
      const headerCells = keys.map(([, lbl]) =>
        `<th style="text-align:right;padding-bottom:4px;">${lbl}</th>`).join("");
      const cellTool = (v) => v == null
        ? `<td style="padding:3px 0 3px 6px;border-bottom:1px solid var(--border-light);text-align:right;color:var(--text-tertiary);font-size:10px;">—</td>`
        : `<td style="padding:3px 0 3px 6px;border-bottom:1px solid var(--border-light);text-align:right;"><span class="fv-badge ${fvClass(String(Math.round(v)))} size-xs">${Math.round(v)}</span></td>`;
      const toolRows = toolEntries.map(([src, info]) => {
        const lbl = SOURCE_LABELS[src] || src;
        const cells = keys.map(([k]) => cellTool((info.tools || {})[k])).join("");
        return `<tr>
          <td style="color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:3px 6px 3px 0;border-bottom:1px solid var(--border-light);">${escapeHtml(lbl)}</td>
          ${cells}
        </tr>`;
      }).join("");
      const spread = latestPt.tools_spread || {};
      const widest = Object.entries(spread).reduce(
        (acc, [k, v]) => (v != null && v > (acc[1] ?? -1)) ? [k, v] : acc, [null, null]);
      const wideTag = (widest[1] != null && widest[1] >= 10)
        ? `<div style="font-size:11px;color:var(--neon-amber);margin-bottom:6px;font-family:var(--font-mono);">
             <span style="display:inline-block;padding:1px 6px;border:1px solid var(--neon-amber);border-radius:10px;font-size:9px;letter-spacing:0.06em;text-transform:uppercase;margin-right:6px;">wide tool spread</span>
             ${escapeHtml(widest[0])} ranges ${widest[1]} pts across sources
           </div>`
        : "";
      toolsPanelHTML = `
        ${wideTag}
        <table style="width:100%;border-collapse:collapse;font-size:11px;">
          <thead><tr style="font-size:9px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.06em;">
            <th style="text-align:left;padding-bottom:4px;">Source</th>
            ${headerCells}
          </tr></thead>
          <tbody>${toolRows}</tbody>
        </table>`;
    }
    const toolsTabAvailable = !!toolsPanelHTML;
    const tabStrip = `<div class="per-source-tabs">
        <button type="button" class="chip active" data-per-source-tab="fv">FV</button>
        ${toolsTabAvailable ? `<button type="button" class="chip" data-per-source-tab="tools">Tools</button>` : ""}
      </div>`;
    return `<div class="detail-title">Source consensus <span class="detail-title-sub">latest per source · FV + tool grades</span></div>
      <div class="per-source-card" style="border:1px solid var(--border-light);background:var(--bg-secondary);padding:8px 12px;border-radius:var(--radius-sm);">
        ${tabStrip}
        <div class="per-source-panel" data-per-source-panel="fv">${fvPanelHTML}</div>
        ${toolsTabAvailable ? `<div class="per-source-panel" data-per-source-panel="tools" style="display:none;">${toolsPanelHTML}</div>` : ""}
      </div>`;
  })();

  // MLB roster status block — debut date, 40-man membership, options
  // remaining, accumulated MLB seasons, and a service-phase bucket.
  // Driven by storage.derive_roster_status, which walks the per-player
  // transactions cache plus career_stats. Rendered for any player who
  // has at least one piece of MLB context (debut date, MLB games, or a
  // 40-man add) so prospects who have never sniffed the majors stay
  // unencumbered.
  const rosterStatusSection = (() => {
    const rs = p.roster_status || {};
    const hasMLB = rs.mlb_debut_date || (rs.mlb_seasons || []).length > 0
                    || rs.on_40_man || rs.options_used;
    if (!hasMLB) return "";
    const phaseLabel = {
      pre_arb:      "Pre-arbitration",
      arb_eligible: "Arbitration-eligible",
      post_arb:     "Post-arb / FA window",
      none:         "—",
    }[rs.service_phase] || "—";
    const phaseColor = {
      pre_arb:      "var(--neon-cyan)",
      arb_eligible: "var(--neon-amber)",
      post_arb:     "var(--neon-violet)",
    }[rs.service_phase] || "var(--text-tertiary)";
    const optionsTotal = 3;
    const used = Math.min(optionsTotal, rs.options_used || 0);
    const remaining = (rs.options_remaining != null)
      ? rs.options_remaining
      : Math.max(0, optionsTotal - used);
    // Visual: three pips, filled = used, hollow = remaining. Matches the
    // "options pill" pattern most baseball-front-office UIs use.
    const pip = filled => `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--neon-cyan);background:${filled ? "var(--neon-cyan)" : "transparent"};margin-right:3px;vertical-align:middle;"></span>`;
    const pips = Array.from({length: optionsTotal}, (_, i) => pip(i < used)).join("");
    const yearList = (rs.options_used_years || []).join(", ");
    const debutLine = rs.mlb_debut_date
      ? `<div style="font-size:12px;color:var(--text-secondary);">
            <span style="color:var(--text-tertiary);">MLB debut:</span>
            <span style="color:var(--text-primary);font-variant-numeric:tabular-nums;">${escapeHtml(rs.mlb_debut_date)}</span>
         </div>`
      : "";
    const rosterLine = rs.on_40_man
      ? `<div style="font-size:12px;color:var(--text-secondary);">
            <span style="color:var(--text-tertiary);">Roster:</span>
            <span style="color:var(--up);font-weight:600;">On 40-man</span>
         </div>`
      : (rs.mlb_debut_date
          ? `<div style="font-size:12px;color:var(--text-secondary);">
                <span style="color:var(--text-tertiary);">Roster:</span>
                <span style="color:var(--text-tertiary);">Off 40-man</span>
             </div>`
          : "");
    const seasonsLine = (rs.mlb_seasons || []).length
      ? `<div style="font-size:12px;color:var(--text-secondary);">
            <span style="color:var(--text-tertiary);">MLB seasons:</span>
            <span style="color:var(--text-primary);font-variant-numeric:tabular-nums;">${rs.mlb_seasons.length} (${rs.mlb_seasons[0]}–${rs.mlb_seasons[rs.mlb_seasons.length-1]})</span>
         </div>`
      : "";
    return `<div class="detail-title">MLB roster status</div>
      <div style="border:1px solid var(--border-light);background:var(--bg-secondary);padding:10px 12px;border-radius:var(--radius-sm);display:flex;flex-direction:column;gap:6px;">
        ${debutLine}
        ${rosterLine}
        ${seasonsLine}
        <div style="font-size:12px;color:var(--text-secondary);">
          <span style="color:var(--text-tertiary);">Service phase:</span>
          <span style="color:${phaseColor};font-weight:600;">${phaseLabel}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;padding-top:6px;border-top:1px dashed var(--border-light);">
          <span style="font-size:11px;color:var(--text-tertiary);letter-spacing:0.04em;text-transform:uppercase;font-weight:600;">MiLB options</span>
          <span style="display:inline-flex;align-items:center;">${pips}</span>
          <span style="font-size:12px;color:var(--text-primary);font-variant-numeric:tabular-nums;">${remaining} of ${optionsTotal} left${yearList ? ` <span style="color:var(--text-tertiary);">· used ${escapeHtml(yearList)}</span>` : ""}</span>
        </div>
        ${rs.rookie_exhausted
          ? `<div style="font-size:11px;color:var(--text-tertiary);font-style:italic;">Rookie eligibility exhausted (${rs.career_mlb_ab > 0 ? rs.career_mlb_ab + " AB" : rs.career_mlb_ip + " IP"} career).</div>`
          : ""}
      </div>`;
  })();

  // Current-org acquisition. Renders ONLY when the player's current org
  // acquired them via something OTHER than their original draft/IFA path
  // (i.e. they've been moved between orgs at least once). Pairs with the
  // original-acquisition block above to give a complete provenance: where
  // they entered pro ball AND how their current org got them.
  const ACQUISITION_LABELS = {
    draft:             "MLB Draft",
    international_fa:  "International FA",
    trade:             "Trade",
    waiver:            "Waiver claim",
    rule_5:            "Rule 5",
    free_agent:        "Free-agent signing",
    contract_purchase: "Contract purchase",
    unknown:           "Unknown",
  };
  const currentAcqSection = (() => {
    const ca = p.current_acquisition;
    if (!ca) return "";
    const m = ca.method;
    // Skip when the current acquisition is just the original draft/IFA —
    // already rendered by the acqSection above. Also skip "unknown".
    if (m === "draft" || m === "international_fa" || m === "unknown") return "";
    const ev = ca.event || {};
    const label = ACQUISITION_LABELS[m] || m;
    const from = ev.from_org ? escapeHtml(ev.from_org) : "?";
    const to   = ev.to_org   ? escapeHtml(ev.to_org)   : "?";
    let dateLine = "";
    if (ev.date) {
      const d = new Date(ev.date + "T00:00:00");
      const fmt = isNaN(d.getTime())
        ? ev.date
        : d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
      dateLine = `<div style="font-size:11px;color:var(--text-tertiary);margin-top:2px;">${escapeHtml(fmt)}</div>`;
    }
    const desc = ev.description
      ? `<div style="font-size:11px;color:var(--text-secondary);margin-top:6px;line-height:1.4;">${escapeHtml(ev.description)}</div>`
      : "";
    // Bounce-via line: when an intermediary org held the player briefly
    // (TOR → SFG → MIA collapses to TOR → MIA in the headline; SFG
    // surfaces here as a "via" annotation so the full path stays
    // reconstructable from the UI).
    const bounceVia = Array.isArray(ev.bounce_via) ? ev.bounce_via : [];
    const bounceLine = bounceVia.length
      ? `<div style="font-size:11px;color:var(--neon-violet);margin-top:4px;font-family:var(--font-mono);letter-spacing:0.02em;" title="Intermediate stops collapsed into the headline trade">${bounceVia.map(b => `via ${escapeHtml(b.org)} (${b.days} day${b.days === 1 ? "" : "s"})`).join(" · ")}</div>`
      : "";
    return `<div class="detail-title">Acquired by current org · ${escapeHtml(label)}</div>
      <div style="border:1px solid var(--border-light);background:var(--bg-secondary);padding:10px 12px;border-radius:2px;">
        <div style="font-size:14px;color:var(--text-primary);">From ${from} <span style="color:var(--neon-violet);">→</span> ${to}</div>
        ${bounceLine}
        ${dateLine}
        ${desc}
      </div>`;
  })();

  const etaRows = (() => {
    if (!eta || eta.year == null) return "";
    const r = [
      ["Level baseline", eta.base_years != null ? `${eta.base_years.toFixed(1)} yrs` : "—"],
      ["Performance",    eta.perf_adj > 0 ? `+${eta.perf_adj}` : eta.perf_adj < 0 ? `${eta.perf_adj}` : "±0"],
      ["Age vs. level",  eta.age_adj  > 0 ? `+${eta.age_adj}`  : eta.age_adj  < 0 ? `${eta.age_adj}`  : "±0"],
      ["FV grade",       eta.fv_adj   > 0 ? `+${eta.fv_adj}`   : eta.fv_adj   < 0 ? `${eta.fv_adj}`   : "±0"],
    ];
    return `<div class="detail-title">ETA breakdown · ${eta.year}</div>
      <table class="detail-table"><tbody>${r.map(([k, v]) => `<tr><td>${k}</td><td style="text-align:right;">${v}</td></tr>`).join("")}</tbody></table>`;
  })();

  // Scouting flags — green/red rate-stat indicators sit directly under
  // the headline tiles so they're the first read after the player's FV.
  // Empty (no statline / sample too small) for late-call-ups, recent
  // promotions with <15 IP / <15 G, and any 2026 IFA who hasn't played
  // a competitive game yet; the function renders a neutral message in
  // those cases so the section never disappears unexpectedly.
  // "On the same farm" — quick-jump card showing the three other
  // highest-FV tracked prospects in the same org. Pure context surface,
  // no new data fetched. Hidden when the player has no org (rare).
  const sameFarmSection = (() => {
    if (!p.org) return "";
    const teammates = (DATA.players || [])
      .filter(t => t.org === p.org && t.player_key !== p.player_key)
      .filter(t => t.fv_close != null)
      .sort((a, b) => (b.fv_close || 0) - (a.fv_close || 0))
      .slice(0, 4);
    if (!teammates.length) return "";
    const rows = teammates.map(t => `
      <div data-key="${escapeHtml(t.player_key)}" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--border-light);cursor:pointer;font-size:12px;">
        <span style="color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(t.player_name)} <span style="color:var(--text-tertiary);font-size:10px;">${escapeHtml(t.position || "—")}</span></span>
        <span class="fv-badge ${fvClass(String(Math.round(t.fv_close)))} size-sm">${Math.round(t.fv_close)}</span>
      </div>`).join("");
    return `<div class="detail-title">On the same farm <span class="detail-title-sub">other top ${escapeHtml(p.org)} prospects</span></div>
      <div style="border:1px solid var(--border-light);background:var(--bg-secondary);padding:8px 12px;border-radius:var(--radius-sm);">${rows}</div>`;
  })();

  // Similar prospects — cross-org match by position bucket + FV ±2 + age
  // ±1. Surfaces comps that share the player's role and grade so the
  // reader can scan how the same archetype is graded around the league.
  // Hidden when no matches; same compact-row idiom as sameFarmSection.
  const similarProspectsSection = (() => {
    const myBucket = positionBucket(p.position);
    const myFv = p.fv_close_raw != null ? p.fv_close_raw : p.fv_close;
    if (myBucket == null || myFv == null || p.age == null) return "";
    const myIsPitcher = /^(RHP|LHP|SP|RP|MIRP|SIRP)$/.test(String(p.position || "").split("/")[0].toUpperCase());

    // Composite-similarity scorer — sums weighted, normalized deltas
    // across FV, age, Tools+, key rate stats, and player-vs-level RPS+
    // (when present). Each axis has a reference unit so the deltas land
    // on comparable scales; the weighted sum is then a Euclidean
    // distance where SMALLER = more similar. Same position bucket is
    // a hard filter so a SS doesn't match a 1B regardless of stats.
    //
    // Weight emphasis: FV (1.5x) > position-stats (1.0x) > Tools+ (0.9x)
    // > age (0.7x). FV is the loudest scouting signal, stats reflect
    // current performance, Tools+ captures scouting-tool shape, age
    // contextualizes development.
    const W_FV = 1.5, W_AGE = 0.7, W_TOOLS = 0.9, W_STATS = 1.0;
    const norm = (delta, scale) => Math.abs(delta) / scale;
    const score = (a, b) => {
      const aFv = a.fv_close_raw != null ? a.fv_close_raw : a.fv_close;
      const bFv = b.fv_close_raw != null ? b.fv_close_raw : b.fv_close;
      let s = 0;
      let weights = 0;
      // FV — 10 grade points = 1 unit of distance.
      if (aFv != null && bFv != null) {
        s += W_FV * Math.pow(norm(aFv - bFv, 10), 2);
        weights += W_FV;
      }
      // Age — 2 years = 1 unit.
      if (a.age != null && b.age != null) {
        s += W_AGE * Math.pow(norm(a.age - b.age, 2), 2);
        weights += W_AGE;
      }
      // Tools+ — 15 plus points = 1 unit.
      const aT = a.tools && a.tools.composite_overall_plus;
      const bT = b.tools && b.tools.composite_overall_plus;
      if (aT != null && bT != null) {
        s += W_TOOLS * Math.pow(norm(aT - bT, 15), 2);
        weights += W_TOOLS;
      }
      // Stats — OPS for hitters, ERA for pitchers. Reference scales
      // (150 OPS pts / 1.5 ERA) match the granularity at which
      // scouting-grade differences typically show up.
      const aSL = a.statline || {};
      const bSL = b.statline || {};
      if (aSL.is_pitcher === bSL.is_pitcher && aSL.is_pitcher !== undefined) {
        if (aSL.is_pitcher) {
          const aEra = parseFloat(aSL.era);
          const bEra = parseFloat(bSL.era);
          if (isFinite(aEra) && isFinite(bEra)) {
            s += W_STATS * Math.pow(norm(aEra - bEra, 1.5), 2);
            weights += W_STATS;
          }
        } else {
          const aOps = parseFloat(aSL.ops);
          const bOps = parseFloat(bSL.ops);
          if (isFinite(aOps) && isFinite(bOps)) {
            s += W_STATS * Math.pow(norm(aOps - bOps, 0.150), 2);
            weights += W_STATS;
          }
        }
      }
      // Normalize to per-weight average so two prospects with only
      // FV+age comparable get ranked against ones with full feature
      // coverage on a comparable scale.
      return weights > 0 ? Math.sqrt(s / weights) : Infinity;
    };

    const candidates = (DATA.players || [])
      .filter(t => t.player_key !== p.player_key)
      .filter(t => positionBucket(t.position) === myBucket)
      .filter(t => (t.fv_close_raw != null || t.fv_close != null) && t.age != null);
    if (!candidates.length) return "";
    const ranked = candidates
      .map(t => ({ t, s: score(p, t) }))
      .filter(x => isFinite(x.s))
      .sort((a, b) => a.s - b.s)
      .slice(0, 4);
    if (!ranked.length) return "";

    const rows = ranked.map(({ t, s }) => {
      const tFv = t.fv_close_raw != null ? t.fv_close_raw : t.fv_close;
      const orgTag = t.org
        ? `<span style="color:var(--text-tertiary);font-size:9.5px;margin-left:4px;">${escapeHtml(t.org)}</span>`
        : "";
      // Surface the similarity score subtly so the user can see why
      // the match landed where it did. 0 = identical; lower = closer.
      // The match-quality label converts the raw distance into a
      // human-readable bucket.
      const matchLabel = s < 0.25 ? "very close"
                       : s < 0.45 ? "close"
                       : s < 0.70 ? "similar"
                       : "loose";
      const matchTip = `Composite similarity score: ${s.toFixed(2)} (smaller = closer). Match across FV, age, Tools+, and current-season rate stats.`;
      return `<div data-key="${escapeHtml(t.player_key)}" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--border-light);cursor:pointer;font-size:12px;" title="${escapeHtml(matchTip)}">
        <span style="color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;">${escapeHtml(t.player_name)} <span style="color:var(--text-tertiary);font-size:10px;">${escapeHtml(t.position || "—")} · ${t.age != null ? t.age.toFixed(1) + "y" : "—"} · ${matchLabel}</span>${orgTag}</span>
        <span class="fv-badge ${fvClass(String(Math.round(tFv)))} size-sm">${Math.round(tFv)}</span>
      </div>`;
    }).join("");
    return `<div class="detail-title">Similar prospects <span class="detail-title-sub">composite match — position, FV, age, Tools+, stats</span></div>
      <div style="border:1px solid var(--border-light);background:var(--bg-secondary);padding:8px 12px;border-radius:var(--radius-sm);">${rows}</div>`;
  })();

  // Scouting flags get distilled into the "Age & level-relative
  // performance" table cells (green/red deltas vs level mean). When the
  // server-side flag layer carries scout-narrative notes, we surface
  // them as a one-line caption below the title summary instead of a
  // duplicate full block.
  const flagSummary = (() => {
    // Stat flags + tool flags ride the same green/red summary line —
    // both arrays share the {direction, stat, ...} shape and the reader
    // doesn't care whether a callout came from a rate stat or a 60-grade
    // tool. Tool-derived flags get a small ° suffix so the source is
    // still visible without doubling the summary line height.
    const stat = (p.stat_flags || []);
    const tool = (p.tool_flags || []).map(f => ({ ...f, _origin: "tool" }));
    const flags = stat.concat(tool);
    if (!flags.length) return "";
    const green = flags.filter(f => f.direction === "green");
    const red   = flags.filter(f => f.direction === "red");
    const list = arr => arr.map(f =>
      escapeHtml(f.stat) + (f._origin === "tool" ? "°" : "")
    ).join(" · ") || "—";
    return `<div style="display:flex;gap:14px;align-items:baseline;font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);margin-bottom:10px;flex-wrap:wrap;">
      ${green.length ? `<span><span style="color:var(--up);font-weight:700;">▲ ${green.length}</span> ${list(green)}</span>` : ""}
      ${red.length   ? `<span><span style="color:var(--down);font-weight:700;">▼ ${red.length}</span> ${list(red)}</span>`   : ""}
      ${tool.length ? `<span style="color:var(--text-tertiary);font-size:10px;" title="Tool-grade flags are marked with °">° = scouting-tool flag</span>` : ""}
    </div>`;
  })();

  // Private notes — localStorage-backed, never leaves the browser. The
  // textarea slots into the right sidebar so the main column stays
  // dedicated to chart + career + sources. Hidden on graduates because
  // a note on a graduated prospect rarely matters going forward.
  const noteSection = p.status === "graduated" ? "" : (() => {
    const existing = noteLoad(p.player_key);
    return `<div class="detail-title">Notes <span class="detail-title-sub">private to this browser</span></div>
      <textarea class="player-note-area" data-note-key="${escapeHtml(p.player_key)}" placeholder="Scouting notes, follow-up reminders, links — saved as you type.">${escapeHtml(existing)}</textarea>`;
  })();

  // Jump-link chip strip — quick in-page nav under the header. Only
  // chips for sections that actually render are shown; the strip itself
  // is hidden when fewer than 3 chips would appear (avoids a vestigial
  // 1-chip noise bar on data-thin profiles).
  const jumpLinkPairs = [
    ["Chart",   "detail-chart",     !!chartSection],
    ["Stats",   "detail-stats",     !!consolidatedCareerSection],
    ["Tools",   "detail-tools",     !!toolsSection],
    ["Health",  "detail-health",    !!healthSection],
    ["Savant",  "detail-savant",    !!savantSection],
    ["Arsenal", "detail-arsenal",   !!arsenalSection],
    ["Swing zone", "detail-swing-zone", !!swingZoneSection],
    ["Projection", "detail-projection", !!projectionArcSection],
  ].filter(([, , show]) => show);
  const jumpLinkStrip = jumpLinkPairs.length >= 3
    ? `<nav class="detail-jumplinks" aria-label="Jump to section">${jumpLinkPairs.map(([label, id]) =>
        `<a href="#${id}">${escapeHtml(label)}</a>`).join("")}</nav>`
    : "";

  // Two-column layout: chart + career on the left, secondary blocks on the right.
  // The right column wraps in a sticky container so on tall pages the
  // context blocks (health / Savant / events / same-farm) follow the
  // user's scroll once they pass the chart + career section.
  const wrap = (id, html) => html ? `<div id="${id}">${html}</div>` : "";
  // Wider cards live in the main column below the chart + career table
  // so they get full horizontal width. Sidebar stays as a tight stack
  // of summary cards. The wide grid becomes 2-col at ≥1200px.
  const moreDetailsAccordion = (() => {
    const moreSectionList = [
      [perSourceTabbedSection, "per-source"],
      [acqSection,             "acquisition"],
      [currentAcqSection,      "current org"],
      [tradesSection,          "transactions"],
      [etaRows,                "ETA"],
      [rosterStatusSection,    "roster status"],
    ].filter(([html]) => html);
    if (!moreSectionList.length) return "";
    const moreSections = moreSectionList.map(([html]) => html).join("");
    const labels = moreSectionList.map(([, label]) => label).join(" · ");
    return `<details class="player-detail-more" open style="margin-top:0;">
      <summary style="cursor:pointer;font-family:var(--font-sans);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-secondary);padding:8px 12px;border:1px solid var(--border-light);border-radius:var(--radius-sm);background:var(--bg-secondary);">More details · ${escapeHtml(labels)}</summary>
      <div style="margin-top:10px;">${moreSections}</div>
    </details>`;
  })();
  // Wide-card grid below the career table. Tools / Savant / Arsenal /
  // Contract details + the More-details accordion live here so they
  // get more horizontal real estate than the narrow sidebar provides.
  const wideCards = [
    wrap("detail-tools",   toolsSection),
    wrap("detail-savant",  savantSection),
    wrap("detail-arsenal", arsenalSection),
    wrap("detail-swing-zone", swingZoneSection),
    wrap("detail-projection", projectionArcSection),
    contractDetailsSection,
  ].filter(Boolean).join("");
  const wideGrid = (wideCards || moreDetailsAccordion)
    ? `<div class="detail-wide-grid">
        ${wideCards}
        ${moreDetailsAccordion}
      </div>`
    : "";
  root.innerHTML = header + tilesHtml + flagSummary + jumpLinkStrip + `
    <div class="player-detail-grid">
      <div>${wrap("detail-chart", chartSection)}${wrap("detail-stats", consolidatedCareerSection)}${sourceSection}${wideGrid}</div>
      <div class="player-detail-side">${noteSection}${ilSection}${wrap("detail-health", healthSection)}${sabermetricsSection}${surplusValueSection}${sameFarmSection}${similarProspectsSection}</div>
    </div>`;
}

// ---------------------------------------------------------------------------
// FARM SYSTEM DETAIL PAGE
// ---------------------------------------------------------------------------

// Build the per-org position depth chart. Ten columns —
//   C / 1B / 2B / SS / 3B / LF / CF / RF / SP / RP
// — so the reader sees a sharper picture than the older 6-column
// (MI / OF / P) grouping. Generic positions (MI, IF, OF, P) collapse
// into the most likely subcolumn (2B, CF, SP). Within each column
// players are sorted by the active sort mode (FV / age / ETA) with
// dashed tier separators between the 50+, 40-tier, and sub-40 groups
// when sorted by FV. Cards inherit the org accent stripe and click
// into the player detail page.
function makePositionDepthChart(rosterPlayersAll, sortMode) {
  sortMode = sortMode || "fv";
  const ROWS = [
    ["C",  "C"],
    ["1B", "1B"],
    ["2B", "2B"],
    ["SS", "SS"],
    ["3B", "3B"],
    ["LF", "LF"],
    ["CF", "CF"],
    ["RF", "RF"],
    ["SP", "SP"],
    ["RP", "RP"],
  ];
  const buckets = Object.fromEntries(ROWS.map(([k]) => [k, []]));
  for (const p of rosterPlayersAll) {
    const head = String(p.position || "").split("/")[0].toUpperCase();
    let col = null;
    if (head === "C")           col = "C";
    else if (head === "1B" || head === "DH") col = "1B";
    else if (head === "2B" || head === "MI" || head === "IF") col = "2B";
    else if (head === "SS")     col = "SS";
    else if (head === "3B")     col = "3B";
    else if (head === "LF")     col = "LF";
    else if (head === "CF" || head === "OF") col = "CF";
    else if (head === "RF")     col = "RF";
    else if (head === "SP" || head === "RHP" || head === "LHP" || head === "P") col = "SP";
    else if (head === "RP" || head === "MIRP" || head === "SIRP") col = "RP";
    if (col) buckets[col].push(p);
  }
  const fvOf = p => p.points.length ? p.points[p.points.length - 1].consensus_fv_raw : 0;
  const etaOf = p => (p.eta && p.eta.year != null) ? p.eta.year : 9999;
  const ageOf = p => p.age ?? 99;
  const comparators = {
    fv:  (a, b) => fvOf(b) - fvOf(a) || ageOf(a) - ageOf(b),
    age: (a, b) => ageOf(a) - ageOf(b) || fvOf(b) - fvOf(a),
    eta: (a, b) => etaOf(a) - etaOf(b) || fvOf(b) - fvOf(a),
  };
  const cmp = comparators[sortMode] || comparators.fv;
  for (const k of Object.keys(buckets)) buckets[k].sort(cmp);
  const totalPlayers = Object.values(buckets).reduce((n, arr) => n + arr.length, 0);
  if (!totalPlayers) {
    return `<div style="color:var(--text-tertiary);font-size:12px;">No tracked prospects to chart.</div>`;
  }
  // Compact name format: "F. Lastname" when full first+last would exceed
  // 12 chars; otherwise full last name only.
  const shortName = (full) => {
    const parts = (full || "").split(" ").filter(Boolean);
    if (!parts.length) return "—";
    const last = parts[parts.length - 1];
    const first = parts.length > 1 ? parts[0] : "";
    return first && (first.length + last.length + 1) > 12
      ? `${first[0]}. ${last}`
      : last;
  };
  const yearTag = (year) => {
    if (year == null || year >= 9999) return "";
    const yy = String(year).slice(-2);
    const thisYear = new Date().getFullYear();
    const diff = year - thisYear;
    const cls = diff <= 0 ? "eta-now"
               : diff === 1 ? "eta-near"
               : diff === 2 ? "eta-close"
               : diff === 3 ? "eta-mid"
               : diff === 4 ? "eta-far"
               : "eta-very-far";
    return `<span class="pdc-eta ${cls}" title="ETA ${year}">'${yy}</span>`;
  };
  // Small per-card icons: age-vs-level dot + health glyph + acq pill.
  // Each gates on its data; clean prospects render no icon cluster at all.
  const iconsHTML = (p) => {
    const bits = [];
    const avl = p.age_vs_level || {};
    if (avl.tier && avl.tier !== "unknown") {
      let dot = "dot-neutral";
      if (avl.tier === "very-young" || avl.tier === "young") dot = "dot-young";
      else if (avl.tier === "old" || avl.tier === "too-old") dot = "dot-old";
      const tip = avl.diff != null
        ? `Age vs level: ${avl.diff > 0 ? "+" : ""}${avl.diff.toFixed(1)}y (${avl.tier.replace(/-/g, " ")})`
        : `Age vs level: ${avl.tier}`;
      bits.push(`<span class="pdc-age-dot ${dot}" title="${escapeHtml(tip)}"></span>`);
    }
    const il = p.il_status || {};
    const hp = p.health_profile || {};
    if (il.is_on_il) {
      bits.push(`<span class="pdc-health h-il" title="${escapeHtml(il.description || "On IL")}">!</span>`);
    } else if (hp.is_post_tj) {
      bits.push(`<span class="pdc-health h-tj" title="Post-Tommy John surgery">TJ</span>`);
    } else if ((hp.il_stints_24mo || 0) >= 3 || (hp.il_days_24mo || 0) >= 200) {
      bits.push(`<span class="pdc-health h-chronic" title="Chronic IL history">C</span>`);
    }
    const acqMethod = (p.current_acquisition || {}).method
                   || (p.acquisition || {}).method;
    if (acqMethod === "trade") {
      bits.push(`<span class="pdc-acq acq-trade" title="Acquired via trade">TR</span>`);
    } else if (acqMethod === "international_fa") {
      bits.push(`<span class="pdc-acq acq-ifa" title="International FA signing">IFA</span>`);
    } else if (acqMethod === "rule_5") {
      bits.push(`<span class="pdc-acq acq-rule5" title="Rule 5 pick">R5</span>`);
    } else if (acqMethod === "waiver") {
      bits.push(`<span class="pdc-acq acq-waiver" title="Waiver claim">W</span>`);
    }
    return bits.length ? `<span class="pdc-icons">${bits.join("")}</span>` : "";
  };
  // Default visible cards per row before the overflow cards get clipped.
  // Five is a sensible "starting depth" — covers a typical lineup spot
  // plus a couple of backups; click "show all" to reveal the rest.
  const TOP_N = 5;
  return `<div class="pos-depth-grid">${ROWS.map(([key, label]) => {
    const players = buckets[key];
    const cards = players.map((p, idx) => {
      const latest = p.points.length ? p.points[p.points.length - 1] : null;
      const fvLabel = latest ? latest.consensus_fv_label : "—";
      const sl = p.statline || {};
      const lvl = sl.level || "—";
      const actualPos = String(p.position || "").split("/")[0].toUpperCase();
      const posGlyph = actualPos && actualPos !== key
        ? `<span class="pdc-pos">${escapeHtml(actualPos)}</span>`
        : "";
      const ageTxt = p.age != null ? `${p.age.toFixed(1)}y` : "?";
      const etaYear = p.eta && p.eta.year != null ? p.eta.year : null;
      const titleEta = etaYear ? ` · ETA ${etaYear}` : "";
      const overflow = idx >= TOP_N ? " is-overflow" : "";
      return `<div class="pos-depth-card${overflow}" data-key="${escapeHtml(p.player_key)}" style="${orgStripe(p.org)}" title="${escapeHtml(p.player_name)} · ${escapeHtml(p.position || "—")} · ${escapeHtml(lvl)} · age ${ageTxt} · FV ${fvLabel}${titleEta}">
        <span class="pdc-fv"><span class="fv-badge ${fvClass(fvLabel)} size-xs">${fvLabel}</span></span>
        <span class="pdc-name">${escapeHtml(shortName(p.player_name))}</span>
        <span class="pdc-sub">${posGlyph}${escapeHtml(lvl)}${yearTag(etaYear)}</span>
        ${iconsHTML(p)}
      </div>`;
    }).join("");
    const count = players.length;
    const overflowCount = Math.max(0, count - TOP_N);
    const expandBtn = overflowCount > 0
      ? `<button class="pos-depth-row-expand" data-pos-row-expand="${escapeHtml(key)}" type="button">show all ${count}</button>`
      : `<span style="font-family:var(--font-mono);font-size:9.5px;color:var(--text-tertiary);">${count}</span>`;
    const rowCls = count === 0 ? "pos-depth-row is-empty" : "pos-depth-row";
    return `<span class="pos-depth-row-label">${label}<span class="pos-count">(${count})</span></span>
      <div class="pos-depth-row-prospects ${rowCls}" data-pos-row="${escapeHtml(key)}">
        ${cards || "no tracked prospects"}
      </div>
      ${expandBtn}`;
  }).join("")}</div>`;
}

function renderFarmDetail(orgCode) {
  const org = findOrg(orgCode);
  const root = document.getElementById("farm-detail-body");
  if (!org) {
    root.innerHTML = `<div class="state-message">Unknown organization: ${escapeHtml(orgCode)}. <a href="#" onclick="goHome();return false;">Back to list</a>.</div>`;
    return;
  }

  // Resolve full player objects so we can render each roster line with its
  // FV trajectory chart inline. The acquisition, level, and position
  // filters all share state with the main prospect list so toggling
  // chips on the list page carries through when the user clicks into
  // a farm — same prospects, same lens.
  const rosterPlayersAll = (DATA.players || []).filter(p => p.org === orgCode);
  let rosterPlayers = rosterPlayersAll.slice();
  if (state.acqFilter !== "all") {
    rosterPlayers = rosterPlayers.filter(p =>
      ((p.current_acquisition || {}).method || "unknown") === state.acqFilter);
  }
  if (state.levelFilter !== "all") {
    rosterPlayers = rosterPlayers.filter(p =>
      (p.statline || {}).level === state.levelFilter);
  }
  if (state.posFilter !== "all") {
    rosterPlayers = rosterPlayers.filter(p =>
      positionMatches(positionBucket(p.position), state.posFilter));
  }
  // Pluggable sort map — driven by state.rosterSort, defaulting to FV.
  // Each comparator handles null/undefined values by sinking them to
  // the bottom (sort key isn't applicable means "doesn't qualify").
  const ROSTER_SORTERS = {
    fv: (a, b) => {
      const fa = a.points.length ? a.points[a.points.length - 1].consensus_fv_raw : -1;
      const fb = b.points.length ? b.points[b.points.length - 1].consensus_fv_raw : -1;
      return fb - fa;
    },
    avg_rank: (a, b) => {
      const ar = (a.points.slice(-1)[0] || {}).avg_rank;
      const br = (b.points.slice(-1)[0] || {}).avg_rank;
      return (ar == null ? 9999 : ar) - (br == null ? 9999 : br);
    },
    age: (a, b) => (a.age == null ? 99 : a.age) - (b.age == null ? 99 : b.age),
    eta: (a, b) => {
      const ay = a.eta && a.eta.year != null ? a.eta.year : 9999;
      const by = b.eta && b.eta.year != null ? b.eta.year : 9999;
      return ay - by;
    },
    tools_plus: (a, b) => {
      const av = a.tools && a.tools.composite_overall_plus;
      const bv = b.tools && b.tools.composite_overall_plus;
      return (bv == null ? -1 : bv) - (av == null ? -1 : av);
    },
    surplus: (a, b) => {
      const sv = (p) => {
        if (p.fv_close == null) return -1;
        const isP = !!(p.position && /^(RHP|LHP|SP|RP|MIRP|SIRP)/.test(p.position));
        return estimateSurplusValueMM(p.fv_close, isP) || 0;
      };
      return sv(b) - sv(a);
    },
  };
  rosterPlayers.sort(ROSTER_SORTERS[state.rosterSort] || ROSTER_SORTERS.fv);

  const graduates = (DATA.graduates || []).filter(g => g.org === orgCode);

  // Build a unified list of every event involving this org — trades,
  // waiver claims, releases, DFAs, contract purchases, Rule 5 moves,
  // FA signings. Each event carries:
  //   { player, kind, date, from_org, to_org, description, graduate }
  // and we render the same list two ways below:
  //   (a) the sidebar shows the most recent few of each kind in
  //       compact per-kind cards;
  //   (b) the main column gets a full chronological "Farm-system
  //       transactions" section with kind-filter chips.
  //
  // Pulls from BOTH active prospects (rosterPlayersAll — pre-filter,
  // since we want all events for the org regardless of the user's
  // current acquisition/level/pos filter) and graduates / inactives.
  const allEventsForOrg = [];
  const seenEvent = new Set();
  // Don't restrict to the user-filtered roster — every prospect tied
  // to this org has events worth surfacing on the farm page, even when
  // a level / position filter is excluding them from the table above.
  const sources = [
    ...rosterPlayersAll.map(p => ({ p, graduate: false })),
    ...graduates.map(p => ({ p, graduate: true })),
    ...((DATA.inactive || []).filter(p => p.org === orgCode).map(p => ({ p, graduate: false }))),
  ];
  for (const { p, graduate } of sources) {
    for (const t of (p.trades || [])) {
      if (t.from_org !== orgCode && t.to_org !== orgCode) continue;
      const k = `${p.player_key}|trade|${t.trade_date}|${t.from_org}|${t.to_org}`;
      if (seenEvent.has(k)) continue;
      seenEvent.add(k);
      allEventsForOrg.push({
        player: p, graduate,
        kind: "trade",
        date: t.trade_date,
        from_org: t.from_org, to_org: t.to_org,
        description: t.description || "",
      });
    }
    for (const tx of (p.transactions || [])) {
      if (tx.from_org !== orgCode && tx.to_org !== orgCode) continue;
      const k = `${p.player_key}|${tx.kind}|${tx.date}|${tx.from_org}|${tx.to_org}`;
      if (seenEvent.has(k)) continue;
      seenEvent.add(k);
      allEventsForOrg.push({
        player: p, graduate,
        kind: tx.kind,
        date: tx.date,
        from_org: tx.from_org, to_org: tx.to_org,
        description: tx.description || "",
      });
    }
  }
  allEventsForOrg.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  // For backward compat with the sidebar trade-only render path below.
  const allTradesForOrg = allEventsForOrg.filter(e => e.kind === "trade")
    .map(e => ({ player: e.player, trade: { trade_date: e.date, from_org: e.from_org, to_org: e.to_org, description: e.description }, graduate: e.graduate }));

  // Group events by kind for the sidebar's "Recent transactions" cards
  // (top 5 per kind). Kinds are presented in roster-event order so a
  // reader scanning the sidebar can pick up the "what's changed lately"
  // story without having to parse a flat list.
  const eventsByKind = {};
  for (const ev of allEventsForOrg) {
    (eventsByKind[ev.kind] = eventsByKind[ev.kind] || []).push(ev);
  }

  const header = `
    <a href="#" onclick="event.preventDefault();goHome();" class="back-link">← Back to list</a>
    <div class="detail-page-header" style="${orgStripe(org.org)}">
      <div style="display:flex;align-items:center;gap:16px;">
        ${teamLogoHTML(org.org, "xl", fullOrgName(org.org))}
        <div>
          <div class="player-display-name">${escapeHtml(fullOrgName(org.org))}</div>
          <div class="player-display-meta">
            <span style="font-family:var(--font-mono);color:var(--text-tertiary);letter-spacing:0.08em;margin-right:8px;font-weight:600;">${escapeHtml(org.org)}</span>
            Farm rank <strong style="font-family:var(--font-mono);color:var(--text-primary);" title="45% top-end talent · 25% depth · 15% trajectory · 15% graduation pipeline (each rescaled 0-100 across the 30 orgs)">#${org.farm_rank}</strong> of 30 · ${org.count} prospects tracked · Total FV <strong style="font-family:var(--font-mono);color:var(--text-primary);">${org.total_fv != null ? org.total_fv.toFixed(1) : "—"}</strong>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">${makeTierBar(org.prospects)}</div>
    </div>
    ${makeFarmReportCard(org)}`;

  // Per-tier counts live in the tier-bar in the header; tiles cover the
  // remaining at-a-glance facts (age, stock direction, young-for-level)
  // that aren't visible elsewhere on this page. Position mix moved to
  // the sidebar where it sits next to the FV/acquisition/ETA charts.
  const stockHtml = (org.stock_up || org.stock_down)
    ? `${org.stock_up  ? `<span class="stock-up">▲${org.stock_up}</span>` : ''}${org.stock_up && org.stock_down ? ' · ' : ''}${org.stock_down ? `<span class="stock-down">▼${org.stock_down}</span>` : ''}`
    : `<span style="color:var(--text-tertiary);">—</span>`;
  // Aggregate surplus value — sum of FV-implied surplus across the
  // org's ACTIVE roster (graduates excluded by construction since
  // rosterPlayersAll only pulls from DATA.players, which contains
  // active prospects). Mirrors the per-prospect calculation in the
  // surplus-value sidebar card on the detail page. Each prospect's
  // estimate uses the FV → $M lookup with hitter/pitcher split.
  const farmSurplusBreakdown = (() => {
    let total = 0;
    let n = 0;
    let topContributor = null;
    let topShare = 0;
    for (const p of rosterPlayersAll) {
      const fv = p.fv_close;
      if (fv == null) continue;
      const isP = !!(p.position && /^(RHP|LHP|SP|RP|MIRP|SIRP)/.test(p.position));
      const s = estimateSurplusValueMM(fv, isP);
      if (s == null) continue;
      total += s;
      n++;
      if (s > topShare) { topShare = s; topContributor = p; }
    }
    return { total, n, topContributor, topShare };
  })();
  const fmtSurplusUsd = m => {
    if (m == null) return "—";
    if (m >= 1000) return `$${(m / 1000).toFixed(1)}B`;
    if (m >= 100)  return `$${m.toFixed(0)}M`;
    if (m >= 10)   return `$${m.toFixed(0)}M`;
    return `$${m.toFixed(1)}M`;
  };
  const surplusTip = `Sum of FV-implied surplus value across this org's ${farmSurplusBreakdown.n} active prospects (graduates excluded). Each prospect's value derives from the FanGraphs / Craig Edwards 2019 framework (hitter/pitcher split). Real surplus depends on health, performance variance, and changes in $/WAR market rate.${farmSurplusBreakdown.topContributor ? ` Top contributor: ${farmSurplusBreakdown.topContributor.player_name} (${fmtSurplusUsd(farmSurplusBreakdown.topShare)}).` : ""}`;
  const surplusValue = farmSurplusBreakdown.total > 0
    ? fmtSurplusUsd(farmSurplusBreakdown.total)
    : "—";
  const surplusColor = farmSurplusBreakdown.total >= 500 ? "var(--up)"
                     : farmSurplusBreakdown.total >= 200 ? "var(--neon-cyan)"
                     : "var(--text-primary)";

  // DvM+ tile — prioritized 3-up stat showing 1y / 3y / 5y development
  // vs the league mean as a wRC+/OPS+-style index (100 = league mean,
  // 10 pts = 1 std-dev). Pure-development metric: graduations + acquisitions
  // are nullified, so only FV gained while the player was in the org counts.
  const dvmTip = "100 = league mean · 10 pts = 1 std-dev · graduations + acquisitions nullified";
  const dvmCell = (winKey, label) => {
    const v = (org.dvm_plus || {})[winKey];
    if (v == null) return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><div style="font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--text-tertiary);">—</div><div style="font-family:var(--font-sans);font-size:10px;color:var(--text-tertiary);letter-spacing:0.08em;text-transform:uppercase;">${label}</div></div>`;
    const color = v >= 110 ? "var(--up)" : v <= 90 ? "var(--down)" : "var(--neon-violet)";
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
      <div style="font-family:var(--font-mono);font-size:22px;font-weight:700;color:${color};font-variant-numeric:tabular-nums;line-height:1;">${v}</div>
      <div style="font-family:var(--font-sans);font-size:10px;color:var(--text-secondary);letter-spacing:0.08em;text-transform:uppercase;">${label}</div>
    </div>`;
  };
  const dvmTileHtml = `<div class="stat-tile" style="border-color:var(--neon-violet)44;background:linear-gradient(135deg,rgba(167,100,252,0.06),transparent);" title="${escapeHtml(dvmTip)}">
    <div class="stat-label" style="margin-bottom:6px;">Development vs mean</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-items:end;">
      ${dvmCell("1y", "1YDvM+")}
      ${dvmCell("3y", "3YDvM+")}
      ${dvmCell("5y", "5YDvM+")}
    </div>
  </div>`;

  // Health rollup — count currently-on-IL + post-TJ across the org's
  // active prospects. Graduates excluded by construction (rosterPlayersAll
  // only contains DATA.players). Three buckets: 0 = clean, 1-3 = amber
  // watch, 4+ = red concern. Tooltip enumerates the IL + TJ counts.
  let healthOnIL = 0;
  let healthPostTJ = 0;
  for (const p of rosterPlayersAll) {
    if (p.il_status && p.il_status.is_on_il) healthOnIL++;
    if (p.health_profile && p.health_profile.is_post_tj) healthPostTJ++;
  }
  const healthTotal = healthOnIL + healthPostTJ;
  const healthColor = healthTotal === 0 ? "var(--up)"
                    : healthTotal <= 3 ? "var(--neon-amber)"
                    : "var(--down)";
  const healthValue = healthOnIL || healthPostTJ
    ? `${healthOnIL} IL · ${healthPostTJ} TJ`
    : "Clean";
  const healthTip = `${healthOnIL} prospect${healthOnIL === 1 ? "" : "s"} currently on IL · ${healthPostTJ} post-Tommy John (active roster only; graduates excluded).`;

  // DvM+ tile takes 2x width — it's the primary headline statistic for
  // the farm detail page (per the design call: "DvM+ tile + report card
  // are the headline"). The secondary tiles share the remaining width:
  // aggregate Surplus Value + Avg age + Stock + Young-for-level + Health.
  const tilesHtml = `<div style="display:grid;grid-template-columns:2fr 1.1fr 0.9fr 0.95fr 0.85fr 0.85fr;gap:10px;margin-bottom:18px;">
    ${dvmTileHtml}
    <div class="stat-tile" title="${escapeHtml(surplusTip)}" style="cursor:help;">
      <div class="stat-label">Surplus value</div>
      <div class="stat-value" style="color:${surplusColor};font-variant-numeric:tabular-nums;">${surplusValue}</div>
      <div class="stat-sub">${farmSurplusBreakdown.n} active prospects · graduates excluded</div>
    </div>
    <div class="stat-tile">
      <div class="stat-label">Avg age</div>
      <div class="stat-value">${org.avg_age != null ? org.avg_age.toFixed(1) : "—"}</div>
    </div>
    <div class="stat-tile">
      <div class="stat-label">Stock (last update)</div>
      <div class="stat-value" style="font-size:18px;">${stockHtml}</div>
    </div>
    <div class="stat-tile">
      <div class="stat-label">Young-for-level</div>
      <div class="stat-value">${org.very_young_count}</div>
    </div>
    <div class="stat-tile" title="${escapeHtml(healthTip)}" style="cursor:help;">
      <div class="stat-label">Health</div>
      <div class="stat-value" style="font-size:14px;color:${healthColor};font-variant-numeric:tabular-nums;">${healthValue}</div>
    </div>
  </div>`;

  // Compact stat line for a roster row: slash + counting for hitters,
  // ERA + peripherals for pitchers. One line, monospace, dimmed; the
  // full season detail still lives on the prospect page.
  const rosterStatLine = (p) => {
    const sl = p.statline;
    if (!sl) return `<span style="color:var(--text-tertiary);">no stats yet</span>`;
    const isP = sl.is_pitcher;
    const levelPill = `<span class="level-pill level-neutral" style="margin-right:4px;">${escapeHtml(sl.level || "?")}</span>`;
    const slash = isP
      ? `${sl.era ?? "—"} ERA · ${sl.whip != null ? sl.whip + " WHIP · " : ""}${sl.k_per_9 != null ? sl.k_per_9.toFixed(1) + " K/9 · " : ""}${sl.bb_per_9 != null ? sl.bb_per_9.toFixed(1) + " BB/9 · " : ""}${sl.ip ?? "—"} IP`
      : `${sl.avg ?? "—"}/${sl.obp ?? "—"}/${sl.slg ?? "—"} · ${sl.hr ?? 0} HR${sl.sb ? ' · ' + sl.sb + ' SB' : ''}${sl.bb_pct != null ? ' · ' + sl.bb_pct.toFixed(0) + '% BB' : ''}${sl.k_pct != null ? ' · ' + sl.k_pct.toFixed(0) + '% K' : ''}`;
    const prior = sl.is_prior_season && sl.season
      ? `<span class="prior-season-tag" title="No ${new Date().getFullYear()} stats yet — showing ${sl.season}">${sl.season}</span>`
      : "";
    return `${levelPill}${prior}<span style="color:var(--text-primary);font-family:var(--font-mono);font-size:11px;">${slash}</span>`;
  };

  // Full roster with mini FV charts + an inline current-season stat
  // line under each player's name. Column proportions widened slightly
  // on the Player cell since the stat row needs the horizontal room.
  const rosterRows = rosterPlayers.map((p, i) => {
    const latest = p.points[p.points.length - 1];
    const chart = p.points.length >= 2
      ? makeLineChart(p.points, p.fv_open, p.fv_close, p.graduation_date, p.trades, p)
      : `<span style="color:var(--text-tertiary);font-size:11px;">—</span>`;
    return `
      <div class="player-row is-farm-roster" style="${orgStripe(p.org)}" onclick="goToPlayer('${escapeHtml(p.player_key)}');">
        <div class="rank-num">${i + 1}</div>
        <div style="display:flex;align-items:center;gap:10px;min-width:0;">
          ${headshotHTML(p, 56)}
          <div style="min-width:0;flex:1;">
            <div class="player-name">${escapeHtml(p.player_name)}</div>
            <div class="player-meta">${escapeHtml(p.position ?? "—")}${p.age != null ? `<span class="age-tag">age ${p.age.toFixed(1)}</span>` : ""}${ilTagHTML(p)}${rosterTagHTML(p)}</div>
            <div class="player-stat-line" style="margin-top:3px;font-size:11px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">${rosterStatLine(p)}${rpsPlusPillHTML(p)}${scoutRatesHTML(p)}</div>
          </div>
        </div>
        <div style="text-align:center;"><span class="fv-badge ${fvClass(latest.consensus_fv_label)}">${latest.consensus_fv_label}</span></div>
        <div class="rank-cell">${latest.avg_rank != null ? latest.avg_rank.toFixed(1) : "—"}</div>
        <div style="text-align:center;font-size:11px;color:var(--text-secondary);font-variant-numeric:tabular-nums;" title="${p.eta && p.eta.confidence ? p.eta.confidence + ' confidence' : 'ETA estimate'}">${(p.eta && p.eta.year != null) ? p.eta.year : "—"}</div>
        <div class="line-chart-cell">${chart}</div>
        <div class="candle-cell">${makeCandle(p)}</div>
      </div>`;
  }).join("");

  const rosterHeader = `<div class="col-header is-farm-roster">
    <span style="text-align:center;">#</span>
    <span>Player · current stats</span>
    <span style="text-align:center;">FV</span>
    <span style="text-align:center;">Rank</span>
    <span style="text-align:center;" title="Estimated MLB arrival year">ETA</span>
    <span style="text-align:center;">FV history</span>
    <span style="text-align:center;">Candle</span>
  </div>`;

  // Stats leaderboards — top current-season hitters (by OPS, min 80 PA) and
  // pitchers (by ERA, min 10 IP) among the org's tracked prospects.
  const PITCHER_RE = /^(RHP|LHP|SP|RP|MIRP|SIRP)/;
  const topHitters = rosterPlayers
    .filter(rp => rp.statline && rp.statline.is_pitcher === false && rp.statline.ops)
    .map(rp => ({
      p: rp,
      sl: rp.statline,
      ops: parseFloat(rp.statline.ops) || 0,
    }))
    .filter(x => x.ops > 0 && (x.sl.games || 0) >= 10)
    .sort((a, b) => b.ops - a.ops)
    .slice(0, 5);
  const topPitchers = rosterPlayers
    .filter(rp => rp.statline && rp.statline.is_pitcher === true && rp.statline.era)
    .map(rp => ({
      p: rp,
      sl: rp.statline,
      era: parseFloat(rp.statline.era) || 99,
      ip: parseFloat(rp.statline.ip) || 0,
    }))
    .filter(x => x.ip >= 10 && x.era < 99)
    .sort((a, b) => a.era - b.era)
    .slice(0, 5);

  const leaderboardRows = (rows, statLabel, statFn) => rows.map(({ p, sl }) => `
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:3px 0;border-bottom:1px solid var(--border-light);font-size:12px;cursor:pointer;" onclick="goToPlayer('${escapeHtml(p.player_key)}');">
      <span style="color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(p.player_name)} <span style="color:var(--text-tertiary);font-size:10px;">${escapeHtml(sl.level || "?")}</span></span>
      <span style="color:var(--neon-cyan);font-variant-numeric:tabular-nums;white-space:nowrap;">${statFn(sl)}</span>
    </div>`).join("");

  const hittersBlock = topHitters.length
    ? leaderboardRows(topHitters, "OPS", sl => `${sl.ops} · ${sl.hr ?? 0} HR`)
    : `<span style="color:var(--text-tertiary);font-size:12px;">No qualifying hitters yet.</span>`;
  const pitchersBlock = topPitchers.length
    ? leaderboardRows(topPitchers, "ERA", sl => `${sl.era} · ${(sl.ip ?? 0).toFixed ? sl.ip.toFixed(1) : sl.ip} IP`)
    : `<span style="color:var(--text-tertiary);font-size:12px;">No qualifying pitchers yet.</span>`;

  // Compact side-card sections — each lives in its own card so the
  // sticky sidebar reads as a stack of focused widgets rather than one
  // long undifferentiated column. Order is by user attention priority:
  // top prospect first (most clicked), distribution charts next (always
  // visible while scrolling), leaderboards + grads + trades at the end.
  const tp = org.top_prospect;
  const yp = org.youngest;
  // Look up the full player objects (rosterPlayersAll, not the filtered
  // rosterPlayers) so the headshot resolves regardless of active
  // chip-filter state. Top prospect = highest-FV row in the org's
  // tracked set; youngest = the org_summary's pre-resolved pointer.
  const tpPlayer = rosterPlayersAll.find(rp => rp.player_name === (tp && tp.name)) || rosterPlayersAll[0];
  const ypPlayer = yp ? rosterPlayersAll.find(rp => rp.player_name === yp.name) : null;
  const topProspectCard = `<div class="farm-side-card">
    <div class="side-title">Top prospect</div>
    ${tp ? `<div style="display:flex;align-items:center;gap:10px;cursor:pointer;" onclick="goToPlayer('${escapeHtml((tpPlayer || {}).player_key || '')}');">
      ${headshotHTML(tpPlayer || {}, 64)}
      <div style="min-width:0;">
        <div style="font-size:14px;font-weight:600;color:var(--neon-cyan);">${escapeHtml(tp.name)} <span class="fv-badge ${fvClass(tp.fv_label)} size-sm">${tp.fv_label}</span></div>
        <div style="font-size:11px;color:var(--text-secondary);margin-top:2px;">${escapeHtml(tp.pos||'')} · age ${tp.age != null ? tp.age.toFixed(1) : "—"}</div>
      </div>
    </div>` : '—'}
  </div>`;
  const youngestCard = `<div class="farm-side-card">
    <div class="side-title">Youngest</div>
    ${yp ? `<div style="display:flex;align-items:center;gap:10px;${ypPlayer ? 'cursor:pointer;' : ''}" ${ypPlayer ? `onclick="goToPlayer('${escapeHtml(ypPlayer.player_key)}');"` : ''}>
      ${headshotHTML(ypPlayer || {}, 64)}
      <div style="min-width:0;">
        <div style="font-size:14px;font-weight:600;${ypPlayer ? 'color:var(--neon-cyan);' : ''}">${escapeHtml(yp.name)}</div>
        <div style="font-size:11px;color:var(--text-secondary);margin-top:2px;">${escapeHtml(yp.pos||'')} · age ${yp.age != null ? yp.age.toFixed(1) : "—"} · FV ${yp.fv_label}</div>
      </div>
    </div>` : '—'}
  </div>`;
  const fvDistCard = `<div class="farm-side-card">
    <div class="side-title">FV distribution <span class="side-count">${(org.prospects || []).length} graded</span></div>
    ${makeFvHistogram(org.prospects)}
  </div>`;
  const acqMixCard = `<div class="farm-side-card">
    <div class="side-title">Acquired via <span class="side-count">${rosterPlayersAll.length} tracked</span></div>
    ${makeAcqMixBar(rosterPlayersAll)}
  </div>`;
  const etaCard = `<div class="farm-side-card">
    <div class="side-title">ETA distribution</div>
    ${makeEtaTimeline(rosterPlayersAll)}
  </div>`;

  // Recent movers — prospects with |Δ FV| ≥ 5 over the trailing 30 days.
  // Δ is computed against the most recent prior consensus point that is
  // at least 30 days older than the latest point; if no such point
  // exists the player is skipped. Sorted by absolute movement desc so
  // the loudest swings surface first.
  const moversCard = (() => {
    const cutoffMs = 30 * 24 * 60 * 60 * 1000;
    const movers = [];
    for (const rp of rosterPlayersAll) {
      const pts = rp.points || [];
      if (pts.length < 2) continue;
      const latest = pts[pts.length - 1];
      const latestMs = new Date(latest.snapshot_date + "T00:00:00").getTime();
      if (isNaN(latestMs)) continue;
      // Walk backwards to find the most recent point that's already
      // ≥30 days behind the latest; that's our "30 days ago" reference.
      let prior = null;
      for (let i = pts.length - 2; i >= 0; i--) {
        const ms = new Date(pts[i].snapshot_date + "T00:00:00").getTime();
        if (!isNaN(ms) && latestMs - ms >= cutoffMs) { prior = pts[i]; break; }
      }
      if (!prior) continue;
      const delta = (latest.consensus_fv_raw ?? 0) - (prior.consensus_fv_raw ?? 0);
      if (Math.abs(delta) >= 5) movers.push({ rp, delta, latest });
    }
    movers.sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
    if (!movers.length) {
      return `<div class="farm-side-card">
        <div class="side-title">Recent movers <span class="side-count">trailing 30d</span></div>
        <span style="color:var(--text-tertiary);font-size:11.5px;">No prospects moved ≥5 FV points in the last 30 days.</span>
      </div>`;
    }
    const rows = movers.slice(0, 6).map(({ rp, delta, latest }) => {
      const arrow = delta > 0 ? "▲" : "▼";
      const color = delta > 0 ? "var(--up)" : "var(--down)";
      const fvL = latest.consensus_fv_label;
      return `<div style="display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--border-light);font-size:11.5px;cursor:pointer;" onclick="goToPlayer('${escapeHtml(rp.player_key)}');">
        <span class="fv-badge ${fvClass(fvL)} size-sm">${fvL}</span>
        <span style="color:var(--neon-cyan);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(rp.player_name)}</span>
        <span style="font-family:var(--font-mono);font-size:10px;color:${color};font-variant-numeric:tabular-nums;font-weight:700;">${arrow}${delta > 0 ? "+" : ""}${delta.toFixed(1)}</span>
      </div>`;
    }).join("");
    return `<div class="farm-side-card">
      <div class="side-title">Recent movers <span class="side-count">trailing 30d · ${movers.length}</span></div>
      ${rows}
    </div>`;
  })();

  // Promotion candidates — prospects at A+ or AA who are (a) FV ≥ 50
  // (already a real prospect, not a depth piece) and (b) at-or-below
