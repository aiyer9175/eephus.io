  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="FV trajectory">
    ${yTicks.join("")}
    ${yearSvg.join("")}
    ${eventSvg.join("")}
    <polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${circles}
  </svg>`;
}

// Compact inline legend that maps glyph+color → label for every kind in
// TRANSACTION_KINDS. Used under FV charts so a reader can decode any
// marker they see without having to hover for the tooltip.
function transactionLegend(kinds = TRANSACTION_LEGEND_ORDER) {
  return `<div style="font-size:10px;color:var(--text-tertiary);margin-top:4px;display:flex;gap:14px;flex-wrap:wrap;">
    ${kinds.map(k => {
      const c = TRANSACTION_KINDS[k];
      if (!c) return "";
      return `<span><span style="color:${c.color};font-weight:600;">${c.glyph}</span> ${c.label.toLowerCase()}</span>`;
    }).join("")}
  </div>`;
}

// Year-by-year stat table for the prospect page.
//
// Columns are grouped by category — counting / rate / sabermetric — with
// a colored category header row over them so the reader can navigate to
// the metric they want without scanning every column header. Group widths
// are tuned to keep AVG/OBP/SLG together (slash line stays adjacent) and
// to keep the "headline" sabermetric (wRC+ or xFIP) in the rightmost
// column where the eye lands last.
function makeCareerTable(career) {
  if (!career || !career.length) {
    return `<div style="color:var(--text-tertiary);font-size:12px;">No multi-season stats available.</div>`;
  }
  const isP = career[0].is_pitcher;

  // Sort descending by season so the most recent year is up top.
  const sorted = [...career].sort((a, b) => (b.season || 0) - (a.season || 0));

  // A "category strip" sits above the column headers. Each cell spans
  // its category and is tinted lightly so groups read at a glance.
  // Colors are chosen so each tool/skill family reads distinctly:
  // counting (muted blue), slash (forest green), power (burnt orange —
  // power = "the boom"), discipline (slate purple), pitcher peripherals
  // (the sabermetric trio gets the warm color since FIP/HR-9 are the
  // saber-friendly piece of pitching).
  const stripStyle = (color) => `padding:5px 8px;background:${color};color:#FBF8F0;text-align:center;font-family:var(--font-sans);font-size:9px;letter-spacing:0.10em;text-transform:uppercase;font-weight:600;border-right:1px solid var(--bg-primary);`;
  const META_COLOR  = "#3D4A5C";   // slate, season/level
  const COUNT_COLOR = "#5B6E7E";   // muted blue, counting stats
  const SLASH_COLOR = "#3F6F47";   // forest, slash line (AVG/OBP/SLG/OPS)
  const POWER_COLOR = "#8B5A1F";   // burnt orange, isolated power (ISO) — pure power signal, distinct from slash
  const DISC_COLOR  = "#5F4B8B";   // slate purple, plate discipline (BB% / K%)
  const PERIPH_COLOR = "#8B5A1F";  // burnt orange, pitcher peripherals (K/9, BB/9, HR/9)

  if (isP) {
    // Pitcher table groupings:
    //   Meta | Counting (G, IP, W-L) | Run prevention (ERA, WHIP) |
    //   Peripherals (K/9, BB/9, HR/9 — the FIP components).
    // HR/9 belongs with the other peripherals because it's a "things
    // the pitcher fully owns" stat, alongside strikeouts and walks
    // (FIP is built from K/9 + BB/9 + HR/9 for exactly that reason).
    const strip = `<tr>
      <th colspan="2" style="${stripStyle(META_COLOR)}">Meta</th>
      <th colspan="3" style="${stripStyle(COUNT_COLOR)}">Counting</th>
      <th colspan="2" style="${stripStyle(SLASH_COLOR)}">Run prevention</th>
      <th colspan="3" style="${stripStyle(PERIPH_COLOR)}">Peripherals</th>
    </tr>`;
    const head = `<tr>
      <th>Season</th><th>Level</th>
      <th title="Games appeared">G</th>
      <th title="Innings pitched">IP</th>
      <th title="Wins–Losses">W-L</th>
      <th title="Earned Run Average">ERA</th>
      <th title="Walks + Hits per Inning Pitched">WHIP</th>
      <th title="Strikeouts per 9 innings">K/9</th>
      <th title="Walks per 9 innings">BB/9</th>
      <th title="Home runs allowed per 9 innings — pitcher's contact-quality red-flag stat (one of the three FIP inputs)">HR/9</th>
    </tr>`;
    const rows = sorted.map(s => `<tr>
      <td>${s.season}</td>
      <td><span class="level-pill level-neutral">${s.level}</span></td>
      <td>${s.games ?? "—"}</td>
      <td>${s.ip ?? "—"}</td>
      <td>${s.wins != null ? `${s.wins}-${s.losses}` : "—"}</td>
      <td>${s.era ?? "—"}</td>
      <td>${s.whip ?? "—"}</td>
      <td>${s.k_per_9 != null ? s.k_per_9.toFixed(2) : "—"}</td>
      <td>${s.bb_per_9 != null ? s.bb_per_9.toFixed(2) : "—"}</td>
      <td>${s.hr_per_9 != null ? s.hr_per_9.toFixed(2) : "—"}</td>
    </tr>`).join("");
    return `<table class="detail-table"><thead>${strip}${head}</thead><tbody>${rows}</tbody></table>`;
  }

  // Hitter table groupings:
  //   Meta | Counting (G, AB, HR, SB) | Slash (AVG/OBP/SLG/OPS) |
  //   Power (ISO) | Plate discipline (BB%, K%).
  // ISO gets its own group because it's a pure power stat (SLG − AVG):
  // grouping it with BB%/K% as "plate discipline" was the prior mis-tag.
  // Single-column groups stay readable as long as the strip-cell color
  // is distinct from its neighbors — which the POWER_COLOR ensures.
  const strip = `<tr>
    <th colspan="2" style="${stripStyle(META_COLOR)}">Meta</th>
    <th colspan="4" style="${stripStyle(COUNT_COLOR)}">Counting</th>
    <th colspan="4" style="${stripStyle(SLASH_COLOR)}">Slash</th>
    <th colspan="1" style="${stripStyle(POWER_COLOR)}">Power</th>
    <th colspan="2" style="${stripStyle(DISC_COLOR)}">Plate discipline</th>
  </tr>`;
  const head = `<tr>
    <th>Season</th><th>Level</th>
    <th title="Games">G</th>
    <th title="At-Bats">AB</th>
    <th title="Home Runs">HR</th>
    <th title="Stolen Bases">SB</th>
    <th title="Batting Average">AVG</th>
    <th title="On-Base Percentage">OBP</th>
    <th title="Slugging Percentage">SLG</th>
    <th title="OBP + SLG">OPS</th>
    <th title="Isolated power = SLG − AVG. Pure power signal — strips the batting-average contribution out of slugging.">ISO</th>
    <th title="Walk rate">BB%</th>
    <th title="Strikeout rate">K%</th>
  </tr>`;
  const isoCell = (s) => {
    // Prefer the precomputed ISO from the fetcher; recompute on the fly
    // for any row that pre-dates the field being added to career_stats.
    if (s.iso != null) return s.iso.toFixed(3).replace(/^0/, "");
    const slg = parseFloat(s.slg);
    const avg = parseFloat(s.avg);
    if (!isFinite(slg) || !isFinite(avg)) return "—";
    return (slg - avg).toFixed(3).replace(/^0/, "");
  };
  const rows = sorted.map(s => `<tr>
    <td>${s.season}</td>
    <td><span class="level-pill level-neutral">${s.level}</span></td>
    <td>${s.games ?? "—"}</td>
    <td>${s.ab ?? "—"}</td>
    <td>${s.hr ?? "—"}</td>
    <td>${s.sb ?? "—"}</td>
    <td>${s.avg ?? "—"}</td>
    <td>${s.obp ?? "—"}</td>
    <td>${s.slg ?? "—"}</td>
    <td>${s.ops ?? "—"}</td>
    <td>${isoCell(s)}</td>
    <td>${s.bb_pct != null ? s.bb_pct.toFixed(1) : "—"}</td>
    <td>${s.k_pct != null ? s.k_pct.toFixed(1) : "—"}</td>
  </tr>`).join("");
  return `<table class="detail-table"><thead>${strip}${head}</thead><tbody>${rows}</tbody></table>`;
}

// Scouting-flags block — green/red rate-stat indicators precomputed
// server-side in stat_flags.py. The python side does the threshold work
// (compare to level norms + absolute floor); the UI just lays them out
// in two color-coded columns. Green flags = stats clearly above
// MLB-projectable thresholds at the player's current level. Red flags =
// stats meaningfully below — projectability concerns, not just "below
// average". Order within each column is tool-natural:
//   hitters : power → discipline → contact → results
//   pitchers: strikeouts → command → longball → results
// so each prospect's flag list reads in scout-report order rather than
// alphabetical.
const FLAG_CATEGORY_ORDER = [
  "power", "discipline", "contact",
  "strikeouts", "command", "longball",
  "results",
];
function makeStatFlagsBlock(player) {
  const flags = (player && player.stat_flags) || [];
  if (!flags.length) {
    // No flags either because the prospect lacks a usable statline
    // (insufficient sample) or no stat tripped a threshold. Either way
    // a quiet line is the right disposition — we don't want to paint
    // a "no flags" prospect as a problem.
    return `<div class="flag-empty">No flagged stats yet — sample too small or in the league-average band at this level.</div>`;
  }
  const sortFn = (a, b) => {
    const ai = FLAG_CATEGORY_ORDER.indexOf(a.category);
    const bi = FLAG_CATEGORY_ORDER.indexOf(b.category);
    return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
  };
  const green = flags.filter(f => f.direction === "green").sort(sortFn);
  const red   = flags.filter(f => f.direction === "red").sort(sortFn);

  const renderRow = f => {
    const arrow = f.direction === "green" ? "▲" : "▼";
    const deltaLine = f.delta_display != null && f.level_avg != null
      ? `<span class="flag-delta">${escapeHtml(f.delta_display)} vs ${escapeHtml(f.level || "?")} avg</span>`
      : "";
    const levelAvgVal = f.level_avg != null
      ? (typeof f.level_avg === "number"
          ? (Math.abs(f.level_avg) < 1
              ? f.level_avg.toFixed(3).replace(/^0/, "")
              : f.level_avg.toFixed(2))
          : f.level_avg)
      : "—";
    // Flavor-text "note" stays on the title attribute so a hover still
    // explains the scouting interpretation; the row itself just shows
    // the stat + value + level comparison, leaving room to read fast.
    return `<div class="flag-row" title="${escapeHtml(f.note || "")}">
      <div class="flag-arrow">${arrow}</div>
      <div class="flag-body">
        <span class="flag-stat">${escapeHtml(f.stat)} ${escapeHtml(f.value_display || "")}</span>
      </div>
      <div class="flag-numbers">
        <span>vs ${escapeHtml(String(levelAvgVal))}</span>
        ${deltaLine}
      </div>
    </div>`;
  };

  const greenCol = `<div class="flag-col flag-col-green">
    <div class="flag-col-title">Green flags <span class="flag-col-count">${green.length}</span></div>
    ${green.length ? green.map(renderRow).join("") : `<div class="flag-empty">No green flags yet.</div>`}
  </div>`;
  const redCol = `<div class="flag-col flag-col-red">
    <div class="flag-col-title">Red flags <span class="flag-col-count">${red.length}</span></div>
    ${red.length ? red.map(renderRow).join("") : `<div class="flag-empty">No red flags.</div>`}
  </div>`;

  return `<div class="flag-grid">${greenCol}${redCol}</div>`;
}

// Sabermetrics block — wRC+ / wOBA / WAR (hitters), xFIP / FIP / FIP-
// / ERA- / WAR (pitchers). When the MLB Stats API has nothing on file
// (every MiLB-only prospect), falls back to level-relative proxies
// (OPS+ vs level / ERA- vs level) so the slot is never blank.
function makeSabermetricsBlock(player) {
  const sm = player.sabermetrics;
  const sl = player.statline || {};
  // Color thresholds — paint values when they're clearly above / below
  // average so the eye can pick out elite / poor numbers at a glance.
  const goodC = "var(--up)", badC = "var(--down)", neutralC = "var(--text-primary)";
  const colorize = (good, bad, val) => val == null ? neutralC : (good ? goodC : bad ? badC : neutralC);

  const tiles = [];
  if (sm && (sm.wrc_plus != null || sm.woba != null || sm.war != null)) {
    // MLB hitter — use real wRC+ / wOBA
    if (sm.wrc_plus != null) {
      const v = Math.round(sm.wrc_plus);
      tiles.push(["wRC+", v, colorize(v >= 110, v <= 90, v),
                  "Weighted Runs Created+ · 100 = league avg, higher is better"]);
    }
    if (sm.woba != null) {
      const v = sm.woba.toFixed(3).replace(/^0/, "");
      tiles.push(["wOBA", v, colorize(sm.woba >= 0.340, sm.woba <= 0.300, sm.woba),
                  "Weighted On-Base Average · linear-weights scale, .320 ≈ avg"]);
    }
    if (sm.war != null) {
      const v = sm.war.toFixed(1);
      tiles.push(["WAR", v, colorize(sm.war >= 2.0, sm.war <= 0, sm.war),
                  "FanGraphs Wins Above Replacement"]);
    }
  } else if (sm && (sm.xfip != null || sm.fip != null || sm.fip_minus != null || sm.era_minus != null || sm.war != null)) {
    // MLB pitcher — use real xFIP / FIP / FIP-
    if (sm.xfip != null) {
      tiles.push(["xFIP", sm.xfip.toFixed(2), colorize(sm.xfip <= 3.50, sm.xfip >= 4.50, sm.xfip),
                  "Expected FIP · neutralizes HR/FB rate · league avg ≈ 4.00"]);
    }
    if (sm.fip != null) {
      tiles.push(["FIP", sm.fip.toFixed(2), colorize(sm.fip <= 3.50, sm.fip >= 4.50, sm.fip),
                  "Fielding-Independent Pitching · same scale as ERA"]);
    }
    if (sm.fip_minus != null) {
      const v = Math.round(sm.fip_minus);
      tiles.push(["FIP-", v, colorize(v <= 90, v >= 110, v),
                  "FIP- · 100 = league avg, lower is better"]);
    }
    if (sm.era_minus != null) {
      const v = Math.round(sm.era_minus);
      tiles.push(["ERA-", v, colorize(v <= 90, v >= 110, v),
                  "ERA- · 100 = league avg, lower is better"]);
    }
    if (sm.war != null) {
      tiles.push(["WAR", sm.war.toFixed(1), colorize(sm.war >= 2.0, sm.war <= 0, sm.war),
                  "FanGraphs Wins Above Replacement"]);
    }
  } else if (sl.ops_plus_level != null || sl.era_minus_level != null) {
    // MiLB fallback — level-relative proxies.
    if (sl.is_pitcher && sl.era_minus_level != null) {
      const v = sl.era_minus_level;
      tiles.push([
        "ERA- (vs level)", v, colorize(v <= 90, v >= 110, v),
        `Earned Run Average vs ${sl.level || "level"} median · proxy for xFIP (real xFIP requires MLB data)`,
      ]);
    } else if (!sl.is_pitcher && sl.ops_plus_level != null) {
      const v = sl.ops_plus_level;
      tiles.push([
        "OPS+ (vs level)", v, colorize(v >= 110, v <= 90, v),
        `On-base + Slugging vs ${sl.level || "level"} median · proxy for wRC+ (real wRC+ requires MLB data)`,
      ]);
    }
  }

  if (!tiles.length) {
    return `<div style="color:var(--text-tertiary);font-size:12px;">No advanced stats available yet. ${sl.is_pitcher ? "xFIP" : "wRC+"} requires MLB-level data; level-relative proxies need enough innings/PAs to stabilize.</div>`;
  }

  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;">${tiles.map(([label, val, color, title]) => `
    <div class="stat-tile" title="${escapeHtml(title)}">
      <div class="stat-label">${escapeHtml(label)}</div>
      <div class="stat-value" style="color:${color};font-family:var(--font-mono);">${val}</div>
    </div>`).join("")}</div>`;
}

// Pitch arsenal block — pitch type × usage % × avg velo.
// Coverage: MLB Stats API only exposes pitch-tracking data for MLB
// games, so this is populated for graduates and the rare MiLB prospect
// who's gotten MLB innings. For pure MiLB prospects the block surfaces
// a clear "not available at this level" message so the user knows the
// gap is data coverage, not a missing prospect.
function makeArsenalBlock(pa) {
  if (!pa || !(pa.pitches || []).length) {
    return `<div style="color:var(--text-tertiary);font-size:12px;line-height:1.5;">No pitch-tracking data on file. MLB Stats API only carries pitch arsenal for MLB games; MiLB-only pitchers don't yet have this exposed publicly.</div>`;
  }
  // Sort pitches descending by usage for clear primary-vs-secondary read.
  const sorted = [...pa.pitches].sort((a, b) => (b.usage_pct || 0) - (a.usage_pct || 0));
  const rows = sorted.map(p => {
    // Visual usage bar: 100% of column width = ~highest usage in arsenal.
    const pct = p.usage_pct != null ? p.usage_pct * 100 : 0;
    const bar = `<div style="display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;">
      <div style="flex:1;height:6px;background:var(--bg-tertiary);border:1px solid var(--border-light);border-radius:2px;overflow:hidden;">
        <div style="width:${Math.min(100, pct).toFixed(1)}%;height:100%;background:var(--neon-cyan);"></div>
      </div>
      <span style="color:var(--text-primary);min-width:42px;text-align:right;">${pct.toFixed(1)}%</span>
    </div>`;
    return `<tr>
      <td><span class="src-tag">${escapeHtml(p.pitch_type)}</span> ${escapeHtml(p.pitch_name)}</td>
      <td style="text-align:right;font-variant-numeric:tabular-nums;">${p.avg_speed != null ? p.avg_speed.toFixed(1) + " mph" : "—"}</td>
      <td>${bar}</td>
    </tr>`;
  }).join("");
  const fb = pa.fb_velo != null
    ? `<div style="font-size:11px;color:var(--text-tertiary);margin-bottom:6px;font-family:var(--font-sans);">Primary fastball velo: <span style="color:var(--neon-green);font-family:var(--font-mono);font-weight:700;">${pa.fb_velo.toFixed(1)} mph</span></div>`
    : "";
  return fb + `<table class="detail-table"><thead><tr><th>Pitch</th><th style="text-align:right;">Velo</th><th style="text-align:left;">Usage</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// Unified transaction-history block — trades + level changes + other
// transactions, all sorted by date with a `Type` column that labels
// each row precisely. The data layers separate cleanly:
//   - player.trades        → only real trades (typeCode TR)
//   - player.level_changes → promotions/demotions + MLB debut
//   - player.transactions  → waiver claims, releases, DFAs, contract
//                            purchases, Rule 5 moves, FA signings
// Each kind paints its own colored chip in the Type column so a reader
// can scan by category without parsing description text.
function makeTransactionHistoryBlock(player) {
  const trades = player && player.trades || [];
  const levelChanges = player && player.level_changes || [];
  const otherTx = player && player.transactions || [];
  if (!trades.length && !levelChanges.length && !otherTx.length) {
    return `<div style="color:var(--text-tertiary);font-size:12px;">No transactions on record.</div>`;
  }

  // Compact colored chip: the canonical "what kind of transaction is
  // this?" label. Pulls color from TRANSACTION_KINDS so the legend on
  // the FV chart, the glyphs on the chart, and this table all agree.
  const typeChip = (kind) => {
    const cfg = TRANSACTION_KINDS[kind] || {};
    const color = cfg.color || "var(--text-tertiary)";
    const lbl   = cfg.label || kind;
    return `<span style="display:inline-flex;align-items:center;gap:4px;border:1px solid ${color};color:${color};background:transparent;font-family:var(--font-sans);font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:1px 6px;border-radius:2px;white-space:nowrap;">${escapeHtml(lbl)}</span>`;
  };

  // Build a flat row list. Each row: {date, kind, move (HTML), detail}.
  const rows = [];
  const focalKey = player && player.player_key;
  for (const t of trades) {
    rows.push({
      kind: "trade",
      date: t.trade_date,
      move: `${escapeHtml(t.from_org ?? "?")} <span style="color:var(--neon-violet);">→</span> ${escapeHtml(t.to_org ?? "?")}`,
      // Highlight any other tracked prospects named in the trade text so
      // a multi-prospect deal becomes a navigation hub from each leg.
      detail: highlightTrackedNamesInText(t.description || "", focalKey),
    });
  }
  for (const lc of levelChanges) {
    if (lc.kind === "debut") {
      const teamPart = lc.to_team ? ` with ${escapeHtml(lc.to_team)}` : "";
      const fromPart = lc.from_level
        ? `<span class="level-pill level-neutral" style="margin-right:4px;">${escapeHtml(lc.from_level)}</span><span style="color:var(--up);margin-right:4px;">↑</span>`
        : "";
      rows.push({
        kind: lc.kind,
        date: lc.date,
        move: `${fromPart}<span class="level-pill" style="background:var(--neon-amber);color:var(--text-on-accent,#1a1208);font-weight:700;letter-spacing:0.04em;">★ MLB DEBUT</span>`,
        detail: `Major league debut${teamPart}.`,
      });
      continue;
    }
    const arrow = lc.kind === "promotion"
      ? `<span style="color:var(--up);">↑</span>`
      : `<span style="color:var(--down);">↓</span>`;
    rows.push({
      kind: lc.kind,
      date: lc.date,
      move: `<span class="level-pill level-neutral" style="margin-right:2px;">${escapeHtml(lc.from_level || "?")}</span> ${arrow} <span class="level-pill level-neutral" style="margin-left:2px;">${escapeHtml(lc.to_level || "?")}</span>`,
      detail: lc.to_team
        ? `${lc.kind === "promotion" ? "Promoted" : "Demoted"} to ${escapeHtml(lc.to_team)}${lc.from_team ? ` from ${escapeHtml(lc.from_team)}` : ""}`
        : "",
    });
  }
  // Non-trade transactions: waiver claim, contract purchase, release,
  // DFA, outright, Rule 5 selection/return, FA signing. Each row's
  // `move` summarizes the from/to teams (when applicable) so the table
  // reads like a roster diff regardless of the underlying kind.
  for (const tx of otherTx) {
    const kind = reclassifyAcquisitionSigning(player, tx);
    if (!TRANSACTION_KINDS[kind]) continue;
    let movePart;
    if (tx.from_team && tx.to_team) {
      movePart = `${escapeHtml(tx.from_team)} <span style="color:var(--neon-violet);">→</span> ${escapeHtml(tx.to_team)}`;
    } else if (tx.to_team) {
      movePart = `→ ${escapeHtml(tx.to_team)}`;
    } else if (tx.from_team) {
      movePart = `${escapeHtml(tx.from_team)} →`;
    } else {
      movePart = `<span style="color:var(--text-tertiary);">—</span>`;
    }
    rows.push({
      kind: kind,
      date: tx.date,
      move: movePart,
      // Link any tracked prospects mentioned (e.g. multi-player trades
      // where the other party shows up in the description).
      detail: highlightTrackedNamesInText(tx.description || "", focalKey),
    });
  }
  rows.sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const html = rows.map(r => `<tr>
    <td style="white-space:nowrap;">${escapeHtml(r.date)}</td>
    <td style="white-space:nowrap;">${typeChip(r.kind)}</td>
    <td>${r.move}</td>
    <td style="color:var(--text-secondary);font-size:11px;line-height:1.45;">${r.detail}</td>
  </tr>`).join("");
  return `<table class="detail-table"><thead><tr><th>Date</th><th>Type</th><th>Move</th><th>Detail</th></tr></thead><tbody>${html}</tbody></table>`;
}

// Back-compat shim: older callers (and any deployed embed) used
// `makeTradeHistoryBlock(p.trades)`. The new unified block takes the
// whole player, so keep this wrapper so nothing else needs touching.
function makeTradeHistoryBlock(trades) {
  return makeTransactionHistoryBlock({ trades, level_changes: [] });
}

// Injury history block — list every IL stint we can derive from the
// MLB Stats API per-player transactions payload, oldest first. Stints
// transferred from 15-day to 60-day collapse into one row showing the
// longest IL type the player landed on. The currently-active stint
// renders with an open `present` end-cap.
function makeInjuryHistoryBlock(history) {
  if (!history || !history.length) {
    return `<div style="color:var(--text-tertiary);font-size:12px;">No IL stints on record.</div>`;
  }
  // Helper: human readable date span.
  const fmtDate = iso => {
    if (!iso) return "—";
    const d = new Date(iso + "T00:00:00");
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("en-US", { year: "2-digit", month: "short", day: "numeric" });
  };
  const rows = history.map(s => {
    const sinceFmt = fmtDate(s.since);
    const untilFmt = s.until ? fmtDate(s.until) : `<span style="color:var(--neon-amber);font-weight:600;">present</span>`;
    const days = s.days != null
      ? `${s.days}d`
      : (s.active && s.since
          ? (() => {
              const ms = Date.now() - new Date(s.since + "T00:00:00").getTime();
              return !isNaN(ms) && ms > 0 ? `${Math.floor(ms / 86400000)}d` : "—";
            })()
          : "—");
    const typeColor = s.active
      ? "var(--neon-amber)"
      : (s.type === "60-day" ? "var(--down)" : "var(--text-tertiary)");
    return `<tr>
      <td style="white-space:nowrap;font-variant-numeric:tabular-nums;">${sinceFmt} → ${untilFmt}</td>
      <td style="white-space:nowrap;color:${typeColor};font-weight:${s.active ? 600 : 500};">${escapeHtml(s.type || "?")} IL</td>
      <td style="white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text-primary);">${days}</td>
      <td style="color:var(--text-secondary);font-size:11px;line-height:1.45;">${escapeHtml(s.reason || "")}</td>
    </tr>`;
  }).join("");
  return `<table class="detail-table"><thead><tr><th>Stint</th><th>List</th><th>Length</th><th>Diagnosis</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// Per-source FV history — shows the full breakdown of how each ranking
// source has graded the player over time.
function makePerSourceHistory(points) {
  // Collect every source that ever appeared, plus the most recent FV they
  // assigned at each snapshot date.
  const sources = new Set();
  for (const pt of points) {
    for (const src of Object.keys(pt.per_source || {})) sources.add(src);
  }
  if (!sources.size) {
    return `<div style="color:var(--text-tertiary);font-size:12px;">No per-source breakdown available.</div>`;
  }
  const sortedSources = [...sources].sort();
  const head = `<tr><th>Date</th><th>Update</th>${sortedSources.map(s => `<th>${escapeHtml(SOURCE_LABELS[s] || s)}</th>`).join("")}<th>Consensus</th></tr>`;
  const body = points.map(pt => {
    const perSrc = pt.per_source || {};
    return `<tr>
      <td>${pt.snapshot_date}</td>
      <td><span class="src-tag">${escapeHtml(pt.interval_label)}</span></td>
      ${sortedSources.map(s => {
        const d = perSrc[s];
        if (!d) return `<td style="color:var(--text-tertiary);">—</td>`;
        const fv = d.fv_published != null
          ? `<span class="fv-badge ${fvClass(String(d.fv_published))}" style="font-size:10px;padding:1px 6px;">${d.fv_published}</span>`
          : "—";
        const rank = d.rank != null ? `<span style="font-size:10px;color:var(--text-tertiary);"> #${d.rank}</span>` : "";
        return `<td>${fv}${rank}</td>`;
      }).join("")}
      <td><span class="fv-badge ${fvClass(pt.consensus_fv_label)}" style="font-size:10px;padding:1px 6px;">${pt.consensus_fv_label}</span></td>
    </tr>`;
  }).join("");
  return `<table class="detail-table"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

function renderPlayerDetail(key) {
  const p = findPlayer(key);
  const root = document.getElementById("player-detail-body");
  if (!p) {
    root.innerHTML = `<div class="state-message">Unknown prospect: ${escapeHtml(key)}. <a href="#" onclick="goHome();return false;">Back to list</a>.</div>`;
    return;
  }
  const latest = p.points && p.points.length ? p.points[p.points.length - 1] : null;
  const orgLink = p.org
    ? `<a href="#farm-org=${escapeHtml(p.org)}" onclick="event.preventDefault();goToFarm('${escapeHtml(p.org)}');" style="color:var(--neon-cyan);text-decoration:none;">${escapeHtml(p.org)}</a>`
    : "—";
  // Header status pill — graduated wins over IL when both apply (a
  // graduated player who later goes on the MLB IL is now an MLB story,
  // not a prospect-tracker story).
  const ilNow = p.il_status && p.il_status.is_on_il ? p.il_status : null;
  let ilDays = null;
  if (ilNow && ilNow.since) {
    const ms = Date.now() - new Date(ilNow.since + "T00:00:00").getTime();
    if (!isNaN(ms) && ms > 0) ilDays = Math.floor(ms / 86400000);
  }
  const statusPill = p.status === "graduated"
    ? `<span class="grad-pill" style="background:var(--bg-tertiary);color:var(--grad);">Graduated ${p.graduation_date || ""}</span>`
    : ilNow
      ? `<span class="grad-pill" style="background:rgba(201,162,39,0.10);color:var(--neon-amber);border-color:var(--neon-amber);">${escapeHtml(ilNow.type || "?")} IL${ilDays != null ? ` · ${ilDays}d` : ""}</span>`
      : "";

  // Post-Tommy John chip. The health_profile.tj_surgery_date is set
  // server-side when any IL stint description matches a TJ-class
  // phrase. The chip shows next to the status pill in the header so
  // a reader can see at a glance that a pitcher is on the
  // post-surgery development arc.
  const hp = p.health_profile || {};
  const tjPill = hp.is_post_tj
    ? `<span class="grad-pill" style="background:rgba(107,79,168,0.10);color:var(--neon-violet);border:1px solid rgba(107,79,168,0.55);">Post-TJ${hp.tj_surgery_date ? ` · ${escapeHtml(hp.tj_surgery_date)}` : ""}</span>`
    : "";

  const avl = p.age_vs_level || {};
  const fvLabel = latest ? latest.consensus_fv_label : "—";
  const fvBadge = latest ? `<span class="fv-badge ${fvClass(fvLabel)}" style="font-size:22px;padding:5px 14px;min-width:60px;margin-top:4px;">${fvLabel}</span>` : "";

  // Rank pills — overall position in the FV-sorted active list, plus org
  // position. Hidden for graduates/inactives where these fields are null.
  const rankPill = (label, val, color) => `<span style="font-family:var(--font-mono);font-size:11px;color:${color};background:var(--bg-tertiary);border:1px solid var(--border);padding:3px 9px;border-radius:2px;letter-spacing:0;font-weight:700;font-variant-numeric:tabular-nums;"><span style="font-family:var(--font-sans);font-weight:600;letter-spacing:0.04em;text-transform:uppercase;font-size:10px;color:var(--text-tertiary);margin-right:4px;">${label}</span>${val}</span>`;
  const rankPills = (p.overall_rank != null || p.org_rank != null)
    ? `<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;">
        ${p.overall_rank != null ? rankPill("Overall", "#" + p.overall_rank, "var(--neon-violet)") : ""}
        ${p.org_rank != null ? rankPill(escapeHtml(p.org || "?"), "#" + p.org_rank + (p.org_rank_total ? " of " + p.org_rank_total : ""), "var(--neon-cyan)") : ""}
      </div>`
    : "";

  const header = `
    <a href="#" onclick="event.preventDefault();goHome();" class="back-link">← Back to list</a>
    <div class="detail-page-header" style="${orgStripe(p.org)}">
      <div style="display:flex;align-items:flex-start;gap:16px;flex:1;min-width:0;">
        ${headshotHTML(p, 130)}
        ${teamLogoHTML(p.org, "lg", p.org ? fullOrgName(p.org) : "")}
        <div style="min-width:0;">
          <div class="player-display-name">${escapeHtml(p.player_name)}</div>
          <div class="player-display-meta">
            <strong style="font-weight:600;color:var(--text-primary);">${escapeHtml(p.position ?? "—")}</strong> · ${orgLink}${p.age != null ? ` · age ${p.age.toFixed(1)}` : ""}${p.birth_date ? ` · born ${p.birth_date}` : ""}
            ${statusPill ? " · " + statusPill : ""}
            ${tjPill     ? " · " + tjPill     : ""}
          </div>
          ${rankPills}
        </div>
      </div>
      <div style="text-align:right;">
        <div style="font-family:var(--font-sans);font-size:10px;color:var(--text-tertiary);letter-spacing:0.08em;text-transform:uppercase;font-weight:600;">Current FV</div>
        ${fvBadge}
        ${latest && latest.avg_rank != null ? `<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);margin-top:4px;">Avg rank #${latest.avg_rank.toFixed(1)}</div>` : ""}
      </div>
    </div>`;

  // Highlight tiles: FV high/low/open/close, age vs level, ETA. The
  // age-vs-level subline cites the empirical median age at the prospect's
  // current level so users can see what we're comparing against.
  const eta = p.eta || {};
  const sl = p.statline || {};
  const levelNorm = (DATA.level_norms || {})[sl.level] || {};
  const ageNorm = levelNorm.age || {};
  const perfNorm = levelNorm.perf || {};
  const ageSub = (avl.tier && avl.tier !== "unknown" && ageNorm.median_age != null)
    ? `${sl.level} median ${ageNorm.median_age.toFixed(1)}y`
    : "";
  // Headline sabermetric tile — leads the row so the reader sees the
  // most-important rate stat first. Pulls real wRC+/xFIP when the API
  // has them; falls back to OPS+/ERA- (vs level) otherwise. The sub
  // line says where the number comes from so the reader knows whether
  // it's a real sabermetric or a level-relative proxy.
  //
  // `isPitcher` is derived from position (regex) rather than
  // statline.is_pitcher because graduates / inactives may not carry a
  // statline. The same variable feeds the pitch-arsenal section below.
  const sm = p.sabermetrics || {};
  const isPitcher = p.position && /^(RHP|LHP|SP|RP|MIRP|SIRP)/.test(p.position);
  let headlineTile = null;
  if (isPitcher) {
    if (sm.xfip != null) {
      headlineTile = ["xFIP", sm.xfip.toFixed(2), "MLB · FanGraphs"];
    } else if (sl.era_minus_level != null) {
      headlineTile = [`ERA- vs ${sl.level || "level"}`, sl.era_minus_level,
                       "proxy for xFIP · 100 = level avg"];
    }
  } else {
    if (sm.wrc_plus != null) {
      headlineTile = ["wRC+", Math.round(sm.wrc_plus), "MLB · FanGraphs"];
    } else if (sl.ops_plus_level != null) {
      headlineTile = [`OPS+ vs ${sl.level || "level"}`, sl.ops_plus_level,
                       "proxy for wRC+ · 100 = level avg"];
    }
  }

  const tiles = [
    ...(headlineTile ? [headlineTile] : []),
    ["FV high", p.fv_high_label || p.fv_high || "—", `${p.fv_high_date || ""}`],
    ["FV low",  p.fv_low_label  || p.fv_low  || "—", `${p.fv_low_date || ""}`],
    ["FV open", p.fv_open ?? "—", ""],
    ["FV close",p.fv_close ?? "—", ""],
    ["Age vs. level", avl.tier && avl.tier !== "unknown"
        ? avl.tier.replace(/-/g, " ") + (avl.diff != null ? ` (${avl.diff > 0 ? "+" : ""}${avl.diff.toFixed(1)}y)` : "")
        : "—", ageSub],
  ];
  const tilesHtml = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px;">${tiles.map(([k, v, sub], idx) => {
    // Headline tile (when present) gets emphasized: thicker left rule
    // in the team color and a slightly larger value font.
    const isHead = headlineTile && idx === 0;
    const extraStyle = isHead
      ? `border-left:4px solid var(--org-color, var(--bg-header));`
      : "";
    const valStyle = isHead ? `font-size:24px;color:var(--neon-cyan);` : "";
    return `
    <div class="stat-tile" style="${extraStyle}">
      <div class="stat-label">${k}</div>
      <div class="stat-value" style="${valStyle}">${v}</div>
      ${sub ? `<div class="stat-sub">${sub}</div>` : ""}
    </div>`;
  }).join("")}</div>`;

  // Age/level-relative performance — shows every level the player has
  // touched alongside the empirical median for that level. The age
  // column compares the player to the level's median age; the rate-
  // stat columns compare each rate stat to the level's average.
  // Colors: green when the player beats the level (low ERA / high
  // OPS+ISO / low K% / high BB% / low BB-HR/9), red when they trail.
  // Hitters and pitchers get different stat columns reflecting what
  // matters at each position.
  const levelBenchmarkSection = (() => {
    const career = p.career_stats || [];
    if (!career.length) return "";
    const isP = career[0].is_pitcher;

    // Format helpers that always print the delta alongside the raw,
    // colored by whether the player is above or below the level avg.
    const fmtDeltaColor = (val, avg, lowerBetter) => {
      if (val == null || isNaN(val) || avg == null) return "—";
      const delta = val - avg;
      // Tolerate signed-zero noise so a 0.0 delta doesn't get a color.
      const isBetter = lowerBetter ? delta < -0.01 : delta > 0.01;
      const isWorse  = lowerBetter ? delta > 0.01  : delta < -0.01;
      const color = isBetter ? "var(--up)" : isWorse ? "var(--down)" : "var(--text-tertiary)";
      return `<span style="color:${color};">${(delta > 0 ? "+" : "")}${delta.toFixed(2)}</span>`;
    };
    // Rate-stat formatter that strips the leading zero ("0.180" → ".180")
    // and pairs the raw value with a colored delta vs. the level avg.
    const fmtRate3 = (val, avg, lowerBetter) => {
      if (val == null || isNaN(val) || avg == null) return "—";
      const delta = val - avg;
      const isBetter = lowerBetter ? delta < -0.001 : delta > 0.001;
      const isWorse  = lowerBetter ? delta > 0.001  : delta < -0.001;
      const color = isBetter ? "var(--up)" : isWorse ? "var(--down)" : "var(--text-tertiary)";
      const fmt = n => Math.abs(n) < 1
        ? (n >= 0 ? "" : "-") + Math.abs(n).toFixed(3).replace(/^0/, "")
        : n.toFixed(3);
      const sign = delta > 0 ? "+" : "";
      return `${fmt(val)} <span style="color:${color};font-size:11px;">(${sign}${fmt(delta)} vs ${fmt(avg)})</span>`;
    };
    const fmtPct = (val, avg, lowerBetter) => {
      if (val == null || isNaN(val) || avg == null) return "—";
      const delta = val - avg;
      const isBetter = lowerBetter ? delta < -0.1 : delta > 0.1;
      const isWorse  = lowerBetter ? delta > 0.1  : delta < -0.1;
      const color = isBetter ? "var(--up)" : isWorse ? "var(--down)" : "var(--text-tertiary)";
      const sign = delta > 0 ? "+" : "";
      return `${val.toFixed(1)}% <span style="color:${color};font-size:11px;">(${sign}${delta.toFixed(1)}pp)</span>`;
    };
    const fmtNum = (val, avg, lowerBetter, digits = 2) => {
      if (val == null || isNaN(val) || avg == null) return "—";
      const delta = val - avg;
      const isBetter = lowerBetter ? delta < -0.05 : delta > 0.05;
      const isWorse  = lowerBetter ? delta > 0.05  : delta < -0.05;
      const color = isBetter ? "var(--up)" : isWorse ? "var(--down)" : "var(--text-tertiary)";
      const sign = delta > 0 ? "+" : "";
      return `${val.toFixed(digits)} <span style="color:${color};font-size:11px;">(${sign}${delta.toFixed(digits)} vs ${avg.toFixed(digits)})</span>`;
    };
    const num = v => {
      const n = parseFloat(v);
      return isFinite(n) ? n : null;
    };

    const rows = career.map(c => {
      const norm = (DATA.level_norms || {})[c.level] || {};
      const a = norm.age || {};
      const perf = norm.perf || {};
      const seasonMid = new Date(`${c.season}-07-01`).getTime();
      let ageAtSeason = null;
      if (p.birth_date) {
        const birthT = new Date(p.birth_date).getTime();
        ageAtSeason = ((seasonMid - birthT) / (365.25 * 86400000));
      }
      const ageDiff = (ageAtSeason != null && a.median_age != null)
        ? (ageAtSeason - a.median_age) : null;
      const ageDiffHtml = ageDiff != null
        ? `<span style="color:${ageDiff <= -1 ? "var(--up)" : ageDiff >= 1 ? "var(--down)" : "var(--text-tertiary)"};">${ageDiff > 0 ? "+" : ""}${ageDiff.toFixed(1)}y</span>`
        : "—";
      // Build the stat cells. Hitters get OPS / ISO / BB% / K%;
      // pitchers get ERA / WHIP / K/9 / BB/9.
      let statCells;
      if (isP) {
        statCells = `
          <td style="font-variant-numeric:tabular-nums;">${fmtNum(num(c.era), perf.avg_era, true, 2)}</td>
          <td style="font-variant-numeric:tabular-nums;">${fmtNum(num(c.whip), perf.avg_whip, true, 2)}</td>
          <td style="font-variant-numeric:tabular-nums;">${fmtNum(num(c.k_per_9), perf.avg_k_per_9, false, 2)}</td>
          <td style="font-variant-numeric:tabular-nums;">${fmtNum(num(c.bb_per_9), perf.avg_bb_per_9, true, 2)}</td>`;
      } else {
        const iso = c.iso != null ? c.iso : (num(c.slg) != null && num(c.avg) != null ? num(c.slg) - num(c.avg) : null);
        statCells = `
          <td style="font-variant-numeric:tabular-nums;">${fmtRate3(num(c.ops), perf.avg_ops, false)}</td>
          <td style="font-variant-numeric:tabular-nums;">${fmtRate3(iso, perf.avg_iso, false)}</td>
          <td style="font-variant-numeric:tabular-nums;">${fmtPct(num(c.bb_pct), perf.avg_bb_pct, false)}</td>
          <td style="font-variant-numeric:tabular-nums;">${fmtPct(num(c.k_pct), perf.avg_k_pct, true)}</td>`;
      }
      return `<tr>
        <td>${c.season}</td>
        <td><span class="level-pill level-neutral">${c.level}</span></td>
        <td style="font-variant-numeric:tabular-nums;">${ageAtSeason != null ? ageAtSeason.toFixed(1) : "—"} vs ${a.median_age != null ? a.median_age.toFixed(1) : "—"} ${ageDiffHtml}</td>
        ${statCells}
      </tr>`;
    }).join("");
    const statHeaders = isP
      ? `<th>ERA vs lvl</th><th>WHIP vs lvl</th><th>K/9 vs lvl</th><th>BB/9 vs lvl</th>`
      : `<th>OPS vs lvl</th><th>ISO vs lvl</th><th>BB% vs lvl</th><th>K% vs lvl</th>`;
    return `<div class="detail-title" style="margin-top:18px;">Age &amp; level-relative performance
        <span style="font-weight:400;font-size:11px;color:var(--text-tertiary);margin-left:6px;">colored delta vs. the empirical level median for each stat</span>
      </div>
      <table class="detail-table"><thead><tr><th>Season</th><th>Level</th><th>Age vs lvl</th>${statHeaders}</tr></thead><tbody>${rows}</tbody></table>`;
  })();

  const chartSection = (p.points && p.points.length >= 2)
    ? `<div class="detail-title">FV history</div>${makeBigLineChart(p.points, p.fv_open, p.fv_close, p.graduation_date, p.trades, p.career_stats, p)}
       ${transactionLegend()}`
    : `<div style="color:var(--text-tertiary);font-size:12px;">Not enough FV updates yet for a chart.</div>`;

  const careerSection = `<div class="detail-title" style="margin-top:18px;">Stats by season</div>${makeCareerTable(p.career_stats)}`;

  const sourceSection = `<div class="detail-title" style="margin-top:18px;">Source-by-source FV history</div>${makePerSourceHistory(p.points || [])}`;

  // Sabermetrics block — wRC+/xFIP for MLB players, level-relative
  // proxies (OPS+ / ERA-) otherwise. Title flexes with what's shown
  // so the user always knows what they're looking at.
  const _sm = p.sabermetrics || {};
  const _hasRealSabr = (_sm.wrc_plus != null || _sm.xfip != null);
  const sabermetricsTitle = _hasRealSabr
    ? `Advanced stats <span style="font-weight:400;font-size:11px;color:var(--text-tertiary);margin-left:6px;">FanGraphs sabermetrics (MLB)</span>`
    : `Advanced stats <span style="font-weight:400;font-size:11px;color:var(--text-tertiary);margin-left:6px;">level-relative proxies · MLB sabermetrics unavailable for MiLB</span>`;
  const sabermetricsSection = `<div class="detail-title">${sabermetricsTitle}</div>${makeSabermetricsBlock(p)}`;

  const arsenalSection = isPitcher
    ? `<div class="detail-title" style="margin-top:18px;">Pitch arsenal</div>${makeArsenalBlock(p.pitch_arsenal)}`
    : "";

  const tradesSection = `<div class="detail-title" style="margin-top:18px;">Transaction history</div>${makeTransactionHistoryBlock(p)}`;

  // Injury history — every IL stint we have on record, oldest first.
  // Section title flexes with whether the player is currently injured so
  // the user can spot an open stint without scanning the table.
  const injurySection = (() => {
    const history = ((p.roster_status || {}).injury_history) || [];
    if (!history.length) return "";
    const active = history.some(s => s.active);
    const title = active
      ? `Injury history <span style="font-weight:400;font-size:11px;color:var(--neon-amber);margin-left:6px;">currently on IL · ${history.length} total stint${history.length === 1 ? "" : "s"}</span>`
      : `Injury history <span style="font-weight:400;font-size:11px;color:var(--text-tertiary);margin-left:6px;">${history.length} stint${history.length === 1 ? "" : "s"} on record</span>`;
    return `<div class="detail-title" style="margin-top:18px;">${title}</div>${makeInjuryHistoryBlock(history)}`;
  })();

  // Acquisition info: drafted prospects show pick + bonus; IFAs show
  // "International FA" + (when known) signing details. Section omitted
  // when we don't have an acquisition record (rare — only prospects whose
  // MLBAM ID couldn't be resolved at all).
  const acqSection = (() => {
    const a = p.acquisition;
    if (!a) return "";
    const fmtBonus = b => b == null ? "—" : `$${b.toLocaleString("en-US")}`;
    if (a.method === "draft") {
      const pick = a.pick_overall != null
        ? `Round ${escapeHtml(a.round_label || "?")} · Pick ${a.pick_overall} overall`
        : `Round ${escapeHtml(a.round_label || "?")}`;
      const team = a.team_name ? ` by ${escapeHtml(a.team_name)}` : "";
      const school = a.school ? `<div style="font-size:11px;color:var(--text-tertiary);margin-top:2px;">From ${escapeHtml(a.school)}</div>` : "";
      return `<div class="detail-title" style="margin-top:18px;">Acquisition · MLB Draft</div>
        <div style="border:1px solid var(--border-light);background:var(--bg-secondary);padding:10px 12px;border-radius:2px;">
          <div style="font-size:14px;color:var(--text-primary);">${a.year} · ${pick}${team}</div>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">Signing bonus: <span style="color:var(--neon-cyan);font-variant-numeric:tabular-nums;">${fmtBonus(a.bonus_usd)}</span></div>
          ${school}
        </div>`;
    }
    if (a.method === "international_fa") {
      // Headline mirrors the draft block: "<year> · Signed by <team>".
      // Falls through gracefully when partial fields are missing — we
      // always have at least one of (year, team, generic label).
      const team = a.team_name ? `Signed by ${escapeHtml(a.team_name)}` : "Signed as an international amateur free agent";
      const headline = a.year
        ? `${a.year} · ${team}`
        : team;
      // Render the precise signing date on its own line when present.
      // Date arrives as ISO (YYYY-MM-DD); format to "Jul 2, 2019" for
      // readability. Skip the line when only the year is known (it'd
      // duplicate the headline).
      let dateLine = "";
      if (a.signing_date) {
        const d = new Date(a.signing_date + "T00:00:00");
        const formatted = isNaN(d.getTime())
          ? a.signing_date
          : d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
        dateLine = `<div style="font-size:11px;color:var(--text-tertiary);margin-top:2px;">Signed ${escapeHtml(formatted)}</div>`;
      }
      const bonusLine = a.bonus_usd != null
        ? `<div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">Signing bonus: <span style="color:var(--neon-cyan);font-variant-numeric:tabular-nums;">${fmtBonus(a.bonus_usd)}</span></div>`
        : `<div style="font-size:11px;color:var(--text-tertiary);margin-top:4px;">Signing-bonus data not on file.</div>`;
      return `<div class="detail-title" style="margin-top:18px;">Acquisition · International FA</div>
        <div style="border:1px solid var(--border-light);background:var(--bg-secondary);padding:10px 12px;border-radius:2px;">
          <div style="font-size:14px;color:var(--text-primary);">${headline}</div>
          ${bonusLine}
          ${dateLine}
        </div>`;
    }
    return "";
  })();

  // Injury block — only shown when the player is currently on IL.
  // Combines the placement description, list type, since-date, and a
  // running day counter so a reader gets full context without scrolling
  // to the transaction history table.
  const ilSection = (() => {
    const il = p.il_status;
    if (!il || !il.is_on_il) return "";
    let days = null;
    if (il.since) {
      const ms = Date.now() - new Date(il.since + "T00:00:00").getTime();
      if (!isNaN(ms) && ms > 0) days = Math.floor(ms / 86400000);
    }
    let sinceFmt = il.since;
    if (il.since) {
      const d = new Date(il.since + "T00:00:00");
      if (!isNaN(d.getTime())) {
        sinceFmt = d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
      }
    }
    const desc = il.description
      ? `<div style="font-size:11px;color:var(--text-secondary);margin-top:6px;line-height:1.4;">${escapeHtml(il.description)}</div>`
      : "";
    return `<div class="detail-title" style="margin-top:18px;color:var(--neon-amber);">Currently on ${escapeHtml(il.type || "?")} IL</div>
      <div style="border:1px solid rgba(201,162,39,0.45);background:rgba(201,162,39,0.10);padding:12px 14px;border-radius:var(--radius-sm);">
        <div style="font-size:14px;color:var(--text-primary);">
          Since ${escapeHtml(sinceFmt || "—")}${days != null ? ` <span style="color:var(--neon-amber);font-variant-numeric:tabular-nums;">· ${days} day${days === 1 ? "" : "s"}</span>` : ""}
        </div>
        ${desc}
      </div>`;
  })();

  // Health profile sidebar card — surfaces the 24-month IL aggregate
  // even when the player isn't currently on IL. Three numbers + the
  // Tommy-John state at a glance: stint count, total IL days, and the
  // surgery date (when applicable). Lets a scouting reader assess
  // durability risk without scrolling to the Injury history table.
  const healthSection = (() => {
    const hp = p.health_profile || {};
    const stints = hp.il_stints_24mo || 0;
    const days = hp.il_days_24mo || 0;
    const hasAnySignal = stints > 0 || days > 0 || hp.is_post_tj;
    if (!hasAnySignal) return "";
    // Pick a color for the headline number — green if clean, amber for
    // mild concern, red for chronic / TJ recovery.
    const headlineColor = hp.is_post_tj || stints >= 3 || days >= 200
      ? "var(--down)"
      : (stints >= 1 || days >= 30)
        ? "var(--neon-amber)"
        : "var(--up)";
    const tjLine = hp.is_post_tj
      ? `<div style="font-size:12px;color:var(--neon-violet);font-weight:600;margin-top:6px;">Post-TJ recovery${hp.tj_surgery_date ? ` · surgery ${escapeHtml(hp.tj_surgery_date)}` : ""}</div>`
      : "";
    return `<div class="detail-title" style="margin-top:18px;">Health profile <span style="font-weight:400;font-size:11px;color:var(--text-tertiary);margin-left:6px;">trailing 24 months</span></div>
      <div style="border:1px solid var(--border-light);background:var(--bg-secondary);padding:10px 12px;border-radius:var(--radius-sm);">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div>
            <div class="stat-label">IL stints</div>
            <div class="stat-value" style="color:${headlineColor};font-family:var(--font-mono);font-variant-numeric:tabular-nums;">${stints}</div>
          </div>
          <div>
            <div class="stat-label">Days on IL</div>
            <div class="stat-value" style="color:${headlineColor};font-family:var(--font-mono);font-variant-numeric:tabular-nums;">${days}d</div>
          </div>
        </div>
        ${tjLine}
      </div>`;
  })();

  // Per-source FV card — pulls the latest snapshot point and lays out
  // each contributing source's grade so the reader can see whether
  // consensus is unanimous or split. Compact one-row-per-source list
  // with each FV in its tier color, dimmed when the source hasn't
  // updated recently.
  const perSourceSection = (() => {
    const latestPt = p.points && p.points.length
      ? p.points[p.points.length - 1] : null;
    if (!latestPt || !latestPt.per_source) return "";
    const entries = Object.entries(latestPt.per_source);
    if (!entries.length) return "";
    // Display order: highest FV first, then alphabetical for ties.
    entries.sort(([, av], [, bv]) => {
      const ax = av.fv_published ?? -1;
      const bx = bv.fv_published ?? -1;
      return bx - ax;
    });
    const sourceRows = entries.map(([src, info]) => {
      const fvNum = info.fv_published;
      const rank = info.rank;
      const lbl = SOURCE_LABELS[src] || src;
      const fvCell = fvNum != null
        ? `<span class="fv-badge ${fvClass(String(Math.round(fvNum)))}" style="font-size:10px;padding:1px 6px;">${Math.round(fvNum)}</span>`
        : `<span style="color:var(--text-tertiary);font-size:11px;">rank only</span>`;
      const rankCell = rank != null
        ? `<span style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-tertiary);font-size:10px;">#${rank}</span>`
        : "";
      return `<div style="display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--border-light);font-size:11.5px;">
        <span style="color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(lbl)}</span>
        ${rankCell}
        ${fvCell}
      </div>`;
    }).join("");
    return `<div class="detail-title" style="margin-top:18px;">Source consensus <span style="font-weight:400;font-size:11px;color:var(--text-tertiary);margin-left:6px;">latest grade per source</span></div>
      <div style="border:1px solid var(--border-light);background:var(--bg-secondary);padding:8px 12px;border-radius:var(--radius-sm);">
        ${sourceRows}
      </div>`;
  })();

  // MLB roster status block — debut date, 40-man membership, options
  // remaining, accumulated MLB seasons, and a service-phase bucket.
  // Driven by storage.derive_roster_status, which walks the per-player
  // transactions cache plus career_stats. Rendered for any player who
  // has at least one piece of MLB context (debut date, MLB games, or a
  // 40-man add) so prospects who have never sniffed the majors stay
  // unencumbered.
  const rosterStatusSection = (() => {
    const rs = p.roster_status || {};
    const hasMLB = rs.mlb_debut_date || (rs.mlb_seasons || []).length > 0
                    || rs.on_40_man || rs.options_used;
    if (!hasMLB) return "";
    const phaseLabel = {
      pre_arb:      "Pre-arbitration",
      arb_eligible: "Arbitration-eligible",
      post_arb:     "Post-arb / FA window",
      none:         "—",
    }[rs.service_phase] || "—";
    const phaseColor = {
      pre_arb:      "var(--neon-cyan)",
      arb_eligible: "var(--neon-amber)",
      post_arb:     "var(--neon-violet)",
    }[rs.service_phase] || "var(--text-tertiary)";
    const optionsTotal = 3;
    const used = Math.min(optionsTotal, rs.options_used || 0);
    const remaining = (rs.options_remaining != null)
      ? rs.options_remaining
      : Math.max(0, optionsTotal - used);
    // Visual: three pips, filled = used, hollow = remaining. Matches the
    // "options pill" pattern most baseball-front-office UIs use.
    const pip = filled => `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--neon-cyan);background:${filled ? "var(--neon-cyan)" : "transparent"};margin-right:3px;vertical-align:middle;"></span>`;
    const pips = Array.from({length: optionsTotal}, (_, i) => pip(i < used)).join("");
    const yearList = (rs.options_used_years || []).join(", ");
    const debutLine = rs.mlb_debut_date
      ? `<div style="font-size:12px;color:var(--text-secondary);">
            <span style="color:var(--text-tertiary);">MLB debut:</span>
            <span style="color:var(--text-primary);font-variant-numeric:tabular-nums;">${escapeHtml(rs.mlb_debut_date)}</span>
         </div>`
      : "";
    const rosterLine = rs.on_40_man
      ? `<div style="font-size:12px;color:var(--text-secondary);">
            <span style="color:var(--text-tertiary);">Roster:</span>
            <span style="color:var(--up);font-weight:600;">On 40-man</span>
         </div>`
      : (rs.mlb_debut_date
          ? `<div style="font-size:12px;color:var(--text-secondary);">
                <span style="color:var(--text-tertiary);">Roster:</span>
                <span style="color:var(--text-tertiary);">Off 40-man</span>
             </div>`
          : "");
    const seasonsLine = (rs.mlb_seasons || []).length
      ? `<div style="font-size:12px;color:var(--text-secondary);">
            <span style="color:var(--text-tertiary);">MLB seasons:</span>
            <span style="color:var(--text-primary);font-variant-numeric:tabular-nums;">${rs.mlb_seasons.length} (${rs.mlb_seasons[0]}–${rs.mlb_seasons[rs.mlb_seasons.length-1]})</span>
         </div>`
      : "";
    return `<div class="detail-title" style="margin-top:18px;">MLB roster status</div>
      <div style="border:1px solid var(--border-light);background:var(--bg-secondary);padding:10px 12px;border-radius:var(--radius-sm);display:flex;flex-direction:column;gap:6px;">
        ${debutLine}
        ${rosterLine}
        ${seasonsLine}
        <div style="font-size:12px;color:var(--text-secondary);">
          <span style="color:var(--text-tertiary);">Service phase:</span>
          <span style="color:${phaseColor};font-weight:600;">${phaseLabel}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;padding-top:6px;border-top:1px dashed var(--border-light);">
          <span style="font-size:11px;color:var(--text-tertiary);letter-spacing:0.04em;text-transform:uppercase;font-weight:600;">MiLB options</span>
          <span style="display:inline-flex;align-items:center;">${pips}</span>
          <span style="font-size:12px;color:var(--text-primary);font-variant-numeric:tabular-nums;">${remaining} of ${optionsTotal} left${yearList ? ` <span style="color:var(--text-tertiary);">· used ${escapeHtml(yearList)}</span>` : ""}</span>
        </div>
        ${rs.rookie_exhausted
          ? `<div style="font-size:11px;color:var(--text-tertiary);font-style:italic;">Rookie eligibility exhausted (${rs.career_mlb_ab > 0 ? rs.career_mlb_ab + " AB" : rs.career_mlb_ip + " IP"} career).</div>`
          : ""}
      </div>`;
  })();

  // Current-org acquisition. Renders ONLY when the player's current org
  // acquired them via something OTHER than their original draft/IFA path
  // (i.e. they've been moved between orgs at least once). Pairs with the
  // original-acquisition block above to give a complete provenance: where
  // they entered pro ball AND how their current org got them.
  const ACQUISITION_LABELS = {
    draft:             "MLB Draft",
    international_fa:  "International FA",
    trade:             "Trade",
    waiver:            "Waiver claim",
    rule_5:            "Rule 5",
    free_agent:        "Free-agent signing",
    contract_purchase: "Contract purchase",
    unknown:           "Unknown",
  };
  const currentAcqSection = (() => {
    const ca = p.current_acquisition;
    if (!ca) return "";
    const m = ca.method;
    // Skip when the current acquisition is just the original draft/IFA —
    // already rendered by the acqSection above. Also skip "unknown".
    if (m === "draft" || m === "international_fa" || m === "unknown") return "";
    const ev = ca.event || {};
    const label = ACQUISITION_LABELS[m] || m;
    const from = ev.from_org ? escapeHtml(ev.from_org) : "?";
    const to   = ev.to_org   ? escapeHtml(ev.to_org)   : "?";
    let dateLine = "";
    if (ev.date) {
      const d = new Date(ev.date + "T00:00:00");
      const fmt = isNaN(d.getTime())
        ? ev.date
        : d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
      dateLine = `<div style="font-size:11px;color:var(--text-tertiary);margin-top:2px;">${escapeHtml(fmt)}</div>`;
    }
    const desc = ev.description
      ? `<div style="font-size:11px;color:var(--text-secondary);margin-top:6px;line-height:1.4;">${escapeHtml(ev.description)}</div>`
      : "";
    return `<div class="detail-title" style="margin-top:18px;">Acquired by current org · ${escapeHtml(label)}</div>
      <div style="border:1px solid var(--border-light);background:var(--bg-secondary);padding:10px 12px;border-radius:2px;">
        <div style="font-size:14px;color:var(--text-primary);">From ${from} <span style="color:var(--neon-violet);">→</span> ${to}</div>
        ${dateLine}
        ${desc}
      </div>`;
  })();

  const etaRows = (() => {
    if (!eta || eta.year == null) return "";
    const r = [
      ["Level baseline", eta.base_years != null ? `${eta.base_years.toFixed(1)} yrs` : "—"],
      ["Performance",    eta.perf_adj > 0 ? `+${eta.perf_adj}` : eta.perf_adj < 0 ? `${eta.perf_adj}` : "±0"],
      ["Age vs. level",  eta.age_adj  > 0 ? `+${eta.age_adj}`  : eta.age_adj  < 0 ? `${eta.age_adj}`  : "±0"],
      ["FV grade",       eta.fv_adj   > 0 ? `+${eta.fv_adj}`   : eta.fv_adj   < 0 ? `${eta.fv_adj}`   : "±0"],
    ];
    return `<div class="detail-title" style="margin-top:18px;">ETA breakdown · ${eta.year}</div>
      <table class="detail-table"><tbody>${r.map(([k, v]) => `<tr><td>${k}</td><td style="text-align:right;">${v}</td></tr>`).join("")}</tbody></table>`;
  })();

  // Scouting flags — green/red rate-stat indicators sit directly under
  // the headline tiles so they're the first read after the player's FV.
  // Empty (no statline / sample too small) for late-call-ups, recent
  // promotions with <15 IP / <15 G, and any 2026 IFA who hasn't played
  // a competitive game yet; the function renders a neutral message in
  // those cases so the section never disappears unexpectedly.
  const flagsTitle = (p.stat_flags && p.stat_flags.length)
    ? `Scouting flags <span style="font-weight:400;font-size:11px;color:var(--text-tertiary);margin-left:6px;">${p.stat_flags.filter(f => f.direction === "green").length} green · ${p.stat_flags.filter(f => f.direction === "red").length} red · vs ${escapeHtml((p.statline || {}).level || "level")} ${(p.statline || {}).is_prior_season ? "(prior year)" : "average"}</span>`
    : `Scouting flags <span style="font-weight:400;font-size:11px;color:var(--text-tertiary);margin-left:6px;">no qualifying sample yet</span>`;
  const flagsSection = `<div class="detail-title" style="margin-top:8px;">${flagsTitle}</div>${makeStatFlagsBlock(p)}`;

  // Two-column layout: chart + career on the left, secondary blocks on the right.
  root.innerHTML = header + tilesHtml + flagsSection + `
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:24px;align-items:start;">
      <div>${chartSection}${careerSection}${levelBenchmarkSection}${sourceSection}</div>
      <div>${ilSection}${healthSection}${rosterStatusSection}${sabermetricsSection}${perSourceSection}${arsenalSection}${acqSection}${currentAcqSection}${tradesSection}${injurySection}${etaRows}</div>
    </div>`;
}

// ---------------------------------------------------------------------------
// FARM SYSTEM DETAIL PAGE
// ---------------------------------------------------------------------------

function renderFarmDetail(orgCode) {
  const org = findOrg(orgCode);
  const root = document.getElementById("farm-detail-body");
  if (!org) {
    root.innerHTML = `<div class="state-message">Unknown organization: ${escapeHtml(orgCode)}. <a href="#" onclick="goHome();return false;">Back to list</a>.</div>`;
    return;
  }

  // Resolve full player objects so we can render each roster line with its
  // FV trajectory chart inline. The acquisition, level, and position
  // filters all share state with the main prospect list so toggling
  // chips on the list page carries through when the user clicks into
  // a farm — same prospects, same lens.
  const rosterPlayersAll = (DATA.players || []).filter(p => p.org === orgCode);
  let rosterPlayers = rosterPlayersAll.slice();
  if (state.acqFilter !== "all") {
    rosterPlayers = rosterPlayers.filter(p =>
      ((p.current_acquisition || {}).method || "unknown") === state.acqFilter);
  }
  if (state.levelFilter !== "all") {
    rosterPlayers = rosterPlayers.filter(p =>
      (p.statline || {}).level === state.levelFilter);
  }
  if (state.posFilter !== "all") {
    rosterPlayers = rosterPlayers.filter(p =>
      positionBucket(p.position) === state.posFilter);
  }
  rosterPlayers.sort((a, b) => {
    const fa = a.points.length ? a.points[a.points.length - 1].consensus_fv_raw : 0;
    const fb = b.points.length ? b.points[b.points.length - 1].consensus_fv_raw : 0;
    return fb - fa;
  });

  const graduates = (DATA.graduates || []).filter(g => g.org === orgCode);

  // Build a unified list of every event involving this org — trades,
  // waiver claims, releases, DFAs, contract purchases, Rule 5 moves,
  // FA signings. Each event carries:
  //   { player, kind, date, from_org, to_org, description, graduate }
  // and we render the same list two ways below:
  //   (a) the sidebar shows the most recent few of each kind in
  //       compact per-kind cards;
  //   (b) the main column gets a full chronological "Farm-system
  //       transactions" section with kind-filter chips.
  //
  // Pulls from BOTH active prospects (rosterPlayersAll — pre-filter,
  // since we want all events for the org regardless of the user's
  // current acquisition/level/pos filter) and graduates / inactives.
  const allEventsForOrg = [];
  const seenEvent = new Set();
  // Don't restrict to the user-filtered roster — every prospect tied
  // to this org has events worth surfacing on the farm page, even when
  // a level / position filter is excluding them from the table above.
  const sources = [
    ...rosterPlayersAll.map(p => ({ p, graduate: false })),
    ...graduates.map(p => ({ p, graduate: true })),
    ...((DATA.inactive || []).filter(p => p.org === orgCode).map(p => ({ p, graduate: false }))),
  ];
  for (const { p, graduate } of sources) {
    for (const t of (p.trades || [])) {
      if (t.from_org !== orgCode && t.to_org !== orgCode) continue;
      const k = `${p.player_key}|trade|${t.trade_date}|${t.from_org}|${t.to_org}`;
      if (seenEvent.has(k)) continue;
      seenEvent.add(k);
      allEventsForOrg.push({
        player: p, graduate,
        kind: "trade",
        date: t.trade_date,
        from_org: t.from_org, to_org: t.to_org,
        description: t.description || "",
      });
    }
    for (const tx of (p.transactions || [])) {
      if (tx.from_org !== orgCode && tx.to_org !== orgCode) continue;
      const k = `${p.player_key}|${tx.kind}|${tx.date}|${tx.from_org}|${tx.to_org}`;
      if (seenEvent.has(k)) continue;
      seenEvent.add(k);
      allEventsForOrg.push({
        player: p, graduate,
        kind: tx.kind,
        date: tx.date,
        from_org: tx.from_org, to_org: tx.to_org,
        description: tx.description || "",
      });
    }
  }
  allEventsForOrg.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  // For backward compat with the sidebar trade-only render path below.
  const allTradesForOrg = allEventsForOrg.filter(e => e.kind === "trade")
    .map(e => ({ player: e.player, trade: { trade_date: e.date, from_org: e.from_org, to_org: e.to_org, description: e.description }, graduate: e.graduate }));

  // Group events by kind for the sidebar's "Recent transactions" cards
  // (top 5 per kind). Kinds are presented in roster-event order so a
  // reader scanning the sidebar can pick up the "what's changed lately"
  // story without having to parse a flat list.
  const eventsByKind = {};
  for (const ev of allEventsForOrg) {
    (eventsByKind[ev.kind] = eventsByKind[ev.kind] || []).push(ev);
  }

  const header = `
    <a href="#" onclick="event.preventDefault();goHome();" class="back-link">← Back to list</a>
    <div class="detail-page-header" style="${orgStripe(org.org)}">
      <div style="display:flex;align-items:center;gap:16px;">
        ${teamLogoHTML(org.org, "xl", fullOrgName(org.org))}
        <div>
          <div class="player-display-name">${escapeHtml(fullOrgName(org.org))}</div>
          <div class="player-display-meta">
            <span style="font-family:var(--font-mono);color:var(--text-tertiary);letter-spacing:0.08em;margin-right:8px;font-weight:600;">${escapeHtml(org.org)}</span>
            Farm rank <strong style="font-family:var(--font-mono);color:var(--text-primary);" title="45% top-end talent · 25% depth · 15% trajectory · 15% graduation pipeline (each rescaled 0-100 across the 30 orgs)">#${org.farm_rank}</strong> of 30 · ${org.count} prospects tracked · Total FV <strong style="font-family:var(--font-mono);color:var(--text-primary);">${org.total_fv != null ? org.total_fv.toFixed(1) : "—"}</strong>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">${makeTierBar(org.prospects)}</div>
    </div>
    ${makeFarmReportCard(org)}`;

  // Per-tier counts live in the tier-bar in the header; tiles cover the
  // remaining at-a-glance facts (age, stock direction, young-for-level)
  // that aren't visible elsewhere on this page. Position mix moved to
  // the sidebar where it sits next to the FV/acquisition/ETA charts.
  const stockHtml = (org.stock_up || org.stock_down)
    ? `${org.stock_up  ? `<span class="stock-up">▲${org.stock_up}</span>` : ''}${org.stock_up && org.stock_down ? ' · ' : ''}${org.stock_down ? `<span class="stock-down">▼${org.stock_down}</span>` : ''}`
    : `<span style="color:var(--text-tertiary);">—</span>`;
  const tilesHtml = `<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px;">
    <div class="stat-tile">
      <div class="stat-label">Avg age</div>
      <div class="stat-value">${org.avg_age != null ? org.avg_age.toFixed(1) : "—"}</div>
    </div>
    <div class="stat-tile">
      <div class="stat-label">Stock (last update)</div>
      <div class="stat-value" style="font-size:18px;">${stockHtml}</div>
    </div>
    <div class="stat-tile">
      <div class="stat-label">Young-for-level</div>
      <div class="stat-value">${org.very_young_count}</div>
    </div>
  </div>`;

  // Compact stat line for a roster row: slash + counting for hitters,
  // ERA + peripherals for pitchers. One line, monospace, dimmed; the
  // full season detail still lives on the prospect page.
  const rosterStatLine = (p) => {
    const sl = p.statline;
    if (!sl) return `<span style="color:var(--text-tertiary);">no stats yet</span>`;
    const isP = sl.is_pitcher;
    const levelPill = `<span class="level-pill level-neutral" style="margin-right:4px;">${escapeHtml(sl.level || "?")}</span>`;
    const slash = isP
      ? `${sl.era ?? "—"} ERA · ${sl.whip != null ? sl.whip + " WHIP · " : ""}${sl.k_per_9 != null ? sl.k_per_9.toFixed(1) + " K/9 · " : ""}${sl.bb_per_9 != null ? sl.bb_per_9.toFixed(1) + " BB/9 · " : ""}${sl.ip ?? "—"} IP`
      : `${sl.avg ?? "—"}/${sl.obp ?? "—"}/${sl.slg ?? "—"} · ${sl.hr ?? 0} HR${sl.sb ? ' · ' + sl.sb + ' SB' : ''}${sl.bb_pct != null ? ' · ' + sl.bb_pct.toFixed(0) + '% BB' : ''}${sl.k_pct != null ? ' · ' + sl.k_pct.toFixed(0) + '% K' : ''}`;
    const prior = sl.is_prior_season && sl.season
      ? `<span class="prior-season-tag" title="No ${new Date().getFullYear()} stats yet — showing ${sl.season}">${sl.season}</span>`
      : "";
    return `${levelPill}${prior}<span style="color:var(--text-primary);font-family:var(--font-mono);font-size:11px;">${slash}</span>`;
  };

  // Full roster with mini FV charts + an inline current-season stat
  // line under each player's name. Column proportions widened slightly
  // on the Player cell since the stat row needs the horizontal room.
  const rosterRows = rosterPlayers.map((p, i) => {
    const latest = p.points[p.points.length - 1];
    const chart = p.points.length >= 2
      ? makeLineChart(p.points, p.fv_open, p.fv_close, p.graduation_date, p.trades, p)
      : `<span style="color:var(--text-tertiary);font-size:11px;">—</span>`;
    return `
      <div class="player-row" style="grid-template-columns:32px 1.6fr 0.45fr 0.45fr 1.1fr 0.6fr;${orgStripe(p.org)}" onclick="goToPlayer('${escapeHtml(p.player_key)}');">
        <div class="rank-num">${i + 1}</div>
        <div style="display:flex;align-items:center;gap:10px;min-width:0;">
          ${headshotHTML(p, 56)}
          <div style="min-width:0;flex:1;">
            <div class="player-name">${escapeHtml(p.player_name)}</div>
            <div class="player-meta">${escapeHtml(p.position ?? "—")}${p.age != null ? `<span class="age-tag">age ${p.age.toFixed(1)}</span>` : ""}${ilTagHTML(p)}${rosterTagHTML(p)}</div>
            <div class="player-stat-line" style="margin-top:3px;font-size:11px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">${rosterStatLine(p)}</div>
          </div>
        </div>
        <div style="text-align:center;"><span class="fv-badge ${fvClass(latest.consensus_fv_label)}">${latest.consensus_fv_label}</span></div>
        <div class="rank-cell">${latest.avg_rank != null ? latest.avg_rank.toFixed(1) : "—"}</div>
        <div class="line-chart-cell">${chart}</div>
        <div class="candle-cell">${makeCandle(p)}</div>
      </div>`;
  }).join("");

  const rosterHeader = `<div class="col-header" style="grid-template-columns:32px 1.6fr 0.45fr 0.45fr 1.1fr 0.6fr;">
    <span style="text-align:center;">#</span>
    <span>Player · current stats</span>
    <span style="text-align:center;">FV</span>
    <span style="text-align:center;">Rank</span>
    <span style="text-align:center;">FV history</span>
    <span style="text-align:center;">Candle</span>
  </div>`;

  // Stats leaderboards — top current-season hitters (by OPS, min 80 PA) and
  // pitchers (by ERA, min 10 IP) among the org's tracked prospects.
  const PITCHER_RE = /^(RHP|LHP|SP|RP|MIRP|SIRP)/;
  const topHitters = rosterPlayers
    .filter(rp => rp.statline && rp.statline.is_pitcher === false && rp.statline.ops)
    .map(rp => ({
      p: rp,
      sl: rp.statline,
      ops: parseFloat(rp.statline.ops) || 0,
    }))
    .filter(x => x.ops > 0 && (x.sl.games || 0) >= 10)
    .sort((a, b) => b.ops - a.ops)
    .slice(0, 5);
  const topPitchers = rosterPlayers
    .filter(rp => rp.statline && rp.statline.is_pitcher === true && rp.statline.era)
    .map(rp => ({
      p: rp,
      sl: rp.statline,
      era: parseFloat(rp.statline.era) || 99,
      ip: parseFloat(rp.statline.ip) || 0,
    }))
    .filter(x => x.ip >= 10 && x.era < 99)
    .sort((a, b) => a.era - b.era)
    .slice(0, 5);

  const leaderboardRows = (rows, statLabel, statFn) => rows.map(({ p, sl }) => `
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:3px 0;border-bottom:1px solid var(--border-light);font-size:12px;cursor:pointer;" onclick="goToPlayer('${escapeHtml(p.player_key)}');">
      <span style="color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(p.player_name)} <span style="color:var(--text-tertiary);font-size:10px;">${escapeHtml(sl.level || "?")}</span></span>
      <span style="color:var(--neon-cyan);font-variant-numeric:tabular-nums;white-space:nowrap;">${statFn(sl)}</span>
    </div>`).join("");

  const hittersBlock = topHitters.length
    ? leaderboardRows(topHitters, "OPS", sl => `${sl.ops} · ${sl.hr ?? 0} HR`)
    : `<span style="color:var(--text-tertiary);font-size:12px;">No qualifying hitters yet.</span>`;
  const pitchersBlock = topPitchers.length
    ? leaderboardRows(topPitchers, "ERA", sl => `${sl.era} · ${(sl.ip ?? 0).toFixed ? sl.ip.toFixed(1) : sl.ip} IP`)
    : `<span style="color:var(--text-tertiary);font-size:12px;">No qualifying pitchers yet.</span>`;

  // Compact side-card sections — each lives in its own card so the
  // sticky sidebar reads as a stack of focused widgets rather than one
  // long undifferentiated column. Order is by user attention priority:
  // top prospect first (most clicked), distribution charts next (always
  // visible while scrolling), leaderboards + grads + trades at the end.
  const tp = org.top_prospect;
  const yp = org.youngest;
  // Look up the full player objects (rosterPlayersAll, not the filtered
  // rosterPlayers) so the headshot resolves regardless of active
  // chip-filter state. Top prospect = highest-FV row in the org's
  // tracked set; youngest = the org_summary's pre-resolved pointer.
  const tpPlayer = rosterPlayersAll.find(rp => rp.player_name === (tp && tp.name)) || rosterPlayersAll[0];
  const ypPlayer = yp ? rosterPlayersAll.find(rp => rp.player_name === yp.name) : null;
  const topProspectCard = `<div class="farm-side-card">
    <div class="side-title">Top prospect</div>
    ${tp ? `<div style="display:flex;align-items:center;gap:10px;cursor:pointer;" onclick="goToPlayer('${escapeHtml((tpPlayer || {}).player_key || '')}');">
      ${headshotHTML(tpPlayer || {}, 64)}
      <div style="min-width:0;">
        <div style="font-size:14px;font-weight:600;color:var(--neon-cyan);">${escapeHtml(tp.name)} <span class="fv-badge ${fvClass(tp.fv_label)}" style="font-size:11px;padding:1px 6px;">${tp.fv_label}</span></div>
        <div style="font-size:11px;color:var(--text-secondary);margin-top:2px;">${escapeHtml(tp.pos||'')} · age ${tp.age != null ? tp.age.toFixed(1) : "—"}</div>
      </div>
    </div>` : '—'}
  </div>`;
  const youngestCard = `<div class="farm-side-card">
    <div class="side-title">Youngest</div>
    ${yp ? `<div style="display:flex;align-items:center;gap:10px;${ypPlayer ? 'cursor:pointer;' : ''}" ${ypPlayer ? `onclick="goToPlayer('${escapeHtml(ypPlayer.player_key)}');"` : ''}>
      ${headshotHTML(ypPlayer || {}, 64)}
      <div style="min-width:0;">
        <div style="font-size:14px;font-weight:600;${ypPlayer ? 'color:var(--neon-cyan);' : ''}">${escapeHtml(yp.name)}</div>
        <div style="font-size:11px;color:var(--text-secondary);margin-top:2px;">${escapeHtml(yp.pos||'')} · age ${yp.age != null ? yp.age.toFixed(1) : "—"} · FV ${yp.fv_label}</div>
      </div>
    </div>` : '—'}
  </div>`;
  const fvDistCard = `<div class="farm-side-card">
    <div class="side-title">FV distribution <span class="side-count">${(org.prospects || []).length} graded</span></div>
    ${makeFvHistogram(org.prospects)}
  </div>`;
  const acqMixCard = `<div class="farm-side-card">
    <div class="side-title">Acquired via <span class="side-count">${rosterPlayersAll.length} tracked</span></div>
    ${makeAcqMixBar(rosterPlayersAll)}
  </div>`;
  const etaCard = `<div class="farm-side-card">
    <div class="side-title">ETA distribution</div>
    ${makeEtaTimeline(rosterPlayersAll)}
  </div>`;
  const hittersCard = `<div class="farm-side-card">
    <div class="side-title">Top hitters · season</div>
    ${hittersBlock}
  </div>`;
  const pitchersCard = `<div class="farm-side-card">
    <div class="side-title">Top pitchers · season</div>
    ${pitchersBlock}
  </div>`;

  // Compact transaction list for the sidebar — one row per event with
  // a colored chip in front denoting the kind (trade / waiver claim /
  // release / DFA / etc.) and a +/→ arrow that flips for in vs. out
  // moves. The full chronological history lives in the main column;
  // this is a "top 12 most recent" snapshot keyed off the same data.
  const compactEventRow = (ev) => {
    const inbound = ev.to_org === orgCode;
    const arrow = inbound
      ? `<span style="color:var(--up);font-weight:700;">+</span>`
      : `<span style="color:var(--down);font-weight:700;">→</span>`;
    const other = inbound ? ev.from_org : ev.to_org;
    const gradTag = ev.graduate
      ? `<span style="font-size:9px;color:var(--text-tertiary);margin-left:4px;letter-spacing:0.04em;">GRAD</span>`
      : "";
    const cfg = TRANSACTION_KINDS[ev.kind] || {};
    const chip = `<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${cfg.color || 'var(--text-tertiary)'};margin-right:6px;vertical-align:middle;" title="${escapeHtml(cfg.label || ev.kind)}"></span>`;
    return `<div style="display:grid;grid-template-columns:36px 1fr auto;gap:6px;align-items:baseline;padding:3px 0;border-bottom:1px solid var(--border-light);font-size:11.5px;cursor:pointer;" onclick="goToPlayer('${escapeHtml(ev.player.player_key)}');">
      <span style="font-family:var(--font-mono);color:var(--text-tertiary);font-size:10px;white-space:nowrap;">${ev.date ? ev.date.slice(2) : '—'}</span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${chip}<span style="color:var(--neon-cyan);">${escapeHtml(ev.player.player_name)}</span>${gradTag}</span>
      <span style="font-family:var(--font-mono);font-size:10px;white-space:nowrap;">${arrow} ${escapeHtml(other || "?")}</span>
    </div>`;
  };

  // Per-kind sidebar sections. Each renders the most recent few events
  // of that kind so the eye can scan by category without one section
  // crowding the others out. Skipped (omitted from the sidebar) when
  // the org has zero of that kind so we don't show empty cards.
  const sideEventSections = [
