    .spending-totals .st-cell.st-draft { border-left: 3px solid var(--spend-draft); }
    .spending-totals .st-label {
      font-size: 9px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-tertiary);
    }
    .spending-totals .st-value {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 700;
      margin-top: 2px;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }
    .spending-totals .st-sub {
      font-size: 10.5px;
      color: var(--text-secondary);
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }
    .spending-totals .st-pool {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed var(--border-light);
      cursor: help;
    }

    /* === Scouting flags ============================================ */
    /* Green/red chips on the prospect-detail page that surface stats
       clearly above or below MLB-projectable thresholds at the player's
       current level. The two columns are visually distinct (green
       background tint + up arrow vs. red tint + down arrow) so the
       reader picks up direction from peripheral vision before reading
       a single value. */
    .flag-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }
    @media (max-width: 640px) {
      .flag-grid { grid-template-columns: 1fr; }
    }
    .flag-col {
      border: 1px solid var(--border-light);
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }
    .flag-col.flag-col-green { border-left: 3px solid var(--up); }
    .flag-col.flag-col-red   { border-left: 3px solid var(--down); }
    .flag-col-title {
      font-family: var(--font-sans);
      font-size: 10px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex; align-items: baseline; justify-content: space-between;
    }
    .flag-col-green .flag-col-title { color: var(--up); }
    .flag-col-red   .flag-col-title { color: var(--down); }
    .flag-col-count {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-tertiary);
      font-weight: 500;
      letter-spacing: 0;
    }
    .flag-row {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-light);
      font-size: 12.5px;
    }
    .flag-row:last-child { border-bottom: 0; }
    .flag-arrow {
      font-family: var(--font-mono);
      font-size: 13px;
      text-align: center;
      font-weight: 700;
    }
    .flag-col-green .flag-arrow { color: var(--up); }
    .flag-col-red   .flag-arrow { color: var(--down); }
    .flag-body {
      display: flex; flex-direction: column; min-width: 0;
    }
    .flag-body .flag-stat {
      font-family: var(--font-sans);
      font-weight: 700;
      color: var(--text-primary);
      font-size: 12px;
      letter-spacing: 0.02em;
    }
    .flag-body .flag-note {
      font-size: 10.5px;
      color: var(--text-secondary);
      line-height: 1.35;
      margin-top: 1px;
    }
    .flag-numbers {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      color: var(--text-primary);
      text-align: right;
      white-space: nowrap;
    }
    .flag-numbers .flag-delta { display: block; font-size: 10px; color: var(--text-tertiary); margin-top: 1px; }
    .flag-col-green .flag-numbers .flag-delta { color: var(--up); }
    .flag-col-red   .flag-numbers .flag-delta { color: var(--down); }
    .flag-empty {
      font-size: 11px;
      color: var(--text-tertiary);
      font-style: italic;
      padding: 4px 0;
    }

    /* === Farm detail layout ======================================= */
    /* Two-column on standard widths, three-column with a left rail on
       ultrawide. The right sidebar stays sticky so it remains useful
       while the user scrolls the long roster. */
    .farm-detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.9fr) minmax(260px, 1fr);
      gap: 22px;
      align-items: start;
    }
    @media (min-width: 1500px) {
      .farm-detail-grid {
        grid-template-columns: minmax(240px, 0.85fr) minmax(0, 1.9fr) minmax(260px, 1fr);
      }
    }
    @media (max-width: 1023px) {
      .farm-detail-grid {
        grid-template-columns: 1fr;
      }
    }
    .farm-side {
      position: sticky;
      top: 12px;
      align-self: start;
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      padding-right: 4px;
      /* Hide scrollbar visually but keep it functional */
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .farm-side::-webkit-scrollbar { width: 6px; }
    .farm-side::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    @media (max-width: 1023px) {
      .farm-side { position: static; max-height: none; overflow: visible; }
    }
    /* Optional left rail — surfaces secondary at-a-glance breakdowns
       (position mix, level depth, stock balance) on ultrawide displays
       where the right sidebar alone leaves usable horizontal space. */
    .farm-left-rail { display: none; }
    @media (min-width: 1500px) {
      .farm-left-rail { display: block; }
    }
    .farm-side-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-card);
    }
    /* Sticky filter strip directly above the roster table — keeps the
       acq / level / pos chips reachable during long roster scrolls.
       The wrapper bundles the three filter bars into one sticky block
       so scrolling doesn't expose half of them at a time. */
    .farm-roster-filters {
      position: sticky;
      top: var(--sticky-top, 60px);
      z-index: 4;
      background: var(--bg-primary);
      padding: 6px 0;
      margin: 0 0 6px;
    }
    /* Level × position depth heatmap — sidebar widget. Cells shaded by
       FV-weighted prospect count; hover for breakdown. */
    .farm-depth-heatmap {
      display: grid;
      grid-template-columns: 32px repeat(5, 1fr);
      gap: 3px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-variant-numeric: tabular-nums;
    }
    .farm-depth-heatmap .heatmap-cell {
      display: flex; align-items: center; justify-content: center;
      height: 22px;
      border-radius: 2px;
      cursor: help;
      color: var(--text-primary);
    }
    .farm-depth-heatmap .heatmap-cell.empty {
      background: var(--bg-tertiary);
      color: var(--text-tertiary);
      opacity: 0.4;
    }
    .farm-depth-heatmap .heatmap-label {
      font-size: 9px;
      color: var(--text-tertiary);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex; align-items: center; justify-content: center;
    }
    .farm-side-card .side-title {
      font-family: var(--font-sans);
      font-size: 10px;
      color: var(--text-tertiary);
      letter-spacing: 0.10em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .farm-side-card .side-title .side-count {
      color: var(--text-tertiary);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0;
      font-weight: 500;
    }

    /* Compact 4-component report card strip (used under the big overall
       grade). Each cell is letter + label + rank, side-by-side. */
    .report-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-top: 8px;
    }
    .report-strip-cell {
      display: flex; flex-direction: column;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-primary);
    }
    .report-strip-cell .rs-letter {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
    }
    .report-strip-cell .rs-label {
      font-family: var(--font-sans);
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      font-weight: 600;
      margin-top: 4px;
    }
    .report-strip-cell .rs-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 1px;
      font-variant-numeric: tabular-nums;
    }

    /* FV distribution mini-histogram (sidebar). Vertical bars colored
       by FV tier with counts on hover. */
    .fv-histogram {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 56px;
      padding: 4px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .fv-histogram .fvh-bar {
      flex: 1;
      min-width: 12px;
      background: var(--bg-tertiary);
      border-radius: 2px 2px 0 0;
      position: relative;
      transition: opacity 0.12s;
    }
    .fv-histogram .fvh-bar:hover { opacity: 0.7; }
    .fv-histogram .fvh-bar .fvh-count {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-tertiary);
    }
    .fv-histogram-labels {
      display: flex;
      gap: 3px;
      margin-top: 2px;
    }
    .fv-histogram-labels span {
      flex: 1;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-tertiary);
    }

    /* Acquisition mix horizontal stacked bar */
    .acq-mix-bar {
      display: flex;
      width: 100%;
      height: 10px;
      border-radius: 2px;
      overflow: hidden;
      margin: 6px 0 8px;
      background: var(--bg-tertiary);
    }
    .acq-mix-bar > div { height: 100%; }
    .acq-mix-legend {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px 8px;
      font-size: 11px;
    }
    .acq-mix-legend .acq-row {
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
      padding: 2px 0;
    }
    .acq-mix-legend .acq-row .acq-sw {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .acq-mix-legend .acq-row .acq-label {
      color: var(--text-primary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .acq-mix-legend .acq-row .acq-count {
      color: var(--text-tertiary);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* ETA distribution mini-timeline */
    .eta-timeline {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 48px;
      padding: 4px 0;
    }
    .eta-timeline .eta-bar {
      flex: 1;
      min-width: 10px;
      background: var(--neon-cyan);
      opacity: 0.7;
      border-radius: 2px 2px 0 0;
      position: relative;
    }
    .eta-timeline .eta-bar.empty { background: var(--bg-tertiary); opacity: 1; }
    .eta-timeline-labels {
      display: flex;
      gap: 4px;
      margin-top: 2px;
    }
    .eta-timeline-labels span {
      flex: 1;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-tertiary);
    }

    /* Detail-page header (player + farm). Uses a paper-card with the
       team-color accent stripe on the left so it reads as a baseball card. */
    .detail-page-header {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      padding: 16px 18px 16px 22px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
    }
    .detail-page-header::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 6px;
      background: var(--org-color, var(--bg-header));
      border-top-left-radius: var(--radius-md);
      border-bottom-left-radius: var(--radius-md);
    }
    /* FV-tier driven radial-gradient overlay on the detail-page header.
       Driven by the .fv-tier-* modifier set on the header div by the
       renderer. Capped at 10% opacity so text stays readable. */
    .detail-page-header::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 18% 30%,
        var(--fv-tier-glow, transparent) 0%, transparent 65%);
      opacity: 0.10;
      border-radius: var(--radius-md);
      z-index: 0;
    }
    .detail-page-header > * { position: relative; z-index: 1; }
    .detail-page-header.fv-tier-80 { --fv-tier-glow: var(--fv-80); }
    .detail-page-header.fv-tier-70 { --fv-tier-glow: var(--fv-70); }
    .detail-page-header.fv-tier-65 { --fv-tier-glow: var(--fv-65); }
    .detail-page-header.fv-tier-60 { --fv-tier-glow: var(--fv-60); }
    .detail-page-header.fv-tier-55 { --fv-tier-glow: var(--fv-55); }
    .detail-page-header.fv-tier-50 { --fv-tier-glow: var(--fv-50); }
    .detail-page-header.fv-tier-45 { --fv-tier-glow: var(--fv-45); }
    .detail-page-header.fv-tier-40 { --fv-tier-glow: var(--fv-40); }
    /* Headshot framing — opt-in wrapper around the standard img.
       Adds a team-color top border + subtle inner shadow for the
       trading-card aesthetic on player detail. */
    .headshot-frame {
      display: inline-block;
      position: relative;
      border-top: 4px solid var(--org-color, var(--neon-cyan));
      background: var(--bg-secondary);
      border-radius: 2px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05),
        0 2px 6px rgba(0,0,0,0.25);
      padding: 2px;
      overflow: hidden;
    }
    .headshot-frame img { display: block; max-width: 100%; height: auto; }
    /* FV-rarity modifier — applied to .detail-card.card-rarity-* to
       give elite-tier cards a chrome/holo border treatment. CSS-only,
       no images. */
    .card-rarity-chrome {
      border: 2px solid transparent;
      background:
        linear-gradient(var(--bg-secondary), var(--bg-secondary)) padding-box,
        linear-gradient(135deg,
          rgba(220,220,235,0.85) 0%,
          rgba(160,170,200,0.45) 35%,
          rgba(255,255,255,0.85) 50%,
          rgba(160,170,200,0.45) 65%,
          rgba(220,220,235,0.85) 100%) border-box;
      animation: chrome-shimmer 4.2s linear infinite;
      background-size: 100% 100%, 300% 300%;
    }
    @keyframes chrome-shimmer {
      from { background-position: 0% 0%, 0% 0%; }
      to   { background-position: 0% 0%, 300% 0%; }
    }
    .card-rarity-holo {
      border: 2px solid transparent;
      background:
        linear-gradient(var(--bg-secondary), var(--bg-secondary)) padding-box,
        linear-gradient(135deg,
          #4ee0ff 0%, #b455ff 25%,
          #ff5fa2 50%, #ffd45a 75%, #4ee0ff 100%) border-box;
      background-size: 100% 100%, 300% 300%;
      animation: holo-shift 6s linear infinite;
    }
    @keyframes holo-shift {
      from { background-position: 0% 0%, 0% 0%; }
      to   { background-position: 0% 0%, 300% 100%; }
    }
    /* Hover-flip on the sidebar position-depth micro-cards. Pure CSS
       3D flip; back face shows the secondary chip set (ETA, health). */
    .pos-depth-card-3d {
      perspective: 600px;
      cursor: pointer;
    }
    .pos-depth-card-3d .pdc-inner {
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
      width: 100%;
      min-height: 56px;
    }
    .pos-depth-card-3d:hover .pdc-inner { transform: rotateY(180deg); }
    .pos-depth-card-3d .pdc-front,
    .pos-depth-card-3d .pdc-back {
      position: absolute; inset: 0;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    .pos-depth-card-3d .pdc-back {
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      padding: 6px 8px;
    }
    .detail-page-header .player-display-name {
      font-family: var(--font-serif);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      line-height: 1.05;
    }
    .detail-page-header .player-display-meta {
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 6px;
    }
    .back-link {
      display: inline-block;
      font-family: var(--font-sans);
      font-size: 12px;
      color: var(--neon-cyan);
      text-decoration: none;
      margin-bottom: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .back-link:hover { text-decoration: underline; }

    /* === Responsive =============================================== */
    @media (max-width: 900px) {
      h1 { font-size: 1.7rem; }
      .container { padding: 1rem 0.85rem 3rem; }
      .col-header, .player-row {
        grid-template-columns: 28px 1fr 0.4fr 0.7fr;
      }
      .player-row .line-chart-cell,
      .player-row .candle-cell,
      .player-row .milb-cell-wrap,
      .player-row .eta-cell,
      .col-header .desktop-only { display: none; }
      /* Row variants collapse to a name + key-stat layout on mobile so
         the wide desktop grids don't squish columns into illegibility. */
      .col-header.is-injured, .player-row.is-injured {
        grid-template-columns: 28px 1.4fr 0.5fr 0.45fr;
      }
      .col-header.is-injured > span:nth-child(n+5),
      .player-row.is-injured > div:nth-child(n+5) { display: none; }
      .col-header.is-traded, .player-row.is-traded {
        grid-template-columns: 28px 1fr 0.5fr 0.5fr;
      }
      .col-header.is-traded > span:nth-child(n+5),
      .player-row.is-traded > div:nth-child(n+5) { display: none; }
      .col-header.is-farm-roster, .player-row.is-farm-roster {
        grid-template-columns: 28px 1fr 0.45fr 0.5fr;
      }
      .col-header.is-farm-roster > span:nth-child(n+5),
      .player-row.is-farm-roster > div:nth-child(n+5) { display: none; }
      .col-header.is-leaderboard, .player-row.is-leaderboard {
        grid-template-columns: 28px 1.4fr 0.6fr 0.7fr;
      }
      .col-header.is-leaderboard > span:nth-child(n+5),
      .player-row.is-leaderboard > div:nth-child(n+5) { display: none; }
      .grad-header, .grad-row {
        grid-template-columns: 28px 1.2fr 0.5fr 1fr;
      }
      .grad-header .desktop-only, .grad-row .grad-graduation-cell,
      .grad-row .grad-level-cell { display: none; }
      .spotlight-header, .spotlight-row {
        grid-template-columns: 28px 1fr 0.45fr;
      }
      .spotlight-header span:nth-child(n+4),
      .spotlight-row > div:nth-child(n+4) { display: none; }
      /* Farm list (mobile) — keep the three-up hero (#, logo, org,
         grade, DvM+) plus top prospect + compare button. Drop the
         sparkline + secondary cells (positions / level depth / age /
         spend / stock). */
      .farm-header, .farm-row {
        grid-template-columns: 28px 32px 1fr 56px 60px 1fr 56px;
      }
      /* Hide sparkline (col 6), positions (8), level (9), age (10),
         spend (11), stock (12). Top prospect (7) takes col 6 of the
         mobile grid via re-positioning. */
      .farm-header > span:nth-child(6),
      .farm-header > span:nth-child(n+8):not(:last-child),
      .farm-row > div:nth-child(6),
      .farm-row > div:nth-child(n+8):not(:last-child) { display: none; }
      .detail-page-header .player-display-name { font-size: 22px; }
      .detail-page-header { gap: 10px; padding: 12px 14px 12px 18px; margin-bottom: 12px; }
      .detail-page-header .player-display-meta { font-size: 12px; margin-top: 4px; }
      .section-tabs { flex-wrap: wrap; }
      /* Chip filter bars stay on one line at narrow viewports; the
         wrapping behavior produced 2- or 3-row stacks at tablet widths
         which read as cramped. Horizontal scroll is cleaner. */
      .filter-bar { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .filter-bar > .filter-group { flex-shrink: 0; }
    }
    /* === Active list + context rail =================================
       At very wide viewports (≥1500px) a 240px right rail surfaces
       league context (top movers, FV distribution, recent grads) so
       the user has comparative anchors while scanning the main list.
       Below 1500px the rail collapses entirely — the main grid takes
       the full container width back. */
    .active-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      align-items: start;
    }
    .active-context-rail { display: none; }
    .active-context-rail .ctx-card {
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-card);
    }
    .active-context-rail .ctx-title {
      font-family: var(--font-sans);
      font-size: 10px;
      color: var(--text-tertiary);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .active-context-rail .ctx-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 6px;
      padding: 3px 0;
      border-bottom: 1px solid var(--border-light);
      font-size: 12px;
      cursor: pointer;
    }
    .active-context-rail .ctx-row:last-child { border-bottom: 0; }
    @media (min-width: 1500px) {
      .active-grid { grid-template-columns: minmax(0, 1fr) 240px; }
      .active-context-rail { display: block; position: sticky; top: 12px; }
    }

    /* === Player detail layout =====================================
       Two-column grid (2:1) on wide viewports. Right column collapses
       to inline below the main content under 900px so mobile keeps the
       context blocks accessible without forcing them off-screen. */
    .player-detail-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
      align-items: start;
    }
    .player-detail-side {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    /* Wrapped sections (those passed through the wrap() helper for
       jump-link anchors) inherit the gap; cards inside the sidebar
       don't add extra top margin so the gap is the only rhythm
       authority. */
    .player-detail-side > * { margin-top: 0; }
    .player-detail-side > div > .detail-title:first-child { margin-top: 0; }
    @media (max-width: 900px) {
      .player-detail-grid { grid-template-columns: 1fr; gap: 16px; }
    }
    /* Wide-card grid below the chart + career table. Holds the cards
       that benefit from more horizontal width than the narrow sidebar
       offers — Tools / Savant / Arsenal / Contract details / More
       details. Single-column on mid-width viewports, 2-col at ≥1200px. */
    .detail-wide-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 18px;
    }
    .detail-wide-grid > * { margin-top: 0; }
    @media (min-width: 1200px) {
      .detail-wide-grid {
        grid-template-columns: 1fr 1fr;
      }
      /* The More-details accordion spans both columns for legibility. */
      .detail-wide-grid > .player-detail-more {
        grid-column: 1 / -1;
      }
    }

    /* === Position depth chart ====================================== */
    /* Per-org depth chart: 6 columns (C / 1B / MI / 3B / OF / P) so each
       column has enough room for a full last name + age + level + FV.
       Cards inside a column are sorted FV desc; tier dividers separate
       the 50+, 40-tier, and sub-40 groups so a reader can pick up the
       prospect "spine" at a glance. */
    /* Row-per-position layout — the depth chart reads left-to-right
       within each position (top prospects first). One row per position
       instead of the previous 10-column grid that produced very tall
       columns and hid scout-relevant signals. By default we show the
       top 5 cards per row; an inline "show all (N)" chip reveals the
       overflow when the user wants the full depth. */
    .pos-depth-grid {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      column-gap: 12px;
      row-gap: 6px;
      margin-top: 8px;
    }
    .pos-depth-row-label {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      align-self: center;
      text-align: right;
      padding-right: 4px;
      border-right: 1px solid var(--border-light);
    }
    .pos-depth-row-label .pos-count {
      display: block;
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 400;
      color: var(--text-tertiary);
      letter-spacing: 0;
      text-transform: none;
      margin-top: 1px;
    }
    .pos-depth-row-prospects {
      display: flex; flex-wrap: wrap; gap: 6px;
      min-width: 0;
      align-items: center;
    }
    .pos-depth-row-prospects > .pos-depth-card.is-overflow { display: none; }
    .pos-depth-row.is-expanded .pos-depth-row-prospects > .pos-depth-card.is-overflow {
      display: inline-flex;
    }
    .pos-depth-row-expand {
      align-self: center;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-tertiary);
      background: transparent;
      border: 1px solid var(--border-light);
      border-radius: 999px;
      padding: 2px 8px;
      cursor: pointer;
      white-space: nowrap;
    }
    .pos-depth-row-expand:hover { color: var(--text-primary); border-color: var(--border); }
    .pos-depth-row.is-expanded .pos-depth-row-expand { color: var(--neon-cyan); border-color: var(--neon-cyan); }
    .pos-depth-row.is-empty .pos-depth-row-prospects {
      color: var(--text-tertiary); font-size: 11px; font-style: italic;
    }
    .pos-depth-card {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-left: 3px solid var(--org-color, var(--bg-header));
      border-radius: 3px;
      font-family: var(--font-sans);
      font-size: 11px;
      line-height: 1.2;
      cursor: pointer;
      white-space: nowrap;
      max-width: 100%;
    }
    .pos-depth-card:hover { background: var(--bg-primary); }
    .pos-depth-card .pdc-name {
      font-weight: 600; color: var(--text-primary);
      max-width: 110px;
      overflow: hidden; text-overflow: ellipsis;
    }
    .pos-depth-card .pdc-fv { flex-shrink: 0; }
    .pos-depth-card .pdc-sub {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-tertiary);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }
    .pos-depth-card .pdc-pos {
      color: var(--neon-cyan);
      font-weight: 600;
    }
    .pos-depth-card .pdc-eta {
      font-family: var(--font-mono);
      font-weight: 600;
    }
    .pos-depth-card .pdc-icons {
      display: inline-flex; align-items: center; gap: 3px;
      margin-left: 2px;
    }
    .pos-depth-card .pdc-age-dot {
      width: 6px; height: 6px; border-radius: 50%;
      display: inline-block;
    }
    .pos-depth-card .pdc-age-dot.dot-young { background: var(--up); }
    .pos-depth-card .pdc-age-dot.dot-old   { background: var(--down); }
    .pos-depth-card .pdc-age-dot.dot-neutral { background: var(--text-tertiary); opacity: 0.6; }
    .pos-depth-card .pdc-health {
      display: inline-flex; align-items: center; justify-content: center;
      width: 14px; height: 14px; border-radius: 50%;
      font-size: 8px; font-weight: 800; letter-spacing: 0;
      line-height: 1;
    }
    .pos-depth-card .pdc-health.h-il { background: var(--down); color: #fff; }
    .pos-depth-card .pdc-health.h-tj { background: var(--down); color: #fff; opacity: 0.7; }
    .pos-depth-card .pdc-health.h-chronic { background: var(--neon-amber); color: #fff; }
    .pos-depth-card .pdc-acq {
      font-family: var(--font-mono);
      font-size: 8.5px;
      letter-spacing: 0.02em;
      color: var(--text-tertiary);
      padding: 0 4px;
      border-radius: 999px;
      border: 1px solid var(--border-light);
    }
    .pos-depth-card .pdc-acq.acq-trade  { color: var(--neon-cyan); border-color: var(--neon-cyan); }
    .pos-depth-card .pdc-acq.acq-ifa    { color: var(--neon-amber); border-color: var(--neon-amber); }
    .pos-depth-card .pdc-acq.acq-rule5,
    .pos-depth-card .pdc-acq.acq-waiver { color: var(--neon-violet); border-color: var(--neon-violet); }
    @media (max-width: 900px) {
      .pos-depth-grid { grid-template-columns: 48px 1fr; }
      .pos-depth-row-expand { grid-column: 2 / -1; justify-self: start; margin-top: 2px; }
      .pos-depth-card .pdc-name { max-width: 90px; }
    }

    /* === Comparison cart =========================================== */
    /* The Compare chip lives in the section-tabs header bar (top of
       page, anchored to the right via margin-left:auto). Auto-hides when
       the cart is empty so first-time visitors don't see "Compare (0)"
       sitting in the chrome. */
    .compare-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      margin-left: auto;
      padding: 6px 12px;
      background: var(--bg-header);
      color: var(--bg-secondary);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.03em;
      border: 1px solid var(--bg-header);
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .compare-toggle:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(15, 27, 45, 0.20); }
    .compare-toggle.is-empty-hidden { display: none; }
    .compare-toggle .compare-count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; padding: 0 5px;
      background: var(--neon-amber); color: var(--text-primary);
      border-radius: 9px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .compare-panel {
      position: fixed;
      top: 20px; right: 20px;
      width: min(960px, calc(100vw - 40px));
      max-height: calc(100vh - 80px);
      overflow: auto;
      z-index: 201;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: 0 8px 32px rgba(15, 27, 45, 0.25);
      padding: 16px;
      display: none;
    }
    .compare-panel.open { display: block; }
    .compare-panel .compare-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .compare-panel .compare-title {
      font-family: var(--font-serif);
      font-size: 18px; font-weight: 600;
      color: var(--text-primary);
    }
    .compare-panel .compare-close {
      background: transparent;
      border: 1px solid transparent;
      font-size: 24px;
      line-height: 1;
      color: var(--text-tertiary);
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .compare-panel .compare-close:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }
    .compare-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      background: var(--bg-primary);
      margin-bottom: 8px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: start;
    }
    .compare-card .cc-remove {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-tertiary);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 2px;
      cursor: pointer;
    }
    .compare-card .cc-stat {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }
    .compare-add-btn {
      font-family: var(--font-sans);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      cursor: pointer;
      letter-spacing: 0.02em;
    }
    .compare-add-btn.is-in { background: var(--neon-amber); color: var(--text-primary); border-color: var(--neon-amber); font-weight: 600; }
    /* Compact "+ to compare" toggle used on prospect list rows. Square,
       icon-sized so it fits beside the player name without breaking the
       grid layout. */
    .compare-add-btn.is-compact {
      font-size: 14px;
      padding: 0;
      width: 22px;
      height: 22px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .compare-add-btn.is-compact:hover { background: var(--bg-tertiary); color: var(--text-primary); }

    /* === Compare cart 2.0 — side-by-side layout ===================
       When 2+ players are pinned the cart switches from stacked cards
       to a grid: one column per player, shared FV-history overlay
       chart, head-to-head stat table, and an RPS+ summary row at the
       bottom. */
    .compare-sbs-head {
      display: grid;
      gap: 10px;
      margin-bottom: 12px;
    }
    .compare-sbs-head .csbs-player {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-primary);
      padding: 8px 10px;
      border-left: 3px solid var(--csbs-color, var(--bg-header));
      position: relative;
    }
    .compare-sbs-head .csbs-name {
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 14px;
      color: var(--text-primary);
      letter-spacing: -0.005em;
      cursor: pointer;
      line-height: 1.2;
    }
    .compare-sbs-head .csbs-meta {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 3px;
      font-family: var(--font-sans);
    }
    .compare-sbs-head .csbs-remove {
      position: absolute;
      top: 4px; right: 4px;
      background: transparent;
      border: none;
      color: var(--text-tertiary);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 999px;
    }
    .compare-sbs-head .csbs-remove:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }
    /* RPS+ pill — wRC+/OPS+-style index. 100 = mean prospect at the
       same integer age; ≥110 reads green, ≤90 reads red. Violet accent
       on the neutral state keeps the eye trained on what's a normal-band
       reading vs. a notable swing. */

    /* ----- Glossary click-to-define ----- */
    /* Inline .g-term wrappers — dotted underline + help cursor so the
       user knows the term is interactive. The dotted style mirrors
       conventional inline-glossary indicators (e.g. Wikipedia footnotes,
       MDN inline links) without competing with regular hyperlinks. */
    .g-term {
      cursor: help;
      text-decoration: underline dotted var(--text-tertiary);
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
      transition: color 0.12s, text-decoration-color 0.12s;
    }
    .g-term:hover {
      color: var(--neon-cyan);
      text-decoration-color: var(--neon-cyan);
    }
    /* Floating popover anchored near the clicked term. position absolute;
       positioned via JS. Hidden by default — `.is-open` reveals it. */
    .glossary-popover {
      display: none;
      position: absolute;
      z-index: 50;
      width: 320px;
      max-width: 90vw;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-card-hover);
      padding: 12px 14px;
      font-family: var(--font-sans);
      font-size: 12px;
      color: var(--text-primary);
    }
    .glossary-popover.is-open { display: block; }
    .glossary-popover .gp-term {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
      color: var(--neon-cyan);
    }
    .glossary-popover .gp-cat {
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
    }
    .glossary-popover .gp-short {
      margin: 8px 0;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .glossary-popover .gp-long {
      font-size: 11.5px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .glossary-popover .gp-formula,
    .gp-formula {
      font-family: var(--font-mono);
      font-size: 10.5px;
      background: var(--bg-primary);
      border: 1px solid var(--border-light);
      border-radius: 2px;
      padding: 6px 8px;
      margin-top: 8px;
      white-space: pre-wrap;
      color: var(--text-primary);
    }
    .glossary-popover .gp-open {
      display: inline-block;
      margin-top: 10px;
      font-size: 11px;
      color: var(--neon-cyan);
      text-decoration: none;
    }
    .glossary-popover .gp-open:hover { text-decoration: underline; }
    /* Per-term card on the Glossary page. */
    .glossary-card {
      border: 1px solid var(--border-light);
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin-bottom: 10px;
      scroll-margin-top: 80px;
    }
    .glossary-card.is-highlighted {
      animation: glossary-highlight 1.8s ease-out;
    }
    @keyframes glossary-highlight {
      0%   { background: rgba(143, 205, 245, 0.25); }
      100% { background: var(--bg-secondary); }
    }
    .glossary-cat-heading {
      font-family: var(--font-sans);
      font-size: 11px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin: 18px 0 8px;
      font-weight: 700;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border-light);
    }

    .rps-plus-pill {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
      margin-top: 4px;
      letter-spacing: 0;
      cursor: help;
      border: 1px solid var(--neon-violet);
    }
    .rps-plus-pill.is-pos { background: rgba(31, 122, 58, 0.15); color: var(--up); border-color: var(--up); }
    .rps-plus-pill.is-neg { background: rgba(185, 28, 28, 0.12); color: var(--down); border-color: var(--down); }
    .rps-plus-pill.is-neutral { background: rgba(167, 100, 252, 0.10); color: var(--neon-violet); }
    .rps-plus-pill.is-null { background: var(--bg-tertiary); color: var(--text-tertiary); border-style: dashed; }

    /* ToolGrade+ pill — same shape as RPS+ but a half-step smaller so
       it can ride inline next to a player name in list rows without
       crowding. The numeric value is anchored at 100 = cohort mean tool
       composite; ≥110 reads green, ≤90 reads red. */
    .tool-pill {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
      cursor: help;
      border: 1px solid var(--neon-cyan);
      vertical-align: middle;
    }
    .tool-pill.is-pos     { background: rgba(31, 122, 58, 0.15); color: var(--up); border-color: var(--up); }
    .tool-pill.is-neg     { background: rgba(185, 28, 28, 0.12); color: var(--down); border-color: var(--down); }
    .tool-pill.is-neutral { background: rgba(74, 200, 224, 0.10); color: var(--neon-cyan); }

    /* WAG (WAR Above Grade) pill — graduate-only inline delta showing
       career WAR/yr vs the FV-grade-implied WAR/yr (FanGraphs primer,
       lower-bound, hitter/pitcher split, linearly interpolated). Same
       shape as .tool-pill, amber accent on the neutral state to mark it
       as a graduate-only signal vs. the universal ToolGrade+ pill. */
    .wag-pill {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
      cursor: help;
      border: 1px solid var(--neon-amber);
      vertical-align: middle;
    }
    .wag-pill.is-pos     { background: rgba(31, 122, 58, 0.15); color: var(--up);   border-color: var(--up); }
    .wag-pill.is-neg     { background: rgba(185, 28, 28, 0.12); color: var(--down); border-color: var(--down); }
    .wag-pill.is-neutral { background: rgba(232, 165, 31, 0.10); color: var(--neon-amber); }

    /* Tools sidebar card — single-spaced grid of tool-grade chips with
       composites above. Mirrors the layout discipline of the sabermetrics
       block: subtle border, mono badges, no big visual claims. */
    .tools-card {
      border: 1px solid var(--border-light);
      background: var(--bg-secondary);
      padding: 10px 12px;
      border-radius: var(--radius-sm);
    }
    /* Compact 3-up composite chip bar — replaces the stacked composite
       rows. Each chip is a labeled badge group (Overall / Off / Def
       for hitters, Overall / Stuff / Cmd for pitchers). Grid auto-fits
       so a player missing one composite still looks balanced. */
    .tools-card .tools-composite-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
      gap: 6px;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-light);
    }
    .tools-card .tools-composite-chip {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 4px;
      padding: 7px 6px 6px;
      border: 1px solid var(--border-light);
      background: var(--bg-primary);
      border-radius: 3px;
      min-width: 0;
    }
    .tools-card .tools-composite-chip.is-headline {
      background: var(--bg-secondary);
      border-color: var(--border);
    }
    .tools-card .tools-composite-chip-label {
      font-size: 9px; letter-spacing: 0.10em;
      text-transform: uppercase; font-weight: 800;
      color: var(--text-tertiary);
      line-height: 1;
    }
    .tools-card .tools-composite-chip-value {
      display: flex; align-items: center; gap: 4px;
      font-variant-numeric: tabular-nums;
      flex-wrap: wrap; justify-content: center;
    }
    .tools-card .tools-grade-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 5px 10px;
    }
    .tools-card .tools-grade-grid + .tools-grade-grid {
      margin-top: 8px; padding-top: 8px;
      border-top: 1px dashed var(--border-light);
    }
    .tools-card .tools-grade-cell {
      display: flex; align-items: center; justify-content: space-between;
      gap: 6px;
      font-size: 11px;
      color: var(--text-secondary);
    }
    .tools-card .tools-grade-name {
      letter-spacing: 0.04em;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tool-dual-marker {
      display: inline-block;
      margin-left: 3px;
      color: var(--neon-cyan);
      font-size: 9px;
      font-weight: 700;
      cursor: help;
      vertical-align: 1px;
    }
    .tools-card .tools-footer {
      margin-top: 8px;
      font-size: 10px;
      color: var(--text-tertiary);
      letter-spacing: 0.04em;
      line-height: 1.5;
    }
    .tools-card .tools-footer-legend {
      color: var(--neon-cyan);
      font-weight: 600;
    }
    /* Tab strip atop the combined per-source card (FV / Tools panels).
       Reuses .chip styling; .active gets the inverted treatment so the
       selected tab reads as the live state. */
    .per-source-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
    }
    .per-source-tabs .chip {
      font-size: 10px;
      padding: 3px 10px;
    }

    /* Overlay-chart legend dot — small square in the per-player color. */
    .csbs-legend-dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 2px;
      margin-right: 5px;
      vertical-align: middle;
    }

    .compare-overlay-chart {
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      background: var(--bg-primary);
      padding: 8px;
      margin-bottom: 12px;
    }

    /* Head-to-head stat table inside the cart. Numeric columns are
       right-aligned and tabular-numed. Best value in green; worst in
       red. Single-value rows stay neutral. */
    .compare-stat-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 11.5px;
      margin-bottom: 12px;
    }
    .compare-stat-table th, .compare-stat-table td {
      padding: 4px 8px;
      border-bottom: 1px solid var(--border-light);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .compare-stat-table th:first-child, .compare-stat-table td:first-child {
      text-align: left;
      color: var(--text-tertiary);
      font-family: var(--font-sans);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
      padding-left: 0;
    }
    .compare-stat-table thead th {
      font-family: var(--font-sans);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      font-weight: 700;
      border-bottom: 2px solid var(--bg-header);
    }
    .compare-stat-table td.is-best { color: var(--up); font-weight: 700; }
    .compare-stat-table td.is-worst { color: var(--down); }
    .compare-stat-table tbody tr.is-group-header td {
      padding-top: 8px;
      border-bottom: none;
      color: var(--text-tertiary);
      font-family: var(--font-sans);
      font-size: 9px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      text-align: left;
      font-weight: 700;
    }

    /* RPS+ caption + driver line at the bottom of the side-by-side cart. */
    .compare-rps-row {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .compare-rps-row .crps-driver {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      color: var(--text-tertiary);
    }

    @media (max-width: 720px) {
      .compare-sbs-head { grid-template-columns: 1fr !important; }
      .compare-stat-table { font-size: 10.5px; }
      .compare-stat-table th, .compare-stat-table td { padding: 3px 5px; }
    }

    /* === Mobile filter toggle ====================================
       Desktop: button hidden, filter-bar shown.
       Mobile (<720px): button visible; filter-bar hidden until the
       user opens it. Saves ~120px of vertical space on phones. */
    .filter-toggle {
      display: none;
      align-items: center;
      gap: 6px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 8px 14px;
      margin-bottom: 8px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
    }
    .filter-toggle .filter-toggle-count {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-tertiary);
      letter-spacing: 0;
    }
    .filter-toggle[aria-expanded="true"] .filter-toggle-arrow { transform: rotate(180deg); }
    .filter-toggle-arrow { transition: transform 0.15s; display: inline-block; }
    @media (max-width: 720px) {
      .filter-toggle { display: inline-flex; }
      #filter-bar { display: none; }
      #filter-bar.is-open { display: flex; }
    }

    /* Watchlist star — inline button on prospect rows + the detail-page
       header. Filled gold when starred, hollow gray otherwise. Click +
       'c'-style hotkey both route through watchlistToggle. */
    .watch-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px;
      background: transparent;
      color: var(--text-tertiary);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
    }
    .watch-btn:hover { color: var(--card-gold); border-color: var(--card-gold); }
    .watch-btn.is-in {
      color: var(--card-gold);
      border-color: var(--card-gold);
      background: rgba(201, 162, 39, 0.10);
    }
    /* Notes textarea on prospect detail. Stays narrow so it doesn't
       dominate the body; localStorage-keyed by player. */
    .player-note-area {
      width: 100%;
      min-height: 70px;
      font-family: var(--font-sans);
      font-size: 13px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      background: var(--bg-primary);
      color: var(--text-primary);
      border-radius: var(--radius-sm);
      resize: vertical;
    }
    .player-note-area:focus {
      outline: none;
      border-color: var(--neon-cyan);
    }

    /* Command palette — Cmd/Ctrl-K modal for jumping to a prospect or
       farm system. Mounted at body level; click-anywhere-to-dismiss via
       the dimmed overlay. Result rows match player-list row aesthetic
       so the visual language stays consistent. */
    .cmd-palette-overlay {
      position: fixed; inset: 0;
      background: rgba(15, 27, 45, 0.45);
      backdrop-filter: blur(2px);
      z-index: 300;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 14vh 16px;
    }
    .cmd-palette-overlay.is-open { display: flex; }
    .cmd-palette {
      width: min(560px, 100%);
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: 0 20px 60px rgba(15, 27, 45, 0.40);
      overflow: hidden;
      font-family: var(--font-sans);
    }
    .cmd-palette input {
      width: 100%; box-sizing: border-box;
      padding: 14px 16px;
      font-family: var(--font-sans);
      font-size: 15px;
      border: 0; outline: 0;
      background: var(--bg-secondary);
      color: var(--text-primary);
      border-bottom: 1px solid var(--border);
    }
    .cmd-palette-results {
      max-height: 50vh;
      overflow-y: auto;
    }
    .cmd-palette-result {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 8px 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-light);
      font-size: 13px;
    }
    .cmd-palette-result:hover,
    .cmd-palette-result.is-active {
      background: var(--bg-tertiary);
    }
    .cmd-palette-result .cpr-kind {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      text-transform: uppercase;
    }
    .cmd-palette-result .cpr-name { color: var(--text-primary); font-weight: 600; }
    .cmd-palette-result .cpr-meta { color: var(--text-tertiary); font-size: 11px; font-family: var(--font-mono); }
    .cmd-palette-empty {
      padding: 14px 16px;
      font-size: 12px;
      color: var(--text-tertiary);
      text-align: center;
    }
    .cmd-palette-hint {
      display: flex; gap: 10px;
      padding: 6px 14px;
      font-size: 10px;
      color: var(--text-tertiary);
      background: var(--bg-tertiary);
      border-top: 1px solid var(--border-light);
      letter-spacing: 0.04em;
    }
  </style>
</head>

<body>
<div class="container">

  <header class="header">
    <h1>MLB Prospect Portal<span class="h1-rule" aria-hidden="true"></span></h1>
    <div class="meta-line" id="meta-line">Loading…</div>
    <!-- Persistent global controls — these survive content overwrites
         on detail pages where the section-tabs strip in #main-template
         gets blown away by renderPlayerDetail / renderFarmDetail. The
         in-template versions (inside #section-tabs below) stay too for
         keyboard accessibility on the list pages, but these are the
         always-available affordances. -->
    <div class="global-controls" id="global-controls">
      <button class="global-ctrl" id="global-watchlist" type="button"
              title="Open your watchlist" aria-label="Watchlist">
        <span aria-hidden="true">★</span>
        <span class="global-ctrl-label">Watchlist</span>
      </button>
      <button class="global-ctrl global-compare is-empty-hidden" id="global-compare" type="button"
              title="Open compare panel" aria-label="Compare">
        <span aria-hidden="true">⇆</span>
        <span class="global-ctrl-label">Compare</span>
        <span class="global-ctrl-count" id="global-compare-count">0</span>
      </button>
      <button class="global-ctrl" id="global-theme-toggle" type="button"
              aria-label="Toggle light/dark theme" title="Toggle light/dark theme">
        <span class="theme-icon" aria-hidden="true">☾</span>
      </button>
    </div>
  </header>

  <div id="content">
    <div class="state-message is-loading">Loading prospect data…</div>
  </div>

</div>

<!-- Comparison cart: persistent header chip (mounted inside #section-tabs
     below) + side panel. Pinned prospects/farms persist in localStorage
     so refresh / sharing keeps the comparison alive. Up to 3 items
     side-by-side. The chip auto-hides when the cart is empty. -->
<!-- Command palette modal — Cmd+K (Mac) / Ctrl+K to open. Searches
     across active prospects + farm orgs; Enter to navigate to the
     selected row, Up/Down to move highlight. -->
<div class="cmd-palette-overlay" id="cmd-palette-overlay" role="dialog" aria-label="Quick jump">
  <div class="cmd-palette" role="combobox">
    <input id="cmd-palette-input" type="text" placeholder="Jump to a prospect or farm…" autocomplete="off" spellcheck="false">
    <div class="cmd-palette-results" id="cmd-palette-results"></div>
    <div class="cmd-palette-hint">
      <span>↑↓ navigate</span>
      <span>Enter open</span>
      <span>Esc close</span>
    </div>
  </div>
</div>

<aside class="compare-panel" id="compare-panel" role="dialog" aria-label="Compare">
  <div class="compare-head">
    <div class="compare-title">Compare</div>
    <button class="compare-close" id="compare-close" type="button" aria-label="Close">×</button>
  </div>
  <div id="compare-body"></div>

<script>
// =============================================================================
// THEME INIT (runs synchronously before any content paints)
// =============================================================================
// Resolve preference: localStorage > prefers-color-scheme > "light" default.
// Setting the attribute on <html> synchronously avoids a flash of the wrong
// theme — CSS variables under [data-theme="dark"] take effect immediately.
// =============================================================================
(function initTheme() {
  let stored = null;
  try { stored = localStorage.getItem("prospect-tracker.theme"); } catch (_) {}
  const sysDark = window.matchMedia
    && window.matchMedia("(prefers-color-scheme: dark)").matches;
  const theme = stored || (sysDark ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
})();

// =============================================================================
// CONFIG
// =============================================================================
// If your timeseries.json lives at a different path (or on a different host),
// change DATA_URL here. Relative paths work for static hosting; absolute URLs
// work for CDN/cross-origin hosts (CORS must be configured on that host).
// =============================================================================
const DATA_URL = "data/timeseries.json";

// Sync the theme toggle's icon + wire its click handler. Called after the
// main template mounts so the #theme-toggle element exists. The icon
// flips between ☾ (currently light, click to go dark) and ☀ (currently
// dark, click to go light) so users always see the destination state.
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  // Sync both the in-template theme toggle (list pages) AND the
  // persistent global toggle (header rail, always visible).
  for (const id of ["theme-toggle", "global-theme-toggle"]) {
    const btn = document.getElementById(id);
    if (btn) {
      const icon = btn.querySelector(".theme-icon");
      if (icon) icon.textContent = theme === "dark" ? "☀" : "☾";
      btn.title = theme === "dark" ? "Switch to light mode" : "Switch to dark mode";
    }
  }
}
function wireThemeToggle() {
  applyTheme(document.documentElement.getAttribute("data-theme") || "light");
  const toggleHandler = () => {
    const cur = document.documentElement.getAttribute("data-theme") || "light";
    const next = cur === "dark" ? "light" : "dark";
    try { localStorage.setItem("prospect-tracker.theme", next); } catch (_) {}
    applyTheme(next);
  };
  // Wire both toggles independently — neither requires the other to
  // exist (the global one is always present in the persistent header;
  // the in-template one only exists once #main-template has mounted).
  for (const id of ["theme-toggle", "global-theme-toggle"]) {
    const btn = document.getElementById(id);
    if (btn && !btn.dataset.wired) {
      btn.addEventListener("click", toggleHandler);
      btn.dataset.wired = "1";
    }
  }
}

// =============================================================================
// LOAD DATA
// =============================================================================
// timeseries.json is the boot-critical payload (~24MB) carrying the
// active-prospect list, spotlights, org summaries, and norms tables.
// Three sidecar JSONs are fetched on demand:
//   - graduates.json     (~14MB) when the user opens the Graduates tab
//   - inactive.json      (~4MB)  when the user opens the Inactive view
//   - rosters_by_org.json (~2MB)  when the user opens any farm-detail page
//
// The boot file advertises sidecars via `_slices`. We default-fill the
// arrays with [] so first-paint render code that walks DATA.graduates
// etc. doesn't crash before a slice arrives.
async function loadData() {
  try {
    const resp = await fetch(DATA_URL, { cache: "no-cache" });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const d = await resp.json();
    // Back-compat: a monolithic timeseries.json may still carry these
    // arrays inline. The boot path tolerates either shape.
    if (!Array.isArray(d.graduates))  d.graduates = [];
    if (!Array.isArray(d.inactive))   d.inactive = [];
    if (!d.rosters_by_org)            d.rosters_by_org = {};
    return d;
  } catch (err) {
    return { __error: err.message };
  }
}

// In-flight fetch promises per slice name so concurrent callers share a
// single request. Resolves when the slice has been merged into DATA.
const _sliceInFlight = {};
function loadSlice(name) {
  if (!DATA || !DATA._slices || !DATA._slices[name]) {
    // Slice not advertised (monolithic legacy export) — already on DATA.
    return Promise.resolve();
  }
  // Already merged.
  const cur = DATA[name];
  const isPopulated = Array.isArray(cur) ? cur.length > 0
                                         : (cur && Object.keys(cur).length > 0);
  if (isPopulated) return Promise.resolve();
  if (_sliceInFlight[name]) return _sliceInFlight[name];
  // Slice URLs in _slices are bare filenames (e.g. "graduates.json"),
  // emitted alongside timeseries.json. Browsers resolve them relative
  // to the *page* URL, not the data file — so we have to splice in the
  // data dir from DATA_URL ourselves. Without this prefix the fetch
  // 404s silently and the gate loops on the loading state.
  const base = DATA_URL.replace(/[^/]+$/, "");
  const url = base + DATA._slices[name];
  _sliceInFlight[name] = fetch(url, { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(payload => { DATA[name] = payload; })
    .catch(err => {
      console.warn(`slice ${name} fetch failed:`, err);
      // Leave the empty default so render code doesn't loop.
    })
    .finally(() => { delete _sliceInFlight[name]; });
  return _sliceInFlight[name];
}

// =============================================================================
// FORMATTING HELPERS
// =============================================================================
// FanGraphs scouting-primer FV → projected peak MLB WAR/yr. From the
// public primer at blogs.fangraphs.com/the-new-fangraphs-scouting-primer.
// Surfaced via fvBadgeTooltip below so readers see the WAR projection
// alongside the FV tier label.
const FV_TO_WAR = {
  80: "7+ WAR/yr peak (Hall of Fame tier)",
  75: "6 WAR/yr peak (perennial All-Star)",
  70: "5 WAR/yr peak (All-Star)",
  65: "4 WAR/yr peak (perennial above-average)",
  60: "3.5 WAR/yr peak (above-average regular)",
  55: "3 WAR/yr peak (first-division regular)",
  50: "2.5 WAR/yr peak (average MLB regular)",
  45: "1.5 WAR/yr peak (second-division regular / platoon)",
  40: "0.5 WAR/yr peak (up-and-down / fringe MLB)",
  35: "Org filler / Quad-A",
  30: "Org filler / non-prospect",
  25: "Org filler / non-prospect",
  20: "Org filler / non-prospect",
};

// Build a tooltip string for an FV badge: tier label, raw (unsnapped)
// mean of source grades when it differs from the snapped tier, and the
// FanGraphs WAR projection for the tier. Source-count references were
// removed 2026-05 — the consensus is just the mean of source grades
// now, so the source count carries no model meaning. (Anyone curious
// about per-source breakdown can still see it on the player detail
// "Source consensus" card.)
function fvBadgeTooltip(player) {
  if (!player) return "";
  const parts = [];
  const tier = player.fv_close != null ? Math.round(player.fv_close) : null;
  if (tier != null) {
    let line = `FV ${tier}`;
    if (player.fv_close_raw != null && Math.abs(player.fv_close_raw - tier) > 0.05) {
      line += ` · raw ${player.fv_close_raw.toFixed(1)}`;
    }
    parts.push(line);
  }
  if (tier != null && FV_TO_WAR[tier]) {
    parts.push(FV_TO_WAR[tier]);
  }
  // Surface the single-source pull-down when it applies — the badge
  // sub-text says "raw N" but doesn't explain why; this line does.
  const pts = player.points;
  const last = pts && pts.length ? pts[pts.length - 1] : null;
  if (last && last.shrinkage_weight != null && last.shrinkage_weight < 1.0
      && last.consensus_fv_pre_shrinkage != null) {
    parts.push(`Pulled from ${last.consensus_fv_pre_shrinkage.toFixed(1)} (single-source grade, shrunk 1/3 toward FV 35)`);
  }
  return parts.join("\n");
}

// Returns the count of explicit-FV sources at the player's latest
// point. Used inside the wide-spread "W" mark tooltip (how many sources
// are currently grading the player). Falls back to recounting per_source
// for cached payloads that pre-date avg_fv_n.
function _fvSourceCount(player) {
  const pts = player && player.points;
  const last = pts && pts.length ? pts[pts.length - 1] : null;
  if (!last) return null;
  return last.avg_fv_n != null
    ? last.avg_fv_n
    : Object.values(last.per_source || {}).filter(v => v && v.fv_published != null).length;
}

// Returns the total (source, snapshot_date) instances where an explicit
// FV exists across the player's full history. Drives the single-instance
// shrinkage indicator: 1 instance ever → pulled toward FV 35; ≥2 → well-
// observed, no pull (including single-source players re-graded across
// multiple snapshots). Falls back to a per-point sweep for payloads
// pre-dating the player-level field.
function _fvTotalInstances(player) {
  if (!player) return 0;
  if (typeof player.fv_total_instances === "number") return player.fv_total_instances;
  const seen = new Set();
  for (const pt of (player.points || [])) {
    for (const [src, obs] of Object.entries(pt.per_source || {})) {
      if (obs && obs.fv_published != null) {
        seen.add(src + "|" + (obs.snapshot_date || pt.snapshot_date || ""));
      }
    }
  }
  return seen.size;
}

// Returns " is-wide" when the player has ≥2 sources disagreeing by
// ≥10 grade points. Callers append to the FV badge's class list →
// violet solid outline via CSS. Empty string otherwise.
function fvBadgeWideClass(player) {
  const pts = player && player.points;
  const last = pts && pts.length ? pts[pts.length - 1] : null;
  if (!last) return "";
  if (last.fv_spread != null && last.fv_spread >= 10) return " is-wide";
  return "";
}

// Real-DOM "W" mark for wide-spread badges. Lives inside the badge so
// the `title` attribute hovers. Returns "" when the badge isn't wide.
function fvBadgeWideMarkHTML(player) {
  if (!fvBadgeWideClass(player)) return "";
  const pts = player && player.points;
  const last = pts && pts.length ? pts[pts.length - 1] : null;
  const n = _fvSourceCount(player) || 0;
  const sp = last && last.fv_spread != null ? last.fv_spread.toFixed(1) : "?";
  return `<span class="fv-wide-mark" title="Wide source disagreement — sources differ by ${sp} grade points across ${n} sources. Open the per-source breakdown (now inside the More details accordion) for the per-source FVs.">W</span>`;
}

// Returns " is-single-source" when the player has only ONE explicit-FV
// instance across their entire history (1 snapshot, ever — typically a
// brand-new IFA appearing only on Pipeline's Top 50). The CSS class
// name keeps its legacy "single-source" wording for back-compat, but
// the trigger is now player-level instance count, not per-point source
// count. A single-source player who has been re-graded across multiple
// snapshots is well-observed and does NOT carry the indicator.
function fvBadgeSingleClass(player) {
  return _fvTotalInstances(player) === 1 ? " is-single-source" : "";
}

// Real-DOM "1" mark for single-instance badges. Lives at the top-left of
// the badge (the wide W lives at top-right) so the two can co-exist
// visually if they ever fire together. `title` explains the FV-35 pull.
function fvBadgeSingleMarkHTML(player) {
  if (!fvBadgeSingleClass(player)) return "";
  return `<span class="fv-single-mark" title="Single observation — only one published grade across this player's history. Pulled 1/3 toward FV 35 (Bayesian shrinkage, k=0.5); the pull lifts as soon as a second grade update lands, even from the same source.">1</span>`;
}

// Acquisition-method tooltip helper — builds the per-method context
// string for acqPillHTML. Lifted out so it can stay readable.
function acqTooltip(p, method) {
  const cur = p.current_acquisition || {};
  const evt = cur.event || {};
  const orig = p.acquisition || {};
  if (method === "draft") {
    const yr = orig.year ? `, ${orig.year}` : "";
    return orig.pick_overall != null
      ? `Drafted pick #${orig.pick_overall}${yr}`
      : `Drafted${yr}`;
  }
  if (method === "international_fa") {
    const yr = orig.year ? ` ${orig.year}` : "";
    return `International FA signing${yr}`;
  }
  if (method === "trade") {
    const date = evt.date || "?";
    const from = evt.from_org || "?";
    const to = evt.to_org || "?";
    return `Acquired via trade — ${from} → ${to} (${date})`;
  }
  if (method === "rule_5")     return `Acquired via Rule 5 draft${evt.date ? ` (${evt.date})` : ""}`;
  if (method === "waiver")     return `Waiver claim${evt.from_org ? ` from ${evt.from_org}` : ""}${evt.date ? ` (${evt.date})` : ""}`;
  if (method === "free_agent") return `Free-agent signing${evt.date ? ` (${evt.date})` : ""}`;
  if (method === "contract_purchase") return `Contract purchase${evt.date ? ` (${evt.date})` : ""}`;
  return "Acquired";
}

// Inline pill summing the prospect's stat_flags + tool_flags into a
// compact ▲N ▼N chip. Hidden when the prospect has no flags. Hover
// reveals the comma-separated list of flag names so the reader can
// audit the count without opening the detail page.
function flagCounterPillHTML(p) {
  const flags = (p.stat_flags || []).concat(p.tool_flags || []);
  if (!flags.length) return "";
  const g = flags.filter(f => f.direction === "green").length;
  const r = flags.filter(f => f.direction === "red").length;
  if (!g && !r) return "";
  const list = flags.map(f => f.stat).join(" · ");
  const greenPart = g ? `<span class="flag-up">▲${g}</span>` : "";
  const redPart   = r ? `<span class="flag-down">▼${r}</span>` : "";
  return `<span class="row-tag" title="${escapeHtml(list)}">${greenPart}${redPart}</span>`;
}

// Single inline chip surfacing the most-concerning health signal:
//   On IL > Post-TJ > chronic-IL (≥3 stints or ≥200 IL days last 24mo).
// Mutually exclusive — only one chip ever shows per row. Healthy
// prospects render nothing.
function healthBadgeHTML(p) {
  // Severity tiers (top-down): On IL > Post-TJ > Chronic > Watch > Healthy.
  // Each tier renders a chip with a colored dot prefix and a distinct
  // background so a scout can read severity at a glance. Healthy is
  // also surfaced (small green chip) so the absence of a chip never
  // means "we don't know" — it always means "no health data on file".
  const il = p.il_status || {};
  if (il.is_on_il) {
    const days = il.days_on_il;
    const what = il.description ? il.description : "On IL";
    return `<span class="row-tag health-il" title="${escapeHtml(what)}">IL${days != null ? ` ${days}d` : ""}</span>`;
  }
  const hp = p.health_profile || {};
  if (hp.is_post_tj) {
    const d = hp.tj_surgery_date ? ` (${hp.tj_surgery_date})` : "";
    return `<span class="row-tag health-tj" title="Post-Tommy John surgery${d}">TJ</span>`;
  }
  const stints = hp.il_stints_24mo || 0;
  const ildays = hp.il_days_24mo || 0;
  if (stints >= 3 || ildays >= 200) {
    return `<span class="row-tag health-chronic" title="${stints} IL stint${stints === 1 ? "" : "s"} · ${ildays}d on IL last 24 months — high recurrence. Different from being currently on IL (the IL chip surfaces that state separately).">Freq. Injured</span>`;
  }
  if (stints >= 1 || ildays >= 30) {
    return `<span class="row-tag health-watch" title="${stints} IL stint${stints === 1 ? "" : "s"} · ${ildays}d on IL last 24 months — recent injury history">Recent Injury</span>`;
  }
  // No reported IL activity in the past 24 months — surface explicitly
  // as "Healthy" so the lack of a chip doesn't get confused with missing
  // data. Only fires when we have an `health_profile` object on the
  // record at all; pre-injury-tracking inactives stay silent.
  if (hp && Object.keys(hp).length) {
    return `<span class="row-tag health-healthy" title="No IL activity in the past 24 months">Healthy</span>`;
  }
  return "";
}

// Acquisition-method pill. Uses current_acquisition.method (so a
// recently-traded prospect reads "Trade") and falls back to the
// original acquisition method when current is missing/unknown. Tooltip
// surfaces pick number / from-org / date depending on the method.
// Compact-bonus formatter for the inline IFA pill. The existing
// fmtBonus (defined locally inside acquisitionSection) renders the
// full dollar amount; here we want "$1.5M" / "$250k" so the bonus
// fits in a row chip without word-wrapping.
function fmtBonusCompact(usd) {
  if (usd == null || !isFinite(usd)) return null;
  const n = Number(usd);
  if (n >= 1_000_000) return `$${(n / 1_000_000).toFixed(n >= 10_000_000 ? 0 : 1)}M`;
  if (n >= 1_000)     return `$${Math.round(n / 1_000)}k`;
  return `$${Math.round(n)}`;
}

function acqPillHTML(p) {
  const cur = (p.current_acquisition || {}).method;
  const orig = (p.acquisition || {}).method;
  const method = (cur && cur !== "unknown") ? cur
               : (orig && orig !== "unknown") ? orig
               : null;
  if (!method) return "";
  const labels = {
    draft: "Draft", international_fa: "IFA", trade: "Trade",
    rule_5: "Rule 5", waiver: "Waiver", free_agent: "FA",
    contract_purchase: "Purchase",
  };
  let label = labels[method];
  if (!label) return "";
  // IFA prospects with a known signing bonus get the dollar amount
  // appended to the pill (e.g., "IFA $1.5M"). Keeps the canonical IFA
  // label visible while surfacing the size of the signing.
  let tooltip = acqTooltip(p, method);
  if (method === "international_fa") {
    const bonus = (p.acquisition || {}).bonus_usd;
    const compact = fmtBonusCompact(bonus);
    if (compact) {
      label = `IFA ${compact}`;
      tooltip = `${tooltip} · Signing bonus ${Number(bonus).toLocaleString("en-US")}`;
    }
  }
  const cls = method === "trade" ? "acq-trade"
    : method === "rule_5" ? "acq-rule5"
    : method === "waiver" ? "acq-waiver"
    : "";
  return `<span class="row-tag ${cls}" title="${escapeHtml(tooltip)}">${label}</span>`;
}

// Statcast micro-pill — Standard-density always-on view of the two
// most-cited Statcast fields per role. xwOBA + barrel% for hitters,
// whiff% + max velo for pitchers. Returns "" when the prospect has no
// prospect_savant payload or both fields are null. Hidden via CSS in
// Expanded mode where playerExpandedMetaHTML already renders the
// 5-field strip to avoid duplication.
function savantInlinePillHTML(p) {
  const sv = p && p.prospect_savant;
  if (!sv || !Object.keys(sv).length) return "";
  const role = (sv.role || "").toLowerCase();
  const isPit = role === "pitcher"
             || (!role && (p.sabermetrics || {}).is_pitcher);
  const fmtPct = v => v == null ? null : `${Number(v).toFixed(0)}%`;
  const parts = [];
  let tipParts = [];
  if (isPit) {
    if (sv.whiff_pct != null) {
      parts.push(`wh ${fmtPct(sv.whiff_pct)}`);
      tipParts.push(`Whiff% ${fmtPct(sv.whiff_pct)}`);
    }
    if (sv.max_velo != null) {
      parts.push(`${Math.round(sv.max_velo)} mph`);
      tipParts.push(`Max velo ${Number(sv.max_velo).toFixed(1)} mph`);
    }
  } else {
    if (sv.xwoba != null) {
      const x = Number(sv.xwoba).toFixed(3).replace(/^0/, "");
      parts.push(`xwOBA ${x}`);
      tipParts.push(`xwOBA ${x}`);
    }
    if (sv.barrel_pct != null) {
      parts.push(`brl ${fmtPct(sv.barrel_pct)}`);
      tipParts.push(`Barrel% ${fmtPct(sv.barrel_pct)}`);
    }
  }
  if (!parts.length) return "";
  const lvl = sv.level ? ` (${sv.level})` : "";
  const tip = `Statcast${lvl}: ${tipParts.join(" · ")}`;
  return `<span class="row-tag savant-inline-pill" title="${escapeHtml(tip)}">${parts.join(" · ")}</span>`;
}

// Pitcher arsenal mini-chip — top 3 pitches by usage. Hidden for
// hitters and for any pitcher whose pitch_arsenal isn't on file yet.
// Renders the compact pitch-type code + usage %; tooltip carries the
// full mix with velos.
function arsenalMiniHTML(p) {
  const pa = p && p.pitch_arsenal;
  const pitches = pa && pa.pitches;
  if (!pitches || !pitches.length) return "";
  // Defensive: re-sort desc by usage_pct in case the upstream order
  // changed. usage_pct can be either 0–1 or 0–100 depending on payload
  // vintage; we normalize to percentage in the label.
  const sorted = pitches.slice().sort((a, b) =>
    (Number(b.usage_pct) || 0) - (Number(a.usage_pct) || 0));
  const top = sorted.slice(0, 3);
  const toPct = u => {
    const n = Number(u);
    if (!isFinite(n)) return null;
    return n <= 1 ? Math.round(n * 100) : Math.round(n);
  };
  const labelBits = top.map(pi => {
    const pct = toPct(pi.usage_pct);
    if (pct == null) return null;
    return `${pi.pitch_type || pi.pitch_name || "?"} ${pct}`;
  }).filter(Boolean);
  if (!labelBits.length) return "";
  const tipBits = sorted.map(pi => {
    const pct = toPct(pi.usage_pct);
    const velo = pi.avg_speed != null ? ` @ ${Number(pi.avg_speed).toFixed(1)} mph` : "";
    return `${pi.pitch_name || pi.pitch_type || "?"} ${pct != null ? pct + "%" : "?"}${velo}`;
  });
  return `<span class="row-tag arsenal-mini" title="${escapeHtml("Pitch mix: " + tipBits.join(" · "))}">${escapeHtml(labelBits.join(" · "))}</span>`;
}

// "Newly acquired" chip — fires when the most recent trade / waiver
// claim / Rule 5 pick / contract purchase happened in the last 30
// days. Quieter version of the perma-Acquisition pill (which says
// "this player was once acquired via X"); this one says "very
// recently". Both can show on the same row — complementary signals.
function recentAcqBadgeHTML(p) {
  const events = [];
  for (const t of (p.trades || [])) {
    if (t && t.trade_date) {
      events.push({ kind: "trade", date: t.trade_date,
                    from: t.from_org, to: t.to_org });
    }
  }
  for (const tx of (p.transactions || [])) {
    if (!tx || !tx.date) continue;
    if (tx.kind === "waiver_claim" || tx.kind === "rule_5"
        || tx.kind === "contract_purchase") {
      events.push({ kind: tx.kind, date: tx.date,
                    from: tx.from_org, to: tx.to_org });
    }
  }
  if (!events.length) return "";
  // Latest event wins.
  events.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const e = events[0];
  const dt = new Date(e.date + "T00:00:00");
  if (isNaN(dt.getTime())) return "";
  const days = Math.floor((Date.now() - dt.getTime()) / 86400000);
  if (days < 0 || days > 30) return "";
  const kindLabels = {
    trade: "Acquired via trade",
    waiver_claim: "Waiver claim",
    rule_5: "Rule 5 pick",
    contract_purchase: "Contract purchase",
  };
  const arrow = (e.from && e.to) ? ` — ${e.from} → ${e.to}` : "";
  const tip = `${kindLabels[e.kind] || "Acquired"}${arrow} on ${e.date} (${days} day${days === 1 ? "" : "s"} ago)`;
  return `<span class="row-tag recent-acq" title="${escapeHtml(tip)}">new · ${days}d</span>`;
}

// Second meta line under the player name, rendered only in the
// Expanded density mode. Surfaces (when available) a flag detail
// line, a Statcast micro-tile, and a recent-FV-history caption pulled
// from the candlestick fields. Each block guards on the underlying
// data being present.
function playerExpandedMetaHTML(p) {
  const parts = [];
  const flags = (p.stat_flags || []).concat(p.tool_flags || []);
  if (flags.length) {
    const g = flags.filter(f => f.direction === "green");
    const r = flags.filter(f => f.direction === "red");
    const lhs = g.length ? `<span class="expand-flag-up">▲ ${g.map(f => escapeHtml(f.stat)).join(", ")}</span>` : "";
    const rhs = r.length ? `<span class="expand-flag-down">▼ ${r.map(f => escapeHtml(f.stat)).join(", ")}</span>` : "";
    parts.push(`${lhs}${lhs && rhs ? "   " : ""}${rhs}`);
  }
  const sv = p.prospect_savant;
  if (sv && Object.keys(sv).length) {
    const bits = [];
    if (sv.xwoba != null)      bits.push(`xwOBA ${Number(sv.xwoba).toFixed(3).replace(/^0/, "")}`);
    if (sv.barrel_pct != null) bits.push(`barrel ${Number(sv.barrel_pct).toFixed(1)}%`);
    if (sv.hard_hit_pct != null) bits.push(`HardHit ${Number(sv.hard_hit_pct).toFixed(0)}%`);
    if (sv.whiff_pct != null)  bits.push(`whiff ${Number(sv.whiff_pct).toFixed(0)}%`);
    if (sv.k_pct != null)      bits.push(`K ${Number(sv.k_pct).toFixed(0)}%`);
    if (sv.bb_pct != null)     bits.push(`BB ${Number(sv.bb_pct).toFixed(0)}%`);
    if (bits.length) parts.push(`<span class="expand-savant">${bits.join(" · ")}</span>`);
  }
  // OHLC text was previously rendered here, but it duplicated what the
  // stock chart in the row already visualizes. The same numbers now
  // surface on hover of the candle cell (see makeCandle) so the
