    ${yp ? `<div style="display:flex;align-items:center;gap:10px;${ypPlayer ? 'cursor:pointer;' : ''}" ${ypPlayer ? `onclick="goToPlayer('${escapeHtml(ypPlayer.player_key)}');"` : ''}>
      ${headshotHTML(ypPlayer || {}, 64)}
      <div style="min-width:0;">
        <div style="font-size:14px;font-weight:600;${ypPlayer ? 'color:var(--neon-cyan);' : ''}">${escapeHtml(yp.name)}</div>
        <div style="font-size:11px;color:var(--text-secondary);margin-top:2px;">${escapeHtml(yp.pos||'')} · age ${yp.age != null ? yp.age.toFixed(1) : "—"} · FV ${yp.fv_label}</div>
      </div>
    </div>` : '—'}
  </div>`;
  const fvDistCard = `<div class="farm-side-card">
    <div class="side-title">FV distribution <span class="side-count">${(org.prospects || []).length} graded</span></div>
    ${makeFvHistogram(org.prospects)}
  </div>`;
  const acqMixCard = `<div class="farm-side-card">
    <div class="side-title">Acquired via <span class="side-count">${rosterPlayersAll.length} tracked</span></div>
    ${makeAcqMixBar(rosterPlayersAll)}
  </div>`;
  const etaCard = `<div class="farm-side-card">
    <div class="side-title">ETA distribution</div>
    ${makeEtaTimeline(rosterPlayersAll)}
  </div>`;
  // Org stat leaders — show one top hitter + one top pitcher inline,
  // and a deep-link into the Leaderboards tab pre-filtered to this
  // org for the full board. Replaces the previous 5-row top-OPS + 5-row
  // top-ERA cards (duplicative of the cross-org Leaderboards tab).
  const topH = topHitters[0];
  const topP = topPitchers[0];
  const leaderRow = (lbl, row, val) => row
    ? `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:3px 0;font-size:12px;cursor:pointer;" onclick="goToPlayer('${escapeHtml(row.p.player_key)}');">
        <span><span style="font-size:9px;color:var(--text-tertiary);letter-spacing:0.08em;text-transform:uppercase;margin-right:6px;">${lbl}</span><span style="color:var(--text-primary);">${escapeHtml(row.p.player_name)}</span></span>
        <span style="color:var(--neon-cyan);font-variant-numeric:tabular-nums;">${val}</span>
      </div>`
    : `<div style="font-size:11px;color:var(--text-tertiary);padding:3px 0;"><span style="font-size:9px;letter-spacing:0.08em;text-transform:uppercase;margin-right:6px;">${lbl}</span>—</div>`;
  const orgLeadersCard = `<div class="farm-side-card">
    <div class="side-title">Org stat leaders <span class="side-count">${topHitters.length + topPitchers.length} qualifying</span></div>
    ${leaderRow("OPS", topH, topH ? `${topH.sl.ops} · ${topH.sl.hr ?? 0} HR` : "")}
    ${leaderRow("ERA", topP, topP ? `${topP.sl.era} · ${(topP.sl.ip != null ? Number(topP.sl.ip).toFixed(1) : "—")} IP` : "")}
    <a href="#" onclick="event.preventDefault();state.section='leaderboards';state.lbOrg='${escapeHtml(orgCode)}';state.view=null;render();syncToURL();" style="display:inline-block;margin-top:8px;font-size:11px;color:var(--neon-cyan);text-decoration:none;letter-spacing:0.02em;">View all org leaderboards →</a>
  </div>`;

  // Compact transaction list for the sidebar — one row per event with
  // a colored chip in front denoting the kind (trade / waiver claim /
  // release / DFA / etc.) and a +/→ arrow that flips for in vs. out
  // moves. The full chronological history lives in the main column;
  // this is a "top 12 most recent" snapshot keyed off the same data.
  const compactEventRow = (ev) => {
    const inbound = ev.to_org === orgCode;
    const arrow = inbound
      ? `<span style="color:var(--up);font-weight:700;">+</span>`
      : `<span style="color:var(--down);font-weight:700;">→</span>`;
    const other = inbound ? ev.from_org : ev.to_org;
    const gradTag = ev.graduate
      ? `<span style="font-size:9px;color:var(--text-tertiary);margin-left:4px;letter-spacing:0.04em;">GRAD</span>`
      : "";
    const cfg = TRANSACTION_KINDS[ev.kind] || {};
    const chip = `<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${cfg.color || 'var(--text-tertiary)'};margin-right:6px;vertical-align:middle;" title="${escapeHtml(cfg.label || ev.kind)}"></span>`;
    return `<div style="display:grid;grid-template-columns:36px 1fr auto;gap:6px;align-items:baseline;padding:3px 0;border-bottom:1px solid var(--border-light);font-size:11.5px;cursor:pointer;" onclick="goToPlayer('${escapeHtml(ev.player.player_key)}');">
      <span style="font-family:var(--font-mono);color:var(--text-tertiary);font-size:10px;white-space:nowrap;">${ev.date ? ev.date.slice(2) : '—'}</span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${chip}<span style="color:var(--neon-cyan);">${escapeHtml(ev.player.player_name)}</span>${gradTag}</span>
      <span style="font-family:var(--font-mono);font-size:10px;white-space:nowrap;">${arrow} ${escapeHtml(other || "?")}</span>
    </div>`;
  };

  // Per-kind sidebar sections. Each renders the most recent few events
  // of that kind so the eye can scan by category without one section
  // crowding the others out. Skipped (omitted from the sidebar) when
  // the org has zero of that kind so we don't show empty cards.
  const sideEventSections = [
    ["trade",              "Recent trades",         8],
    ["waiver_claim",       "Recent waiver claims",  5],
    ["signed_free_agent",  "Recent FA signings",    5],
    ["released",           "Recent releases",       5],
    ["dfa",                "Recent DFAs",           5],
    ["outrighted",         "Recent outrights",      5],
    ["contract_purchase",  "Contract purchases",    5],
    ["rule_5_return",      "Rule 5 returns",        5],
  ];
  const recentTxCards = sideEventSections
    .map(([kind, title, cap]) => {
      const evs = (eventsByKind[kind] || []);
      if (!evs.length) return "";
      const html = evs.slice(0, cap).map(compactEventRow).join("");
      return `<div class="farm-side-card">
        <div class="side-title">${escapeHtml(title)} <span class="side-count">${evs.length}</span></div>
        ${html}
      </div>`;
    })
    .join("");

  const gradsCard = `<div class="farm-side-card">
    <div class="side-title">Recent graduates <span class="side-count">${graduates.length}</span></div>
    ${graduates.slice(0, 8).map(g => `<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border-light);font-size:11.5px;cursor:pointer;" onclick="goToPlayer('${escapeHtml(g.player_key)}');">
        <span style="color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(g.player_name)}</span>
        <span style="color:var(--text-tertiary);font-family:var(--font-mono);font-size:10px;white-space:nowrap;">${g.graduation_date || "—"}</span>
      </div>`).join("") || '<span style="color:var(--text-tertiary);font-size:11.5px;">None</span>'}
  </div>`;

  // Currently-on-IL card. Lists this org's tracked prospects on the IL
  // now, sorted by FV descending so the highest-priority injuries
  // surface first. Each row links to the prospect detail page so the
  // reader can drill into the injury history.
  const ilPlayers = rosterPlayersAll
    .filter(rp => (rp.il_status || {}).is_on_il)
    .sort((a, b) => (b.fv_close || 0) - (a.fv_close || 0));
  const ilCard = `<div class="farm-side-card">
    <div class="side-title">On the IL <span class="side-count">${ilPlayers.length}</span></div>
    ${ilPlayers.length
      ? ilPlayers.slice(0, 8).map(rp => {
          const il = rp.il_status || {};
          let days = il.days;
          if (days == null && il.since) {
            const t = new Date(il.since + "T00:00:00").getTime();
            if (!isNaN(t)) days = Math.max(0, Math.floor((Date.now() - t) / 86400000));
          }
          const tj = (rp.health_profile || {}).is_post_tj
            ? ` <span style="font-size:9px;color:var(--neon-violet);font-weight:700;letter-spacing:0.04em;text-transform:uppercase;">TJ</span>`
            : "";
          const fvL = rp.fv_close != null ? Math.round(rp.fv_close) : null;
          return `<div style="display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--border-light);font-size:11.5px;cursor:pointer;" onclick="goToPlayer('${escapeHtml(rp.player_key)}');">
            ${fvL != null ? `<span class="fv-badge ${fvClass(String(fvL))} size-sm">${fvL}</span>` : `<span style="width:24px;"></span>`}
            <span style="color:var(--neon-cyan);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(rp.player_name)}${tj}</span>
            <span style="font-family:var(--font-mono);font-size:10px;color:var(--neon-amber);font-variant-numeric:tabular-nums;">${days != null ? days + 'd' : '—'}</span>
          </div>`;
        }).join("")
      : '<span style="color:var(--text-tertiary);font-size:11.5px;">All tracked prospects healthy.</span>'}
  </div>`;

  const sidebarHtml = topProspectCard + youngestCard + fvDistCard + acqMixCard + etaCard + orgLeadersCard + ilCard + recentTxCards + gradsCard;

  // Optional left rail (≥1500px viewports only — CSS-hidden otherwise).
  // Surfaces breakdowns that are useful at-a-glance but would otherwise
  // sit four scrolls deep on the right or get squeezed into stat tiles.
  const leftRailHtml = `
    <div class="farm-left-rail">
      <div class="farm-side-card">
        <div class="side-title">Position mix</div>
        <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:3px;">${makePosBreakdown(org.pos_groups)}</div>
      </div>
      <div class="farm-side-card">
        <div class="side-title">Stock balance</div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:600;">
          <span class="stock-up">▲${org.stock_up || 0}</span>
          <span style="color:var(--text-tertiary);font-size:11px;">vs.</span>
          <span class="stock-down">▼${org.stock_down || 0}</span>
        </div>
        <div style="font-size:11px;color:var(--text-secondary);margin-top:4px;">${org.stock_flat || 0} flat over last update</div>
      </div>
      <div class="farm-side-card">
        <div class="side-title">Level depth</div>
        <div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;">${makeLevelDepth(org.level_counts, null)}</div>
      </div>
      <div class="farm-side-card">
        <div class="side-title">Tier breakdown</div>
        <div style="margin-top:6px;">${makeTierBar(org.prospects)}</div>
      </div>
    </div>`;

  // Affiliate-roster section — one tab per level, content swap on click.
  // Highlights tracked prospects with their FV badge inline so the page
  // doubles as a "where in the org are our prospects playing right now".
  const affilLevels = ["MLB", "AAA", "AA", "A+", "A", "CPX", "DSL"];
  const orgRosters = (DATA.rosters_by_org || {})[orgCode] || {};
  const presentLevels = affilLevels.filter(lvl => (orgRosters[lvl] || []).length);
  const defaultLevel = presentLevels.includes("AAA") ? "AAA" : (presentLevels[0] || "MLB");

  function levelTableHtml(level) {
    const roster = orgRosters[level] || [];
    if (!roster.length) {
      return `<div style="color:var(--text-tertiary);font-size:12px;padding:6px 0;">No players on file at ${escapeHtml(level)}.</div>`;
    }
    const rows = roster.map(pl => {
      const gradedClick = pl.player_key
        ? ` onclick="goToPlayer('${escapeHtml(pl.player_key)}');" style="cursor:pointer;"`
        : "";
      const nameCell = pl.player_key
        ? `<span style="color:var(--neon-cyan);">${escapeHtml(pl.fullName)}</span>`
        : escapeHtml(pl.fullName);
      const fvCell = pl.fv_label
        ? `<span class="fv-badge ${fvClass(pl.fv_label)} size-sm">${pl.fv_label}</span>`
        : `<span style="color:var(--text-tertiary);">—</span>`;
      return `<tr${gradedClick}>
        <td>${nameCell}</td>
        <td style="color:var(--text-secondary);">${escapeHtml(pl.position || "—")}</td>
        <td style="font-variant-numeric:tabular-nums;color:var(--text-secondary);">${pl.age != null ? pl.age.toFixed(1) : "—"}</td>
        <td style="text-align:center;">${fvCell}</td>
        <td style="color:var(--text-tertiary);font-size:11px;">${escapeHtml(pl.team_name || "")}</td>
      </tr>`;
    }).join("");
    return `<table class="detail-table"><thead><tr>
      <th>Player</th><th>Pos</th><th>Age</th><th style="text-align:center;">FV</th><th>Affiliate</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
  }

  const affilTabs = presentLevels.map(lvl => {
    const count = (orgRosters[lvl] || []).length;
    const graded = (orgRosters[lvl] || []).filter(p => p.fv_label).length;
    const active = lvl === defaultLevel ? " active" : "";
    return `<button class="chip level-tab${active}" data-level="${escapeHtml(lvl)}" type="button">${escapeHtml(lvl)} <span style="color:var(--text-tertiary);font-weight:400;">(${count}${graded ? `, ${graded}★` : ""})</span></button>`;
  }).join("");

  const affilPanels = presentLevels.map(lvl => `
    <div class="level-panel" data-level="${escapeHtml(lvl)}" style="display:${lvl === defaultLevel ? "block" : "none"};">
      ${levelTableHtml(lvl)}
    </div>`).join("");

  const affiliateSection = presentLevels.length ? `
    <div class="detail-title">Affiliate rosters
      <span class="detail-title-sub">★ = graded prospect</span>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">${affilTabs}</div>
    ${affilPanels}` : "";

  // "Graded prospects by level" — focused view that strips out the org
  // filler from affiliate rosters and shows only prospects with an FV
  // grade, grouped by affiliate level. Each prospect links back to its
  // detail page. Levels with no graded prospects are skipped entirely so
  // the section stays dense. MLB is intentionally excluded — graded
  // players on the MLB roster are graduates by definition and clutter
  // this view; the Affiliate-Rosters section below still shows them.
  const gradedByLevel = (() => {
    const blocks = [];
    const milbLevels = affilLevels.filter(lvl => lvl !== "MLB");
    for (const lvl of milbLevels) {
      const graded = (orgRosters[lvl] || []).filter(r => r.fv_label);
      if (!graded.length) continue;
      // Already sorted FV desc upstream (run_monthly sort key). Keep that.
      const items = graded.map(pl => {
        const click = pl.player_key
          ? ` onclick="goToPlayer('${escapeHtml(pl.player_key)}');" style="cursor:pointer;"`
          : "";
        return `<div class="graded-prospect-row"${click}>
          <span class="fv-badge ${fvClass(pl.fv_label)} size-sm">${pl.fv_label}</span>
          <span style="color:${pl.player_key ? "var(--neon-cyan)" : "var(--text-primary)"};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(pl.fullName)}</span>
          <span style="color:var(--text-tertiary);font-size:10px;white-space:nowrap;">${escapeHtml(pl.position || "—")}${pl.age != null ? ` · ${pl.age.toFixed(1)}` : ""}</span>
        </div>`;
      }).join("");
      blocks.push(`
        <div class="graded-level-block">
          <div class="graded-level-header">
            <span class="graded-level-name">${escapeHtml(lvl)}</span>
            <span class="graded-level-count">${graded.length}</span>
          </div>
          ${items}
        </div>`);
    }
    if (!blocks.length) {
      return `<div style="color:var(--text-tertiary);font-size:12px;">No graded prospects currently assigned to an affiliate.</div>`;
    }
    return `<div class="graded-by-level-grid">${blocks.join("")}</div>`;
  })();

  // Total count excludes MLB to match what the section actually shows.
  const totalGraded = affilLevels
    .filter(lvl => lvl !== "MLB")
    .reduce((acc, lvl) => acc + (orgRosters[lvl] || []).filter(r => r.fv_label).length, 0);
  const gradedSection = `
    <div class="detail-title">Graded prospects by level
      <span class="detail-title-sub">MiLB only · ${totalGraded} total · sorted by FV within each level</span>
    </div>
    ${gradedByLevel}`;

  // Acquisition filter chip bar — same as before but visually paired
  // with the acquisition-mix chart in the sidebar (which acts as a
  // legend). Filter state is shared with the main prospect list via
  // state.acqFilter.
  const ACQ_METHODS_FOR_FARM = [
    ["all",               "All"],
    ["draft",             "Draft"],
    ["international_fa",  "Intl FA"],
    ["trade",             "Trade"],
    ["waiver",            "Waiver"],
    ["rule_5",            "Rule 5"],
    ["free_agent",        "FA signing"],
    ["contract_purchase", "Purchase"],
  ];
  const acqTallies = {};
  for (const rp of rosterPlayersAll) {
    const m = (rp.current_acquisition || {}).method || "unknown";
    acqTallies[m] = (acqTallies[m] || 0) + 1;
  }
  // Per-roster tallies for the in-page level and position filters so
  // each chip can show "(N)" and we can dim/disable chips that would
  // narrow the roster to zero.
  const levelTallies = {};
  for (const rp of rosterPlayersAll) {
    const lvl = (rp.statline || {}).level || "_";
    levelTallies[lvl] = (levelTallies[lvl] || 0) + 1;
  }
  const posTallies = {};
  for (const rp of rosterPlayersAll) {
    const b = positionBucket(rp.position);
    if (b) posTallies[b] = (posTallies[b] || 0) + 1;
  }

  const FARM_LEVEL_FILTER = [
    ["all", "All"], ["MLB","MLB"], ["AAA","AAA"], ["AA","AA"], ["A+","A+"],
    ["A","A"], ["CPX","CPX"], ["DSL","DSL"],
  ];
  const FARM_POS_FILTER = [
    ["all","All"], ["C","C"], ["1B","1B"], ["INF","INF"], ["OF","OF"], ["P","P"],
  ];

  // Three chip strips stacked tight: acquisition method, level, position.
  // Each chip shows its tally so the user knows whether selecting it
  // will yield anything before clicking.
  const filterStrip = (label, opts, activeVal, dataAttr, tallies) => `
    <div style="display:flex;align-items:center;gap:6px;margin:6px 0 0;flex-wrap:wrap;">
      <span style="font-size:10px;color:var(--text-tertiary);letter-spacing:0.10em;text-transform:uppercase;margin-right:4px;min-width:50px;">${escapeHtml(label)}</span>
      ${opts.map(([val, lbl]) => {
        const n = val === "all" ? rosterPlayersAll.length : (tallies[val] || 0);
        const active = activeVal === val;
        const disabled = val !== "all" && n === 0;
        return `<button class="chip${active ? " active" : ""}" ${dataAttr}="${val}" type="button"${disabled ? ' disabled style="opacity:0.4;cursor:default;"' : ""}>
          ${escapeHtml(lbl)} <span style="color:var(--text-tertiary);font-weight:400;">(${n})</span>
        </button>`;
      }).join("")}
    </div>`;

  const acqFilterBar = filterStrip("Acquired", ACQ_METHODS_FOR_FARM,
    state.acqFilter, "data-farm-acq", acqTallies);
  const levelFilterBar = filterStrip("Level", FARM_LEVEL_FILTER,
    state.levelFilter, "data-farm-level", levelTallies);
  const posFilterBar = filterStrip("Position", FARM_POS_FILTER,
    state.posFilter, "data-farm-pos", posTallies);

  root.innerHTML = header + tilesHtml + `
    <div class="farm-detail-grid">
      ${leftRailHtml}
      <div>
        <div class="detail-title flush">${(state.formWindow || "3y")} development vs median farm <span class="detail-title-sub">prospect FV growth above median, with trades / draft / IFA acquisitions excluded · graduations neutral</span></div>
        <div class="filter-bar" style="margin-bottom:8px;padding:6px 10px;">
          <span class="filter-label">Window</span>
          <button class="chip${(state.formWindow || "3y") === "1y" ? " active" : ""}" data-form-window="1y" type="button">1y</button>
          <button class="chip${(state.formWindow || "3y") === "3y" ? " active" : ""}" data-form-window="3y" type="button">3y</button>
          <button class="chip${(state.formWindow || "3y") === "5y" ? " active" : ""}" data-form-window="5y" type="button">5y</button>
        </div>
        ${makeFarmGrowthChart(org, ((DATA.farm_trajectory_medians || {})[state.formWindow || "3y"] ?? 0), state.formWindow || "3y")}
        <div class="detail-title">Position depth chart <span class="detail-title-sub">Tracked prospects bucketed by primary position · sorted by FV</span></div>
        ${makePositionDepthChart(rosterPlayersAll)}
        <div class="detail-title">Acquisition spending <span class="detail-title-sub">Bonus pool dollars — International FA vs Draft, 2021-present</span></div>
        ${makeSpendingBlock(org)}
        <div class="detail-title">Tracked prospects (${rosterPlayers.length}${
          [
            state.acqFilter !== "all" ? `${escapeHtml(ACQ_METHODS_FOR_FARM.find(m => m[0] === state.acqFilter)?.[1] || state.acqFilter)}` : null,
            state.levelFilter !== "all" ? escapeHtml(state.levelFilter) : null,
            state.posFilter !== "all" ? escapeHtml(state.posFilter) : null,
          ].filter(Boolean).length ? " · filtered " + [
            state.acqFilter !== "all" ? `${escapeHtml(ACQ_METHODS_FOR_FARM.find(m => m[0] === state.acqFilter)?.[1] || state.acqFilter)}` : null,
            state.levelFilter !== "all" ? escapeHtml(state.levelFilter) : null,
            state.posFilter !== "all" ? escapeHtml(state.posFilter) : null,
          ].filter(Boolean).join(" / ") : ""
        })</div>
        ${acqFilterBar}
        ${levelFilterBar}
        ${posFilterBar}
        ${rosterHeader}${rosterRows}
        ${gradedSection}
        ${affiliateSection}
        ${makeFarmTransactionsSection(allEventsForOrg, orgCode)}
      </div>
      <div class="farm-side">${sidebarHtml}</div>
    </div>`;

  // Wire affiliate level tabs (vanilla — toggle visibility, no re-render).
  document.querySelectorAll("#farm-detail-body .level-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#farm-detail-body .level-tab").forEach(b =>
        b.classList.toggle("active", b === btn));
      const lvl = btn.dataset.level;
      document.querySelectorAll("#farm-detail-body .level-panel").forEach(panel => {
        panel.style.display = panel.dataset.level === lvl ? "block" : "none";
      });
    });
  });
  // Development-window chips above the farm-detail growth chart. Each
  // farm-detail render produces a fresh chip row, so we re-attach
  // listeners scoped to #farm-detail-body each time. Shares
  // `state.formWindow` with the Farm-list chips so the choice persists
  // across tab switches.
  document.querySelectorAll("#farm-detail-body [data-form-window]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.formWindow = btn.dataset.formWindow;
      // Mirror the active class on the Farm-list chips too so the UI
      // stays in sync if the user navigates back.
      document.querySelectorAll("[data-form-window]").forEach(b =>
        b.classList.toggle("active", b.dataset.formWindow === state.formWindow));
      renderFarmDetail(orgCode);
      syncToURL();
    });
  });
  // Acquisition / level / position filter chips on the farm detail
  // page. All three share state with the main prospect list so toggling
  // chips here also reshapes the main list when the user navigates back.
  // Each click re-renders the entire farm detail so tallies + active
  // states stay consistent.
  document.querySelectorAll("#farm-detail-body [data-farm-acq]").forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener("click", () => {
      state.acqFilter = btn.dataset.farmAcq;
      renderFarmDetail(orgCode);
      syncToURL();
    });
  });
  document.querySelectorAll("#farm-detail-body [data-farm-level]").forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener("click", () => {
      state.levelFilter = btn.dataset.farmLevel;
      renderFarmDetail(orgCode);
      syncToURL();
    });
  });
  document.querySelectorAll("#farm-detail-body [data-farm-pos]").forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener("click", () => {
      state.posFilter = btn.dataset.farmPos;
      renderFarmDetail(orgCode);
      syncToURL();
    });
  });
  // Farm transaction-history filter chips (kind + direction). Both
  // share state via state.farmTxKind / state.farmTxDir so the URL
  // captures the active view.
  document.querySelectorAll("#farm-detail-body [data-farm-tx-kind]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.farmTxKind = btn.dataset.farmTxKind;
      renderFarmDetail(orgCode);
      syncToURL();
    });
  });
  document.querySelectorAll("#farm-detail-body [data-farm-tx-dir]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.farmTxDir = btn.dataset.farmTxDir;
      renderFarmDetail(orgCode);
      syncToURL();
    });
  });
}

function render() {
  const sections = {
    active:       "active-section",
    spotlights:   "spotlights-section",
    traded:       "traded-section",
    injured:      "injured-section",
    graduates:    "graduates-section",
    farm:         "farm-section",
    leaderboards: "leaderboards-section",
    player:       "player-detail-section",
    farmDetail:   "farm-detail-section",
  };

  // Detail view takes over: hide tabs, filter bar, search; show one section.
  const isDetail = !!state.view;
  const sectionTabs = document.getElementById("section-tabs");
  if (sectionTabs) sectionTabs.style.display = isDetail ? "none" : "";
  const searchBar = document.querySelector(".search-bar");
  if (searchBar) searchBar.style.display = isDetail ? "none" : "";
  const filterBar = document.getElementById("filter-bar");
  const filterToggleBtn = document.getElementById("filter-toggle");
  const usesFilters = !isDetail && (state.section === "active" || state.section === "traded");
  if (filterBar) {
    // Style.display set to "" lets the CSS media query take over so
    // the mobile collapse behavior keeps working; "none" forces hidden
    // when on a tab that doesn't use these filters.
    filterBar.style.display = usesFilters ? "" : "none";
  }
  if (filterToggleBtn) {
    filterToggleBtn.style.display = usesFilters ? "" : "none";
  }

  let active;
  if (state.view && state.view.type === "player") active = "player";
  else if (state.view && state.view.type === "farm") active = "farmDetail";
  else active = state.section;

  for (const [name, id] of Object.entries(sections)) {
    const el = document.getElementById(id);
    if (el) el.style.display = name === active ? "block" : "none";
  }

  // Slice gating: views that traverse graduates / inactive / farm rosters
  // wait for the corresponding sidecar before rendering. The boot path
  // kicks off these loads on first paint so latency is usually masked.
  // The loading message goes into the section's *body* div (which the
  // render functions also write to) — NEVER the section root, because
  // overwriting the section root destroys the filter-bar / rows-div
  // template that the next render() call expects to find.
  const needsGrad = active === "graduates"
      || active === "injured"       // injured rolls graduates + inactive into the pool
      || (active === "player" && !(DATA.players || []).some(p => p.player_key === state.view.key));
  const needsRosters = active === "farmDetail";
  const needsInactive = active === "injured"
      || (active === "player" && !(DATA.players || []).some(p => p.player_key === state.view.key));
  // Inner body element per section — must match where the per-section
  // render function writes its main content.
  const SECTION_BODY = {
    graduates:  "grad-rows",
    injured:    "injured-rows",
    farmDetail: "farm-detail-body",
    player:     "player-detail-body",
  };
  const showLoading = (msg) => {
    const id = SECTION_BODY[active];
    if (!id) return;
    const target = document.getElementById(id);
    if (target) target.innerHTML = `<div class="state-message">${msg}</div>`;
  };

  if (needsGrad && DATA._slices && DATA._slices.graduates && !DATA.graduates.length) {
    showLoading("Loading graduates…");
    loadSlice("graduates").then(render);
    return;
  }
  if (needsInactive && DATA._slices && DATA._slices.inactive
      && !DATA.inactive.length) {
    // Inactive is small; quiet wait — no loading message.
    loadSlice("inactive").then(render);
    return;
  }
  if (needsRosters && DATA._slices && DATA._slices.rosters_by_org
      && Object.keys(DATA.rosters_by_org).length === 0) {
    showLoading("Loading farm rosters…");
    loadSlice("rosters_by_org").then(render);
    return;
  }

  if (active === "player")       renderPlayerDetail(state.view.key);
  else if (active === "farmDetail") renderFarmDetail(state.view.org);
  else if (active === "active")     renderActives();
  else if (active === "spotlights") renderSpotlights();
  else if (active === "traded")     renderRecentlyTraded();
  else if (active === "injured")    renderInjured();
  else if (active === "graduates")  renderGraduates();
  else if (active === "farm")       renderFarmSystems();
  else if (active === "leaderboards") renderLeaderboards();
  decorateA11yRows();
  updateMeta();
  syncToURL();
}

// Phase 4 a11y: every list/grid row that the delegated click handler
// treats as activatable also needs tabindex + role so keyboard users
// can tab to it, AND a screen reader announces it as a button. We do
// this in one DOM walk after each render rather than threading the
// attrs through every renderXxx() function.
function decorateA11yRows() {
  document.querySelectorAll(".player-row[data-key], .spotlight-row[data-key], .grad-row[data-key], .farm-row[data-org], .pos-depth-card[data-key]").forEach(row => {
    if (!row.hasAttribute("tabindex")) row.setAttribute("tabindex", "0");
    if (!row.hasAttribute("role"))     row.setAttribute("role", "button");
  });
}

// Wire up a "pick exactly one chip" toggle group. Used by every
// per-tab sort/bucket selector — graduates, injured, spotlights, farm
// rank, form window. Each call swaps `active` between siblings, writes
// the chip's value to `state[stateKey]`, runs `onChange(value, btn)`,
// and syncs the URL. Spotlights also clears the detail view, hence the
// `clearView` option.
function attachChipGroup(attr, stateKey, onChange, opts = {}) {
  const { clearView = false } = opts;
  const sel = `[data-${attr}]`;
  const dsKey = attr.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
  document.querySelectorAll(sel).forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(sel).forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state[stateKey] = btn.dataset[dsKey];
      if (clearView) state.view = null;
      onChange(state[stateKey], btn);
      syncToURL();
    });
  });
}

// ============================================================
// COMPARISON CART
// ============================================================
// Lightweight client-side cart that pins up to 3 prospect keys in
// localStorage. Lets a user open any list/detail, hit "+ Compare", and
// review the side-by-side panel from anywhere. Persists across reload.
const COMPARE_KEY = "prospect-tracker.compare";
const COMPARE_MAX = 3;
// Farms get their own localStorage key + max so a user can pin 3 prospects
// AND 3 farm systems without one displacing the other. Render path joins
// them into a single side-panel with two sections.
const FARM_COMPARE_KEY = "prospect-tracker.farm-compare";
const FARM_COMPARE_MAX = 3;

function compareLoad() {
  try {
    const raw = localStorage.getItem(COMPARE_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr.slice(0, COMPARE_MAX) : [];
  } catch { return []; }
}
function compareSave(keys) {
  try { localStorage.setItem(COMPARE_KEY, JSON.stringify(keys)); } catch {}
}
function compareHas(key) { return compareLoad().includes(key); }
function compareToggle(key) {
  let keys = compareLoad();
  if (keys.includes(key)) {
    keys = keys.filter(k => k !== key);
  } else if (keys.length < COMPARE_MAX) {
    keys.push(key);
  }
  compareSave(keys);
  renderCompareCart();
}

function farmCompareLoad() {
  try {
    const raw = localStorage.getItem(FARM_COMPARE_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr.slice(0, FARM_COMPARE_MAX) : [];
  } catch { return []; }
}
function farmCompareSave(orgs) {
  try { localStorage.setItem(FARM_COMPARE_KEY, JSON.stringify(orgs)); } catch {}
}
function farmCompareHas(org) { return farmCompareLoad().includes(org); }
function farmCompareToggle(org) {
  let orgs = farmCompareLoad();
  if (orgs.includes(org)) {
    orgs = orgs.filter(o => o !== org);
  } else if (orgs.length < FARM_COMPARE_MAX) {
    orgs.push(org);
  }
  farmCompareSave(orgs);
  renderCompareCart();
}

// Refresh the floating button + panel contents. Called on boot, every
// compare toggle, and after a re-render (so the player-detail "in cart"
// state stays in sync with the cart's own state).
// Relative Production Score (RPS) — quantifies how far ahead of their
// age + level a prospect is. Composite of:
//   - performance vs level (ops_plus_level − 100 for hitters,
//     100 − era_minus_level for pitchers, both being a "% above level
//     average" delta)
//   - age vs level (each year young = +10 points; old = −10 points)
// Volume-gated (skip players under min sample). Returns null when we
// can't compute meaningfully.
function computeRelProd(p) {
  if (!p) return null;
  const sl = p.statline || {};
  const avl = p.age_vs_level || {};
  const ageAdj = avl.diff != null ? -avl.diff * 10 : 0;
  if (sl.is_pitcher) {
    if (sl.era_minus_level == null) return null;
    const ip = Number(sl.ip || 0);
    if (ip < 15) return null;
    const perfAdj = 100 - sl.era_minus_level;
    return {
      score: Math.round(perfAdj + ageAdj),
      perf: Math.round(perfAdj),
      age: Math.round(ageAdj),
      driver: `ERA- ${sl.era_minus_level} · ${avl.diff != null ? `${avl.diff > 0 ? "+" : ""}${avl.diff.toFixed(1)}y vs ${sl.level || "level"}` : "age unknown"}`,
    };
  } else {
    if (sl.ops_plus_level == null) return null;
    const games = Number(sl.games || 0);
    if (games < 15) return null;
    const perfAdj = sl.ops_plus_level - 100;
    return {
      score: Math.round(perfAdj + ageAdj),
      perf: Math.round(perfAdj),
      age: Math.round(ageAdj),
      driver: `OPS+ ${sl.ops_plus_level} · ${avl.diff != null ? `${avl.diff > 0 ? "+" : ""}${avl.diff.toFixed(1)}y vs ${sl.level || "level"}` : "age unknown"}`,
    };
  }
}

function rpsPillHTML(rps) {
  if (rps == null) {
    return `<span class="rps-pill is-null" title="Insufficient sample to compute Relative Production Score (need 15+ games for hitters, 15+ IP for pitchers, plus age-vs-level data).">RPS —</span>`;
  }
  const cls = rps.score > 5 ? "is-pos" : rps.score < -5 ? "is-neg" : "is-neutral";
  const sign = rps.score > 0 ? "+" : "";
  const title = `Relative Production Score · performance ${rps.perf >= 0 ? "+" : ""}${rps.perf} · age ${rps.age >= 0 ? "+" : ""}${rps.age} · ${rps.driver}`;
  return `<span class="rps-pill ${cls}" title="${escapeHtml(title)}">RPS ${sign}${rps.score}</span>`;
}

// Per-player colors used by the overlay chart + legend dots. Cycles
// through three distinct hues so 3-prospect comparisons stay readable.
const COMPARE_COLORS = ["var(--neon-cyan)", "var(--neon-violet)", "var(--neon-amber)"];

// Multi-player FV-history overlay. One SVG with one polyline per
// pinned prospect. Each prospect is in their assigned compare color.
// Shares the X-axis (date range across ALL prospects) and Y-axis
// (FV 20-80).
function makeFvOverlayChart(players) {
  if (!players.length) return "";
  // Common time range covers every player's points.
  let minT = Infinity, maxT = -Infinity;
  for (const p of players) {
    for (const pt of (p.points || [])) {
      const t = new Date(pt.snapshot_date).getTime();
      if (isNaN(t)) continue;
      if (t < minT) minT = t;
      if (t > maxT) maxT = t;
    }
  }
  if (!isFinite(minT) || !isFinite(maxT) || minT === maxT) {
    return `<div style="color:var(--text-tertiary);font-size:11px;padding:8px;">Not enough FV history for an overlay chart.</div>`;
  }
  const W = 720, H = 140, PAD = 8, Y_LABEL_W = 16, LABEL_H = 12;
  const CHART_BOTTOM = H - LABEL_H - PAD;
  const X_LEFT = PAD + Y_LABEL_W;
  const timeSpan = maxT - minT;
  const xScale = d => X_LEFT + ((new Date(d).getTime() - minT) / timeSpan) * (W - X_LEFT - PAD);
  const yScale = fv => CHART_BOTTOM - ((fv - 20) / (80 - 20)) * (CHART_BOTTOM - PAD);

  // Y-axis labels + a reference line at FV 50.
  const yAxis = `
    <text x="${PAD}" y="${(yScale(80) + 3).toFixed(1)}" font-size="9" fill="var(--text-tertiary)" font-family="var(--font-mono)">80</text>
    <text x="${PAD}" y="${(yScale(50) + 3).toFixed(1)}" font-size="9" fill="var(--text-tertiary)" font-family="var(--font-mono)">50</text>
    <text x="${PAD}" y="${(yScale(20) + 3).toFixed(1)}" font-size="9" fill="var(--text-tertiary)" font-family="var(--font-mono)">20</text>
    <line x1="${X_LEFT}" y1="${yScale(50).toFixed(1)}" x2="${W - PAD}" y2="${yScale(50).toFixed(1)}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3,3"/>`;

  // Year gridlines + labels along the X axis.
  const yearSvg = [];
  const startYear = new Date(minT).getFullYear();
  const endYear   = new Date(maxT).getFullYear();
  for (let yr = startYear; yr <= endYear + 1; yr++) {
    const yrT = Date.UTC(yr, 0, 1);
    if (yrT <= minT || yrT >= maxT) continue;
    const x = xScale(new Date(yrT).toISOString().split("T")[0]).toFixed(1);
    yearSvg.push(
      `<line x1="${x}" y1="${PAD}" x2="${x}" y2="${CHART_BOTTOM}" stroke="var(--border)" stroke-width="0.4" stroke-dasharray="2,3"/>`,
      `<text x="${x}" y="${H - 1}" font-size="9" fill="var(--text-tertiary)" text-anchor="middle">${yr}</text>`
    );
  }

  // One polyline + endpoint dots per player.
  const lines = players.map((p, i) => {
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    const pts = (p.points || []).map(pt => `${xScale(pt.snapshot_date).toFixed(1)},${yScale(pt.consensus_fv_raw).toFixed(1)}`).join(" ");
    const last = p.points && p.points.length ? p.points[p.points.length - 1] : null;
    const endDot = last
      ? `<circle cx="${xScale(last.snapshot_date).toFixed(1)}" cy="${yScale(last.consensus_fv_raw).toFixed(1)}" r="3.5" fill="${color}"><title>${escapeHtml(p.player_name)}: FV ${last.consensus_fv_label} (${last.snapshot_date})</title></circle>`
      : "";
    return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6"/>${endDot}`;
  }).join("");

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block;overflow:visible;">
    ${yAxis}
    ${yearSvg.join("")}
    ${lines}
  </svg>`;
}

// Head-to-head stat table. Each row is one stat; one column per
// pinned player. Best value in green, worst in red, neutral
// otherwise. Hitters and pitchers get different stat lists; mixed
// rosters (hitter + pitcher pinned together) fall back to FV / age /
// level / ETA rows only.
function makeCompareStatTable(players) {
  if (!players.length) return "";
  // Decide which stat list applies based on the majority side. A
  // mixed pinning (e.g., one hitter + one pitcher) shows the universal
  // rows only.
  const sides = players.map(p => (p.statline || {}).is_pitcher ? "pit" : "hit");
  const uniqSides = new Set(sides);
  const universal = [
    ["Age",          p => p.age != null ? p.age.toFixed(1) : null,    { hi: false, fmt: v => v.toFixed(1) }],
    ["Current FV",   p => p.fv_close,                                 { hi: true,  fmt: v => String(Math.round(v)) }],
    ["Level",        p => (p.statline || {}).level || null,           { categorical: true }],
    ["ETA",          p => (p.eta || {}).year || null,                 { hi: false, fmt: v => String(v) }],
    ["Games (PA/IP volume)", p => {
      const sl = p.statline || {};
      return sl.is_pitcher ? (sl.ip != null ? Number(sl.ip) : null) : (sl.games != null ? sl.games : null);
    }, { hi: true, fmt: v => v.toFixed ? v.toFixed(1) : String(v) }],
  ];
  const hitRows = [
    ["AVG",  p => (p.statline || {}).avg,   { hi: true,  fmt: v => v }],
    ["OBP",  p => (p.statline || {}).obp,   { hi: true,  fmt: v => v }],
    ["SLG",  p => (p.statline || {}).slg,   { hi: true,  fmt: v => v }],
    ["OPS",  p => (p.statline || {}).ops,   { hi: true,  fmt: v => v }],
    ["ISO",  p => (p.statline || {}).iso,   { hi: true,  fmt: v => (typeof v === "number" ? v.toFixed(3).replace(/^0/, "") : v) }],
    ["HR",   p => (p.statline || {}).hr,    { hi: true,  fmt: v => String(v) }],
    ["SB",   p => (p.statline || {}).sb,    { hi: true,  fmt: v => String(v) }],
    ["BB%",  p => (p.statline || {}).bb_pct,{ hi: true,  fmt: v => v.toFixed(1) + "%" }],
    ["K%",   p => (p.statline || {}).k_pct, { hi: false, fmt: v => v.toFixed(1) + "%" }],
    ["OPS+ (vs level)", p => (p.statline || {}).ops_plus_level, { hi: true, fmt: v => String(Math.round(v)) }],
  ];
  const pitRows = [
    ["ERA",  p => (p.statline || {}).era,    { hi: false, fmt: v => v }],
    ["WHIP", p => (p.statline || {}).whip,   { hi: false, fmt: v => (typeof v === "number" ? v.toFixed(2) : v) }],
    ["IP",   p => (p.statline || {}).ip,     { hi: true,  fmt: v => (typeof v === "number" ? v.toFixed(1) : v) }],
    ["K/9",  p => (p.statline || {}).k_per_9, { hi: true, fmt: v => (typeof v === "number" ? v.toFixed(2) : v) }],
    ["BB/9", p => (p.statline || {}).bb_per_9,{ hi: false, fmt: v => (typeof v === "number" ? v.toFixed(2) : v) }],
    ["ERA- (vs level)", p => (p.statline || {}).era_minus_level, { hi: false, fmt: v => String(Math.round(v)) }],
  ];
  // Group headers.
  const sections = [];
  sections.push(["Identity / FV", universal]);
  if (uniqSides.size === 1) {
    sections.push(sides[0] === "pit" ? ["Pitching", pitRows] : ["Hitting", hitRows]);
  } else {
    sections.push(["Stats", []]);  // mixed pinning — no comparable stat rows
  }
  // Build header.
  const headerCols = players.map((p, i) => {
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    return `<th><span class="csbs-legend-dot" style="background:${color};"></span>${escapeHtml(p.player_name)}</th>`;
  }).join("");
  const header = `<thead><tr><th>Stat</th>${headerCols}</tr></thead>`;
  // Build body.
  const renderRow = ([label, getValue, opts]) => {
    const rawVals = players.map(getValue);
    const numericVals = rawVals.map(v => v == null ? null : Number(v)).filter(v => v != null && !isNaN(v));
    let bestIdx = -1, worstIdx = -1;
    if (!opts.categorical && numericVals.length >= 2) {
      // Find indices of best/worst non-null numeric values.
      let bestVal = opts.hi ? -Infinity : Infinity;
      let worstVal = opts.hi ? Infinity : -Infinity;
      rawVals.forEach((v, i) => {
        if (v == null) return;
        const n = Number(v);
        if (isNaN(n)) return;
        if (opts.hi ? n > bestVal : n < bestVal) { bestVal = n; bestIdx = i; }
        if (opts.hi ? n < worstVal : n > worstVal) { worstVal = n; worstIdx = i; }
      });
      // If best == worst (all equal), drop highlighting.
      if (bestVal === worstVal) { bestIdx = -1; worstIdx = -1; }
    }
    const cells = rawVals.map((v, i) => {
      if (v == null) return `<td style="color:var(--text-tertiary);">—</td>`;
      let display = v;
      if (opts.fmt && !opts.categorical) {
        try { display = opts.fmt(typeof v === "number" ? v : Number(v)); }
        catch { display = String(v); }
      }
      const cls = i === bestIdx ? "is-best" : i === worstIdx ? "is-worst" : "";
      return `<td class="${cls}">${escapeHtml(String(display))}</td>`;
    }).join("");
    return `<tr><td>${escapeHtml(label)}</td>${cells}</tr>`;
  };
  const body = sections.map(([title, rows]) => {
    const groupHeader = `<tr class="is-group-header"><td colspan="${players.length + 1}">${escapeHtml(title)}</td></tr>`;
    if (!rows.length) return groupHeader + `<tr><td colspan="${players.length + 1}" style="color:var(--text-tertiary);font-size:10px;">Mixed pinning — pin only hitters or only pitchers to compare side-specific stats.</td></tr>`;
    return groupHeader + rows.map(renderRow).join("");
  }).join("");
  return `<table class="compare-stat-table">${header}<tbody>${body}</tbody></table>`;
}

// Side-by-side cart layout — used when 2+ players are pinned.
function makeCompareSideBySide(players) {
  // Per-player header row with name, FV badge, RPS pill, remove btn.
  const cols = `repeat(${players.length}, minmax(0, 1fr))`;
  const heads = players.map((p, i) => {
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    const fvLabel = p.fv_close != null ? Math.round(p.fv_close) : "—";
    const sl = p.statline || {};
    const ageBits = [];
    if (p.age != null) ageBits.push(`${p.age.toFixed(1)}yo`);
    if (sl.level) ageBits.push(sl.level);
    if (p.org) ageBits.push(p.org);
    const rps = computeRelProd(p);
    return `<div class="csbs-player" style="--csbs-color:${color};">
      <button class="csbs-remove" data-compare-remove="${escapeHtml(p.player_key)}" type="button" title="Remove from compare">×</button>
      <div style="display:flex;align-items:flex-start;gap:8px;min-width:0;">
        <span onclick="closeCompareAndGo('${escapeHtml(p.player_key)}');" style="cursor:pointer;flex-shrink:0;">${headshotHTML(p, 56)}</span>
        <div style="min-width:0;flex:1;">
          <div class="csbs-name" onclick="closeCompareAndGo('${escapeHtml(p.player_key)}');">${escapeHtml(p.player_name)}
            <span class="fv-badge ${fvClass(String(fvLabel))} size-sm" style="margin-left:6px;" title="${escapeHtml(fvBadgeTooltip(p))}">${fvLabel}</span>
          </div>
          <div class="csbs-meta">${escapeHtml(ageBits.join(" · ")) || "—"}</div>
          ${rpsPillHTML(rps)}
        </div>
      </div>
    </div>`;
  }).join("");

  const head = `<div class="compare-sbs-head" style="grid-template-columns:${cols};">${heads}</div>`;
  const chart = `<div class="compare-overlay-chart"><div style="font-size:9px;color:var(--text-tertiary);letter-spacing:0.08em;text-transform:uppercase;font-weight:700;margin-bottom:4px;">FV history · overlay</div>${makeFvOverlayChart(players)}</div>`;
  const table = makeCompareStatTable(players);
  // RPS summary row — repeat each player's score + driver caption.
  const rpsRows = players.map((p, i) => {
    const rps = computeRelProd(p);
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    if (!rps) {
      return `<div><span class="csbs-legend-dot" style="background:${color};"></span><strong>${escapeHtml(p.player_name)}</strong> <span class="crps-driver">RPS unavailable — insufficient sample</span></div>`;
    }
    const arrow = rps.score >= 0 ? "↑" : "↓";
    return `<div><span class="csbs-legend-dot" style="background:${color};"></span><strong>${escapeHtml(p.player_name)}</strong> ${arrow} ${rps.score >= 0 ? "+" : ""}${rps.score} <span class="crps-driver">(${escapeHtml(rps.driver)})</span></div>`;
  }).join("");
  const summary = `<div class="compare-rps-row">
    <div style="font-family:var(--font-sans);font-size:9px;color:var(--text-tertiary);letter-spacing:0.10em;text-transform:uppercase;font-weight:700;margin-bottom:6px;">Relative production score · how far ahead of age + level</div>
    ${rpsRows}
  </div>`;
  return head + chart + table + summary;
}

// Build the side-by-side farm-systems block for the compare cart.
// Mirrors the prospect csbs grid: one column per pinned farm, IFA/Draft
// donut + headline FV-tier strip + farm grades + top prospect.
function makeFarmCompareSideBySide(farms) {
  const cols = `repeat(${farms.length}, minmax(0, 1fr))`;
  const heads = farms.map((o, i) => {
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    const grade = (o.grades && o.grades.overall) || "—";
    const tp = o.top_prospect;
    const tpHtml = tp
      ? `<div style="font-size:11px;color:var(--text-secondary);margin-top:3px;">Top: <span style="color:var(--text-primary);">${escapeHtml(tp.player_name || "—")}</span>${tp.fv ? ` <span class="fv-badge size-sm ${fvClass(String(tp.fv))}" style="margin-left:4px;">${tp.fv}</span>` : ""}</div>`
      : "";
    return `<div class="csbs-player" style="--csbs-color:${color};">
      <button class="csbs-remove" data-farm-compare-remove="${escapeHtml(o.org)}" type="button" title="Remove from compare">×</button>
      <div style="display:flex;align-items:flex-start;gap:8px;min-width:0;">
        <span style="flex-shrink:0;">${teamLogoHTML(o.org, "lg", fullOrgName(o.org))}</span>
        <div style="min-width:0;flex:1;">
          <div class="csbs-name" onclick="closeCompareAndGoFarm('${escapeHtml(o.org)}');">${escapeHtml(fullOrgName(o.org))}
            <span style="margin-left:6px;font-family:var(--font-mono);color:${gradeColor(grade)};font-weight:700;">${escapeHtml(grade)}</span>
          </div>
          <div class="csbs-meta">#${o.farm_rank ?? "—"} of 30 · ${o.count ?? 0} tracked · Total FV ${o.total_fv != null ? o.total_fv.toFixed(1) : "—"}</div>
          ${tpHtml}
        </div>
      </div>
    </div>`;
  }).join("");

  const head = `<div class="compare-sbs-head" style="grid-template-columns:${cols};">${heads}</div>`;

  // Stat-table: each row is a farm metric, each column is a farm. Reuses
  // the existing .compare-stat-table styles so the visual feel matches
  // the prospect compare table.
  const rows = [
    ["Farm rank",        o => o.farm_rank != null ? `#${o.farm_rank}` : "—"],
    ["Total FV",         o => o.total_fv != null ? o.total_fv.toFixed(1) : "—"],
    ["Prospects tracked", o => String(o.count ?? 0)],
    ["Avg age",          o => o.avg_age != null ? o.avg_age.toFixed(1) : "—"],
    ["Young-for-level",  o => String(o.very_young_count ?? 0)],
    ["Top-end grade",    o => (o.grades && o.grades.top_end) || "—"],
    ["Depth grade",      o => (o.grades && o.grades.depth) || "—"],
    ["Trajectory grade", o => (o.grades && o.grades.trajectory) || "—"],
    ["Grad pipeline",    o => (o.grades && o.grades.grad) || "—"],
    ["Stock ▲/▼",        o => `${o.stock_up || 0} ▲ · ${o.stock_down || 0} ▼`],
  ];
  const tableRows = rows.map(([label, fn]) =>
    `<tr><th>${label}</th>${farms.map(o => `<td>${escapeHtml(String(fn(o)))}</td>`).join("")}</tr>`
  ).join("");
  const table = `<table class="compare-stat-table" style="grid-template-columns:120px ${cols.replace("repeat(", "").replace(", minmax(0, 1fr))", "")};margin-top:8px;width:100%;border-collapse:collapse;">
    <tbody>${tableRows}</tbody></table>`;
  const donutRow = `<div style="display:grid;grid-template-columns:${cols};gap:10px;margin-top:10px;">
    ${farms.map(o => `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">${makeSpendingDonut(o, 64)}<div style="font-size:9px;color:var(--text-tertiary);letter-spacing:0.06em;">3-yr spend mix</div></div>`).join("")}
  </div>`;
  return head + donutRow + table;
}

function makeFarmCompareSingleCard(o) {
  const grade = (o.grades && o.grades.overall) || "—";
  const tp = o.top_prospect;
  const tpHtml = tp
    ? `<div class="cc-stat" style="margin-top:6px;">Top: <span style="color:var(--text-primary);">${escapeHtml(tp.player_name || "—")}</span>${tp.fv ? ` <span class="fv-badge size-sm ${fvClass(String(tp.fv))}" style="margin-left:4px;">${tp.fv}</span>` : ""}</div>`
    : "";
  return `<div class="compare-card" style="${orgStripe(o.org)}">
    <div style="display:flex;gap:10px;align-items:flex-start;min-width:0;">
      <span onclick="closeCompareAndGoFarm('${escapeHtml(o.org)}');" style="cursor:pointer;flex-shrink:0;">${teamLogoHTML(o.org, "lg", fullOrgName(o.org))}</span>
      <div style="min-width:0;flex:1;">
        <div class="player-name" style="cursor:pointer;" onclick="closeCompareAndGoFarm('${escapeHtml(o.org)}');">${escapeHtml(fullOrgName(o.org))}
          <span style="margin-left:6px;font-family:var(--font-mono);color:${gradeColor(grade)};font-weight:700;">${escapeHtml(grade)}</span>
        </div>
        <div class="cc-stat" style="margin-top:2px;color:var(--text-tertiary);">#${o.farm_rank ?? "—"} of 30 · ${o.count ?? 0} prospects · Total FV ${o.total_fv != null ? o.total_fv.toFixed(1) : "—"}</div>
        ${tpHtml}
        <div class="cc-stat" style="margin-top:6px;color:var(--text-tertiary);">Pin a second farm system to compare side-by-side.</div>
      </div>
    </div>
    <button class="cc-remove" data-farm-compare-remove="${escapeHtml(o.org)}" type="button">remove</button>

function renderCompareCart() {
  const keys = compareLoad();
  const farmKeys = farmCompareLoad();
  const totalCount = keys.length + farmKeys.length;
  const toggle = document.getElementById("compare-toggle");
  const count  = document.getElementById("compare-count");
  // Hide the floating button entirely when nothing's pinned; visible
  // (full opacity) the moment the user adds their first prospect or farm.
  if (toggle) toggle.classList.toggle("is-empty-hidden", totalCount === 0);
  if (count)  count.textContent = totalCount;
  // Sync any "Add to compare" buttons on the current page (prospects).
  document.querySelectorAll(".compare-add-btn[data-compare-key]").forEach(btn => {
    const isIn = keys.includes(btn.dataset.compareKey);
    btn.classList.toggle("is-in", isIn);
    if (btn.classList.contains("is-compact")) {
      btn.textContent = isIn ? "✓" : "+";
      btn.title = isIn ? "Remove from compare" : "Add to compare";
    } else {
      btn.textContent = isIn ? "✓ In compare" : "+ Add to compare";
    }
  });
  // Same loop for farm-compare buttons (data-farm-compare-key).
  document.querySelectorAll(".compare-add-btn[data-farm-compare-key]").forEach(btn => {
    const isIn = farmKeys.includes(btn.dataset.farmCompareKey);
    btn.classList.toggle("is-in", isIn);
    if (btn.classList.contains("is-compact")) {
      btn.textContent = isIn ? "✓" : "+";
      btn.title = isIn ? "Remove farm from compare" : "Add farm to compare";
    }
  });
  const body = document.getElementById("compare-body");
  if (!body) return;
  if (!totalCount) {
    body.innerHTML = `<div style="color:var(--text-tertiary);font-size:13px;padding:8px 4px;">No prospects or farm systems pinned yet. Tap "+ Add to compare" on any list or detail view.</div>`;
    return;
  }
  // Resolve every pinned key to a full player object (or render a
  // stub if the pin is stale — player no longer in current data).
  const players = [];
  const stubs = [];
  for (const k of keys) {
    const p = findPlayer(k);
    if (p) players.push(p);
    else   stubs.push(k);
  }
  const farms = [];
  const farmStubs = [];
  for (const o of farmKeys) {
    const f = findOrg(o);
    if (f) farms.push(f);
    else   farmStubs.push(o);
  }

  let html = "";

  // Players section — keep the existing 2+ side-by-side / 1 single-card
  // split so behavior matches prior versions.
  if (players.length || stubs.length) {
    const stubHTML = stubs.map(k => `<div class="compare-card"><div style="color:var(--text-tertiary);">Player "${escapeHtml(k)}" not in current data.</div><button class="cc-remove" data-compare-remove="${escapeHtml(k)}">remove</button></div>`).join("");
    if (players.length >= 2) {
      html += `<div class="detail-title flush no-rule" style="font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-tertiary);">Prospects · ${players.length}</div>`;
      html += makeCompareSideBySide(players) + stubHTML;
    } else if (players.length === 1) {
      const p = players[0];
      const sl = p.statline || {};
      const slashLine = sl.is_pitcher
        ? `${sl.era ?? "—"} ERA · ${sl.ip ?? "—"} IP · K/9 ${sl.k_per_9 ?? "—"}`
        : `${sl.avg ?? "—"}/${sl.obp ?? "—"}/${sl.slg ?? "—"} · ${sl.hr ?? 0} HR`;
      const eta = (p.eta && p.eta.year) ? `ETA ${p.eta.year}` : (p.graduation_date ? "graduated" : "ETA —");
      const ageVsLevel = (p.age_vs_level && p.age_vs_level.diff != null)
        ? `${p.age_vs_level.diff > 0 ? "+" : ""}${p.age_vs_level.diff.toFixed(1)}y vs ${sl.level || "lvl"}`
        : "";
      const fvLabel = p.fv_close != null ? Math.round(p.fv_close) : "—";
      const sparkline = (p.points && p.points.length >= 2)
        ? makeLineChart(p.points, p.fv_open, p.fv_close, p.graduation_date, p.trades, p)
        : "";
      const rps = computeRelProd(p);
      html += `<div class="detail-title flush no-rule" style="font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-tertiary);">Prospects · 1</div>`;
      html += `<div class="compare-card" style="${orgStripe(p.org)}">
        <div style="display:flex;gap:10px;align-items:flex-start;min-width:0;">
          <span onclick="closeCompareAndGo('${escapeHtml(p.player_key)}');" style="cursor:pointer;flex-shrink:0;">${headshotHTML(p, 64)}</span>
          <div style="min-width:0;flex:1;">
            <div class="player-name" style="cursor:pointer;" onclick="closeCompareAndGo('${escapeHtml(p.player_key)}');">${escapeHtml(p.player_name)}
              <span class="fv-badge ${fvClass(String(fvLabel))} size-sm" style="margin-left:6px;" title="${escapeHtml(fvBadgeTooltip(p))}">${fvLabel}</span>
            </div>
            ${playerMetaHTML(p)}
            <div style="margin-top:6px;">${rpsPillHTML(rps)}</div>
            <div class="cc-stat" style="margin-top:6px;">${escapeHtml(slashLine)}</div>
            <div class="cc-stat" style="margin-top:2px;color:var(--text-tertiary);">${escapeHtml(eta)}${ageVsLevel ? " · " + escapeHtml(ageVsLevel) : ""}</div>
            <div style="margin-top:4px;">${sparkline}</div>
            <div style="margin-top:6px;font-size:10px;color:var(--text-tertiary);">Pin a second prospect to compare side-by-side.</div>
          </div>
        </div>
        <button class="cc-remove" data-compare-remove="${escapeHtml(p.player_key)}" type="button">remove</button>
      </div>${stubHTML}`;
    } else {
      // Only stubs — show them so the user can remove.
      html += stubHTML;
    }
  }

  // Farms section — mirror the prospects split (2+ side-by-side, 1 card).
  if (farms.length || farmStubs.length) {
    const farmStubHTML = farmStubs.map(o => `<div class="compare-card"><div style="color:var(--text-tertiary);">Farm "${escapeHtml(o)}" not in current data.</div><button class="cc-remove" data-farm-compare-remove="${escapeHtml(o)}">remove</button></div>`).join("");
    html += `<div class="detail-title no-rule" style="font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-tertiary);margin-top:14px;">Farm systems · ${farms.length}</div>`;
    if (farms.length >= 2) {
      html += makeFarmCompareSideBySide(farms) + farmStubHTML;
    } else if (farms.length === 1) {
      html += makeFarmCompareSingleCard(farms[0]) + farmStubHTML;
    } else {
      html += farmStubHTML;
    }
  }

  body.innerHTML = html;
}

function closeCompareAndGo(key) {
  document.getElementById("compare-panel").classList.remove("open");
  goToPlayer(key);
}

function closeCompareAndGoFarm(org) {
  document.getElementById("compare-panel").classList.remove("open");
  goToFarm(org);
}

function attachHandlers() {
  // Delegated row clicks — one listener catches Active / Spotlights /
  // Injured / Traded / Graduates / Farm rows. Each render function used
  // to attach its own forEach loop; the rows now just need data-key or
  // data-org and the delegation does the rest. Phase 4 a11y bolts onto
  // this same listener (Enter/Space → click).
  document.getElementById("content").addEventListener("click", (e) => {
    // "+ Add to compare" buttons live inside .compare-add-btn — handle
    // those before the row delegation so the click doesn't navigate.
    const addBtn = e.target.closest(".compare-add-btn[data-compare-key]");
    if (addBtn) {
      e.stopPropagation();
      compareToggle(addBtn.dataset.compareKey);
      return;
    }
    // Same handler for farm-pin buttons.
    const farmAddBtn = e.target.closest(".compare-add-btn[data-farm-compare-key]");
    if (farmAddBtn) {
      e.stopPropagation();
      farmCompareToggle(farmAddBtn.dataset.farmCompareKey);
      return;
    }
    const row = e.target.closest("[data-key], [data-org]");
    if (!row) return;
    if (row.dataset.key)      goToPlayer(row.dataset.key);
    else if (row.dataset.org) goToFarm(row.dataset.org);
  });

  // Keyboard equivalents — Enter / Space on a focused row activates it.
  // Phase 4 a11y companion to the delegated click handler; tabindex +
  // role are applied by decorateA11yRows after every render.
  document.getElementById("content").addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const row = e.target.closest("[data-key], [data-org]");
    if (!row) return;
    e.preventDefault();
    if (row.dataset.key)      goToPlayer(row.dataset.key);
    else if (row.dataset.org) goToFarm(row.dataset.org);
  });

  // Mobile filter-toggle — flips `#filter-bar.is-open` so the chip
  // rows expand/collapse. Desktop hides the toggle entirely via CSS.
  const filterToggle = document.getElementById("filter-toggle");
  if (filterToggle) {
    filterToggle.addEventListener("click", () => {
      const bar = document.getElementById("filter-bar");
      const isOpen = bar.classList.toggle("is-open");
      filterToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });
  }

  // Comparison-cart open/close + per-card remove buttons.
  document.getElementById("compare-toggle").addEventListener("click", () => {
    const panel = document.getElementById("compare-panel");
    panel.classList.toggle("open");
    if (panel.classList.contains("open")) renderCompareCart();
  });
  document.getElementById("compare-close").addEventListener("click", () => {
    document.getElementById("compare-panel").classList.remove("open");
  });
  document.getElementById("compare-body").addEventListener("click", (e) => {
    const rm = e.target.closest("[data-compare-remove]");
    if (rm) { compareToggle(rm.dataset.compareRemove); return; }
    const frm = e.target.closest("[data-farm-compare-remove]");
    if (frm) farmCompareToggle(frm.dataset.farmCompareRemove);
  });

  document.querySelectorAll(".section-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".section-tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.section = btn.dataset.section;
      // Tab switch always returns to the list — drop any detail view.
      state.view = null;
      render();
    });
  });
  attachChipGroup("spotlight-bucket", "spotlightBucket", () => render(), { clearView: true });

  // Back/forward navigation: re-read the hash and re-render whenever the
  // user uses browser-history controls (or anything else mutates the hash).
  window.addEventListener("hashchange", () => {
    syncFromURL();
    restoreUIFromState();
    render();
  });

  document.querySelectorAll("[data-filter-stock]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-filter-stock]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.stockFilter = btn.dataset.filterStock;
      render();
      syncToURL();
    });
  });
  attachChipGroup("filter-health", "healthFilter", () => render());
  // Level filter chips (main list + URL state).
  document.querySelectorAll("[data-filter-level]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-filter-level]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.levelFilter = btn.dataset.filterLevel;
      render();
      syncToURL();
    });
  });
  // Position filter chips.
  document.querySelectorAll("[data-filter-pos]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-filter-pos]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.posFilter = btn.dataset.filterPos;
      render();
      syncToURL();
    });
  });
  // Graduates sort chips. Different surface entirely from the active
  // prospect sort dropdown — the graduates list has its own questions
  // (who graduated most recently / who's been the best MLB performer /
  // who graduated at the highest FV) and benefits from chip toggles.
  attachChipGroup("grad-sort", "gradSort", () => renderGraduates());
  // IL sort chips.
  attachChipGroup("il-sort", "ilSort", () => renderInjured());

  // Leaderboards chip groups — stat picker swaps the metric the board
  // is sorted by; level/pos chips narrow the qualifying pool. All three
  // re-render the leaderboard but don't touch other tabs.
  attachChipGroup("lb-stat",   "lbStat",   () => renderLeaderboards());
  attachChipGroup("lb-level",  "lbLevel",  () => renderLeaderboards());
  attachChipGroup("lb-pos",    "lbPos",    () => renderLeaderboards());
  attachChipGroup("lb-season", "lbSeason", () => renderLeaderboards());
  // Null-guard each selector binding — missing elements (caused by template
  // ordering, embed contexts, or future markup changes) would otherwise
  // throw a TypeError that aborts attachHandlers and breaks every other
  // tab. Each selector wraps in `if (el)` like populateOrgFilter does.
  const lbOrgEl = document.getElementById("lb-org-filter");
  if (lbOrgEl) lbOrgEl.addEventListener("change", e => {
    state.lbOrg = e.target.value;
    renderLeaderboards();
    syncToURL();
  });
  const orgEl = document.getElementById("org-filter");
  if (orgEl) orgEl.addEventListener("change", e => {
    state.orgFilter = e.target.value;
    render();
  });
  const acqEl = document.getElementById("acq-filter");
  if (acqEl) acqEl.addEventListener("change", e => {
    state.acqFilter = e.target.value;
    render();
  });
  const sortEl = document.getElementById("sort-select");
  if (sortEl) sortEl.addEventListener("change", e => {
    state.sort = e.target.value;
    render();
  });

  const searchInput = document.getElementById("search-input");
  if (searchInput) {
    searchInput.addEventListener("input", e => {
      state.search = e.target.value.trim();
      render();
    });
    // Clear search on Escape
    searchInput.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        state.search = "";
        searchInput.value = "";
        render();
      }
    });
  }

  // Farm sort chips. Trajectory_(1|3|5)y also flip the active form
  // window so the line charts on the farm rows update to match the
  // window the sort is keying off — without this the sort would
  // re-order rows but the inline sparklines would still show the old
  // window's slope.
  attachChipGroup("farm-sort", "farmSort", (key) => {
    const trajMatch = /^trajectory_(1y|3y|5y)$/.exec(key);
    if (trajMatch) {
      state.formWindow = trajMatch[1];
      document.querySelectorAll("[data-form-window]").forEach(b =>
        b.classList.toggle("active", b.dataset.formWindow === state.formWindow));
    }
    renderFarmSystems();
  });

  // Form-window chips (1y / 3y / 5y). Drives the sparkline + trajectory
  // delta-above-median on the farm list, and the windowed trajectory
  // cell on the farm-detail report card. Re-renders both views so the
  // selector works whether the user is on the list or in a detail page.
  attachChipGroup("form-window", "formWindow", () => {
    if (state.view && state.view.type === "farm") renderFarmDetail(state.view.org);
    renderFarmSystems();
  });
}

function populateOrgFilter() {
  // Active-list org filter + Leaderboards org filter share the same
  // org enumeration. Two selects, same options.
  for (const selId of ["org-filter", "lb-org-filter"]) {
    const select = document.getElementById(selId);
    if (!select) continue;
    for (const org of getAllOrgs()) {
      const opt = document.createElement("option");
      opt.value = org;
      opt.textContent = org;
      select.appendChild(opt);
    }
  }
}

// =============================================================================
// BOOT
// =============================================================================
(async () => {
  DATA = await loadData();
  const content = document.getElementById("content");

  if (DATA.__error) {
    content.innerHTML = `
      <div class="state-message state-error">
        Could not load <code>${DATA_URL}</code>: ${escapeHtml(DATA.__error)}
        <br><br>
        <span style="color: var(--text-tertiary);">
          Generate the data first by running <code>python run_monthly.py</code> in the project root,<br>
          then refresh this page. See <code>README.md</code> for setup.
        </span>
      </div>`;
    return;
  }
  if (!DATA.players || DATA.players.length === 0) {
    content.innerHTML = `
      <div class="state-message">
        <strong style="font-weight: 500; color: var(--text-primary);">No prospect data yet.</strong>
        <br><br>
        Edit <code>data/manual_rankings.csv</code> to add prospect rows, then run
        <code>python run_monthly.py</code> in the project root and refresh.
      </div>`;
    return;
  }

  // Mount the main UI
  const tpl = document.getElementById("main-template");
  content.innerHTML = "";
  content.appendChild(tpl.content.cloneNode(true));

  syncFromURL();
  populateOrgFilter();
  restoreUIFromState();
  attachHandlers();
  render();
  // Cart state lives in localStorage — populate the floating button +
  // any in-page "+ Compare" buttons on first paint, then again after
  // every section render (renderCompareCart re-syncs button visuals).
  renderCompareCart();

  // Warm the sidecar slices in the background. The user has to click
  // before they touch the graduates/inactive/farm-detail data, so by
  // the time they navigate, the slice is usually already on DATA.
  // If they beat the network, the render branches re-fire render()
  // once the slice arrives.
  if (DATA && DATA._slices) {
    setTimeout(() => {
      loadSlice("graduates");
      loadSlice("rosters_by_org");
      loadSlice("inactive");
    }, 0);
  }
})();
</script>
