// Refresh the floating button + panel contents. Called on boot, every
// compare toggle, and after a re-render (so the player-detail "in cart"
// state stays in sync with the cart's own state).
// Internal age + level-adjusted production score. No longer surfaced
// directly in the UI — feeds the bucketed RPS+ index (see below) as
// the raw value that gets percentile-anchored against same-age peers.
// Composite of:
//   - performance vs level (ops_plus_level − 100 for hitters,
//     100 − era_minus_level for pitchers, both being a "% above level
//     average" delta)
//   - age vs level (each year young = +10 points; old = −10 points)
// Volume-gated (skip players under min sample). Returns null when we
// can't compute meaningfully.
function computeRelProd(p) {
  if (!p) return null;
  const sl = p.statline || {};
  const avl = p.age_vs_level || {};
  const ageAdj = avl.diff != null ? -avl.diff * 10 : 0;
  if (sl.is_pitcher) {
    if (sl.era_minus_level == null) return null;
    const ip = Number(sl.ip || 0);
    if (ip < 15) return null;
    const perfAdj = 100 - sl.era_minus_level;
    return {
      score: Math.round(perfAdj + ageAdj),
      perf: Math.round(perfAdj),
      age: Math.round(ageAdj),
      driver: `ERA- ${sl.era_minus_level} · ${avl.diff != null ? `${avl.diff > 0 ? "+" : ""}${avl.diff.toFixed(1)}y vs ${sl.level || "level"}` : "age unknown"}`,
    };
  } else {
    if (sl.ops_plus_level == null) return null;
    const games = Number(sl.games || 0);
    if (games < 15) return null;
    const perfAdj = sl.ops_plus_level - 100;
    return {
      score: Math.round(perfAdj + ageAdj),
      perf: Math.round(perfAdj),
      age: Math.round(ageAdj),
      driver: `OPS+ ${sl.ops_plus_level} · ${avl.diff != null ? `${avl.diff > 0 ? "+" : ""}${avl.diff.toFixed(1)}y vs ${sl.level || "level"}` : "age unknown"}`,
    };
  }
}

// RPS+ — wRC+/OPS+-style mean-relative index of a player's raw
// production score, anchored at 100 = mean prospect at the same
// integer age. Player ages are bucketed by floor(age); ages ≥25
// collapse into a single "25+" bucket since coverage thins out there.
// The +100 shift keeps the ratio positive even when the raw input is
// mildly negative (matches the OPS+/wRC+ convention). Result is
// clamped to [0, 250].
//
// The raw input is whatever `computeRelProd` returns — performance
// (OPS+ / ERA−) plus age-vs-level adjustment, gated by 15+ games or
// 15+ IP. computeRelProd remains as an internal helper, but is no
// longer surfaced as a standalone "RPS" reading anywhere in the UI.
//
// Buckets and bucket-means are computed lazily on first access from
// the current DATA.players, then cached. Re-render after DATA changes
// (which the app already does only on page load) will rebuild on next
// call. The cache is keyed by player_key so each player ↔ RPS+ pair
// is O(1) after the first build.
const _rpsPlusCache = { built: false, byKey: new Map(), bucketMean: new Map(), bucketSize: new Map() };

function _rpsAgeBucket(age) {
  if (age == null) return null;
  const ai = Math.floor(age);
  return ai >= 25 ? 25 : ai;
}

function _buildRpsPlusCache() {
  const players = (DATA.players || []);
  // Group raw RPS by integer-age bucket so we can take the mean.
  const buckets = new Map();
  const playerRps = [];
  for (const p of players) {
    const r = computeRelProd(p);
    if (r == null) continue;
    const b = _rpsAgeBucket(p.age);
    if (b == null) continue;
    playerRps.push({ key: p.player_key, bucket: b, raw: r.score });
    if (!buckets.has(b)) buckets.set(b, []);
    buckets.get(b).push(r.score);
  }
  // Arithmetic mean per bucket. Bucket sizes are also exposed so the
  // tooltip can tell the user how thin the comparison group is.
  for (const [b, arr] of buckets) {
    const n = arr.length;
    const mean = arr.reduce((s, x) => s + x, 0) / n;
    _rpsPlusCache.bucketMean.set(b, mean);
    _rpsPlusCache.bucketSize.set(b, n);
  }
  // RPS+ per player.
  for (const { key, bucket, raw } of playerRps) {
    const m = _rpsPlusCache.bucketMean.get(bucket);
    let plus;
    if (m > 0) {
      plus = Math.round(100 * (raw + 100) / (m + 100));
    } else {
      plus = Math.round(100 + (raw - m));
    }
    plus = Math.max(0, Math.min(250, plus));
    _rpsPlusCache.byKey.set(key, { plus, bucket, raw, mean: m, n: _rpsPlusCache.bucketSize.get(bucket) });
  }
  _rpsPlusCache.built = true;
}

function getRpsPlus(p) {
  if (!p || !p.player_key) return null;
  if (!_rpsPlusCache.built) _buildRpsPlusCache();
  return _rpsPlusCache.byKey.get(p.player_key) || null;
}

// MLB-level players don't have level-relative stats (ops_plus_level /
// era_minus_level are MiLB-only — storage.py:_serialize skips them when
// the statline is MLB), so RPS+ resolves to null and the pill would
// otherwise read "RPS+ —". Substitute the actual league-relative stats
// from FanGraphs sabermetrics: wRC+ for hitters (already 100 = MLB
// league mean), xFIP + FIP- for pitchers (xFIP raw for unit familiarity,
// FIP- for the 100-anchored read). Returns null when this isn't an MLB
// player or the sabermetrics fields are missing — caller falls back to
// the regular RPS+ pill in that case.
function mlbPerfPillHTML(p) {
  const sm = p && p.sabermetrics || {};
  const sl = p && p.statline || {};
  if ((sl.level || "") !== "MLB") return null;
  if (!sm.is_pitcher && sm.wrc_plus != null) {
    const v = sm.wrc_plus;
    const cls = v >= 110 ? "is-pos" : v <= 90 ? "is-neg" : "is-neutral";
    return `<span class="rps-plus-pill ${cls}" title="wRC+ ${v} · 100 = MLB league mean">wRC+ ${v}</span>`;
  }
  if (sm.is_pitcher && (sm.xfip != null || sm.fip_minus != null)) {
    const xfip = sm.xfip != null ? sm.xfip.toFixed(2) : "—";
    const fipMinus = sm.fip_minus != null ? Math.round(sm.fip_minus) : null;
    // FIP- is the indexed stat (lower = better at run prevention), so
    // it drives the pill color. xFIP is shown alongside for scouts who
    // read in ERA units.
    const cls = fipMinus == null ? "is-neutral"
      : fipMinus <= 90 ? "is-pos"
      : fipMinus >= 110 ? "is-neg" : "is-neutral";
    const label = fipMinus != null
      ? `xFIP ${xfip} · FIP- ${fipMinus}`
      : `xFIP ${xfip}`;
    const tooltip = fipMinus != null
      ? `${label} · 100 = MLB league mean (FIP-); ~4.00 = MLB league mean (xFIP)`
      : `${label} · ~4.00 = MLB league mean`;
    return `<span class="rps-plus-pill ${cls}" title="${escapeHtml(tooltip)}">${label}</span>`;
  }
  return null;
}

function rpsPlusPillHTML(p) {
  // MLB-level players get their actual league-relative metric instead
  // of the MiLB-only RPS+ proxy. mlbPerfPillHTML returns null for MiLB
  // players or MLB players without sabermetrics, so we fall through to
  // the regular RPS+ pill in those cases.
  const mlbPill = mlbPerfPillHTML(p);
  if (mlbPill) return mlbPill;
  const rp = getRpsPlus(p);
  if (rp == null) {
    return `<span class="rps-plus-pill is-null" title="RPS+ unavailable — needs a qualifying sample (15+ games for hitters, 15+ IP for pitchers) and a known age.">RPS+ —</span>`;
  }
  const cls = rp.plus >= 110 ? "is-pos" : rp.plus <= 90 ? "is-neg" : "is-neutral";
  const ageLabel = rp.bucket >= 25 ? "25+yo" : `${rp.bucket}yo`;
  const diff = rp.plus - 100;
  const diffTxt = diff === 0 ? "matches" : `${diff > 0 ? "+" : ""}${diff}% vs`;
  const title = `RPS+ ${rp.plus} · ${diffTxt} the mean ${ageLabel} prospect (raw score ${rp.raw >= 0 ? "+" : ""}${rp.raw} vs bucket mean ${rp.mean >= 0 ? "+" : ""}${rp.mean.toFixed(1)}, n=${rp.n})`;
  return `<span class="rps-plus-pill ${cls}" title="${escapeHtml(title)}"><span class="g-term" data-term="rps_plus">RPS+</span> ${rp.plus}</span>`;
}

// ToolGrade+ pill — small inline composite-overall index. Anchored at
// 100 = cohort-mean tool composite, 10 pts = 1 stdev (computed at
// storage time over every serialized prospect). Returns "" when the
// player has no tool grades — list rows skip the pill silently rather
// than rendering an empty "T+ —" that adds noise.
function toolPlusPillHTML(p) {
  const t = p && p.tools;
  if (!t || t.composite_overall_plus == null) return "";
  const v = t.composite_overall_plus;
  const cls = v >= 110 ? "is-pos" : v <= 90 ? "is-neg" : "is-neutral";
  const raw = t.composite_overall != null ? t.composite_overall.toFixed(1) : "—";
  const title = `Tools+ ${v} · overall composite ${raw} (100 = cohort mean tool composite, outlier-biased power-3 mean, 10 pts = 1 stdev)`;
  return `<span class="tool-pill ${cls}" style="margin-left:6px;" title="${escapeHtml(title)}"><span class="g-term" data-term="tools_plus">Tools+</span>${v}</span>`;
}

// =============================================================================
// LEVEL-RELATIVE + TRADE-VALUE METRICS
// =============================================================================
// All of the metrics below are anchored at 100 = level-average for the
// player's current level (read from DATA.level_norms[level].perf). They
// return null when the underlying inputs are missing or the volume gate
// fails, so the UI can decide whether to render the pill.

function _clampPlus(v) {
  if (v == null || !isFinite(v)) return null;
  return Math.max(0, Math.min(250, Math.round(v)));
}

// Power Index (PWR+) — composite of ISO + HR-rate vs the player's level
// average. 100 = level-average power; 130 = 30% more power than the
// typical hitter at the same level. Hitters only; 40-game volume gate.
function computePowerPlus(p) {
  const sl = p && p.statline; if (!sl || sl.is_pitcher) return null;
  if ((Number(sl.games) || 0) < 40) return null;
  const perf = ((DATA.level_norms || {})[sl.level] || {}).perf || {};
  if (perf.avg_iso == null) return null;
  const iso = sl.iso != null ? sl.iso : null;
  if (iso == null) return null;
  const isoRatio = iso / Math.max(0.05, perf.avg_iso);
  // HR-rate: prefer HR/PA when PA available; otherwise fall back to a
  // rough HR/G normalization. Most exports carry games but not PA, so
  // the fallback keeps the metric defined for the typical row.
  let hrRatio = null;
  const hr = Number(sl.hr) || 0;
  const games = Number(sl.games) || 0;
  if (sl.pa != null && Number(sl.pa) > 0) {
    const playerRate = hr / Number(sl.pa);
    // No PA-rate norm in level_norms — derive a quick league rate from
    // ISO ≈ HR-driven SLG contribution. Calibration constant chosen so
    // a league-average hitter at AA reads ~100.
    const leagueRate = (perf.avg_iso || 0.130) * 0.18;
    if (leagueRate > 0) hrRatio = playerRate / leagueRate;
  } else if (games > 0) {
    const playerRate = hr / games;
    const leagueRate = (perf.avg_iso || 0.130) * 0.045;
    if (leagueRate > 0) hrRatio = playerRate / leagueRate;
  }
  if (hrRatio == null) hrRatio = isoRatio;  // fall back to pure ISO
  return _clampPlus(100 * (isoRatio * 0.6 + hrRatio * 0.4));
}

// Plate Discipline+ (PD+) — additive shift on the BB% − K% differential
// vs the level average. 100 = league-average discipline; 115 = the
// player has a 15-point better BB-K differential than the typical hitter
// at the same level. Hitters only; 40-game gate.
function computeDisciplinePlus(p) {
  const sl = p && p.statline; if (!sl || sl.is_pitcher) return null;
  if ((Number(sl.games) || 0) < 40) return null;
  const perf = ((DATA.level_norms || {})[sl.level] || {}).perf || {};
  if (sl.bb_pct == null || sl.k_pct == null || perf.avg_bb_pct == null || perf.avg_k_pct == null) return null;
  const playerDiff = Number(sl.bb_pct) - Number(sl.k_pct);
  const levelDiff  = perf.avg_bb_pct - perf.avg_k_pct;
  return _clampPlus(100 + (playerDiff - levelDiff));
}

// Pitcher Stuff+ (STF+) — composite of K/9, BB/9, HR/9 normalized
// against the level mean. The level_norms doesn't carry stddev, so we
// approximate σ = 0.15 * mean (rule of thumb), giving 1 standard
// deviation ≈ 10 points. Pitchers only; 20-IP gate.
function computeStuffPlus(p) {
  const sl = p && p.statline; if (!sl || !sl.is_pitcher) return null;
  if ((Number(sl.ip) || 0) < 20) return null;
  const perf = ((DATA.level_norms || {})[sl.level] || {}).perf || {};
  const k = Number(sl.k_per_9),  bk = perf.avg_k_per_9;
  const w = Number(sl.bb_per_9), bw = perf.avg_bb_per_9;
  const h = Number(sl.hr_per_9), bh = perf.avg_hr_per_9;
  if (!isFinite(k) || !isFinite(w) || bk == null || bw == null) return null;
  const z = (val, mean) => mean > 0 ? (val - mean) / (0.15 * mean) : 0;
  const zk = z(k, bk);                              // higher K/9 = better
  const zw = z(w, bw);                              // higher BB/9 = worse
  const zh = bh != null && isFinite(h) ? z(h, bh) : 0;  // higher HR/9 = worse
  return _clampPlus(100 + 10 * (zk - zw - zh));
}

// Trade Value Index (TVI) — Cleveland-derived expected MLB surplus
// value in $M for a prospect at a given consensus FV. Linearly
// interpolated between half-grade ticks. Returns null when consensus
// FV is missing.
const _TVI_TABLE = [
  [80, 145], [75, 90], [70, 60], [65, 40], [60, 25],
  [55, 15], [50,  9], [45,  4], [40, 1.5], [35, 0.5], [30, 0],
];
function computeTradeValue(p) {
  const latest = p && p.points && p.points.length ? p.points[p.points.length - 1] : null;
  const fv = latest ? Number(latest.consensus_fv) : (p && Number(p.fv_close));
  if (fv == null || !isFinite(fv)) return null;
  if (fv >= _TVI_TABLE[0][0]) return _TVI_TABLE[0][1];
  if (fv <= _TVI_TABLE[_TVI_TABLE.length - 1][0]) return 0;
  for (let i = 0; i < _TVI_TABLE.length - 1; i++) {
    const [hiFv, hiVal] = _TVI_TABLE[i];
    const [loFv, loVal] = _TVI_TABLE[i + 1];
    if (fv <= hiFv && fv >= loFv) {
      const t = (fv - loFv) / (hiFv - loFv);
      return loVal + (hiVal - loVal) * t;
    }
  }
  return null;
}

// Render helpers — small colored pills for the four new metrics. The
// shared `.rps-plus-pill` styles (violet accent, neutral/pos/neg) get
// reused with stat-specific labels so every "X+" reading reads as the
// same family of metric. Optional `slug` arg attaches the glossary
// click-to-define affordance (`.g-term[data-term]`) to the entire pill.
function _plusPill(label, value, classFn, tooltip, slug) {
  const gClass = slug ? " g-term" : "";
  const gAttr  = slug ? ` data-term="${slug}"` : "";
  if (value == null) {
    return `<span class="rps-plus-pill is-null${gClass}"${gAttr} title="${escapeHtml(label + " unavailable — insufficient sample or missing inputs.")}">${label} —</span>`;
  }
  const cls = classFn(value);
  return `<span class="rps-plus-pill ${cls}${gClass}"${gAttr} title="${escapeHtml(tooltip)}">${label} ${value}</span>`;
}
function powerPlusPillHTML(p) {
  const v = computePowerPlus(p);
  if (v == null) return "";   // hitters only — silently omit for pitchers
  return _plusPill("PWR+", v, n => n >= 110 ? "is-pos" : n <= 90 ? "is-neg" : "is-neutral",
    `PWR+ ${v} · ISO + HR-rate vs ${p.statline.level || "level"} mean (100 = league-average power)`,
    "pwr_plus");
}
function disciplinePlusPillHTML(p) {
  const v = computeDisciplinePlus(p);
  if (v == null) return "";
  return _plusPill("PD+", v, n => n >= 110 ? "is-pos" : n <= 90 ? "is-neg" : "is-neutral",
    `PD+ ${v} · BB%−K% differential vs ${p.statline.level || "level"} mean (100 = league-average plate discipline)`,
    "pd_plus");
}
function stuffPlusPillHTML(p) {
  const v = computeStuffPlus(p);
  if (v == null) return "";
  return _plusPill("STF+", v, n => n >= 110 ? "is-pos" : n <= 90 ? "is-neg" : "is-neutral",
    `STF+ ${v} · K/9 + BB/9 + HR/9 normalized to ${p.statline.level || "level"} mean (100 = league-average stuff, 10 pts ≈ 1 std-dev)`,
    "stf_plus");
}
function tradeValuePillHTML(p) {
  const v = computeTradeValue(p);
  if (v == null) return "";
  const formatted = v >= 100 ? `$${v.toFixed(0)}M` : v >= 10 ? `$${v.toFixed(1)}M` : `$${v.toFixed(1)}M`;
  return `<span class="rps-plus-pill is-neutral g-term" data-term="tvi" style="color:var(--card-gold);border-color:var(--card-gold);background:rgba(201,162,39,0.10);" title="${escapeHtml(`Estimated MLB surplus value (Cleveland-derived FV→$ table) at consensus FV ${(p.points && p.points.length ? p.points[p.points.length - 1].consensus_fv_label : "?")}`)}">TVI ${formatted}</span>`;
}

// Composite helper for the prospect detail stat strip / rows — renders
// all available "+" pills inline so a hitter shows PWR+/PD+, a pitcher
// shows STF+, every player shows TVI. Omits pills whose underlying
// metric returned null so the row doesn't fill with "—" placeholders.
function scoutRatesHTML(p) {
  return [
    powerPlusPillHTML(p),
    disciplinePlusPillHTML(p),
    stuffPlusPillHTML(p),
    tradeValuePillHTML(p),
  ].filter(Boolean).join("");
}

// Per-player colors used by the overlay chart + legend dots. Cycles
// through three distinct hues so 3-prospect comparisons stay readable.
const COMPARE_COLORS = ["var(--neon-cyan)", "var(--neon-violet)", "var(--neon-amber)"];

// Multi-player FV-history overlay. One SVG with one polyline per
// pinned prospect. Each prospect is in their assigned compare color.
// Shares the X-axis (date range across ALL prospects) and Y-axis
// (FV 20-80).
function makeFvOverlayChart(players) {
  if (!players.length) return "";
  // Common time range covers every player's points.
  let minT = Infinity, maxT = -Infinity;
  for (const p of players) {
    for (const pt of (p.points || [])) {
      const t = new Date(pt.snapshot_date).getTime();
      if (isNaN(t)) continue;
      if (t < minT) minT = t;
      if (t > maxT) maxT = t;
    }
  }
  if (!isFinite(minT) || !isFinite(maxT) || minT === maxT) {
    return `<div style="color:var(--text-tertiary);font-size:11px;padding:8px;">Not enough FV history for an overlay chart.</div>`;
  }
  const W = 720, H = 140, PAD = 8, Y_LABEL_W = 16, LABEL_H = 12;
  const CHART_BOTTOM = H - LABEL_H - PAD;
  const X_LEFT = PAD + Y_LABEL_W;
  const timeSpan = maxT - minT;
  const xScale = d => X_LEFT + ((new Date(d).getTime() - minT) / timeSpan) * (W - X_LEFT - PAD);
  const yScale = fv => CHART_BOTTOM - ((fv - 20) / (80 - 20)) * (CHART_BOTTOM - PAD);

  // Y-axis labels + a reference line at FV 50.
  const yAxis = `
    <text x="${PAD}" y="${(yScale(80) + 3).toFixed(1)}" font-size="9" fill="var(--text-tertiary)" font-family="var(--font-mono)">80</text>
    <text x="${PAD}" y="${(yScale(50) + 3).toFixed(1)}" font-size="9" fill="var(--text-tertiary)" font-family="var(--font-mono)">50</text>
    <text x="${PAD}" y="${(yScale(20) + 3).toFixed(1)}" font-size="9" fill="var(--text-tertiary)" font-family="var(--font-mono)">20</text>
    <line x1="${X_LEFT}" y1="${yScale(50).toFixed(1)}" x2="${W - PAD}" y2="${yScale(50).toFixed(1)}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3,3"/>`;

  // Year gridlines + labels along the X axis.
  const yearSvg = [];
  const startYear = new Date(minT).getFullYear();
  const endYear   = new Date(maxT).getFullYear();
  for (let yr = startYear; yr <= endYear + 1; yr++) {
    const yrT = Date.UTC(yr, 0, 1);
    if (yrT <= minT || yrT >= maxT) continue;
    const x = xScale(new Date(yrT).toISOString().split("T")[0]).toFixed(1);
    yearSvg.push(
      `<line x1="${x}" y1="${PAD}" x2="${x}" y2="${CHART_BOTTOM}" stroke="var(--border)" stroke-width="0.4" stroke-dasharray="2,3"/>`,
      `<text x="${x}" y="${H - 1}" font-size="9" fill="var(--text-tertiary)" text-anchor="middle">${yr}</text>`
    );
  }

  // One polyline + endpoint dots per player.
  const lines = players.map((p, i) => {
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    const pts = (p.points || []).map(pt => `${xScale(pt.snapshot_date).toFixed(1)},${yScale(pt.consensus_fv_raw).toFixed(1)}`).join(" ");
    const last = p.points && p.points.length ? p.points[p.points.length - 1] : null;
    const endDot = last
      ? `<circle cx="${xScale(last.snapshot_date).toFixed(1)}" cy="${yScale(last.consensus_fv_raw).toFixed(1)}" r="3.5" fill="${color}"><title>${escapeHtml(p.player_name)}: FV ${last.consensus_fv_label} (${last.snapshot_date})</title></circle>`
      : "";
    return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6"/>${endDot}`;
  }).join("");

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block;overflow:visible;">
    ${yAxis}
    ${yearSvg.join("")}
    ${lines}
  </svg>`;
}

// Head-to-head stat table. Each row is one stat; one column per
// pinned player. Best value in green, worst in red, neutral
// otherwise. Hitters and pitchers get different stat lists; mixed
// rosters (hitter + pitcher pinned together) fall back to FV / age /
// level / ETA rows only.
function makeCompareStatTable(players) {
  if (!players.length) return "";
  // Decide which stat list applies based on the majority side. A
  // mixed pinning (e.g., one hitter + one pitcher) shows the universal
  // rows only.
  const sides = players.map(p => (p.statline || {}).is_pitcher ? "pit" : "hit");
  const uniqSides = new Set(sides);
  const universal = [
    ["Age",          p => p.age != null ? p.age.toFixed(1) : null,    { hi: false, fmt: v => v.toFixed(1) }],
    ["Current FV",   p => p.fv_close,                                 { hi: true,  fmt: v => String(Math.round(v)) }],
    ["Level",        p => (p.statline || {}).level || null,           { categorical: true }],
    ["ETA",          p => (p.eta || {}).year || null,                 { hi: false, fmt: v => String(v) }],
    ["Games (PA/IP volume)", p => {
      const sl = p.statline || {};
      return sl.is_pitcher ? (sl.ip != null ? Number(sl.ip) : null) : (sl.games != null ? sl.games : null);
    }, { hi: true, fmt: v => v.toFixed ? v.toFixed(1) : String(v) }],
  ];
  const hitRows = [
    ["AVG",  p => (p.statline || {}).avg,   { hi: true,  fmt: v => v }],
    ["OBP",  p => (p.statline || {}).obp,   { hi: true,  fmt: v => v }],
    ["SLG",  p => (p.statline || {}).slg,   { hi: true,  fmt: v => v }],
    ["OPS",  p => (p.statline || {}).ops,   { hi: true,  fmt: v => v }],
    ["ISO",  p => (p.statline || {}).iso,   { hi: true,  fmt: v => (typeof v === "number" ? v.toFixed(3).replace(/^0/, "") : v) }],
    ["HR",   p => (p.statline || {}).hr,    { hi: true,  fmt: v => String(v) }],
    ["SB",   p => (p.statline || {}).sb,    { hi: true,  fmt: v => String(v) }],
    ["BB%",  p => (p.statline || {}).bb_pct,{ hi: true,  fmt: v => v.toFixed(1) + "%" }],
    ["K%",   p => (p.statline || {}).k_pct, { hi: false, fmt: v => v.toFixed(1) + "%" }],
    ["OPS+ (vs level)", p => (p.statline || {}).ops_plus_level, { hi: true, fmt: v => String(Math.round(v)) }],
  ];
  const pitRows = [
    ["ERA",  p => (p.statline || {}).era,    { hi: false, fmt: v => v }],
    ["WHIP", p => (p.statline || {}).whip,   { hi: false, fmt: v => (typeof v === "number" ? v.toFixed(2) : v) }],
    ["IP",   p => (p.statline || {}).ip,     { hi: true,  fmt: v => (typeof v === "number" ? v.toFixed(1) : v) }],
    ["K/9",  p => (p.statline || {}).k_per_9, { hi: true, fmt: v => (typeof v === "number" ? v.toFixed(2) : v) }],
    ["BB/9", p => (p.statline || {}).bb_per_9,{ hi: false, fmt: v => (typeof v === "number" ? v.toFixed(2) : v) }],
    ["ERA- (vs level)", p => (p.statline || {}).era_minus_level, { hi: false, fmt: v => String(Math.round(v)) }],
  ];
  // Group headers.
  const sections = [];
  sections.push(["Identity / FV", universal]);
  if (uniqSides.size === 1) {
    sections.push(sides[0] === "pit" ? ["Pitching", pitRows] : ["Hitting", hitRows]);
  } else {
    sections.push(["Stats", []]);  // mixed pinning — no comparable stat rows
  }
  // Build header.
  const headerCols = players.map((p, i) => {
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    return `<th><span class="csbs-legend-dot" style="background:${color};"></span>${escapeHtml(p.player_name)}</th>`;
  }).join("");
  const header = `<thead><tr><th>Stat</th>${headerCols}</tr></thead>`;
  // Build body.
  const renderRow = ([label, getValue, opts]) => {
    const rawVals = players.map(getValue);
    const numericVals = rawVals.map(v => v == null ? null : Number(v)).filter(v => v != null && !isNaN(v));
    let bestIdx = -1, worstIdx = -1;
    if (!opts.categorical && numericVals.length >= 2) {
      // Find indices of best/worst non-null numeric values.
      let bestVal = opts.hi ? -Infinity : Infinity;
      let worstVal = opts.hi ? Infinity : -Infinity;
      rawVals.forEach((v, i) => {
        if (v == null) return;
        const n = Number(v);
        if (isNaN(n)) return;
        if (opts.hi ? n > bestVal : n < bestVal) { bestVal = n; bestIdx = i; }
        if (opts.hi ? n < worstVal : n > worstVal) { worstVal = n; worstIdx = i; }
      });
      // If best == worst (all equal), drop highlighting.
      if (bestVal === worstVal) { bestIdx = -1; worstIdx = -1; }
    }
    const cells = rawVals.map((v, i) => {
      if (v == null) return `<td style="color:var(--text-tertiary);">—</td>`;
      let display = v;
      if (opts.fmt && !opts.categorical) {
        try { display = opts.fmt(typeof v === "number" ? v : Number(v)); }
        catch { display = String(v); }
      }
      const cls = i === bestIdx ? "is-best" : i === worstIdx ? "is-worst" : "";
      return `<td class="${cls}">${escapeHtml(String(display))}</td>`;
    }).join("");
    return `<tr><td>${escapeHtml(label)}</td>${cells}</tr>`;
  };
  const body = sections.map(([title, rows]) => {
    const groupHeader = `<tr class="is-group-header"><td colspan="${players.length + 1}">${escapeHtml(title)}</td></tr>`;
    if (!rows.length) return groupHeader + `<tr><td colspan="${players.length + 1}" style="color:var(--text-tertiary);font-size:10px;">Mixed pinning — pin only hitters or only pitchers to compare side-specific stats.</td></tr>`;
    return groupHeader + rows.map(renderRow).join("");
  }).join("");
  return `<table class="compare-stat-table">${header}<tbody>${body}</tbody></table>`;
}

// Side-by-side cart layout — used when 2+ players are pinned.
function makeCompareSideBySide(players) {
  // Per-player header row with name, FV badge, RPS pill, remove btn.
  const cols = `repeat(${players.length}, minmax(0, 1fr))`;
  const heads = players.map((p, i) => {
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    const fvLabel = p.fv_close != null ? Math.round(p.fv_close) : "—";
    const sl = p.statline || {};
    const ageBits = [];
    if (p.age != null) ageBits.push(`${p.age.toFixed(1)}yo`);
    if (sl.level) ageBits.push(sl.level);
    if (p.org) ageBits.push(p.org);
    const rps = computeRelProd(p);
    return `<div class="csbs-player" style="--csbs-color:${color};">
      <button class="csbs-remove" data-compare-remove="${escapeHtml(p.player_key)}" type="button" title="Remove from compare">×</button>
      <div style="display:flex;align-items:flex-start;gap:8px;min-width:0;">
        <span onclick="closeCompareAndGo('${escapeHtml(p.player_key)}');" style="cursor:pointer;flex-shrink:0;">${headshotHTML(p, 56)}</span>
        <div style="min-width:0;flex:1;">
          <div class="csbs-name" onclick="closeCompareAndGo('${escapeHtml(p.player_key)}');">${escapeHtml(p.player_name)}
            <span class="fv-badge ${fvClass(String(fvLabel))} size-sm" style="margin-left:6px;" title="${escapeHtml(fvBadgeTooltip(p))}">${fvLabel}</span>
          </div>
          <div class="csbs-meta">${escapeHtml(ageBits.join(" · ")) || "—"}</div>
          ${rpsPlusPillHTML(p)}
        </div>
      </div>
    </div>`;
  }).join("");

  const head = `<div class="compare-sbs-head" style="grid-template-columns:${cols};">${heads}</div>`;
  const chart = `<div class="compare-overlay-chart"><div style="font-size:9px;color:var(--text-tertiary);letter-spacing:0.08em;text-transform:uppercase;font-weight:700;margin-bottom:4px;">FV history · overlay</div>${makeFvOverlayChart(players)}</div>`;
  const table = makeCompareStatTable(players);
  // RPS+ summary row — repeat each player's index + the raw drivers
  // (OPS+ / ERA−, age vs level) that fed it, so the reader can see
  // both the index and what's behind it.
  const rpsRows = players.map((p, i) => {
    const rp = getRpsPlus(p);
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    if (rp == null) {
      return `<div><span class="csbs-legend-dot" style="background:${color};"></span><strong>${escapeHtml(p.player_name)}</strong> <span class="crps-driver">RPS+ unavailable — insufficient sample</span></div>`;
    }
    const raw = computeRelProd(p);
    const driver = raw ? raw.driver : "";
    const cls = rp.plus >= 110 ? "var(--up)" : rp.plus <= 90 ? "var(--down)" : "var(--neon-violet)";
    return `<div><span class="csbs-legend-dot" style="background:${color};"></span><strong>${escapeHtml(p.player_name)}</strong> <span style="color:${cls};font-family:var(--font-mono);font-weight:700;">RPS+ ${rp.plus}</span>${driver ? ` <span class="crps-driver">(${escapeHtml(driver)})</span>` : ""}</div>`;
  }).join("");
  const summary = `<div class="compare-rps-row">
    <div style="font-family:var(--font-sans);font-size:9px;color:var(--text-tertiary);letter-spacing:0.10em;text-transform:uppercase;font-weight:700;margin-bottom:6px;">RPS+ · 100 = mean prospect at the same age, 10 pts = a meaningful gap · MLB-level players show wRC+ (hitters) or xFIP / FIP- (pitchers) instead</div>
    ${rpsRows}
  </div>`;
  return head + chart + table + summary;
}

// Build the side-by-side farm-systems block for the compare cart.
// Mirrors the prospect csbs grid: one column per pinned farm, IFA/Draft
// donut + headline FV-tier strip + farm grades + top prospect.
function makeFarmCompareSideBySide(farms) {
  const cols = `repeat(${farms.length}, minmax(0, 1fr))`;
  const heads = farms.map((o, i) => {
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    const grade = (o.grades && o.grades.overall) || "—";
    const tp = o.top_prospect;
    const tpHtml = tp
      ? `<div style="font-size:11px;color:var(--text-secondary);margin-top:3px;">Top: <span style="color:var(--text-primary);">${escapeHtml(tp.player_name || "—")}</span>${tp.fv ? ` <span class="fv-badge size-sm ${fvClass(String(tp.fv))}" style="margin-left:4px;">${tp.fv}</span>` : ""}</div>`
      : "";
    return `<div class="csbs-player" style="--csbs-color:${color};">
      <button class="csbs-remove" data-farm-compare-remove="${escapeHtml(o.org)}" type="button" title="Remove from compare">×</button>
      <div style="display:flex;align-items:flex-start;gap:8px;min-width:0;">
        <span style="flex-shrink:0;">${teamLogoHTML(o.org, "lg", fullOrgName(o.org))}</span>
        <div style="min-width:0;flex:1;">
          <div class="csbs-name" onclick="closeCompareAndGoFarm('${escapeHtml(o.org)}');">${escapeHtml(fullOrgName(o.org))}
            <span style="margin-left:6px;font-family:var(--font-mono);color:${gradeColor(grade)};font-weight:700;">${escapeHtml(grade)}</span>
          </div>
          <div class="csbs-meta">#${o.farm_rank ?? "—"} of 30 · ${o.count ?? 0} tracked · Total FV ${o.total_fv != null ? o.total_fv.toFixed(1) : "—"}</div>
          ${tpHtml}
        </div>
      </div>
    </div>`;
  }).join("");

  const head = `<div class="compare-sbs-head" style="grid-template-columns:${cols};">${heads}</div>`;

  // Development-vs-mean chart row — reuses makeFarmGrowthChart with a
  // computed responsive width so the same SVG fits N orgs in a row.
  // The window selector sits at the top and stays synced with the
  // farm-detail page via state.formWindow. DvM+ already appears in the
  // chart caption (see makeFarmGrowthChart), so no extra label here.
  const win = state.formWindow || "3y";
  const winLabel = win === "1y" ? "1-year" : win === "3y" ? "3-year" : "5-year";
  const meanBaseline = (DATA.farm_trajectory_means || {})[win] ?? 0;
  // Heuristic responsive width: the compare-card viewport is ~880px on
  // a typical workspace; subtract per-cell gap then divide by N. Floor
  // to keep the SVG readable even with 4-org compare.
  const chartW = Math.max(220, Math.floor(840 / farms.length) - 12);
  const chartCells = farms.map(o => `
    <div style="display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden;">
      ${makeFarmGrowthChart(o, meanBaseline, win, chartW)}
    </div>
  `).join("");
  const chartRow = `<div style="margin-top:14px;">
    <div class="filter-bar" style="margin-bottom:8px;padding:6px 10px;">
      <span class="filter-label">${escapeHtml(winLabel)} development vs mean</span>
      <button class="chip${win === "1y" ? " active" : ""}" data-form-window="1y" type="button">1y</button>
      <button class="chip${win === "3y" ? " active" : ""}" data-form-window="3y" type="button">3y</button>
      <button class="chip${win === "5y" ? " active" : ""}" data-form-window="5y" type="button">5y</button>
      <span style="margin-left:auto;font-size:10px;color:var(--text-tertiary);letter-spacing:0.04em;">DvM+ · 100 = league mean · 10 pts = 1 std-dev · graduations + acquisitions nullified</span>
    </div>
    <div style="display:grid;grid-template-columns:${cols};gap:10px;align-items:start;">${chartCells}</div>
  </div>`;

  // Stat-table: each row is a farm metric, each column is a farm. Reuses
  // the existing .compare-stat-table styles so the visual feel matches
  // the prospect compare table. DvM+ rows expose the wRC+/OPS+-style index
  // per window so a reader can compare dev pipelines on a fixed 100-anchor.
  const fmtDsPlus = (o, w) => {
    const v = o.dvm_plus && o.dvm_plus[w];
    if (v == null) return "—";
    const color = v >= 110 ? "var(--up)" : v <= 90 ? "var(--down)" : "var(--text-primary)";
    return `<span style="color:${color};font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:700;">${v}</span>`;
  };
  const fmtDelta = (o, w) => {
    const v = o.delta_above_mean && o.delta_above_mean[w];
    if (v == null) return "—";
    const sign = v > 0 ? "+" : "";
    const color = v > 5 ? "var(--up)" : v < -5 ? "var(--down)" : "var(--text-secondary)";
    return `<span style="color:${color};font-family:var(--font-mono);font-variant-numeric:tabular-nums;">${sign}${v.toFixed(1)}</span>`;
  };
  const rows = [
    ["Farm rank",        o => o.farm_rank != null ? `#${o.farm_rank}` : "—", true],
    ["Total FV",         o => o.total_fv != null ? o.total_fv.toFixed(1) : "—", true],
    ["Prospects tracked", o => String(o.count ?? 0), true],
    ["Avg age",          o => o.avg_age != null ? o.avg_age.toFixed(1) : "—", true],
    ["Young-for-level",  o => String(o.very_young_count ?? 0), true],
    ["Top-end grade",    o => (o.grades && o.grades.top_end) || "—", true],
    ["Depth grade",      o => (o.grades && o.grades.depth) || "—", true],
    ["Trajectory grade", o => (o.grades && o.grades.trajectory) || "—", true],
    ["Grad pipeline",    o => (o.grades && o.grades.grad) || "—", true],
    ["Stock ▲/▼",        o => `${o.stock_up || 0} ▲ · ${o.stock_down || 0} ▼`, true],
    // Raw "Δ vs mean" rows removed — DvM+ encodes the same delta on a
    // normalized 100-anchored scale (100 = league mean, 10 pts = 1 std
    // dev). Showing both is double counting and clutters the table.
    ["1YDvM+",            o => fmtDsPlus(o, "1y"), false],
    ["3YDvM+",            o => fmtDsPlus(o, "3y"), false],
    ["5YDvM+",            o => fmtDsPlus(o, "5y"), false],
  ];
  const tableRows = rows.map(([label, fn, escape]) =>
    `<tr><th>${label}</th>${farms.map(o => {
      const cell = fn(o);
      return `<td>${escape ? escapeHtml(String(cell)) : cell}</td>`;
    }).join("")}</tr>`
  ).join("");
  const table = `<table class="compare-stat-table" style="grid-template-columns:120px ${cols.replace("repeat(", "").replace(", minmax(0, 1fr))", "")};margin-top:8px;width:100%;border-collapse:collapse;">
    <tbody>${tableRows}</tbody></table>`;
  const donutLegend = `<div style="display:flex;gap:8px;justify-content:center;font-size:9px;color:var(--text-tertiary);letter-spacing:0.04em;">
      <span style="display:inline-flex;align-items:center;gap:3px;"><i style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--neon-amber);"></i>IFA</span>
      <span style="display:inline-flex;align-items:center;gap:3px;"><i style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--spend-draft);"></i>Draft</span>
    </div>`;
  const donutRow = `<div style="display:grid;grid-template-columns:${cols};gap:10px;margin-top:10px;">
    ${farms.map(o => `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">${makeSpendingDonut(o, 56)}${donutLegend}<div style="font-size:9px;color:var(--text-tertiary);letter-spacing:0.06em;">3-yr spend mix</div></div>`).join("")}
  </div>`;
  return head + chartRow + donutRow + table;
}

function renderCompareCart() {
  const keys = compareLoad();
  const farmKeys = farmCompareLoad();
  const totalCount = keys.length + farmKeys.length;
  const toggle = document.getElementById("compare-toggle");
  const count  = document.getElementById("compare-count");
  // Hide the floating button entirely when nothing's pinned; visible
  // (full opacity) the moment the user adds their first prospect or farm.
  if (toggle) toggle.classList.toggle("is-empty-hidden", totalCount === 0);
  if (count)  count.textContent = totalCount;
  // Persistent header-rail compare button — same hide-when-empty logic
  // as the in-template button. Survives detail-page content overwrites.
  const gToggle = document.getElementById("global-compare");
  const gCount  = document.getElementById("global-compare-count");
  if (gToggle) gToggle.classList.toggle("is-empty-hidden", totalCount === 0);
  if (gCount)  gCount.textContent = totalCount;
  // Sync any "Add to compare" buttons on the current page (prospects).
  document.querySelectorAll(".compare-add-btn[data-compare-key]").forEach(btn => {
    const isIn = keys.includes(btn.dataset.compareKey);
    btn.classList.toggle("is-in", isIn);
    if (btn.classList.contains("is-compact")) {
      btn.textContent = isIn ? "✓" : "+";
      btn.title = isIn ? "Remove from compare" : "Add to compare";
    } else {
      btn.textContent = isIn ? "✓ In compare" : "+ Add to compare";
    }
  });
  // Same loop for farm-compare buttons (data-farm-compare-key).
  document.querySelectorAll(".compare-add-btn[data-farm-compare-key]").forEach(btn => {
    const isIn = farmKeys.includes(btn.dataset.farmCompareKey);
    btn.classList.toggle("is-in", isIn);
    if (btn.classList.contains("is-compact")) {
      btn.textContent = isIn ? "✓" : "+";
      btn.title = isIn ? "Remove farm from compare" : "Add farm to compare";
    }
  });
  const body = document.getElementById("compare-body");
  if (!body) return;
  if (!totalCount) {
    body.innerHTML = `<div style="color:var(--text-tertiary);font-size:13px;padding:8px 4px;">No prospects or farm systems pinned yet. Tap "+ Add to compare" on any list or detail view.</div>`;
    return;
  }
  // Resolve every pinned key to a full player object (or render a
  // stub if the pin is stale — player no longer in current data).
  const players = [];
  const stubs = [];
  for (const k of keys) {
    const p = findPlayer(k);
    if (p) players.push(p);
    else   stubs.push(k);
  }
  const farms = [];
  const farmStubs = [];
  for (const o of farmKeys) {
    const f = findOrg(o);
    if (f) farms.push(f);
    else   farmStubs.push(o);
  }

  let html = "";

  // Side-by-side is the only render path. The previous single-card
  // branches duplicated layout logic — and after mutual-exclusivity
  // landed, the panel only ever shows one type at a time anyway, so
  // a 1-pin compare is just a 1-column side-by-side.
  if (players.length || stubs.length) {
    const stubHTML = stubs.map(k => `<div class="compare-card"><div style="color:var(--text-tertiary);">Player "${escapeHtml(k)}" not in current data.</div><button class="cc-remove" data-compare-remove="${escapeHtml(k)}">remove</button></div>`).join("");
    if (players.length) {
      html += `<div class="detail-title flush no-rule" style="font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-tertiary);">Prospects · ${players.length}</div>`;
      html += makeCompareSideBySide(players);
    }
    html += stubHTML;
  }

  if (farms.length || farmStubs.length) {
    const farmStubHTML = farmStubs.map(o => `<div class="compare-card"><div style="color:var(--text-tertiary);">Farm "${escapeHtml(o)}" not in current data.</div><button class="cc-remove" data-farm-compare-remove="${escapeHtml(o)}">remove</button></div>`).join("");
    if (farms.length) {
      html += `<div class="detail-title no-rule" style="font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-tertiary);margin-top:14px;">Farm systems · ${farms.length}</div>`;
      html += makeFarmCompareSideBySide(farms);
    }
    html += farmStubHTML;
  }

  body.innerHTML = html;

  // Form-window chips inside the farm-compare block need their own click
  // listeners — attachChipGroup runs once at app-init against elements
  // present at that time, so cart-rendered chips would be inert without
  // this re-attachment. Mutating state.formWindow re-renders the cart,
  // the farm list, and the farm detail page so all three views stay in
  // sync no matter which surface triggered the change.
  body.querySelectorAll("[data-form-window]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.formWindow = btn.dataset.formWindow;
      if (state.view && state.view.type === "farm") renderFarmDetail(state.view.org);
      renderFarmSystems();
      document.querySelectorAll("[data-form-window]").forEach(b =>
        b.classList.toggle("active", b.dataset.formWindow === state.formWindow));
      renderCompareCart();
      syncToURL();
    });
  });
}

function closeCompareAndGo(key) {
  document.getElementById("compare-panel").classList.remove("open");
  goToPlayer(key);
}

function closeCompareAndGoFarm(org) {
  document.getElementById("compare-panel").classList.remove("open");
  goToFarm(org);
}

function attachHandlers() {
  // Delegated row clicks — one listener catches Active / Spotlights /
  // Injured / Traded / Graduates / Farm rows. Each render function used
  // to attach its own forEach loop; the rows now just need data-key or
  // data-org and the delegation does the rest. Phase 4 a11y bolts onto
  // this same listener (Enter/Space → click).
  document.getElementById("content").addEventListener("click", (e) => {
    // "+ Add to compare" buttons live inside .compare-add-btn — handle
    // those before the row delegation so the click doesn't navigate.
    const addBtn = e.target.closest(".compare-add-btn[data-compare-key]");
    if (addBtn) {
      e.stopPropagation();
      compareToggle(addBtn.dataset.compareKey);
      return;
    }
    // Same handler for farm-pin buttons.
    const farmAddBtn = e.target.closest(".compare-add-btn[data-farm-compare-key]");
    if (farmAddBtn) {
      e.stopPropagation();
      farmCompareToggle(farmAddBtn.dataset.farmCompareKey);
      return;
    }
    // Watchlist star — toggle private favorite. Click event captured
    // before row navigation so the page doesn't drill into the player
    // every time the user stars/unstars.
    const watchBtn = e.target.closest(".watch-btn[data-watch-key]");
    if (watchBtn) {
      e.stopPropagation();
      watchlistToggle(watchBtn.dataset.watchKey);
      return;
    }
    // Mobile-only ▾ chevron — expand/collapse the row inline to reveal
    // FV chart, MiLB stats, and ETA cells (which the mobile grid
    // hides by default). stopPropagation so the row-tap-to-open-detail
    // behavior doesn't also fire.
    const expandBtn = e.target.closest(".row-expand-btn");
    if (expandBtn) {
      e.stopPropagation();
      const row = expandBtn.closest(".player-row");
      if (row) row.classList.toggle("is-expanded");
      return;
    }
    // Position-depth-chart "show all" toggle — reveals overflow cards
    // (idx ≥ 5) inline within the row's flex container.
    const posExpandBtn = e.target.closest("[data-pos-row-expand]");
    if (posExpandBtn) {
      e.stopPropagation();
      const key = posExpandBtn.dataset.posRowExpand;
      const cards = document.querySelector(`[data-pos-row="${CSS.escape(key)}"]`);
      const grid = posExpandBtn.closest(".pos-depth-grid");
      if (cards && grid) {
        // Toggle .is-expanded on a synthetic "row" wrapper — we use the
        // cards container itself plus a class on the button.
        const expanded = cards.classList.toggle("is-expanded");
        posExpandBtn.classList.toggle("is-expanded", expanded);
        const total = cards.querySelectorAll(".pos-depth-card").length;
        posExpandBtn.textContent = expanded ? `show top 5` : `show all ${total}`;
      }
      return;
    }
    const farmWatchBtn = e.target.closest(".watch-btn[data-farm-watch-key]");
    if (farmWatchBtn) {
      e.stopPropagation();
      farmWatchlistToggle(farmWatchBtn.dataset.farmWatchKey);
      return;
    }
    const wlTabBtn = e.target.closest("[data-wl-tab]");
    if (wlTabBtn) {
      e.stopPropagation();
      state.watchlistTab = wlTabBtn.dataset.wlTab;
      renderWatchlist();
      return;
    }
    // Combined per-source card: FV / Tools tab swap. Local DOM mutation
    // only; state isn't persisted, so a re-render of the detail page
    // resets to the FV tab. Lives inside the More details accordion.
    const perSrcTabBtn = e.target.closest("[data-per-source-tab]");
    if (perSrcTabBtn) {
      e.stopPropagation();
      const card = perSrcTabBtn.closest(".per-source-card");
      if (card) {
        const tab = perSrcTabBtn.dataset.perSourceTab;
        card.querySelectorAll("[data-per-source-tab]").forEach(b => {
          b.classList.toggle("active", b.dataset.perSourceTab === tab);
        });
        card.querySelectorAll("[data-per-source-panel]").forEach(panel => {
          panel.style.display = (panel.dataset.perSourcePanel === tab) ? "" : "none";
        });
      }
      return;
    }
    // Glossary term click → open the floating popover. Lives in the
    // delegated listener so any new `.g-term` wrapper anywhere on the
    // page becomes clickable without re-binding.
    const gTermBtn = e.target.closest(".g-term[data-term]");
    if (gTermBtn) {
      e.stopPropagation();
      e.preventDefault();
      openGlossaryPopover(gTermBtn);
      return;
    }
    // "Open in glossary →" link inside the popover — navigate to the
    // Glossary tab with the term hash. Dismiss the popover first.
    const gOpenBtn = e.target.closest("[data-glossary-open]");
    if (gOpenBtn) {
      e.preventDefault();
      const slug = gOpenBtn.dataset.glossaryOpen;
      const pop = document.getElementById("glossary-popover");
      if (pop) pop.classList.remove("is-open");
      state.section = "glossary";
      state.view = { type: "list" };
      state.glossaryTerm = slug;
      syncToURL();
      renderSection();
      return;
    }
    // Related-term chips inside a glossary card — scroll to the
    // related term + flash highlight, no popover (we're already on the
    // glossary page).
    const relatedBtn = e.target.closest("[data-related-term]");
    if (relatedBtn) {
      e.preventDefault();
      const slug = relatedBtn.dataset.relatedTerm;
      const card = document.getElementById("g-" + slug);
      if (card) {
        card.scrollIntoView({ behavior: "smooth", block: "start" });
        card.classList.remove("is-highlighted");
        void card.offsetWidth;
        card.classList.add("is-highlighted");
      }
      return;
    }
    // Glossary category chip click.
    const gCatBtn = e.target.closest("[data-glossary-cat]");
    if (gCatBtn) {
      e.stopPropagation();
      state.glossaryCat = gCatBtn.dataset.glossaryCat;
      syncToURL();
      renderGlossary();
      return;
    }
    // Career-by-season "Show level deltas" toggle — flips the deltas
    // panel and the raw panel inside the consolidated career table.
    // Default ON; state is ephemeral.
    const careerToggleBtn = e.target.closest("[data-career-toggle]");
    if (careerToggleBtn) {
      e.stopPropagation();
      const wrap = careerToggleBtn.parentElement && careerToggleBtn.parentElement.nextElementSibling;
      if (wrap && wrap.classList.contains("career-by-season")) {
        const wasOn = careerToggleBtn.classList.contains("active");
        const nowOn = !wasOn;
        careerToggleBtn.classList.toggle("active", nowOn);
        const targetMode = nowOn ? "deltas" : "raw";
        wrap.dataset.careerMode = targetMode;
        wrap.querySelectorAll("[data-career-panel]").forEach(panel => {
          panel.style.display = (panel.dataset.careerPanel === targetMode) ? "" : "none";
        });
      }
      return;
    }
    // Detail-header share buttons — copy current URL or raw player_key.
    // Feedback is the title attribute briefly flipping to "Copied!" then
    // restoring; no toast infrastructure needed.
    const copyUrlBtn = e.target.closest("#detail-copy-url");
    if (copyUrlBtn) {
      e.stopPropagation();
      const url = window.location.href;
      const restore = copyUrlBtn.title;
      navigator.clipboard.writeText(url).then(() => {
        copyUrlBtn.title = "Copied link!";
        setTimeout(() => { copyUrlBtn.title = restore; }, 1200);
      }).catch(() => {
        copyUrlBtn.title = "Copy failed";
        setTimeout(() => { copyUrlBtn.title = restore; }, 1200);
      });
      return;
    }
    const copyKeyBtn = e.target.closest("#detail-copy-key");
    if (copyKeyBtn) {
      e.stopPropagation();
      const key = copyKeyBtn.dataset.copyKey || "";
      if (!key) return;
      const restore = copyKeyBtn.title;
      navigator.clipboard.writeText(key).then(() => {
        copyKeyBtn.title = "Copied key!";
        setTimeout(() => { copyKeyBtn.title = restore; }, 1200);
      }).catch(() => {
        copyKeyBtn.title = "Copy failed";
        setTimeout(() => { copyKeyBtn.title = restore; }, 1200);
      });
      return;
    }
    const row = e.target.closest("[data-key], [data-org]");
    if (!row) return;
    if (row.dataset.key)      goToPlayer(row.dataset.key);
    else if (row.dataset.org) goToFarm(row.dataset.org);
  });

  // Keyboard equivalents — Enter / Space on a focused row activates it.
  // Phase 4 a11y companion to the delegated click handler; tabindex +
  // role are applied by decorateA11yRows after every render.
  document.getElementById("content").addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const row = e.target.closest("[data-key], [data-org]");
    if (!row) return;
    e.preventDefault();
    if (row.dataset.key)      goToPlayer(row.dataset.key);
    else if (row.dataset.org) goToFarm(row.dataset.org);
  });

  // Global "c" hotkey — toggles compare for the row containing the
  // currently focused element. Guarded against modifier keys (Ctrl/Cmd
  // shortcuts stay browser-owned) and against input fields (typing "c"
  // in the search bar should type a "c", not pin a player). Power-user
  // surface; the chip remains the primary affordance.
  document.addEventListener("keydown", (e) => {
    if (e.key !== "c" && e.key !== "C") return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const target = e.target;
    const tag = target && target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || (target && target.isContentEditable)) return;
    const row = target && target.closest && target.closest("[data-key], [data-org]");
    if (!row) return;
    e.preventDefault();
    if (row.dataset.key)      compareToggle(row.dataset.key);
    else if (row.dataset.org) farmCompareToggle(row.dataset.org);
  });

  // Command palette — Cmd/Ctrl-K opens, Esc closes, Enter navigates,
  // Up/Down move the active highlight. Search is a substring match over
  // player names + org codes/names. Limits results to 12 so the modal
  // stays scannable without a search refinement.
  attachCommandPalette();

  // Mobile filter-toggle — flips `#filter-bar.is-open` so the chip
  // rows expand/collapse. Desktop hides the toggle entirely via CSS.
  const filterToggle = document.getElementById("filter-toggle");
  if (filterToggle) {
    filterToggle.addEventListener("click", () => {
      const bar = document.getElementById("filter-bar");
      const isOpen = bar.classList.toggle("is-open");
      filterToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });
  }

  // Comparison-cart open/close + per-card remove buttons.
  document.getElementById("compare-toggle").addEventListener("click", () => {
    const panel = document.getElementById("compare-panel");
    panel.classList.toggle("open");
    if (panel.classList.contains("open")) renderCompareCart();
  });
  // Persistent header-rail compare button — opens the same compare
  // panel. Same handler shape as the in-template button.
  const gCompare = document.getElementById("global-compare");
  if (gCompare) {
    gCompare.addEventListener("click", () => {
      const panel = document.getElementById("compare-panel");
      panel.classList.toggle("open");
      if (panel.classList.contains("open")) renderCompareCart();
    });
  }
  // Persistent header-rail watchlist link — navigates to the watchlist
  // tab from anywhere in the app (detail pages included, where the
  // section-tabs strip isn't rendered).
  const gWatchlist = document.getElementById("global-watchlist");
  if (gWatchlist) {
    gWatchlist.addEventListener("click", () => {
      state.view = { type: "list" };
      state.section = "watchlist";
      syncToURL();
      renderSection();
    });
  }
  document.getElementById("compare-close").addEventListener("click", () => {
    document.getElementById("compare-panel").classList.remove("open");
  });
  document.getElementById("compare-body").addEventListener("click", (e) => {
    const rm = e.target.closest("[data-compare-remove]");
    if (rm) { compareToggle(rm.dataset.compareRemove); return; }
    const frm = e.target.closest("[data-farm-compare-remove]");
    if (frm) farmCompareToggle(frm.dataset.farmCompareRemove);
  });

  document.querySelectorAll(".section-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".section-tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.section = btn.dataset.section;
      // Tab switch always returns to the list — drop any detail view.
      state.view = null;
      render();
    });
  });
  attachChipGroup("spotlight-bucket", "spotlightBucket", () => render(), { clearView: true });

  // Back/forward navigation: re-read the hash and re-render whenever the
  // user uses browser-history controls (or anything else mutates the hash).
  window.addEventListener("hashchange", () => {
    syncFromURL();
    restoreUIFromState();
    render();
  });

  document.querySelectorAll("[data-filter-stock]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-filter-stock]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.stockFilter = btn.dataset.filterStock;
      render();
      syncToURL();
    });
  });
  attachChipGroup("filter-health", "healthFilter", () => render());
  attachChipGroup("filter-spread", "spreadFilter", () => render());
  wireThemeToggle();
  // Density toggle chips — body class + localStorage so the choice
  // survives across sessions and reloads. URL also persists via
  // syncToURL/syncFromURL above.
  document.querySelectorAll("[data-density]").forEach(btn => {
    btn.addEventListener("click", () => {
      const prev = state.density || "standard";
      const next = btn.dataset.density;
      document.body.classList.remove(`density-${prev}`);
      state.density = next;
      document.body.classList.add(`density-${state.density}`);
      try { localStorage.setItem("prospect-tracker.density", next); } catch {}
      document.querySelectorAll("[data-density]").forEach(b =>
        b.classList.toggle("active", b.dataset.density === next));
      render();
      syncToURL();
    });
  });
  // Level filter chips (main list + URL state).
  document.querySelectorAll("[data-filter-level]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-filter-level]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.levelFilter = btn.dataset.filterLevel;
      render();
      syncToURL();
    });
  });
  // Position filter chips.
  document.querySelectorAll("[data-filter-pos]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-filter-pos]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.posFilter = btn.dataset.filterPos;
      render();
      syncToURL();
    });
  });
  // Graduates sort chips. Different surface entirely from the active
  // prospect sort dropdown — the graduates list has its own questions
  // (who graduated most recently / who's been the best MLB performer /
  // who graduated at the highest FV) and benefits from chip toggles.
  attachChipGroup("grad-sort", "gradSort", () => renderGraduates());
  // IL sort chips.
  attachChipGroup("il-sort", "ilSort", () => renderInjured());

  // Leaderboards chip groups — stat picker swaps the metric the board
  // is sorted by; level/pos chips narrow the qualifying pool. All three
  // re-render the leaderboard but don't touch other tabs.
  attachChipGroup("lb-stat",   "lbStat",   () => renderLeaderboards());
  attachChipGroup("lb-level",  "lbLevel",  () => renderLeaderboards());
  attachChipGroup("lb-pos",    "lbPos",    () => renderLeaderboards());
  attachChipGroup("lb-season", "lbSeason", () => renderLeaderboards());
  // Null-guard each selector binding — missing elements (caused by template
  // ordering, embed contexts, or future markup changes) would otherwise
  // throw a TypeError that aborts attachHandlers and breaks every other
  // tab. Each selector wraps in `if (el)` like populateOrgFilter does.
  const lbOrgEl = document.getElementById("lb-org-filter");
  if (lbOrgEl) lbOrgEl.addEventListener("change", e => {
    state.lbOrg = e.target.value;
    renderLeaderboards();
    syncToURL();
  });
  const orgEl = document.getElementById("org-filter");
  if (orgEl) orgEl.addEventListener("change", e => {
    state.orgFilter = e.target.value;
    render();
  });
  const acqEl = document.getElementById("acq-filter");
  if (acqEl) acqEl.addEventListener("change", e => {
    state.acqFilter = e.target.value;
    render();
  });
  const classEl = document.getElementById("class-filter");
  if (classEl) classEl.addEventListener("change", e => {
    state.classFilter = e.target.value;
    render();
  });
  const sortEl = document.getElementById("sort-select");
  if (sortEl) sortEl.addEventListener("change", e => {
    state.sort = e.target.value;
    render();
  });

  const searchInput = document.getElementById("search-input");
  if (searchInput) {
    searchInput.addEventListener("input", e => {
      state.search = e.target.value.trim();
      render();
    });
    // Clear search on Escape
    searchInput.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        state.search = "";
        searchInput.value = "";
        render();
      }
    });
  }

  // Farm sort chips. The unified "Trajectory" chip just sorts by the
  // current state.formWindow's DvM+; the right-side window selector is
  // the one place the window gets changed. Legacy trajectory_(1|3|5)y
  // URL params still flip the window here for backward compat with
  // pre-Phase-3 shared links.
  attachChipGroup("farm-sort", "farmSort", (key) => {
    const trajMatch = /^trajectory_(1y|3y|5y)$/.exec(key);
    if (trajMatch) {
      state.formWindow = trajMatch[1];
      document.querySelectorAll("[data-form-window]").forEach(b =>
        b.classList.toggle("active", b.dataset.formWindow === state.formWindow));
    }
    renderFarmSystems();
  });

  // Form-window chips (1y / 3y / 5y). Drives the sparkline + trajectory
  // delta-above-mean on the farm list, and the windowed trajectory
  // cell on the farm-detail report card. Re-renders both views so the
  // selector works whether the user is on the list or in a detail page.
  attachChipGroup("form-window", "formWindow", () => {
    if (state.view && state.view.type === "farm") renderFarmDetail(state.view.org);
    renderFarmSystems();
    // The compare-cart farm-system block also renders dev-vs-mean charts
    // and a per-window DvM+ table; re-render so the window selector inside
    // the cart stays in sync with the rest of the app.
    renderCompareCart();
  });
  // Farm view-mode toggle (table / cards) — flips state + re-renders.
  attachChipGroup("farm-view", "farmViewMode", () => renderFarmSystems());
}

// Command palette wiring — single keyboard surface that jumps the user
// to any player or org from anywhere in the app. Modeled after the
// VS Code / Linear command palette: Cmd/Ctrl-K opens, query filters,
// arrow keys move highlight, Enter activates, Esc closes. Search is a
// case-insensitive substring match over player names + 3-letter org
// codes + full org names; limits to top 12 hits so the modal stays
// scannable.
function attachCommandPalette() {
  const overlay = document.getElementById("cmd-palette-overlay");
  const input = document.getElementById("cmd-palette-input");
  const results = document.getElementById("cmd-palette-results");
  if (!overlay || !input || !results) return;
  let activeIdx = 0;
  let currentResults = [];

  const renderResults = (query) => {
    const q = (query || "").trim().toLowerCase();
    const players = (DATA.players || []);
    const playerHits = q
      ? players.filter(p => p.player_name.toLowerCase().includes(q)).slice(0, 10)
      : players.slice(0, 8);
    const orgs = getAllOrgs();
    const orgHits = q
      ? orgs.filter(o => o.toLowerCase().includes(q) || fullOrgName(o).toLowerCase().includes(q)).slice(0, 6)
      : orgs.slice(0, 4);
    currentResults = [
      ...playerHits.map(p => ({ kind: "player", key: p.player_key, name: p.player_name, meta: `${p.org || "—"} · FV ${p.fv_close ?? "—"}` })),
      ...orgHits.map(o => ({ kind: "farm",   org: o, name: fullOrgName(o), meta: o })),
    ].slice(0, 12);
    activeIdx = 0;
    if (!currentResults.length) {
      results.innerHTML = `<div class="cmd-palette-empty">No matches. Try a player name or 3-letter org code.</div>`;
      return;
    }
    results.innerHTML = currentResults.map((r, i) => `
      <div class="cmd-palette-result${i === 0 ? " is-active" : ""}" data-cmd-idx="${i}">
        <span class="cpr-kind">${r.kind === "player" ? "Player" : "Farm"}</span>
        <span class="cpr-name">${escapeHtml(r.name)}</span>
        <span class="cpr-meta">${escapeHtml(r.meta)}</span>
      </div>
    `).join("");
  };

  const updateActive = () => {
    results.querySelectorAll(".cmd-palette-result").forEach((el, i) => {
      el.classList.toggle("is-active", i === activeIdx);
    });
    const active = results.querySelector(".cmd-palette-result.is-active");
    if (active && active.scrollIntoView) active.scrollIntoView({ block: "nearest" });
  };

  const openPalette = () => {
    overlay.classList.add("is-open");
    input.value = "";
    renderResults("");
    input.focus();
  };
  const closePalette = () => {
    overlay.classList.remove("is-open");
  };
  const activate = (idx) => {
    const r = currentResults[idx];
    if (!r) return;
    closePalette();
    if (r.kind === "player") goToPlayer(r.key);
    else if (r.kind === "farm") goToFarm(r.org);
  };

  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) {
      e.preventDefault();
      openPalette();
    } else if (e.key === "Escape" && overlay.classList.contains("is-open")) {
      e.preventDefault();
      closePalette();
    }
  });
  input.addEventListener("input", (e) => renderResults(e.target.value));
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); activeIdx = Math.min(currentResults.length - 1, activeIdx + 1); updateActive(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); activeIdx = Math.max(0, activeIdx - 1); updateActive(); }
    else if (e.key === "Enter") { e.preventDefault(); activate(activeIdx); }
  });
  results.addEventListener("click", (e) => {
    const row = e.target.closest(".cmd-palette-result");
    if (!row) return;
    activate(Number(row.dataset.cmdIdx));
  });
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) closePalette();
  });
}

function populateOrgFilter() {
  // Active-list org filter + Leaderboards org filter share the same
  // org enumeration. Two selects, same options.
  for (const selId of ["org-filter", "lb-org-filter"]) {
    const select = document.getElementById(selId);
    if (!select) continue;
    for (const org of getAllOrgs()) {
      const opt = document.createElement("option");
      opt.value = org;
      opt.textContent = org;
      select.appendChild(opt);
    }
  }
  // "Class of" dropdown — populated from every observed acquisition
  // year across active prospects. Desc order so recent classes surface
  // first. Each option labels the year + the method bucket so a user
  // sees "2023 (Draft)" / "2024 (IFA)" rather than ambiguous bare years.
  const classSelect = document.getElementById("class-filter");
  if (classSelect) {
    const years = new Set();
    for (const p of (DATA.players || [])) {
      const yr = (p.acquisition || {}).year;
      if (yr != null) years.add(yr);
    }
    [...years].sort((a, b) => b - a).forEach(yr => {
      const opt = document.createElement("option");
      opt.value = String(yr);
      opt.textContent = `${yr} class`;
      classSelect.appendChild(opt);
    });
    classSelect.value = state.classFilter || "all";
  }
}

// =============================================================================
// BOOT
// =============================================================================
(async () => {
  DATA = await loadData();
  const content = document.getElementById("content");

  if (DATA.__error) {
    content.innerHTML = `
      <div class="state-message state-error">
        Could not load <code>${DATA_URL}</code>: ${escapeHtml(DATA.__error)}
        <br><br>
        <span style="color: var(--text-tertiary);">
          Generate the data first by running <code>python run_monthly.py</code> in the project root,<br>
          then refresh this page. See <code>README.md</code> for setup.
        </span>
      </div>`;
    return;
  }
  if (!DATA.players || DATA.players.length === 0) {
    content.innerHTML = `
      <div class="state-message">
        <strong style="font-weight: 500; color: var(--text-primary);">No prospect data yet.</strong>
        <br><br>
        Edit <code>data/manual_rankings.csv</code> to add prospect rows, then run
        <code>python run_monthly.py</code> in the project root and refresh.
      </div>`;
    return;
  }

  // Mount the main UI
  const tpl = document.getElementById("main-template");
  content.innerHTML = "";
  content.appendChild(tpl.content.cloneNode(true));

  syncFromURL();
  populateOrgFilter();
  restoreUIFromState();
  attachHandlers();
  render();
  // Cart state lives in localStorage — populate the floating button +
  // any in-page "+ Compare" buttons on first paint, then again after
  // every section render (renderCompareCart re-syncs button visuals).
  renderCompareCart();
  // Watchlist + notes wiring. Star badges on rows are re-rendered via
  // syncWatchlistButtons / syncFarmWatchlistButtons each toggle; the tab
  // badge sums starred prospects + starred farms so the user always
  // knows the combined pin count.
  updateWatchlistTabBadge();
  // Notes textarea — single delegated handler on #content saves each
  // keystroke (debounced to ~250ms so localStorage isn't slammed on
  // every keystroke for long notes).
  let _noteSaveTimer = null;
  document.getElementById("content").addEventListener("input", (e) => {
    // Glossary search box — debounced re-render.
    if (e.target && e.target.id === "glossary-search") {
      clearTimeout(_glossarySearchTimer);
      _glossarySearchTimer = setTimeout(() => {
        state.glossarySearch = e.target.value || "";
        syncToURL();
        renderGlossary();
      }, 120);
      return;
    }
    const ta = e.target.closest("textarea[data-note-key], textarea[data-farm-note-key]");
    if (!ta) return;
    clearTimeout(_noteSaveTimer);
    if (ta.dataset.farmNoteKey) {
      const orgCode = ta.dataset.farmNoteKey;
      _noteSaveTimer = setTimeout(() => farmNoteSave(orgCode, ta.value), 250);
    } else {
      const key = ta.dataset.noteKey;
      _noteSaveTimer = setTimeout(() => noteSave(key, ta.value), 250);
    }
  });
  let _glossarySearchTimer = null;

  // Warm the sidecar slices in the background. The user has to click
  // before they touch the graduates/inactive/farm-detail data, so by
  // the time they navigate, the slice is usually already on DATA.
  // If they beat the network, the render branches re-fire render()
  // once the slice arrives.
  if (DATA && DATA._slices) {
    setTimeout(() => {
      loadSlice("graduates");
      loadSlice("rosters_by_org");
      loadSlice("inactive");
    }, 0);
  }
})();
</script>
