  // Filled wedge between the line and the mean baseline so eye picks
  // up sign-and-magnitude in one glance: above-mean orgs get a green
  // shaded area on top, below-mean get a red shaded area below.
  const lastX = FORM_BAR_W.toFixed(1);
  const baseY = zeroY.toFixed(1);
  const fillPoints = `0,${baseY} ${points} ${lastX},${baseY}`;

  const titleText = `${windowKey} development vs mean: ${sign}${delta.toFixed(1)} (mean Δ ${baseline.toFixed(1)}) · acquisitions excluded`;

  return `<div class="tier-bar" style="gap:8px;">
    <svg width="${FORM_BAR_W}" height="${FORM_BAR_H}" style="border-radius:2px;overflow:hidden;flex-shrink:0"
         aria-label="${escapeHtml(titleText)}"><title>${escapeHtml(titleText)}</title>
      ${baselineLine}
      <polygon points="${fillPoints}" fill="${stroke}" opacity="0.10"/>
      <polyline points="${points}" fill="none" stroke="${stroke}"
                stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <span style="color:${stroke};font-size:11px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;">${deltaLabel}</span>
  </div>`;
}

function makeTierBar(prospects) {
  const total = (prospects || []).length;
  if (!total) return '<span style="color:var(--text-tertiary);font-size:11px;">—</span>';

  const counts = Object.fromEntries(TIER_BUCKETS.map(t => [t, 0]));
  prospects.forEach(p => {
    const n = parseInt(p.fv_label, 10);
    const tier = TIER_BUCKETS.find(t => n >= t) ?? 20;
    counts[tier]++;
  });

  const W = 110;
  let x = 0;
  // SVG `fill` as an attribute (fill="var(--…)") doesn't reliably
  // resolve CSS custom properties across browsers — Safari in
  // particular renders the rect transparent. The inline `style="fill:
  // var(--…)"` form goes through the CSS pipeline and honors the var
  // everywhere we care about.
  const segments = TIER_BUCKETS.filter(t => counts[t] > 0).map(t => {
    const w = (counts[t] / total) * W;
    const rect = `<rect x="${x.toFixed(1)}" y="0" width="${w.toFixed(1)}" height="10" style="fill:var(--fv-${t}-fg);" opacity="0.9"><title>${counts[t]} × FV ${t}${t === 60 ? '+' : ''}</title></rect>`;
    x += w;
    return rect;
  }).join('');

  // Labels: show counts for the meaningful tiers (≥40), capped to 4.
  const labels = TIER_BUCKETS
    .filter(t => t >= 40 && counts[t] > 0)
    .slice(0, 4)
    .map(t => `<span style="color:var(--fv-${t}-fg);font-size:10px;">${counts[t]}×${t}</span>`)
    .join(' ');

  return `<div class="tier-bar">
    <svg width="${W}" height="10" style="border-radius:2px;overflow:hidden;flex-shrink:0">
      ${segments}
    </svg>
    <span>${labels}</span>
  </div>`;
}

function makePosBreakdown(posGroups) {
  const ORDER = ["C","1B","INF","OF","P","?"];
  const COLORS = { C:"#E8A020", "1B":"#C8A050", INF:"#3DBF7A", OF:"#5090E0", P:"var(--down)", "?":"var(--text-tertiary)" };
  return ORDER.filter(k => posGroups && posGroups[k]).map(k =>
    `<span class="pos-pill" style="background:${COLORS[k]}1a;color:${COLORS[k]};border:1px solid ${COLORS[k]}44;">${k}&nbsp;${posGroups[k]}</span>`
  ).join('');
}

// Map letter grades to colors. A+/A tiers glow up, D dims down.
function gradeColor(letter) {
  if (!letter) return 'var(--text-tertiary)';
  if (letter === 'A+' || letter === 'A')             return 'var(--up)';
  if (letter === 'A-' || letter === 'B+')            return '#7EC880';
  if (letter === 'B'  || letter === 'B-')            return 'var(--text-primary)';
  if (letter === 'C+' || letter === 'C')             return '#C8A050';
  if (letter === 'C-' || letter === 'D')             return 'var(--down)';
  return 'var(--text-secondary)';
}

// Farm report card — four component grades + the overall. Renders on the
// farm-detail page right under the header so the user sees at a glance
// what's actually driving the org's rank (e.g. "A on top-end, D on
// trajectory" tells a very different story than just "B+ overall").
function makeFarmReportCard(org) {
  if (!org || !org.grades) return '';
  const g = org.grades;
  const r = org.component_ranks || {};
  const n = (DATA.org_summary || []).length || 30;
  // Trajectory cell flexes with the active form window. The cell shows
  // delta-above-mean for that window (so the eye-line tracks what the
  // list-page sparkline is showing), while the component letter grade
  // stays anchored to the 1y trajectory_score that fed `farm_score` —
  // recomputing grades per window would let the user appear to "earn"
  // a different overall grade just by toggling the chip.
  const win = state.formWindow || "3y";
  const winLabel = win === "1y" ? "1y" : win === "3y" ? "3y" : "5y";
  const trajWindowed = (org.delta_above_mean || {})[win]
                      ?? (org.trajectories || {})[win]
                      ?? org.trajectory_score
                      ?? null;
  const dsPlus = (org.dvm_plus || {})[win];

  const fmtPts = v => v != null ? `${v.toFixed(1)} pts` : '—';
  const fmtSigned = v => v != null
    ? `${v > 0 ? '+' : ''}${v.toFixed(1)} · ${winLabel} vs mean${dsPlus != null ? ` · ${winLabel.toUpperCase()}DvM+ ${dsPlus}` : ''}`
    : '—';

  const stripCell = (label, letter, rank, scoreVal, scoreFmt, tooltip) => `
    <div class="report-strip-cell" style="border-color:${gradeColor(letter)}33;" title="${escapeHtml(tooltip)}">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:6px;">
        <span class="rs-letter" style="color:${gradeColor(letter)};">${escapeHtml(letter || '—')}</span>
        <span class="rs-meta">#${rank ?? '—'}</span>
      </div>
      <div class="rs-label">${escapeHtml(label)}</div>
      <div class="rs-meta">${scoreFmt(scoreVal)}</div>
    </div>`;

  return `
    <div style="display:grid;grid-template-columns:minmax(180px, 0.9fr) minmax(0, 2.4fr);gap:12px;margin-bottom:18px;align-items:stretch;">
      <div class="stat-tile" style="border-color:${gradeColor(g.overall)}66;background:linear-gradient(135deg, ${gradeColor(g.overall)}12, transparent);display:flex;flex-direction:column;justify-content:center;">
        <div class="stat-label">Overall grade</div>
        <div style="display:flex;align-items:baseline;gap:10px;margin-top:2px;">
          <div class="stat-value" style="color:${gradeColor(g.overall)};font-size:44px;line-height:1;font-weight:700;">${escapeHtml(g.overall || '—')}</div>
          <div style="font-size:12px;color:var(--text-tertiary);font-family:var(--font-mono);">
            #${org.farm_rank ?? '—'} of ${n}
          </div>
        </div>
        <div style="margin-top:4px;font-size:11px;color:var(--text-secondary);font-family:var(--font-mono);">
          farm_score ${org.farm_score != null ? org.farm_score.toFixed(1) : '—'}/100
        </div>
      </div>
      <div class="report-strip" style="margin-top:0;">
        ${stripCell('Top-end',    g.top_end,    r.top_end,    org.top_end_points,
                    fmtPts,    'Tiered-FV sum of the org’s top 5 prospects. An 80 is worth ~100 points; a 40 is worth 1.')}
        ${stripCell('Depth',      g.depth,      r.depth,      org.depth_points,
                    fmtPts,    'Tiered-FV sum of prospects #6 through #25. Rewards systems with real prospects beyond the top tier.')}
        ${stripCell('Trajectory', g.trajectory, r.trajectory, trajWindowed,
                    fmtSigned, `${winLabel} cumulative-FV growth above the league mean over the same window. ${winLabel.toUpperCase()}DvM+ is the wRC+/OPS+-style index where 100 = league mean and 10 points = 1 standard deviation. Pure-development metric: graduations + acquisitions (trades, draft, IFA) are nullified, so only FV growth while the player is in the org counts. Letter grade stays anchored to the 1y trajectory used for farm_score.`)}
        ${stripCell('Grad pipe',  g.grad,       r.grad,       org.grad_pipeline_score,
                    fmtPts,    'FV-weighted graduations in the trailing 12 months. Promoting a 60 is worth ~18 points; a 40 is worth 1.')}
      </div>
    </div>`;
}

// Full-size growth chart for a single org on the farm-detail page.
// Same conceptual model as the list-page sparkline (org cumulative FV
// minus a linear mean-baseline so the y-axis reads "growth above the
// league mean"), drawn larger with gridlines, year markers, and an
// explicit zero-line so the reader can pick up the magnitude and slope
// without hovering. Reacts to state.formWindow (1y / 3y / 5y).
//
// `chartWidth` is optional — defaults to 760 (the single-pane farm detail
// page) but can be overridden by the side-by-side compare view, which
// shrinks each chart to fit N orgs in a row. Height stays fixed because
// the internal padding constants (PAD_*) are designed for that aspect.
function makeFarmGrowthChart(org, meanTrajectory, windowKey, chartWidth) {
  const windowDays = FORM_WINDOW_DAYS[windowKey] || 365;
  const series = (org && org.fv_history) || [];
  if (series.length < 2) {
    return `<div style="color:var(--text-tertiary);font-size:12px;">Not enough cumulative-FV history yet for a chart.</div>`;
  }
  const cutoffMs = Date.now() - windowDays * 24 * 60 * 60 * 1000;
  const cutoffIso = new Date(cutoffMs).toISOString().slice(0, 10);
  let recent = series.filter(s => s.date >= cutoffIso);
  if (recent.length < 2) recent = series.slice(-2);

  const startMs  = new Date(recent[0].date).getTime();
  const endMs    = new Date(recent[recent.length - 1].date).getTime();
  const spanMs   = Math.max(endMs - startMs, 1);
  const startFv  = recent[0].total_fv;
  const baseline = meanTrajectory || 0;
  const rel = recent.map(s => {
    const t = (new Date(s.date).getTime() - startMs) / spanMs;
    return { x: t, v: (s.total_fv - startFv) - (baseline * t) };
  });
  const vals  = rel.map(p => p.v);
  const minV  = Math.min(0, ...vals);
  const maxV  = Math.max(0, ...vals);
  const padPct = 0.1;
  const range  = Math.max(1, maxV - minV);
  const yMin = minV - range * padPct;
  const yMax = maxV + range * padPct;

  const W = chartWidth || 760, H = 220;
  const PAD_L = 38, PAD_R = 14, PAD_T = 14, PAD_B = 28;
  const innerW = W - PAD_L - PAD_R;
  const innerH = H - PAD_T - PAD_B;
  const xFor = t => PAD_L + t * innerW;
  const yFor = v => PAD_T + innerH - ((v - yMin) / (yMax - yMin)) * innerH;
  const zeroY = yFor(0);

  // Y-axis: 5 ticks across the value range. Tick labels show signed
  // delta from the typical farm so the units are concrete.
  const yTicks = [];
  for (let i = 0; i <= 4; i++) {
    const v = yMin + (yMax - yMin) * (i / 4);
    const y = yFor(v).toFixed(1);
    const isZero = Math.abs(v) < 0.5;
    yTicks.push(
      `<line x1="${PAD_L}" y1="${y}" x2="${W - PAD_R}" y2="${y}" stroke="${isZero ? 'var(--text-tertiary)' : 'var(--border-light)'}" stroke-width="${isZero ? 0.9 : 0.4}" stroke-dasharray="${isZero ? '4,3' : '2,3'}"/>`,
      `<text x="${PAD_L - 5}" y="${y}" dy="3" font-size="9" fill="var(--text-tertiary)" text-anchor="end" font-family="var(--font-mono)">${v >= 0 ? '+' : ''}${v.toFixed(0)}</text>`,
    );
  }

  // X-axis: tick + year/quarter labels. We mark every year boundary
  // that falls inside the window, and label the first + last actual
  // snapshot date so the axis is anchored.
  const xMarks = [];
  const startDate = new Date(recent[0].date);
  const endDate = new Date(recent[recent.length - 1].date);
  for (let yr = startDate.getFullYear(); yr <= endDate.getFullYear() + 1; yr++) {
    const yrT = Date.UTC(yr, 0, 1);
    if (yrT < startMs || yrT > endMs) continue;
    const t = (yrT - startMs) / spanMs;
    const x = xFor(t).toFixed(1);
    xMarks.push(
      `<line x1="${x}" y1="${PAD_T}" x2="${x}" y2="${H - PAD_B}" stroke="var(--border-light)" stroke-width="0.4" stroke-dasharray="2,3"/>`,
      `<text x="${x}" y="${H - PAD_B + 14}" font-size="10" fill="var(--text-tertiary)" text-anchor="middle">${yr}</text>`,
    );
  }
  xMarks.push(
    `<text x="${xFor(0).toFixed(1)}" y="${H - 4}" font-size="9" fill="var(--text-tertiary)" text-anchor="start">${recent[0].date}</text>`,
    `<text x="${xFor(1).toFixed(1)}" y="${H - 4}" font-size="9" fill="var(--text-tertiary)" text-anchor="end">${recent[recent.length - 1].date}</text>`,
  );

  // Plot the mean baseline as a clean horizontal at y=0 (drawn
  // already by the zero-tick above) and a labeled "mean pace" tag at
  // the right edge so readers know what the line represents.
  const baselineTag = `<text x="${(W - PAD_R - 4).toFixed(1)}" y="${(zeroY - 6).toFixed(1)}" font-size="9" fill="var(--text-tertiary)" text-anchor="end" font-style="italic">league mean pace</text>`;

  // Org curve: stroke color by sign of final delta (above-mean = up).
  const finalV = vals[vals.length - 1];
  const stroke = finalV >  Math.max(5, Math.abs(baseline) * 0.05) ? 'var(--up)'
              : finalV < -Math.max(5, Math.abs(baseline) * 0.05) ? 'var(--down)'
              :                                                    'var(--text-tertiary)';
  const points = rel.map(p =>
    `${xFor(p.x).toFixed(1)},${yFor(p.v).toFixed(1)}`
  ).join(" ");
  // Fill polygon between curve and zero-line so above-mean shows as
  // a green shaded region above zero, below-mean as red below.
  const polyTop = `${xFor(0).toFixed(1)},${zeroY.toFixed(1)} ${points} ${xFor(1).toFixed(1)},${zeroY.toFixed(1)}`;
  const dsPlus = (org && org.dvm_plus && org.dvm_plus[windowKey] != null)
    ? `${windowKey.toUpperCase()}DvM+ ${org.dvm_plus[windowKey]}` : null;
  const labelTxt = `${windowKey} development vs mean: ${finalV >= 0 ? '+' : ''}${finalV.toFixed(1)}${dsPlus ? ` · ${dsPlus}` : ''}`;

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${escapeHtml(labelTxt)}">
    ${yTicks.join("")}
    ${xMarks.join("")}
    <polygon points="${polyTop}" fill="${stroke}" opacity="0.10"/>
    <polyline points="${points}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${baselineTag}
    <text x="${(W - PAD_R - 4).toFixed(1)}" y="${PAD_T + 12}" font-size="11" fill="${stroke}" text-anchor="end" font-family="var(--font-mono)" font-weight="700">${escapeHtml(labelTxt)}</text>
  </svg>`;
}

// Full farm-system transactions section — a chronological table of every
// trade + non-trade transaction touching the org. Kind chips above the
// table filter by event type (trades, waiver claims, releases, etc.);
// the "in/out" toggle filters by direction. The same data feeds the
// sidebar per-kind cards but here it has room to breathe — full date,
// other org, kind chip, player headshot + name, and the description.
function makeFarmTransactionsSection(allEvents, orgCode) {
  if (!allEvents.length) {
    return `<div class="detail-title">Farm-system transactions</div>
      <div style="color:var(--text-tertiary);font-size:12px;">No transactions on file for this org's prospects.</div>`;
  }
  // Filter via shared state so back-button navigation preserves the
  // active filter chips.
  const activeKind = state.farmTxKind || "all";
  const activeDir  = state.farmTxDir  || "all";

  let evs = allEvents.slice();
  if (activeKind !== "all") evs = evs.filter(e => e.kind === activeKind);
  if (activeDir === "in")   evs = evs.filter(e => e.to_org === orgCode);
  if (activeDir === "out")  evs = evs.filter(e => e.from_org === orgCode);

  // Build per-kind tallies for the chip labels so the user can see how
  // many events of each type exist before filtering.
  const kindTallies = { all: allEvents.length };
  for (const e of allEvents) {
    kindTallies[e.kind] = (kindTallies[e.kind] || 0) + 1;
  }
  // Kind chips: kinds the org actually has events for, plus "All".
  const FARM_TX_KINDS = [
    ["all",                "All"],
    ["trade",              "Trades"],
    ["waiver_claim",       "Waiver claims"],
    ["signed_free_agent",  "FA signings"],
    ["released",           "Releases"],
    ["dfa",                "DFA"],
    ["outrighted",         "Outrights"],
    ["contract_purchase",  "Purchases"],
    ["rule_5_return",      "Rule 5 returns"],
  ];
  const kindChips = FARM_TX_KINDS
    .filter(([k]) => k === "all" || kindTallies[k])
    .map(([k, lbl]) => {
      const active = activeKind === k;
      const n = kindTallies[k] || 0;
      return `<button class="chip${active ? " active" : ""}" data-farm-tx-kind="${escapeHtml(k)}" type="button">${escapeHtml(lbl)} <span style="color:var(--text-tertiary);font-weight:400;">(${n})</span></button>`;
    }).join("");

  const inN  = allEvents.filter(e => e.to_org === orgCode).length;
  const outN = allEvents.filter(e => e.from_org === orgCode).length;
  const dirChips = [
    ["all", "Both", allEvents.length],
    ["in",  "In",   inN],
    ["out", "Out",  outN],
  ].map(([k, lbl, n]) => {
    const active = activeDir === k;
    return `<button class="chip${active ? " active" : ""}" data-farm-tx-dir="${escapeHtml(k)}" type="button">${escapeHtml(lbl)} <span style="color:var(--text-tertiary);font-weight:400;">(${n})</span></button>`;
  }).join("");

  const rowHtml = (ev) => {
    const cfg = TRANSACTION_KINDS[ev.kind] || {};
    const kindChip = `<span style="display:inline-flex;align-items:center;gap:4px;border:1px solid ${cfg.color || 'var(--text-tertiary)'};color:${cfg.color || 'var(--text-tertiary)'};background:transparent;font-family:var(--font-sans);font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:1px 6px;border-radius:2px;white-space:nowrap;">${escapeHtml(cfg.label || ev.kind)}</span>`;
    const inbound = ev.to_org === orgCode;
    const arrow = inbound
      ? `<span style="color:var(--up);font-weight:700;">+</span>`
      : `<span style="color:var(--down);font-weight:700;">→</span>`;
    const other = inbound ? ev.from_org : ev.to_org;
    const gradTag = ev.graduate
      ? `<span style="font-size:9px;color:var(--text-tertiary);margin-left:6px;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;">grad</span>`
      : "";
    // Inline highlight of the player name as a clickable link.
    const name = `<a href="#player=${escapeHtml(ev.player.player_key)}" onclick="event.preventDefault();event.stopPropagation();goToPlayer('${escapeHtml(ev.player.player_key)}');" style="color:var(--neon-cyan);text-decoration:none;font-weight:600;">${escapeHtml(ev.player.player_name)}</a>${gradTag}`;
    const desc = ev.description
      ? `<span style="color:var(--text-secondary);font-size:11px;">${highlightTrackedNamesInText(ev.description, ev.player.player_key)}</span>`
      : "";
    return `<tr>
      <td style="white-space:nowrap;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:11px;color:var(--text-secondary);">${escapeHtml(ev.date || "—")}</td>
      <td>${kindChip}</td>
      <td>${name}</td>
      <td style="white-space:nowrap;font-family:var(--font-mono);font-size:11px;">${arrow} ${other ? `<a href="#farm-org=${escapeHtml(other)}" style="color:inherit;text-decoration:none;">${escapeHtml(other)}</a>` : "—"}</td>
      <td>${desc}</td>
    </tr>`;
  };

  // Cap the visible rows. Showing 200 events at once is fine for the
  // typical org; if a user wants more they can use chip filters.
  const CAP = 200;
  const shown = evs.slice(0, CAP);
  const tail = evs.length > CAP
    ? `<div style="font-size:11px;color:var(--text-tertiary);text-align:center;padding:6px;">Showing ${CAP} of ${evs.length}. Use filters above to narrow.</div>`
    : "";

  return `<div class="detail-title">Farm-system transactions
      <span class="detail-title-sub">${allEvents.length} total across tracked prospects</span>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px;">
      <span class="filter-label" style="min-width:50px;">Type</span>${kindChips}
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;">
      <span class="filter-label" style="min-width:50px;">Direction</span>${dirChips}
    </div>
    <table class="detail-table"><thead><tr>
      <th>Date</th><th>Type</th><th>Prospect</th><th>Move</th><th>Detail</th>
    </tr></thead><tbody>${shown.map(rowHtml).join("")}</tbody></table>
    ${tail}`;
}


// Acquisition-spending block — IFA vs Draft year-by-year for one org.
// Renders on the farm-detail page so a reader can compare an
// organization's amateur-talent commitment by channel at a glance.
// IFA totals come from the Spotrac scrape (every signing in the cycle,
// not just our tracked prospects); Draft totals come from our own
// acquisitions table (Bonus-Pool slot bonuses for every drafted player
// we have on file, including graduates). Bars are scaled relative to
// the org's largest single year so internal proportions matter more
// than absolute dollars — the totals header carries the gross.
function _fmtDollars(n) {
  if (!n || n <= 0) return "$0";
  if (n >= 1_000_000) return `$${(n / 1_000_000).toFixed(n >= 10_000_000 ? 1 : 2)}M`;
  if (n >= 1_000)     return `$${(n / 1_000).toFixed(0)}K`;
  return `$${n.toLocaleString("en-US")}`;
}
function makeSpendingBlock(org) {
  const ifa = org && org.ifa_spending ? org.ifa_spending : {};
  const draft = org && org.draft_spending ? org.draft_spending : {};
  const allYears = new Set([
    ...Object.keys(ifa).map(y => +y),
    ...Object.keys(draft).map(y => +y),
  ]);
  if (allYears.size === 0) {
    return `<div style="color:var(--text-tertiary);font-size:12px;">No bonus data on file for this org's amateur acquisitions.</div>`;
  }
  // Window: Spotrac IFA data starts in 2021, so anchor here to keep the
  // comparison apples-to-apples. Drafts before 2021 exist in our data
  // but the per-year mini-bar list filters them out for symmetry.
  const years = [...allYears].filter(y => y >= 2021).sort((a, b) => b - a);

  const ifaTotal   = years.reduce((sum, y) => sum + ((ifa[y]   || {}).total_usd || 0), 0);
  const draftTotal = years.reduce((sum, y) => sum + ((draft[y] || {}).total_usd || 0), 0);
  const ifaSign    = years.reduce((sum, y) => sum + ((ifa[y]   || {}).signings  || 0), 0);
  const draftSign  = years.reduce((sum, y) => sum + ((draft[y] || {}).signings  || 0), 0);
  const grandTotal = ifaTotal + draftTotal;
  const ifaPct     = grandTotal ? (ifaTotal / grandTotal) * 100 : 0;
  const draftPct   = grandTotal ? (draftTotal / grandTotal) * 100 : 0;

  // Donut chart — IFA vs Draft share of the multi-year amateur spend.
  // Built from two stroked circle arcs: the IFA arc starts at 12
  // o'clock and goes clockwise; the Draft arc fills the remainder.
  // Stroke-dasharray is "arc_length total_circumference" so the
  // fraction of the circle each arc covers maps directly to its
  // dollar share of grandTotal.
  const R = 48, CX = 60, CY = 60, STROKE = 16;
  const C = 2 * Math.PI * R;
  const ifaArc   = (C * ifaPct)   / 100;
  const draftArc = (C * draftPct) / 100;
  const ifaColor   = "var(--neon-amber)";
  const draftColor = "var(--neon-cyan)";
  const donutSvg = `<svg viewBox="0 0 120 120" width="140" height="140" role="img" aria-label="IFA vs Draft spending mix">
    <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="var(--bg-tertiary)" stroke-width="${STROKE}"/>
    <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${draftColor}" stroke-width="${STROKE}"
            stroke-dasharray="${C} ${C}"
            transform="rotate(-90 ${CX} ${CY})"/>
    <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${ifaColor}" stroke-width="${STROKE}"
            stroke-dasharray="${ifaArc.toFixed(2)} ${C}"
            transform="rotate(-90 ${CX} ${CY})"/>
    <text x="${CX}" y="${CY - 2}" text-anchor="middle" font-family="var(--font-mono)" font-size="18" font-weight="700" fill="var(--text-primary)">${_fmtDollars(grandTotal)}</text>
    <text x="${CX}" y="${CY + 14}" text-anchor="middle" font-family="var(--font-sans)" font-size="9" letter-spacing="0.1em" fill="var(--text-tertiary)">${years.length}-YR TOTAL</text>
  </svg>`;

  // Build cleaner subline copy. Avoid the previous mix of "signings ·
  // avg" (which awkwardly omitted the word "bonus") in favor of an
  // explicit "X bonuses · avg $Y" so the reader sees what the number
  // is averaging over.
  const ifaAvg   = ifaSign   ? ifaTotal   / ifaSign   : 0;
  const draftAvg = draftSign ? draftTotal / draftSign : 0;
  const donutLegend = `<div style="display:flex;gap:12px;justify-content:center;margin-top:6px;font-family:var(--font-sans);font-size:10px;color:var(--text-secondary);letter-spacing:0.04em;">
    <span style="display:inline-flex;align-items:center;gap:5px;"><span aria-hidden="true" style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--neon-amber);"></span>IFA</span>
    <span style="display:inline-flex;align-items:center;gap:5px;"><span aria-hidden="true" style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--spend-draft);"></span>Draft</span>
  </div>`;
  // Draft-pool utilization caption — surfaces the most-recent year on
  // file where we have BOTH a spend value AND an MLB-assigned pool
  // ceiling. Reads "$5.4M / $7.7M pool · 70%" with the percentage
  // color-coded: green if ≥95% (used the full bag), neutral if 70-95%,
  // amber if <70% (left budget on the table). Per-year captions also
  // attach to each year's mini-bar row below so multi-year cycles are
  // visible at once.
  let draftPoolCaption = "";
  let mostRecentDraftUtil = null;
  for (const yr of years) {  // years is sorted desc above
    const util = _orgDraftPoolUtilization(org, yr);
    if (util) {
      mostRecentDraftUtil = { year: yr, util };
      break;
    }
  }
  if (mostRecentDraftUtil) {
    const { year: yr, util } = mostRecentDraftUtil;
    const pctColor = util.pct >= 95 ? "var(--up)"
                   : util.pct >= 70 ? "var(--text-secondary)"
                   : "var(--neon-amber)";
    draftPoolCaption = `<div class="st-pool" title="MLB-assigned ${yr} draft bonus pool from the slot-value framework (mlb.com). Teams may exceed by up to ~5% before luxury-tax penalties.">
      <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);letter-spacing:0.02em;font-variant-numeric:tabular-nums;">${yr} pool: ${_fmtDollars(util.spent)} / ${_fmtDollars(util.cap)}</span>
      <span style="font-family:var(--font-mono);font-size:10px;color:${pctColor};font-weight:700;font-variant-numeric:tabular-nums;margin-left:6px;">${util.pct.toFixed(0)}%</span>
    </div>`;
  }

  const totalsHtml = `<div class="spending-summary">
    <div class="ss-donut">${donutSvg}${donutLegend}</div>
    <div class="ss-totals">
      <div class="st-cell st-ifa">
        <div class="st-label">International FA · ${ifaPct.toFixed(0)}% of spend</div>
        <div class="st-value">${_fmtDollars(ifaTotal)}</div>
        <div class="st-sub">${ifaSign} bonuses · avg ${_fmtDollars(ifaAvg)} per signing</div>
      </div>
      <div class="st-cell st-draft">
        <div class="st-label">Draft · ${draftPct.toFixed(0)}% of spend</div>
        <div class="st-value">${_fmtDollars(draftTotal)}</div>
        <div class="st-sub">${draftSign} picks signed · avg ${_fmtDollars(draftAvg)} per pick</div>
        ${draftPoolCaption}
      </div>
    </div>
  </div>`;

  // Year-by-year mini bars kept underneath the donut. The donut shows
  // the multi-year mix at a glance; the per-year bars let the reader
  // see cycle-to-cycle changes (e.g. a deadline trade-deadline draft
  // year that spikes draft spending). Scaled to the largest single-
  // year combined total so internal proportions stay readable.
  let maxYear = 1;
  for (const y of years) {
    const i = (ifa[y]   || {}).total_usd || 0;
    const d = (draft[y] || {}).total_usd || 0;
    maxYear = Math.max(maxYear, i, d);
  }
  const rowHtml = (yr) => {
    const iRec = ifa[yr]   || {};
    const dRec = draft[yr] || {};
    const iVal = iRec.total_usd || 0;
    const dVal = dRec.total_usd || 0;
    const iPctYr = Math.min(100, (iVal / maxYear) * 100);
    const dPctYr = Math.min(100, (dVal / maxYear) * 100);
    const iTip = iRec.top_player ? `Top: ${iRec.top_player} (${_fmtDollars(iRec.top_bonus || 0)})` : "";
    const dTip = dRec.top_player ? `Top: ${dRec.top_player} (${_fmtDollars(dRec.top_bonus || 0)})` : "";
    // Per-year draft pool utilization — appended after the draft
    // dollar amount when MLB-assigned pool data is on file for that
    // year. "85%" colored green ≥95% / neutral 70-95% / amber <70%.
    const util = _orgDraftPoolUtilization(org, yr);
    let utilSuffix = "";
    if (util) {
      const pctColor = util.pct >= 95 ? "var(--up)"
                     : util.pct >= 70 ? "var(--text-tertiary)"
                     : "var(--neon-amber)";
      utilSuffix = ` <span title="MLB-assigned ${yr} pool: ${_fmtDollars(util.cap)} (${util.pct.toFixed(0)}% used)" style="font-family:var(--font-mono);font-size:9px;color:${pctColor};font-weight:700;letter-spacing:0;font-variant-numeric:tabular-nums;margin-left:4px;cursor:help;">${util.pct.toFixed(0)}%</span>`;
    }
    return `
      <div class="spending-year">${yr}</div>
      <div class="spending-bars">
        <div class="spending-bar sb-ifa" title="${escapeHtml(iTip)}">
          <span class="sb-label">IFA</span>
          <span class="sb-track"><span class="sb-fill" style="width:${iPctYr.toFixed(1)}%;"></span></span>
          <span class="sb-amt">${_fmtDollars(iVal)}</span>
        </div>
        <div class="spending-bar sb-draft" title="${escapeHtml(dTip)}">
          <span class="sb-label">Draft</span>
          <span class="sb-track"><span class="sb-fill" style="width:${dPctYr.toFixed(1)}%;"></span></span>
          <span class="sb-amt">${_fmtDollars(dVal)}${utilSuffix}</span>
        </div>
      </div>`;
  };

  return totalsHtml + `
    <details class="spending-detail">
      <summary>Show per-year breakdown</summary>
      <div class="spending-grid">${years.map(rowHtml).join("")}</div>
    </details>`;
}

// FV-distribution histogram for an org. Used in the farm-detail sidebar
// and (in compact form) on the farm-list page. Buckets prospects into
// the standard FV bands (≥60, 55, 50, 45, 40). Each tier gets a
// distinct, vivid color so the histogram reads at a glance — the old
// pairing tried to reuse the `--fv-XX-fg` text-color set, which paints
// the bars in dark earth tones that vanish against the sidebar's light
// cream background. The palette below goes from gold/amber (elite) down
// through cyan / green / steel to a muted gray for 40 — same intuitive
// "higher tier = warmer" mapping used everywhere else in the UI.
const FV_HIST_TIERS = [60, 55, 50, 45, 40];
const FV_TIER_COLORS = {
  60: "var(--neon-amber)",       // gold — elite / 60+ tier
  55: "#C9802A",                  // burnt orange — secondary star tier
  50: "#3DBF7A",                  // emerald — MLB-regular line
  45: "#5090E0",                  // steel blue — backup/utility band
  40: "#8B8B8B",                  // muted gray — org filler
};
function makeFvHistogram(prospects, opts) {
  opts = opts || {};
  const counts = Object.fromEntries(FV_HIST_TIERS.map(t => [t, 0]));
  (prospects || []).forEach(p => {
    const n = parseInt(p.fv_label || p.fv_raw, 10);
    if (isNaN(n)) return;
    const tier = FV_HIST_TIERS.find(t => n >= t) ?? 40;
    counts[tier]++;
  });
  const maxCount = Math.max(1, ...FV_HIST_TIERS.map(t => counts[t]));
  const bars = FV_HIST_TIERS.map(t => {
    const h = Math.round((counts[t] / maxCount) * 100);
    const fill = FV_TIER_COLORS[t] || "var(--text-tertiary)";
    return `<div class="fvh-bar" style="height:${h}%;background:${fill};opacity:${counts[t] ? 0.9 : 0.2};" title="${counts[t]} × FV ${t}${t === 60 ? '+' : ''}">${opts.showCounts === false ? '' : `<span class="fvh-count">${counts[t] || ''}</span>`}</div>`;
  }).join('');
  const labels = FV_HIST_TIERS.map(t => `<span>${t}${t === 60 ? '+' : ''}</span>`).join('');
  return `<div class="fv-histogram">${bars}</div><div class="fv-histogram-labels">${labels}</div>`;
}

// ETA-timeline mini-chart. Bars stacked by expected MLB debut year so
// the user can see how the pipeline is loaded over the next few seasons.
function makeEtaTimeline(rosterPlayers) {
  const thisYear = new Date().getFullYear();
  const years = [thisYear, thisYear + 1, thisYear + 2, thisYear + 3, thisYear + 4];
  const counts = Object.fromEntries(years.map(y => [y, 0]));
  let beyond = 0;
  (rosterPlayers || []).forEach(p => {
    const y = (p.eta && p.eta.year) ? parseInt(p.eta.year, 10) : null;
    if (!y) return;
    if (y <= thisYear) counts[thisYear]++;
    else if (counts[y] != null) counts[y]++;
    else beyond++;
  });
  const cells = years.map(y => counts[y]);
  cells.push(beyond);
  const maxCount = Math.max(1, ...cells);
  const labels = [...years.map(y => String(y).slice(-2)), `${thisYear + 5}+`];
  const bars = cells.map((c, i) => {
    const h = Math.round((c / maxCount) * 100);
    const cls = c ? '' : ' empty';
    return `<div class="eta-bar${cls}" style="height:${c ? Math.max(8, h) : 6}%;" title="${labels[i]}: ${c} prospect${c === 1 ? '' : 's'}"></div>`;
  }).join('');
  const labelHtml = labels.map(l => `<span>${l}</span>`).join('');
  return `<div class="eta-timeline">${bars}</div><div class="eta-timeline-labels">${labelHtml}</div>`;
}

// Acquisition-mix horizontal stacked bar with a 2-column legend below.
// Same buckets/colors as the farm-detail acquisition filter chips so the
// chart reads as a key for that filter.
const ACQ_MIX_COLORS = {
  draft:             "#5090E0",
  international_fa:  "#E8A020",
  trade:             "#C8A050",
  waiver:            "#7EC880",
  rule_5:            "#C56AC0",
  free_agent:        "#3DBF7A",
  contract_purchase: "#A87CC8",
  unknown:           "var(--text-tertiary)",
};
const ACQ_MIX_LABELS = {
  draft: "Draft",
  international_fa: "Intl FA",
  trade: "Trade",
  waiver: "Waiver",
  rule_5: "Rule 5",
  free_agent: "Free agent",
  contract_purchase: "Purchase",
  unknown: "Unknown",
};
function makeAcqMixBar(rosterPlayers) {
  const counts = {};
  (rosterPlayers || []).forEach(p => {
    const m = (p.current_acquisition || {}).method || "unknown";
    counts[m] = (counts[m] || 0) + 1;
  });
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  if (!total) return `<div style="color:var(--text-tertiary);font-size:11px;">No acquisition data.</div>`;
  const order = ["draft", "international_fa", "trade", "waiver", "rule_5", "free_agent", "contract_purchase", "unknown"];
  const present = order.filter(k => counts[k]);
  const segs = present.map(k => {
    const pct = (counts[k] / total) * 100;
    return `<div style="width:${pct.toFixed(2)}%;background:${ACQ_MIX_COLORS[k]};" title="${ACQ_MIX_LABELS[k]}: ${counts[k]} (${pct.toFixed(0)}%)"></div>`;
  }).join('');
  const legend = present.map(k => `
    <div class="acq-row">
      <span style="display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;">
        <span class="acq-sw" style="background:${ACQ_MIX_COLORS[k]};"></span>
        <span class="acq-label">${ACQ_MIX_LABELS[k]}</span>
      </span>
      <span class="acq-count">${counts[k]}</span>
    </div>`).join('');
  return `<div class="acq-mix-bar">${segs}</div>
    <div class="acq-mix-legend">${legend}</div>`;
}

// Render the per-level "graded prospects" pills used on the farm list.
// Hides MLB (graded MLB players are usually graduates; the row would
// always read zero) and skips DSL when the org has none, since most
// systems do not field a DSL squad and an always-zero pill is noise.
// activeLevel highlights the pill matching the current sort.
// Cap visible level pills at 4 so 5-6 levels with prospects don't wrap
// the farm row and break grid alignment. Active level is always shown
// (even if it falls below the cutoff) so the user can see which level
// they sorted by. Hidden levels collapse into a single "+N" pill with
// a title attribute listing them.
const FARM_DEPTH_LEVELS = ["AAA","AA","A+","A","CPX","DSL"];
const FARM_DEPTH_VISIBLE_CAP = 4;
// Vertical promotion ladder — one row per affiliate level from MLB down
// to DSL; bar width = tracked-prospect count, color tint scaled by the
// aggregate FV at that level so heavy-FV levels glow gold and depth
// levels stay muted slate. Reads from the roster's own player objects
// (so FV-tint computation matches the rest of the page) instead of the
// pre-aggregated level_counts dict.
const FARM_LADDER_LEVELS = ["MLB", "AAA", "AA", "A+", "A", "CPX", "DSL"];
function makePromotionLadder(rosterPlayersAll, org) {
  if (!rosterPlayersAll || !rosterPlayersAll.length) {
    return `<div style="color:var(--text-tertiary);font-size:11px;">No tracked prospects to ladder.</div>`;
  }
  // Bucket players by their current level. A player without a current
  // statline (no recent MiLB game) is excluded so the ladder reflects
  // active rostering, not roster ghosts.
  const byLevel = Object.fromEntries(FARM_LADDER_LEVELS.map(l => [l, []]));
  for (const p of rosterPlayersAll) {
    const lvl = ((p.statline || {}).level) || null;
    if (lvl && byLevel[lvl]) byLevel[lvl].push(p);
  }
  const maxCount = Math.max(1, ...FARM_LADDER_LEVELS.map(l => byLevel[l].length));
  // Color helper — pick a fv-tier token based on the level's heaviest
  // prospect FV so the row reads as gold (60+ talent), silver (50-tier),
  // or slate (depth filler).
  const rowColor = (players) => {
    if (!players.length) return "var(--bg-tertiary)";
    const topFv = Math.max(...players.map(p => p.fv_close || 0));
    if (topFv >= 60) return "var(--fv-60-bg)";
    if (topFv >= 55) return "var(--fv-55-bg)";
    if (topFv >= 50) return "var(--fv-50-bg)";
    if (topFv >= 45) return "var(--fv-45-bg)";
    if (topFv >= 40) return "var(--fv-40-bg)";
    return "var(--bg-tertiary)";
  };
  const rows = FARM_LADDER_LEVELS.map(lvl => {
    const players = byLevel[lvl] || [];
    const n = players.length;
    const pct = (n / maxCount) * 100;
    const color = rowColor(players);
    const titleNames = players
      .sort((a, b) => (b.fv_close || 0) - (a.fv_close || 0))
      .slice(0, 6)
      .map(p => `${p.player_name} (${p.fv_close ?? "?"})`)
      .join(" · ");
    return `<div style="display:grid;grid-template-columns:36px 1fr 28px;align-items:center;gap:8px;margin-top:4px;" title="${escapeHtml(`${lvl}: ${n} tracked prospect${n === 1 ? "" : "s"}${titleNames ? " — " + titleNames : ""}`)}">
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);font-weight:600;letter-spacing:0.04em;">${lvl}</span>
      <span style="height:10px;border-radius:2px;background:var(--bg-tertiary);overflow:hidden;display:block;">
        <span style="display:block;height:100%;width:${pct.toFixed(1)}%;background:${color};border:1px solid var(--border-light);"></span>
      </span>
      <span style="font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums;color:var(--text-primary);text-align:right;">${n}</span>
    </div>`;
  }).join("");
  return `<div style="margin-top:6px;">${rows}</div>`;
}

function makeLevelDepth(levelCounts, activeLevel) {
  if (!levelCounts) return `<span style="color:var(--text-tertiary);font-size:10px;">—</span>`;
  // Sort by count desc; zero-count levels sink to the bottom.
  const ranked = FARM_DEPTH_LEVELS
    .filter(lvl => lvl !== "DSL" || (levelCounts[lvl] || 0) > 0)
    .map(lvl => ({ lvl, n: levelCounts[lvl] || 0 }))
    .sort((a, b) => b.n - a.n);
  // Build the visible set: top-K by count, plus always-include the
  // active-level pill if the user sorted by a specific level.
  const visible = [];
  for (const r of ranked) {
    if (visible.length < FARM_DEPTH_VISIBLE_CAP) visible.push(r);
  }
  if (activeLevel && !visible.find(r => r.lvl === activeLevel)) {
    const act = ranked.find(r => r.lvl === activeLevel);
    if (act) {
      if (visible.length >= FARM_DEPTH_VISIBLE_CAP) visible.pop();
      visible.push(act);
    }
  }
  const visibleSet = new Set(visible.map(r => r.lvl));
  const hidden = ranked.filter(r => !visibleSet.has(r.lvl));
  const pills = visible.map(({ lvl, n }) => {
    const cls = `level-pill${n === 0 ? " lp-zero" : ""}${lvl === activeLevel ? " lp-active" : ""}`;
    return `<span class="${cls}" title="${lvl}: ${n} graded prospect${n === 1 ? "" : "s"}">
      <span class="lp-label">${escapeHtml(lvl)}</span><span class="lp-count">${n}</span>
    </span>`;
  }).join("");
  if (!hidden.length) return pills;
  const overflowTitle = hidden.map(r => `${r.lvl}: ${r.n}`).join(" · ");
  const overflowCount = hidden.reduce((sum, r) => sum + r.n, 0);
  return pills + `<span class="level-pill lp-zero" title="${escapeHtml(overflowTitle)}" style="opacity:0.85;">
    <span class="lp-label">+${hidden.length}</span><span class="lp-count">${overflowCount}</span>
  </span>`;
}

function farmSortedOrgs() {
  let orgs = (DATA.org_summary || []).slice();
  // Search filter: match against the 3-letter code OR full team name so
  // "nym", "mets", and "new york" all surface the Mets.
  if (state.search) {
    const q = state.search.toLowerCase();
    orgs = orgs.filter(o =>
      (o.org || "").toLowerCase().includes(q) ||
      fullOrgName(o.org).toLowerCase().includes(q)
    );
  }
  const s = state.farmSort;
  // "level_<LVL>" sorts by graded-prospect count at that affiliate level.
  // Defensive ?? 0 keeps orgs without a level-counts block (older exports)
  // at the bottom rather than NaN-poisoning the comparator.
  if (s && s.startsWith("level_")) {
    const lvl = s.slice("level_".length);
    orgs.sort((a, b) =>
      ((b.level_counts || {})[lvl] ?? 0) -
      ((a.level_counts || {})[lvl] ?? 0)
      || b.total_fv - a.total_fv);
    return orgs;
  }
  // IFA-spend sort: 3yr cumulative dollars from Spotrac data on org.ifa_spending.
  // Spotrac coverage starts in 2021; this slice keeps the comparison apples-to-apples
  // with the spending breakdown rendered on the farm-detail page.
  const ifaSpend3yr = (o) => {
    const spend = o.ifa_spending || {};
    const cutoff = new Date().getUTCFullYear() - 3;
    return Object.entries(spend)
      .filter(([y]) => +y >= cutoff)
      .reduce((sum, [, v]) => sum + ((v && v.total_usd) || 0), 0);
  };
  // Aggregate surplus value per org for the "surplus" sort — same
  // computation as renderFarmSystems but built lazily and only when needed.
  let _surplusMemo = null;
  const surplusForOrg = (orgCode) => {
    if (!_surplusMemo) {
      _surplusMemo = {};
      const PITCHER_RE = /^(RHP|LHP|SP|RP|MIRP|SIRP|P)/;
      for (const pl of (DATA.players || [])) {
        if (!pl.org || pl.fv_close == null) continue;
        const isP = PITCHER_RE.test(String(pl.position || "").split("/")[0].toUpperCase());
        const sv  = estimateSurplusValueMM(pl.fv_close, isP);
        if (sv == null) continue;
        _surplusMemo[pl.org] = (_surplusMemo[pl.org] || 0) + sv;
      }
    }
    return _surplusMemo[orgCode] || 0;
  };
  orgs.sort((a, b) => {
    if (s === "ifa_spend")     return ifaSpend3yr(b) - ifaSpend3yr(a);
    if (s === "surplus")       return surplusForOrg(b.org) - surplusForOrg(a.org)
                                   || (a.farm_rank - b.farm_rank);
    if (s === "total_fv")      return b.total_fv  - a.total_fv;
    if (s === "top_end")       return (b.top_end_points ?? 0) - (a.top_end_points ?? 0);
    if (s === "depth")         return (b.depth_points   ?? 0) - (a.depth_points   ?? 0);
    // Explicit per-window trajectory sorts (the chip click handler
    // also flips state.formWindow so the line chart matches the sort
    // Trajectory sort reads the DvM+ for the currently active
    // development window. The legacy trajectory_1y / _3y / _5y URL
    // params still resolve here so old shared links keep working —
    // they just pin the window before sorting.
    if (s === "trajectory" || s === "trajectory_1y" || s === "trajectory_3y" || s === "trajectory_5y") {
      let w;
      if (s === "trajectory_1y") w = "1y";
      else if (s === "trajectory_3y") w = "3y";
      else if (s === "trajectory_5y") w = "5y";
      else w = state.formWindow || "3y";
      const ad = (a.dvm_plus || {})[w] ?? (a.delta_above_mean || {})[w] ?? a.trajectory_score ?? 0;
      const bd = (b.dvm_plus || {})[w] ?? (b.delta_above_mean || {})[w] ?? b.trajectory_score ?? 0;
      return bd - ad;
    }
    if (s === "grad_pipeline") return (b.grad_pipeline_score ?? 0) - (a.grad_pipeline_score ?? 0)
                                   || b.top_end_points - a.top_end_points;
    if (s === "count")         return b.count     - a.count;
    if (s === "tier_60")       return b.tier_60_plus - a.tier_60_plus;
    if (s === "avg_age")       return (a.avg_age ?? 99) - (b.avg_age ?? 99);
    if (s === "stock_up")      return b.stock_up  - a.stock_up;
    return a.farm_rank - b.farm_rank; // default (farm_score-derived server-side)
  });
  return orgs;
}

// Compact component-grade strip for the Farm list row. Each chip is
// one of: top-end talent · prospect depth · trajectory vs peers ·
// graduation pipeline. Hover gives the rank within the 30 orgs.
// Tiny IFA-vs-Draft donut for the Farm-list row. Aggregates dollar
// totals over the last 3 years and renders two arc segments. Hovering
// the donut surfaces precise dollar amounts + percentages via a
// native title tooltip.
function makeSpendingDonut(org, size = 48) {
  const ifa = org && org.ifa_spending ? org.ifa_spending : {};
  const draft = org && org.draft_spending ? org.draft_spending : {};
  // Last 3 years cutoff — anchored at the current year so 2024–2026
  // counts as a "3yr" window for fresh data.
  const cutoff = new Date().getUTCFullYear() - 3;
  let ifaTotal = 0, draftTotal = 0;
  for (const [y, v] of Object.entries(ifa)) {
    if (+y >= cutoff) ifaTotal += (v && v.total_usd) || 0;
  }
  for (const [y, v] of Object.entries(draft)) {
    if (+y >= cutoff) draftTotal += (v && v.total_usd) || 0;
  }
  const total = ifaTotal + draftTotal;
  if (total <= 0) {
    return `<div style="text-align:center;color:var(--text-tertiary);font-size:10px;" title="No IFA or draft bonus data on file (last 3 years).">—</div>`;
  }
  const ifaPct = ifaTotal / total * 100;
  const draftPct = draftTotal / total * 100;
  const fmt = n => `$${(n / 1_000_000).toFixed(1)}M`;
  // SVG donut — two stroked arcs on a single circle. IFA starts at 12
  // o'clock and goes clockwise; Draft fills the remainder. Calculated
  // via stroke-dasharray (arc_length total_remaining).
  const cx = size / 2;
  const r = (size - 8) / 2;
  const circumference = 2 * Math.PI * r;
  const ifaArc = circumference * (ifaTotal / total);
  const draftArc = circumference - ifaArc;
  const tooltip = `IFA: ${fmt(ifaTotal)} (${ifaPct.toFixed(0)}%) · Draft: ${fmt(draftTotal)} (${draftPct.toFixed(0)}%) · 3-year totals`;
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;" title="${escapeHtml(tooltip)}">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block;">
      <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--bg-tertiary)" stroke-width="6"/>
      <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--neon-amber)" stroke-width="6"
              stroke-dasharray="${ifaArc.toFixed(2)} ${(circumference - ifaArc).toFixed(2)}"
              stroke-dashoffset="0" transform="rotate(-90 ${cx} ${cx})" stroke-linecap="butt"/>
      <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--spend-draft)" stroke-width="6"
              stroke-dasharray="${draftArc.toFixed(2)} ${(circumference - draftArc).toFixed(2)}"
              stroke-dashoffset="${(-ifaArc).toFixed(2)}" transform="rotate(-90 ${cx} ${cx})" stroke-linecap="butt"/>
    </svg>
    <div style="font-size:9px;font-family:var(--font-mono);color:var(--text-tertiary);font-variant-numeric:tabular-nums;">${fmt(total)}</div>
  </div>`;
}

// Tiny stacked FV-tier bar for the farm-list Grade cell. Segments
// proportional to tier_60_plus / tier_55 / tier_50 / sub-50 counts.
// Hover each segment for `N × FV bucket` context.
function makeOrgTierBar(org) {
  const sixty  = org.tier_60_plus || 0;
  const fifty5 = org.tier_55 || 0;
  const fifty  = org.tier_50 || 0;
  const sub    = Math.max(0, (org.count || 0) - sixty - fifty5 - fifty);
  const total  = sixty + fifty5 + fifty + sub;
  if (!total) return "";
  const W = 64, H = 4;
  let x = 0;
  const seg = (cnt, fillVar, label) => {
    if (!cnt) return "";
    const w = (cnt / total) * W;
    const rect = `<rect x="${x.toFixed(1)}" y="0" width="${w.toFixed(1)}" height="${H}" style="fill:var(${fillVar});"><title>${cnt} × FV ${label}</title></rect>`;
    x += w;
    return rect;
  };
  return `<svg width="${W}" height="${H}" style="border-radius:1px;margin-top:4px;" aria-hidden="true">
    ${seg(sixty,  "--fv-60-fg", "60+")}
    ${seg(fifty5, "--fv-55-fg", "55")}
    ${seg(fifty,  "--fv-50-fg", "50")}
    ${seg(sub,    "--fv-40-fg", "<50")}
  </svg>`;
}

// ETA wave bar histogram — counts at Y / Y+1 / Y+2 / Y+3+ relative to
// the current calendar year. Driven by the pre-rendered etaByOrg map
// computed once at the top of renderFarmSystems.
function makeOrgEtaWave(counts, currentYear) {
  if (!counts || !counts.some(v => v > 0)) return "";
  const max = Math.max(...counts);
  const yrs = [`'${String(currentYear).slice(-2)}`,
               `'${String(currentYear + 1).slice(-2)}`,
               `'${String(currentYear + 2).slice(-2)}`,
               `'${String(currentYear + 3).slice(-2)}+`];
  const bars = counts.map((c, i) => `
    <div class="farm-eta-wave-col">
      <span class="farm-eta-wave-bar" style="height:${(2 + 12 * (c / max)).toFixed(1)}px;opacity:${(c > 0 ? 0.45 + 0.55 * (c / max) : 0.2).toFixed(2)};"
            title="${c} prospect${c === 1 ? "" : "s"} ETA ${currentYear + i}${i === 3 ? "+" : ""}"></span>
      <span class="farm-eta-wave-label">${yrs[i]}</span>
    </div>`).join("");
  return `<div class="farm-eta-wave">${bars}</div>`;
}

// Last-visit farm rank persistence — snapshot map of farm_rank keyed by
// org code. Stored in localStorage; 30-day stale gate so a long
// absence doesn't surface meaningless deltas.
const FARM_RANK_HISTORY_KEY = "farmRanks_lastVisit";
function loadLastVisitFarmRanks() {
  try {
    const raw = JSON.parse(localStorage.getItem(FARM_RANK_HISTORY_KEY) || "{}");
    if (!raw.ts || Date.now() - raw.ts > 30 * 86400 * 1000) return {};
    return raw.ranks || {};
  } catch { return {}; }
}
function snapshotCurrentFarmRanks(orgs) {
  const map = {};
  for (const o of orgs) if (o.farm_rank != null) map[o.org] = o.farm_rank;
  try {
    localStorage.setItem(FARM_RANK_HISTORY_KEY, JSON.stringify({ ranks: map, ts: Date.now() }));
  } catch { /* localStorage may be full / private — silent */ }
}

function makeComponentGrades(org) {
  const grades = (org && org.grades) || {};
  const ranks  = (org && org.component_ranks) || {};
  const items = [
    ["T", grades.top_end,    ranks.top_end,    "Top-end talent grade (FV-weighted top 5)"],
    ["D", grades.depth,      ranks.depth,      "Prospect depth grade (FV-weighted #6–25)"],
    ["J", grades.trajectory, ranks.trajectory, "Trajectory grade (FV-growth vs peers)"],
    ["G", grades.grad,       ranks.grad,       "Graduation pipeline grade (FV-weighted recent grads)"],
  ];
  const anyGrade = items.some(([, g]) => g != null);
  if (!anyGrade) return "";
  return `<div class="fg-components">${items.map(([k, g, r, title]) => `
    <span class="fg-comp" title="${escapeHtml(title)}${r != null ? ` · rank ${r}/30` : ""}">
      <span class="fg-comp-label">${k}</span>${escapeHtml(g || "—")}
    </span>`).join("")}</div>`;
}

function renderFarmSystems() {
  const orgs = farmSortedOrgs();
  // Apply card-mode class based on state.farmViewMode. The class flips
  // #farm-section into a CSS grid of cards via the .farm-rows-cards
  // stylesheet rules; .table-mode is the default no-op.
  const farmSection = document.getElementById("farm-section");
  if (farmSection) {
    farmSection.classList.toggle("farm-rows-cards", state.farmViewMode === "cards");
  }
  document.querySelectorAll("[data-farm-view]").forEach(b =>
    b.classList.toggle("active", b.dataset.farmView === (state.farmViewMode || "table")));
  if (!orgs.length) {
    const msg = state.search
      ? `No farm systems match “${escapeHtml(state.search)}”.`
      : `No farm system data available.`;
    document.getElementById("farm-rows").innerHTML =
      `<div class="state-message">${msg}</div>`;
    return;
  }

  // Active-level highlight: when the user sorts by "level_<LVL>", that
  // pill renders with a cyan border so the eye lands on it immediately.
  const activeLevel = (state.farmSort || "").startsWith("level_")
    ? state.farmSort.slice("level_".length)
    : null;

  // ── Pre-render passes ──────────────────────────────────────────────
  // Walk the active prospects + graduates once to build per-org
  // aggregates that feed several new row cells. Doing this once at
  // the top of the render avoids repeating O(players) work per row.
  const currentYear = new Date().getUTCFullYear();
  const cutoffMs30 = Date.now() - 30 * 86400 * 1000;
  const cutoffMs12mo = Date.now() - 365 * 86400 * 1000;
  const etaByOrg = {};
  const pulseByOrg = {};
  const confByOrg = {};
  for (const pl of (DATA.players || [])) {
    if (!pl.org) continue;
    // ETA bucket
    if (pl.eta && pl.eta.year != null) {
      const bucket = Math.min(3, Math.max(0, pl.eta.year - currentYear));
      (etaByOrg[pl.org] ||= [0, 0, 0, 0])[bucket]++;
    }
    // 30-day pulse: stock-direction signals + acquisitions
    const s = pl.stock;
    if (s && s.delta != null && s.from_date) {
      const ageMs = Date.now() - new Date(s.from_date + "T00:00:00").getTime();
      if (ageMs >= 0 && ageMs <= 30 * 86400 * 1000) {
        const b = (pulseByOrg[pl.org] ||= { up: 0, down: 0, acq: 0 });
        if (s.delta > 0) b.up++;
        else if (s.delta < 0) b.down++;
      }
    }
    // Source confidence: multi-instance share of the roster.
    const c = (confByOrg[pl.org] ||= { multi: 0, total: 0 });
    c.total++;
    if ((pl.fv_total_instances ?? 0) >= 2) c.multi++;
  }
  for (const o of orgs) {
    for (const ev of (o.fv_events || [])) {
      const t = new Date(ev.date + "T00:00:00").getTime();
      if (isNaN(t) || t < cutoffMs30) continue;
      if (/^(trade_in|draft|ifa|waiver_in|rule_5_in|signed_free_agent|signing|drafted)$/.test(ev.kind)) {
        (pulseByOrg[o.org] ||= { up: 0, down: 0, acq: 0 }).acq++;
      }
    }
  }
  const alumniByOrg = {};
  for (const g of (DATA.graduates || [])) {
    if (!g.org || !g.graduation_date) continue;
    const t = new Date(g.graduation_date + "T00:00:00").getTime();
    if (isNaN(t) || t < cutoffMs12mo) continue;
    const fv = g.fv_close ?? g.fv_close_raw;
    if (fv == null || fv < 55) continue;
    (alumniByOrg[g.org] ||= []).push({
      name: g.player_name,
      fv: Math.round(fv),
      date: g.graduation_date,
    });
  }
  // Aggregate surplus value per org — sum each active prospect's FV-implied
  // TVI table value, split hitter / pitcher. Same call powering the per-org
  // Surplus tile on renderFarmDetail.
  const PITCHER_RE = /^(RHP|LHP|SP|RP|MIRP|SIRP|P)/;
  const surplusByOrg = {};
  const countByOrg = {};
  for (const pl of (DATA.players || [])) {
    if (!pl.org || pl.fv_close == null) continue;
    const isP = PITCHER_RE.test(String(pl.position || "").split("/")[0].toUpperCase());
    const s = estimateSurplusValueMM(pl.fv_close, isP);
    if (s == null) continue;
    surplusByOrg[pl.org] = (surplusByOrg[pl.org] || 0) + s;
    countByOrg[pl.org]   = (countByOrg[pl.org]   || 0) + 1;
  }
  // Last-visit rank deltas — load BEFORE rendering, snapshot AFTER so
  // the same render cycle doesn't compare against itself.
  const lastVisitRanks = loadLastVisitFarmRanks();

  const win = state.formWindow || "3y";
  const means = (DATA.farm_trajectory_means || {});
  const meanBaseline = means[win] ?? 0;
  const winLabel = win === "1y" ? "1-year" : win === "3y" ? "3-year" : "5-year";

  const header = `<div class="farm-header">
    <span style="text-align:center;">#</span>
    <span></span>
    <span>Org</span>
    <span style="text-align:center;" title="Overall farm-system letter grade. A+ = #1 org; tiers descend by farm_score (45% top-end · 25% depth · 15% trajectory · 15% grad pipeline).">Grade</span>
    <span style="text-align:center;" title="${winLabel} ${win.toUpperCase()}DvM+ — wRC+/OPS+-style index where 100 = league mean and 10 pts = 1 std-dev. Acquisitions contribute zero on arrival; graduations don't subtract — pure-development metric.">${win.toUpperCase()}DvM+</span>
    <span style="text-align:center;">${escapeHtml(winLabel)} trajectory</span>
    <span>Top prospects</span>
    <span>Positions</span>
    <span>Level depth${activeLevel ? ` · <span style="color:var(--neon-cyan);">${escapeHtml(activeLevel)}</span>` : ""}</span>
    <span style="text-align:center;">Avg age</span>
    <span style="text-align:center;" title="IFA vs Draft bonus-dollar mix over the last 3 years. Hover a donut for exact dollar totals.">Spend mix
      <span style="display:flex;gap:8px;justify-content:center;margin-top:3px;font-weight:400;font-size:9px;color:var(--text-tertiary);letter-spacing:0.04em;">
        <span style="display:inline-flex;align-items:center;gap:3px;"><span aria-hidden="true" style="display:inline-block;width:7px;height:7px;background:var(--neon-amber);"></span>IFA</span>
        <span style="display:inline-flex;align-items:center;gap:3px;"><span aria-hidden="true" style="display:inline-block;width:7px;height:7px;background:var(--spend-draft);"></span>Draft</span>
      </span>
    </span>
    <span style="text-align:right;">Stock</span>
    <span></span>
  </div>`;

  const buildRow = (org, displayRank) => {
    const tp = org.top_prospect;
    const overall = (org.grades && org.grades.overall) || '—';
    const gradeColorVal = gradeColor(overall);
    const deltaAbove = (org.delta_above_mean || {})[win]
                      ?? (org.trajectories || {})[win]
                      ?? org.trajectory_score
                      ?? 0;
    // Net stock chip — replace raw ▲5 ▼2 counts with a single colored
    // pill showing net movement. The tooltip carries the breakdown.
    const stockUp = org.stock_up || 0;
    const stockDown = org.stock_down || 0;
    const stockFlat = org.stock_flat || 0;
    const stockNet = stockUp - stockDown;
    const stockCls = stockNet > 0 ? "stock-chip-up" : stockNet < 0 ? "stock-chip-down" : "stock-chip-flat";
    const stockSign = stockNet > 0 ? "+" : "";
    const stockHtml = (stockUp || stockDown)
      ? `<span class="farm-stock-net ${stockCls}" title="Rising ${stockUp} · Falling ${stockDown} · Flat ${stockFlat}">${stockSign}${stockNet} net</span>`
      : `<span class="stock-flat">—</span>`;
    // Last-visit rank delta (G21).
    const prev = lastVisitRanks[org.org];
    const rankDelta = (prev != null && org.farm_rank != null) ? (prev - org.farm_rank) : null;
    const deltaChip = (rankDelta == null || rankDelta === 0)
      ? ""
      : `<div class="farm-rank-delta ${rankDelta > 0 ? 'stock-up' : 'stock-down'}" title="Was #${prev} on your last visit">${rankDelta > 0 ? '+' : ''}${rankDelta}${rankDelta > 0 ? '↑' : '↓'}</div>`;
    // Top-3 prospects strip (G16).
    const top3 = (org.prospects || []).slice(0, 3);
    const topHtml = top3.length
      ? `<div class="farm-top3-stack">${top3.map(t => `<div class="farm-top3-chip">
           <span class="farm-top3-name">${escapeHtml(t.name)}</span>
           <span class="fv-badge ${fvClass(t.fv_label)} size-xs" style="flex-shrink:0;">${t.fv_label}</span>
         </div>`).join("")}</div>`
      : '<span style="color:var(--text-tertiary);">—</span>';
    // Recent-grad alumni badge (G22).
    const alumni = alumniByOrg[org.org] || [];
    const alumniBadge = alumni.length
      ? ` <span class="farm-alumni-badge" title="${escapeHtml(alumni.map(a => `${a.name} · FV ${a.fv} · graduated ${a.date}`).join(" · "))}">✦ ${alumni.length}</span>`
      : "";
    // Confidence dot (G26) — green/amber/red based on multi-instance share.
    const conf = confByOrg[org.org];
    const confPct = conf && conf.total ? (conf.multi / conf.total) : null;
    const confDot = confPct == null
      ? ""
      : `<span class="farm-conf-dot" style="--dot-color:${confPct >= 0.7 ? 'var(--up)' : confPct >= 0.4 ? 'var(--neon-amber)' : 'var(--down)'};" title="${Math.round(confPct * 100)}% of tracked prospects have ≥2 grade instances; ${conf.total - conf.multi} are single-instance (Bayesian-shrunk)"></span>`;
    // 30-day pulse (G19).
    const pulse = pulseByOrg[org.org] || {};
    const pulseHasAny = pulse.up || pulse.down || pulse.acq;
    const pulseHtml = `<div class="farm-pulse" title="Trailing 30 days — FV upgrades / downgrades / new acquisitions">
        ${pulse.up   ? `<span class="stock-up">▲${pulse.up}</span>` : ""}
        ${pulse.down ? `<span class="stock-down">▼${pulse.down}</span>` : ""}
        ${pulse.acq  ? `<span class="pulse-acq">+${pulse.acq}</span>` : ""}
        ${!pulseHasAny ? `<span class="stock-flat">— quiet</span>` : ""}
      </div>`;
    return `
      <div class="farm-row" data-org="${escapeHtml(org.org)}" style="${orgStripe(org.org)}">
        <div class="farm-rank">${displayRank}${deltaChip}</div>
        <div>${teamLogoHTML(org.org, "md", fullOrgName(org.org))}</div>
        <div class="farm-org-cell">
          <div class="farm-org-name">
            <div class="farm-org">${escapeHtml(fullOrgName(org.org))}</div>
            <div style="font-size:10px;color:var(--text-tertiary);letter-spacing:0.08em;margin-top:2px;">${escapeHtml(org.org)}${alumniBadge}</div>
          </div>
        </div>
        <div class="farm-grade-cell" title="Overall grade · farm_score ${org.farm_score != null ? org.farm_score.toFixed(1) : '—'}/100">
          <span class="fg-letter" style="color:${gradeColorVal};">${escapeHtml(overall)}</span>
          <span class="fg-score">${org.farm_score != null ? org.farm_score.toFixed(0) : '—'}${confDot}</span>
          ${makeComponentGrades(org)}
          ${makeOrgTierBar(org)}
        </div>
        <div class="farm-dvm-hero">${(() => {
          const v = (org.dvm_plus || {})[win];
          if (v == null) return `<span class="fdh-value" style="color:var(--text-tertiary);">—</span><span class="fdh-label">${win.toUpperCase()}DvM+</span>`;
          const color = v >= 110 ? 'var(--up)' : v <= 90 ? 'var(--down)' : 'var(--neon-violet)';
          return `<span class="fdh-value" style="color:${color};" title="${win.toUpperCase()}DvM+ ${v} · 100 = league mean · 10 pts = 1 std-dev · graduations + acquisitions nullified">${v}</span><span class="fdh-label">${win.toUpperCase()}DvM+</span>`;
        })()}</div>
        <div>${makeFarmSparkline(org.fv_history, deltaAbove, meanBaseline, win)}${pulseHtml}</div>
        <div>${topHtml}</div>
        <div>${makePosBreakdown(org.pos_groups)}${makeOrgEtaWave(etaByOrg[org.org], currentYear)}</div>
        <div class="level-depth-cell">${makeLevelDepth(org.level_counts, activeLevel)}</div>
        <div style="text-align:center;font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums;">${org.avg_age != null ? org.avg_age.toFixed(1) : "—"}</div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
          ${makeSpendingDonut(org)}
          ${(() => {
            const s = surplusByOrg[org.org];
            const n = countByOrg[org.org];
            if (s == null || !n) return "";
            const fmt = s >= 100 ? s.toFixed(0) : s.toFixed(1);
            return `<span class="g-term" data-term="surplus_value" style="font-family:var(--font-mono);font-size:10px;color:var(--neon-cyan);font-variant-numeric:tabular-nums;letter-spacing:0.02em;" title="Total surplus value across ${n} active prospects · sum of FV-implied TVI">$${fmt}M · ${n}p</span>`;
          })()}
        </div>
        <div class="stock-cell" style="font-size:12px;">${stockHtml}</div>
        <div style="text-align:right;display:flex;gap:4px;justify-content:flex-end;align-items:center;">
          <button class="watch-btn${farmWatchlistHas(org.org) ? " is-in" : ""}" data-farm-watch-key="${escapeHtml(org.org)}" type="button" title="${farmWatchlistHas(org.org) ? "Remove farm from watchlist" : "Add farm to watchlist"}">${farmWatchlistHas(org.org) ? "★" : "☆"}</button>
          <button class="compare-add-btn is-compact${farmCompareHas(org.org) ? " is-in" : ""}" data-farm-compare-key="${escapeHtml(org.org)}" type="button" title="${farmCompareHas(org.org) ? "Remove farm from compare" : "Add farm to compare"}" aria-label="Toggle farm compare">${farmCompareHas(org.org) ? "✓" : "+"}</button>
        </div>
      </div>`;
  };

  // Partition into pinned (watchlisted) + the rest. Pinned farms float
  // to the top above a dashed divider so the user keeps an eye on the
  // orgs they care about regardless of sort.
  const pinned = orgs.filter(o => farmWatchlistHas(o.org));
  const rest   = orgs.filter(o => !farmWatchlistHas(o.org));
  const pinnedRows = pinned.map((o, i) => buildRow(o, i + 1)).join("");
  const restRows   = rest.map((o, i) => buildRow(o, i + 1)).join("");
  const dividerRow = (pinned.length && rest.length)
    ? `<div class="farm-divider">All farms</div>`
    : "";
  document.getElementById("farm-rows").innerHTML = header + pinnedRows + dividerRow + restRows;

  // Snapshot the current ranks AFTER the DOM lands — defer via rAF so a
  // subsequent re-render still has the previous-visit values to compare
  // against (deferring lets THIS render finish first).
  requestAnimationFrame(() => snapshotCurrentFarmRanks(orgs));
}

// Find a player (active, graduate, or inactive) by key.
function findPlayer(key) {
  return (DATA.players || []).find(p => p.player_key === key)
      || (DATA.graduates || []).find(g => g.player_key === key)
      || (DATA.inactive || []).find(p => p.player_key === key)
      || null;
}

function findOrg(org) {
  return (DATA.org_summary || []).find(o => o.org === org) || null;
}

// Bigger version of the line chart used on prospect detail pages — same
// 20-80 Y-axis as the inline sparkline, but rendered at ~2x size with
// gridlines at every 5-FV tick and date labels along the bottom.
function makeBigLineChart(points, fvOpen, fvClose, gradDate, trades, careerStats, player) {
  if (!points || points.length === 0) return "";
  const W = 720, H = 260, PAD_L = 28, PAD_R = 14, PAD_T = 14, PAD_B = 28;
  const innerW = W - PAD_L - PAD_R;
  const innerH = H - PAD_T - PAD_B;

  const firstDate = points[0].snapshot_date;
  const lastDate  = points[points.length - 1].snapshot_date;
  const endDate   = (gradDate && new Date(gradDate).getTime() > new Date(lastDate).getTime())
                      ? gradDate : lastDate;
  const minT = new Date(firstDate).getTime();
  const maxT = new Date(endDate).getTime();
  const timeSpan = maxT - minT || 1;
  const xScale = d => PAD_L + ((new Date(d).getTime() - minT) / timeSpan) * innerW;
  const yScale = fv => PAD_T + innerH - ((fv - FV_MIN) / (FV_MAX - FV_MIN)) * innerH;

  const isUp = fvClose > fvOpen, isDown = fvClose < fvOpen;
  const stroke = isUp ? "var(--up)" : isDown ? "var(--down)" : "var(--text-tertiary)";

  // Y-axis ticks every 5 FV
  const yTicks = [];
  for (let fv = 20; fv <= 80; fv += 5) {
    const y = yScale(fv).toFixed(1);
    yTicks.push(
      `<line x1="${PAD_L}" y1="${y}" x2="${W - PAD_R}" y2="${y}" stroke="var(--border-light)" stroke-width="0.4" stroke-dasharray="2,3"/>`,
      `<text x="${PAD_L - 4}" y="${y}" dy="3" font-size="9" fill="var(--text-tertiary)" text-anchor="end">${fv}</text>`,
    );
  }
  // 50-FV emphasis — the "MLB regular" tier. Replaces the previous
  // FV-60 highlight because 50 is the meaningful "this projects as a
  // major leaguer" line; 60 was a star-tier marker that didn't help
  // the typical prospect chart.
  yTicks.push(`<line x1="${PAD_L}" y1="${yScale(50).toFixed(1)}" x2="${W - PAD_R}" y2="${yScale(50).toFixed(1)}" stroke="var(--neon-amber)" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.5"/>`);

  // Year boundaries
  const yearSvg = [];
  const startYear = new Date(minT).getFullYear();
  const endYear   = new Date(maxT).getFullYear();
  for (let yr = startYear; yr <= endYear + 1; yr++) {
    const yrT = Date.UTC(yr, 0, 1);
    if (yrT <= minT || yrT >= maxT) continue;
    const x = xScale(new Date(yrT).toISOString().slice(0, 10)).toFixed(1);
    yearSvg.push(
      `<line x1="${x}" y1="${PAD_T}" x2="${x}" y2="${H - PAD_B}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3,3"/>`,
      `<text x="${x}" y="${H - PAD_B + 14}" font-size="10" fill="var(--text-tertiary)" text-anchor="middle">${yr}</text>`,
    );
  }
  // Start + end date labels along the X axis
  const x0 = xScale(firstDate).toFixed(1);
  const x1 = xScale(endDate).toFixed(1);
  yearSvg.push(
    `<text x="${x0}" y="${H - 4}" font-size="9" fill="var(--text-tertiary)" text-anchor="start">${firstDate}</text>`,
    `<text x="${x1}" y="${H - 4}" font-size="9" fill="var(--text-tertiary)" text-anchor="end">${endDate}</text>`,
  );

  // Transaction markers — unified across all event types. Pulls from
  // the shared TRANSACTION_KINDS vocabulary so the glyph + color matches
  // what the mini sparkline shows for the same prospect. Falls through to
  // legacy trade-only rendering when called without a full player object.
  const events = player
    ? transactionEvents(player).filter(e => {
        const t = new Date(e.date).getTime();
        return !isNaN(t) && t >= minT && t <= maxT;
      })
    : [
        ...(trades || []).map(tr => ({
          date: tr.trade_date,
          kind: "trade",
          label: `${tr.trade_date} · ${tr.from_org ?? "?"} → ${tr.to_org ?? "?"}${tr.description ? "\n" + tr.description : ""}`,
        })),
        ...levelChangeEvents(careerStats || []).map(ev => ({
          date: ev.date,
          kind: ev.kind,
          label: `${ev.date.slice(0, 4)}: ${ev.kind === "promotion" ? "Promoted to" : "Demoted to"} ${ev.level} (from ${ev.prev_level})`,
        })),
      ].filter(e => {
        const t = new Date(e.date).getTime();
        return !isNaN(t) && t >= minT && t <= maxT;
      });

  const eventSvg = [];
  for (const ev of events) {
    const cfg = TRANSACTION_KINDS[ev.kind];
    if (!cfg) continue;
    const x = xScale(ev.date).toFixed(1);
    const label = escapeHtml(ev.label);
    const top = cfg.pos === "top";
    const yBase = H - PAD_B;
    const glyphY = top ? PAD_T + 6 : yBase - 2;
    eventSvg.push(
      `<line x1="${x}" y1="${PAD_T}" x2="${x}" y2="${yBase}" stroke="${cfg.color}" stroke-width="1.2" stroke-dasharray="${cfg.dash}" opacity="0.8"><title>${label}</title></line>`,
      `<text x="${x}" y="${glyphY.toFixed(1)}" font-size="11" fill="${cfg.color}" text-anchor="middle"><title>${label}</title>${cfg.glyph}</text>`,
    );
  }

  const pts = points.map(pt => `${xScale(pt.snapshot_date).toFixed(1)},${yScale(pt.consensus_fv_raw).toFixed(1)}`).join(" ");
  // Build a hover tooltip that surfaces the consensus FV plus the
  // per-source breakdown at that snapshot. Sources sorted highest FV
  // first; sources with rank-only (no FV) appended at the end so the
  // reader still sees which lists carried the player.
  const buildPointTitle = (pt) => {
    const head = `${pt.snapshot_date} · ${pt.interval_label} · FV ${pt.consensus_fv_label}`;
    const ps = pt.per_source || {};
    const entries = Object.entries(ps);
    if (!entries.length) return head;
    const withFv = entries.filter(([, v]) => v && v.fv_published != null);
    const rankOnly = entries.filter(([, v]) => v && v.fv_published == null && v.rank != null);
    withFv.sort(([, a], [, b]) => b.fv_published - a.fv_published);
    const parts = withFv.map(([src, v]) => {
      const lbl = SOURCE_LABELS[src] || src;
      const fvShown = Number.isInteger(v.fv_published) ? v.fv_published : v.fv_published.toFixed(1);
      const rk = v.rank != null ? ` (#${v.rank})` : "";
      return `${lbl} ${fvShown}${rk}`;
    });
    const rankParts = rankOnly.map(([src, v]) => `${SOURCE_LABELS[src] || src} #${v.rank}`);
    const sources = [...parts, ...rankParts].join(" · ");
    const spreadTail = (pt.fv_spread != null && withFv.length >= 2)
      ? `\nspread ${Math.round(pt.fv_spread)} across ${withFv.length} sources`
      : "";
    return `${head}\n── ${sources}${spreadTail}`;
  };
  const circles = points.map(pt =>
    `<circle cx="${xScale(pt.snapshot_date).toFixed(1)}" cy="${yScale(pt.consensus_fv_raw).toFixed(1)}" r="3" fill="${stroke}"><title>${escapeHtml(buildPointTitle(pt))}</title></circle>`
  ).join("");

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="FV trajectory">
    ${yTicks.join("")}
    ${yearSvg.join("")}
    ${eventSvg.join("")}
    <polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${circles}
  </svg>`;
}

// Compact inline legend that maps glyph+color → label for every kind in
// TRANSACTION_KINDS. Used under FV charts so a reader can decode any
// marker they see without having to hover for the tooltip.
function transactionLegend(kinds = TRANSACTION_LEGEND_ORDER) {
  return `<div style="font-size:10px;color:var(--text-tertiary);margin-top:4px;display:flex;gap:14px;flex-wrap:wrap;">
    ${kinds.map(k => {
      const c = TRANSACTION_KINDS[k];
      if (!c) return "";
      return `<span><span style="color:${c.color};font-weight:600;">${c.glyph}</span> ${c.label.toLowerCase()}</span>`;
    }).join("")}
  </div>`;
}

// Year-by-year stat table for the prospect page.
//
// Columns are grouped by category — counting / rate / sabermetric — with
// a colored category header row over them so the reader can navigate to
// the metric they want without scanning every column header. Group widths
// are tuned to keep AVG/OBP/SLG together (slash line stays adjacent) and
// to keep the "headline" sabermetric (wRC+ or xFIP) in the rightmost
// column where the eye lands last.
// Tiny inline sparkline. `values` is a numeric array (may contain nulls
// which are skipped). Returns an SVG string sized for an inline cell.
// Used by the career-trends strip above the per-season table.
function _miniSparkline(values, opts = {}) {
  const w = opts.width || 64;
  const h = opts.height || 18;
  const stroke = opts.stroke || "var(--neon-cyan)";
  const fill = opts.fill || "rgba(78, 224, 255, 0.18)";
  const pts = (values || []).map(v => (v == null || isNaN(v)) ? null : Number(v));
  const valid = pts.filter(v => v != null);
  if (valid.length < 2) {
    return `<svg width="${w}" height="${h}" aria-hidden="true">
      <line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="var(--border)" stroke-width="1" stroke-dasharray="2,3"/>
    </svg>`;
  }
  const lo = Math.min(...valid);
  const hi = Math.max(...valid);
  const span = (hi - lo) || 1;
  const xs = pts.length > 1 ? w / (pts.length - 1) : w;
  let lastX = 0;
  const linePts = pts.map((v, i) => {
    if (v == null) return null;
    const x = i * xs;
    const y = h - 2 - ((v - lo) / span) * (h - 4);
    lastX = x;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).filter(Boolean).join(" ");
  const area = `M 0,${h} L ${linePts.split(" ").join(" L ")} L ${lastX},${h} Z`;
  return `<svg width="${w}" height="${h}" aria-hidden="true">
    <path d="${area}" fill="${fill}" stroke="none"/>
    <polyline points="${linePts}" fill="none" stroke="${stroke}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

// Career-trend strip above the season-by-season table. Shows 3-4 key
// stats with a sparkline + the most recent value, so the reader gets
// the directional read at a glance before parsing the full table.
function makeCareerTrendStrip(career) {
  if (!career || career.length < 2) return "";
  const isP = career[0].is_pitcher;
  const sorted = [...career].sort((a, b) => (a.season || 0) - (b.season || 0));
  const cells = (isP
    ? [
        { key: "era",      label: "ERA",  fmt: v => v.toFixed(2), invert: true,
          stroke: "var(--down)", fill: "rgba(255, 95, 162, 0.18)" },
        { key: "whip",     label: "WHIP", fmt: v => v.toFixed(2), invert: true,
          stroke: "var(--down)", fill: "rgba(255, 95, 162, 0.18)" },
        { key: "k_per_9",  label: "K/9",  fmt: v => v.toFixed(1) },
        { key: "bb_per_9", label: "BB/9", fmt: v => v.toFixed(1), invert: true,
          stroke: "var(--down)", fill: "rgba(255, 95, 162, 0.18)" },
      ]
    : [
        { key: "avg", label: "AVG", fmt: v => Number(v).toFixed(3).replace(/^0/, "") },
        { key: "obp", label: "OBP", fmt: v => Number(v).toFixed(3).replace(/^0/, "") },
        { key: "slg", label: "SLG", fmt: v => Number(v).toFixed(3).replace(/^0/, "") },
        { key: "ops", label: "OPS", fmt: v => Number(v).toFixed(3).replace(/^0/, ""),
          stroke: "var(--up)", fill: "rgba(64, 224, 132, 0.18)" },
      ]
  );
  const tiles = cells.map(({ key, label, fmt, invert, stroke, fill }) => {
    const vals = sorted.map(s => s[key] != null ? Number(s[key]) : null);
    if (!vals.some(v => v != null)) return "";
    const last = [...vals].reverse().find(v => v != null);
    return `<div style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:6px 10px;border-right:1px solid var(--border-light);min-width:90px;">
      <span class="t-stat-label">${label}</span>
      ${_miniSparkline(vals, { stroke: stroke, fill: fill })}
      <span class="t-stat-value" style="font-size:13px;">${last != null ? fmt(last) : "—"}</span>
    </div>`;
  }).join("");
  if (!tiles) return "";
  return `<div class="detail-card" style="display:flex;flex-wrap:wrap;padding:0;margin-bottom:10px;overflow-x:auto;">${tiles}</div>`;
}

function makeCareerTable(career) {
  if (!career || !career.length) {
    return `<div style="color:var(--text-tertiary);font-size:12px;">No multi-season stats available.</div>`;
  }
  const isP = career[0].is_pitcher;

  // Sort descending by season so the most recent year is up top.
  const sorted = [...career].sort((a, b) => (b.season || 0) - (a.season || 0));

  // A "category strip" sits above the column headers. Each cell spans
  // its category and is tinted lightly so groups read at a glance.
  // Colors are chosen so each tool/skill family reads distinctly:
  // counting (muted blue), slash (forest green), power (burnt orange —
  // power = "the boom"), discipline (slate purple), pitcher peripherals
  // (the sabermetric trio gets the warm color since FIP/HR-9 are the
  // saber-friendly piece of pitching).
  const stripStyle = (color) => `padding:5px 8px;background:${color};color:var(--bg-secondary);text-align:center;font-family:var(--font-sans);font-size:9px;letter-spacing:0.10em;text-transform:uppercase;font-weight:600;border-right:1px solid var(--bg-primary);`;
  const META_COLOR  = "#3D4A5C";   // slate, season/level
  const COUNT_COLOR = "#5B6E7E";   // muted blue, counting stats
  const SLASH_COLOR = "#3F6F47";   // forest, slash line (AVG/OBP/SLG/OPS)
  const POWER_COLOR = "#8B5A1F";   // burnt orange, isolated power (ISO) — pure power signal, distinct from slash
  const DISC_COLOR  = "#5F4B8B";   // slate purple, plate discipline (BB% / K%)
  const PERIPH_COLOR = "#8B5A1F";  // burnt orange, pitcher peripherals (K/9, BB/9, HR/9)

  if (isP) {
    // Pitcher table groupings:
    //   Meta | Counting (G, IP, W-L) | Run prevention (ERA, WHIP) |
    //   Peripherals (K/9, BB/9, HR/9 — the FIP components).
    // HR/9 belongs with the other peripherals because it's a "things
    // the pitcher fully owns" stat, alongside strikeouts and walks
    // (FIP is built from K/9 + BB/9 + HR/9 for exactly that reason).
    const strip = `<tr>
      <th colspan="2" style="${stripStyle(META_COLOR)}">Meta</th>
