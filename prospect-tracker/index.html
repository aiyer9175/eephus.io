          : (a.team_name ? `Signed by ${a.team_name}` : ""),
        bonus_usd: a.bonus_usd,
        pick_overall: a.pick_overall,
        round_label: a.round_label,
        year: a.year,
        sort_key: date,
      });
    }
  }
  if (!events.length) return null;
  events.sort((a, b) => b.sort_key.localeCompare(a.sort_key));
  return events[0];
}

// Pretty label + chip color for each acquisition method. Method keys
// match the global `#acq-filter` <select> values.
const ACQ_LABELS = {
  trade:             { label: "Trade",             color: "var(--accent-traded)" },
  waiver:            { label: "Waiver claim",      color: "var(--neon-amber)" },
  rule_5:            { label: "Rule 5",            color: "var(--neon-cyan)" },
  contract_purchase: { label: "Contract purchase", color: "var(--text-secondary)" },
  international_fa:  { label: "International FA",  color: "var(--neon-violet)" },
  draft:             { label: "MLB Draft",         color: "var(--up)" },
};

function getFilteredAcquired() {
  // Active prospects only (graduates have their own section). For each
  // active player we resolve their MOST RECENT inbound acquisition; the
  // pool is players where that resolves to something.
  let pool = [];
  for (const p of (DATA.players || [])) {
    const acq = latestAcquisition(p);
    if (!acq) continue;
    pool.push({ p, acq });
  }
  if (state.search) {
    const q = state.search.toLowerCase();
    pool = pool.filter(({ p }) => p.player_name.toLowerCase().includes(q));
  }
  if (state.orgFilter !== "all") {
    pool = pool.filter(({ p }) => p.org === state.orgFilter);
  }
  if (state.acqFilter !== "all") {
    pool = pool.filter(({ acq }) => acq.method === state.acqFilter);
  }
  // Sort by acquisition date desc; tiebreak by FV desc.
  pool.sort((a, b) => {
    if (a.acq.date !== b.acq.date) return b.acq.date.localeCompare(a.acq.date);
    const fa = a.p.points.length ? a.p.points[a.p.points.length - 1].consensus_fv_raw : 0;
    const fb = b.p.points.length ? b.p.points[b.p.points.length - 1].consensus_fv_raw : 0;
    return fb - fa;
  });
  return pool;
}

// Back-compat alias for callers that still reference the old name.
const getFilteredTraded = getFilteredAcquired;

// Cross-org leaderboards — top N prospects by a chosen stat for the
// chosen season. Pulls from career_stats (year-by-year per-level rows)
// rather than the latest-statline blob, so historical seasons (2021+)
// work and the AB/IP gates use the actual season's volume.
//
// Stat config: each key on `LB_STATS` defines how to render the value,
// the supporting line, and how to sort (high vs low is better). The
// minAB/minIP gates are intentionally generous so leaderboards stay
// populated even in shallow MiLB seasons or early in the current year.
//
// Statline values arrive as a mix of floats (iso, era, whip, k_per_9,
// bb_per_9, bb_pct, k_pct) and strings (ops, avg, obp, slg — kept as
// ".788" so the leading-zero formatting is preserved). Formatters wrap
// values in `Number(v)` defensively so either type works.
// Shared "kitchen-sink" support builders. The Context cell on each
// leaderboard now shows two lines packing every rate + counting stat we
// have on file for the season — separators are mid-dots; missing values
// collapse to em-dashes so the line shape stays stable across rows.
const _lbHitterSupport = r => {
  const slash = `${r.avg ?? "—"}/${r.obp ?? "—"}/${r.slg ?? "—"}`;
  const ops = r.ops ?? "—";
  const iso = r.iso != null ? Number(r.iso).toFixed(3).replace(/^0/, "") : "—";
  const bb = r.bb_pct != null ? Number(r.bb_pct).toFixed(1) + "%" : "—";
  const k  = r.k_pct  != null ? Number(r.k_pct ).toFixed(1) + "%" : "—";
  const games = r.games != null ? `${r.games}G` : "";
  const ab = r.ab != null ? `${r.ab} AB` : "";
  const top    = `${slash} · OPS ${ops} · ISO ${iso}`;
  const bottom = `${r.hr ?? 0} HR · ${r.sb ?? 0} SB · ${r.rbi ?? 0} RBI · BB ${bb} · K ${k}${games ? " · " + games : ""}${ab ? " · " + ab : ""}`;
  return `<div>${top}</div><div style="color:var(--text-tertiary);margin-top:2px;">${bottom}</div>`;
};
const _lbPitcherSupport = r => {
  const wins = r.wins ?? 0, losses = r.losses ?? 0;
  const top = `${r.ip ?? "—"} IP · ${r.era ?? "—"} ERA · ${r.whip ?? "—"} WHIP`;
  const bottom = `K/9 ${r.k_per_9 ?? "—"} · BB/9 ${r.bb_per_9 ?? "—"} · ${wins}-${losses}${r.games != null ? " · " + r.games + "G" : ""}`;
  return `<div>${top}</div><div style="color:var(--text-tertiary);margin-top:2px;">${bottom}</div>`;
};

const LB_STATS = {
  ops:     { label: "OPS",     hi: true,  fmt: v => v != null ? Number(v).toFixed(3).replace(/^0/, "") : "—",
             minAB: 50, support: _lbHitterSupport, side: "hit" },
  iso:     { label: "ISO",     hi: true,  fmt: v => v != null ? Number(v).toFixed(3).replace(/^0/, "") : "—",
             minAB: 50, support: _lbHitterSupport, side: "hit" },
  bb_pct:  { label: "BB%",     hi: true,  fmt: v => v != null ? Number(v).toFixed(1) + "%" : "—",
             minAB: 50, support: _lbHitterSupport, side: "hit" },
  k_pct:   { label: "K%",      hi: false, fmt: v => v != null ? Number(v).toFixed(1) + "%" : "—",
             minAB: 50, support: _lbHitterSupport, side: "hit" },
  hr:      { label: "HR",      hi: true,  fmt: v => v != null ? String(v) : "—",
             minAB: 20, support: _lbHitterSupport, side: "hit" },
  sb:      { label: "SB",      hi: true,  fmt: v => v != null ? String(v) : "—",
             minAB: 20, support: _lbHitterSupport, side: "hit" },
  era:     { label: "ERA",     hi: false, fmt: v => v != null ? Number(v).toFixed(2) : "—",
             minIP: 15, support: _lbPitcherSupport, side: "pit" },
  whip:    { label: "WHIP",    hi: false, fmt: v => v != null ? Number(v).toFixed(2) : "—",
             minIP: 15, support: _lbPitcherSupport, side: "pit" },
  k_per_9: { label: "K/9",     hi: true,  fmt: v => v != null ? Number(v).toFixed(2) : "—",
             minIP: 15, support: _lbPitcherSupport, side: "pit" },
  bb_per_9:{ label: "BB/9",    hi: false, fmt: v => v != null ? Number(v).toFixed(2) : "—",
             minIP: 15, support: _lbPitcherSupport, side: "pit" },
};

function renderLeaderboards() {
  const statKey = state.lbStat   || "ops";
  const cfg = LB_STATS[statKey]   || LB_STATS.ops;
  const lvl    = state.lbLevel    || "all";
  const pos    = state.lbPos      || "all";
  const org    = state.lbOrg      || "all";
  const season = Number(state.lbSeason || new Date().getUTCFullYear());

  // Walk every (player, career_stats row) for the selected season.
  // Restricted to ACTIVE PROSPECTS — graduates are excluded since they're
  // no longer prospects, and MLB-level rows are excluded since this is a
  // prospect leaderboard (the Active list itself already covers MLB-graded
  // prospects who happen to have MLB-level stats). A player can have
  // multiple MiLB rows in the same season; each becomes its own entry
  // so a Jesús Made AA-then-AAA year would land in both AAA and AA boards.
  const pool = [];
  for (const p of (DATA.players || [])) {
    const career = p.career_stats || [];
    if (!career.length) continue;
    // Wrong-side gate at the player level — `p.position` is the most
    // current designation. is_pitcher on the row is authoritative
    // when present.
    const bucket = positionBucket(p.position);
    if (pos !== "all" && !positionMatches(bucket, pos)) continue;
    if (org !== "all" && p.org !== org) continue;
    for (const r of career) {
      if (r.season !== season) continue;
      if (r.level === "MLB") continue;  // prospect leaderboard — MiLB only
      if (cfg.side === "hit" && r.is_pitcher) continue;
      if (cfg.side === "pit" && !r.is_pitcher) continue;
      if (lvl !== "all" && r.level !== lvl) continue;
      const v = r[statKey];
      if (v == null) continue;
      // Sample gates — AB for hitters, IP for pitchers. Both may
      // arrive as strings; Number()-coerce.
      if (cfg.minAB && Number(r.ab ?? 0) < cfg.minAB) continue;
      if (cfg.minIP && Number(r.ip ?? 0) < cfg.minIP) continue;
      pool.push({ p, r, v: Number(v) });
    }
  }
  pool.sort((a, b) => cfg.hi ? (b.v - a.v) : (a.v - b.v));
  const ranked = pool.slice(0, 25);

  const header = `<div class="col-header is-leaderboard">
    <span style="text-align:center;">#</span>
    <span>Player · pos · org · age</span>
    <span>Level</span>
    <span style="text-align:center;">FV</span>
    <span style="text-align:right;">${escapeHtml(cfg.label)}</span>
    <span title="Stat-specific context: for OPS shows slash + HR/SB; for ERA shows IP + K/9; etc.">Context</span>
  </div>`;

  if (!ranked.length) {
    const minLabel = cfg.minAB ? `${cfg.minAB} AB` : `${cfg.minIP || 0} IP`;
    document.getElementById("leaderboard-rows").innerHTML =
      header + `<div class="state-message">No active MiLB ${cfg.side === "hit" ? "hitters" : "pitchers"} qualify for the ${season} ${escapeHtml(cfg.label)} board under these filters (min ${minLabel}).</div>`;
    return;
  }

  const rows = ranked.map(({ p, r, v }, i) => {
    const fvLabel = p.fv_close != null ? Math.round(p.fv_close) : "—";
    return `
      <div class="player-row is-leaderboard" data-key="${escapeHtml(p.player_key)}" style="${orgStripe(p.org)}">
        <div class="rank-num">${i + 1}</div>
        <div style="display:flex;align-items:flex-start;gap:8px;min-width:0;">
          <div style="min-width:0;flex:1;">
            <div class="player-name">${escapeHtml(p.player_name)}</div>
            ${playerMetaHTML(p)}
          </div>
          <button class="compare-add-btn is-compact${compareHas(p.player_key) ? " is-in" : ""}" data-compare-key="${escapeHtml(p.player_key)}" type="button" title="${compareHas(p.player_key) ? "Remove from compare" : "Add to compare"}" aria-label="Toggle compare">${compareHas(p.player_key) ? "✓" : "+"}</button>
        </div>
        <div><span class="level-pill ${r.level === "MLB" ? "level-mlb" : "level-neutral"}">${escapeHtml(r.level || "—")}</span></div>
        <div style="text-align:center;">${fvLabel !== "—" ? `<span class="fv-badge ${fvClass(String(fvLabel))}" title="${escapeHtml(fvBadgeTooltip(p))}">${fvLabel}${fvBadgeConfidence(p)}</span>` : `<span style="color:var(--text-tertiary);">—</span>`}</div>
        <div style="text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:700;color:var(--text-primary);">${cfg.fmt(v)}</div>
        <div style="font-size:11px;color:var(--text-secondary);font-family:var(--font-mono);font-variant-numeric:tabular-nums;">${cfg.support(r)}</div>
      </div>`;
  }).join("");

  document.getElementById("leaderboard-rows").innerHTML = header + rows;
}

// Injured List section — every tracked prospect currently on an IL
// stint. Pulls from player.il_status (which carries `is_on_il`, type,
// since-date, days) and renders a focused roster so a user can answer
// "who's hurt right now and how long are they out?" in one view.
// Honors the global search box and the per-section sort chips.
function renderInjured() {
  renderWhatsNew("whats-new-injured", kind => kind === "il");
  const today = new Date();
  // Build the list from every player array — actives + graduates
  // (graduates can also be on the MLB IL) + inactives — so a hurt
  // post-grad still shows up here rather than disappearing into the
  // graduates view.
  const pool = [];
  for (const arr of ["players", "graduates", "inactive"]) {
    for (const p of (DATA[arr] || [])) {
      const il = p.il_status || {};
      if (!il.is_on_il) continue;
      // Days elapsed since placement. Server fills `days` in il_status
      // for closed stints but the active stint's days field is often
      // null — derive from the `since` field.
      let days = il.days;
      if ((days == null) && il.since) {
        const t = new Date(il.since + "T00:00:00").getTime();
        if (!isNaN(t)) days = Math.max(0, Math.floor((today.getTime() - t) / 86400000));
      }
      pool.push({
        p, il,
        days: days || 0,
        since: il.since || "",
        // FV close (most-recent consensus_fv) so we can sort by talent.
        fv: p.fv_close || 0,
      });
    }
  }

  // Search filter — shared with the rest of the views.
  let filtered = pool;
  if (state.search) {
    const q = state.search.toLowerCase();
    filtered = filtered.filter(({ p }) => (p.player_name || "").toLowerCase().includes(q));
  }

  // Sort. Default is days_asc — shortest current IL stints first, so
  // the players closest to returning rise to the top. "days" is the
  // legacy descending variant.
  const mode = state.ilSort || "days_asc";
  if (mode === "fv") {
    filtered.sort((a, b) => (b.fv || 0) - (a.fv || 0) || (a.days - b.days));
  } else if (mode === "since") {
    filtered.sort((a, b) => (b.since || "").localeCompare(a.since || ""));
  } else if (mode === "days") {
    // Longest stints first.
    filtered.sort((a, b) => (b.days - a.days) || (b.fv - a.fv));
  } else {
    // days_asc (default): shortest stints first.
    filtered.sort((a, b) => (a.days - b.days) || (b.fv - a.fv));
  }

  // Grid columns live on `.col-header.is-injured` / `.player-row.is-injured`.
  const header = `<div class="col-header is-injured">
    <span style="text-align:center;">#</span>
    <span>Player · pos · org</span>
    <span>IL type</span>
    <span>Since</span>
    <span style="text-align:right;">Days</span>
    <span style="text-align:center;">FV</span>
    <span>Reason</span>
  </div>`;

  const rows = filtered.map(({ p, il, days, since, fv }, i) => {
    const tjBadge = (p.health_profile || {}).is_post_tj
      ? `<span style="font-size:9px;color:var(--accent-tj);background:var(--accent-tj-soft);border:1px solid var(--accent-tj-border);padding:1px 5px;border-radius:2px;letter-spacing:0.04em;text-transform:uppercase;font-weight:700;margin-left:4px;">Post-TJ</span>`
      : "";
    const fvLabel = fv ? Math.round(fv) : "—";
    const reason = il.reason || il.description || "—";
    return `
      <div class="player-row is-injured" data-key="${escapeHtml(p.player_key)}" style="${orgStripe(p.org)}">
        <div class="rank-num">${i + 1}</div>
        <div style="display:flex;align-items:center;gap:10px;min-width:0;">
          ${headshotHTML(p, 50)}
          <div style="min-width:0;flex:1;">
            <div class="player-name">${escapeHtml(p.player_name)}${tjBadge}</div>
            ${playerMetaHTML(p, { showIL: false, showRoster: false })}
          </div>
          <button class="compare-add-btn is-compact${compareHas(p.player_key) ? " is-in" : ""}" data-compare-key="${escapeHtml(p.player_key)}" type="button" title="${compareHas(p.player_key) ? "Remove from compare" : "Add to compare"}" aria-label="Toggle compare">${compareHas(p.player_key) ? "✓" : "+"}</button>
        </div>
        <div><span class="grad-pill" style="background:var(--accent-il-soft);color:var(--accent-il);border:1px solid var(--accent-il-border);">${escapeHtml(il.type || "?")} IL</span></div>
        <div style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--text-secondary);">${escapeHtml(since || "—")}</div>
        <div style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--neon-amber);font-weight:600;">${days}d</div>
        <div style="text-align:center;">${fv ? `<span class="fv-badge ${fvClass(String(fvLabel))}" title="${escapeHtml(fvBadgeTooltip(p))}">${fvLabel}${fvBadgeConfidence(p)}</span>` : `<span style="color:var(--text-tertiary);">—</span>`}</div>
        <div style="font-size:11px;color:var(--text-secondary);line-height:1.3;">${escapeHtml(reason)}</div>
      </div>`;
  }).join("");

  document.getElementById("injured-rows").innerHTML = filtered.length
    ? header + rows
    : (state.search
        ? `<div class="state-message">No injured prospects match "${escapeHtml(state.search)}".</div>`
        : `<div class="state-message">No tracked prospects are currently on the IL.</div>`);
}

function renderRecentlyTraded() {
  // Keep the news feed scoped to trade events on this tab (still the
  // most user-relevant signal even now that the section also covers
  // waivers / FA / Rule 5).
  renderWhatsNew("whats-new-traded", kind => kind === "trade");
  const filtered = getFilteredAcquired();

  // Grid columns live on `.col-header.is-traded` / `.player-row.is-traded`.
  const header = `<div class="col-header is-traded">
    <span style="text-align:center;">#</span>
    <span>Player · pos · org · age</span>
    <span>Acquisition date</span>
    <span>Method · context</span>
    <span style="text-align:center;" title="Consensus Future Value · stock delta + direction below">FV · stock</span>
    <span class="desktop-only" style="text-align:center;">FV history</span>
    <span class="desktop-only" style="text-align:center;" title="FV open/high/low/close for the current month, candlestick style">Candle</span>
  </div>`;

  const rows = filtered.map(({ p, acq }, i) => {
    const latest = p.points[p.points.length - 1];
    const meta = ACQ_LABELS[acq.method] || { label: acq.method, color: "var(--text-secondary)" };
    // The "method · context" cell shows the acquisition method as a
    // colored pill, plus a short context line (from→to for trades,
    // round/pick for drafts, signing details for IFA, etc.).
    let contextLine = "";
    if (acq.method === "trade") {
      // Header: from→to. Sub-line: the API-supplied trade narrative
      // (e.g. "Twins traded ... to Marlins for ..."). Truncated to keep
      // the cell from blowing the row height; the full string is
      // available on hover via the title attribute.
      const headLine = `<span style="color:var(--text-tertiary);">${escapeHtml(acq.from_org ?? "?")}</span> <span style="color:var(--neon-violet);">→</span> <span style="color:var(--text-primary);">${escapeHtml(acq.to_org ?? "?")}</span>`;
      const desc = (acq.description || "").trim();
      const TRUNC = 90;
      const subLine = desc
        ? `<span style="display:block;color:var(--text-tertiary);font-size:11px;margin-top:2px;line-height:1.35;" title="${escapeHtml(desc)}">${escapeHtml(desc.length > TRUNC ? desc.slice(0, TRUNC - 1).trimEnd() + "…" : desc)}</span>`
        : "";
      contextLine = headLine + subLine;
    } else if (acq.method === "draft" && acq.pick_overall) {
      contextLine = `<span style="color:var(--text-tertiary);">${acq.year} draft</span> · <span style="color:var(--text-primary);">Pick ${acq.pick_overall}${acq.round_label ? ` (R${escapeHtml(acq.round_label)})` : ""}</span>`;
    } else if (acq.method === "international_fa") {
      const bonus = acq.bonus_usd ? ` · $${(acq.bonus_usd / 1_000_000).toFixed(2)}M` : "";
      contextLine = `<span style="color:var(--text-tertiary);">${acq.year || "—"} IFA${bonus}</span>`;
    } else if (acq.method === "waiver" && acq.from_org) {
      contextLine = `<span style="color:var(--text-tertiary);">claimed from ${escapeHtml(acq.from_org)}</span>`;
    } else if (acq.method === "rule_5" && acq.from_org) {
      contextLine = `<span style="color:var(--text-tertiary);">Rule 5 from ${escapeHtml(acq.from_org)}</span>`;
    } else {
      contextLine = `<span style="color:var(--text-tertiary);">${escapeHtml(acq.description || "—")}</span>`;
    }
    const methodPill = `<span class="grad-pill" style="background:var(--bg-tertiary);color:${meta.color};border:1px solid var(--border);">${escapeHtml(meta.label)}</span>`;
    return `
      <div class="player-row is-traded" data-key="${escapeHtml(p.player_key)}" style="${orgStripe(p.org)}">
        <div class="rank-num">${i + 1}</div>
        <div style="display:flex;align-items:flex-start;gap:8px;min-width:0;">
          <div style="min-width:0;flex:1;">
            <div class="player-name">${escapeHtml(p.player_name)}</div>
            ${playerMetaHTML(p)}
          </div>
          <button class="compare-add-btn is-compact${compareHas(p.player_key) ? " is-in" : ""}" data-compare-key="${escapeHtml(p.player_key)}" type="button" title="${compareHas(p.player_key) ? "Remove from compare" : "Add to compare"}" aria-label="Toggle compare">${compareHas(p.player_key) ? "✓" : "+"}</button>
        </div>
        <div>
          <span class="grad-pill" style="background:var(--bg-tertiary);color:${meta.color};border:1px solid var(--border);">${escapeHtml(acq.date)}</span>
        </div>
        <div style="font-size:12px;display:flex;flex-direction:column;gap:3px;">
          ${methodPill}
          <span style="font-size:11px;">${contextLine}</span>
        </div>
        <div style="text-align:center;"><span class="fv-badge ${fvClass(latest.consensus_fv_label)}" title="${escapeHtml(fvBadgeTooltip(p))}">${latest.consensus_fv_label}${fvBadgeConfidence(p)}</span>${fvTrendHTML(p)}</div>
        <div class="line-chart-cell desktop-only">${makeLineChart(p.points, p.fv_open, p.fv_close, p.graduation_date, p.trades, p)}</div>
        <div class="candle-cell desktop-only">${makeCandle(p)}</div>
      </div>
    `;
  }).join("");

  document.getElementById("traded-rows").innerHTML = filtered.length
    ? header + rows
    : `<div class="state-message">No acquired prospects match these filters.</div>`;
}

function renderGraduates() {
  renderWhatsNew("whats-new-graduates", kind => kind === "graduated");
  const filtered = getFilteredGrads();

  // Build a render order based on the active sort. For date-sort we keep
  // the legacy group-by-date layout (each class together, recency
  // banner) so a "who just graduated" scan still works. For WAR / FV
  // sorts the rows go flat, since grouping by date wouldn't help.
  const sortMode = state.gradSort || "date";

  // Group by date so the most-recent class can be visually flagged
  const byDate = {};
  for (const g of filtered) (byDate[g.graduation_date] = byDate[g.graduation_date] || []).push(g);
  const sortedDates = Object.keys(byDate).sort().reverse();
  const isRecentGradDate = dateStr => {
    if (!dateStr) return false;
    const d = new Date(`${dateStr}T00:00:00`);
    if (Number.isNaN(d.getTime())) return false;
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diffDays = (today - d) / 86400000;
    return diffDays >= 0 && diffDays <= 14;
  };

  // Grid columns live on `.grad-header` / `.grad-row` in the CSS block.
  const header = `<div class="grad-header">
    <span style="text-align:center;">#</span>
    <span>Player · pos · org · age</span>
    <span class="grad-graduation-cell">Graduation</span>
    <span style="text-align:center;">FV</span>
    <span class="desktop-only" style="text-align:center;">Prospect trajectory</span>
    <span class="desktop-only" style="text-align:center;">Candle</span>
    <span class="grad-level-cell">Level</span>
    <span>MLB stats</span>
  </div>`;

  // Build the iteration order based on the active sort.
  let orderedGrads;
  if (sortMode === "war") {
    orderedGrads = filtered.slice().sort((a, b) => {
      const aw = (a.sabermetrics || {}).war;
      const bw = (b.sabermetrics || {}).war;
      // null / undefined sink to the bottom regardless of sign of WAR
      // (we don't want -0.5 above no-WAR-on-file).
      if (aw == null && bw == null) return 0;
      if (aw == null) return 1;
      if (bw == null) return -1;
      return bw - aw;
    });
  } else if (sortMode === "fv_close") {
    orderedGrads = filtered.slice().sort((a, b) =>
      ((b.fv_close ?? -1) - (a.fv_close ?? -1))
      || (b.graduation_date || "").localeCompare(a.graduation_date || "")
    );
  } else {
    // Date sort: preserve the group-by-date pass below.
    orderedGrads = null;
  }

  const renderRow = (g, rank, pillClassOverride, sublabel) => {
    const isRecent = isRecentGradDate(g.graduation_date);
    const pillClass = pillClassOverride || (isRecent ? "grad-pill most-recent" : "grad-pill");
    const chartHtml = (g.points && g.points.length >= 2)
      ? makeLineChart(g.points, g.fv_open, g.fv_close, g.graduation_date, g.trades, g)
      : `<span style="color:var(--text-tertiary);font-size:11px;">—</span>`;
    const fvLabel = g.fv_close != null ? Math.round(g.fv_close) : "—";
    const sm = g.sabermetrics || {};
    // When sorting by WAR, surface the value on the row so the reader
    // can see the sort key without hovering. Same for FV.
    const warTag = sortMode === "war" && sm.war != null
      ? `<span style="margin-left:6px;font-family:var(--font-mono);font-size:10px;color:var(--neon-cyan);">${sm.war > 0 ? '+' : ''}${sm.war.toFixed(2)} WAR</span>`
      : "";
    return `
      <div class="grad-row" data-key="${escapeHtml(g.player_key)}" style="${orgStripe(g.org)}">
        <div class="rank-num">${rank}</div>
        <div style="display:flex;align-items:center;gap:10px;min-width:0;">
          ${headshotHTML(g, 50)}
          <div style="min-width:0;flex:1;">
            <div class="player-name">${escapeHtml(g.player_name)}${warTag}</div>
            ${playerMetaHTML(g, { showIL: false, showRoster: false })}
          </div>
        </div>
        <div class="grad-graduation-cell">
          <span class="${pillClass}">${g.graduation_date}</span>
          ${sublabel || (isRecent ? `<span style="font-size:10px;color:var(--text-tertiary);margin-left:6px;">recent</span>` : "")}
        </div>
        <div style="text-align:center;"><span class="fv-badge ${fvClass(String(fvLabel))}" title="${escapeHtml(fvBadgeTooltip(g))}">${fvLabel}${fvBadgeConfidence(g)}</span></div>
        <div class="desktop-only" style="padding-right:6px;">${chartHtml}</div>
        <div class="desktop-only">${makeCandle(g)}</div>
        <div class="grad-level-cell milb-cell"><span class="level-pill level-mlb">MLB</span></div>
        ${makeGradMilbCell(g)}
      </div>`;
  };

  let body = header;
  if (orderedGrads !== null) {
    // Flat list driven by sort.
    orderedGrads.forEach((g, i) => {
      body += renderRow(g, i + 1, null, "");
    });
  } else {
    let rank = 1;
    for (const dateKey of sortedDates) {
      for (const g of byDate[dateKey]) {
        body += renderRow(g, rank++, null, null);
      }
    }
  }

  document.getElementById("grad-rows").innerHTML = filtered.length
    ? body
    : `<div class="state-message">No graduates match these filters.</div>`;
}
