  // expanded meta stays focused on stats unique to this row.
  if (!parts.length) return "";
  return `<div class="player-row-expand">${parts.join("   ·   ")}</div>`;
}

const fvClass = label => {
  const n = parseInt(label, 10);
  if (n >= 80) return "fv-80";
  if (n >= 75) return "fv-75";
  if (n >= 70) return "fv-70";
  if (n >= 65) return "fv-65";
  if (n >= 60) return "fv-60";
  if (n >= 55) return "fv-55";
  if (n >= 50) return "fv-50";
  if (n >= 45) return "fv-45";
  if (n >= 40) return "fv-40";
  if (n >= 35) return "fv-35";
  if (n >= 30) return "fv-30";
  if (n >= 25) return "fv-25";
  return "fv-20";
};

// Stock direction + delta. Same inner HTML in two places (raw chip vs.
// the `.fv-stock-line` wrapper under the FV badge); the optional
// `wrapperClass` arg lets fvTrendHTML reuse this without duplicating.
const stockInnerHTML = s => {
  if (!s) return `<span class="stock-flat">—</span>`;
  if (s.direction === "graduated") return `<span class="stock-grad">GRAD</span>`;
  if (s.direction === "flat" || s.delta == null || Math.abs(s.delta) < 1.5) {
    return `<span class="stock-flat">— flat</span>`;
  }
  if (s.delta > 0) return `<span class="stock-up">▲ +${s.delta.toFixed(1)}</span>`;
  return `<span class="stock-down">▼ ${s.delta.toFixed(1)}</span>`;
};
const stockHTML = s => stockInnerHTML(s);

// Level hierarchy (low to high). Used to detect promotions/demotions
// between consecutive seasons in career_stats so we can mark them on the
// stock chart.
// Post-rename ladder. Legacy aliases ("Rk", "R", "ROK", "FCL") still
// resolve so any career row that pre-dates the cleanup ranks correctly.
const LEVEL_RANK = { DSL: 0, FCL: 1, CPX: 1, "Rk": 1, R: 1, ROK: 1, A: 2, "A+": 3, AA: 4, AAA: 5, MLB: 6 };
function levelRank(lvl) {
  return LEVEL_RANK[lvl] != null ? LEVEL_RANK[lvl] : -1;
}

// Derive promotion/demotion events for one player.
//
// Source of truth (when available): `player.level_changes`, populated by
// the back-end from the MLB Stats API per-player transactions endpoint —
// gives the EXACT date of every affiliate assignment, contract selection,
// or recall, including within-season moves (A → A+ → AA in one summer).
//
// Fallback: derive cross-season transitions from career_stats. This is a
// coarse signal (one event per year-over-year level change, pinned to
// April 1) but it keeps the chart populated for players whose transaction
// payload is missing or for graduates whose transactions predate our
// lookback window.
function levelChangeEvents(player) {
  // Back-compat: callers used to pass careerStats directly. If the arg is
  // an array, treat it as the legacy career_stats list.
  let careerStats = null;
  let levelChanges = null;
  if (Array.isArray(player)) {
    careerStats = player;
  } else if (player && typeof player === "object") {
    careerStats = player.career_stats || null;
    levelChanges = player.level_changes || null;
  }
  if (levelChanges && levelChanges.length) {
    return levelChanges.map(lc => ({
      date: lc.date,
      level: lc.to_level,
      prev_level: lc.from_level,
      kind: lc.kind,
      from_team: lc.from_team,
      to_team: lc.to_team,
    }));
  }
  if (!careerStats || careerStats.length < 2) return [];
  const asc = [...careerStats].sort((a, b) => a.season - b.season);
  const events = [];
  for (let i = 1; i < asc.length; i++) {
    const prev = asc[i - 1];
    const curr = asc[i];
    const pr = levelRank(prev.level), cr = levelRank(curr.level);
    if (pr < 0 || cr < 0 || pr === cr) continue;
    events.push({
      date: `${curr.season}-04-01`,           // approx season start
      level: curr.level,
      prev_level: prev.level,
      kind: cr > pr ? "promotion" : "demotion",
    });
  }
  return events;
}

// =============================================================================
// TRANSACTION INDICATORS — visual vocabulary shared across every FV chart.
// =============================================================================
// One entry per transaction "kind". Each chart looks up `kind` here so the
// same glyph + color combination represents the same event everywhere
// (mini sparklines, big prospect chart, farm-system stock chart). When the
// list changes, the legend on the prospect page and farm-detail page picks
// up the new entry automatically via TRANSACTION_LEGEND_ORDER.
//
// glyph: one-char marker rendered at the top of the chart line.
// color: stroke + fill for the vertical line and glyph.
// dash:  stroke-dasharray for the vertical guideline.
// pos:   "top" | "bottom" — where the glyph sits relative to the chart.
// Visual vocabulary for events that appear on the FV chart + transaction
// timeline. The set is split into two conceptual groups:
//   1. "Big" events with their own glyph on the FV chart (trade,
//      promotion, demotion, signing, debut, graduation).
//   2. Other transactions — waiver claims, DFAs, releases, contract
//      purchases, Rule 5 moves — that only appear in the transaction-
//      history table. They get a glyph too so the table reads as a
//      coherent vocabulary, but they're not drawn on the chart by
//      default (the chart filters to TRANSACTION_LEGEND_ORDER).
const TRANSACTION_KINDS = {
  trade:               { glyph: "◆", color: "var(--grad)",       dash: "2,1.5", pos: "top",    label: "Trade" },
  promotion:           { glyph: "▲", color: "var(--up)",         dash: "1,2",   pos: "bottom", label: "Promotion" },
  demotion:            { glyph: "▼", color: "var(--down)",       dash: "1,2",   pos: "bottom", label: "Demotion" },
  // Generic "entered pro ball" — kept for FV-chart markers when we
  // don't have an acquisition method to disambiguate. The detail-page
  // transaction-history block re-classifies into `drafted` or
  // `signed_ifa` based on the prospect's acquisition record so the
  // chip label tells the reader exactly how the player arrived.
  signing:             { glyph: "●", color: "var(--neon-cyan)",  dash: "1,2",   pos: "bottom", label: "Signed" },
  drafted:             { glyph: "●", color: "var(--neon-cyan)",  dash: "1,2",   pos: "bottom", label: "Drafted" },
  signed_ifa:          { glyph: "●", color: "var(--neon-amber)", dash: "1,2",   pos: "bottom", label: "Signed (IFA)" },
  debut:               { glyph: "★", color: "var(--neon-amber)", dash: "2,1.5", pos: "top",    label: "MLB debut" },
  graduation:          { glyph: "✦", color: "var(--neon-violet)",dash: "2,1.5", pos: "top",    label: "Graduation" },
  // Non-trade transactions (sourced from player.transactions). Same
  // shape so makeTransactionHistoryBlock can render them with one code
  // path; the chart filter (TRANSACTION_LEGEND_ORDER) leaves them out.
  waiver_claim:        { glyph: "◇", color: "var(--neon-amber)", dash: "1,2",   pos: "top",    label: "Waiver claim" },
  contract_purchase:   { glyph: "◷", color: "var(--neon-cyan)",  dash: "1,2",   pos: "top",    label: "Contract purchase" },
  released:            { glyph: "✕", color: "var(--down)",       dash: "1,2",   pos: "top",    label: "Released" },
  dfa:                 { glyph: "◇", color: "var(--text-tertiary)", dash: "1,2",pos: "top",    label: "Designated for assignment" },
  outrighted:          { glyph: "▽", color: "var(--text-tertiary)", dash: "1,2",pos: "top",    label: "Outrighted" },
  rule_5_selection:    { glyph: "◐", color: "var(--neon-cyan)",  dash: "1,2",   pos: "top",    label: "Rule 5 selection" },
  rule_5_return:       { glyph: "↺", color: "var(--text-tertiary)", dash: "1,2",pos: "top",    label: "Rule 5 return" },
  signed_free_agent:   { glyph: "●", color: "var(--neon-cyan)",  dash: "1,2",   pos: "bottom", label: "Signed (MLB FA)" },
};

// Re-classify a "signed_free_agent" transaction into the more accurate
// `drafted` / `signed_ifa` kind when its date and team match the
// player's original acquisition record. The MLB Stats API emits the
// same SFA/SGN typeCode for draft signings, IFA signings, and later-
// career FA signings; the only way to tell them apart is to anchor
// against the prospect's acquisition method + signing_date.
function reclassifyAcquisitionSigning(player, tx) {
  if (tx.kind !== "signed_free_agent") return tx.kind;
  const acq = player && player.acquisition;
  if (!acq || !acq.method || !acq.signing_date) return tx.kind;
  if (acq.method !== "draft" && acq.method !== "international_fa") return tx.kind;
  // Date-match: allow a ±90-day window. Spotrac/MLB IFA dates often
  // don't perfectly line up with the official signing date the
  // transactions endpoint records (intl signings sometimes post weeks
  // after the agreement is announced). The window keeps the mapping
  // accurate without false positives — a late-career FA signing won't
  // land within 90 days of an IFA's amateur signing.
  const a = new Date(acq.signing_date + "T00:00:00").getTime();
  const b = new Date((tx.date || "") + "T00:00:00").getTime();
  if (isNaN(a) || isNaN(b)) return tx.kind;
  if (Math.abs(a - b) > 90 * 86400 * 1000) return tx.kind;
  return acq.method === "draft" ? "drafted" : "signed_ifa";
}
// Only the high-signal events get rendered on the FV trajectory line so
// the chart doesn't turn into a curtain of glyphs for journeyman-y
// prospects who've been claimed off waivers six times.
const TRANSACTION_LEGEND_ORDER = ["trade", "promotion", "demotion", "signing", "debut", "graduation"];

// Build the combined event list for one player. Pulls from:
//   trades         → kind:'trade'
//   career_stats   → kind:'promotion' | 'demotion'
//   acquisition    → kind:'signing'   (if signing_date is on file)
//   graduation_date→ kind:'graduation'(graduates only)
//
// Each event has: { date, kind, label } where `label` is the hover-text
// content. Sorted ascending by date so renderers can iterate in order.
function transactionEvents(player) {
  const out = [];
  for (const tr of (player.trades || [])) {
    if (!tr.trade_date) continue;
    const heading = `${tr.trade_date} · ${tr.from_org ?? "?"} → ${tr.to_org ?? "?"}`;
    out.push({
      date: tr.trade_date,
      kind: "trade",
      label: heading + (tr.description ? `\n${tr.description}` : ""),
    });
  }
  // Non-trade transactions (waiver claims, releases, DFAs, contract
  // purchases, Rule 5 moves, FA signings). The pipeline writes only
  // truly-trade rows into `trades`; everything else lives here under
  // a precise kind. We surface them on the timeline so the FV chart
  // hover-tooltips show the same vocabulary the transaction table does.
  // SFA/SGN rows that line up with the player's original acquisition
  // get re-classified into "drafted" / "signed_ifa" so the chip label
  // matches the way the player actually entered pro ball.
  for (const tx of (player.transactions || [])) {
    if (!tx.date || !tx.kind) continue;
    const k = reclassifyAcquisitionSigning(player, tx);
    if (!TRANSACTION_KINDS[k]) continue;
    out.push({
      date: tx.date,
      kind: k,
      label: tx.description || `${tx.date}: ${(TRANSACTION_KINDS[k] || {}).label || k}`,
    });
  }
  for (const ev of levelChangeEvents(player)) {
    // Prefer the full date when we have it (transactions-derived events);
    // fall back to just the season for the year-over-year heuristic path.
    const datePrefix = ev.date && ev.date.length >= 10 ? ev.date : ev.date.slice(0, 4);
    const toClause   = ev.to_team   ? ` (${ev.to_team})`   : "";
    if (ev.kind === "debut") {
      out.push({
        date: ev.date,
        kind: "debut",
        label: `${datePrefix}: MLB Debut${toClause}`,
      });
      continue;
    }
    const verb = ev.kind === "promotion" ? "Promoted to" : "Demoted to";
    const fromClause = ev.from_team ? ` from ${ev.from_team}` : ` (from ${ev.prev_level})`;
    out.push({
      date: ev.date,
      kind: ev.kind,
      label: `${datePrefix}: ${verb} ${ev.level}${toClause}${fromClause}`,
    });
  }
  const acq = player.acquisition;
  if (acq && acq.signing_date) {
    const team = acq.team_name ? ` by ${acq.team_name}` : "";
    // Tag the marker by acquisition method so the chip + legend on the
    // FV chart says "Drafted" vs "Signed (IFA)" vs the generic "Signed"
    // for trade / waiver acquisitions. Kinds are real entries in
    // TRANSACTION_KINDS so the glyph + color matches in the legend.
    const kindByMethod = {
      draft:             "drafted",
      international_fa:  "signed_ifa",
    };
    const kind = kindByMethod[acq.method] || "signing";
    const verb = (TRANSACTION_KINDS[kind] || {}).label || "Signed";
    out.push({
      date: acq.signing_date,
      kind,
      label: `${acq.signing_date}: ${verb}${team}`,
    });
  }
  if (player.graduation_date) {
    out.push({
      date: player.graduation_date,
      kind: "graduation",
      label: `${player.graduation_date}: Graduated to MLB`,
    });
  }
  out.sort((a, b) => a.date.localeCompare(b.date));
  return out;
}

// =============================================================================
// SVG CHARTS
// =============================================================================
// Y-axis is anchored to the full 20-80 FV scale across both line charts and
// candles so a 50 FV always sits in the same vertical position regardless of
// prospect. The X-axis is per-prospect: starts at the player's first recorded
// FV grade and ends at graduation_date (for graduates) or the last snapshot
// (for active / inactive prospects).
const FV_MIN = 20, FV_MAX = 80;

function makeLineChart(points, fvOpen, fvClose, gradDate, trades, player) {
  if (!points || points.length === 0) return "";
  // Reserve 9px of left margin for the 20/80 Y-axis labels so the chart
  // line itself doesn't get squeezed by them. The labels sit OUTSIDE
  // the line's X range, anchored at x≈1; the polyline runs from
  // x=Y_LABEL_W+PAD onward.
  const W = 200, H = 56, PAD = 4, LABEL_H = 9, Y_LABEL_W = 9;
  // Chart area: y from PAD to H-LABEL_H-PAD. Bottom LABEL_H px reserved for year labels.
  const CHART_BOTTOM = H - LABEL_H - PAD;
  // Per-prospect time domain: first recorded FV → graduation_date (if graduated)
  // or last recorded FV (otherwise). Falls back to the points' own range if no
  // graduation date is supplied.
  const firstDate = points[0].snapshot_date;
  const lastDate  = points[points.length - 1].snapshot_date;
  const endDate   = (gradDate && new Date(gradDate).getTime() > new Date(lastDate).getTime())
                      ? gradDate : lastDate;
  const minT = new Date(firstDate).getTime();
  const maxT = new Date(endDate).getTime();
  const timeSpan = maxT - minT || 1;
  // X-axis starts after the Y-label margin so the 20/80 markers don't
  // overlap the line's left edge.
  const X_LEFT = PAD + Y_LABEL_W;
  const xScale = d => X_LEFT + ((new Date(d).getTime() - minT) / timeSpan) * (W - X_LEFT - PAD);
  const yScale = fv => CHART_BOTTOM - ((fv - FV_MIN) / (FV_MAX - FV_MIN)) * (CHART_BOTTOM - PAD);

  const isUp = fvClose > fvOpen, isDown = fvClose < fvOpen;
  const stroke = isUp ? "var(--up)" : isDown ? "var(--down)" : "var(--text-tertiary)";
  const pts = points.map(pt => `${xScale(pt.snapshot_date).toFixed(1)},${yScale(pt.consensus_fv_raw).toFixed(1)}`).join(" ");
  const circles = points.map(pt =>
    `<circle cx="${xScale(pt.snapshot_date).toFixed(1)}" cy="${yScale(pt.consensus_fv_raw).toFixed(1)}" r="2" fill="${stroke}"><title>${pt.snapshot_date} · ${pt.interval_label} · FV ${pt.consensus_fv_label}</title></circle>`
  ).join("");
  // Reference line at FV 50 — the "MLB-regular" threshold. Anyone
  // hovering above this line projects as an above-average MLB player;
  // below is a complementary/backup profile. The previous mark at FV
  // 60 only flagged the rare star tier, which is too narrow a band to
  // be useful as a constant reference on a per-prospect chart.
  const yRef = yScale(50);

  // Y-axis labels — 20 at the bottom, 80 at the top. Mini chart, so
  // we keep them small and dim. They anchor the line's vertical range
  // so the reader can immediately tell what a flat-near-the-top vs
  // flat-near-the-bottom curve means.
  const yLabels = `
    <text x="${(PAD).toFixed(1)}" y="${(yScale(80) + 3).toFixed(1)}" font-size="6.5" fill="var(--text-tertiary)" font-family="var(--font-mono)">80</text>
    <text x="${(PAD).toFixed(1)}" y="${(yScale(20) + 3).toFixed(1)}" font-size="6.5" fill="var(--text-tertiary)" font-family="var(--font-mono)">20</text>`;

  // Year boundary lines + labels
  const yearSvg = [];
  const startYear = new Date(minT).getFullYear();
  const endYear   = new Date(maxT).getFullYear();
  for (let yr = startYear; yr <= endYear + 1; yr++) {
    const yrT = Date.UTC(yr, 0, 1); // Jan 1 UTC
    if (yrT <= minT || yrT >= maxT) continue;
    const x = (X_LEFT + ((yrT - minT) / timeSpan) * (W - X_LEFT - PAD)).toFixed(1);
    yearSvg.push(
      `<line x1="${x}" y1="${PAD}" x2="${x}" y2="${CHART_BOTTOM}" stroke="var(--border)" stroke-width="0.4" stroke-dasharray="2,3"/>`,
      `<text x="${x}" y="${H - 1}" font-size="6.5" fill="var(--text-tertiary)" text-anchor="middle">${yr}</text>`
    );
  }

  // Transaction markers — one vertical guide + glyph per event, color
  // and dash style picked from TRANSACTION_KINDS so each event type is
  // visually distinct. Falls back to legacy trade-only rendering when
  // the caller didn't pass a full player object (older call sites).
  const events = player
    ? transactionEvents(player).filter(e => {
        const t = new Date(e.date).getTime();
        return !isNaN(t) && t >= minT && t <= maxT;
      })
    : (trades || []).map(tr => ({
        date: tr.trade_date,
        kind: "trade",
        label: `${tr.trade_date} · ${tr.from_org ?? "?"} → ${tr.to_org ?? "?"}${tr.description ? "\n" + tr.description : ""}`,
      })).filter(e => {
        const t = new Date(e.date).getTime();
        return !isNaN(t) && t >= minT && t <= maxT;
      });
  const eventSvg = [];
  for (const ev of events) {
    const cfg = TRANSACTION_KINDS[ev.kind];
    if (!cfg) continue;
    const x = xScale(ev.date).toFixed(1);
    const label = escapeHtml(ev.label);
    const top = cfg.pos === "top";
    const glyphY = top ? PAD + 4 : H - LABEL_H - 1;
    const fontSize = 6.5;
    eventSvg.push(
      `<line x1="${x}" y1="${PAD}" x2="${x}" y2="${CHART_BOTTOM}" stroke="${cfg.color}" stroke-width="0.9" stroke-dasharray="${cfg.dash}" opacity="0.75"><title>${label}</title></line>`,
      `<text x="${x}" y="${glyphY.toFixed(1)}" font-size="${fontSize}" fill="${cfg.color}" text-anchor="middle"><title>${label}</title>${cfg.glyph}</text>`
    );
  }

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img" aria-label="FV trajectory">
    ${yearSvg.join("")}
    <line x1="${X_LEFT}" y1="${yRef.toFixed(1)}" x2="${W - PAD}" y2="${yRef.toFixed(1)}" stroke="var(--border-light)" stroke-width="0.5" stroke-dasharray="2,2" />
    ${yLabels}
    ${eventSvg.join("")}
    <polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    ${circles}
  </svg>`;
}

function makeCandle(p) {
  const W = 70, H = 50, PAD = 4, FONT = 8;
  const yScale = fv => H - PAD - ((fv - FV_MIN) / (FV_MAX - FV_MIN)) * (H - 2 * PAD);
  const isUp = p.fv_close > p.fv_open, isDown = p.fv_close < p.fv_open;
  const color = isUp ? "var(--up)" : isDown ? "var(--down)" : "var(--text-tertiary)";
  const fill  = isUp ? "var(--up)" : isDown ? "var(--down)" : "transparent";
  const yH = yScale(p.fv_high), yL = yScale(p.fv_low);
  const yO = yScale(p.fv_open), yC = yScale(p.fv_close);
  const bodyTop = Math.min(yO, yC), bodyHt = Math.max(2, Math.abs(yC - yO));

  // High label sits ABOVE its tick; low label sits BELOW its tick.
  // Clamp each so the text stays inside the viewBox regardless of FV range.
  const highLabelY = Math.max(FONT,     yH - 2);        // above high tick, min y=8
  const lowLabelY  = Math.min(H - 1,   yL + FONT + 1); // below low tick,  max y=H-1

  // When high == low there is only one point — show a single centered label.
  const sameHL = p.fv_high === p.fv_low;
  const labels = sameHL
    ? `<text x="${W - 2}" y="${(yH + FONT / 2).toFixed(1)}" font-size="${FONT}" fill="var(--text-tertiary)" text-anchor="end">${p.fv_high_label ?? p.fv_high}</text>`
    : `<text x="${W - 2}" y="${highLabelY.toFixed(1)}" font-size="${FONT}" fill="var(--text-tertiary)" text-anchor="end">${p.fv_high_label ?? p.fv_high}</text>
       <text x="${W - 2}" y="${lowLabelY.toFixed(1)}"  font-size="${FONT}" fill="var(--text-tertiary)" text-anchor="end">${p.fv_low_label  ?? p.fv_low}</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="FV candlestick">
    <title>${p.player_name}: O=${p.fv_open} H=${p.fv_high} L=${p.fv_low} C=${p.fv_close}</title>
    <line x1="${W/2}" y1="${yH.toFixed(1)}" x2="${W/2}" y2="${yL.toFixed(1)}" stroke="${color}" stroke-width="1" />
    <line x1="${W/2 - 3}" y1="${yH.toFixed(1)}" x2="${W/2 + 3}" y2="${yH.toFixed(1)}" stroke="${color}" stroke-width="1" />
    <line x1="${W/2 - 3}" y1="${yL.toFixed(1)}" x2="${W/2 + 3}" y2="${yL.toFixed(1)}" stroke="${color}" stroke-width="1" />
    <rect x="${W/2 - 7}" y="${bodyTop.toFixed(1)}" width="14" height="${bodyHt.toFixed(1)}" fill="${fill}" stroke="${color}" stroke-width="1" />
    ${labels}
  </svg>`;
}

// FV trend: compare last two snapshot points (not all-time open/close)
// Compact "stock under FV" indicator — replaces the dedicated Stock
// column on the Active/Traded lists. Pulls from p.stock (already used
// by the standalone stockHTML helper) so the delta + direction land
// directly under the FV badge. Returns "" when no stock signal exists.
function fvTrendHTML(p) {
  const s = p.stock;
  if (!s) return "";
  return `<div class="fv-stock-line">${stockInnerHTML(s)}</div>`;
}

// Encode current filter state into the URL hash so the view is shareable.
// Detail pages get a dedicated `player=KEY` or `farm=ORG` hash param;
// when set they take precedence over the list-page filters at render time.
function syncToURL() {
  const p = new URLSearchParams();
  if (state.view && state.view.type === "player") p.set("player", state.view.key);
  else if (state.view && state.view.type === "farm") p.set("farm-org", state.view.org);
  if (state.section     !== "active")     p.set("tab",   state.section);
  if (state.orgFilter   !== "all")        p.set("org",   state.orgFilter);
  if (state.acqFilter   !== "all")        p.set("acq",   state.acqFilter);
  if (state.classFilter && state.classFilter !== "all") p.set("class", state.classFilter);
  if (state.levelFilter !== "all")        p.set("lvl",   state.levelFilter);
  if (state.posFilter   !== "all")        p.set("pos",   state.posFilter);
  if (state.sort        !== "fv")         p.set("sort",  state.sort);
  if (state.stockFilter !== "all")        p.set("stock", state.stockFilter);
  if (state.spreadFilter && state.spreadFilter !== "all") p.set("spread", state.spreadFilter);
  if (state.density     && state.density !== "standard") p.set("density", state.density);
  if (state.search)                       p.set("q",     state.search);
  if (state.farmSort    !== "farm_rank")  p.set("farm",  state.farmSort);
  if (state.farmViewMode && state.farmViewMode !== "table") p.set("farmview", state.farmViewMode);
  if (state.rosterSort  && state.rosterSort  !== "fv")    p.set("rsort", state.rosterSort);
  if (state.glossaryCat && state.glossaryCat !== "all")    p.set("gcat", state.glossaryCat);
  if (state.glossarySearch)                                 p.set("gq",   state.glossarySearch);
  if (state.formWindow  !== "1y")         p.set("formw", state.formWindow);
  if (state.farmTxKind  !== "all")        p.set("ftxk",  state.farmTxKind);
  if (state.farmTxDir   !== "all")        p.set("ftxd",  state.farmTxDir);
  if (state.gradSort    !== "date")       p.set("gsort", state.gradSort);
  if (state.ilSort      !== "days_asc")   p.set("ilsort", state.ilSort);
  if (state.spotlightBucket !== "hot")    p.set("bucket", state.spotlightBucket);
  if (state.lbStat      !== "ops")        p.set("lbstat",  state.lbStat);
  if (state.lbLevel     !== "all")        p.set("lblvl",   state.lbLevel);
  if (state.lbPos       !== "all")        p.set("lbpos",   state.lbPos);
  if (state.lbOrg       !== "all")        p.set("lborg",   state.lbOrg);
  if (state.lbSeason    !== String(new Date().getUTCFullYear())) p.set("lbseason", state.lbSeason);
  // Shareable compare state — encode the currently pinned prospect keys
  // and farm orgs into the hash so the URL alone reproduces the cart on
  // load. Mutual exclusivity guarantees at most one of these is non-
  // empty in normal use; the syncFromURL side handles a stale link that
  // somehow has both.
  const compareKeys = compareLoad();
  const farmKeys    = farmCompareLoad();
  if (compareKeys.length) p.set("cmp",  compareKeys.join(","));
  if (farmKeys.length)    p.set("fcmp", farmKeys.join(","));
  const hash = p.toString();
  history.replaceState(null, "", hash ? "#" + hash : window.location.pathname + window.location.search);
}

// Read the URL hash and update state (called once on boot, and again on
// hashchange so back/forward navigation works).
function syncFromURL() {
  const hash = window.location.hash.slice(1);
  // Reset view first so navigating back from a detail page clears state.view.
  state.view = null;
  if (!hash) return;
  const p = new URLSearchParams(hash);
  if (p.has("player"))   state.view = { type: "player", key: p.get("player") };
  else if (p.has("farm-org")) state.view = { type: "farm", org: p.get("farm-org") };
  if (p.has("tab"))   state.section     = p.get("tab");
  if (p.has("org"))   state.orgFilter   = p.get("org");
  if (p.has("acq"))   state.acqFilter   = p.get("acq");
  if (p.has("class")) state.classFilter = p.get("class");
  if (p.has("lvl"))   state.levelFilter = p.get("lvl");
  if (p.has("pos"))   state.posFilter   = p.get("pos");
  if (p.has("sort"))  state.sort        = p.get("sort");
  if (p.has("stock")) state.stockFilter = p.get("stock");
  if (p.has("spread")) state.spreadFilter = p.get("spread");
  if (p.has("density")) state.density   = p.get("density");
  if (p.has("q"))     state.search      = p.get("q");
  if (p.has("farm"))  state.farmSort    = p.get("farm");
  if (p.has("farmview")) state.farmViewMode = p.get("farmview");
  if (p.has("rsort")) state.rosterSort   = p.get("rsort");
  if (p.has("gcat"))  state.glossaryCat   = p.get("gcat");
  if (p.has("gq"))    state.glossarySearch = p.get("gq");
  if (p.has("g"))     state.glossaryTerm   = p.get("g");
  if (p.has("formw")) {
    const v = p.get("formw");
    if (v === "1y" || v === "3y" || v === "5y") state.formWindow = v;
  }
  if (p.has("ftxk")) state.farmTxKind = p.get("ftxk");
  if (p.has("ftxd")) state.farmTxDir  = p.get("ftxd");
  if (p.has("gsort")) state.gradSort  = p.get("gsort");
  if (p.has("ilsort")) state.ilSort    = p.get("ilsort");
  if (p.has("bucket")) state.spotlightBucket = p.get("bucket");
  // Leaderboards filters — round-tripped so org pre-fill from
  // farm-detail's "View org leaderboards →" link sticks.
  if (p.has("lbstat"))   state.lbStat   = p.get("lbstat");
  if (p.has("lblvl"))    state.lbLevel  = p.get("lblvl");
  if (p.has("lbpos"))    state.lbPos    = p.get("lbpos");
  if (p.has("lborg"))    state.lbOrg    = p.get("lborg");
  if (p.has("lbseason")) state.lbSeason = p.get("lbseason");
  // Shareable compare state. When both keys are present (stale link),
  // keep the longer list and clear the other — mutual exclusivity
  // means at most one should be set going forward.
  if (p.has("cmp") || p.has("fcmp")) {
    const cmpRaw  = p.has("cmp")  ? p.get("cmp").split(",").filter(Boolean).slice(0, COMPARE_MAX) : [];
    const fcmpRaw = p.has("fcmp") ? p.get("fcmp").split(",").filter(Boolean).slice(0, FARM_COMPARE_MAX) : [];
    if (cmpRaw.length && fcmpRaw.length) {
      if (cmpRaw.length >= fcmpRaw.length) compareSave(cmpRaw), farmCompareSave([]);
      else compareSave([]), farmCompareSave(fcmpRaw);
    } else if (cmpRaw.length) {
      compareSave(cmpRaw);
      farmCompareSave([]);
    } else {
      compareSave([]);
      farmCompareSave(fcmpRaw);
    }
  }
}

// Navigation helpers. We rewrite location.hash with pushState so back /
// forward work; the hashchange listener picks up the new state and
// re-renders. `_navigating` is a guard so we don't double-render between
// our own pushState and the hashchange event.
let _navigating = false;
function _pushHash(params) {
  const url = new URL(window.location.href);
  url.hash = params.toString();
  _navigating = true;
  history.pushState(null, "", url);
  _navigating = false;
  syncFromURL();
  restoreUIFromState();
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
}
function goToPlayer(key) {
  const p = new URLSearchParams();
  p.set("player", key);
  _pushHash(p);
}
function goToFarm(org) {
  const p = new URLSearchParams();
  p.set("farm-org", org);
  _pushHash(p);
}
function goHome() {
  // Preserve list-view filters when going home.
  const p = new URLSearchParams();
  if (state.section !== "active") p.set("tab", state.section);
  if (state.orgFilter !== "all")  p.set("org", state.orgFilter);
  if (state.acqFilter !== "all")  p.set("acq", state.acqFilter);
  if (state.levelFilter !== "all") p.set("lvl", state.levelFilter);
  if (state.posFilter !== "all")   p.set("pos", state.posFilter);
  if (state.sort !== "fv")        p.set("sort", state.sort);
  if (state.stockFilter !== "all") p.set("stock", state.stockFilter);
  if (state.search)               p.set("q", state.search);
  if (state.farmSort !== "trajectory") p.set("farm", state.farmSort);
  if (state.formWindow !== "3y")          p.set("formw", state.formWindow);
  if (state.spotlightBucket !== "hot") p.set("bucket", state.spotlightBucket);
  _pushHash(p);
}

// Reflect state back into DOM controls after restoring from a URL.
function restoreUIFromState() {
  document.querySelectorAll(".section-tab").forEach(b =>
    b.classList.toggle("active", b.dataset.section === state.section));
  document.querySelectorAll("[data-filter-stock]").forEach(b =>
    b.classList.toggle("active", b.dataset.filterStock === state.stockFilter));
  document.querySelectorAll("[data-filter-spread]").forEach(b =>
    b.classList.toggle("active", b.dataset.filterSpread === (state.spreadFilter || "all")));
  document.querySelectorAll("[data-filter-health]").forEach(b =>
    b.classList.toggle("active", b.dataset.filterHealth === (state.healthFilter || "all")));
  document.querySelectorAll("[data-density]").forEach(b =>
    b.classList.toggle("active", b.dataset.density === (state.density || "standard")));
  // Body class mirrors state.density so the CSS rules can target it.
  document.body.classList.remove("density-compact", "density-standard", "density-expanded");
  document.body.classList.add(`density-${state.density || "standard"}`);
  document.querySelectorAll("[data-filter-level]").forEach(b =>
    b.classList.toggle("active", b.dataset.filterLevel === state.levelFilter));
  document.querySelectorAll("[data-filter-pos]").forEach(b =>
    b.classList.toggle("active", b.dataset.filterPos === state.posFilter));
  document.querySelectorAll("[data-grad-sort]").forEach(b =>
    b.classList.toggle("active", b.dataset.gradSort === state.gradSort));
  document.querySelectorAll("[data-il-sort]").forEach(b =>
    b.classList.toggle("active", b.dataset.ilSort === state.ilSort));
  document.querySelectorAll("[data-farm-sort]").forEach(b =>
    b.classList.toggle("active", b.dataset.farmSort === state.farmSort));
  document.querySelectorAll("[data-form-window]").forEach(b =>
    b.classList.toggle("active", b.dataset.formWindow === state.formWindow));
  document.querySelectorAll("[data-spotlight-bucket]").forEach(b =>
    b.classList.toggle("active", b.dataset.spotlightBucket === state.spotlightBucket));
  document.querySelectorAll("[data-lb-stat]").forEach(b =>
    b.classList.toggle("active", b.dataset.lbStat === state.lbStat));
  document.querySelectorAll("[data-lb-level]").forEach(b =>
    b.classList.toggle("active", b.dataset.lbLevel === state.lbLevel));
  document.querySelectorAll("[data-lb-pos]").forEach(b =>
    b.classList.toggle("active", b.dataset.lbPos === state.lbPos));
  document.querySelectorAll("[data-lb-season]").forEach(b =>
    b.classList.toggle("active", b.dataset.lbSeason === state.lbSeason));
  const orgSel = document.getElementById("org-filter");
  if (orgSel) orgSel.value = state.orgFilter;
  const lbOrgSel = document.getElementById("lb-org-filter");
  if (lbOrgSel) lbOrgSel.value = state.lbOrg;
  const acqSel = document.getElementById("acq-filter");
  if (acqSel) acqSel.value = state.acqFilter;
  const sortSel = document.getElementById("sort-select");
  if (sortSel) sortSel.value = state.sort;
  const searchIn = document.getElementById("search-input");
  if (searchIn) searchIn.value = state.search || "";
}

function makeEtaCell(p) {
  const eta = p.eta;
  if (!eta || eta.year == null) {
    return `<div class="eta-cell" style="color:var(--text-tertiary);font-size:13px;">—</div>`;
  }
  const thisYear = new Date().getFullYear();
  const diff = eta.year - thisYear;
  const cls = diff <= 0 ? "eta-now"
             : diff === 1 ? "eta-near"
             : diff === 2 ? "eta-close"
             : diff === 3 ? "eta-mid"
             : diff === 4 ? "eta-far"
             : "eta-very-far";
  return `<div class="eta-cell">
    <span class="eta-year ${cls}">${eta.year}</span>
  </div>`;
}

// ─── Headline-stat helper ───────────────────────────────────────────────────
// Returns the row-level "headline" statistic (wRC+ for hitters, xFIP for
// pitchers) as a pre-styled HTML chip. The MLB Stats API only carries
// real wRC+/xFIP for MLB seasons, so for MiLB-only prospects we fall back
// to the level-relative proxy already computed in storage.py (OPS+ vs
// league-by-level / ERA- vs league-by-level). Both flavors are labeled
// inline ("wRC+" / "OPS+") so the reader always knows which they're seeing.
//
// Returns "" when no signal is available at all.
function headlineStatHTML(player, opts = {}) {
  const size = opts.size || "sm";          // sm | md (card detail)
  const sl   = player.statline || {};
  const sm   = player.sabermetrics || {};
  const isPitcher = sl.is_pitcher;
  const chipPad = size === "md" ? "3px 9px" : "2px 7px";
  const chipFz  = size === "md" ? "13px"    : "11px";

  // Choose primary metric in priority: real sabermetric → level-relative proxy.
  let label, value, color, source;
  if (isPitcher) {
    if (sm.xfip != null) {
      label = "xFIP"; value = sm.xfip.toFixed(2);
      // xFIP under 3.50 is excellent; over 4.50 is below avg.
      color = sm.xfip <= 3.50 ? "var(--up)" : sm.xfip >= 4.50 ? "var(--down)" : "var(--text-primary)";
      source = "MLB · FanGraphs xFIP";
    } else if (sl.era_minus_level != null) {
      label = "ERA-";
      value = sl.era_minus_level;
      // ERA- under 100 = better than league avg at that level.
      color = sl.era_minus_level <= 90 ? "var(--up)" : sl.era_minus_level >= 110 ? "var(--down)" : "var(--text-primary)";
      source = `vs ${sl.level || "level"} mean`;
    } else {
      return "";
    }
  } else {
    if (sm.wrc_plus != null) {
      label = "wRC+"; value = Math.round(sm.wrc_plus);
      // 100 = league avg. >=140 elite, <=80 below avg.
      color = sm.wrc_plus >= 110 ? "var(--up)" : sm.wrc_plus <= 90 ? "var(--down)" : "var(--text-primary)";
      source = "MLB · FanGraphs wRC+";
    } else if (sl.ops_plus_level != null) {
      label = "OPS+";
      value = sl.ops_plus_level;
      color = sl.ops_plus_level >= 110 ? "var(--up)" : sl.ops_plus_level <= 90 ? "var(--down)" : "var(--text-primary)";
      source = `vs ${sl.level || "level"} mean`;
    } else {
      return "";
    }
  }
  // Render as a "label : value" chip; the lighter label sits left of the
  // bold value so the eye locks onto the number first.
  return `<span title="${source}" style="display:inline-flex;align-items:baseline;gap:5px;padding:${chipPad};border:1px solid var(--border);background:var(--bg-tertiary);border-radius:3px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:${chipFz};">
    <span style="font-family:var(--font-sans);font-size:10px;color:var(--text-tertiary);letter-spacing:0.04em;font-weight:600;text-transform:uppercase;">${label}</span>
    <span style="color:${color};font-weight:700;">${value}</span>
  </span>`;
}

// Build a tooltip string that places a prospect's slash / rate-stat
// values next to the empirical mean for the same MiLB level. Hooks
// off DATA.level_norms (recomputed every export) — when the user
// hovers a stat cell they see the comparison without needing a full
// scouting page click. Returns "" when sample is too thin to be
// meaningful (sample_n < 30 — the same threshold the norms use
// internally before falling back to static baselines).
function levelNormTooltip(sl) {
  if (!sl || !sl.level) return "";
  const norm = (DATA.level_norms || {})[sl.level];
  if (!norm) return "";
  const perf = norm.perf || {};
  const lines = [`${sl.level} league context`];
  if (!sl.is_pitcher) {
    if (sl.ops != null && perf.avg_ops != null && perf.sample_n_ops >= 30) {
      lines.push(`OPS ${sl.ops} vs ${perf.avg_ops} mean (${perf.sample_n_ops} samples)`);
    }
    if (sl.iso != null && perf.avg_iso != null && perf.sample_n_iso >= 30) {
      lines.push(`ISO ${sl.iso} vs ${perf.avg_iso} mean`);
    }
    if (sl.bb_pct != null && perf.avg_bb_pct != null && perf.sample_n_bb_pct >= 30) {
      lines.push(`BB% ${sl.bb_pct.toFixed(1)} vs ${perf.avg_bb_pct} mean`);
    }
    if (sl.k_pct != null && perf.avg_k_pct != null && perf.sample_n_k_pct >= 30) {
      lines.push(`K% ${sl.k_pct.toFixed(1)} vs ${perf.avg_k_pct} mean`);
    }
  } else {
    if (sl.era != null && perf.avg_era != null && perf.sample_n_era >= 30) {
      lines.push(`ERA ${sl.era} vs ${perf.avg_era} mean (${perf.sample_n_era} samples)`);
    }
    if (sl.whip != null && perf.avg_whip != null && perf.sample_n_whip >= 30) {
      lines.push(`WHIP ${sl.whip} vs ${perf.avg_whip} mean`);
    }
    if (sl.k_pct != null && perf.avg_pitcher_k_pct != null && (perf.sample_n_pitcher_k_pct ?? 0) >= 30) {
      lines.push(`K% ${sl.k_pct.toFixed(1)}% vs ${perf.avg_pitcher_k_pct}% mean`);
    } else if (sl.k_per_9 != null && perf.avg_k_per_9 != null && perf.sample_n_k_per_9 >= 30) {
      lines.push(`K/9 ${sl.k_per_9} vs ${perf.avg_k_per_9} mean`);
    }
    if (sl.bb_pct != null && perf.avg_pitcher_bb_pct != null && (perf.sample_n_pitcher_bb_pct ?? 0) >= 30) {
      lines.push(`BB% ${sl.bb_pct.toFixed(1)}% vs ${perf.avg_pitcher_bb_pct}% mean`);
    } else if (sl.bb_per_9 != null && perf.avg_bb_per_9 != null && perf.sample_n_bb_per_9 >= 30) {
      lines.push(`BB/9 ${sl.bb_per_9} vs ${perf.avg_bb_per_9} mean`);
    }
  }
  if (lines.length === 1) return "";
  return lines.join("\n");
}

function makeMilbCell(p) {
  const sl = p.statline;
  const avl = p.age_vs_level;
  if (!sl) {
    return `<div class="milb-cell milb-cell-wrap"><span style="color: var(--text-tertiary);">no stats yet</span></div>`;
  }
  // MLB players get the special level-mlb pill; MiLB players keep the
  // age-vs-level tier coloring on the level chip itself even though the
  // text age-vs-level chip has been retired in favor of the RPS+ pill.
  const tier = (avl && avl.tier && avl.tier !== "unknown") ? avl.tier : "neutral";
  const levelClass = sl.level === "MLB" ? "level-mlb" : `level-${tier}`;
  const isPitcher = sl.is_pitcher;
  const fmtRate3 = v => v == null ? "—" : (Math.abs(v) < 1 ? (v >= 0 ? "" : "-") + Math.abs(v).toFixed(3).replace(/^0/, "") : v.toFixed(3));
  // Triple-slash / IP+ERA still leads the supporting line; the new
  // "key stat" detail row below it surfaces the rate stats the reader
  // most often wants without forcing them into the detail page.
  const slashLine = isPitcher
    ? [
        sl.era != null ? `${sl.era} ERA` : null,
        sl.whip != null ? `${sl.whip} WHIP` : null,
        sl.ip != null ? `${sl.ip} IP` : null,
      ].filter(Boolean).join(" · ") || "—"
    : `${sl.avg ?? "—"}/${sl.obp ?? "—"}/${sl.slg ?? "—"}`;
  // Key-stat detail line: OPS+/ERA- vs level + K%/BB%, plus HR/9 (P) or
  // ISO (H). Falls back gracefully when a field is missing.
  const detail = isPitcher
    ? [
        sl.era_minus_level != null ? `ERA- ${Math.round(sl.era_minus_level)}` : null,
        sl.k_pct != null ? `K% ${sl.k_pct.toFixed(1)}` : null,
        sl.bb_pct != null ? `BB% ${sl.bb_pct.toFixed(1)}` : null,
        sl.hr_per_9 != null ? `HR/9 ${sl.hr_per_9.toFixed(2)}` : null,
      ].filter(Boolean).join(" · ")
    : [
        sl.ops_plus_level != null ? `OPS+ ${Math.round(sl.ops_plus_level)}` : null,
        sl.hr != null ? `${sl.hr} HR` : null,
        sl.iso != null ? `ISO ${fmtRate3(sl.iso)}` : null,
        sl.bb_pct != null ? `BB% ${sl.bb_pct.toFixed(1)}` : null,
        sl.k_pct != null ? `K% ${sl.k_pct.toFixed(1)}` : null,
      ].filter(Boolean).join(" · ");
  const seasonTag = sl.is_prior_season && sl.season
    ? `<span class="prior-season-tag" title="No ${new Date().getFullYear()} stats yet — showing ${sl.season}">${sl.season}</span>`
    : "";
  const headline = headlineStatHTML(p);
  const normTip = levelNormTooltip(sl);
  const tipAttr = normTip ? ` title="${escapeHtml(normTip)}"` : "";
  // Skip the RPS+ pill at MLB level since the headline already carries
  // the league-relative (wRC+ / xFIP) read.
  const supplementaryPill = sl.level === "MLB" ? "" : rpsPlusPillHTML(p);
  return `<div class="milb-cell milb-cell-wrap"${tipAttr}>
    <span class="level-pill ${levelClass}">${sl.level}</span>${seasonTag}${headline}
    ${supplementaryPill}
    <br/><span style="color: var(--text-primary);">${slashLine}</span>
    <br/><span style="color: var(--text-tertiary);">${detail}</span>
  </div>`;
}

// FanGraphs-flavored WAR aggregate. Returns a small mono block with
// cumulative career WAR, the per-season average, and the underlying
// season count so a reader can see how the average was built. The
// `career_war` payload is populated server-side by
// stats.fetch_career_war_bulk; empty dict when no MLB time on file.
function gradCareerWarHTML(p) {
  const cw = p.career_war || {};
  if (cw.career_war == null || cw.war_seasons_count == null) return "";
  const tot = cw.career_war;
  const per = cw.war_per_yr;
  const n   = cw.war_seasons_count;
  const totColor = tot >= 5 ? "var(--up)" : tot <= 0 ? "var(--down)" : "var(--text-primary)";
  const perColor = per >= 3 ? "var(--up)" : per <= 0 ? "var(--down)" : "var(--text-secondary)";
  const seasons = cw.seasons || {};
  const years = Object.keys(seasons).sort();
  const tip = years.length
    ? `Career WAR · FanGraphs\n` + years.map(y => `${y}: ${seasons[y] >= 0 ? "+" : ""}${seasons[y]}`).join("\n")
    : "Career WAR · FanGraphs";
  return `<div style="margin-top:4px;font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums;" title="${escapeHtml(tip)}">
    <span style="color:${totColor};font-weight:700;">${tot >= 0 ? "+" : ""}${tot.toFixed(1)} WAR</span>
    <span style="color:var(--text-tertiary);"> · </span><span style="color:${perColor};">${per >= 0 ? "+" : ""}${per.toFixed(2)}/yr</span>
    <span style="color:var(--text-tertiary);"> · ${n} season${n === 1 ? "" : "s"}</span>
  </div>`;
}

// Always-on current-season fWAR pill for graduate rows. Uses
// sabermetrics.war (FanGraphs), the same field the "sort by current-
// season WAR" chip keys off, so the badge and the sort agree.
function gradCurrentWarHTML(p) {
  const w = (p.sabermetrics || {}).war;
  if (w == null) return "";
  const yr = new Date().getUTCFullYear();
  const color = w >= 3 ? "var(--up)" : w <= 0 ? "var(--down)" : "var(--text-primary)";
  return `<span class="grad-war-current" style="display:inline-block;font-family:var(--font-mono);font-size:10.5px;font-variant-numeric:tabular-nums;font-weight:700;color:${color};padding:1px 6px;border:1px solid ${color};border-radius:999px;margin-right:6px;" title="${yr} season WAR (FanGraphs)">${yr} fWAR ${w >= 0 ? "+" : ""}${w.toFixed(1)}</span>`;
}

function makeGradMilbCell(p) {
  const sl = p.statline;
  const currentWar = gradCurrentWarHTML(p);
  if (!sl) {
    // No current-season statline (rare for grads), but career WAR may
    // still be available — show it on its own so the cell isn't blank.
    const warHtml = gradCareerWarHTML(p);
    return `<div class="milb-cell">${currentWar}${warHtml || (currentWar ? "" : `<span style="color: var(--text-tertiary);">stats unavailable</span>`)}</div>`;
  }
  const slashLine = sl.is_pitcher
    ? `${sl.era ?? "—"} ERA · ${sl.whip != null ? sl.whip + " WHIP · " : ""}${sl.ip ?? "—"} IP`
    : `${sl.avg ?? "—"}/${sl.obp ?? "—"}/${sl.slg ?? "—"}`;
  const detail = sl.is_pitcher
    ? (sl.k_pct != null || sl.bb_pct != null
        ? `K% ${sl.k_pct != null ? sl.k_pct.toFixed(1) + "%" : "—"} · BB% ${sl.bb_pct != null ? sl.bb_pct.toFixed(1) + "%" : "—"}`
        : `K/9 ${sl.k_per_9 ?? "—"} · BB/9 ${sl.bb_per_9 ?? "—"}`)
    : `${sl.hr ?? 0} HR · ${sl.sb ?? 0} SB`;
  const seasonTag = sl.is_prior_season && sl.season
    ? `<span class="prior-season-tag" title="No ${new Date().getFullYear()} stats — showing ${sl.season}">${sl.season}</span> `
    : "";
  const headline = headlineStatHTML(p);
  return `<div class="milb-cell">
    ${currentWar}${seasonTag}${headline ? headline + "<br/>" : ""}<strong style="font-weight: 600; color: var(--text-primary);">${slashLine}</strong>
    <br/><span style="color: var(--text-tertiary);">${detail}</span>
    ${gradCareerWarHTML(p)}
  </div>`;
}

// =============================================================================
// RENDER
// =============================================================================
// `view` is null for the normal list pages; set to {type:"player", key}
// or {type:"farm", org} when routed to a detail page. Detail pages take
// over the main content area and hide the section tabs / filter bar.
const state = {
  section: "active",
  stockFilter: "all",
  orgFilter: "all",
  acqFilter: "all",
  // Class filter — restrict to prospects acquired in a specific year
  // (draft year for drafted players; IFA signing year for IFAs). "all"
  // means no class restriction. Drives the "Class of YYYY" dropdown
  // on the Active tab.
  classFilter: "all",
  // Level filter — one of "all", "MLB", "AAA", "AA", "A+", "A", "CPX", "DSL".
  // Filters the main prospect list AND the farm-detail tracked-prospects
  // roster down to players currently at that level.
  levelFilter: "all",
  // Position bucket — "all" | "C" | "1B" | "INF" | "OF" | "P". Buckets are
  // intentionally coarse (INF lumps 2B/3B/SS/multi-pos so a "middle
  // infield" lookup doesn't need three checks); the per-prospect chip
  // still shows the precise published position.
  posFilter: "all",
  sort: "fv",
  // Default sort is the overall Farm rank — the closest analog to a
  // Top-30-organizations leaderboard. The Trajectory (DvM+) chip is
  // still a one-click option; its window comes from formWindow below.
  farmSort: "farm_rank",
  // Per-farm-detail roster sort: FV (default) / avg_rank / age / eta /
  // tools_plus / surplus. Persisted in the URL so a sort choice
  // survives reloads + shared links.
  rosterSort: "fv",
  // Glossary state — active category filter + search query + per-load
  // term-to-scroll-to slug. Term-to-scroll-to clears after being
  // consumed once so a subsequent re-render doesn't re-scroll.
  glossaryCat: "all",
  glossarySearch: "",
  glossaryTerm: null,
  // View mode for the farm system list — "table" (default) or "cards".
  // Cards mode flips the row layout into a grid of vertical stacks
  // (auto-fit columns), better for narrow viewports + visual scan.
  farmViewMode: "table",
  // Active form-bar window. Controls the farm-list sparkline (which
  // plots growth above the league mean over the same window) and the
  // value used when sorting by "Trajectory".
  formWindow: "3y",
  spotlightBucket: "hot",
  // Farm-detail "Transaction history" filters. Persisted on the URL so a
  // shared link reopens the same filtered view. Default is "all".
  farmTxKind: "all",
  farmTxDir:  "all",
  // Graduates sort dimension. "date" (default) = newest first;
  // "war" = highest current-season WAR; "fv_close" = highest final FV.
  // Career-aggregated WAR isn't on the MLB Stats API (the endpoint
  // returns one split per season), so the WAR sort uses the
  // most-recent-season number — labelled accordingly in the chip.
  // Default sort is WAG (vs_fv_proj) — the headline metric for
  // graduates. Sort by graduation date is still one click away via
  // the "Date" chip on the graduates page.
  gradSort: "vs_fv_proj",
  // Injured-list sort. "days_asc" (default) sorts by elapsed IL days
  // ascending so the players closest to returning surface first.
  // "days" sorts descending (longest-out first); "fv" puts high-FV
  // injured prospects on top; "since" sorts by most-recent placement.
  ilSort: "days_asc",
  // Active list "Healthy only" toggle — hides players currently on
  // an IL stint when set to "healthy". They still appear in their
  // own Injured List tab.
  healthFilter: "all",
  // FV-agreement lens — "wide" filters down to prospects whose latest
  // point shows ≥10 grade-points of disagreement between explicit-FV
  // sources. Default "all" passes everyone through.
  spreadFilter: "all",
  // Row density — "compact" / "standard" / "expanded". Picked up from
  // URL > localStorage > default on boot. Drives a body-level class
  // and (for Expanded) the per-row second meta line. Defaults to
  // "expanded" so a fresh visitor lands on the densest row layout
  // (Statcast micro-tile + flag detail + FV history caption visible);
  // any user with a saved preference in localStorage keeps it.
  density: (typeof localStorage !== "undefined"
            && localStorage.getItem("prospect-tracker.density")) || "expanded",
  // Leaderboards tab — stat × season × level × position-group × org
  // selection. Pulls from career_stats (year-by-year per-level rows) so
  // historical seasons work. The stat key matches a field on the
  // career_stats row (ops, era, k_per_9, ...).
  lbStat:   "ops",
  lbLevel:  "all",
  lbPos:    "all",
  lbOrg:    "all",
  lbSeason: String(new Date().getUTCFullYear()),
  view: null
};

// Map a player's `position` string ("RHP", "SS/2B", "OF", "1B", "C") to
// the finest filter bucket we can resolve: C / 1B / 2B / SS / 3B / INF
// (ambiguous infield) / CF / LF / RF / OF (ambiguous outfield) / P.
// Returns null when the position is missing or doesn't classify.
function positionBucket(pos) {
  if (!pos) return null;
  const head = String(pos).split("/")[0].toUpperCase();
  if (head === "C")  return "C";
  if (head === "1B") return "1B";
  if (head === "2B") return "2B";
  if (head === "3B") return "3B";
  if (head === "SS" || head === "MI") return "SS";
  if (head === "INF" || head === "IF" || head === "UTIL") return "INF";
  if (head === "CF") return "CF";
  if (head === "LF") return "LF";
  if (head === "RF") return "RF";
  if (head === "OF") return "OF";
  if (/^(RHP|LHP|SP|RP|MIRP|SIRP|P)$/.test(head)) return "P";
  return null;
}

// Coarse → fine match: "INF" still wants to include 2B/SS/3B players,
// "OF" still wants CF/LF/RF. Single-precise filters (e.g. "SS") match
// only that bucket. Filter callers (active list, leaderboards, farm
// detail) all go through this helper to preserve old behavior.
function positionMatches(playerBucket, filterVal) {
  if (!filterVal || filterVal === "all") return true;
  if (!playerBucket) return false;
  if (playerBucket === filterVal) return true;
  if (filterVal === "INF" && ["2B", "SS", "3B", "INF"].includes(playerBucket)) return true;
  if (filterVal === "OF"  && ["CF", "LF", "RF", "OF"].includes(playerBucket)) return true;
  return false;
}
let DATA = null;

function getAllOrgs() {
  const orgs = new Set();
  for (const p of DATA.players) if (p.org) orgs.add(p.org);
  for (const p of DATA.graduates) if (p.org) orgs.add(p.org);
  for (const p of (DATA.inactive || [])) if (p.org) orgs.add(p.org);
  return [...orgs].sort();
}

function getFilteredActives() {
  let pool = DATA.players.slice();
  if (state.search) {
    const q = state.search.toLowerCase();
    pool = pool.filter(p => p.player_name.toLowerCase().includes(q));
  }
  if (state.stockFilter === "up") {
    pool = pool.filter(p => p.stock && (p.stock.direction === "up" || p.stock.direction === "up_strong"));
  } else if (state.stockFilter === "down") {
    pool = pool.filter(p => p.stock && (p.stock.direction === "down" || p.stock.direction === "down_strong"));
  }
  if (state.healthFilter === "healthy") {
    pool = pool.filter(p => !(p.il_status && p.il_status.is_on_il));
  }
  if (state.orgFilter !== "all") {
    pool = pool.filter(p => p.org === state.orgFilter);
  }
  if (state.acqFilter !== "all") {
    pool = pool.filter(p =>
      ((p.current_acquisition || {}).method || "unknown") === state.acqFilter);
  }
  // Class filter — draft year for drafted prospects; IFA signing year
  // (or `acquisition.year` for IFAs) otherwise. "all" passes through.
  // Uses string compare since the year is rendered into the dropdown as
  // a string.
  if (state.classFilter && state.classFilter !== "all") {
    const targetYear = String(state.classFilter);
    pool = pool.filter(p => {
      const a = p.acquisition || {};
      const yr = a.year != null ? String(a.year) : null;
      return yr === targetYear;
    });
  }
  // Level filter — uses the current-season statline.level. Prospects
  // without a usable statline (recent IFAs, late-season call-ups before
  // their first row lands) are excluded from any explicit level filter
  // since we can't place them on the ladder.
  if (state.levelFilter !== "all") {
    pool = pool.filter(p => (p.statline || {}).level === state.levelFilter);
  }
  // Position filter — fine buckets (SS / 2B / 3B / CF / LF / RF) match
  // exactly; coarse INF / OF still catch their sub-buckets so the legacy
  // chip behavior is preserved.
  if (state.posFilter !== "all") {
    pool = pool.filter(p => positionMatches(positionBucket(p.position), state.posFilter));
  }
  // FV agreement lens — only show prospects with ≥10-point disagreement
  // between explicit-FV sources at the latest point. Useful for finding
  // contested/breakout candidates without scanning the per-source block.
  if (state.spreadFilter === "wide") {
    pool = pool.filter(p => {
      const last = (p.points && p.points.length) ? p.points[p.points.length - 1] : null;
      return last && last.fv_spread != null && last.fv_spread >= 10;
    });
  }
  if (state.sort === "age_asc") {
    pool.sort((a, b) => (a.age ?? 99) - (b.age ?? 99));
  } else if (state.sort === "age_vs_level") {
    const score = p => p.age_vs_level && p.age_vs_level.diff != null ? p.age_vs_level.diff : 99;
    pool.sort((a, b) => score(a) - score(b));
  } else if (state.sort === "eta") {
    pool.sort((a, b) => {
      const ay = a.eta && a.eta.year != null ? a.eta.year : 9999;
      const by = b.eta && b.eta.year != null ? b.eta.year : 9999;
      return ay - by;
    });
  } else if (state.sort === "stock_movers") {
    // Biggest absolute FV movement across the player's recorded history.
    // |fv_close - fv_open| picks up both risers and fallers without
    // requiring the reader to pre-select a direction (the Stock chip
    // narrows by direction if they want).
    pool.sort((a, b) => {
      const da = (a.fv_close != null && a.fv_open != null) ? Math.abs(a.fv_close - a.fv_open) : -1;
      const db = (b.fv_close != null && b.fv_open != null) ? Math.abs(b.fv_close - b.fv_open) : -1;
      return db - da;
    });
  } else if (state.sort === "t_plus") {
    // ToolGrade+ desc, nulls (no tool data) sink to the bottom. Tie-
    // break on consensus FV so a 60 FV with T+ 110 beats a 50 FV with
    // T+ 110.
    pool.sort((a, b) => {
      const av = (a.tools || {}).composite_overall_plus;
      const bv = (b.tools || {}).composite_overall_plus;
      if (av == null && bv == null) return (b.fv_close ?? -1) - (a.fv_close ?? -1);
      if (av == null) return 1;
      if (bv == null) return -1;
      return bv - av || (b.fv_close ?? -1) - (a.fv_close ?? -1);
    });
  } else if (state.sort === "source_confidence") {
    // Most-corroborated FVs first — multi-source consensus floats above
    // single-source pulls. Tie-break on consensus FV so the order is
    // stable inside an n-tier.
    pool.sort((a, b) => {
      const lastA = (a.points && a.points.length) ? a.points[a.points.length - 1] : null;
      const lastB = (b.points && b.points.length) ? b.points[b.points.length - 1] : null;
      const an = (lastA && lastA.avg_fv_n) || 0;
      const bn = (lastB && lastB.avg_fv_n) || 0;
      return bn - an || (b.fv_close ?? -1) - (a.fv_close ?? -1);
    });
  } else if (state.sort === "avg_rank") {
    // Average rank across sources — useful tie-breaker when two
    // prospects sit at the same FV. Pulls from the latest point's
    // avg_rank field (already computed across publishing sources).
    // Players without a rank sink to the bottom.
    pool.sort((a, b) => {
      const lastA = (a.points && a.points.length) ? a.points[a.points.length - 1] : null;
      const lastB = (b.points && b.points.length) ? b.points[b.points.length - 1] : null;
      const ar = (lastA && lastA.avg_rank != null) ? lastA.avg_rank : 9999;
      const br = (lastB && lastB.avg_rank != null) ? lastB.avg_rank : 9999;
      return ar - br;
    });
  }
  return pool;
}

function getFilteredGrads() {
  let pool = DATA.graduates.slice();
  if (state.search) {
    const q = state.search.toLowerCase();
    pool = pool.filter(p => p.player_name.toLowerCase().includes(q));
  }
  if (state.orgFilter !== "all") {
    pool = pool.filter(p => p.org === state.orgFilter);
  }
  // Already sorted by graduation_date desc from the back-end; preserve that.
  return pool;
}

// "Prospect news this week" feed — horizontal strip above list views
// surfacing the last 7 days of NEWS events: trades, promotions /
// demotions, IL adds, graduations, and waivers/releases/DFA/Rule 5.
// Stock-direction chips were intentionally dropped — they fire on
// any rolling FV move and crowded out actual transactional news.
//
// `rootId` lets multiple tabs host their own feed; `kindFilter` narrows
// the event set per tab (Injured tab shows IL-only, Traded tab shows
// trade-only, Graduates tab shows graduation-only). Pass null to keep
// the full feed (Active tab).
function renderWhatsNew(rootId = "whats-new", kindFilter = null) {
  const root = document.getElementById(rootId);
  if (!root) return;
  const now = Date.now();
  const cutoff = now - 7 * 86400000;
  const events = [];
  const allPlayers = [
    ...(DATA.players || []),
    ...(DATA.graduates || []),
  ];
  for (const p of allPlayers) {
    // Trades.
    for (const t of (p.trades || [])) {
      const ts = new Date(t.trade_date + "T00:00:00").getTime();
      if (!isNaN(ts) && ts >= cutoff) {
        events.push({ ts, kind: "trade", p, label: `traded ${escapeHtml(t.from_org || "?")} → ${escapeHtml(t.to_org || "?")}` });
      }
    }
    // Level changes (promotions / demotions) + roster moves. Stored on
    // p.transactions with kind set by storage.derive_level_changes.
    for (const tx of (p.transactions || [])) {
      const ts = new Date((tx.date || "") + "T00:00:00").getTime();
      if (isNaN(ts) || ts < cutoff) continue;
      if (tx.kind === "promotion" || tx.kind === "demotion") {
        const arrow = tx.kind === "promotion" ? "↑ promoted" : "↓ demoted";
        const tail = tx.to_level ? ` to ${escapeHtml(tx.to_level)}` : "";
        events.push({ ts, kind: tx.kind, p, label: `${arrow}${tail}` });
      } else if (["waivers", "release", "dfa", "rule_5"].includes(tx.kind)) {
        events.push({ ts, kind: tx.kind, p, label: escapeHtml(tx.kind.toUpperCase().replace("_", " ")) });
      }
    }
    // IL placement (only the current open stint — no per-stint date history).
    const il = p.il_status;
    if (il && il.is_on_il && il.since) {
      const ts = new Date(il.since + "T00:00:00").getTime();
      if (!isNaN(ts) && ts >= cutoff) {
        events.push({ ts, kind: "il", p, label: `→ ${escapeHtml(il.type || "IL")} (${escapeHtml(il.description || "no detail")})` });
      }
    }
    // Graduation events.
    if (p.graduation_date) {
      const ts = new Date(p.graduation_date + "T00:00:00").getTime();
      if (!isNaN(ts) && ts >= cutoff) {
        events.push({ ts, kind: "graduated", p, label: "graduated to MLB" });
      }
    }
  }
  if (!events.length) {
    root.innerHTML = "";
    return;
  }
  // Apply kind filter when caller narrows to a specific tab's interest.
  const filteredEvents = kindFilter ? events.filter(e => kindFilter(e.kind)) : events;
  if (!filteredEvents.length) {
    root.innerHTML = "";
    return;
  }
  // Newest first.
  filteredEvents.sort((a, b) => b.ts - a.ts);
  const colorMap = {
    trade: "var(--accent-traded)",
    promotion: "var(--up)",
    demotion: "var(--down)",
    il: "var(--accent-il)",
    graduated: "var(--accent-graduated)",
    waivers: "var(--text-secondary)",
    release: "var(--down)",
    dfa: "var(--down)",
    rule_5: "var(--neon-cyan)",
  };
  const chips = filteredEvents.slice(0, 40).map(ev => {
    const c = colorMap[ev.kind] || "var(--text-secondary)";
    const dateStr = new Date(ev.ts).toISOString().split("T")[0];
    // FV badge inline so a glance carries quality context too.
    const fvLbl = ev.p.fv_close != null ? Math.round(ev.p.fv_close) : null;
    const fvChip = fvLbl != null
      ? `<span class="fv-badge ${fvClass(String(fvLbl))} size-xs" style="margin-right:5px;">${fvLbl}</span>`
      : "";
    return `<button class="chip" data-key="${escapeHtml(ev.p.player_key)}" type="button"
                    style="border-color:${c};color:${c};white-space:nowrap;">
      ${fvChip}<span style="font-weight:700;">${escapeHtml(ev.p.player_name)}</span>
      <span style="color:var(--text-tertiary);margin-left:5px;">${ev.label}</span>
      <span style="color:var(--text-tertiary);margin-left:5px;font-size:9px;">${dateStr}</span>
    </button>`;
  }).join("");
  root.innerHTML = `<div style="margin-bottom:12px;">
    <div style="font-family:var(--font-sans);font-size:11px;color:var(--text-tertiary);letter-spacing:0.08em;text-transform:uppercase;font-weight:600;margin-bottom:6px;">Prospect news this week <span class="detail-title-sub" style="text-transform:none;letter-spacing:0.02em;">last 7 days · ${filteredEvents.length} event${filteredEvents.length === 1 ? "" : "s"}</span></div>
    <div style="display:flex;gap:6px;overflow-x:auto;padding:4px 0;">${chips}</div>
  </div>`;
}

// Active-list right context rail — only visible on ≥1500px viewports
// via CSS. Builds three small cards: top movers (FV stock surging /
// dropping), FV distribution histogram across the active pool, and
// recent graduations. All click-throughs route to existing surfaces.
function renderActiveContextRail() {
  const rail = document.getElementById("active-context-rail");
  if (!rail) return;
  const players = DATA.players || [];

  // Top movers: largest |delta| from stock signal. Cap at 10.
  const movers = players
    .filter(p => p.stock && p.stock.delta != null && Math.abs(p.stock.delta) >= 1.5)
    .slice()
    .sort((a, b) => Math.abs(b.stock.delta) - Math.abs(a.stock.delta))
    .slice(0, 6);
  const moverRows = movers.map(p => {
    const d = p.stock.delta;
    const cls = d > 0 ? "stock-up" : "stock-down";
    const arrow = d > 0 ? "▲" : "▼";
    return `<div class="ctx-row" data-key="${escapeHtml(p.player_key)}">
      <span style="color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;">${escapeHtml(p.player_name)}</span>
      <span class="${cls}" style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:11px;">${arrow} ${d > 0 ? "+" : ""}${d.toFixed(1)}</span>
    </div>`;
  }).join("");
  const moversCard = movers.length
    ? `<div class="ctx-card">
        <div class="ctx-title">Top movers · this update</div>
        ${moverRows}
      </div>`
    : "";

  // FV distribution — histogram across the active pool, reuse the
  // tier-bar palette via fvClass-derived fg colors. Bin by 5-FV step.
  const tiers = [80, 75, 70, 65, 60, 55, 50, 45, 40, 35, 30, 25, 20];
  const counts = {};
  for (const t of tiers) counts[t] = 0;
  for (const p of players) {
    if (p.fv_close == null) continue;
    // round down to nearest 5
    const t = Math.max(20, Math.min(80, Math.floor(p.fv_close / 5) * 5));
    counts[t] = (counts[t] || 0) + 1;
  }
  const maxCount = Math.max(1, ...Object.values(counts));
  const distRows = tiers.map(t => {
    const c = counts[t] || 0;
    const pct = (c / maxCount) * 100;
    return `<div style="display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11px;">
      <span style="width:24px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-tertiary);text-align:right;">${t}</span>
      <div style="flex:1;height:8px;background:var(--bg-tertiary);border-radius:1px;overflow:hidden;">
        <div style="height:100%;width:${pct.toFixed(1)}%;background:var(--fv-${t}-bd);"></div>
      </div>
      <span style="width:24px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-secondary);text-align:right;">${c}</span>
    </div>`;
  }).join("");
  const distCard = `<div class="ctx-card">
    <div class="ctx-title">FV distribution · ${players.filter(p => p.fv_close != null).length} graded</div>
    ${distRows}
  </div>`;

  // Recent graduations — last 3, click → Graduates tab.
  const grads = (DATA.graduates || [])
    .filter(g => g.graduation_date)
    .slice()
    .sort((a, b) => (b.graduation_date || "").localeCompare(a.graduation_date || ""))
    .slice(0, 3);
  const gradRows = grads.map(g => {
    const fv = g.fv_close != null ? Math.round(g.fv_close) : null;
    return `<div class="ctx-row" data-key="${escapeHtml(g.player_key)}">
      <span style="color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;">${escapeHtml(g.player_name)}</span>
      <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);font-variant-numeric:tabular-nums;">${g.graduation_date}</span>
      ${fv != null ? `<span class="fv-badge ${fvClass(String(fv))} size-sm">${fv}</span>` : ""}
    </div>`;
  }).join("");
  const gradsCard = grads.length
    ? `<div class="ctx-card">
        <div class="ctx-title">Recent graduations</div>
        ${gradRows}
      </div>`
    : "";

  rail.innerHTML = moversCard + distCard + gradsCard;
}

    <span style="text-align:center;">Rank</span>
    <span class="desktop-only" style="text-align:center;">FV history</span>
    <span class="desktop-only" style="text-align:center;" title="OHLC candle — hover for the FV open / high / low / close values">Candle</span>

          <button class="compare-add-btn is-compact${compareHas(p.player_key) ? " is-in" : ""}" data-compare-key="${escapeHtml(p.player_key)}" type="button" title="${compareHas(p.player_key) ? "Remove from compare" : "Add to compare"}" aria-label="Toggle compare">${compareHas(p.player_key) ? "✓" : "+"}</button>
          <button class="row-expand-btn" type="button" aria-label="Expand row" title="Show FV chart, MiLB stats, and ETA inline">▾</button>
        </div>
        <div style="text-align:center;"><span class="fv-badge ${fvClass(latest.consensus_fv_label)}${fvBadgeWideClass(p)}${fvBadgeSingleClass(p)}" title="${escapeHtml(fvBadgeTooltip(p))}">${latest.consensus_fv_label}${fvBadgeWideMarkHTML(p)}${fvBadgeSingleMarkHTML(p)}</span>${fvTrendHTML(p)}</div>
        <div class="rank-cell">${latest.avg_rank != null ? latest.avg_rank.toFixed(1) : "—"}</div>

function renderSpotlights() {
  const buckets = DATA.spotlights || {};
  const bucket = buckets[state.spotlightBucket] ? state.spotlightBucket : "hot";
  state.spotlightBucket = bucket;
  let rowsData = buckets[bucket] || [];
  // Spotlights honor the same search box the other sections do — the
  // search bar lives at the top of the template and is shared across
  // every list view, so it should narrow the spotlights too.
  if (state.search) {
    const q = state.search.toLowerCase();
    rowsData = rowsData.filter(s =>
      (s.player_name || "").toLowerCase().includes(q));
  }
  document.querySelectorAll("[data-spotlight-bucket]").forEach(b =>
    b.classList.toggle("active", b.dataset.spotlightBucket === bucket));

  const header = `<div class="spotlight-header">
    <span style="text-align:center;">#</span>
    <span>Player · pos · org · age</span>
    <span style="text-align:center;">FV</span>
    <span>Level · line</span>
    <span>Strength</span>
    <span>Drivers</span>
  </div>`;

  const rows = rowsData.map((s, i) => `
    <div class="spotlight-row" data-key="${escapeHtml(s.player_key)}" style="${orgStripe(s.org)}">
      <div class="rank-num">${i + 1}</div>
      <div>
        <div class="player-name">${escapeHtml(s.player_name)}</div>
        ${playerMetaHTML(s)}
      </div>
      <div style="text-align:center;"><span class="fv-badge ${fvClass(s.fv || "40")}">${escapeHtml(s.fv ?? "—")}</span></div>
      <div class="milb-cell"><span class="level-pill level-neutral">${escapeHtml(s.level ?? "—")}</span>${escapeHtml(s.line ?? "—")}</div>
      <div class="stock-cell stock-up" style="text-align:left;">${Number(s.score || 0).toFixed(1)}</div>
      <div class="driver-list">${(s.drivers || []).map(d => `<span class="driver-tag">${escapeHtml(d)}</span>`).join("")}</div>

    ? header + rows

        ? `<div class="state-message">No ${escapeHtml(bucket)} spotlights match "${escapeHtml(state.search)}".</div>`
        : `<div class="state-message">No ${escapeHtml(bucket)} spotlights available from the current data.</div>`);
}

// Resolve a prospect's most-recent inbound acquisition into their
// CURRENT org. Returns null if we can't identify one. Supported method
// kinds, in priority order (most recent wins):
//   trade           — p.trades[].to_org === p.org
//   waiver_claim    — p.transactions[] kind=waiver_claim, to_org === p.org
//   rule_5          — p.transactions[] kind=rule_5* into current org
//   purchase        — p.transactions[] kind=contract_purchase
//   free_agent      — p.transactions[] kind=signed_free_agent (MiLB FA, mostly)
//   international_fa — p.acquisition (signing_date) when method=international_fa
//   draft           — p.acquisition (year + pick) when method=draft
function latestAcquisition(p) {
  const events = [];
  // Trades into current org.
  for (const t of (p.trades || [])) {
    if (t.to_org === p.org && t.trade_date) {
      events.push({
        date: t.trade_date,
        method: "trade",
        from_org: t.from_org,
        to_org: t.to_org,
        description: t.description || "",
        sort_key: t.trade_date,
      });
    }
  }
  // Non-trade transactions into current org.
  for (const tx of (p.transactions || [])) {
    const k = (tx.kind || "").toLowerCase();
    let method = null;
    // Method keys match the existing `#acq-filter` <select> values so
    // the shared Active-list / Recently-Acquired filter applies the
    // same semantics on both pages. `signed_free_agent` is excluded —
    // most active prospects have annual MiLB contract renewals tagged
    // that way, which would drown out genuine acquisition events.
    if (k === "waiver_claim")        method = "waiver";
    else if (k.startsWith("rule_5")) method = "rule_5";
    else if (k === "contract_purchase") method = "contract_purchase";
    if (!method) continue;
    if (tx.to_org && tx.to_org !== p.org) continue;  // not into current org
    if (!tx.date) continue;
    events.push({
      date: tx.date,
      method,
      from_org: tx.from_org || null,
      to_org: tx.to_org || p.org,
      description: tx.description || "",
      sort_key: tx.date,
    });
  }
  // Original acquisition (draft / IFA) — only if they're still with
  // the org that drafted / signed them (no events more recent).
  const a = p.acquisition;
  if (a && a.method) {
    const sameOrg = !a.team_abbr || a.team_abbr === p.org || !p.org;
    // Acquisitions don't always have a precise date; use signing_date,
    // then year-only as a fallback so they don't sort before trades.
    const date = a.signing_date || (a.year ? `${a.year}-01-01` : null);
    if (sameOrg && date) {
      const method = a.method === "international_fa" ? "international_fa"
                   : a.method === "draft" ? "draft"
                   : a.method;
      events.push({
        date,
        method,
        from_org: null,
        to_org: p.org,
        description: a.school
          ? `Drafted from ${a.school}`
          : (a.team_name ? `Signed by ${a.team_name}` : ""),
        bonus_usd: a.bonus_usd,
        pick_overall: a.pick_overall,
        round_label: a.round_label,
        year: a.year,
        sort_key: date,
      });
    }
  }
  if (!events.length) return null;
  events.sort((a, b) => b.sort_key.localeCompare(a.sort_key));
  return events[0];
}

// Pretty label + chip color for each acquisition method. Method keys
// match the global `#acq-filter` <select> values.
const ACQ_LABELS = {
