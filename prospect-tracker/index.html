  waiver:            { label: "Waiver claim",      color: "var(--neon-amber)" },
  rule_5:            { label: "Rule 5",            color: "var(--neon-cyan)" },
  contract_purchase: { label: "Contract purchase", color: "var(--text-secondary)" },
  international_fa:  { label: "International FA",  color: "var(--neon-violet)" },
  draft:             { label: "MLB Draft",         color: "var(--up)" },
};

function getFilteredAcquired() {
  // Active prospects only (graduates have their own section). For each
  // active player we resolve their MOST RECENT inbound acquisition; the
  // pool is players where that resolves to something.
  let pool = [];
  for (const p of (DATA.players || [])) {
    const acq = latestAcquisition(p);
    if (!acq) continue;
    pool.push({ p, acq });
  }
  if (state.search) {
    const q = state.search.toLowerCase();
    pool = pool.filter(({ p }) => p.player_name.toLowerCase().includes(q));
  }
  if (state.orgFilter !== "all") {
    pool = pool.filter(({ p }) => p.org === state.orgFilter);
  }
  if (state.acqFilter !== "all") {
    pool = pool.filter(({ acq }) => acq.method === state.acqFilter);
  }
  // Sort by acquisition date desc; tiebreak by FV desc.
  pool.sort((a, b) => {
    if (a.acq.date !== b.acq.date) return b.acq.date.localeCompare(a.acq.date);
    const fa = a.p.points.length ? a.p.points[a.p.points.length - 1].consensus_fv_raw : 0;
    const fb = b.p.points.length ? b.p.points[b.p.points.length - 1].consensus_fv_raw : 0;
    return fb - fa;
  });
  return pool;
}

// Back-compat alias for callers that still reference the old name.
const getFilteredTraded = getFilteredAcquired;

// Cross-org leaderboards — top N prospects by a chosen stat for the
// chosen season. Pulls from career_stats (year-by-year per-level rows)
// rather than the latest-statline blob, so historical seasons (2021+)
// work and the AB/IP gates use the actual season's volume.
//
// Stat config: each key on `LB_STATS` defines how to render the value,
// the supporting line, and how to sort (high vs low is better). The
// minAB/minIP gates are intentionally generous so leaderboards stay
// populated even in shallow MiLB seasons or early in the current year.
//
// Statline values arrive as a mix of floats (iso, era, whip, k_per_9,
// bb_per_9, bb_pct, k_pct) and strings (ops, avg, obp, slg — kept as
// ".788" so the leading-zero formatting is preserved). Formatters wrap
// values in `Number(v)` defensively so either type works.
// Shared "kitchen-sink" support builders. The Context cell on each
// leaderboard now shows two lines packing every rate + counting stat we
// have on file for the season — separators are mid-dots; missing values
// collapse to em-dashes so the line shape stays stable across rows.
const _lbHitterSupport = r => {
  const slash = `${r.avg ?? "—"}/${r.obp ?? "—"}/${r.slg ?? "—"}`;
  const ops = r.ops ?? "—";
  const iso = r.iso != null ? Number(r.iso).toFixed(3).replace(/^0/, "") : "—";
  const bb = r.bb_pct != null ? Number(r.bb_pct).toFixed(1) + "%" : "—";
  const k  = r.k_pct  != null ? Number(r.k_pct ).toFixed(1) + "%" : "—";
  const games = r.games != null ? `${r.games}G` : "";
  const ab = r.ab != null ? `${r.ab} AB` : "";
  const top    = `${slash} · OPS ${ops} · ISO ${iso}`;
  const bottom = [
    r.hr != null ? `${r.hr} HR` : null,
    r.sb != null ? `${r.sb} SB` : null,
    r.rbi != null ? `${r.rbi} RBI` : null,
    r.bb_pct != null ? `BB ${bb}` : null,
    r.k_pct != null ? `K ${k}` : null,
    games || null,
    ab || null,
  ].filter(Boolean).join(" · ");
  return `<div>${top}</div><div style="color:var(--text-tertiary);margin-top:2px;">${bottom}</div>`;
};
const _lbPitcherSupport = r => {
  const wins = r.wins, losses = r.losses;
  const top = [
    r.ip != null ? `${r.ip} IP` : null,
    r.era != null ? `${r.era} ERA` : null,
    r.whip != null ? `${r.whip} WHIP` : null,
  ].filter(Boolean).join(" · ") || "—";
  const bottom = [
    r.k_per_9 != null ? `K/9 ${r.k_per_9}` : null,
    r.bb_per_9 != null ? `BB/9 ${r.bb_per_9}` : null,
    (wins != null || losses != null) ? `${wins ?? 0}-${losses ?? 0}` : null,
    r.games != null ? `${r.games}G` : null,
  ].filter(Boolean).join(" · ");
  return `<div>${top}</div><div style="color:var(--text-tertiary);margin-top:2px;">${bottom}</div>`;
};

// Cell heat color — maps a numeric value into a red-violet-cyan ramp
// anchored at the LEAGUE MEAN of the full qualified pool (not just the
// displayed top-N). Values are z-scored against the pool's mean/stdev
// so the spectrum spreads cleanly across the leaderboard: the top of
// the board reads as several stdevs above mean, the bottom as the
// quasi-league-average tail.
//
// `hi=true` means higher values are better; `hi=false` flips the ramp
// so low ERA / WHIP / BB% reads green too. Returns an inline-style
// `{bg, fg}` pair for use on a stat cell.
function cellHeatColor(value, values, hi = true) {
  if (value == null || isNaN(value)) return { bg: "transparent", fg: "var(--text-tertiary)" };
  const valid = values.filter(v => v != null && !isNaN(v)).map(Number);
  if (valid.length < 3) return { bg: "transparent", fg: "var(--text-primary)" };
  const mean = valid.reduce((s, x) => s + x, 0) / valid.length;
  const variance = valid.reduce((s, x) => s + (x - mean) ** 2, 0) / valid.length;
  const stdev = Math.sqrt(variance) || 1;
  let z = (Number(value) - mean) / stdev;
  if (!hi) z = -z;
  // Clamp to ±3σ. Above mean (z > 0) ramps red → violet → cyan;
  // below mean (z < 0) stays muted. Most leaderboard entries land
  // between z=0.5 and z=3, so the gradient gets real distribution.
  z = Math.max(-1.5, Math.min(3.5, z));
  let bg;
  if (z <= 0) {
    // At/below mean — soft slate wash, signals "table stakes."
    bg = "rgba(120, 130, 145, 0.06)";
  } else {
    // Three-band gradient above mean:
    //   0.0-1.0σ  → violet wash (above league mean)
    //   1.0-2.0σ  → blue-cyan (well above)
    //   2.0-3.5σ  → strong cyan + amber tip at the very top (elite)
    if (z < 1.0) {
      const a = 0.10 + 0.10 * z;                  // 0.10 → 0.20
      bg = `rgba(180, 85, 255, ${a.toFixed(2)})`;
    } else if (z < 2.0) {
      const t = z - 1.0;                          // 0..1
      const a = 0.20 + 0.12 * t;                  // 0.20 → 0.32
      // Lerp violet → cyan along t.
      const r = Math.round(180 + (78 - 180) * t);
      const g = Math.round(85 + (224 - 85) * t);
      const b = Math.round(255 + (255 - 255) * t);
      bg = `rgba(${r}, ${g}, ${b}, ${a.toFixed(2)})`;
    } else {
      const t = Math.min(1, (z - 2.0) / 1.5);     // 0..1
      const a = 0.32 + 0.18 * t;                  // 0.32 → 0.50
      // Lerp cyan → amber-hot at the elite tail.
      const r = Math.round(78 + (255 - 78) * t);
      const g = Math.round(224 + (200 - 224) * t);
      const b = Math.round(255 + (90 - 255) * t);
      bg = `rgba(${r}, ${g}, ${b}, ${a.toFixed(2)})`;
    }
  }
  return { bg, fg: "var(--text-primary)" };
}

function renderLeaderboards() {
  const statKey = state.lbStat   || "ops";
  const cfg = LB_STATS[statKey]   || LB_STATS.ops;
  const lvl    = state.lbLevel    || "all";
  const pos    = state.lbPos      || "all";
  const org    = state.lbOrg      || "all";
  const season = Number(state.lbSeason || new Date().getUTCFullYear());

  // Walk every (player, career_stats row) for the selected season.
  // Restricted to ACTIVE PROSPECTS — graduates are excluded since they're
  // no longer prospects, and MLB-level rows are excluded since this is a
  // prospect leaderboard (the Active list itself already covers MLB-graded
  // prospects who happen to have MLB-level stats). A player can have
  // multiple MiLB rows in the same season; each becomes its own entry
  // so a Jesús Made AA-then-AAA year would land in both AAA and AA boards.
  const pool = [];
  for (const p of (DATA.players || [])) {
    const career = p.career_stats || [];
    if (!career.length) continue;
    // Wrong-side gate at the player level — `p.position` is the most
    // current designation. is_pitcher on the row is authoritative
    // when present.
    const bucket = positionBucket(p.position);
    if (pos !== "all" && !positionMatches(bucket, pos)) continue;
    if (org !== "all" && p.org !== org) continue;
    for (const r of career) {
      if (r.season !== season) continue;
      if (r.level === "MLB") continue;  // prospect leaderboard — MiLB only
      if (cfg.side === "hit" && r.is_pitcher) continue;
      if (cfg.side === "pit" && !r.is_pitcher) continue;
      if (lvl !== "all" && r.level !== lvl) continue;
      // Allow LB_STATS entries to override the row-field name (e.g.
      // the leaderboard chip `pitcher_k_pct` reads the row's `k_pct`
      // field so we can keep distinct chip IDs without polluting the
      // row schema with duplicates).
      const fieldKey = cfg.field || statKey;
      const v = r[fieldKey];
      if (v == null) continue;
      // Sample gates — AB for hitters, IP for pitchers. Both may
      // arrive as strings; Number()-coerce.
      if (cfg.minAB && Number(r.ab ?? 0) < cfg.minAB) continue;
      if (cfg.minIP && Number(r.ip ?? 0) < cfg.minIP) continue;
      pool.push({ p, r, v: Number(v) });
    }
  }
  pool.sort((a, b) => cfg.hi ? (b.v - a.v) : (a.v - b.v));
  const ranked = pool.slice(0, 25);

  const header = `<div class="col-header is-leaderboard">
    <span style="text-align:center;">#</span>
    <span>Player · pos · org · age</span>
    <span>Level</span>
    <span style="text-align:center;">FV</span>
    <span style="text-align:right;">${escapeHtml(cfg.label)}</span>
    <span title="Stat-specific context: for OPS shows slash + HR/SB; for ERA shows IP + K/9; etc.">Context</span>
  </div>`;

  if (!ranked.length) {
    const minLabel = cfg.minAB ? `${cfg.minAB} AB` : `${cfg.minIP || 0} IP`;
    document.getElementById("leaderboard-rows").innerHTML =
      header + `<div class="state-message">No active MiLB ${cfg.side === "hit" ? "hitters" : "pitchers"} qualify for the ${season} ${escapeHtml(cfg.label)} board under these filters (min ${minLabel}).</div>`;
    return;
  }

  // Heat-color reference set: every QUALIFYING value (not just the
  // top-25 displayed) becomes the cohort for the league-mean anchor +
  // z-score scaling. The top of the board lands several stdevs above
  // mean and gets the strong color treatment; the tail closer to mean
  // stays muted.
  const _heatValues = pool.map(({ v }) => v).filter(v => v != null);
  const rows = ranked.map(({ p, r, v }, i) => {
    const fvLabel = p.fv_close != null ? Math.round(p.fv_close) : "—";
    const heat = cellHeatColor(v, _heatValues, !!cfg.hi);
    return `
      <div class="player-row is-leaderboard" data-key="${escapeHtml(p.player_key)}" style="${orgStripe(p.org)}">
        <div class="rank-num">${i + 1}</div>
        <div style="display:flex;align-items:flex-start;gap:8px;min-width:0;">
          <div style="min-width:0;flex:1;">
            <div class="player-name">${escapeHtml(p.player_name)}</div>
            ${playerMetaHTML(p)}
          </div>
          <button class="compare-add-btn is-compact${compareHas(p.player_key) ? " is-in" : ""}" data-compare-key="${escapeHtml(p.player_key)}" type="button" title="${compareHas(p.player_key) ? "Remove from compare" : "Add to compare"}" aria-label="Toggle compare">${compareHas(p.player_key) ? "✓" : "+"}</button>
        </div>
        <div><span class="level-pill ${r.level === "MLB" ? "level-mlb" : "level-neutral"}">${escapeHtml(r.level || "—")}</span></div>
        <div style="text-align:center;">${fvLabel !== "—" ? `<span class="fv-badge ${fvClass(String(fvLabel))}${fvBadgeWideClass(p)}${fvBadgeSingleClass(p)}" title="${escapeHtml(fvBadgeTooltip(p))}">${fvLabel}${fvBadgeWideMarkHTML(p)}${fvBadgeSingleMarkHTML(p)}</span>` : `<span style="color:var(--text-tertiary);">—</span>`}</div>
        <div style="text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:700;color:${heat.fg};background:${heat.bg};padding:4px 8px;border-radius:var(--radius-sm);">${cfg.fmt(v)}</div>
        <div style="font-size:11px;color:var(--text-secondary);font-family:var(--font-mono);font-variant-numeric:tabular-nums;">${cfg.support(r)}</div>
      </div>`;
  }).join("");

  document.getElementById("leaderboard-rows").innerHTML = header + rows;
}

// =============================================================================
// GLOSSARY render — categorized term cards with filter + search support.
// Reads from the GLOSSARY const + state.glossaryCat / state.glossarySearch.
// =============================================================================
function renderGlossary() {
  const root = document.getElementById("glossary-rows");
  if (!root) return;
  const cat = state.glossaryCat || "all";
  const search = (state.glossarySearch || "").toLowerCase().trim();
  document.querySelectorAll("[data-glossary-cat]").forEach(b =>
    b.classList.toggle("active", b.dataset.glossaryCat === cat));

  // Group entries by category, preserving the canonical category order.
  const buckets = new Map(GLOSSARY_CATEGORIES.map(([k]) => [k, []]));
  for (const [slug, entry] of Object.entries(GLOSSARY)) {
    if (cat !== "all" && entry.category !== cat) continue;
    if (search) {
      const hay = (entry.name + " " + (entry.aliases || []).join(" ") +
                   " " + entry.short + " " + (entry.long || "")).toLowerCase();
      if (!hay.includes(search)) continue;
    }
    const list = buckets.get(entry.category);
    if (list) list.push({ slug, entry });
  }

  // Render each non-empty bucket — heading + alphabetized cards inside.
  const parts = [];
  let totalRendered = 0;
  for (const [catKey, catLabel] of GLOSSARY_CATEGORIES) {
    const items = buckets.get(catKey) || [];
    if (!items.length) continue;
    items.sort((a, b) => {
      const pa = a.entry.priority ?? 99;
      const pb = b.entry.priority ?? 99;
      if (pa !== pb) return pa - pb;
      return a.entry.name.localeCompare(b.entry.name);
    });
    totalRendered += items.length;
    parts.push(`<div class="glossary-cat-heading">${escapeHtml(catLabel)} <span style="color:var(--text-tertiary);font-weight:500;letter-spacing:0;margin-left:6px;">${items.length}</span></div>`);
    for (const { slug, entry } of items) {
      // Pick the longest space-containing alias as the spelled-out
      // form (e.g. "Development vs Mean" for DvM+). Show it next to
      // the abbreviation in parens. The other aliases drop entirely
      // since they're already search-discoverable via the alias lookup.
      const altNames = (entry.aliases || [])
        .filter(a => a !== entry.name && a.includes(" "));
      const fullName = altNames.length
        ? altNames.sort((a, b) => b.length - a.length)[0]
        : "";
      const formulaBlock = entry.formula
        ? `<div class="gp-formula" style="margin-top:6px;font-size:11px;">${escapeHtml(entry.formula)}</div>`
        : "";
      // Long, example, and related collapse into a single optional
      // <details> below the short — keeps the card compact at rest;
      // the user opens it for the full read.
      const moreBits = [];
      if (entry.long)    moreBits.push(`<div style="margin-top:6px;font-size:12px;color:var(--text-secondary);line-height:1.5;">${escapeHtml(entry.long)}</div>`);
      if (entry.formula) moreBits.push(formulaBlock);
      if (entry.example) moreBits.push(`<div style="font-size:11.5px;color:var(--text-secondary);font-style:italic;margin-top:6px;line-height:1.45;"><span style="font-style:normal;color:var(--text-tertiary);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;">Example · </span>${escapeHtml(entry.example)}</div>`);
      const relatedChips = (entry.related || [])
        .map(r => GLOSSARY[r] ? `<a href="#g-${escapeHtml(r)}" data-related-term="${escapeHtml(r)}" style="font-family:var(--font-mono);font-size:10px;color:var(--neon-cyan);text-decoration:none;border:1px solid var(--border-light);padding:2px 8px;border-radius:999px;">${escapeHtml(GLOSSARY[r].name)}</a>` : "")
        .filter(Boolean).join("");
      if (relatedChips) {
        moreBits.push(`<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;"><span style="font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-tertiary);">Related</span>${relatedChips}</div>`);
      }
      const detailsHtml = moreBits.length
        ? `<details class="gp-more" style="margin-top:6px;"><summary style="cursor:pointer;font-size:10px;color:var(--text-tertiary);letter-spacing:0.06em;text-transform:uppercase;font-weight:600;list-style:none;outline:none;user-select:none;">+ more</summary><div style="margin-top:6px;">${moreBits.join("")}</div></details>`
        : "";
      parts.push(`<div class="glossary-card" id="g-${escapeHtml(slug)}">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;">
          <div style="min-width:0;">
            <span class="gp-term" style="font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--neon-cyan);">${escapeHtml(entry.name)}</span>${fullName ? ` <span style="font-family:var(--font-sans);font-size:14px;font-weight:500;color:var(--text-secondary);">(${escapeHtml(fullName)})</span>` : ""}
          </div>
          <span class="gp-cat" style="font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-tertiary);font-weight:600;">${escapeHtml(catLabel)}</span>
        </div>
        <div style="margin-top:4px;font-size:12.5px;color:var(--text-primary);line-height:1.4;">${escapeHtml(entry.short)}</div>
        ${detailsHtml}
      </div>`);
    }
  }

  if (!totalRendered) {
    root.innerHTML = `<div class="state-message">No glossary terms match these filters.</div>`;
    return;
  }
  root.innerHTML = parts.join("");

  // If a specific term was requested (via state.glossaryTerm / URL g=),
  // scroll to it + add the highlight pulse class. Defer one frame so the
  // DOM lands before scrollIntoView fires.
  if (state.glossaryTerm) {
    const slug = (_resolveGlossaryTerm(state.glossaryTerm) || {}).slug;
    if (slug) {
      requestAnimationFrame(() => {
        const card = document.getElementById("g-" + slug);
        if (card) {
          card.scrollIntoView({ behavior: "smooth", block: "start" });
          card.classList.remove("is-highlighted");
          // Force reflow so the animation restarts on re-navigation.
          void card.offsetWidth;
          card.classList.add("is-highlighted");
        }
      });
      // Clear the request after consuming it so a manual scroll later
      // doesn't re-trigger the highlight.
      state.glossaryTerm = null;
    }
  }
}

// Click-to-define popover — opens a small floating card with the
// term's definition. Re-uses a single .glossary-popover element
// across clicks, positioned just below the clicked term.
function openGlossaryPopover(anchorEl) {
  const term = anchorEl.dataset.term;
  const resolved = _resolveGlossaryTerm(term);
  if (!resolved) return;
  const { slug, entry } = resolved;
  let pop = document.getElementById("glossary-popover");
  if (!pop) {
    pop = document.createElement("div");
    pop.id = "glossary-popover";
    pop.className = "glossary-popover";
    document.body.appendChild(pop);
  }
  const formula = entry.formula
    ? `<div class="gp-formula">${escapeHtml(entry.formula)}</div>` : "";
  pop.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;">
      <span class="gp-term">${escapeHtml(entry.name)}</span>
      <span class="gp-cat">${escapeHtml(entry.category.replace("-", " "))}</span>
    </div>
    <div class="gp-short">${escapeHtml(entry.short)}</div>
    ${entry.long ? `<div class="gp-long">${escapeHtml(entry.long)}</div>` : ""}
    ${formula}
    <a class="gp-open" href="#" data-glossary-open="${escapeHtml(slug)}">Open in glossary →</a>
  `;
  // Position — anchor below the clicked element, or above if there
  // isn't room. Clamp to viewport.
  const rect = anchorEl.getBoundingClientRect();
  const scrollY = window.scrollY || window.pageYOffset;
  const scrollX = window.scrollX || window.pageXOffset;
  const popW = 320;
  let left = Math.min(window.innerWidth - popW - 16,
                      Math.max(8, rect.left + scrollX));
  let top = rect.bottom + scrollY + 8;
  // If popover would go off the bottom, anchor above instead.
  if (rect.bottom + 280 > window.innerHeight) {
    top = rect.top + scrollY - 280;
  }
  // Narrow viewport — center it modally.
  if (window.innerWidth <= 720) {
    left = Math.max(8, (window.innerWidth - popW) / 2);
    top = scrollY + 80;
  }
  pop.style.left = left + "px";
  pop.style.top = top + "px";
  pop.classList.add("is-open");

  // Outside-click dismissal — deferred so the click that opened the
  // popover doesn't immediately close it.
  setTimeout(() => {
    const dismiss = (e) => {
      if (!pop.contains(e.target) && !e.target.closest(".g-term")) {
        pop.classList.remove("is-open");
        document.removeEventListener("click", dismiss);
        document.removeEventListener("keydown", escDismiss);
      }
    };
    const escDismiss = (e) => {
      if (e.key === "Escape") {
        pop.classList.remove("is-open");
        document.removeEventListener("click", dismiss);
        document.removeEventListener("keydown", escDismiss);
      }
    };
    document.addEventListener("click", dismiss);
    document.addEventListener("keydown", escDismiss);
  }, 0);
}

// Injured List section — every tracked prospect currently on an IL
// stint. Pulls from player.il_status (which carries `is_on_il`, type,
// since-date, days) and renders a focused roster so a user can answer
// "who's hurt right now and how long are they out?" in one view.
// Honors the global search box and the per-section sort chips.
function renderInjured() {
  renderWhatsNew("whats-new-injured", kind => kind === "il");
  const today = new Date();
  // Build the list from every player array — actives + graduates
  // (graduates can also be on the MLB IL) + inactives — so a hurt
  // post-grad still shows up here rather than disappearing into the
  // graduates view.
  const pool = [];
  for (const arr of ["players", "graduates", "inactive"]) {
    for (const p of (DATA[arr] || [])) {
      const il = p.il_status || {};
      if (!il.is_on_il) continue;
      // Days elapsed since placement. Server fills `days` in il_status
      // for closed stints but the active stint's days field is often
      // null — derive from the `since` field.
      let days = il.days;
      if ((days == null) && il.since) {
        const t = new Date(il.since + "T00:00:00").getTime();
        if (!isNaN(t)) days = Math.max(0, Math.floor((today.getTime() - t) / 86400000));
      }
      pool.push({
        p, il,
        days: days || 0,
        since: il.since || "",
        // FV close (most-recent consensus_fv) so we can sort by talent.
        fv: p.fv_close || 0,
      });
    }
  }

  // Search filter — shared with the rest of the views.
  let filtered = pool;
  if (state.search) {
    const q = state.search.toLowerCase();
    filtered = filtered.filter(({ p }) => (p.player_name || "").toLowerCase().includes(q));
  }

  // Sort. Default is days_asc — shortest current IL stints first, so
  // the players closest to returning rise to the top. "days" is the
  // legacy descending variant.
  const mode = state.ilSort || "days_asc";
  if (mode === "fv") {
    filtered.sort((a, b) => (b.fv || 0) - (a.fv || 0) || (a.days - b.days));
  } else if (mode === "since") {
    filtered.sort((a, b) => (b.since || "").localeCompare(a.since || ""));
  } else if (mode === "days") {
    // Longest stints first.
    filtered.sort((a, b) => (b.days - a.days) || (b.fv - a.fv));
  } else {
    // days_asc (default): shortest stints first.
    filtered.sort((a, b) => (a.days - b.days) || (b.fv - a.fv));
  }

  // Grid columns live on `.col-header.is-injured` / `.player-row.is-injured`.
  const header = `<div class="col-header is-injured">
    <span style="text-align:center;">#</span>
    <span>Player · pos · org</span>
    <span>IL type</span>
    <span>Since</span>
    <span style="text-align:right;">Days</span>
    <span style="text-align:center;">FV</span>
    <span>Reason</span>
  </div>`;

  const rows = filtered.map(({ p, il, days, since, fv }, i) => {
    const tjBadge = (p.health_profile || {}).is_post_tj
      ? `<span style="font-size:9px;color:var(--accent-tj);background:var(--accent-tj-soft);border:1px solid var(--accent-tj-border);padding:1px 5px;border-radius:2px;letter-spacing:0.04em;text-transform:uppercase;font-weight:700;margin-left:4px;">Post-TJ</span>`
      : "";
    const fvLabel = fv ? Math.round(fv) : "—";
    const reason = il.reason || il.description || "—";
    return `
      <div class="player-row is-injured" data-key="${escapeHtml(p.player_key)}" style="${orgStripe(p.org)}">
        <div class="rank-num">${i + 1}</div>
        <div style="display:flex;align-items:center;gap:10px;min-width:0;">
          ${headshotHTML(p, 50)}
          <div style="min-width:0;flex:1;">
            <div class="player-name">${escapeHtml(p.player_name)}${tjBadge}</div>
            ${playerMetaHTML(p, { showIL: false, showRoster: false })}
          </div>
          <button class="compare-add-btn is-compact${compareHas(p.player_key) ? " is-in" : ""}" data-compare-key="${escapeHtml(p.player_key)}" type="button" title="${compareHas(p.player_key) ? "Remove from compare" : "Add to compare"}" aria-label="Toggle compare">${compareHas(p.player_key) ? "✓" : "+"}</button>
        </div>
        <div><span class="grad-pill" style="background:var(--accent-il-soft);color:var(--accent-il);border:1px solid var(--accent-il-border);">${escapeHtml(il.type || "?")} IL</span></div>
        <div style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--text-secondary);">${escapeHtml(since || "—")}</div>
        <div style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--neon-amber);font-weight:600;">${days}d</div>
        <div style="text-align:center;">${fv ? `<span class="fv-badge ${fvClass(String(fvLabel))}${fvBadgeWideClass(p)}${fvBadgeSingleClass(p)}" title="${escapeHtml(fvBadgeTooltip(p))}">${fvLabel}${fvBadgeWideMarkHTML(p)}${fvBadgeSingleMarkHTML(p)}</span>` : `<span style="color:var(--text-tertiary);">—</span>`}</div>
        <div style="font-size:11px;color:var(--text-secondary);line-height:1.3;">${escapeHtml(reason)}</div>
      </div>`;
  }).join("");

  document.getElementById("injured-rows").innerHTML = filtered.length
    ? header + rows
    : (state.search
        ? `<div class="state-message">No injured prospects match "${escapeHtml(state.search)}".</div>`
        : `<div class="state-message">No tracked prospects are currently on the IL.</div>`);
}

function renderRecentlyTraded() {
  // Keep the news feed scoped to trade events on this tab (still the
  // most user-relevant signal even now that the section also covers
  // waivers / FA / Rule 5).
  renderWhatsNew("whats-new-traded", kind => kind === "trade");
  const filtered = getFilteredAcquired();

  // Grid columns live on `.col-header.is-traded` / `.player-row.is-traded`.
  const header = `<div class="col-header is-traded">
    <span style="text-align:center;">#</span>
    <span>Player · pos · org · age</span>
    <span>Acquisition date</span>
    <span>Method · context</span>
    <span style="text-align:center;" title="Consensus Future Value · stock delta + direction below">FV · stock</span>
    <span class="desktop-only" style="text-align:center;">FV history</span>
    <span class="desktop-only" style="text-align:center;" title="FV open/high/low/close for the current month, candlestick style">Candle</span>
  </div>`;

  const rows = filtered.map(({ p, acq }, i) => {
    const latest = p.points[p.points.length - 1];
    const meta = ACQ_LABELS[acq.method] || { label: acq.method, color: "var(--text-secondary)" };
    // The "method · context" cell shows the acquisition method as a
    // colored pill, plus a short context line (from→to for trades,
    // round/pick for drafts, signing details for IFA, etc.).
    let contextLine = "";
    if (acq.method === "trade") {
      // Header: from→to. Sub-line: the API-supplied trade narrative
      // (e.g. "Twins traded ... to Marlins for ..."). Truncated to keep
      // the cell from blowing the row height; the full string is
      // available on hover via the title attribute.
      const headLine = `<span style="color:var(--text-tertiary);">${escapeHtml(acq.from_org ?? "?")}</span> <span style="color:var(--neon-violet);">→</span> <span style="color:var(--text-primary);">${escapeHtml(acq.to_org ?? "?")}</span>`;
      const desc = (acq.description || "").trim();
      const TRUNC = 90;
      const subLine = desc
        ? `<span style="display:block;color:var(--text-tertiary);font-size:11px;margin-top:2px;line-height:1.35;" title="${escapeHtml(desc)}">${escapeHtml(desc.length > TRUNC ? desc.slice(0, TRUNC - 1).trimEnd() + "…" : desc)}</span>`
        : "";
      contextLine = headLine + subLine;
    } else if (acq.method === "draft" && acq.pick_overall) {
      contextLine = `<span style="color:var(--text-tertiary);">${acq.year} draft</span> · <span style="color:var(--text-primary);">Pick ${acq.pick_overall}${acq.round_label ? ` (R${escapeHtml(acq.round_label)})` : ""}</span>`;
    } else if (acq.method === "international_fa") {
      const bonus = acq.bonus_usd ? ` · $${(acq.bonus_usd / 1_000_000).toFixed(2)}M` : "";
      contextLine = `<span style="color:var(--text-tertiary);">${acq.year || "—"} IFA${bonus}</span>`;
    } else if (acq.method === "waiver" && acq.from_org) {
      contextLine = `<span style="color:var(--text-tertiary);">claimed from ${escapeHtml(acq.from_org)}</span>`;
    } else if (acq.method === "rule_5" && acq.from_org) {
      contextLine = `<span style="color:var(--text-tertiary);">Rule 5 from ${escapeHtml(acq.from_org)}</span>`;
    } else {
      contextLine = `<span style="color:var(--text-tertiary);">${escapeHtml(acq.description || "—")}</span>`;
    }
    const methodPill = `<span class="grad-pill" style="background:var(--bg-tertiary);color:${meta.color};border:1px solid var(--border);">${escapeHtml(meta.label)}</span>`;
    return `
      <div class="player-row is-traded" data-key="${escapeHtml(p.player_key)}" style="${orgStripe(p.org)}">
        <div class="rank-num">${i + 1}</div>
        <div style="display:flex;align-items:flex-start;gap:8px;min-width:0;">
          <div style="min-width:0;flex:1;">
            <div class="player-name">${escapeHtml(p.player_name)}</div>
            ${playerMetaHTML(p)}
          </div>
          <button class="compare-add-btn is-compact${compareHas(p.player_key) ? " is-in" : ""}" data-compare-key="${escapeHtml(p.player_key)}" type="button" title="${compareHas(p.player_key) ? "Remove from compare" : "Add to compare"}" aria-label="Toggle compare">${compareHas(p.player_key) ? "✓" : "+"}</button>
        </div>
        <div>
          <span class="grad-pill" style="background:var(--bg-tertiary);color:${meta.color};border:1px solid var(--border);">${escapeHtml(acq.date)}</span>
        </div>
        <div style="font-size:12px;display:flex;flex-direction:column;gap:3px;">
          ${methodPill}
          <span style="font-size:11px;">${contextLine}</span>
        </div>
        <div style="text-align:center;"><span class="fv-badge ${fvClass(latest.consensus_fv_label)}${fvBadgeWideClass(p)}${fvBadgeSingleClass(p)}" title="${escapeHtml(fvBadgeTooltip(p))}">${latest.consensus_fv_label}${fvBadgeWideMarkHTML(p)}${fvBadgeSingleMarkHTML(p)}</span>${fvTrendHTML(p)}</div>
        <div class="line-chart-cell desktop-only">${makeLineChart(p.points, p.fv_open, p.fv_close, p.graduation_date, p.trades, p)}</div>
        <div class="candle-cell desktop-only">${makeCandle(p)}</div>
      </div>
    `;
  }).join("");

  document.getElementById("traded-rows").innerHTML = filtered.length
    ? header + rows
    : `<div class="state-message">No acquired prospects match these filters.</div>`;
}

// FanGraphs scouting-primer lower-bound WAR/yr by FV grade.
// Source: https://blogs.fangraphs.com/the-new-fangraphs-scouting-primer/
const FV_WAR_ANCHORS = {
  hitter:  { 30: -0.1, 40: 0.0, 45: 0.8, 50: 1.6, 55: 2.5, 60: 3.4, 70: 5.0, 80: 7.0 },
  pitcher: { 30: -0.1, 40: 0.0, 45: 1.0, 50: 1.8, 55: 2.6, 60: 3.5, 70: 5.0, 80: 7.0 },
};

function fvExpectedWarPerYr(fv, isPitcher) {
  if (fv == null) return null;
  const table = isPitcher ? FV_WAR_ANCHORS.pitcher : FV_WAR_ANCHORS.hitter;
  const grades = Object.keys(table).map(Number).sort((a, b) => a - b);
  if (fv <= grades[0]) return table[grades[0]];
  if (fv >= grades[grades.length - 1]) return table[grades[grades.length - 1]];
  for (let i = 0; i < grades.length - 1; i++) {
    const lo = grades[i], hi = grades[i + 1];
    if (fv >= lo && fv <= hi) {
      const t = (fv - lo) / (hi - lo);
      return table[lo] + t * (table[hi] - table[lo]);
    }
  }
  return null;
}

// $/WAR market anchor. Recent free-agent winters have averaged ~$9-10M
// per win above replacement; we use $9.5M as a stable midpoint. Used
// to convert a graduate's playing-time-weighted WAR/year into a market-
// equivalent Average Annual Value — the AAV a comparable free agent
// would command on the open market for that production rate.
const DOLLARS_PER_WAR_MM = 9.5;
function estimateMarketAavMM(warPerYr) {
  if (warPerYr == null || !isFinite(warPerYr)) return null;
  // Replacement-level (~0 WAR) reads as league min (~$0.75M); below
  // that floor we clamp because no negative-AAV contract exists.
  if (warPerYr <= 0) return 0.75;
  return Math.round(warPerYr * DOLLARS_PER_WAR_MM * 10) / 10;
}

// MLB salary cost model — used to convert a graduate's career WAR into
// realized surplus value (market production minus what their team
// actually paid them across the cost-controlled window).
//
//   Years 1-3 (pre-arb): league minimum ($0.76M for 2024).
//   Years 4-6 (arb):     ~30% / 55% / 80% of the FA-equivalent value
//                        from the prior season's WAR. Caps below at
//                        league min so a -WAR season doesn't produce
//                        a negative salary.
//   Years 7+ (post-arb): assume the player is paid at fair-market rate
//                        for the current season (FA equivalent of THIS
//                        year's WAR).
//
// The model is approximate — the user can replace `total_salary` with a
// scraped Spotrac contract value once that pipeline lands. Until then
// the league-min + arb-fraction proxy is a reasonable estimate that
// preserves the "outperformed his contract" comparison.
const LEAGUE_MIN_SALARY_MM = 0.76;
const ARB_FRACTIONS = [0.30, 0.55, 0.80];

function estimateRealizedSurplusValueMM(g) {
  const seasons = ((g || {}).career_war || {}).seasons || {};
  const years = Object.keys(seasons).filter(y => seasons[y] != null).sort();
  if (!years.length) return null;
  // Spotrac-sourced active contract — when present, we know the exact
  // per-year salary across the remaining contract window. Use those
  // values to override the league-min + arb-fraction model for any
  // seasons (current + future) that overlap. Prior seasons that
  // aren't in the contract still use the synthesized model.
  const contract = (g || {}).current_contract || {};
  const salaryByYear = contract.salary_by_year || {};
  let totalValue = 0;
  let totalSalary = 0;
  let actualSalaryUsed = 0;
  for (let i = 0; i < years.length; i++) {
    const year = years[i];
    const war = Number(seasons[year]) || 0;
    const marketValue = Math.max(0, war) * DOLLARS_PER_WAR_MM;
    let salary;
    // Actual Spotrac salary when available — the team's yearly page
    // covers the active contract window (current year + remaining
    // years), so older seasons fall through to the model.
    const actualUsd = salaryByYear[year] || salaryByYear[Number(year)];
    if (actualUsd != null && actualUsd > 0) {
      salary = actualUsd / 1_000_000;
      actualSalaryUsed++;
    } else if (i < 3) {
      salary = LEAGUE_MIN_SALARY_MM;
    } else if (i < 6) {
      const priorWar = Number(seasons[years[i - 1]]) || 0;
      const arbBase = Math.max(0, priorWar) * DOLLARS_PER_WAR_MM;
      salary = Math.max(LEAGUE_MIN_SALARY_MM, arbBase * ARB_FRACTIONS[i - 3]);
    } else {
      const faEquivalent = Math.max(0, war) * DOLLARS_PER_WAR_MM;
      salary = Math.max(LEAGUE_MIN_SALARY_MM, faEquivalent);
    }
    totalValue += marketValue;
    totalSalary += salary;
  }
  const totalWar = years.reduce((sum, y) => sum + (Number(seasons[y]) || 0), 0);
  return {
    realized_surplus: Math.round((totalValue - totalSalary) * 10) / 10,
    total_war: Math.round(totalWar * 10) / 10,
    total_value: Math.round(totalValue * 10) / 10,
    total_salary: Math.round(totalSalary * 10) / 10,
    season_count: years.length,
    actual_salary_seasons: actualSalaryUsed,
  };
}

// MLB Draft assigned bonus pools per team — now read from the JSON
// payload (DATA.mlb_draft_pools) produced by storage.build_draft_pools.
// Per-year keys (2021-current) carry { team_pools: {ORG: usd},
// pick_values: [{pick_overall, slot_usd, team}, ...] }. Team-pool
// ceilings are MLB-assigned baselines; clubs may exceed by ~5%
// before luxury-tax penalties.
function _draftPoolsForYear(year) {
  if (year == null) return null;
  const all = (typeof DATA !== "undefined" && DATA && DATA.mlb_draft_pools) || {};
  // JSON object keys are strings; the consumer may pass either form.
  return all[year] || all[String(year)] || null;
}

function _orgDraftPoolUtilization(org, year) {
  const yearData = _draftPoolsForYear(year);
  if (!yearData || !yearData.team_pools) return null;
  const ceiling = yearData.team_pools[org && org.org];
  if (!ceiling) return null;
  const spent = ((org.draft_spending || {})[year] || {}).total_usd;
  if (spent == null) return null;
  return { spent, cap: ceiling, pct: (spent / ceiling) * 100 };
}

// MLB-assigned international amateur signing bonus pools per team.
// Source: MLB.com's 2026 international signing-day article (the IFA
// pool breakdown section). Five tiers based on market size + comp-
// balance picks. Teams can trade pool money in/out (up to 60% of
// original); these values are the BASE allocation, not post-trade
// adjusted.
const MLB_IFA_BONUS_POOLS = {
  2026: {
    "ARI": 8034900, "BAL": 8034900, "CLE": 8034900, "COL": 8034900,
    "KCR": 8034900, "PIT": 8034900, "STL": 8034900,
    "ATH": 7357100, "CIN": 7357100, "DET": 7357100, "MIA": 7357100,
    "MIL": 7357100, "MIN": 7357100, "SEA": 7357100, "TBR": 7357100,
    "ATL": 6679200, "CHC": 6679200, "CHW": 6679200, "LAA": 6679200,
    "LAD": 6679200, "PHI": 6679200, "TEX": 6679200, "WSN": 6679200,
    "BOS": 5940000, "SDP": 5940000, "TOR": 5940000,
    "HOU": 5440000, "NYY": 5440000, "NYM": 5440000, "SFG": 5440000,
  },
};

function _orgIfaPoolUtilization(org, year) {
  const ceiling = (MLB_IFA_BONUS_POOLS[year] || {})[org && org.org];
  if (!ceiling) return null;
  const spent = ((org.ifa_spending || {})[year] || {}).total_usd;
  if (spent == null) return { spent: null, cap: ceiling, pct: null };
  return { spent, cap: ceiling, pct: (spent / ceiling) * 100 };
}

// FV → estimated MLB surplus value ($M), per Craig Edwards / FanGraphs
// 2019 framework. Hitters carry more value than pitchers at the same FV
// because pitchers face higher injury attrition + reliever-conversion
// risk. Values are TOTAL surplus across the 6-year cost-controlled
// window, NOT per-year. Linear-interpolate between table rows for
// half-grade FVs.
const SURPLUS_VALUE_MM = {
  hitter:  { 80: 200, 75: 130, 70: 80, 65: 50, 60: 35, 55: 20, 50: 10, 45: 5,  40: 2,   35: 1 },
  pitcher: { 80: 100, 75: 80,  70: 55, 65: 35, 60: 25, 55: 12, 50: 7,  45: 4,  40: 1.5, 35: 1 },
};
function estimateSurplusValueMM(fv, isPitcher) {
  if (fv == null) return null;
  const table = SURPLUS_VALUE_MM[isPitcher ? "pitcher" : "hitter"];
  // Clamp to the 35-80 anchor range. Below 35 reads as ~$0.5M (a
  // league-min cost-controlled WAR0 player floor); above 80 caps at
  // the elite tier.
  if (fv >= 80) return table[80];
  if (fv <= 35) return 0.5;
  const lo = Math.floor(fv / 5) * 5;
  const hi = lo + 5;
  const t  = (fv - lo) / 5;
  return Math.round((table[lo] * (1 - t) + table[hi] * t) * 10) / 10;
}

// Playing-time-weighted MLB WAR/year, with a minimum-sample gate to
// suppress small-sample noise (Ben Rice's −0.3 WAR over 50 PA debut
// motivated the gate). The rate is:
//
//   war_per_yr = (sum of WAR across MLB years)
//              / (sum of season fractions across MLB years)
//
// where one "season fraction" is the year's PA (or IP) divided by the
// graduate's PERSONAL full-season denominator — the average of their
// own qualifying full MLB seasons. A reliever's denominator might be
// ~60 IP; a platoon hitter's might be ~400 PA; a workhorse starter's
// might be ~180 IP. We fall back to a league-wide default (600 PA /
// 130 IP) only when the player has no qualifying full season on file
// yet (so a 50-PA-debut Ben Rice is still measured against 600, not
// 50). Current year is INCLUDED — the PA-weighting already downweights
// in-progress partial seasons naturally.
//
// Returns null (and the caller skips rendering) when total playing
// time across the player's MLB career sums to less than 1.0 full
// season equivalent, or when no MLB year carries usable playing-time
// data. No equally-weighted fallback — better to render nothing than
// a misleading number.
//
// Returns:
//   { war_per_yr, war_seasons_count, war_total,
//     denom, denom_unit, denom_source } | null
//   where denom is the per-season denominator used, denom_unit is
//   "PA" or "IP", and denom_source is "personal" or "default".
function gradPersonalFullSeason(careerStats, isPitcher) {
  // Threshold for "this is a full-season workload, not a debut stub":
  // PA ≥ 300 for hitters, IP ≥ 50 for pitchers. Anything below feeds
  // the player's career bucket but doesn't define their typical
  // season — otherwise a 50-PA debut would calibrate the denominator
  // to itself and the gate would trivially pass.
  const FULL_THRESHOLD = isPitcher ? 50 : 300;
  const FALLBACK = isPitcher ? 130 : 600;
  const observed = [];
  for (const row of (careerStats || [])) {
    if ((row.level || "").toUpperCase() !== "MLB") continue;
    let v = NaN;
    if (isPitcher) {
      const ip = Number(row.ip);
      if (isFinite(ip) && ip > 0) v = ip;
    } else {
      const pa = Number(row.pa);
      if (isFinite(pa) && pa > 0) v = pa;
      else {
        const ab = Number(row.ab);
        if (isFinite(ab) && ab > 0) v = ab * 1.1;
      }
    }
    if (isFinite(v) && v >= FULL_THRESHOLD) observed.push(v);
  }
  if (!observed.length) {
    return { denom: FALLBACK, source: "default" };
  }
  const mean = observed.reduce((s, x) => s + x, 0) / observed.length;
  return { denom: mean, source: "personal" };
}

function gradWarPerYr(g) {
  const cw = g.career_war || {};
  const seasons = cw.seasons || {};
  const careerStats = g.career_stats || [];
  const isPitcher = !!(g.sabermetrics && g.sabermetrics.is_pitcher);

  const { denom, source: denomSource } = gradPersonalFullSeason(careerStats, isPitcher);
  if (!isFinite(denom) || denom <= 0) return null;

  // Sum of season fractions per year — multiple MLB rows in one year
  // (e.g., mid-season trade) accumulate, then we match against
  // career_war.seasons by year to compute total WAR alongside.
  const fracBySeason = {};
  for (const row of careerStats) {
    if ((row.level || "").toUpperCase() !== "MLB") continue;
    const yr = parseInt(row.season, 10);
    if (isNaN(yr)) continue;
    let raw = NaN;
    if (isPitcher) {
      const ip = Number(row.ip);
      if (isFinite(ip) && ip > 0) raw = ip;
    } else {
      const pa = Number(row.pa);
      if (isFinite(pa) && pa > 0) raw = pa;
      else {
        const ab = Number(row.ab);
        if (isFinite(ab) && ab > 0) raw = ab * 1.1;
      }
    }
    if (isFinite(raw) && raw > 0) {
      const frac = raw / denom;
      fracBySeason[yr] = (fracBySeason[yr] || 0) + frac;
    }
  }

  let totalWar = 0;
  let totalFrac = 0;
  let count = 0;
  for (const yr in seasons) {
    const y = parseInt(yr, 10);
    const w = seasons[yr];
    if (w == null) continue;
    const frac = fracBySeason[y];
    if (!frac || frac <= 0) continue;
    totalWar += Number(w);
    totalFrac += frac;
    count += 1;
  }
  // Minimum-sample gate: require ≥1 full-season equivalent of
  // playing time before extrapolating a rate. Ben Rice with only a
  // 50-PA debut (50/600 ≈ 0.083 seasons under the default denom)
  // drops out; once he banks a real follow-up year the gate opens
  // AND his personal denominator can replace the default.
  if (count < 1 || totalFrac < 1.0) return null;
  return {
    war_per_yr: totalWar / totalFrac,
    war_seasons_count: count,
    war_total: totalWar,
    denom: denom,
    denom_unit: isPitcher ? "IP" : "PA",
    denom_source: denomSource,
  };
}

function gradVsFvProjection(g) {
  // WAG = (playing-time-weighted MLB WAR/yr) − (FV-grade-implied
  // WAR/yr). gradWarPerYr returns null when the player has < 1 full-
  // season equivalent of MLB playing time, so a thin-debut prospect
  // (Ben Rice with only 50 PA) silently drops out instead of reading
  // as a massive bust.
  const r = gradWarPerYr(g);
  if (!r) return null;
  const fv = g.fv_close_raw ?? g.fv_close;
  if (fv == null) return null;
  const isPitcher = !!(g.sabermetrics && g.sabermetrics.is_pitcher);
  const expected = fvExpectedWarPerYr(fv, isPitcher);
  if (expected == null) return null;
  return r.war_per_yr - expected;
}

// WAG-by-season sparkline for a graduate. Bars: green when the
// season's WAR exceeded the FV-grade-implied baseline, red when it
// fell short. A dashed midline at y = 0 anchors the eye to "matched
// expectation." Tooltip per bar enumerates the season's actual WAR,
// the FV-implied baseline, and the resulting WAG. Returns "" when the
// graduate lacks the data needed (no seasons, no FV grade).
function makeWagChart(g) {
  const seasons = (g.career_war || {}).seasons || {};
  const years = Object.keys(seasons).filter(y => seasons[y] != null).sort();
  if (years.length === 0) return "";
  const fv = g.fv_close_raw ?? g.fv_close;
  if (fv == null) return "";
  const isPitcher = !!(g.sabermetrics && g.sabermetrics.is_pitcher);
  const baseline = fvExpectedWarPerYr(fv, isPitcher);
  if (baseline == null) return "";
  const wars   = years.map(y => Number(seasons[y]));
  const wagVals = wars.map(w => w - baseline);
  const maxAbs = Math.max(0.5, ...wagVals.map(v => Math.abs(v)));
  const W = 70, H = 32, PAD = 2;
  const mid = H / 2;
  const innerH = (H - 2 * PAD) / 2;
  const barW = Math.max(3, Math.floor((W - 2 * PAD) / years.length) - 1);
  const bars = wagVals.map((v, i) => {
    const barH = Math.abs(v) / maxAbs * innerH;
    const x = PAD + i * (barW + 1);
    const y = v >= 0 ? mid - barH : mid;
    const fill = v >= 0 ? "var(--up)" : "var(--down)";
    const sign = v >= 0 ? "+" : "";
    const tip = `${years[i]}: ${sign}${v.toFixed(2)} WAG · ${wars[i] >= 0 ? "+" : ""}${wars[i].toFixed(1)} WAR vs ${baseline.toFixed(2)} FV-${Math.round(fv)} expected`;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW}" height="${Math.max(1, barH).toFixed(1)}" fill="${fill}"><title>${escapeHtml(tip)}</title></rect>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="WAG by season">
    <line x1="0" y1="${mid}" x2="${W}" y2="${mid}" stroke="var(--text-tertiary)" stroke-width="0.6" stroke-dasharray="2,2" opacity="0.7"/>
    ${bars}
  </svg>`;
}

function renderGraduates() {
  renderWhatsNew("whats-new-graduates", kind => kind === "graduated");
  const filtered = getFilteredGrads();

  // Build a render order based on the active sort. For date-sort we keep
  // the legacy group-by-date layout (each class together, recency
  // banner) so a "who just graduated" scan still works. For WAR / FV
  // sorts the rows go flat, since grouping by date wouldn't help.
  const sortMode = state.gradSort || "date";

  // Group by date so the most-recent class can be visually flagged
  const byDate = {};
  for (const g of filtered) (byDate[g.graduation_date] = byDate[g.graduation_date] || []).push(g);
  const sortedDates = Object.keys(byDate).sort().reverse();
  const isRecentGradDate = dateStr => {
    if (!dateStr) return false;
    const d = new Date(`${dateStr}T00:00:00`);
    if (Number.isNaN(d.getTime())) return false;
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diffDays = (today - d) / 86400000;
    return diffDays >= 0 && diffDays <= 14;
  };

  // Grid columns live on `.grad-header` / `.grad-row` in the CSS block.
  const header = `<div class="grad-header">
    <span style="text-align:center;">#</span>
    <span>Player · pos · org · age</span>
    <span class="grad-graduation-cell">Graduation</span>
    <span style="text-align:center;">FV</span>
    <span class="desktop-only" style="text-align:center;" title="Per-season bars vs FV-implied baseline — green when the season's WAR exceeded their grade, red when it fell short. The full FV-trajectory chart lives on each graduate's detail page.">WAG by season</span>
    <span class="desktop-only" style="text-align:center;">Candle</span>
    <span class="grad-level-cell">Level</span>
    <span>MLB stats</span>
  </div>`;

  // Build the iteration order based on the active sort.
  let orderedGrads;
  // Generic null-sink comparator used by all three WAR sorts so a
  // graduate without WAR data never appears above one with it.
  const sortByWarField = (extract) => (a, b) => {
    const aw = extract(a);
    const bw = extract(b);
    if (aw == null && bw == null) return 0;
    if (aw == null) return 1;
    if (bw == null) return -1;
    return bw - aw;
  };
  if (sortMode === "war") {
    orderedGrads = filtered.slice().sort(sortByWarField(g => (g.sabermetrics || {}).war));
  } else if (sortMode === "career_war") {
    orderedGrads = filtered.slice().sort(sortByWarField(g => (g.career_war || {}).career_war));
  } else if (sortMode === "war_per_yr") {
    // Playing-time-weighted WAR/yr — same definition as WAG's
    // denominator, so a graduate without ≥1 full-season equivalent
    // of playing time sinks to the null end of the sort.
    orderedGrads = filtered.slice().sort(sortByWarField(g => {
      const r = gradWarPerYr(g);
      return r ? r.war_per_yr : null;
    }));
  } else if (sortMode === "fv_close") {
    orderedGrads = filtered.slice().sort((a, b) =>
      ((b.fv_close ?? -1) - (a.fv_close ?? -1))
      || (b.graduation_date || "").localeCompare(a.graduation_date || "")
    );
  } else if (sortMode === "vs_fv_proj") {
    orderedGrads = filtered.slice().sort(sortByWarField(g => gradVsFvProjection(g)));
  } else if (sortMode === "vs_fv_proj_low") {
    // Ascending WAG: most-underperforming graduates surface first.
    // Reuse the null-sink semantics of sortByWarField by negating both
    // sides so graduates without WAG data still sink to the bottom.
    orderedGrads = filtered.slice().sort(sortByWarField(g => {
      const d = gradVsFvProjection(g);
      return d == null ? null : -d;
    }));
  } else {
    // Date sort: preserve the group-by-date pass below.
    orderedGrads = null;
  }

  const renderRow = (g, rank, pillClassOverride, sublabel) => {
    const isRecent = isRecentGradDate(g.graduation_date);
    const pillClass = pillClassOverride || (isRecent ? "grad-pill most-recent" : "grad-pill");
    // WAG-by-season sparkline replaces the older FV-trajectory chart on
    // the graduate LIST page — the WAG signal is more useful for
    // ranking graduates by realized output vs their grade. The full
    // FV chart still renders on each graduate's detail page. The
    // single-number WAG also lands inline next to the sparkline so a
    // reader doesn't need to hover to know the magnitude.
    const wagSparkHtml = makeWagChart(g);
    const wagDeltaCellNum = gradVsFvProjection(g);
    let wagValueInline = "";
    if (wagDeltaCellNum != null) {
      const wagCellColor = wagDeltaCellNum > 0.05 ? "var(--up)"
                         : wagDeltaCellNum < -0.05 ? "var(--down)"
                         : "var(--text-tertiary)";
      const sign = wagDeltaCellNum > 0 ? "+" : "";
      wagValueInline = `<span style="font-family:var(--font-mono);font-size:10.5px;font-weight:700;color:${wagCellColor};font-variant-numeric:tabular-nums;margin-left:4px;" title="WAG (WAR Above Grade) — playing-time-weighted WAR/yr minus FV-implied baseline">${sign}${wagDeltaCellNum.toFixed(2)}</span>`;
    }
    const chartHtml = wagSparkHtml
      ? `<span style="display:inline-flex;align-items:center;gap:4px;">${wagSparkHtml}${wagValueInline}</span>`
      : `<span style="color:var(--text-tertiary);font-size:11px;">—</span>`;
    const fvLabel = g.fv_close != null ? Math.round(g.fv_close) : "—";
    const sm = g.sabermetrics || {};
    const cw = g.career_war || {};
    // WAG (WAR Above Grade) — always rendered when the graduate has the
    // data, regardless of active sort. The other three WAR-sort tags
    // (war / career_war / war_per_yr) stay sort-dependent since they
    // duplicate values already shown in the row's MLB stats cell. WAG
    // is the only one without a redundant home, so it gets the always-on
    // treatment.
    let wagPill = "";
    const wagDelta = gradVsFvProjection(g);
    if (wagDelta != null) {
      const isPitcher = !!sm.is_pitcher;
      const expected = fvExpectedWarPerYr(g.fv_close_raw ?? g.fv_close, isPitcher);
      const r = gradWarPerYr(g);  // never null when wagDelta isn't
      const denomFmt = isPitcher ? `${r.denom.toFixed(1)} IP` : `${Math.round(r.denom)} PA`;
      const denomTag = r.denom_source === "personal"
        ? `personal avg full season = ${denomFmt}`
        : `league default = ${denomFmt}`;
      const tip = `WAG ${wagDelta > 0 ? '+' : ''}${wagDelta.toFixed(2)} — expected ${expected.toFixed(2)} WAR/yr at FV ${Math.round(g.fv_close)} (${isPitcher ? "pitcher" : "hitter"} table), actual ${r.war_per_yr.toFixed(2)} WAR/yr over ${r.war_seasons_count} MLB season${r.war_seasons_count === 1 ? "" : "s"} weighted by playing time (1 season = ${denomTag})`;
      const cls = wagDelta > 0.05 ? "is-pos" : wagDelta < -0.05 ? "is-neg" : "is-neutral";
      wagPill = `<span class="wag-pill ${cls} g-term" data-term="wag" style="margin-left:6px;" title="${escapeHtml(tip)}">${wagDelta > 0 ? '+' : ''}${wagDelta.toFixed(2)} WAG</span>`;
    }
    // When sorting by one of the WAR fields, surface the value on the row
    // so the reader can see the sort key without hovering. Current-season
    // WAR is always shown in the MLB stats cell via gradCurrentWarHTML,
    // so the inline tag here is reserved for the two cumulative sorts.
    // (vs_fv_proj is handled by the always-on wagPill above.)
    let warTag = "";
    if (sortMode === "war" && sm.war != null) {
      warTag = `<span style="margin-left:6px;font-family:var(--font-mono);font-size:10px;color:var(--neon-cyan);">${sm.war > 0 ? '+' : ''}${sm.war.toFixed(2)} fWAR</span>`;
    } else if (sortMode === "career_war" && cw.career_war != null) {
      warTag = `<span style="margin-left:6px;font-family:var(--font-mono);font-size:10px;color:var(--neon-cyan);" title="Career WAR · ${cw.war_seasons_count ?? "?"} season${cw.war_seasons_count === 1 ? "" : "s"} (${cw.source || "bbref"})">${cw.career_war > 0 ? '+' : ''}${cw.career_war.toFixed(1)} career WAR</span>`;
    } else if (sortMode === "war_per_yr") {
      const r = gradWarPerYr(g);
      if (r) {
        const denomFmt = sm.is_pitcher ? `${r.denom.toFixed(1)} IP` : `${Math.round(r.denom)} PA`;
        const denomTag = r.denom_source === "personal"
          ? `personal avg full season = ${denomFmt}`
          : `league default = ${denomFmt}`;
        warTag = `<span style="margin-left:6px;font-family:var(--font-mono);font-size:10px;color:var(--neon-cyan);" title="WAR/year — total MLB WAR ÷ ${r.war_seasons_count} season${r.war_seasons_count === 1 ? "" : "s"} weighted by playing time (1 season = ${denomTag}). Requires ≥1 full-season equivalent of MLB time.">${r.war_per_yr > 0 ? '+' : ''}${r.war_per_yr.toFixed(2)} WAR/yr</span>`;
      }
    }
    return `
      <div class="grad-row" data-key="${escapeHtml(g.player_key)}" style="${orgStripe(g.org)}">
        <div class="rank-num">${rank}</div>
        <div style="display:flex;align-items:center;gap:10px;min-width:0;">
          ${headshotHTML(g, 50)}
          <div style="min-width:0;flex:1;">
            <div class="player-name">${escapeHtml(g.player_name)}${wagPill}${warTag}</div>
            ${playerMetaHTML(g, { showIL: false, showRoster: false })}
          </div>
        </div>
        <div class="grad-graduation-cell">
          <span class="${pillClass}">${g.graduation_date}</span>
          ${sublabel || (isRecent ? `<span style="font-size:10px;color:var(--text-tertiary);margin-left:6px;">recent</span>` : "")}
        </div>
        <div style="text-align:center;"><span class="fv-badge ${fvClass(String(fvLabel))}${fvBadgeWideClass(g)}${fvBadgeSingleClass(g)}" title="${escapeHtml(fvBadgeTooltip(g))}">${fvLabel}${fvBadgeWideMarkHTML(g)}${fvBadgeSingleMarkHTML(g)}</span></div>
        <div class="desktop-only" style="padding-right:6px;">${chartHtml}</div>
        <div class="desktop-only">${makeCandle(g)}</div>
        <div class="grad-level-cell milb-cell"><span class="level-pill level-mlb">MLB</span></div>
        ${makeGradMilbCell(g)}
      </div>`;
  };

  let body = header;
  if (orderedGrads !== null) {
    // Flat list driven by sort.
    orderedGrads.forEach((g, i) => {
      body += renderRow(g, i + 1, null, "");
    });
  } else {
    let rank = 1;
    for (const dateKey of sortedDates) {
      for (const g of byDate[dateKey]) {
        body += renderRow(g, rank++, null, null);
      }
    }
  }

  document.getElementById("grad-rows").innerHTML = filtered.length
    ? body
    : `<div class="state-message">No graduates match these filters.</div>`;
}

// Alias lookup — maps display variants ("T+", "ToolGrade+") to canonical
// slugs ("tools_plus") so `data-term` can use either form.
const _GLOSSARY_ALIAS_TO_SLUG = (() => {
  const out = {};
  for (const [slug, entry] of Object.entries(GLOSSARY)) {
    out[slug] = slug;
    out[entry.name] = slug;
    for (const a of (entry.aliases || [])) out[a] = slug;
  }
  return out;
})();

function _resolveGlossaryTerm(termOrSlug) {
  if (!termOrSlug) return null;
  const slug = _GLOSSARY_ALIAS_TO_SLUG[termOrSlug] || termOrSlug;
  return GLOSSARY[slug] ? { slug, entry: GLOSSARY[slug] } : null;
}

function detailTable(p) {
  // Per-source breakdown for the most recent snapshot
  const latest = p.points.length ? p.points[p.points.length - 1] : null;
  const perSrc = (latest && latest.per_source) ? latest.per_source : {};
  const srcEntries = Object.entries(perSrc);

  const sourceSection = srcEntries.length ? `
    <div class="detail-title" style="margin-top: 14px; margin-bottom: 6px;">
      Source breakdown · <span style="font-weight:400">${latest.snapshot_date}</span>
      <span style="font-weight:400; color:var(--text-tertiary);"> · consensus = ${latest.consensus_fv_label}</span>
    </div>
    <table class="detail-table">
      <thead><tr><th style="text-align:left;">Source</th><th>FV grade</th><th>Rank</th></tr></thead>
      <tbody>
        ${srcEntries.map(([src, d]) => `<tr>
          <td><span class="src-tag">${escapeHtml(SOURCE_LABELS[src] || src)}</span></td>
          <td>${d.fv_published != null
            ? `<span class="fv-badge ${fvClass(String(d.fv_published))} size-sm">${d.fv_published}</span>`
            : `<span style="color:var(--text-tertiary)">—</span>`}</td>
          <td>${d.rank != null ? `#${d.rank}` : "—"}</td>
        </tr>`).join("")}
      </tbody>
    </table>` : "";

  const etaSection = (() => {
    const eta = p.eta;
    if (!eta || eta.year == null) return "";
    const rows = [
      ["Level baseline", eta.base_years != null ? `${eta.base_years.toFixed(1)} yrs` : "—"],
      ["Performance",    eta.perf_adj  > 0 ? `+${eta.perf_adj}` : eta.perf_adj < 0 ? `${eta.perf_adj}` : "±0"],
      ["Age vs. level",  eta.age_adj   > 0 ? `+${eta.age_adj}`  : eta.age_adj  < 0 ? `${eta.age_adj}`  : "±0"],
      ["FV grade",       eta.fv_adj    > 0 ? `+${eta.fv_adj}`   : eta.fv_adj   < 0 ? `${eta.fv_adj}`   : "±0"],
    ];
    return `
    <div class="detail-title" style="margin-top:14px;">ETA projection · <span style="font-weight:400;">${eta.year}</span></div>
    <table class="detail-table">
      <tbody>
        ${rows.map(([label, val]) => `<tr><td>${label}</td><td style="text-align:right;">${val}</td></tr>`).join("")}
      </tbody>
    </table>`;
  })();

  return `
    <div class="detail-title">FV history · ${p.points.length} update interval${p.points.length !== 1 ? "s" : ""}</div>
    <table class="detail-table">
      <thead><tr><th>Date</th><th>Update</th><th>Consensus FV</th><th>Avg rank</th></tr></thead>
      <tbody>
        ${p.points.map(pt => `<tr>
          <td>${pt.snapshot_date}</td>
          <td><span class="src-tag">${escapeHtml(pt.interval_label)}</span></td>
          <td><span class="fv-badge ${fvClass(pt.consensus_fv_label)} size-sm">${pt.consensus_fv_label}</span></td>
          <td>${pt.avg_rank != null ? pt.avg_rank.toFixed(1) : "—"}</td>
        </tr>`).join("")}
      </tbody>
    </table>
    ${sourceSection}
    ${etaSection}
  `;
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

// Highlight tracked-prospect names inside a transaction description.
// Walks the global DATA arrays once on first call to build a name→key
// index, then on every invocation scans the text for those names and
// replaces them with clickable anchors. Skips the focal player's own
// name (the row already labels them separately) so we don't render the
// link twice on the same row. Case-insensitive match; longest-name-first
// so "Jose Vasquez" beats "Jose" when both are tracked.
let _NAME_INDEX = null;
function _buildNameIndex() {
  const map = new Map();          // lower-name → player_key (longest-name-first wins)
  const all = [];
  for (const arr of ["players", "graduates", "inactive"]) {
    for (const p of (DATA[arr] || [])) {
      if (p.player_name && p.player_key) all.push(p);
    }
  }
  // Insert sorted by name length descending so when we build a single
  // alternation regex, the longer names are tried first.
  all.sort((a, b) => b.player_name.length - a.player_name.length);
  for (const p of all) {
    const lc = p.player_name.toLowerCase();
    if (!map.has(lc)) map.set(lc, p.player_key);
  }
  return map;
}
function _nameIndex() {
  if (_NAME_INDEX == null) _NAME_INDEX = _buildNameIndex();
  return _NAME_INDEX;
}
function highlightTrackedNamesInText(text, excludeKey) {
  if (!text) return "";
  const idx = _nameIndex();
  // Build the alternation pattern in a single pass so we don't recompile
  // regexes per call.
  const names = [...idx.keys()].sort((a, b) => b.length - a.length);
  if (!names.length) return escapeHtml(text);
  // Escape regex specials and join with |. Cap the alternation to a
  // sane size — even with all tracked names it'll be <1MB of pattern.
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  // Performance note: we do this scan on each render. The alternation
  // regex caches inside the same function so subsequent calls reuse it.
  const re = new RegExp("\\b(" + names.map(escRe).join("|") + ")\\b", "gi");
  // Process the string in chunks: each regex match becomes an anchor;
  // surrounding text is HTML-escaped.
  const out = [];
  let lastIdx = 0;
  let m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > lastIdx) out.push(escapeHtml(text.slice(lastIdx, m.index)));
    const matched = m[0];
    const key = idx.get(matched.toLowerCase());
    if (!key || key === excludeKey) {
      out.push(escapeHtml(matched));
    } else {
      out.push(`<a href="#player=${escapeHtml(key)}" onclick="event.preventDefault();event.stopPropagation();goToPlayer('${escapeHtml(key)}');" style="color:var(--neon-cyan);text-decoration:none;">${escapeHtml(matched)}</a>`);
    }
    lastIdx = m.index + matched.length;
  }
  if (lastIdx < text.length) out.push(escapeHtml(text.slice(lastIdx)));
  return out.join("");
}

// Player headshot helper. Pulls from MLB's Cloudinary CDN — same path
// MLB.com uses on player profiles, and Cloudinary's d_people:generic
// transform returns a silhouette placeholder when the player has no
// headshot on file, so missing-image cases handle themselves without
// our own fallback. For players we don't have an mlbam_id for (older
// IFAs, some pre-resolution prospects) we render an inline SVG
// silhouette in a circle so the layout still has something to point to.
function headshotURL(mlbamId, sizePx) {
  if (!mlbamId) return null;
  // Cloudinary returns the requested resolution; we request 2x for
  // sharp rendering on retina displays.
  const r = Math.max(60, Math.round(sizePx * 2));
  return `https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_${r},q_auto:best/v1/people/${mlbamId}/headshot/67/current`;
}
function headshotHTML(player, sizePx = 36) {
  const id = (player && (player.mlbam_id || (player.statline || {}).mlbam_id));
  // Baseball-card aspect: width ≈ 0.8 × height. MLB's stock headshots
  // are framed shoulders-up with portrait proportions, so a rounded
  // rectangle reads as "baseball card" rather than the previous
  // circular avatar treatment.
  const h = sizePx;
  const w = Math.round(sizePx * 0.8);
  const sil = `<svg viewBox="0 0 24 24" aria-hidden="true" style="position:absolute;left:15%;top:15%;width:70%;height:70%;color:var(--text-tertiary);"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
  const wrap = `width:${w}px;height:${h}px;border-radius:3px;flex-shrink:0;background:var(--bg-tertiary);border:1px solid var(--border);overflow:hidden;display:inline-block;position:relative;vertical-align:middle;`;
  // Dashed border for the placeholder case so amateur / IFA prospects
  // without an MLBAM ID don't look like a missing image — the dashed
  // edge reads as "no headshot on file" rather than "broken render".
  const placeholderWrap = `width:${w}px;height:${h}px;border-radius:3px;flex-shrink:0;background:var(--bg-tertiary);border:1px dashed var(--border);overflow:hidden;display:inline-block;position:relative;vertical-align:middle;`;
  if (!id) {
    return `<span class="headshot" style="${placeholderWrap}">${sil}</span>`;
  }
  const url = headshotURL(id, h);
  // The silhouette renders behind the img; onerror hides the img so the
  // silhouette shows through if Cloudinary 404s (rare).
  return `<span class="headshot" style="${wrap}">
    ${sil}
    <img src="${url}" alt="" loading="lazy"
         style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;"
         onerror="this.style.display='none'"/>
  </span>`;
}
// Render a team logo with an inline fallback when the CDN 404s. `size`
// must match a CSS class suffix (sm, md, lg, xl).
function teamLogoHTML(org, size = "sm", title = null) {
  if (!org) return "";
  const url = teamLogoURL(org);
  if (!url) {
    return `<span class="team-logo team-logo-${size} team-logo-fallback">${escapeHtml(org)}</span>`;
  }
  const t = title != null ? title : org;
  return `<img class="team-logo team-logo-${size}" src="${url}" alt="${escapeHtml(org)}" title="${escapeHtml(t)}" loading="lazy" onerror="this.outerHTML='<span class=&quot;team-logo team-logo-${size} team-logo-fallback&quot;>${escapeHtml(org)}</span>';">`;
}

// Performance-vs-level pill. Reads sl.level_plus_pct, sl.ops_plus_level
// (hitters) or sl.era_minus_level (pitchers). Returns "" when stats
// aren't yet available — the pill should never show as a question mark.
function levelPlusHTML(sl) {
  if (!sl || sl.level_plus_pct == null) return "";
  const pct = sl.level_plus_pct;
  const stat = sl.is_pitcher ? "ERA-" : "OPS+";
  const baseValue = sl.is_pitcher ? sl.era_minus_level : sl.ops_plus_level;
  // Threshold ±5% as the "okay" band so noise doesn't flip the color.
  const cls = pct >= 5 ? "lvl-good" : pct <= -5 ? "lvl-bad" : "lvl-okay";
  const sign = pct > 0 ? `+${pct}` : `${pct}`;
  const title = `${stat} ${baseValue} (${sign}% vs ${escapeHtml(sl.level || "?")} mean)`;
  return `<span class="lvl-plus ${cls}" title="${title}">${sign}% vs lvl</span>`;
}

// MLB roster / options chip for the player-meta line. Only renders for
// prospects on the 40-man or with options already burned — non-40-man
// minor leaguers haven't entered the options system yet, so the chip
// would be visual noise. Tooltip carries debut date + service phase.
function rosterTagHTML(p) {
  const rs = p && p.roster_status;
  if (!rs) return "";
  const usedYrs = rs.options_used_years || [];
  if (!rs.on_40_man && usedYrs.length === 0) return "";
  const total = 3;
  const used = Math.min(total, rs.options_used || 0);
  const remaining = (rs.options_remaining != null)
    ? rs.options_remaining
    : Math.max(0, total - used);
  // pip-style mini visual: filled = used, hollow = remaining.
  const pip = filled => `<span style="display:inline-block;width:6px;height:6px;border-radius:50%;border:1px solid currentColor;background:${filled ? "currentColor" : "transparent"};margin:0 1px;vertical-align:middle;"></span>`;
  const pips = Array.from({length: total}, (_, i) => pip(i < used)).join("");
  const tip = [
    rs.mlb_debut_date ? `MLB debut ${rs.mlb_debut_date}` : null,
    rs.on_40_man ? "On 40-man" : "Off 40-man",
    `Options: ${used}/${total} used${usedYrs.length ? ` (${usedYrs.join(", ")})` : ""}`,
    `Service: ${rs.service_phase}`,
  ].filter(Boolean).join(" · ");
  // Color hint: cyan when options remain, amber when out (or 1 left), red on 0.
  const color = remaining === 0 ? "var(--down)"
              : remaining === 1 ? "var(--neon-amber)"
                                : "var(--neon-cyan)";
  return `<span class="options-tag" title="${escapeHtml(tip)}" style="display:inline-flex;align-items:center;gap:4px;border:1px solid ${color};color:${color};font-family:var(--font-mono);font-size:10px;padding:2px 6px;border-radius:2px;letter-spacing:0.04em;line-height:1;">
    ${pips}
    <span>${remaining}/${total}</span>
  </span>`;
}

// IL badge for the player-meta line. Returns an empty string when the
// player isn't on IL; otherwise an amber pill showing the list type and
// duration in days. Tooltip carries the placement description.
// Player meta line: "pos · ORG-logo ORG age N.N [IL] [roster]" rendered
// on every player row across Active, Spotlights, Injured, Traded,
// Graduates, and farm-detail rosters. Flex layout lives on `.player-meta`
// in the CSS block — opts control which tail badges appear.
function playerMetaHTML(p, opts = {}) {
  const { showIL = true, showRoster = true } = opts;
  const ageNum = p.age != null ? Number(p.age) : null;
  const ageTag = ageNum != null && !isNaN(ageNum)
    ? `<span class="age-tag">age ${ageNum.toFixed(1)}</span>`
    : "";
  const ilTag = showIL ? ilTagHTML(p) : "";
  const rosterTag = showRoster ? rosterTagHTML(p) : "";
  return `<div class="player-meta">${escapeHtml(p.position ?? "—")} · ${teamLogoHTML(p.org, "sm")}<span>${escapeHtml(p.org ?? "—")}</span>${ageTag}${ilTag}${rosterTag}</div>`;
}

function ilTagHTML(p) {
  const il = p && p.il_status;
  if (!il || !il.is_on_il) return "";
  let days = null;
  if (il.since) {
    const ms = Date.now() - new Date(il.since + "T00:00:00").getTime();
    if (!isNaN(ms) && ms > 0) days = Math.floor(ms / 86400000);
  }
  const typeLabel = il.type ? escapeHtml(il.type) + " IL" : "IL";
  const dayLabel = days != null ? ` · ${days}d` : "";
  const title = il.description
    ? escapeHtml(il.description) + (days != null ? `\n${days} days` : "")
    : `On ${typeLabel}${il.since ? ` since ${escapeHtml(il.since)}` : ""}`;
  return `<span class="il-tag" title="${title}">${typeLabel}${dayLabel}</span>`;
}

// Count how many of the Active-list filter dimensions are off the
// default "all" value. Used to badge the mobile "Filters" toggle so
// the user knows hidden filters are active.
function activeFilterCount() {
  let n = 0;
  if (state.stockFilter   !== "all")     n++;
  if (state.healthFilter  !== "all")     n++;
  if (state.spreadFilter && state.spreadFilter !== "all") n++;
  if (state.orgFilter     !== "all")     n++;
  if (state.acqFilter     !== "all")     n++;
  if (state.sort          !== "fv")      n++;
  if (state.levelFilter   !== "all")     n++;
  if (state.posFilter     !== "all")     n++;
  return n;
}

function updateMeta() {
  const filterCountEl = document.getElementById("filter-toggle-count");
  if (filterCountEl) {
    const n = activeFilterCount();
    filterCountEl.textContent = n ? `· ${n} active` : "";
  }
  const refreshedAt = DATA.generated_at ? DATA.generated_at.split("T")[0] : "—";
  const meta = document.getElementById("meta-line");
  meta.innerHTML = `Last refresh: <code>${refreshedAt}</code>` +
    `<span class="dot">·</span>${DATA.total_tracked ?? (DATA.players.length + DATA.graduates.length)} prospects tracked` +
    `<span class="dot">·</span>${DATA.active_count} active` +
    `<span class="dot">·</span>${DATA.graduate_count} graduates`;
  // "Acquired" pool size = every active prospect for whom we can
  // resolve a most-recent inbound move (trade / waiver / draft / IFA /
  // etc.). Practically that's nearly every active player; the section
  // count surfaces how many match the active filters.
  const tradedCount = (DATA.players || []).reduce((n, p) => n + (latestAcquisition(p) ? 1 : 0), 0);
  const spotlightCount = ((DATA.spotlights || {})[state.spotlightBucket] || []).length;
  const countMap = {
    active:       `${getFilteredActives().length} of ${DATA.active_count}`,
    spotlights:   `${spotlightCount} ${state.spotlightBucket.replace("_", " ")}`,
    traded:       `${getFilteredTraded().length} of ${tradedCount}`,
    graduates:    `${getFilteredGrads().length} of ${DATA.graduate_count}`,
    farm:         `${(DATA.org_summary || []).length} organizations`,
    leaderboards: `top 25 ${state.lbSeason || new Date().getUTCFullYear()} by ${(LB_STATS[state.lbStat] || LB_STATS.ops).label}`,
  };
  document.getElementById("section-count").textContent = countMap[state.section] || "";
}

// =============================================================================
// FARM SYSTEMS
// =============================================================================

// Tiers descending; matches the fvClass thresholds used for badge colors.
const TIER_BUCKETS = [80, 75, 70, 65, 60, 55, 50, 45, 40, 35, 30, 25, 20];

// Form bar — small sparkline on each farm row showing the org's
// cumulative-FV growth above (or below) the league-mean farm system over
// the active window (1y / 3y / 5y). We clip the series to the window,
// anchor every org's curve at zero on its first in-window point, then
// subtract a linear baseline of `meanTrajectory * (t/windowDays)` so the
// line represents "FV gained beyond what the average farm gained". A flat
// line at zero ≈ tracking the league mean; a rising line ≈ developing
// prospects faster than peers. Graduations stay neutral in the upstream
// series so a productive farm isn't punished for promoting its stars.
//
// The trailing badge shows the org's delta-above-mean for the window
// (precomputed server-side as `delta_above_mean[window]`), which is
// what the sort chip and grade signal also key off.
const FORM_BAR_W = 130;
const FORM_BAR_H = 26;
const FORM_WINDOW_DAYS = { "1y": 365, "3y": 365 * 3, "5y": 365 * 5 };

function makeFarmSparkline(fvHistory, deltaAboveMean, meanTrajectory, windowKey) {
  const series = fvHistory || [];
  const windowDays = FORM_WINDOW_DAYS[windowKey] || 365;
  const baseline = meanTrajectory || 0;

  if (series.length < 2) {
    return `<div class="tier-bar" style="gap:6px;">
      <svg width="${FORM_BAR_W}" height="${FORM_BAR_H}" style="border-radius:2px;overflow:hidden;flex-shrink:0">
        <line x1="0" y1="${FORM_BAR_H / 2}" x2="${FORM_BAR_W}" y2="${FORM_BAR_H / 2}"
              stroke="var(--border)" stroke-width="1.5" stroke-dasharray="3,3"/>
      </svg>
      <span style="color:var(--text-tertiary);font-size:10px;">no history</span>
    </div>`;
  }

  // Clip the series to the trailing window. Always include at least two
  // anchor points so a long-quiet org still gets a baseline to draw from.
  const cutoffMs = Date.now() - windowDays * 24 * 60 * 60 * 1000;
  const cutoffIso = new Date(cutoffMs).toISOString().slice(0, 10);
  let recent = series.filter(s => s.date >= cutoffIso);
  if (recent.length < 2) recent = series.slice(-2);

  // Per-org growth relative to the first in-window point, then minus the
  // league mean's linear baseline at the same time fraction. Result: y=0
  // ≈ tracking the mean; positive ≈ above mean; negative ≈ below.
  const startMs = new Date(recent[0].date).getTime();
  const endMs   = new Date(recent[recent.length - 1].date).getTime();
  const spanMs  = Math.max(endMs - startMs, 1);
  const startFv = recent[0].total_fv;
  const rel = recent.map(s => {
    const t = (new Date(s.date).getTime() - startMs) / spanMs;  // [0..1]
    const baselineGain = baseline * t;  // mean's expected gain by fraction t of the window
    return {
      x: t,
      v: (s.total_fv - startFv) - baselineGain,
    };
  });

  // Scale around zero so the mean (y=0) is always visible — that's the
  // comparison the user is making. Pad the range slightly so a perfectly
  // flat line doesn't sit at the very edge.
  const vals = rel.map(p => p.v);
  const absMax = Math.max(1, ...vals.map(Math.abs));
  const padY = 2;
  const innerH = FORM_BAR_H - 2 * padY;
  const zeroY = padY + innerH / 2;
  const yFor = v => zeroY - (v / absMax) * (innerH / 2);
  const points = rel.map(p =>
    `${(p.x * FORM_BAR_W).toFixed(1)},${yFor(p.v).toFixed(1)}`
  ).join(' ');

  // Color + arrow keyed off the precomputed delta-above-mean for the
  // window. The dead zone scales with the mean's magnitude so the
  // threshold for "essentially average" makes sense whether you're
  // looking at 1y (mean ~ a few hundred FV-points) or 5y (mean in
  // the thousands). Falls back to a hard minimum of 5 so unconfigured
  // windows still get a coherent answer.
  const delta = deltaAboveMean || 0;
  const deadZone = Math.max(5, Math.abs(baseline) * 0.05);
  const stroke = delta >  deadZone ? 'var(--up)'
              : delta < -deadZone ? 'var(--down)'
              :                     'var(--text-tertiary)';
  const arrow  = delta >  deadZone ? '▲'
              : delta < -deadZone ? '▼'
              :                     '·';
  const sign   = delta > 0 ? '+' : '';
  const deltaLabel = `${arrow}${sign}${delta.toFixed(1)}`;

  // Mean baseline reference at y=0. A faint dashed line gives the eye
  // an anchor to compare each org's curve against.
  const baselineLine = `<line x1="0" y1="${zeroY.toFixed(1)}" x2="${FORM_BAR_W}" y2="${zeroY.toFixed(1)}"
        stroke="var(--text-tertiary)" stroke-width="0.7" stroke-dasharray="2,2" opacity="0.55"/>`;
