    "45":  {surplus_musd: 14.5,  ctrl_war: 2.50,  star_odds: 0.035}
    "45+": {surplus_musd: 18.5,  ctrl_war: 3.20,  star_odds: 0.060}
    "50":  {surplus_musd: 45.0,  ctrl_war: 7.00,  star_odds: 0.135}
    "55":  {surplus_musd: 55.0,  ctrl_war: 8.00,  star_odds: 0.175}
