# VALUATION SET: clemens_2026
# =============================================================================
# The FanGraphs / Ben Clemens (2026) published prospect-valuation framework.
# All tier values were FETCHED from the three source posts on 2026-07-03 and
# checksum-validated by valuation_sets._validate_checksums (do NOT hand-edit a
# tier value without re-checking the source; a drift beyond rounding refuses to
# load). Dollars are MILLIONS of nominal 2026 USD. ctrl_war is total expected
# WAR over the team-control window; star_odds is P(>=2 control seasons of >=4
# WAR). Tier surplus/WAR/star split by role (hitter vs pitcher).
id: clemens_2026
label: "FanGraphs / Ben Clemens (2026)"

meta:
  retrieval_date: "2026-07-03"
  sources:
    intro: "https://blogs.fangraphs.com/introducing-an-updated-method-for-prospect-valuation/"
    methodology: "https://blogs.fangraphs.com/the-details-of-our-new-prospect-valuation-methodology/"
    cost_of_win: "https://blogs.fangraphs.com/what-are-teams-paying-for-a-win-in-free-agency-2026-edition/"
  win_cost_basis: >-
    Free-agency cost of a win, 2024-2026 average, graduated by production
    (per-player bucket rates keyed to that season's WAR). The methodology post
    states the framework used "the average prevailing cost of a win in free
    agency from 2024 to 2026". The cost-of-win post publishes only 2026-only and
    a 2020-2026 average; the 2024-2026 figures below are the mean of the post's
    2024/2025/2026 per-tier rows.
  caveats:
    - >-
      Backcast hindsight bias: tier surplus and star odds were estimated on
      2005-2018 grade history (Baseball America Top 100 for 2005-2016 plus
      FanGraphs 2017-2018), with ordinals quantile-mapped onto the modern FV
      distribution so a 70 FV means the same thing every year.
    - >-
      The 70 FV surplus is a plausible RANGE of $150M-$200M under alternate
      calibrations; the table lists the $195M central value.
    - >-
      The upgrade-option figures (a 45 FV position player ~20% likely to upgrade
      to 50+, ~$7M if never upgraded, blending to ~$16M) are NOT in the published
      tier tables; they are a Phase-7 config-prior reference only, estimated on
      2019-2023 grade history in the source.
    - >-
      Residence time (2.0y central, 1.9-2.5 band) is used ONLY for the sub-50
      stock->flow aggregate reconciliation, never for per-player pricing.

# --- Published FV x role tier table (calibration target + table-mode prices) ---
