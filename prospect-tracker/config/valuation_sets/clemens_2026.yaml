    "45":  {surplus_musd: 9.5,   ctrl_war: 1.60,  star_odds: 0.015}
    "45+": {surplus_musd: 15.0,  ctrl_war: 2.60,  star_odds: 0.030}
    "50":  {surplus_musd: 33.5,  ctrl_war: 5.00,  star_odds: 0.070}
    "55":  {surplus_musd: 45.0,  ctrl_war: 7.00,  star_odds: 0.070}
    "60":  {surplus_musd: 70.0,  ctrl_war: 11.00, star_odds: 0.210}
    "65":  {surplus_musd: 95.0,  ctrl_war: 13.50, star_odds: 0.400}
    "70":  {surplus_musd: 195.0, ctrl_war: 27.00, star_odds: 0.875}

# --- Global valuation parameters (the kernel / salary / discount inputs) ---
params:
  # Graduated FA cost of a win, 2024-2026 average ($M / WAR), keyed to the
  # season's own WAR. breakpoints are WAR thresholds [<1 -> lt_1, <2 -> 1_to_2,
  # else 2plus]. These published figures fix the SHAPE (the rate ratios) and are
  # checksummed as FanGraphs printed them.
  # level: fa_winter (VAL_1, owner decision FP2-1, 2026-09-25): prices at ONE
  # level for prospect and veteran surplus, the free-agent winter level /fa/ and
  # /projections/ price at (data/fa_dpw_series.json pricing.level_usd, written by
  # fa_market.write_dpw_series), with this shape rescaled to it. It replaced
  # disable_fa_implied: true, under which a prospect win cost the FanGraphs
  # $11.74M while a veteran win cost the signings-implied level inside the
  # same Trade Machine and Club Ledger totals.
  win_cost:
    breakpoints: [1.0, 2.0]
    rates_musd: {lt_1: 6.97, "1_to_2": 8.76, "2plus": 13.63}
    flat_musd: 11.74
    level: fa_winter
  # Arbitration: percent of the PRIOR season's FA-equivalent value, Arb 1-4.
  # 3 pre-arb (league min) + 4 arb over a 7-season control window.
  arbitration:
    schedule: [0.15, 0.35, 0.50, 0.75]
    basis: prior_season
    pre_arb_years: 3
  control:
    years: 7
    basis: roster_day
  # Net 7% discount = a 10% discount rate minus 3% annual win-cost growth. We
  # apply the exact net-7%-flat branch (engine infl=0, discount_rate=0.07); the
  # prompt forbids applying both growth and net at once.
  discount:
    net_rate: 0.07
    form: net_7_flat
  star:
    min_seasons: 2
    war_threshold: 4.0
    window: control
  residence:
    central_years: 2.0
    band: [1.9, 2.5]
