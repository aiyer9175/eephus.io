    "40":  {surplus_musd: 1.5,   ctrl_war: 1.14}
    "40+": {surplus_musd: 2.6,   ctrl_war: 1.50}
    "45":  {surplus_musd: 4.5,   ctrl_war: 1.86}
    "45+": {surplus_musd: 14.8,  ctrl_war: 2.94}
    "50":  {surplus_musd: 17.7,  ctrl_war: 4.02}
    "55":  {surplus_musd: 33.2,  ctrl_war: 5.88}
    "60":  {surplus_musd: 63.9,  ctrl_war: 8.64}
    "65":  {surplus_musd: 111.1, ctrl_war: 12.00}
    "70":  {surplus_musd: 157.9, ctrl_war: 15.12}
