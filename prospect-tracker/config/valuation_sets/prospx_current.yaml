# =============================================================================
# VALUATION SET: prospx_current  (alias: edwards_2019)
# =============================================================================
# The CURRENT production surplus engine, captured so table mode reproduces the
# live board and the legacy pipeline stays reproducible.
#
# NAMING: the recalibration prompt called this legacy set "edwards_2019", but the
# live anchors are NOT raw Edwards 2019 -- fv_to_6yr_avg_war was empirically
# re-anchored (v47) to realized 2017-2020 cohort outcomes, deliberately
# de-inflating surplus to ~0.7-1.2x the public scale (see
# docs/surplus-recalibration.md). We name it honestly as prospx_current and keep
# edwards_2019 as an alias (valuation_sets._ALIASES).
#
# tiers.*.surplus_musd are the LIVE engine outputs captured 2026-07-04 from
# value_framework.surplus_value_mm(fv, is_pitcher) at each tier axis FV; table
# mode with this set reproduces those production numbers at the tier grid.
# ctrl_war = fv_to_6yr_avg_war(fv) * 6 (the legacy 6-year control window).
# star_odds is intentionally ABSENT: the legacy engine does not compute
# P(>=2 seasons of >=4 WAR); Phase 4 backfills it once star_odds ships.
id: prospx_current
label: "PROSPX current production (v47 empirical; Edwards-lineage anchors)"

meta:
  retrieval_date: "2026-07-04"
  sources:
    engine: "value_framework.surplus_value_mm (v2.0 career-path mixture)"
    recalibration: "docs/surplus-recalibration.md (v47 empirical re-anchor)"
  win_cost_basis: >-
    FA-signings-implied $/WAR (data/fa_dpw_series.json, trailing 3-winter mean),
    convex shape from the 2024-2026 FA cost-of-win table.
  caveats:
    - >-
      NOT the public Edwards 2019 scale: fv_to_6yr_avg_war is the realized
      2017-2020 bust-inclusive WAR/yr, blended toward the Edwards public
      reference only at thin/censored tiers.
    - >-
      star_odds is absent by design; the legacy engine has no P(>=2x 4-WAR)
      output. Phase 4 backfills it.

# --- Captured live production tier table (table-mode prices) ---
# RE-CAPTURED 2026-07-24b under the LANE B1 linearmap-v5 surplus calibration
# (accuracy re-fit superseding the v4 that was live ~1 hour the same day; v5 minimizes
# held-out MAE + drives slope->1.0, docs/efv-2026-07-24/GATES-ACCURACY.md B1). This file's
# contract is "table mode reproduces current production" so the snapshot re-captures on an
# intended production move. Grid history preserved for audit:
#   v4 2026-07-24 hitter: 35+ 1.9 / 40 2.3 / 40+ 4.4 / 45 9.3 / 45+ 22.1 / 50 31.6 / 55 47.3 / 60 76.6 / 65 121.6 / 70 166.2
#   v4 2026-07-24 pitcher: 35+ 1.9 / 40 2.2 / 40+ 3.3 / 45 5.6 / 45+ 10.2 / 50 23.2 / 55 37.3 / 60 63.5 / 65 104.4 / 70 144.6
#   v3 2026-07-04 hitter: 35+ 1.4 / 40 1.5 / 40+ 2.6 / 45 4.5 / 45+ 14.8 / 50 17.7 / 55 33.2 / 60 63.9 / 65 111.1 / 70 157.9
# ctrl_war is calibration-independent (fv_to_6yr_avg_war*6) and unchanged.
tiers:
  # RE-CAPTURED 2026-07-29. Two independent things moved, and they are worth keeping
  # straight because only one of them is this program's doing.
  #
  # surplus_musd drifted BEFORE this program. The 2026-07-24 v5 calibration ship moved
  # served pricing and the mandated coordinated re-capture never ran, so the frozen
  # table sat about 16% below the live engine at FV50 (28.2 against 32.8) and 16 of
  # these acceptance cases were red on arrival. The dollars below are the engine's
  # current output; the prices readers have been seeing were already these.
  #
  # ctrl_war moved BECAUSE of this program: it is fv_to_6yr_avg_war * 6, and the
  # sub-45 anchor knots were amended on 2026-07-29 (see
  # data/value_framework_fitted.json empirical_anchors.anchors_provenance). The bottom
  # three cells fall hard because the old table declared one constant 0.19 WAR/yr for
  # every grade from 20 to 40: 35+ 1.14 -> 0.32, 40 1.14 -> 0.52, 40+ 1.50 -> 1.19.
  # Grades 45 and up are unchanged in BOTH columns, by design.
  #
  # Grid history: v3 17.7 -> v4 31.6 -> v5 28.2 -> now 32.8 at FV50 hitter.
  hitter:
    "35+": {surplus_musd: 0.0,   ctrl_war: 0.32}
    "40":  {surplus_musd: 0.4,   ctrl_war: 0.52}
    "40+": {surplus_musd: 6.1,   ctrl_war: 1.19}
    "45":  {surplus_musd: 11.7,  ctrl_war: 1.86}
    "45+": {surplus_musd: 22.0,  ctrl_war: 2.94}
    "50":  {surplus_musd: 32.8,  ctrl_war: 4.02}
    "55":  {surplus_musd: 52.8,  ctrl_war: 5.88}
    "60":  {surplus_musd: 90.5,  ctrl_war: 8.64}
    "65":  {surplus_musd: 148.5, ctrl_war: 12.00}
    "70":  {surplus_musd: 206.0, ctrl_war: 15.12}
  pitcher:
    "35+": {surplus_musd: 0.0,   ctrl_war: 0.32}
    "40":  {surplus_musd: 0.2,   ctrl_war: 0.52}
    "40+": {surplus_musd: 3.8,   ctrl_war: 1.19}
    "45":  {surplus_musd: 7.4,   ctrl_war: 1.86}
    "45+": {surplus_musd: 14.8,  ctrl_war: 2.94}
    "50":  {surplus_musd: 23.2,  ctrl_war: 4.02}
    "55":  {surplus_musd: 39.8,  ctrl_war: 5.88}
    "60":  {surplus_musd: 73.6,  ctrl_war: 8.64}
    "65":  {surplus_musd: 126.3, ctrl_war: 12.00}
    "70":  {surplus_musd: 178.1, ctrl_war: 15.12}

# --- Global valuation parameters ---
# MIRROR of value_framework_config.yaml at capture, for documentation and diff
# comparison. These are NOT re-applied for the default set: value_framework keeps
# the base config authoritative so production output stays byte-identical.
params:
  win_cost:
    breakpoints: [1.0, 2.0]
    rates_musd: {lt_1: 6.97, "1_to_2": 8.76, "2plus": 13.63}
    flat_musd: 11.74
    disable_fa_implied: false   # production leaves the FA-implied rescale ON
  arbitration:
    schedule: [0.40, 0.60, 0.80]
    basis: current_season
    pre_arb_years: 3
  control:
    years: 6
    basis: service_time
  discount:
    form: rate_minus_growth
    rate: 0.09
    growth: 0.05
