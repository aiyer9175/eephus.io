# =============================================================================
# VALUATION SET: prospx_current  (alias: edwards_2019)
# =============================================================================
# The CURRENT production surplus engine, captured so table mode reproduces the
# live board and the legacy pipeline stays reproducible.
#
# NAMING: the recalibration prompt called this legacy set "edwards_2019", but the
# live anchors are NOT raw Edwards 2019 -- fv_to_6yr_avg_war was empirically
# re-anchored (v47) to realized 2017-2020 cohort outcomes, deliberately
# de-inflating surplus to ~0.7-1.2x the public scale (see
# docs/surplus-recalibration.md). We name it honestly as prospx_current and keep
# edwards_2019 as an alias (valuation_sets._ALIASES).
#
# tiers.*.surplus_musd are the LIVE engine outputs captured 2026-07-04 from
# value_framework.surplus_value_mm(fv, is_pitcher) at each tier axis FV; table
# mode with this set reproduces those production numbers at the tier grid.
# ctrl_war = fv_to_6yr_avg_war(fv) * 6 (the legacy 6-year control window).
# star_odds is intentionally ABSENT: the legacy engine does not compute
# P(>=2 seasons of >=4 WAR); Phase 4 backfills it once star_odds ships.
id: prospx_current
label: "PROSPX current production (v47 empirical; Edwards-lineage anchors)"

meta:
  retrieval_date: "2026-07-04"
  sources:
    engine: "value_framework.surplus_value_mm (v2.0 career-path mixture)"
    recalibration: "docs/surplus-recalibration.md (v47 empirical re-anchor)"
  win_cost_basis: >-
    FA-signings-implied $/WAR (data/fa_dpw_series.json, trailing 3-winter mean),
    convex shape from the 2024-2026 FA cost-of-win table.
  caveats:
    - >-
      NOT the public Edwards 2019 scale: fv_to_6yr_avg_war is the realized
      2017-2020 bust-inclusive WAR/yr, blended toward the Edwards public
      reference only at thin/censored tiers.
    - >-
      star_odds is absent by design; the legacy engine has no P(>=2x 4-WAR)
      output. Phase 4 backfills it.

# --- Captured live production tier table (table-mode prices) ---
# RE-CAPTURED 2026-07-24b under the LANE B1 linearmap-v5 surplus calibration
# (accuracy re-fit superseding the v4 that was live ~1 hour the same day; v5 minimizes
# held-out MAE + drives slope->1.0, docs/efv-2026-07-24/GATES-ACCURACY.md B1). This file's
# contract is "table mode reproduces current production" so the snapshot re-captures on an
# intended production move. Grid history preserved for audit:
#   v4 2026-07-24 hitter: 35+ 1.9 / 40 2.3 / 40+ 4.4 / 45 9.3 / 45+ 22.1 / 50 31.6 / 55 47.3 / 60 76.6 / 65 121.6 / 70 166.2
#   v4 2026-07-24 pitcher: 35+ 1.9 / 40 2.2 / 40+ 3.3 / 45 5.6 / 45+ 10.2 / 50 23.2 / 55 37.3 / 60 63.5 / 65 104.4 / 70 144.6
#   v3 2026-07-04 hitter: 35+ 1.4 / 40 1.5 / 40+ 2.6 / 45 4.5 / 45+ 14.8 / 50 17.7 / 55 33.2 / 60 63.9 / 65 111.1 / 70 157.9
#   v6 2026-07-31 hitter: 35+ 2.5 / 40 3.3 / 40+ 10.8 / 45 21.6 / 45+ 33.0 / 50 43.4 / 55 61.9 / 60 97.0 / 65 150.7 / 70 204.0
#   v6 2026-07-31 pitcher: 35+ 2.0 / 40 2.9 / 40+ 7.7 / 45 12.2 / 45+ 25.0 / 50 34.3 / 55 49.9 / 60 81.3 / 65 130.2 / 70 178.2
# ctrl_war is calibration-independent (fv_to_6yr_avg_war*6) and unchanged.
tiers:
  # RE-CAPTURED 2026-09-04 for the eWAR LABEL EPOCH (WAR_BASIS_RUNBOOK step J), taken
  # INSIDE `with vf.valuation_set("prospx_current")` so the capture prices off this set's
  # own engine and not the default one. surplus_musd moves by at most 1.3 up and 3.5 down
  # (FV70 hit 226.7 -> 223.2). ctrl_war moves at the BOTTOM because the sub-45 anchor knots
  # were re-measured on the eWAR label after the routine --fit reverted them: 35+ 0.32 ->
  # 0.23 and 40 0.52 -> 0.43. The 45-and-up ctrl_war values move only with the refit.
  # RE-CAPTURED 2026-08-04 for the R7 dpw RE-ANCHOR (owner-approved flip).
  # The FA-signings-implied $/WAR series was regenerated and the 2026 winter
  # moved 14.92M -> 17.29M (+15.9%), trailing-3 mean 14.89M -> 16.61M (+11.6%),
  # so every served price was on a stale winter market. Captured INSIDE
  # `with vf.valuation_set("prospx_current")` (the 2026-07-24 lesson: capturing
  # on the default set silently yields a different grid). ctrl_war UNCHANGED -
  # the anchors did not move, only the win cost did.
  # Superseded: RE-CAPTURED 2026-07-31 for the v6 EV-FRAME calibration (owner decision:
  # docs/efv-2026-07-30/SURPLUS_EV_OBJECTIVE.md). surplus_musd is the live engine
  # again; ctrl_war is UNCHANGED because the anchors did not move, only the pricing
  # layer did.
  #
  # What moved and why: surplus is now an EXPECTED-VALUE quantity. The v5 map floored
  # every raw surplus under $1.677M at exactly $0, which was MAE-optimal (86-90% of the
  # bottom bins realise nothing, so their median is 0) and wrong as a PRICE (their mean
  # is $1.7M-$5.9M). The 35+ tier therefore leaves $0 for the first time on both sides:
  # hitter 0.0 -> 2.5, pitcher 0.0 -> 2.0.
  #
  # The SHAPE of the move is the tell that this is a median->mean switch and not a
  # revaluation: the top barely moves (hitter 70 206.0 -> 204.0, pitcher 70 178.1 ->
  # 178.2) because up there the median and the mean are the same player, while the
  # bottom and middle lift hard (hitter 45 11.7 -> 21.6, pitcher 45+ 14.8 -> 25.0)
  # because that is where the two diverge.
  #
  # Grid history at FV50 hitter: v3 17.7 -> v4 31.6 -> v5 28.2 -> 32.8 (07-29 recapture)
  # -> 43.4 now.
  #
  # NOTE for the next person to re-capture this file: price the engine INSIDE
  # `with vf.valuation_set("prospx_current")`. This is the base-identity set (6 control
  # years), not the clemens_2026 default (7), and test_valuation_sets compares against
  # the engine in that context. Capturing on the default silently yields a different
  # grid -- pitcher 60 reads 75.2 there against the correct 81.3.
  hitter:
    "35+":  {surplus_musd: 2.5,   ctrl_war: 0.23}
    "40":   {surplus_musd: 3.3,   ctrl_war: 0.43}
    "40+":  {surplus_musd: 12.2,   ctrl_war: 1.17}
    "45":   {surplus_musd: 24.4,   ctrl_war: 1.92}
    "45+":  {surplus_musd: 36.9,   ctrl_war: 3.0}
