    "40+": {surplus_musd: 2.1,   ctrl_war: 1.50}
    "45":  {surplus_musd: 2.9,   ctrl_war: 1.86}
    "45+": {surplus_musd: 8.5,   ctrl_war: 2.94}
    "50":  {surplus_musd: 15.2,  ctrl_war: 4.02}
