    "55":   {surplus_musd: 68.1,   ctrl_war: 5.88}
    "60":   {surplus_musd: 107.2,   ctrl_war: 8.64}
    "65":   {surplus_musd: 168.4,   ctrl_war: 12.06}
    "70":   {surplus_musd: 223.2,   ctrl_war: 14.94}
  pitcher:
