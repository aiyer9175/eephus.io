# Staff Gems role map (stage 1). Read by staff_ingest.py --parse.
#
# Design: docs/staff-gems/DESIGN.md section 4.2. Gate: docs/staff-gems/STAFF_GEMS_GATE.md section 1
# (where the two differ, the gate wins). Every row of a StatsAPI staff list carries a structured
# jobId (MLB's own job code) and a free-text title (the club's wording). The map is applied in
# this order, and the first rule that matches decides:
#
#   1. pairs:  an exact (jobId, title) pair whose title contradicts its job code
#   2. jobs:   a job code that decides the role by itself
#   3. titles: for a job code marked by_title (a generic code such as COAC "Coach"), the exact
#              title, matched after collapsing whitespace and ignoring case
#   4. anything else goes to the REVIEW QUEUE (role "review"): an unmapped job code or an
#      unmapped title is never given a guessed role, by similarity or otherwise.
#
# Roles. Credited (the four gate roles): manager, hitting, pitching, defense. Context only (a name
# beside the running game, never a value, owner answer SG-Q4): first_base, third_base. Not
# credited: excluded (bench coaches, bullpen catchers, generic and performance titles, and the
# coordinators, rovers, directors, analysts and advisors that no dated source covers, owner answer
# SG-Q2 (a)). review: the queue, never used for attribution until a person maps it here by hand.
#
# Hand-mapping rules for titles (applied when the map was written, 2026-10-03, from the census of
# every jobId and title in the 2008 to 2026 cache; recorded so a later edit follows them):
#   - a title naming exactly one credited family takes that family, even beside a duty that is not
#     credited (quality control, strategy, game planning, baserunning, a bench or base-coach duty):
#     "Catching and Quality Control Coach" is defense, "Outfield & Baserunning Coach" is defense;
#   - a title naming two credited families goes to review ("Outfield/Assistant Hitting Coach");
#   - a title naming a family only as coordinator, rover, director, advisor, analyst, strategist
#     or consultant is excluded;
#   - a generic title that could be a family coach goes to review ("Position Coach", "Field
#     Coach", "Fundamentals Coach", an empty title); a generic title that is not a development
#     job is excluded ("Staff Assistant", "Replay Coordinator", "Mental Performance Coach");
#   - catching and outfield titles are defense (field and arm), as the gate maps infield and
#     catching titles by hand; speed and baserunning stay with the organization.

