<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" role="img" aria-label="PROSPX">
  <!-- The full PROSPX mark: the px-ball with the interlocking P/X gothic monogram
       (a la the Yankees / Mets ball-cap marks). Use this at >=48px (app icons,
       large lockups); below that, use compact-mark.svg (ball only - the monogram
       muds at favicon sizes). Colors hardcoded so it stands alone as an export. -->
  <defs>
    <linearGradient id="seam-m" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#B91C1C"/>
      <stop offset="35%"  stop-color="#C9A227"/>
      <stop offset="65%"  stop-color="#1F7A3A"/>
      <stop offset="100%" stop-color="#0E2B4D"/>
    </linearGradient>
  </defs>
  <circle cx="22" cy="22" r="19" fill="#FBF8F0" stroke="#0F1B2D" stroke-width="2"/>
  <path d="M 32 8 Q 40 22 32 36" fill="none" stroke="url(#seam-m)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 32 8 Q 40 22 32 36" fill="none" stroke="#0F1B2D" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1.5 3"/>
  <path d="M 12 8 Q 4 22 12 36" fill="none" stroke="url(#seam-m)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 12 8 Q 4 22 12 36" fill="none" stroke="#0F1B2D" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1.5 3"/>
  <g text-anchor="middle" font-family="'Old English Text MT','UnifrakturCook','Cloister Black',Georgia,'Times New Roman',serif" font-weight="800" fill="#0F1B2D" stroke="#FBF8F0" stroke-width="0.7" paint-order="stroke">
    <text x="18.5" y="30" font-size="22">P</text>
    <text x="26" y="30" font-size="23">X</text>
  </g>
</svg>
