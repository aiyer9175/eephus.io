<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 104" role="img" aria-label="eephus.io">
  <!-- The eephus.io merged wordmark (light). The signature lob arc is PART of the
       lettering: it spans the word with the ball at its apex, painted in the brand
       ramp (cardinal -> gold -> green -> navy). The word is set in the MS Gothic
       retro-mono stack; ".io" carries the gold accent. This is the portable twin of
       build_site.py's eephus_merged_wordmark(); the in-site mark is live text + SVG. -->
  <defs>
    <linearGradient id="ew-arc-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#B91C1C"/>
      <stop offset="38%" stop-color="#C9A227"/>
      <stop offset="68%" stop-color="#1F7A3A"/>
      <stop offset="100%" stop-color="#0E2B4D"/>
    </linearGradient>
  </defs>
  <path d="M 18 56 Q 150 -18 282 56" fill="none" stroke="url(#ew-arc-g)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="150" cy="20" r="9" fill="#F4F0E6" stroke="#0F1B2D" stroke-width="2"/>
  <path d="M 154.5 14 Q 159 20 154.5 26" fill="none" stroke="#0F1B2D" stroke-width="1.3" opacity="0.8"/>
  <path d="M 145.5 14 Q 141 20 145.5 26" fill="none" stroke="#0F1B2D" stroke-width="1.3" opacity="0.8"/>
  <text x="150" y="90" text-anchor="middle" font-family="'MS Gothic','MS UI Gothic','Osaka-Mono','Roboto Mono','VT323',monospace" font-weight="700" font-size="48" letter-spacing="2" fill="#0F1B2D">eephus<tspan fill="#C9A227">.io</tspan></text>
</svg>
