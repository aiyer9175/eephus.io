<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 104" role="img" aria-label="eephus.io">
  <!-- The eephus.io merged wordmark (dark variant) for near-black surfaces. The arc
       uses the dark refractor ramp (cyan -> violet -> magenta -> gold -> mint); the
       word is bright cool-white with a refractor-gold ".io". -->
  <defs>
    <linearGradient id="ew-arc-gd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00D9FF"/>
      <stop offset="30%"  stop-color="#B47CFF"/>
      <stop offset="55%"  stop-color="#FF4FD8"/>
      <stop offset="78%"  stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#4FFF9E"/>
    </linearGradient>
  </defs>
  <path d="M 18 56 Q 150 -18 282 56" fill="none" stroke="url(#ew-arc-gd)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="150" cy="20" r="9" fill="#1A1A1E" stroke="#ECEEF2" stroke-width="2"/>
  <text x="150" y="90" text-anchor="middle" font-family="'MS Gothic','MS UI Gothic','Osaka-Mono','Roboto Mono','VT323',monospace" font-weight="700" font-size="48" letter-spacing="2" fill="#ECEEF2">eephus<tspan fill="#FFD700">.io</tspan></text>
</svg>
