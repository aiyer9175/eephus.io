# § SURPLUS LEVERS (S1 super-two population blend, S2 positional scarcity) -------
# Both GATED (move served surplus $), both require a real surplus backtest AND an
# owner golden restamp before shipping. `enabled: false` until then.
# docs: docs/surplus-levers/GATES.md.
surplus_levers:
  # S1 (audit B1): a serviced player whose super-two status is genuinely UNKNOWN
  # is currently treated as non-super-two (fraction 0), denying the ~22% population
  # chance he arbs a year early. When enabled, an unknown-status serviced player
  # uses the same population fraction (service_time.super_two.fraction) that a
  # just-debuted player already gets — KNOWN-status players are unchanged.
  super_two_population_blend: false
  # S2 (audit B2): wire the comp-calibrated trade_value.positional_scarcity table
  # into CORE surplus as a WAR-input multiplier. Off by default AND flagged as a
  # modeling hazard: that table was fit on AAV data, which double-counts the
  # positional value WAR already encodes (see the `position:` block comment). Do
  # NOT enable without a clean, non-AAV-confounded re-estimation — this flag exists
  # to carry the wiring as a committed loss, not to ship the AAV-confounded table.
  positional_scarcity_in_core_surplus: false

# § EFV PROVISIONAL PRIOR (P1 — audit B5) --------------------------------------
# For a fresh draftee/IFA with NO MiLB track record yet, efv_score currently
# grades on the CONSENSUS prior ALONE (efv_score.py: the `not row["milb"]` branch),
# discarding the pick_overall / bonus_usd already in-row — so a high-pedigree
# top-pick draftee reads identically to a fringe consensus-FV twin (the
# Cholowsky/Gracia case). This blends the shipped draft-slot first-6 WAR curve
# (storage._pick_slot_expected_war) with the consensus WAR, precision-weighted by
# pedigree (pick tier + log-scale bonus), so a stronger pick/bonus shifts the
# prior toward the slot expectation. Weight is pedigree/(pedigree+base), capped,
# and DECAYS to consensus as pedigree->0. IFA-only (no pick) stays consensus:
# no WAR expectation is invented from a bonus alone.
#
# GATED: moves served draftee eFVs. V1 FAILED its gate 2026-07-23 (committed loss);
# V2 (bounded upward-only pull + bucket-mixture pull baseline, re-registered the same
# day in docs/efv-provisional-prior/GATES.md) PASSED all five clauses on 2026-07-23:
# clause 1 flagship bit-identity IDENTICAL both sides, clauses 2-5 PASS
# (data/xfv_provisional_prior_eval.json). No provisional player is in the flagship
# rank/AUC eval, so it CANNOT harm the flagship metric.
efv_provisional_prior:
  enabled: true
  base_precision: 1.0            # consensus prior's own precision weight
  # pedigree precision from the DRAFT pick tier (mirrors trade_value.prior.pedigree)
  draft_top10_precision: 0.8     # picks 1-10
  draft_round1_precision: 0.4    # picks 11-~30 (round 1)
  draft_round2_precision: 0.15   # picks ~31-~70 (round 2)
  draft_later_precision: 0.05    # later picks - a whisper of pedigree
  round1_last_pick: 30           # overall-pick boundary for round 1
  round2_last_pick: 70           # overall-pick boundary for round 2
  # bonus adds precision on a log scale (each 10x over $10k adds this much)
  bonus_log_scale: 0.5
  bonus_floor_usd: 10000         # denominator floor for log10(bonus/floor)
  max_pedigree_precision: 3.0    # cap so no single draftee is immovable
  # V2 Fix A (GATES.md V2, 2026-07-23): upward-only slot pull, capped. FROZEN at
  # registration, derived from the display grade map's worst-case slope so
  # lam * w_max * cap maps under the 5.0 FV clause-3 bound on BOTH sides
  # (min(1.226/(0.70*0.75), 0.7435/(0.52*0.75)) = 1.906, rounded down). Do NOT
  # retune post-hoc; re-derive + re-register if the grade maps or lambdas move.
  pull_cap_war: 1.9
  # V2 Fix B has no constant: the pull baseline is max(cons_war, TARGET_SEASONS *
  # expected_six_year_avg_war(cons_fv)), the calibrated bucket-mixture expectation.
  # IFA >= $1M step arm (own gate, data/ifa_step_prior_eval.json; wiring STRICTLY
  # conditional on the P1 V2 flip - the enabled flag above gates the whole branch).
  # WIRED 2026-07-23 per the frozen decision rule: P1 V2 passed AND window-basis
  # step diff 1.535 lo95 0.653 > 0 AND first6-basis diff 1.597 lo95 0.71 > 0 AND
  # train direction hi > lo in all 6 LOCO folds (seed 20260723).
  ifa_step_enabled: true
  ifa_step_bonus_usd: 1000000    # frozen boundary (ifa_pedigree ledger's one robust step)
  ifa_step_precision: 0.25       # a priori: below draft round-1 0.4 (bonus = softer info)
  # ifa_step_war = the validation artifact's first6-basis >= $1M mean (the P1 blend
  # axis; includes posted pros, who get pull 0 by construction at their high FVs).
  ifa_step_war: 1.917
  # safety clamp on the blended prior WAR (same rails as the ridge path's -2 floor)
  war_floor: -2.0
  war_ceiling: 20.0

