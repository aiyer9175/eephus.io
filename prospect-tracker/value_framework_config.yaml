  lowtier_dollar_anchor: "Craig Edwards, prospect-valuation series, FanGraphs (2018-19); 40-FV position ~ $2M @ $9M/WAR"
  dollars_per_war: "Ben Clemens, 'What Are Teams Paying For A Win In Free Agency? 2026 Edition', FanGraphs (2026)"
