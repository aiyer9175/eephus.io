      - {url: "/api/v1/draft/prospects/2024", http_status: 200, content_type: application/json, byte_size: 4514429, sample_path: data/sources/samples/draft_prospects_2024_02.json}
    grain: draft_pick          # round, overall, team, pickValue(slot), signingBonus, person
    coverage: {seasons: "picks 1965+; signingBonus+pickValue 2017+ (2016=0/1216, 2017=1214/1215)", n_est: "615-1240 picks/yr"}
    join_key: "person.id (MLBAM) -> spine"
    match_rate_est: 1.0
    robots_txt: "none (statsapi robots 404)"
    tos_url: "http://gdx.mlb.com/components/copyright.txt (MLBAM; non-commercial/non-bulk)"
    legal_risk: low   # same accepted risk as the StatsAPI we already run on
    eng_days_est: 1.0
    scores: {ortho: 2, efv: 3, history: 5, coverage: 5, stability: 5, grain: 2, vintage: 3, freshness: 3}
    weighted_score: 3.54
    score_per_eng_day: 3.54
    notes: >
      Official slot (pickValue) + actual signingBonus fills the matrix's thin draft cover
      (bonus_usd 28%, pick_overall 40%). Absorbs the separate slot-value candidate. eFV
      benefit is gated by the SAME id-resolution wall on the 2011-2016 rows, and pick/bonus
      were flagged noisy in the lean feature sweep -> modest expected lift.

