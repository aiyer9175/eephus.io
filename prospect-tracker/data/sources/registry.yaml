# eFV data-source registry - verified 2026-07-24
# Every endpoint below was hit LIVE this session (curl / urllib), with a recorded
# HTTP status + content-type + byte size and a saved sample payload under
# data/sources/samples/. No endpoint is reconstructed from memory. Scores per the
# runbook rubric (scripts/score_sources.py); ranking metric = weighted_score / eng_days.
# Sample payloads are LOCAL EVIDENCE ONLY (not in the publish allowlist).

meta:
  generated_at: 2026-07-24
  spine: mlbam_id
  already_ingested: [statsapi, milb_history, baseball_savant, fangraphs_csv_manual,
                     tjstats, mlb_pipeline_boards, spotrac, ncaa_college_stats]
  samples_dir: data/sources/samples/

verified:

  - id: tj_surgery_list
    name: Tommy John Surgery List (community DB, @MLBPlayerAnalys)
    url: https://docs.google.com/spreadsheets/d/1gQujXQQGOVNaiuwSN680Hq-FDVsCwvN-3AazykOBON0
    tier: I
    access: public
    method: bulk_download   # google-sheets CSV export
    endpoints:
      - {url: ".../export?format=csv", http_status: 200, content_type: "text/csv", byte_size: 390947, sample_path: data/sources/samples/tj_list_export_01.csv}
    grain: surgery_event      # player x surgery-date
    coverage: {levels: "MLB 694 / College 477 / AA 267 / AAA 262 / A 258 / Rk 238 / A+ 226 / HS 218", seasons: "1974-2026", n_players_est: 2511}
    join_key: "mlbamid (NATIVE) -> spine; 2696/2711 = 99% fill"
    match_rate_est: 0.99
    robots_txt: "docs.google.com Crawl-delay:1; Allow /spreadsheet export path"
    tos_url: "Google ToS; sheet publicly shared by author (donation-supported, intends reuse)"
    legal_risk: low
    eng_days_est: 1.0
    scores: {ortho: 5, efv: 3, history: 5, coverage: 3, stability: 3, grain: 2, vintage: 4, freshness: 3}
    weighted_score: 3.76
    score_per_eng_day: 3.76
    notes: >
      The only deep-history injury source with a native mlbam join. Un-starves the
      2026-07-24 eFV injury-history ledger (which found StatsAPI IL history begins only
      2026-06 -> resolved-cohort coverage ~0). Measured this session: 92 resolved pitcher
      rows gain a pre-decision TJ signal (vs 0 from IL). Conditional signal is REAL
      (z~+2.59 on FV-residual WAR) but survivorship-POSITIVE (post-TJ debutants overperform
      their grade) -> needs a censored full-pool eval before it becomes a risk feature.

  - id: mlb_pipeline_graphql
    name: MLB Pipeline vintage boards (open GraphQL)
    url: https://data-graph.mlb.com/graphql
    tier: C
    access: public          # open, unauthenticated GraphQL (introspection disabled)
    method: json_xhr
    endpoints:
      - {url: "https://data-graph.mlb.com/graphql  (getPlayerRankingsFromSelection slug:sel-pr-2021-top100)", http_status: 200, content_type: application/json, byte_size: 24264, sample_path: data/sources/samples/mlbpipeline_07_vintage2021.json}
      - {url: "https://www.mlb.com/milb/prospects (Apollo SSR Top100)", http_status: 200, content_type: text/html, byte_size: 1620205, sample_path: data/sources/samples/mlbpipeline_03_milbprospects.html}
    grain: player_list_season   # rank + eta + pos + mlbam (tool-grade subfields still lazy/hidden)
    coverage: {lists: "Top100 (live) + team Top30 + draft + intl", seasons: "2011-2026 (appConfig.yearsSupported)", n_players_est: 3000+}
    join_key: "Person.id (MLBAM) -> spine"
    match_rate_est: 0.99
    vintage_available: native   # slug sel-pr-YYYY-top100; 2021 + 2026 verified live
    training_eligible: true
    robots_txt: "mlb.com robots does NOT disallow /prospects or /milb; statsapi robots 404"
    tos_url: "https://www.mlb.com/official-information/terms-of-use"
    legal_risk: ambiguous       # open endpoint but MLBAM ToS + undocumented (could lock)
    eng_days_est: 1.5
    scores: {ortho: 2, efv: 4, history: 5, coverage: 4, stability: 3, grain: 2, vintage: 5, freshness: 4}
    weighted_score: 3.60
    score_per_eng_day: 1.82
    notes: >
      Same GRADES we already ingest, but the new capability is NATIVE POINT-IN-TIME
      VINTAGES 2011-2026 keyed on mlbam. That is what makes historical Pipeline grades
      training-eligible without leakage, and it enables the section-3b grader-calibration
      (fit each outlet's bias/precision vs realized WAR). Methodology = in-person pro
      scouting -> error-independent from FanGraphs' data-blend. Gap: tool-grade subfield
      names (PlayerEntityGrades) hidden by disabled introspection, ~0.5d XHR capture.

  - id: draft_statsapi
