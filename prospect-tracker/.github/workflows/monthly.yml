# Monthly full pipeline — the slow, authoritative refresh: consensus FV and
# per-source grade ingestion, tool grades / scouting evals, Arkmetric
# recomputation (WAG, DvM+, RPS+, SC+, ToolDvM+), farm-system grades, and the
# full ranking recompute. It also captures the monthly metric_snapshots board
# state used by the time-travel board and the backtest. Fast-moving data
# (transactions / IL / roster / debuts / trades) is refreshed daily by
# daily.yml; a monthly run refreshes it too, so the board is never stale after
# this completes.
#
# Shares the `prospx-pipeline` concurrency group with daily.yml so the two
# never overlap and can never double-write the SQLite DB.
name: prospx-monthly

on:
  schedule:
    # 10:00 UTC on the 1st of every month — comfortably after any month-start
    # source list drops have been ingested.
    - cron: "0 10 1 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass HTTP/DB freshness caches (--force)"
        type: boolean
        default: false

concurrency:
  group: prospx-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Same rolling state cache as the daily job (shared key prefix), so the
      # monthly run updates the DB the daily runs have been maintaining rather
      # than starting cold. See daily.yml for the production-DB note.
      - name: Restore pipeline state (DB + HTTP cache)
        uses: actions/cache@v4
        with:
          path: |
            prospects.db
            .cache
          key: prospx-state-${{ github.run_id }}
          restore-keys: |
            prospx-state-

      - name: Run full monthly pipeline
        run: python run_monthly.py ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: Build editorial pages
        run: python build_site.py

      # eephus.io account layer — after grades update, fan out FV-change
      # notifications to users watching moved prospects (Part 5). No-op unless the
      # Supabase secrets are set; the service-role key is server-side only and is
      # never shipped to the browser. Never fails the pipeline.
      - name: FV-change notifications (Supabase)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python forum_notify.py
      # - name: Publish
      #   run: |
      #     # e.g. aws s3 sync . s3://eephus.io --exclude '.git/*' --exclude 'prospects.db'
      #     echo "TODO: wire up your static-host publish step"
