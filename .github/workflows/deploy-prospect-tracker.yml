name: Build & deploy eephus.io

# Nightly data refresh + full-site publish to GitHub Pages.
#
#   - 07:30 UTC daily = 3:30am EDT / 2:30am EST — inside the owner's
#     2-4am ET window, after the MLB transaction wire settles.
#   - The 1st of the month (or a manual run with full=true, or a cold
#     runner with no cached DB) runs the FULL monthly pipeline: grades,
#     Arkmetrics, farm grades, rankings, snapshots. Every other night
#     runs the fast --daily refresh (transactions / IL / roster /
#     debuts / trades + live board captures).
#   - Pushes to main that touch prospect-tracker/ also deploy, so a
#     merged feature is live in minutes.
#
# State: prospects.db + .cache/ persist between runs via actions/cache
# (GitHub evicts after ~7 idle days; the cold-start path then rebuilds
# from sources via the full pipeline). The deploy is gated on pytest.
#
# PRODUCTION NOTE (2026-06-12 audit): eephus.io currently serves a
# STALE single-file build from an nginx box that nothing updates. This
# workflow keeps the GitHub Pages copy complete and current nightly.
# To make eephus.io itself auto-update, either point its DNS at GitHub
# Pages (Settings -> Pages -> custom domain, then enable Pages with
# source "GitHub Actions") or have the nginx host pull the Pages build
# nightly. Both need owner access - neither can be wired from the repo.

on:
  push:
    branches: [main]
    paths:
      - 'prospect-tracker/**'
      - '.github/workflows/deploy-prospect-tracker.yml'
  workflow_dispatch:
    inputs:
      full:
        description: "Run the FULL monthly pipeline (grades, rankings, snapshots)"
        type: boolean
        default: false
  schedule:
    - cron: '30 7 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy in flight; a fresh push supersedes an in-progress build.
concurrency:
  group: pages-prospect-tracker
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: prospect-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: prospect-tracker/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore pipeline state (DB + HTTP cache)
        uses: actions/cache@v4
        with:
          path: |
            prospect-tracker/prospects.db
            prospect-tracker/.cache
          key: prospx-state-${{ github.run_id }}
          restore-keys: |
            prospx-state-

      - name: Run pipeline
        # Full monthly on the 1st, on demand, or on a cold runner (no
        # cached DB); fast --daily refresh otherwise. The pipeline
        # tolerates partial-failure paths (warnings logged, no exit),
        # so one flaky source never kills the nightly deploy.
        run: |
          if [ "${{ inputs.full }}" = "true" ] || [ "$(date -u +%d)" = "01" ] || [ ! -f prospects.db ]; then
            echo "FULL monthly pipeline"
            python run_monthly.py
          else
            echo "daily refresh"
            python run_monthly.py --daily
          fi

      - name: Build editorial pages
        run: python build_site.py

      - name: Gate on the test suite
        # Browser-dependent tests importorskip-skip without playwright;
        # everything else (artifact shapes, registry honesty, export
        # contracts, calibration guards) must be green to publish.
        run: python -m pytest -q

      - name: Stage site for Pages
        # Ship exactly what the browser needs: the page directories,
        # shared assets, and the data sidecars (pitch plots are split
        # per player - the 411MB monolith never ships). Python sources,
        # tests, caches, the DB, and model binaries stay out.
        run: |
          mkdir -p _site
          cp index.html _site/
          for d in articles assets collegesavant fa forums glossary player projections prospx team teams; do
            [ -d "$d" ] && cp -r "$d" "_site/$d"
          done
          mkdir -p _site/data
          find data -maxdepth 1 -name '*.json' -exec cp {} _site/data/ \;
          [ -d data/pitch_plots ] && cp -r data/pitch_plots _site/data/pitch_plots
          du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: prospect-tracker/_site

      - id: deployment
        uses: actions/deploy-pages@v4
